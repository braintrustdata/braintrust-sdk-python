[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "braintrust-audio"
version = "0.1.0"
description = "Optional audio codecs for Braintrust session recordings"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [{name = "Braintrust", email = "sdk@braintrustdata.com"}]
dependencies = ["braintrust>=0.49.1", "av==16.1.0"]

[project.urls]
Homepage = "https://www.braintrust.dev"
Repository = "https://github.com/braintrustdata/braintrust-sdk-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
braintrust_audio = ["py.typed"]
