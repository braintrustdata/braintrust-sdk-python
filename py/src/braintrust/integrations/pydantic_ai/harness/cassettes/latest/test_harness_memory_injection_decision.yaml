      delete what turns out wrong. Never claim something was remembered or saved unless
      you actually called `write_memory` in this turn. A later `<memory>` block for
      this memory supersedes its earlier ones."},{"role":"user","content":"Reply with
      only the saved label from your injected memory. Do not call tools."},{"role":"system","content":"The
      accompanying <memory> was written by the agent in an earlier run, not by the
      user or the application."},{"role":"system","content":"When a user message,
