        data: {"type":"content_block_start","index":2,"content_block":{"type":"mcp_tool_result","tool_use_id":"mcptoolu_011rt2q72XE9QyDXhy39ikRq","is_error":false,"content":[{"type":"text","text":"The
        Braintrust SDK''s primary implementation language is Python.  The core SDK
        code resides in the `src/braintrust` directory within the `py` package.  Contributors
        can run focused tests using `nox` sessions, which are defined in `py/noxfile.py`.
        \n\n## Implementation Language and Directory Structure\n\nThe Braintrust SDK
        is primarily implemented in Python.  The Python package is located in the
        `py/` directory.  Within this package, the main source code for the SDK is
        found in `src/braintrust`. \n\n## Running Focused Tests\n\nTests for the SDK
        are managed using `nox`.  The `noxfile.py` in the `py/` directory defines
        various test sessions. \n\nTo run focused tests, you can use the `nox -s <session_name>`
        command.  For example:\n*   To run core tests that do not require optional
        third-party dependencies, you would use `nox -s test_core`.  This session
        is defined in `py/noxfile.py` and ensures the core package works standalone.
        \n*   To run tests for a specific integration, such as OpenAI, you can specify
        the session and even a particular version, like `nox -s \"test_openai(latest)\"`.  The
        `noxfile.py` defines parameterized sessions for different integrations and
        their versions.  For instance, `test_openai` can be run with various OpenAI
        API versions. \n*   To list all available test sessions, you can run `nox
        -l`. \n\nMany integration tests use `pytest-vcr` to replay recorded HTTP responses.  To
        disable VCR and make live HTTP calls, you can append `--disable-vcr` to your
        nox command, for example: `nox -s \"test_openai(latest)\" -- --disable-vcr`.
        \n\n## Summary\n\nThe Braintrust SDK is written in Python, with its source
        code located in `py/src/braintrust`.  Focused tests are executed using `nox`,
        allowing contributors to target specific components or integrations by specifying
        the session name, such as `nox -s test_core` for core tests or `nox -s \"test_openai(latest)\"`
        for OpenAI integration tests.  \n\n## Notes\n\nThe `Makefile` in the `py/`
        directory also provides convenient targets like `make test-core` which internally
        calls `nox -s test_core`.  The `Development Guide` wiki page provides a comprehensive
        overview of the development workflow, including environment setup and various
        testing commands. \n\nWiki pages you might want to explore:\n- [Development
        Guide (braintrustdata/braintrust-sdk-python)](/wiki/braintrustdata/braintrust-sdk-python#9)\n\nView
        this search on DeepWiki: https://deepwiki.com/search/give-a-detailed-explanation-of_b5dfe40b-06b5-4df0-bc8f-b5ca7aad4e35\n"}]}  }


