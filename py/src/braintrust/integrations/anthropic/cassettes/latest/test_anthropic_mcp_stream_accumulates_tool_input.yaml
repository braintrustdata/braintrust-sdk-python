        data: {"type":"content_block_start","index":2,"content_block":{"type":"mcp_tool_result","tool_use_id":"mcptoolu_01XXX7FGmUhos1iXQRXcH2Bt","is_error":false,"content":[{"type":"text","text":"The
        Braintrust SDK is primarily implemented in Python, located in the `py/src/braintrust`
        directory. Focused tests can be run using `nox` sessions, which allow for
        testing specific components or integrations.\n\n## Primary Implementation
        Language and Directory\nThe Braintrust SDK''s primary implementation language
        is Python . The core source code for the SDK resides in the `py/src/braintrust`
        directory .\n\n## Running Focused Tests\nTests for the SDK are managed using
        `nox` . You can run all tests by navigating to the `py` directory and executing
        `make test` .\n\nTo run focused tests, you can use specific `nox` sessions
        :\n*   **Core Tests**: To run tests that do not require optional third-party
        dependencies, use `nox -s test_core` . This session also verifies that no
        vendor packages are installed, ensuring the core package works standalone
        .\n*   **Specific Integration Tests**: For tests related to particular integrations,
        `nox` provides parameterized sessions. For example, to run tests for the OpenAI
        wrapper using the latest version, you would use `nox -s \"test_openai(latest)\"`
        . Other integrations like Anthropic and Temporal also have dedicated sessions
        .\n*   **Listing Sessions**: You can list all available `nox` sessions with
        `nox -l` .\n*   **Running Tests Against a Wheel**: To test against a built
        wheel instead of the source code, first build the wheel using `make build`
        from the `py` directory, then run `make test-wheel` . This will execute `nox
        -s test_core -- --wheel` .\n\nThe `nox` sessions are defined in `py/noxfile.py`
        . The `_run_tests` function in `py/noxfile.py` handles the execution of `pytest`
        commands, allowing for tests to be run against either the source directory
        or a built wheel .\n\n## Summary\nThe Braintrust SDK is written in Python,
        with its source code located in `py/src/braintrust`  . Contributors can run
        focused tests using `nox` sessions, such as `nox -s test_core` for core functionality
        or `nox -s \"test_openai(latest)\"` for specific integrations  .\n\n## Notes\nThe
        `Development Guide` wiki page provides a comprehensive overview of the development
        workflow, including environment setup, dependency installation, and various
        testing procedures . The `py/CLAUDE.md` file also offers quick commands for
        running tests and managing VCR cassettes .\n\n\nWiki pages you might want
        to explore:\n- [Development Guide (braintrustdata/braintrust-sdk-python)](/wiki/braintrustdata/braintrust-sdk-python#9)\n\nView
        this search on DeepWiki: https://deepwiki.com/search/give-a-detailed-explanation-of_bb67b9d3-f9a7-4755-ae0a-9b087823927d\n"}]}        }


