        data: {"type":"content_block_start","index":2,"content_block":{"type":"mcp_tool_result","tool_use_id":"mcptoolu_01UTS5sbkFKFJPiAn9FoKugG","is_error":false,"content":[{"type":"text","text":"The
        Braintrust SDK''s primary implementation language is Python. The core SDK
        source code resides in the `src/braintrust` directory within the `py` package
        . Contributors can run focused tests using `nox` sessions, which are defined
        in `py/noxfile.py` .\n\n## Implementation Language and Source Directory\n\nThe
        Braintrust SDK is implemented in Python . The main package is located in the
        `py` directory . Within this package, the primary source code for the SDK
        is found in the `src/braintrust` directory . For example, core framework components
        like `Evaluator` and `EvalResultWithSummary` are defined in `py/src/braintrust/framework.py`
        .\n\n## Running Focused Tests\n\nTests for the SDK are managed using `nox`
        . The `noxfile.py`  defines various test sessions.\n\nTo run focused tests,
        you can use the `nox -s <session_name>` command . Here are some examples:\n\n*   **Core
        tests**: To run tests that do not require optional third-party dependencies,
        use `nox -s test_core` . This session specifically verifies that no vendor
        packages are installed, ensuring the core package works standalone .\n*   **OpenAI
        wrapper tests**: To run tests for the OpenAI integration, you can specify
        a particular version or run all versions. For the latest version, use `nox
        -s \"test_openai(latest)\"` . To run all parametrized versions, use `nox -s
        test_openai` . These tests are defined in `py/noxfile.py` .\n*   **Anthropic
        wrapper tests**: Similar to OpenAI, you can run `nox -s \"test_anthropic(latest)\"`
        for the latest version or `nox -s test_anthropic` for all versions . The versions
        tested are defined in `py/noxfile.py` .\n*   **Temporal integration tests**:
        Use `nox -s \"test_temporal(latest)\"` for the latest version or `nox -s test_temporal`
        for all versions . The `TEMPORAL_VERSIONS` are defined in `py/noxfile.py`
        .\n\nYou can list all available `nox` sessions using `nox -l` .\n\nFor tests
        that use VCR (Video Cassette Recorder) to replay HTTP responses, you can disable
        VCR and make live HTTP calls by adding `-- --disable-vcr` to the `nox` command
        . For example: `nox -s \"test_openai(latest)\" -- --disable-vcr` .\n\n## Summary\n\nThe
        Braintrust SDK is written in Python, with its source code located in `py/src/braintrust`
        . Contributors can run focused tests using the `nox` command-line tool, specifying
        the desired test session with `nox -s <session_name>` .\n## Notes\nThe provided
        context primarily focuses on the Python SDK. There is no indication of other
        primary implementation languages for the SDK. The `integrations/adk-py/pyproject.toml`
        file mentions a deprecated `braintrust-adk` package , but clarifies that the
        Google ADK integration is now included in the main `braintrust` package .\n\nWiki
        pages you might want to explore:\n- [Development Guide (braintrustdata/braintrust-sdk-python)](/wiki/braintrustdata/braintrust-sdk-python#9)\n\nView
        this search on DeepWiki: https://deepwiki.com/search/give-a-detailed-explanation-of_1357ebf0-4195-459f-8ca7-3d4fc2738d19\n"}]}            }


