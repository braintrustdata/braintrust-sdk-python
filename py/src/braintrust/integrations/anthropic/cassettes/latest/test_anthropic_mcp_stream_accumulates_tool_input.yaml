        data: {"type":"content_block_start","index":2,"content_block":{"type":"mcp_tool_result","tool_use_id":"mcptoolu_01NaJTSLXhmAGabAxQ8nvpNG","is_error":false,"content":[{"type":"text","text":"The
        SDK''s primary implementation language is Python. The core package and source
        code are located in the `py/src/braintrust` directory. Contributors can run
        focused tests using `nox` commands, often invoked via `make` targets, to test
        specific components or integrations.\n\n## Implementation Language and Source
        Directory\n\nThe Braintrust SDK is primarily implemented in Python.  The main
        source code for the SDK resides in the `src/braintrust` directory within the
        `py` subdirectory of the repository.  For example, the `setup.py` file specifies
        `package_dir={\"\": \"src\"}` and `packages=setuptools.find_packages(where=\"src\")`,
        indicating that the Python packages are found under the `src` directory. \n\n##
        Running Focused Tests\n\nTests for the SDK are managed using `nox`.  The `nox.options.default_venv_backend`
        is set to `\"uv\"` for faster virtual environment creation. \n\nTo run focused
        tests, you can use `nox` directly or through `make` targets defined in `py/Makefile`.
        \n\n### Common `nox` Commands for Focused Tests\n\n*   **Listing all available
        sessions**: You can see all defined test sessions by running `nox -l`. \n*   **Running
        a specific session**: To run tests for a particular integration or component,
        use `nox -s <session_name>`.  For example, `nox -s \"test_openai(latest)\"`
        runs tests for the OpenAI wrapper using the latest version of the OpenAI library.
        \n*   **Running core tests**: The `test_core` session runs all tests that
        do not require optional third-party dependencies.  This can be invoked via
        `nox -s test_core`  or `make test-core` from the `py` directory. \n*   **Running
        tests with specific arguments**: You can pass additional arguments to `pytest`
        through `nox` by using `--`.  For instance, `nox -s \"test_openai(latest)\"
        -- -k \"test_chat_metrics\"` runs a specific test function within the `test_openai`
        session. \n*   **Disabling VCR**: Many integration tests use `pytest-vcr`
        to replay recorded HTTP responses. To make live HTTP calls, you can add `--disable-vcr`
        to your `nox` command, like `nox -s \"test_openai(latest)\" -- --disable-vcr`.
        \n\n### `Makefile` Targets for Testing\n\nThe `py/Makefile` provides convenient
        targets for running tests:\n\n*   `make test`: Runs all `nox` sessions. \n*   `make
        test-core`: Runs the `test_core` `nox` session. \n*   `make test-wheel`: Runs
        core tests against a built wheel, which is useful for verifying the build
        artifact. \n\n## Summary\n\nThe Braintrust SDK is written in Python, with
        its source code located in `py/src/braintrust`.  Contributors can run focused
        tests using the `nox` test runner, either by directly invoking `nox -s <session_name>`
        or by using `make` targets like `make test-core` from the `py` directory.
        \n\n## Notes\n\nThe `Development Guide` wiki page provides a comprehensive
        overview of the contributor workflow, including environment setup, dependency
        installation, and various testing procedures.  The `py/CLAUDE.md` file also
        contains useful information regarding running tests and VCR cassettes. \n\nWiki
        pages you might want to explore:\n- [Development Guide (braintrustdata/braintrust-sdk-python)](/wiki/braintrustdata/braintrust-sdk-python#9)\n\nView
        this search on DeepWiki: https://deepwiki.com/search/give-a-detailed-explanation-of_9e5285a6-f3a6-461c-9a96-75f41bb0c497\n"}]}         }


