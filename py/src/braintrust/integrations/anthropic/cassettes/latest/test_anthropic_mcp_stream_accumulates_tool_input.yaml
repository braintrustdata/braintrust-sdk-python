        data: {"type":"content_block_start","index":2,"content_block":{"type":"mcp_tool_result","tool_use_id":"mcptoolu_01RUkrJ2vptxWjW6MkXdfWnn","is_error":false,"content":[{"type":"text","text":"The
        Braintrust SDK''s primary implementation language is Python. The Python package
        is located in the `py/` directory, with its source code residing in `py/src/braintrust/`  .
        Contributors can run focused tests using `nox` sessions, which are defined
        in `py/noxfile.py` .\n\n## Implementation Language and Directory Structure\n\nThe
        Braintrust SDK is implemented in Python . The main Python package is found
        within the `py/` directory of the repository . The importable source code
        for the `braintrust` package is specifically located at `py/src/braintrust/`
        .\n\n## Running Focused Tests\n\nTests for the SDK are managed using `nox`
        . The `noxfile.py`  in the `py/` directory defines various test sessions .\n\nTo
        run all `nox` sessions, you can navigate to the `py/` directory and execute
        `make test` . This is equivalent to running `nox -x` .\n\nTo run a specific
        test session, you can use the `nox -s <session_name>` command . For example:\n*   `nox
        -s test_core` runs all tests that do not require optional third-party dependencies  .\n*   `nox
        -s \"test_openai(latest)\"` runs tests specifically for the OpenAI wrapper
        using the latest version .\n*   `nox -s \"test_anthropic(latest)\"` runs tests
        for the Anthropic wrapper using the latest version .\n\nYou can list all available
        `nox` sessions by running `nox -l` .\n\nMany integration tests utilize `pytest-vcr`
        to replay recorded HTTP responses . To disable VCR and make live HTTP calls,
        you can append `--disable-vcr` to your `nox` command, for example: `nox -s
        \"test_openai(latest)\" -- --disable-vcr` .\n\n## Summary\n\nThe Braintrust
        SDK is a Python-based library with its source code located in `py/src/braintrust/`
        . Contributors can run focused tests using `nox` sessions defined in `py/noxfile.py`
        . Specific sessions can be targeted with `nox -s <session_name>`, and VCR
        can be disabled for live API calls using `--disable-vcr` .\n\n## Notes\n\nThe
        `Makefile` in the root directory  and the `py/Makefile`  provide convenient
        `make` targets that wrap `nox` commands for common testing and development
        workflows. For instance, `make test` from the `py/` directory executes `nox
        -x` .\n\nWiki pages you might want to explore:\n- [Overview (braintrustdata/braintrust-sdk-python)](/wiki/braintrustdata/braintrust-sdk-python#1)\n-
        [Development Guide (braintrustdata/braintrust-sdk-python)](/wiki/braintrustdata/braintrust-sdk-python#9)\n\nView
        this search on DeepWiki: https://deepwiki.com/search/give-a-detailed-explanation-of_e7d70861-6c6b-4f8c-89dd-9955ed2f82a2\n"}]}           }


