        data: {"type":"content_block_start","index":2,"content_block":{"type":"mcp_tool_result","tool_use_id":"mcptoolu_0184pWNfsp5hTf2hrK9cJQDp","is_error":false,"content":[{"type":"text","text":"The
        SDK''s primary implementation language is Python . The core package and its
        source code reside in the `py/src/braintrust` directory . Contributors can
        run focused tests using `nox` sessions, often invoked via `make` commands
        from the `py/` directory .\n\n## Implementation Language and Package Structure\n\nThe
        Braintrust SDK is implemented in Python . The main Python package is named
        `braintrust` , and its source code is located within the `py/src/braintrust`
        directory . The `setup.py` file in the `py/` directory defines the package
        metadata, dependencies, and entry points .\n\n## Running Focused Tests\n\nTests
        for the SDK are managed using `nox` . The `noxfile.py` in the `py/` directory
        defines various test sessions .\n\nTo run focused tests, a contributor would
        typically navigate to the `py/` directory and use `make` commands or directly
        invoke `nox` .\n\nHere are some common ways to run focused tests:\n\n*   **Running
        all core tests:**\n    ```bash\n    cd py && make test-core\n    ```\n    This
        command executes the `test_core` nox session, which runs all tests that do
        not require optional third-party dependencies  .\n\n*   **Running tests for
        a specific integration (e.g., OpenAI wrapper):**\n    ```bash\n    nox -s
        \"test_openai(latest)\"\n    ```\n    This command runs the `test_openai`
        session for the latest OpenAI version . Other versions can be specified, as
        defined in `py/noxfile.py` .\n\n*   **Running a single test within a session:**\n    ```bash\n    nox
        -s \"test_openai(latest)\" -- -k \"test_chat_metrics\"\n    ```\n    This
        allows running a specific test function, such as `test_chat_metrics`, within
        the `test_openai(latest)` session .\n\n*   **Disabling VCR (for live API calls):**\n    ```bash\n    nox
        -s \"test_openai(latest)\" -- --disable-vcr\n    ```\n    Many integration
        tests use `pytest-vcr` to replay recorded HTTP responses. Adding `--disable-vcr`
        makes the tests perform live HTTP calls .\n\nThe `_run_tests` function in
        `py/noxfile.py` handles the execution of tests, including logic for running
        against source code or a built wheel, and managing VCR options .\n\n## Summary\n\nThe
        Braintrust SDK is primarily written in Python, with its source code located
        in `py/src/braintrust` . Contributors can run focused tests using `nox` sessions,
        which are often invoked through `make` commands like `make test-core` for
        core tests or `nox -s \"test_openai(latest)\"` for specific integration tests  .\n\n##
        Notes\n\nThe `Makefile` in the root directory also contains some test targets,
        but these often delegate to the `py/Makefile` or `nox` for Python-specific
        testing  . The `Development Guide` wiki page provides a comprehensive overview
        of the development workflow, including environment setup and testing procedures
        .\n\nWiki pages you might want to explore:\n- [Development Guide (braintrustdata/braintrust-sdk-python)](/wiki/braintrustdata/braintrust-sdk-python#9)\n\nView
        this search on DeepWiki: https://deepwiki.com/search/give-a-detailed-explanation-of_fc75d529-271b-47b0-9fba-f9dafbb3b7c7\n"}]}
        }


