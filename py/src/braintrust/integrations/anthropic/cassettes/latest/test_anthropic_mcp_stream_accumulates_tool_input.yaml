        data: {"type":"content_block_start","index":2,"content_block":{"type":"mcp_tool_result","tool_use_id":"mcptoolu_01A882rXT4XDjb89PRrytrmw","is_error":false,"content":[{"type":"text","text":"The
        SDK''s primary implementation language is Python, and its source code resides
        in the `py/src/braintrust` directory. You can run focused tests using `nox`
        commands, often orchestrated through `make` targets defined in `py/Makefile`.   \n\n##
        Implementation Language and Source Directory\n\nThe Braintrust SDK is primarily
        implemented in Python.  The main package is named `braintrust`, and its source
        code is located in the `py/src/braintrust` directory within the repository.
        \n\n## Running Focused Tests\n\nTests for the Python SDK are managed using
        `nox`, which is configured in `py/noxfile.py`.  `nox` uses `uv` as its default
        virtual environment backend for faster operations. \n\nTo run focused tests,
        you can use the `nox` command directly or leverage `make` targets defined
        in `py/Makefile`.  \n\n### Common Test Commands\n\n*   **Run all tests:**
        Navigate to the `py` directory and run `make test`.  This executes all `nox`
        sessions. \n*   **Run core tests only:** Use `make test-core` from the `py`
        directory.  This corresponds to the `nox -s test_core` command.  The `test_core`
        session runs tests that do not require optional third-party dependencies.
        \n*   **Run a specific `nox` session:** You can specify a session using `nox
        -s <session_name>`.  For example, to run the latest OpenAI wrapper tests,
        you would use `nox -s \"test_openai(latest)\"`. \n*   **Run a single test
        within a session:** You can filter tests using `pytest`''s `-k` flag.  For
        instance, `nox -s \"test_openai(latest)\" -- -k \"test_chat_metrics\"` will
        run only the `test_chat_metrics` test within the `test_openai(latest)` session.
        \n\n### Test Execution Details\n\nThe `_run_tests` function in `py/noxfile.py`
        handles the actual execution of `pytest` commands.  It supports running tests
        against the source code or a built wheel, and can disable VCR (Video Cassette
        Recorder) for live HTTP calls. \n\n## Summary\n\nThe Braintrust SDK is a Python
        package located in `py/src/braintrust`.  Contributors can run focused tests
        using `nox` sessions, which are often invoked via `make` targets like `make
        test-core` or by directly calling `nox -s <session_name>`.  \n\n## Notes\n\nThe
        `py/CLAUDE.md` file provides a concise overview of the development workflow,
        including test commands, which is highly relevant to the user''s query.  The
        `Development Guide` wiki page also details the testing process and `nox` sessions.
        \n\nWiki pages you might want to explore:\n- [Development Guide (braintrustdata/braintrust-sdk-python)](/wiki/braintrustdata/braintrust-sdk-python#9)\n\nView
        this search on DeepWiki: https://deepwiki.com/search/give-a-detailed-explanation-of_419fcb25-94a5-4d96-a882-4ee877b2b74e\n"}]}         }


