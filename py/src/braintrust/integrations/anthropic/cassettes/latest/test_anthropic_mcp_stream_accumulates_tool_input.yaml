        data: {"type":"content_block_start","index":2,"content_block":{"type":"mcp_tool_result","tool_use_id":"mcptoolu_01JhXQ4o5SmxQF6FrvD7gRV2","is_error":false,"content":[{"type":"text","text":"The
        SDK discussed here is the Python SDK: its distribution package is named `braintrust`,
        and its implementation lives under `py/src/braintrust`. You can run only the
        core tests with `make test-core` from `py`, or target a specific integration
        or test with the `nox` commands described below. \n\n## Language and package\n\n`py/setup.py`
        identifies the project as the `braintrust` SDK and declares Python 3 as its
        language, with Python 3.10 or later required. Setuptools maps packages from
        the `src` directory, so the package source is in `py/src/braintrust` (for
        example, `framework.py` imports other Python modules in that package). \n\n##
        Running focused tests\n\nFrom the `py` directory, `make test-core` runs the
        `test_core` Nox session; that session installs test dependencies and runs
        core tests, excluding wrapper, contrib, and devserver directories. \n\nFor
        a specific integration, list sessions with `nox -l`, then run the relevant
        session, such as `nox -s \"test_openai(latest)\"`. To focus further on one
        pytest test, pass `-k`, for example: `nox -s \"test_openai(latest)\" -- -k
        \"test_chat_metrics\"`. \n\n## Summary\n\nThe SDK is implemented in Python,
        distributed as `braintrust`, and sourced from `py/src/braintrust`; use `make
        test-core` for focused core coverage, or a targeted Nox session with `-k`
        for a specific integration test. \n\n## Notes\n\n`make test` runs all Nox
        sessions, while `make test-core` is the narrower core-test target. \n\nWiki
        pages you might want to explore:\n- [Development Guide (braintrustdata/braintrust-sdk-python)](/wiki/braintrustdata/braintrust-sdk-python#9)\n\nView
        this search on DeepWiki: https://deepwiki.com/search/60c5c5e1-4e3d-416c-9e7b-a1692a2d66ab\n"}]}   }


