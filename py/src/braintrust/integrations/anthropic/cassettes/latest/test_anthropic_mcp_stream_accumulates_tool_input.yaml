        data: {"type":"content_block_start","index":2,"content_block":{"type":"mcp_tool_result","tool_use_id":"mcptoolu_01KxUUGYHZLZnsYYVb828mEk","is_error":false,"content":[{"type":"text","text":"The
        Braintrust SDK is primarily implemented in Python. Its core package and source
        code reside in the `py/src/braintrust` directory. Contributors can run focused
        tests using `nox` sessions, often invoked via `make` commands, which allow
        for testing specific integrations or core functionalities.\n\n## Primary Implementation
        Language\nThe Braintrust SDK''s primary implementation language is Python
        . This is evident from the `Programming Language :: Python :: 3` classifier
        in the `py/setup.py` file , and the extensive use of Python-specific tools
        like `pip`, `uv`, and `nox` for development and testing   .\n\n## Package
        and Source Directory\nThe main Python package for the SDK is named `braintrust`
        . Its source code is located in the `py/src/braintrust` directory . The `setup.py`
        file specifies `package_dir={\"\": \"src\"}` and `packages=setuptools.find_packages(where=\"src\")`,
        indicating that the `braintrust` package is found within the `src` directory
        .\n\n## Running Focused Tests\nContributors can run focused tests using `nox`
        sessions . The `noxfile.py` defines various sessions for different test targets
        .\n\nTo run all tests, navigate to the `py` directory and use `make test`
        . This command executes `nox -x`, which runs all defined `nox` sessions .\n\nFor
        focused testing, you can specify a particular `nox` session:\n*   **Core tests**:
        To run tests that do not require optional third-party dependencies, use `nox
        -s test_core` . This session is defined in `py/noxfile.py` .\n*   **Specific
        integration tests**: For integrations like OpenAI, you can run `nox -s \"test_openai(latest)\"`
        to test the latest version of the OpenAI wrapper . Other integrations like
        Anthropic and Temporal also have dedicated `nox` sessions .\n*   **Listing
        all sessions**: To see all available `nox` sessions, run `nox -l` .\n\nTests
        can also be run against a built wheel instead of the source code by first
        building the wheel with `make build` and then running `make test-wheel`  .
        The `test-wheel` target uses `nox -s test_core -- --wheel` .\n\n## Summary\nThe
        Braintrust SDK is written in Python, with its source code located in `py/src/braintrust`
        . Contributors can run focused tests using `nox` sessions, which are often
        invoked through `make` commands like `make test` for all tests or `nox -s
        test_core` for core functionalities .\n\n## Notes\nThe `Makefile` in the root
        directory and `py/Makefile` provide convenient aliases for running `nox` commands  .
        The `Development Guide` wiki page offers a comprehensive overview of the development
        workflow, including environment setup and testing procedures .\n\nWiki pages
        you might want to explore:\n- [Development Guide (braintrustdata/braintrust-sdk-python)](/wiki/braintrustdata/braintrust-sdk-python#9)\n\nView
        this search on DeepWiki: https://deepwiki.com/search/give-a-detailed-explanation-of_9f023773-91ca-4f2e-9187-cf45f9ce3f60\n"}]}       }


