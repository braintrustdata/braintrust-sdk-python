        data: {"type":"content_block_start","index":2,"content_block":{"type":"mcp_tool_result","tool_use_id":"mcptoolu_017Q4TdwaaFDWGRPNM3r6PAp","is_error":false,"content":[{"type":"text","text":"The
        Braintrust SDK is primarily implemented in Python. The core SDK source code
        resides in the `src/braintrust` directory within the `py` package . Contributors
        can run focused tests using `nox` sessions, which are defined in `py/noxfile.py`
        .\n\n## Implementation Language and Source Directory\n\nThe Braintrust SDK''s
        primary implementation language is Python . The main package is named `braintrust`
        , and its source code is located in the `src/braintrust` directory within
        the `py` subdirectory of the repository .\n\n## Running Focused Tests\n\nTests
        for the SDK are managed using `nox` . The `nox` configurations are defined
        in `py/noxfile.py` .\n\nTo run focused tests, you can use the `nox -s <session_name>`
        command . For example:\n*   To run only the core tests, which do not require
        optional third-party dependencies, you would use `nox -s test_core` . This
        session is defined in `py/noxfile.py`  and runs tests in the `src/braintrust/`
        directory, ignoring wrapper, contrib, and devserver paths .\n*   To run tests
        for a specific integration, such as OpenAI, you can specify the session and
        even a particular version. For instance, `nox -s \"test_openai(latest)\"`
        will run tests for the latest OpenAI version . The `test_openai` session is
        parameterized to test against multiple OpenAI versions .\n*   To list all
        available test sessions, you can run `nox -l` .\n\nMany integration tests
        utilize `pytest-vcr` to replay recorded HTTP responses . You can disable VCR
        and make live HTTP calls by adding `-- --disable-vcr` to your `nox` command,
        for example: `nox -s \"test_openai(latest)\" -- --disable-vcr` .\n\n## Summary\n\nThe
        Braintrust SDK is written in Python, with its source code located in `py/src/braintrust`
        . Focused tests are executed using `nox` sessions defined in `py/noxfile.py`
        , allowing contributors to target specific test suites like `test_core` or
        integration-specific tests such as `test_openai(latest)` .\n\n## Notes\nThe
        `integrations/langchain-py/pyproject.toml` file  also mentions `braintrust`
        as a dependency, indicating that it''s an integration built on top of the
        core SDK, rather than the SDK itself. The `py/CLAUDE.md` file  provides a
        quick reference for running tests and VCR commands, which is consistent with
        the `noxfile.py` and `Makefile` instructions.\n\nWiki pages you might want
        to explore:\n- [Development Guide (braintrustdata/braintrust-sdk-python)](/wiki/braintrustdata/braintrust-sdk-python#9)\n\nView
        this search on DeepWiki: https://deepwiki.com/search/give-a-detailed-explanation-of_e522c0c3-92a2-406c-b819-15d20da00b26\n"}]}}


