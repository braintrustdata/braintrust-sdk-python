        data: {"type":"content_block_start","index":2,"content_block":{"type":"mcp_tool_result","tool_use_id":"mcptoolu_016ZX9G3DmSdE6Ao53B73H2j","is_error":false,"content":[{"type":"text","text":"The
        Braintrust SDK is primarily implemented in Python . The main Python package
        is located in the `py/src/braintrust` directory . Contributors can run focused
        tests using `nox` sessions, which are defined in `py/noxfile.py` .\n\n## Implementation
        Language and Package Structure\n\nThe Braintrust SDK is written in Python,
        specifically targeting Python 3.10 and above . The core SDK source code resides
        in the `py/src/braintrust` directory . This directory contains various modules
        such as `framework.py` , `cli/eval.py` , and `wrappers/claude_agent_sdk/_wrapper.py`
        .\n\n## Running Focused Tests\n\nTests for the SDK are managed using `nox`
        . The `noxfile.py`  defines various test sessions.\n\nTo run focused tests,
        you can use the `nox -s <session_name>` command . For example:\n*   To run
        core tests that do not require optional third-party dependencies, you can
        use `nox -s test_core` . This session is defined in `py/noxfile.py` .\n*   To
        run tests for a specific integration, such as OpenAI, you can specify the
        session and even a particular version, e.g., `nox -s \"test_openai(latest)\"`
        . The `test_openai` session is parameterized to test against different OpenAI
        API versions .\n*   Similarly, for Anthropic integration tests, you can use
        `nox -s \"test_anthropic(latest)\"` . The `test_anthropic` session is defined
        in `py/noxfile.py` .\n\nYou can list all available test sessions using `nox
        -l` .\n\nMany integration tests utilize `pytest-vcr` to replay recorded HTTP
        responses . To disable VCR and make live HTTP calls, you can add the `--disable-vcr`
        flag, for example: `nox -s \"test_openai(latest)\" -- --disable-vcr` .\n\n##
        Summary\n\nThe Braintrust SDK is implemented in Python, with its source code
        located in `py/src/braintrust` . Focused tests are executed using `nox` sessions
        defined in `py/noxfile.py` , allowing contributors to run specific test suites
        or integration tests with various dependency versions.\n\n## Notes\nThe `Makefile`
        in the root directory  and the `py/Makefile`  also provide convenient `make`
        targets like `make test`  or `make test-core`  which internally call the `nox`
        commands.\n\nWiki pages you might want to explore:\n- [Development Guide (braintrustdata/braintrust-sdk-python)](/wiki/braintrustdata/braintrust-sdk-python#9)\n\nView
        this search on DeepWiki: https://deepwiki.com/search/give-a-detailed-explanation-of_32dc9318-11fa-4872-8cb3-d36068627744\n"}]}       }


