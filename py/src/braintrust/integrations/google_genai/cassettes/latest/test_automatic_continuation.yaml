        $g_i$ by $g_i^{m_i}$ (since $D(g_i^{m_i}) = D(g_i)$) and $a_i$ by $c_i a_i$,
        we may assume that on each $D(g_i)$, $s$ is represented by $a_i / g_i$.\\n\\nNow,
        since $D(f)$ is quasi-compact (Lemma 3.1.4(4)), finitely many of the $D(g_i)$
        cover $D(f)$:\\n$$D(f) \\\\subseteq D(g_1) \\\\cup \\\\dots \\\\cup D(g_r).$$\\nOn
        each overlap $D(g_i) \\\\cap D(g_j) = D(g_i g_j)$, the two sections $\\\\psi(a_i/g_i)$
        and $\\\\psi(a_j/g_j)$ agree with $s|_{D(g_i g_j)}$. Applying the injectivity
        of $\\\\psi$ on the open set $D(g_i g_j)$ (which is already proven!), we deduce
