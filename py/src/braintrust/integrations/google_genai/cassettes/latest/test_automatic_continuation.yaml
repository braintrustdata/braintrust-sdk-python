        if and only if $a \\\\in \\\\mathfrak{p}$. Motivated by our construction of
        sheafification in Theorem 2.2.1, we define the structure sheaf $\\\\mathcal{O}_{\\\\operatorname{Spec}
        A}$ directly in terms of localizations.\\n\\n**Definition 3.2.1.** Let $A$
        be a ring and $X = \\\\operatorname{Spec} A$. For each open subset $U \\\\subseteq
        X$, we define $\\\\mathcal{O}_X(U)$ to be the set of all functions\\n$$s:
        U \\\\longrightarrow \\\\bigsqcup_{\\\\mathfrak{p} \\\\in U} A_{\\\\mathfrak{p}}$$\\nsuch
        that:\\n1. $s(\\\\mathfrak{p}) \\\\in A_{\\\\mathfrak{p}}$ for every $\\\\mathfrak{p}
        \\\\in U$, and\\n2. $s$ is *locally a quotient of elements of $A$*: for every
        $\\\\mathfrak{p} \\\\in U$, there exists an open neighborhood $V \\\\subseteq
        U$ of $\\\\mathfrak{p}$ and elements $a, f \\\\in A$ such that for every $\\\\mathfrak{q}
        \\\\in V$, we have $f \\\\notin \\\\mathfrak{q}$ (so $V \\\\subseteq D(f)$)
        and $s(\\\\mathfrak{q}) = a/f$ in $A_{\\\\mathfrak{q}}$.\\n\\nPointwise addition
        and multiplication in the rings $A_{\\\\mathfrak{p}}$ endow $\\\\mathcal{O}_X(U)$
        with the structure of a commutative ring with identity, and restriction of
        functions makes $\\\\mathcal{O}_X$ a sheaf of rings on $X = \\\\operatorname{Spec}
        A$.\\n\\nWe now prove the fundamental theorem calculating the stalks and sections
        of $\\\\mathcal{O}_{\\\\operatorname{Spec} A}$.\\n\\n**Theorem 3.2.2.** *Let
        $A$ be a ring and $X = \\\\operatorname{Spec} A$ with structure sheaf $\\\\mathcal{O}_X$.*\\n1.
        *For every prime ideal $\\\\mathfrak{p} \\\\in X$, the stalk $\\\\mathcal{O}_{X,
        \\\\mathfrak{p}}$ is canonically isomorphic to the local ring $A_{\\\\mathfrak{p}}$.
        Consequently, $(X, \\\\mathcal{O}_X)$ is a locally ringed space.*\\n2. *For
