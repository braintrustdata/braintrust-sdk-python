        \\\\longrightarrow H^n(X, \\\\mathcal{O}_X(-n-1)) \\\\cong A$$\\n   *is a
        perfect pairing of finitely generated free $A$-modules (so $H^n(X, \\\\mathcal{O}_X(m))
        = 0$ for $m \\u003e -n-1$, and is free of rank $\\\\binom{-m-1}{n}$ for $m
