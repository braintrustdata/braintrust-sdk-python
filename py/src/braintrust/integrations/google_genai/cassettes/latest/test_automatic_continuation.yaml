        $\\\\Gamma(X, \\\\mathcal{O}_X) = \\\\mathcal{O}_X(\\\\operatorname{Spec}
        A) \\\\cong A$.\\n\\n*Proof.* (1) For a fixed $\\\\mathfrak{p} \\\\in X$,
        define a ring homomorphism $\\\\varphi_\\\\mathfrak{p}: \\\\mathcal{O}_{X,
