        \\\\in \\\\sqrt{\\\\sum_{j \\\\in J} (g_j)}$, which means $V((f)) \\\\supseteq
        \\\\bigcap_{j \\\\in J} V((g_j))$, or $D(f) \\\\subseteq \\\\bigcup_{j \\\\in
        J} D(g_j)$. $\\\\blacksquare$\\n\\n---\\n\\n### 3.2 The Structure Sheaf on
        $\\\\operatorname{Spec} A$\\n\\nLet $A$ be a ring and $X = \\\\operatorname{Spec}
        A$. For each prime ideal $\\\\mathfrak{p} \\\\in X$, we have the local ring
        $A_{\\\\mathfrak{p}}$, obtained by localizing $A$ at the multiplicative system
        $A \\\\setminus \\\\mathfrak{p}$. Notice how an element $a \\\\in A$ can be
