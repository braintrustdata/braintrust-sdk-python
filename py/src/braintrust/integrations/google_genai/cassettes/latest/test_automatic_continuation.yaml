        H^{i-1}(X, \\\\mathcal{Q}) = 0$ for $i \\\\ge 2$ by induction on $i$. $\\\\blacksquare$\\n\\n---\\n\\n###
        5.2 \u010Cech Cohomology and Cohomology of Affine and Projective Spaces\\n\\nInjective
        resolutions are massive and non-constructive. On schemes, we compute cohomology
        concretely using *\u010Cech cohomology* with respect to an affine open cover.\\n\\n**Definition
        5.2.1.** Let $X$ be a topological space, $\\\\mathcal{F}$ a sheaf of abelian
        groups on $X$, and $\\\\mathfrak{U} = \\\\{U_i\\\\}_{i \\\\in I}$ an open
        cover of $X$, where the index set $I$ is given a fixed total ordering. For
        each integer $p \\\\ge 0$ and each $(p+1)$-tuple of indices $i_0, i_1, \\\\dots,
        i_p \\\\in I$, let $U_{i_0 \\\\dots i_p} = U_{i_0} \\\\cap U_{i_1} \\\\cap
        \\\\dots \\\\cap U_{i_p}$. We define the *$p$-th \u010Cech cochain group*
        $\\\\check{C}^p(\\\\mathfrak{U}, \\\\mathcal{F})$ to be\\n$$\\\\check{C}^p(\\\\mathfrak{U},
        \\\\mathcal{F}) = \\\\prod_{i_0 \\u003c i_1 \\u003c \\\\dots \\u003c i_p}
        \\\\mathcal{F}(U_{i_0 i_1 \\\\dots i_p}).$$\\nThe *coboundary homomorphism*
        $d^p: \\\\check{C}^p(\\\\mathfrak{U}, \\\\mathcal{F}) \\\\to \\\\check{C}^{p+1}(\\\\mathfrak{U},
        \\\\mathcal{F})$ is defined for any $\\\\alpha \\\\in \\\\check{C}^p(\\\\mathfrak{U},
        \\\\mathcal{F})$ by the alternating sum formula\\n$$(d^p\\\\alpha)_{i_0, i_1,
        \\\\dots, i_{p+1}} = \\\\sum_{k=0}^{p+1} (-1)^k \\\\alpha_{i_0, \\\\dots,
        \\\\hat{i}_k, \\\\dots, i_{p+1}} \\\\big|_{U_{i_0 \\\\dots i_{p+1}}},$$\\nwhere
        $\\\\hat{i}_k$ indicates that the index $i_k$ is omitted. A standard combinatorial
        cancellation verifies that $d^{p+1} \\\\circ d^p = 0$. The *$p$-th \u010Cech
        cohomology group* of $\\\\mathcal{F}$ with respect to $\\\\mathfrak{U}$ is
        defined to be\\n$$\\\\check{H}^p(\\\\mathfrak{U}, \\\\mathcal{F}) = \\\\frac{\\\\ker(d^p)}{\\\\operatorname{im}(d^{p-1})}.$$\\n\\nBy
        the sheaf axiom for $\\\\mathcal{F}$, $\\\\check{H}^0(\\\\mathfrak{U}, \\\\mathcal{F})
        = \\\\ker(d^0) = \\\\Gamma(X, \\\\mathcal{F})$. Moreover, if $\\\\mathcal{F}$
        is a flasque sheaf, then $\\\\check{H}^p(\\\\mathfrak{U}, \\\\mathcal{F})
        = 0$ for all $p \\\\ge 1$ (because the sheaf version of the \u010Cech complex
        $0 \\\\to \\\\mathcal{F} \\\\to \\\\mathcal{C}^0(\\\\mathfrak{U}, \\\\mathcal{F})
        \\\\to \\\\mathcal{C}^1(\\\\mathfrak{U}, \\\\mathcal{F}) \\\\to \\\\dots$,
        where $\\\\mathcal{C}^p = \\\\prod (j_{i_0 \\\\dots i_p})_*(\\\\mathcal{F}|_{U_{i_0
