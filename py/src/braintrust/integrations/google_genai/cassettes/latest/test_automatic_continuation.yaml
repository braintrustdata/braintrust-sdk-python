        [\n          {\n            \"text\": \"# Foundations of Algebraic Geometry\\n\\n---\\n\\n##
        Chapter 1: Classical Algebraic Geometry\\n\\nThroughout this chapter, unless
        otherwise specified, $k$ denotes an algebraically closed field.\\n\\n### 1.1
        Affine Varieties and the Nullstellensatz\\n\\n**Definition 1.1.1.** *Affine
        $n$-space* over $k$, denoted $\\\\mathbb{A}^n_k$ or simply $\\\\mathbb{A}^n$,
        is the set of all $n$-tuples of elements of $k$, $P = (a_1, \\\\dots, a_n)$
        with $a_i \\\\in k$. Let $A = k[x_1, \\\\dots, x_n]$ be the polynomial ring
        in $n$ variables over $k$. Elements of $A$ are viewed as functions $\\\\mathbb{A}^n
        \\\\to k$ via evaluation: $f(P) = f(a_1, \\\\dots, a_n)$. For any subset $T
        \\\\subseteq A$, the *zero locus* of $T$ is defined as\\n$$Z(T) = \\\\{ P
        \\\\in \\\\mathbb{A}^n \\\\mid f(P) = 0 \\\\text{ for all } f \\\\in T \\\\}.$$\\nA
        subset $Y \\\\subseteq \\\\mathbb{A}^n$ is called an *algebraic set* if there
        exists a subset $T \\\\subseteq A$ such that $Y = Z(T)$.\\n\\n**Lemma 1.1.2.**
        *The algebraic sets of $\\\\mathbb{A}^n$ satisfy the following properties:*\\n1.
        *If $\\\\mathfrak{a}$ is the ideal generated by $T$, then $Z(T) = Z(\\\\mathfrak{a})$.*\\n2.
        *$Z(0) = \\\\mathbb{A}^n$ and $Z(1) = \\\\emptyset$.*\\n3. *If $\\\\mathfrak{a}
        \\\\subseteq \\\\mathfrak{b}$ are ideals in $A$, then $Z(\\\\mathfrak{a})
        \\\\supseteq Z(\\\\mathfrak{b})$.*\\n4. *For any two ideals $\\\\mathfrak{a},
        \\\\mathfrak{b} \\\\subseteq A$, $Z(\\\\mathfrak{a}) \\\\cup Z(\\\\mathfrak{b})
        = Z(\\\\mathfrak{a}\\\\mathfrak{b}) = Z(\\\\mathfrak{a} \\\\cap \\\\mathfrak{b})$.*\\n5.
        *For any family of ideals $\\\\{\\\\mathfrak{a}_i\\\\}_{i \\\\in I}$, $\\\\bigcap_{i
        \\\\in I} Z(\\\\mathfrak{a}_i) = Z\\\\left(\\\\sum_{i \\\\in I} \\\\mathfrak{a}_i\\\\right)$.*\\n\\n*Proof.*
        \\n(1) Clearly $T \\\\subseteq \\\\mathfrak{a}$ implies $Z(\\\\mathfrak{a})
        \\\\subseteq Z(T)$. Conversely, any $f \\\\in \\\\mathfrak{a}$ can be written
        as $f = \\\\sum_{i=1}^m g_i f_i$ with $g_i \\\\in A$ and $f_i \\\\in T$. If
        $P \\\\in Z(T)$, then $f_i(P) = 0$ for all $i$, so $f(P) = 0$, giving $Z(T)
        \\\\subseteq Z(\\\\mathfrak{a})$.\\n\\n(2) The zero polynomial vanishes everywhere,
        and the constant polynomial $1$ vanishes nowhere.\\n\\n(3) Immediate from
        the definition.\\n\\n(4) Since $\\\\mathfrak{a}\\\\mathfrak{b} \\\\subseteq
        \\\\mathfrak{a} \\\\cap \\\\mathfrak{b} \\\\subseteq \\\\mathfrak{a}, \\\\mathfrak{b}$,
        property (3) gives $Z(\\\\mathfrak{a}) \\\\cup Z(\\\\mathfrak{b}) \\\\subseteq
        Z(\\\\mathfrak{a} \\\\cap \\\\mathfrak{b}) \\\\subseteq Z(\\\\mathfrak{a}\\\\mathfrak{b})$.
        Suppose $P \\\\in Z(\\\\mathfrak{a}\\\\mathfrak{b})$ and $P \\\\notin Z(\\\\mathfrak{a})$.
        Then there exists $f \\\\in \\\\mathfrak{a}$ such that $f(P) \\\\neq 0$. For
        any $g \\\\in \\\\mathfrak{b}$, we have $fg \\\\in \\\\mathfrak{a}\\\\mathfrak{b}$,
        so $(fg)(P) = f(P)g(P) = 0$. Since $k$ is a field and $f(P) \\\\neq 0$, we
        must have $g(P) = 0$. Thus $P \\\\in Z(\\\\mathfrak{b})$, proving $Z(\\\\mathfrak{a}\\\\mathfrak{b})
        \\\\subseteq Z(\\\\mathfrak{a}) \\\\cup Z(\\\\mathfrak{b})$.\\n\\n(5) A point
        $P$ lies in $\\\\bigcap_{i \\\\in I} Z(\\\\mathfrak{a}_i)$ if and only if
        $f(P) = 0$ for all $f \\\\in \\\\bigcup_{i \\\\in I} \\\\mathfrak{a}_i$. By
        (1), this is equivalent to $P \\\\in Z\\\\left(\\\\sum_{i \\\\in I} \\\\mathfrak{a}_i\\\\right)$.
        $\\\\blacksquare$\\n\\n**Definition 1.1.3.** The *Zariski topology* on $\\\\mathbb{A}^n$
        is the topology whose closed subsets are the algebraic sets. A non-empty topological
        space $X$ is *irreducible* if it cannot be written as $X = X_1 \\\\cup X_2$,
        where $X_1, X_2$ are proper closed subsets of $X$. An *affine algebraic variety*
        (or simply *affine variety*) is an irreducible closed subset of $\\\\mathbb{A}^n$,
        endowed with the induced topology. An open subset of an affine variety is
        called a *quasi-affine variety*.\\n\\nTo link the geometry of $\\\\mathbb{A}^n$
        to the algebra of $A = k[x_1, \\\\dots, x_n]$, we define the inverse operation
        to $Z$. For any subset $Y \\\\subseteq \\\\mathbb{A}^n$, define the *ideal
        of $Y$* in $A$ by\\n$$I(Y) = \\\\{ f \\\\in A \\\\mid f(P) = 0 \\\\text{ for
        all } P \\\\in Y \\\\}.$$\\n\\nTo establish the fundamental correspondence
        between ideals and algebraic sets, we require the Noether Normalization Lemma.\\n\\n**Theorem
        1.1.4 (Noether Normalization Lemma).** *Let $k$ be an arbitrary field and
        $B$ a finitely generated $k$-algebra. Then there exist elements $y_1, \\\\dots,
        y_d \\\\in B$ that are algebraically independent over $k$ such that $B$ is
        a finitely generated module over the polynomial subring $k[y_1, \\\\dots,
        y_d]$ (i.e., $B$ is integral over $k[y_1, \\\\dots, y_d]$).*\\n\\n*Proof.*
        Let $B = k[x_1, \\\\dots, x_n]$ be generated as a $k$-algebra by $n$ elements.
        We proceed by induction on $n$. If $x_1, \\\\dots, x_n$ are algebraically
        independent over $k$, we take $d = n$ and $y_i = x_i$; there is nothing to
        prove.\\n\\nSuppose $x_1, \\\\dots, x_n$ are algebraically dependent. Then
        there is a non-zero polynomial $F(T_1, \\\\dots, T_n) \\\\in k[T_1, \\\\dots,
        T_n]$ such that $F(x_1, \\\\dots, x_n) = 0$. Write $F = \\\\sum_{\\\\nu} c_\\\\nu
        T_1^{\\\\nu_1} \\\\cdots T_n^{\\\\nu_n}$ where $\\\\nu = (\\\\nu_1, \\\\dots,
        \\\\nu_n) \\\\in \\\\mathbb{Z}_{\\\\ge 0}^n$ and $c_\\\\nu \\\\in k \\\\setminus
        \\\\{0\\\\}$.\\n\\nLet $r \\u003e 0$ be an integer strictly greater than $\\\\max_{\\\\nu,
        i} \\\\{\\\\nu_i\\\\}$. Define new elements $z_1, \\\\dots, z_{n-1} \\\\in
        B$ by setting\\n$$z_i = x_i - x_n^{r^i} \\\\quad \\\\text{for } 1 \\\\le i
        \\\\le n-1.$$\\nSubstituting $x_i = z_i + x_n^{r^i}$ into $F(x_1, \\\\dots,
        x_n) = 0$, we obtain the relation\\n$$F(z_1 + x_n^r, z_2 + x_n^{r^2}, \\\\dots,
        z_{n-1} + x_n^{r^{n-1}}, x_n) = 0.$$\\nExpand each monomial term $c_\\\\nu
        (z_1 + x_n^r)^{\\\\nu_1} \\\\cdots (z_{n-1} + x_n^{r^{n-1}})^{\\\\nu_{n-1}}
        x_n^{\\\\nu_n}$. The pure power of $x_n$ contributed by the index $\\\\nu$
        is $x_n^{e(\\\\nu)}$, where\\n$$e(\\\\nu) = \\\\nu_n + \\\\nu_1 r + \\\\nu_2
        r^2 + \\\\dots + \\\\nu_{n-1} r^{n-1}.$$\\nSince $0 \\\\le \\\\nu_i \\u003c
        r$ for all $i$, the integer $e(\\\\nu)$ has the unique base-$r$ expansion
        $(\\\\nu_{n-1}\\\\dots\\\\nu_1\\\\nu_n)_r$. Consequently, for distinct multi-indices
        $\\\\nu \\\\neq \\\\nu'$, we have $e(\\\\nu) \\\\neq e(\\\\nu')$. Let $\\\\nu^*$
        be the unique multi-index maximizing $e(\\\\nu)$, and set $N = e(\\\\nu^*)$.
        Expanding the polynomial completely in powers of $x_n$ with coefficients in
        $B' = k[z_1, \\\\dots, z_{n-1}]$, the highest power of $x_n$ is $x_n^N$, and
        it appears with the non-zero scalar coefficient $c_{\\\\nu^*} \\\\in k^\\\\times$.
        Dividing by $c_{\\\\nu^*}$, we obtain a monic polynomial equation for $x_n$
        over $B'$:\\n$$x_n^N + g_1(z_1, \\\\dots, z_{n-1}) x_n^{N-1} + \\\\dots +
        g_N(z_1, \\\\dots, z_{n-1}) = 0.$$\\nThus $x_n$ is integral over $B'$. Since
        each $x_i = z_i + x_n^{r^i}$ is in $B'[x_n]$, the ring $B$ is generated over
        $B'$ by $x_n$, so $B$ is a finitely generated $B'$-module.\\n\\nBy the induction
        hypothesis applied to $B' = k[z_1, \\\\dots, z_{n-1}]$, there exist algebraically
        independent elements $y_1, \\\\dots, y_d \\\\in B'$ such that $B'$ is a finitely
        generated $k[y_1, \\\\dots, y_d]$-module. By transitivity of finite module
        generation, $B$ is a finitely generated $k[y_1, \\\\dots, y_d]$-module. $\\\\blacksquare$\\n\\n**Corollary
        1.1.5 (Zariski's Lemma).** *Let $k$ be a field and $L$ a finitely generated
        $k$-algebra. If $L$ is a field, then $L$ is a finite algebraic extension of
        $k$.*\\n\\n*Proof.* By Theorem 1.1.4, there exist algebraically independent
        elements $y_1, \\\\dots, y_d \\\\in L$ such that $L$ is integral over $R =
        k[y_1, \\\\dots, y_d]$. We claim $d = 0$. Suppose $d \\\\ge 1$. Since $L$
        is a field and is integral over the integral domain $R$, $R$ must also be
        a field. To see this, let $a \\\\in R \\\\setminus \\\\{0\\\\}$. Then $a^{-1}
        \\\\in L$ is integral over $R$, so there exists an equation\\n$$(a^{-1})^m
        + r_{m-1}(a^{-1})^{m-1} + \\\\dots + r_1 a^{-1} + r_0 = 0$$\\nwith $r_i \\\\in
        R$. Multiplying by $a^{m-1}$ yields $a^{-1} = -(r_{m-1} + r_{m-2}a + \\\\dots
        + r_0 a^{m-1}) \\\\in R$. Thus $R$ is a field. However, $R = k[y_1, \\\\dots,
        y_d]$ is a polynomial ring in $d \\\\ge 1$ variables, in which $y_1$ has no
        multiplicative inverse, a contradiction. Hence $d = 0$, and $L$ is a finitely
        generated $k$-module, meaning $[L : k] \\u003c \\\\infty$. $\\\\blacksquare$\\n\\n**Theorem
        1.1.6 (Hilbert's Nullstellensatz).** *Let $k$ be an algebraically closed field,
        and let $\\\\mathfrak{a}$ be an ideal in $A = k[x_1, \\\\dots, x_n]$. Then:*\\n1.
        *(Weak Nullstellensatz) Every maximal ideal $\\\\mathfrak{m}$ of $A$ is of
        the form $\\\\mathfrak{m} = (x_1 - a_1, \\\\dots, x_n - a_n)$ for some $P
        = (a_1, \\\\dots, a_n) \\\\in \\\\mathbb{A}^n$. In particular, if $\\\\mathfrak{a}$
        is a proper ideal of $A$, then $Z(\\\\mathfrak{a}) \\\\neq \\\\emptyset$.*\\n2.
        *(Strong Nullstellensatz) $I(Z(\\\\mathfrak{a})) = \\\\sqrt{\\\\mathfrak{a}}$,
        where $\\\\sqrt{\\\\mathfrak{a}} = \\\\{f \\\\in A \\\\mid f^r \\\\in \\\\mathfrak{a}
        \\\\text{ for some } r \\\\ge 1\\\\}$ is the radical of $\\\\mathfrak{a}$.*\\n\\n*Proof.*
        \\n(1) Let $\\\\mathfrak{m} \\\\subset A$ be a maximal ideal. Then $L = A/\\\\mathfrak{m}$
        is a field, finitely generated as a $k$-algebra by the images $\\\\bar{x}_1,
        \\\\dots, \\\\bar{x}_n$. By Corollary 1.1.5, $L$ is a finite algebraic extension
        of $k$. Since $k$ is algebraically closed, the natural inclusion $k \\\\hookrightarrow
        L$ is an isomorphism. Let $a_i \\\\in k$ be the preimage of $\\\\bar{x}_i
        \\\\in L$. Then $x_i - a_i \\\\in \\\\mathfrak{m}$ for all $1 \\\\le i \\\\le
        n$. Thus the ideal $\\\\mathfrak{m}_P = (x_1 - a_1, \\\\dots, x_n - a_n)$
        is contained in $\\\\mathfrak{m}$. Since $A/\\\\mathfrak{m}_P \\\\cong k$,
        $\\\\mathfrak{m}_P$ is already a maximal ideal, so $\\\\mathfrak{m} = \\\\mathfrak{m}_P$.\\n\\nIf
        $\\\\mathfrak{a}$ is a proper ideal, it is contained in some maximal ideal
        $\\\\mathfrak{m} = (x_1 - a_1, \\\\dots, x_n - a_n)$. Then $P = (a_1, \\\\dots,
        a_n) \\\\in Z(\\\\mathfrak{m}) \\\\subseteq Z(\\\\mathfrak{a})$, so $Z(\\\\mathfrak{a})
        \\\\neq \\\\emptyset$.\\n\\n(2) Clearly $\\\\sqrt{\\\\mathfrak{a}} \\\\subseteq
        I(Z(\\\\mathfrak{a}))$, because if $f^r \\\\in \\\\mathfrak{a}$, then $f(P)^r
        = 0$ for all $P \\\\in Z(\\\\mathfrak{a})$, which implies $f(P) = 0$.\\n\\nConversely,
        let $f \\\\in I(Z(\\\\mathfrak{a}))$, and assume $f \\\\neq 0$. We use Rabinowitsch's
        trick. Consider the polynomial ring in $n+1$ variables $A[x_{n+1}] = k[x_1,
        \\\\dots, x_n, x_{n+1}]$. By the Hilbert Basis Theorem, $\\\\mathfrak{a}$
        is finitely generated, say $\\\\mathfrak{a} = (g_1, \\\\dots, g_m)$. Let $\\\\mathfrak{b}$
        be the ideal in $A[x_{n+1}]$ generated by $g_1, \\\\dots, g_m$ and $1 - x_{n+1}f(x_1,
        \\\\dots, x_n)$.\\n\\nSuppose $Q = (a_1, \\\\dots, a_n, a_{n+1}) \\\\in Z(\\\\mathfrak{b})
        \\\\subseteq \\\\mathbb{A}^{n+1}$. Then $g_i(a_1, \\\\dots, a_n) = 0$ for
        all $1 \\\\le i \\\\le m$, so $P = (a_1, \\\\dots, a_n) \\\\in Z(\\\\mathfrak{a})$.
        Since $f \\\\in I(Z(\\\\mathfrak{a}))$, we have $f(P) = 0$. However, $Q \\\\in
        Z(\\\\mathfrak{b})$ also requires $1 - a_{n+1}f(P) = 0$, which reduces to
        $1 = 0$, a contradiction. Therefore, $Z(\\\\mathfrak{b}) = \\\\emptyset$.\\n\\nBy
        the Weak Nullstellensatz applied to $A[x_{n+1}]$, $\\\\mathfrak{b}$ cannot
        be a proper ideal, so $1 \\\\in \\\\mathfrak{b}$. Thus there exist polynomials
        $h_1, \\\\dots, h_m, h_{m+1} \\\\in k[x_1, \\\\dots, x_{n+1}]$ such that\\n$$1
        = \\\\sum_{i=1}^m h_i(x_1, \\\\dots, x_{n+1}) g_i(x_1, \\\\dots, x_n) + h_{m+1}(x_1,
        \\\\dots, x_{n+1})(1 - x_{n+1}f(x_1, \\\\dots, x_n)).$$\\nWorking in the localized
        ring $A_f = k[x_1, \\\\dots, x_n, f^{-1}]$, we apply the $A$-algebra homomorphism
        $A[x_{n+1}] \\\\to A_f$ sending $x_{n+1} \\\\mapsto f^{-1}$. The term $1 -
        x_{n+1}f$ maps to $0$, yielding\\n$$1 = \\\\sum_{i=1}^m h_i(x_1, \\\\dots,
        x_n, f^{-1}) g_i(x_1, \\\\dots, x_n)$$\\nin $A_f$. Clearing denominators by
        multiplying both sides by $f^r$ for a sufficiently large integer $r \\\\ge
        1$ (specifically, $r$ at least the maximum degree of $x_{n+1}$ appearing in
        the $h_i$), we obtain\\n$$f^r = \\\\sum_{i=1}^m H_i(x_1, \\\\dots, x_n) g_i(x_1,
        \\\\dots, x_n) \\\\in \\\\mathfrak{a}$$\\nfor some $H_i \\\\in A$. Hence $f
        \\\\in \\\\sqrt{\\\\mathfrak{a}}$. $\\\\blacksquare$\\n\\n**Proposition 1.1.7.**
        *The maps $Y \\\\mapsto I(Y)$ and $\\\\mathfrak{a} \\\\mapsto Z(\\\\mathfrak{a})$
        induce an inclusion-reversing bijection between the set of algebraic subsets
        of $\\\\mathbb{A}^n$ and the set of radical ideals of $A = k[x_1, \\\\dots,
        x_n]$. Furthermore, under this bijection, an algebraic set $Y$ is irreducible
        (hence an affine variety) if and only if $I(Y)$ is a prime ideal.*\\n\\n*Proof.*
        For any algebraic set $Y = Z(\\\\mathfrak{b})$, we have $Z(I(Y)) = Z(I(Z(\\\\mathfrak{b})))
        = Z(\\\\mathfrak{b}) = Y$. For any radical ideal $\\\\mathfrak{a}$, Theorem
        1.1.6 gives $I(Z(\\\\mathfrak{a})) = \\\\sqrt{\\\\mathfrak{a}} = \\\\mathfrak{a}$.
        Thus the maps are mutually inverse bijections.\\n\\nNow let $Y$ be irreducible,
        and suppose $fg \\\\in I(Y)$. Then $Y \\\\subseteq Z(fg) = Z(f) \\\\cup Z(g)$.
        Consequently, $Y = (Y \\\\cap Z(f)) \\\\cup (Y \\\\cap Z(g))$. Since $Y$ is
        irreducible and $Y \\\\cap Z(f), Y \\\\cap Z(g)$ are closed in $Y$, we must
        have $Y = Y \\\\cap Z(f)$ or $Y = Y \\\\cap Z(g)$. Thus $Y \\\\subseteq Z(f)$
        or $Y \\\\subseteq Z(g)$, meaning $f \\\\in I(Y)$ or $g \\\\in I(Y)$. Hence
        $I(Y)$ is prime.\\n\\nConversely, suppose $\\\\mathfrak{p} = I(Y)$ is prime,
        and write $Y = Y_1 \\\\cup Y_2$ with $Y_1, Y_2$ closed. Then $\\\\mathfrak{p}
        = I(Y_1 \\\\cup Y_2) = I(Y_1) \\\\cap I(Y_2)$. Since $\\\\mathfrak{p}$ is
        prime, if $I(Y_1) \\\\not\\\\subseteq \\\\mathfrak{p}$, there exists $f \\\\in
        I(Y_1) \\\\setminus \\\\mathfrak{p}$; then for any $g \\\\in I(Y_2)$, $fg
        \\\\in I(Y_1) \\\\cap I(Y_2) = \\\\mathfrak{p}$, forcing $g \\\\in \\\\mathfrak{p}$.
        Thus $I(Y_2) \\\\subseteq \\\\mathfrak{p}$, so $I(Y_2) = \\\\mathfrak{p}$,
        which yields $Y_2 = Z(I(Y_2)) = Z(\\\\mathfrak{p}) = Y$. Therefore $Y$ is
        irreducible. $\\\\blacksquare$\\n\\n---\\n\\n### 1.2 Coordinate Rings and
        Topological Properties\\n\\n**Definition 1.2.1.** Let $Y \\\\subseteq \\\\mathbb{A}^n$
        be an algebraic set. The *affine coordinate ring* of $Y$ is defined as\\n$$A(Y)
        = k[x_1, \\\\dots, x_n] / I(Y).$$\\nIf $Y$ is an affine variety, $I(Y)$ is
        a prime ideal, so $A(Y)$ is a finitely generated $k$-algebra that is an integral
        domain. If $Y$ is merely an algebraic set, $I(Y)$ is a radical ideal, so $A(Y)$
        is a finitely generated *reduced* $k$-algebra (it contains no non-zero nilpotent
        elements).\\n\\n**Definition 1.2.2.** A topological space $X$ is *Noetherian*
        if it satisfies the descending chain condition for closed subsets: for any
        sequence $Y_1 \\\\supseteq Y_2 \\\\supseteq Y_3 \\\\supseteq \\\\dots$ of
        closed subsets of $X$, there is an integer $r$ such that $Y_r = Y_{r+1} =
        \\\\dots$.\\n\\n**Proposition 1.2.3.** *In a Noetherian topological space
        $X$, every non-empty closed subset $Y$ can be expressed uniquely as a finite
        union $Y = Y_1 \\\\cup \\\\dots \\\\cup Y_r$ of irreducible closed subsets
        such that $Y_i \\\\not\\\\subseteq Y_j$ for $i \\\\neq j$. The $Y_i$ are called
        the irreducible components of $Y$.*\\n\\n*Proof.* Let $\\\\mathcal{S}$ be
        the set of non-empty closed subsets of $X$ that cannot be written as a finite
        union of irreducible closed subsets. Suppose $\\\\mathcal{S} \\\\neq \\\\emptyset$.
        Since $X$ is Noetherian, $\\\\mathcal{S}$ has a minimal element $Z$. Since
        $Z \\\\in \\\\mathcal{S}$, $Z$ is not irreducible, so $Z = Z' \\\\cup Z''$
        for proper closed subsets $Z', Z'' \\\\subsetneq Z$. By minimality of $Z$,
        $Z', Z'' \\\\notin \\\\mathcal{S}$, so both are finite unions of irreducible
        closed subsets. Then $Z = Z' \\\\cup Z''$ is also a finite union of irreducible
        closed subsets, a contradiction. Thus $\\\\mathcal{S} = \\\\emptyset$.\\n\\nGiven
        $Y = Y_1 \\\\cup \\\\dots \\\\cup Y_r$ with $Y_i$ irreducible, we can discard
        any $Y_i$ contained in some $Y_j$ ($j \\\\neq i$) to achieve $Y_i \\\\not\\\\subseteq
        Y_j$. To show uniqueness, suppose $Y = Y_1' \\\\cup \\\\dots \\\\cup Y_s'$
        is another such decomposition. Then for each $i$, $Y_i = Y_i \\\\cap Y = \\\\bigcup_{j=1}^s
        (Y_i \\\\cap Y_j')$. Since $Y_i$ is irreducible, $Y_i = Y_i \\\\cap Y_j'$,
        so $Y_i \\\\subseteq Y_j'$ for some $j$. By symmetry, $Y_j' \\\\subseteq Y_l$
        for some $l$. Then $Y_i \\\\subseteq Y_j' \\\\subseteq Y_l$, which forces
        $i = l$ and $Y_i = Y_j'$. Thus the two decompositions are identical up to
        permutation. $\\\\blacksquare$\\n\\n**Corollary 1.2.4.** *$\\\\mathbb{A}^n$
        is a Noetherian topological space, and every algebraic set is a unique irredundant
        finite union of affine varieties.*\\n\\n*Proof.* A descending chain $Y_1 \\\\supseteq
        Y_2 \\\\supseteq \\\\dots$ of algebraic sets corresponds to an ascending chain
        $I(Y_1) \\\\subseteq I(Y_2) \\\\subseteq \\\\dots$ of ideals in $k[x_1, \\\\dots,
        x_n]$. Since $k[x_1, \\\\dots, x_n]$ is a Noetherian ring by the Hilbert Basis
        Theorem, this chain stabilizes. $\\\\blacksquare$\\n\\n---\\n\\n### 1.3 Projective
        Varieties\\n\\n**Definition 1.3.1.** *Projective $n$-space* over $k$, denoted
        $\\\\mathbb{P}^n_k$ or $\\\\mathbb{P}^n$, is the quotient set $(\\\\mathbb{A}^{n+1}_k
        \\\\setminus \\\\{(0, \\\\dots, 0)\\\\}) / \\\\sim$, where $(a_0, \\\\dots,
        a_n) \\\\sim (\\\\lambda a_0, \\\\dots, \\\\lambda a_n)$ for all $\\\\lambda
        \\\\in k^\\\\times$. The equivalence class of $(a_0, \\\\dots, a_n)$ is denoted
        $[a_0 : \\\\dots : a_n]$ and called the *homogeneous coordinates* of the point.\\n\\nLet
        $S = k[x_0, \\\\dots, x_n]$. We grade $S$ by total degree: $S = \\\\bigoplus_{d
        \\\\ge 0} S_d$, where $S_d$ is the $k$-vector space of homogeneous polynomials
        of degree $d$. If $f \\\\in S_d$, then $f(\\\\lambda a_0, \\\\dots, \\\\lambda
        a_n) = \\\\lambda^d f(a_0, \\\\dots, a_n)$. Thus the condition $f(P) = 0$
        is well-defined for $P \\\\in \\\\mathbb{P}^n$.\\n\\nAn ideal $\\\\mathfrak{a}
        \\\\subseteq S$ is *homogeneous* if $\\\\mathfrak{a} = \\\\bigoplus_{d \\\\ge
        0} (\\\\mathfrak{a} \\\\cap S_d)$, or equivalently, if $\\\\mathfrak{a}$ is
        generated by homogeneous polynomials. For any subset $T \\\\subseteq \\\\bigcup_{d
        \\\\ge 0} S_d$ of homogeneous elements, we define\\n$$Z_+(T) = \\\\{ P \\\\in
        \\\\mathbb{P}^n \\\\mid f(P) = 0 \\\\text{ for all } f \\\\in T \\\\}.$$\\nSubsets
        of $\\\\mathbb{P}^n$ of the form $Z_+(T)$ are called *projective algebraic
        sets*. They form the closed sets of the *Zariski topology* on $\\\\mathbb{P}^n$.
        An irreducible projective algebraic set is a *projective variety*, and an
        open subset of a projective variety is a *quasi-projective variety*.\\n\\nFor
        any subset $Y \\\\subseteq \\\\mathbb{P}^n$, the *homogeneous ideal of $Y$*,
        denoted $I_+(Y)$, is the ideal in $S$ generated by $\\\\{f \\\\in S \\\\text{
        homogeneous} \\\\mid f(P) = 0 \\\\text{ for all } P \\\\in Y\\\\}$.\\n\\n**Definition
        1.3.2.** The *irrelevant maximal ideal* of $S$ is the homogeneous ideal $S_+
        = \\\\bigoplus_{d \\u003e 0} S_d = (x_0, \\\\dots, x_n)$.\\n\\n**Theorem 1.3.3
        (Projective Nullstellensatz).** *Let $\\\\mathfrak{a} \\\\subsetneq S$ be
        a homogeneous ideal.*\\n1. *$Z_+(\\\\mathfrak{a}) = \\\\emptyset$ if and only
        if $S_+ \\\\subseteq \\\\sqrt{\\\\mathfrak{a}}$ (equivalently, $S_d \\\\subseteq
        \\\\mathfrak{a}$ for all $d \\\\gg 0$).*\\n2. *If $Z_+(\\\\mathfrak{a}) \\\\neq
        \\\\emptyset$, then $I_+(Z_+(\\\\mathfrak{a})) = \\\\sqrt{\\\\mathfrak{a}}$.*\\n\\n*Proof.*
        Let $\\\\pi : \\\\mathbb{A}^{n+1} \\\\setminus \\\\{0\\\\} \\\\to \\\\mathbb{P}^n$
        be the canonical projection. For any homogeneous ideal $\\\\mathfrak{a}$,
        define the *affine cone* $C(\\\\mathfrak{a}) = Z(\\\\mathfrak{a}) \\\\subseteq
        \\\\mathbb{A}^{n+1}$. Notice that $Z_+(\\\\mathfrak{a}) = \\\\emptyset$ if
        and only if $C(\\\\mathfrak{a}) \\\\subseteq \\\\{(0, \\\\dots, 0)\\\\}$.\\n\\n(1)
        By the Affine Nullstellensatz (Theorem 1.1.6), $C(\\\\mathfrak{a}) \\\\subseteq
        \\\\{(0, \\\\dots, 0)\\\\}$ if and only if $I(\\\\{(0, \\\\dots, 0)\\\\})
        \\\\subseteq I(C(\\\\mathfrak{a})) = \\\\sqrt{\\\\mathfrak{a}}$. Since $I(\\\\{(0,
        \\\\dots, 0)\\\\}) = (x_0, \\\\dots, x_n) = S_+$, the first equivalence follows.
        Since $S_+$ is finitely generated by $x_0, \\\\dots, x_n$, $S_+ \\\\subseteq
        \\\\sqrt{\\\\mathfrak{a}}$ implies $x_i^m \\\\in \\\\mathfrak{a}$ for some
        $m$, so $S_d \\\\subseteq \\\\mathfrak{a}$ for all $d \\\\ge (n+1)m$.\\n\\n(2)
        Suppose $Z_+(\\\\mathfrak{a}) \\\\neq \\\\emptyset$. Then $C(\\\\mathfrak{a})
        = \\\\pi^{-1}(Z_+(\\\\mathfrak{a})) \\\\cup \\\\{0\\\\}$. Let $f \\\\in S_d$
        be a homogeneous polynomial of degree $d \\\\ge 1$. Then $f \\\\in I_+(Z_+(\\\\mathfrak{a}))$
        if and only if $f$ vanishes on $\\\\pi^{-1}(Z_+(\\\\mathfrak{a}))$. Since
        $d \\\\ge 1$, $f(0) = 0$ automatically, so $f \\\\in I_+(Z_+(\\\\mathfrak{a}))$
        if and only if $f \\\\in I(C(\\\\mathfrak{a})) = I(Z(\\\\mathfrak{a})) = \\\\sqrt{\\\\mathfrak{a}}$.
        Since both $I_+(Z_+(\\\\mathfrak{a}))$ and $\\\\sqrt{\\\\mathfrak{a}}$ are
        homogeneous ideals and cannot contain non-zero constants (as $Z_+(\\\\mathfrak{a})
        \\\\neq \\\\emptyset$), they have the same homogeneous elements in all degrees
        $d \\\\ge 0$, hence are equal. $\\\\blacksquare$\\n\\n**Proposition 1.3.4.**
        *For each $0 \\\\le i \\\\le n$, let $U_i = \\\\mathbb{P}^n \\\\setminus Z_+(x_i)
        = \\\\{[a_0 : \\\\dots : a_n] \\\\in \\\\mathbb{P}^n \\\\mid a_i \\\\neq 0\\\\}$.
        Then $U_i$ is an open subset of $\\\\mathbb{P}^n$, and the map $\\\\phi_i
        : U_i \\\\to \\\\mathbb{A}^n$ given by*\\n$$\\\\phi_i([a_0 : \\\\dots : a_n])
        = \\\\left(\\\\frac{a_0}{a_i}, \\\\dots, \\\\frac{a_{i-1}}{a_i}, \\\\frac{a_{i+1}}{a_i},
        \\\\dots, \\\\frac{a_n}{a_i}\\\\right)$$\\n*is a homeomorphism.*\\n\\n*Proof.*
        Without loss of generality, let $i = 0$. The map $\\\\phi_0 : U_0 \\\\to \\\\mathbb{A}^n$
        has an explicit inverse $\\\\psi_0 : \\\\mathbb{A}^n \\\\to U_0$ given by
        $(b_1, \\\\dots, b_n) \\\\mapsto [1 : b_1 : \\\\dots : b_n]$, so $\\\\phi_0$
        is a bijection. Let $A = k[y_1, \\\\dots, y_n]$ be the coordinate ring of
        $\\\\mathbb{A}^n$, where $y_j = x_j/x_0$. \\n\\nDefine the dehomogenization
        map $\\\\alpha : S \\\\to A$ by $f(x_0, \\\\dots, x_n) \\\\mapsto f(1, y_1,
        \\\\dots, y_n)$. Conversely, for $g \\\\in A$ of degree $d$, define its homogenization
        $\\\\beta(g) = x_0^d g(x_1/x_0, \\\\dots, x_n/x_0) \\\\in S_d$. For any homogeneous
        polynomial $f \\\\in S_d$ and $P = [1 : b_1 : \\\\dots : b_n] \\\\in U_0$,
        we have $f(1, b_1, \\\\dots, b_n) = \\\\alpha(f)(\\\\phi_0(P))$. Thus $\\\\phi_0(Z_+(T)
        \\\\cap U_0) = Z(\\\\alpha(T))$ for any set of homogeneous polynomials $T$,
        showing $\\\\phi_0$ is a closed map. Similarly, for any ideal $\\\\mathfrak{b}
        \\\\subseteq A$, $\\\\psi_0(Z(\\\\mathfrak{b})) = Z_+(\\\\beta(\\\\mathfrak{b}))
        \\\\cap U_0$, showing $\\\\psi_0$ is a closed map. Hence $\\\\phi_0$ is a
        homeomorphism. $\\\\blacksquare$\\n\\n---\\n\\n### 1.4 Morphisms, Rational
        Maps, and Dimension\\n\\n**Definition 1.4.1.** Let $Y$ be a quasi-projective
        variety in $\\\\mathbb{P}^n$ (note that affine and quasi-affine varieties
        are included via the embedding $\\\\mathbb{A}^n \\\\cong U_0 \\\\subset \\\\mathbb{P}^n$).
        A function $f : Y \\\\to k$ is *regular at a point $P \\\\in Y$* if there
        is an open neighborhood $U \\\\subseteq Y$ of $P$ and homogeneous polynomials
        $g, h \\\\in k[x_0, \\\\dots, x_n]$ of the same degree such that $h(Q) \\\\neq
        0$ for all $Q \\\\in U$, and $f(Q) = g(Q)/h(Q)$ for all $Q \\\\in U$. We say
        $f$ is *regular on $Y$* if it is regular at every point of $Y$. The ring of
        all regular functions on $Y$ is denoted $\\\\mathcal{O}(Y)$.\\n\\n**Lemma
        1.4.2.** *Every regular function $f : Y \\\\to k$ is continuous when $k$ is
        identified with $\\\\mathbb{A}^1_k$ with its Zariski topology.*\\n\\n*Proof.*
        The closed subsets of $\\\\mathbb{A}^1_k$ are finite sets of points and $\\\\mathbb{A}^1_k$
        itself. Thus it suffices to show that for any $a \\\\in k$, $f^{-1}(a)$ is
        closed in $Y$. This is a local property on $Y$: it suffices to find an open
        cover $\\\\{U_\\\\alpha\\\\}$ of $Y$ such that $f^{-1}(a) \\\\cap U_\\\\alpha$
        is closed in $U_\\\\alpha$. By definition of regularity, $Y$ can be covered
        by open sets $U$ on which $f = g/h$ with $h \\\\neq 0$ on $U$. Then for $Q
        \\\\in U$, $f(Q) = a \\\\iff g(Q) - a h(Q) = 0$. Since $g - ah$ is a homogeneous
        polynomial of the same degree as $g$ and $h$, $f^{-1}(a) \\\\cap U = Z_+(g
        - ah) \\\\cap U$, which is closed in $U$. $\\\\blacksquare$\\n\\n**Definition
        1.4.3.** Let $X, Y$ be two varieties. A *morphism* $\\\\varphi : X \\\\to
        Y$ is a continuous map such that for every open set $V \\\\subseteq Y$ and
        every regular function $f \\\\in \\\\mathcal{O}(V)$, the composition $f \\\\circ
        \\\\varphi : \\\\varphi^{-1}(V) \\\\to k$ is regular on $\\\\varphi^{-1}(V)$,
        i.e., $f \\\\circ \\\\varphi \\\\in \\\\mathcal{O}(\\\\varphi^{-1}(V))$.\\n\\n**Definition
        1.4.4.** Let $Y$ be a variety and $P \\\\in Y$. The *local ring of $P$ on
        $Y$*, denoted $\\\\mathcal{O}_{Y,P}$ (or $\\\\mathcal{O}_P$), is the ring
        of germs of regular functions at $P$. Explicitly, it is the set of equivalence
        classes of pairs $(U, f)$ where $U \\\\subseteq Y$ is an open neighborhood
        of $P$ and $f \\\\in \\\\mathcal{O}(U)$, under the equivalence relation $(U,
        f) \\\\sim (V, g)$ if $\\\\left.f\\\\right|_{U \\\\cap V} = \\\\left.g\\\\right|_{U
        \\\\cap V}$.\\n\\nThe *function field* $K(Y)$ of $Y$ is defined as the set
        of equivalence classes of pairs $(U, f)$ where $U \\\\subseteq Y$ is a *non-empty*
        open subset and $f \\\\in \\\\mathcal{O}(U)$, under the same equivalence relation.
        Since $Y$ is irreducible, any two non-empty open sets have a non-empty intersection,
        and any non-zero regular function $f \\\\in \\\\mathcal{O}(U)$ has an open
        non-vanishing locus $U \\\\setminus f^{-1}(0)$ on which $1/f$ is regular.
        Thus $K(Y)$ is a field, and for every $P \\\\in Y$, we have canonical injections
        $\\\\mathcal{O}(Y) \\\\hookrightarrow \\\\mathcal{O}_{Y,P} \\\\hookrightarrow
        K(Y)$.\\n\\n**Theorem 1.4.5.** *Let $Y \\\\subseteq \\\\mathbb{A}^n$ be an
        affine variety with affine coordinate ring $A(Y)$.*\\n1. *$\\\\mathcal{O}(Y)
        \\\\cong A(Y)$.*\\n2. *For each point $P \\\\in Y$, let $\\\\mathfrak{m}_P
        = \\\\{f \\\\in A(Y) \\\\mid f(P) = 0\\\\}$ be the maximal ideal of $P$. Then
        $\\\\mathcal{O}_{Y,P} \\\\cong A(Y)_{\\\\mathfrak{m}_P}$.*\\n3. *$K(Y)$ is
        isomorphic to the field of fractions of $A(Y)$.*\\n\\n*Proof.* Let $\\\\alpha
        : A(Y) \\\\to \\\\mathcal{O}(Y)$ be the natural map sending the coset of a
        polynomial to the regular function it defines on $Y$. By definition of $I(Y)$,
        $\\\\alpha$ is injective. It clearly induces an injective local homomorphism
        $A(Y)_{\\\\mathfrak{m}_P} \\\\hookrightarrow \\\\mathcal{O}_{Y,P}$ for every
        $P \\\\in Y$.\\n\\nTo show $A(Y)_{\\\\mathfrak{m}_P} \\\\to \\\\mathcal{O}_{Y,P}$
        is surjective, let $(U, f) \\\\in \\\\mathcal{O}_{Y,P}$. Viewing $Y \\\\subseteq
        \\\\mathbb{A}^n \\\\cong U_0 \\\\subseteq \\\\mathbb{P}^n$, after dehomogenizing
        we see that on some open neighborhood $V \\\\subseteq U$ of $P$, $f$ can be
        written as $g/h$ for polynomials $g, h \\\\in k[x_1, \\\\dots, x_n]$ with
        $h(Q) \\\\neq 0$ for all $Q \\\\in V$. Taking images in $A(Y)$, we have $\\\\bar{g},
        \\\\bar{h} \\\\in A(Y)$ with $\\\\bar{h}(P) \\\\neq 0$, so $\\\\bar{h} \\\\notin
        \\\\mathfrak{m}_P$. Then $\\\\bar{g}/\\\\bar{h} \\\\in A(Y)_{\\\\mathfrak{m}_P}$
        maps to the germ $(V, f) = (U, f)$ in $\\\\mathcal{O}_{Y,P}$. This proves
        (2).\\n\\nSince every non-zero element of $A(Y)$ is invertible on a non-empty
        open subset of $Y$, the same argument shows (3).\\n\\nFinally, to prove (1),
        we view all rings as subrings of $K(Y)$. We have $A(Y) \\\\subseteq \\\\mathcal{O}(Y)
        \\\\subseteq \\\\bigcap_{P \\\\in Y} \\\\mathcal{O}_{Y,P} = \\\\bigcap_{P
        \\\\in Y} A(Y)_{\\\\mathfrak{m}_P}$. By the Weak Nullstellensatz, the ideals
        $\\\\mathfrak{m}_P$ are precisely all the maximal ideals of $A(Y)$. It is
        a standard commutative algebra fact that for any integral domain $R$, $R =
        \\\\bigcap_{\\\\mathfrak{m} \\\\in \\\\operatorname{Max}(R)} R_{\\\\mathfrak{m}}$.
        Indeed, for any $z \\\\in \\\\bigcap_{\\\\mathfrak{m}} R_{\\\\mathfrak{m}}$,
        the conductor ideal $\\\\mathfrak{c} = \\\\{r \\\\in R \\\\mid rz \\\\in R\\\\}$
        is not contained in any maximal ideal $\\\\mathfrak{m}$ (since $z = a/b$ with
        $b \\\\notin \\\\mathfrak{m}$ implies $b \\\\in \\\\mathfrak{c} \\\\setminus
        \\\\mathfrak{m}$). Hence $\\\\mathfrak{c} = R$, so $1 \\\\in \\\\mathfrak{c}$
        and $z \\\\in R$. Thus $A(Y) = \\\\mathcal{O}(Y)$. $\\\\blacksquare$\\n\\n**Proposition
        1.4.6.** *Let $X$ be any variety and $Y \\\\subseteq \\\\mathbb{A}^n$ an affine
        variety. There is a natural bijection*\\n$$\\\\operatorname{Hom}_{\\\\mathbf{Var}}(X,
        Y) \\\\xrightarrow{\\\\sim} \\\\operatorname{Hom}_{k\\\\text{-}\\\\mathbf{Alg}}(A(Y),
        \\\\mathcal{O}(X))$$\\n*given by sending a morphism $\\\\varphi : X \\\\to
        Y$ to the pullback homomorphism $\\\\varphi^* : A(Y) = \\\\mathcal{O}(Y) \\\\to
        \\\\mathcal{O}(X)$, $f \\\\mapsto f \\\\circ \\\\varphi$. Consequently, the
        category of affine varieties over $k$ is anti-equivalent to the category of
        finitely generated integral domains over $k$.*\\n\\n*Proof.* Given $\\\\varphi
        : X \\\\to Y$, $\\\\varphi^*$ is well-defined by Definition 1.4.3. Conversely,
        let $\\\\psi : A(Y) \\\\to \\\\mathcal{O}(X)$ be a $k$-algebra homomorphism.
        Let $x_1, \\\\dots, x_n$ be the coordinate functions on $\\\\mathbb{A}^n$,
        and let $\\\\bar{x}_i \\\\in A(Y)$ be their images. Set $\\\\xi_i = \\\\psi(\\\\bar{x}_i)
        \\\\in \\\\mathcal{O}(X)$. Define a map of sets $\\\\varphi : X \\\\to \\\\mathbb{A}^n$
        by $\\\\varphi(P) = (\\\\xi_1(P), \\\\dots, \\\\xi_n(P))$.\\n\\nFor any polynomial
        $g \\\\in k[x_1, \\\\dots, x_n]$, we have $g(\\\\varphi(P)) = g(\\\\xi_1(P),
        \\\\dots, \\\\xi_n(P)) = \\\\psi(\\\\bar{g})(P)$. If $g \\\\in I(Y)$, then
        $\\\\bar{g} = 0$, so $g(\\\\varphi(P)) = 0$ for all $P \\\\in X$. Thus $\\\\varphi(X)
        \\\\subseteq Z(I(Y)) = Y$. Moreover, for any closed subset $Z(\\\\mathfrak{a})
        \\\\subseteq Y$, $\\\\varphi^{-1}(Z(\\\\mathfrak{a})) = \\\\{P \\\\in X \\\\mid
        \\\\psi(\\\\bar{g})(P) = 0 \\\\text{ for all } g \\\\in \\\\mathfrak{a}\\\\}
        = \\\\bigcap_{g \\\\in \\\\mathfrak{a}} \\\\psi(\\\\bar{g})^{-1}(0)$, which
        is closed in $X$ by Lemma 1.4.2. Hence $\\\\varphi$ is continuous. Checking
        that $\\\\varphi$ pulls back regular functions on open subsets of $Y$ to regular
        functions on $X$ follows directly from localizing the relation $f \\\\circ
        \\\\varphi = \\\\psi(f)$. The two constructions $\\\\varphi \\\\mapsto \\\\varphi^*$
        and $\\\\psi \\\\mapsto \\\\varphi$ are clearly mutually inverse. $\\\\blacksquare$\\n\\n**Definition
        1.4.7.** The *dimension* of a topological space $X$, denoted $\\\\dim X$,
        is the supremum of all integers $n$ such that there exists a chain of distinct
        irreducible closed subsets\\n$$Z_0 \\\\subsetneq Z_1 \\\\subsetneq \\\\dots
        \\\\subsetneq Z_n \\\\subseteq X.$$\\nThe *Krull dimension* of a ring $R$,
        denoted $\\\\dim R$, is the supremum of the lengths of chains of prime ideals
        $\\\\mathfrak{p}_0 \\\\subsetneq \\\\mathfrak{p}_1 \\\\subsetneq \\\\dots
        \\\\subsetneq \\\\mathfrak{p}_n$ in $R$. By Proposition 1.1.7, for an affine
        variety $Y$, $\\\\dim Y = \\\\dim A(Y)$.\\n\\n**Theorem 1.4.8.** *If $Y$ is
        an affine variety over $k$, then $\\\\dim Y$ is equal to the transcendence
        degree of its function field $K(Y)$ over $k$, denoted $\\\\operatorname{tr.deg}_k
        K(Y)$.*\\n\\n*Proof.* By the Noether Normalization Lemma (Theorem 1.1.4),
        there exist algebraically independent elements $y_1, \\\\dots, y_d \\\\in
        A(Y)$ such that $A(Y)$ is integral over $R = k[y_1, \\\\dots, y_d]$. Since
        $A(Y)$ is integral over $R$, the field extension $K(Y) / k(y_1, \\\\dots,
        y_d)$ is algebraic, so $\\\\operatorname{tr.deg}_k K(Y) = d$.\\n\\nBy the
        Going-Up and Incomparability Theorems for integral extensions of rings, $\\\\dim
        A(Y) = \\\\dim k[y_1, \\\\dots, y_d]$. Indeed, Incomparability states that
        if $\\\\mathfrak{q}_1 \\\\subsetneq \\\\mathfrak{q}_2$ are primes in $A(Y)$,
        then $\\\\mathfrak{q}_1 \\\\cap R \\\\subsetneq \\\\mathfrak{q}_2 \\\\cap
        R$, so $\\\\dim A(Y) \\\\le \\\\dim R$. Going-Up states that any chain of
        primes in $R$ lifts to a chain of primes in $A(Y)$, so $\\\\dim R \\\\le \\\\dim
        A(Y)$.\\n\\nIt remains to show $\\\\dim k[y_1, \\\\dots, y_d] = d$. The chain
        $(0) \\\\subsetneq (y_1) \\\\subsetneq (y_1, y_2) \\\\subsetneq \\\\dots \\\\subsetneq
        (y_1, \\\\dots, y_d)$ shows $\\\\dim R \\\\ge d$. Conversely, suppose $\\\\mathfrak{p}_0
        \\\\subsetneq \\\\mathfrak{p}_1 \\\\subsetneq \\\\dots \\\\subsetneq \\\\mathfrak{p}_m$
        is a chain of primes in $R$. For any prime $\\\\mathfrak{p}_i \\\\neq 0$,
        $\\\\operatorname{tr.deg}_k \\\\operatorname{Frac}(R/\\\\mathfrak{p}_i) \\u003c
        \\\\operatorname{tr.deg}_k \\\\operatorname{Frac}(R)$ because any non-zero
        element of $\\\\mathfrak{p}_i$ provides a non-trivial algebraic relation among
        the generators of $R/\\\\mathfrak{p}_i$. By induction on transcendence degree,
        $m \\\\le d$. Thus $\\\\dim Y = \\\\dim A(Y) = d = \\\\operatorname{tr.deg}_k
        K(Y)$. $\\\\blacksquare$\\n\\n---\\n\\n### Exercises for Chapter 1\\n\\n**Exercise
        1.1.** Let $Y = \\\\{(t, t^2, t^3) \\\\mid t \\\\in k\\\\} \\\\subseteq \\\\mathbb{A}^3_k$
        be the *twisted cubic curve*. Prove that $Y$ is an affine variety of dimension
        1, find generators for $I(Y)$, and show that $A(Y)$ is isomorphic to a polynomial
        ring in one variable over $k$.\\n\\n**Exercise 1.2.** Let $f \\\\in k[x_1,
        \\\\dots, x_n]$ be an irreducible polynomial. The *principal open set* $D(f)$
        is defined as $\\\\mathbb{A}^n \\\\setminus Z(f)$. Prove that $D(f)$ is isomorphic
        (as a variety) to the closed algebraic subset $H_f = Z(x_{n+1}f(x_1, \\\\dots,
        x_n) - 1) \\\\subseteq \\\\mathbb{A}^{n+1}$, and conclude that $D(f)$ is an
        affine variety with coordinate ring $k[x_1, \\\\dots, x_n]_f$.\\n\\n**Exercise
        1.3.** Prove that $\\\\mathbb{A}^2_k \\\\setminus \\\\{(0,0)\\\\}$ is a quasi-affine
        variety that is *not* isomorphic to any affine variety. *(Hint: Compute $\\\\mathcal{O}(\\\\mathbb{A}^2
        \\\\setminus \\\\{(0,0)\\\\})$ and use Proposition 1.4.6).*\\n\\n**Exercise
        1.4 (The Segre Embedding).** Define the map $\\\\sigma : \\\\mathbb{P}^n_k
        \\\\times \\\\mathbb{P}^m_k \\\\to \\\\mathbb{P}^{(n+1)(m+1)-1}_k$ by sending
        $([a_0 : \\\\dots : a_n], [b_0 : \\\\dots : b_m])$ to the point with homogeneous
        coordinates $[c_{ij}]$ where $c_{ij} = a_i b_j$ (ordered lexicographically).
        Prove that $\\\\sigma$ is injective and that its image is the projective variety
        cut out by the $2 \\\\times 2$ minors of the matrix $(z_{ij})$, i.e., the
        homogeneous ideal generated by $z_{ij}z_{kl} - z_{il}z_{kj}$.\\n\\n**Exercise
        1.5 (The Veronese Embedding).** For integers $n, d \\\\ge 1$, let $N = \\\\binom{n+d}{n}
        - 1$. Define the $d$-uple embedding $\\\\nu_d : \\\\mathbb{P}^n_k \\\\to \\\\mathbb{P}^N_k$
        by sending $[a_0 : \\\\dots : a_n]$ to the point whose homogeneous coordinates
        are all monomials $a_0^{i_0}\\\\cdots a_n^{i_n}$ of total degree $i_0 + \\\\dots
        + i_n = d$. Prove that the image of $\\\\nu_d$ is a projective variety, and
        that $\\\\nu_d$ induces a homeomorphism onto its image. Deduce that the complement
        of any hypersurface $Z_+(f)$ in $\\\\mathbb{P}^n$ (where $\\\\deg f = d$)
        is an affine variety.\\n\\n**Exercise 1.6.** Let $\\\\varphi : X \\\\to Y$
        be a morphism of affine varieties, and $\\\\varphi^* : A(Y) \\\\to A(X)$ the
        induced homomorphism of coordinate rings.\\n(a) Prove that $\\\\varphi$ is
        *dominant* (i.e., $\\\\overline{\\\\varphi(X)} = Y$) if and only if $\\\\varphi^*$
        is injective.\\n(b) Prove that $\\\\varphi$ is a closed immersion (an isomorphism
        onto a closed subvariety of $Y$) if and only if $\\\\varphi^*$ is surjective.\\n\\n**Exercise
        1.7.** Let $Y \\\\subseteq \\\\mathbb{A}^3_k$ be the algebraic set defined
        by the ideal $\\\\mathfrak{a} = (x^2 - yz, xz - x)$. Decompose $Y$ into its
        irreducible components and find the prime ideals corresponding to each component.\\n\\n**Exercise
        1.8.** A *rational map* $\\\\varphi : X \\\\dashrightarrow Y$ between two
        varieties is an equivalence class of pairs $(U, \\\\varphi_U)$ where $U \\\\subseteq
        X$ is a non-empty open subset and $\\\\varphi_U : U \\\\to Y$ is a morphism,
        with $(U, \\\\varphi_U) \\\\sim (V, \\\\varphi_V)$ if they agree on $U \\\\cap
        V$. We say $\\\\varphi$ is *dominant* if $\\\\varphi_U(U)$ is dense in $Y$.
        Prove that the assignment $X \\\\mapsto K(X)$ induces a contravariant equivalence
        of categories between the category of varieties over $k$ with dominant rational
        maps, and the category of finitely generated field extensions of $k$.\\n\\n---\\n\\n##
        Chapter 2: Sheaves and Ringed Spaces\\n\\n### 2.1 Presheaves and Sheaves\\n\\n**Definition
        2.1.1.** Let $X$ be a topological space, and let $\\\\mathbf{Top}(X)$ be the
        category whose objects are open subsets of $X$ and whose morphisms are inclusion
        maps $V \\\\hookrightarrow U$. A *presheaf* $\\\\mathcal{F}$ of sets (or abelian
        groups, or rings) on $X$ is a contravariant functor from $\\\\mathbf{Top}(X)$
        to the category $\\\\mathbf{Set}$ (or $\\\\mathbf{Ab}$, or $\\\\mathbf{Ring}$).
        Explicitly, $\\\\mathcal{F}$ consists of:\\n1. For every open set $U \\\\subseteq
        X$, an object $\\\\mathcal{F}(U)$ (also denoted $\\\\Gamma(U, \\\\mathcal{F})$),
        whose elements are called *sections of $\\\\mathcal{F}$ over $U$*.\\n2. For
        every inclusion of open sets $V \\\\subseteq U$, a *restriction morphism*
        $\\\\rho_{UV} : \\\\mathcal{F}(U) \\\\to \\\\mathcal{F}(V)$ (often written
        $\\\\left.s\\\\right|_V$ for $s \\\\in \\\\mathcal{F}(U)$), satisfying:\\n
        \  - $\\\\mathcal{F}(\\\\emptyset) = 0$ (or a one-point set in $\\\\mathbf{Set}$),\\n
        \  - $\\\\rho_{UU} = \\\\operatorname{id}_{\\\\mathcal{F}(U)}$ for all $U$,\\n
        \  - $\\\\rho_{VW} \\\\circ \\\\rho_{UV} = \\\\rho_{UW}$ whenever $W \\\\subseteq
        V \\\\subseteq U$.\\n\\n**Definition 2.1.2.** A presheaf $\\\\mathcal{F}$
        on $X$ is a *sheaf* if it satisfies the following two additional conditions
        for every open set $U \\\\subseteq X$ and every open covering $\\\\{U_i\\\\}_{i
        \\\\in I}$ of $U$:\\n1. **(Locality / Uniqueness)** If $s, t \\\\in \\\\mathcal{F}(U)$
        are sections such that $\\\\left.s\\\\right|_{U_i} = \\\\left.t\\\\right|_{U_i}$
        for all $i \\\\in I$, then $s = t$.\\n2. **(Gluing)** If we are given a family
        of sections $s_i \\\\in \\\\mathcal{F}(U_i)$ for each $i \\\\in I$ such that
        $\\\\left.s_i\\\\right|_{U_i \\\\cap U_j} = \\\\left.s_j\\\\right|_{U_i \\\\cap
        U_j}$ for all $i, j \\\\in I$, then there exists a section $s \\\\in \\\\mathcal{F}(U)$
        such that $\\\\left.s\\\\right|_{U_i} = s_i$ for all $i \\\\in I$.\\n\\nEquivalently,
        for a presheaf of abelian groups, $\\\\mathcal{F}$ is a sheaf if and only
        if for every open $U$ and every open cover $\\\\{U_i\\\\}_{i \\\\in I}$ of
        $U$, the sequence\\n$$0 \\\\longrightarrow \\\\mathcal{F}(U) \\\\xrightarrow{\\\\alpha}
        \\\\prod_{i \\\\in I} \\\\mathcal{F}(U_i) \\\\xrightarrow{\\\\beta} \\\\prod_{(i,j)
        \\\\in I \\\\times I} \\\\mathcal{F}(U_i \\\\cap U_j)$$\\nis exact, where
        $\\\\alpha(s) = (\\\\left.s\\\\right|_{U_i})_{i \\\\in I}$ and $\\\\beta((s_i)_{i
        \\\\in I}) = (\\\\left.s_i\\\\right|_{U_i \\\\cap U_j} - \\\\left.s_j\\\\right|_{U_i
        \\\\cap U_j})_{(i,j)}$.\\n\\n**Definition 2.1.3.** Let $\\\\mathcal{F}$ be
        a presheaf on $X$ and $P \\\\in X$. The *stalk* of $\\\\mathcal{F}$ at $P$,
        denoted $\\\\mathcal{F}_P$, is the direct limit\\n$$\\\\mathcal{F}_P = \\\\varinjlim_{P
        \\\\in U} \\\\mathcal{F}(U)$$\\ntaken over the directed system of all open
        neighborhoods $U$ of $P$, ordered by reverse inclusion. Concretely, an element
        of $\\\\mathcal{F}_P$ is an equivalence class of pairs $(U, s)$ with $P \\\\in
        U$ and $s \\\\in \\\\mathcal{F}(U)$, where $(U, s) \\\\sim (V, t)$ if there
        exists an open neighborhood $W \\\\subseteq U \\\\cap V$ of $P$ such that
        $\\\\left.s\\\\right|_W = \\\\left.t\\\\right|_W$. The equivalence class of
        $(U, s)$ in $\\\\mathcal{F}_P$ is denoted $s_P$ and called the *germ* of $s$
        at $P$.\\n\\n**Definition 2.1.4.** A *morphism of presheaves* (or *of sheaves*)
        $\\\\varphi : \\\\mathcal{F} \\\\to \\\\mathcal{G}$ on $X$ is a natural transformation
        of functors; that is, a collection of morphisms $\\\\varphi(U) : \\\\mathcal{F}(U)
        \\\\to \\\\mathcal{G}(U)$ for each open $U \\\\subseteq X$ such that for every
        inclusion $V \\\\subseteq U$, the diagram\\n$$\\\\begin{array}{ccc}\\n\\\\mathcal{F}(U)
        & \\\\xrightarrow{\\\\varphi(U)} & \\\\mathcal{G}(U) \\\\\\\\\\n\\\\downarrow{\\\\rho_{UV}^{\\\\mathcal{F}}}
        & & \\\\downarrow{\\\\rho_{UV}^{\\\\mathcal{G}}} \\\\\\\\\\n\\\\mathcal{F}(V)
        & \\\\xrightarrow{\\\\varphi(V)} & \\\\mathcal{G}(V)\\n\\\\end{array}$$\\ncommutes.
        A morphism $\\\\varphi : \\\\mathcal{F} \\\\to \\\\mathcal{G}$ induces a morphism
        on stalks $\\\\varphi_P : \\\\mathcal{F}_P \\\\to \\\\mathcal{G}_P$ for every
        $P \\\\in X$, given by $\\\\varphi_P(s_P) = (\\\\varphi(U)(s))_P$.\\n\\n**Proposition
        2.1.5.** *Let $\\\\varphi : \\\\mathcal{F} \\\\to \\\\mathcal{G}$ be a morphism
        of sheaves on $X$. Then $\\\\varphi$ is an isomorphism (i.e., $\\\\varphi(U)$
        is bijective for all open $U$) if and only if the induced map on stalks $\\\\varphi_P
        : \\\\mathcal{F}_P \\\\to \\\\mathcal{G}_P$ is an isomorphism for every $P
        \\\\in X$.*\\n\\n*Proof.* ($\\\\Rightarrow$) If $\\\\varphi(U)$ is an isomorphism
        for all $U$, then by functoriality of direct limits, $\\\\varphi_P = \\\\varinjlim
        \\\\varphi(U)$ is an isomorphism for every $P \\\\in X$.\\n\\n($\\\\Leftarrow$)
        Suppose $\\\\varphi_P$ is bijective for all $P \\\\in X$, and let $U \\\\subseteq
        X$ be open. \\n\\nFirst, we show $\\\\varphi(U)$ is injective (this requires
        only that $\\\\mathcal{F}$ is a sheaf and $\\\\varphi_P$ is injective). Suppose
        $s, t \\\\in \\\\mathcal{F}(U)$ satisfy $\\\\varphi(U)(s) = \\\\varphi(U)(t)$.
        Then for every $P \\\\in U$, $\\\\varphi_P(s_P) = (\\\\varphi(U)(s))_P = (\\\\varphi(U)(t))_P
        = \\\\varphi_P(t_P)$. Since $\\\\varphi_P$ is injective, $s_P = t_P$ in $\\\\mathcal{F}_P$.
        By definition of the stalk, for each $P \\\\in U$ there exists an open neighborhood
        $V_P \\\\subseteq U$ of $P$ such that $\\\\left.s\\\\right|_{V_P} = \\\\left.t\\\\right|_{V_P}$.
        Since $\\\\{V_P\\\\}_{P \\\\in U}$ is an open covering of $U$, the Locality
        axiom for $\\\\mathcal{F}$ implies $s = t$.\\n\\nNext, we show $\\\\varphi(U)$
        is surjective. Let $t \\\\in \\\\mathcal{G}(U)$. For each $P \\\\in U$, consider
        the germ $t_P \\\\in \\\\mathcal{G}_P$. Since $\\\\varphi_P$ is surjective,
        there exists a germ in $\\\\mathcal{F}_P$ mapping to $t_P$. This germ can
        be represented by a pair $(W_P, s^{(P)})$ where $W_P \\\\subseteq U$ is an
        open neighborhood of $P$ and $s^{(P)} \\\\in \\\\mathcal{F}(W_P)$, such that
        $(\\\\varphi(W_P)(s^{(P)}))_P = t_P$. By definition of equality in $\\\\mathcal{G}_P$,
        there exists a smaller open neighborhood $V_P \\\\subseteq W_P$ of $P$ such
        that\\n$$\\\\left.\\\\varphi(W_P)(s^{(P)})\\\\right|_{V_P} = \\\\varphi(V_P)\\\\left(\\\\left.s^{(P)}\\\\right|_{V_P}\\\\right)
        = \\\\left.t\\\\right|_{V_P}.$$\\nReplacing $W_P$ by $V_P$ and $s^{(P)}$ by
        $\\\\left.s^{(P)}\\\\right|_{V_P}$, we have an open covering $\\\\{V_P\\\\}_{P
        \\\\in U}$ of $U$ and sections $s^{(P)} \\\\in \\\\mathcal{F}(V_P)$ such that
        $\\\\varphi(V_P)(s^{(P)}) = \\\\left.t\\\\right|_{V_P}$.\\n\\nNow consider
        any two points $P, Q \\\\in U$. On the intersection $V_P \\\\cap V_Q$, we
        have\\n$$\\\\varphi(V_P \\\\cap V_Q)\\\\left(\\\\left.s^{(P)}\\\\right|_{V_P
        \\\\cap V_Q}\\\\right) = \\\\left.\\\\varphi(V_P)(s^{(P)})\\\\right|_{V_P
        \\\\cap V_Q} = \\\\left.t\\\\right|_{V_P \\\\cap V_Q} = \\\\varphi(V_P \\\\cap
        V_Q)\\\\left(\\\\left.s^{(Q)}\\\\right|_{V_P \\\\cap V_Q}\\\\right).$$\\nSince
        we already proved that $\\\\varphi(W)$ is injective for *any* open set $W$
        (in particular for $W = V_P \\\\cap V_Q$), it follows that\\n$$\\\\left.s^{(P)}\\\\right|_{V_P
        \\\\cap V_Q} = \\\\left.s^{(Q)}\\\\right|_{V_P \\\\cap V_Q}.$$\\nBy the Gluing
        axiom for the sheaf $\\\\mathcal{F}$, there exists a global section $s \\\\in
        \\\\mathcal{F}(U)$ such that $\\\\left.s\\\\right|_{V_P} = s^{(P)}$ for all
        $P \\\\in U$. Finally, for each $P \\\\in U$, we have\\n$$\\\\left.\\\\varphi(U)(s)\\\\right|_{V_P}
        = \\\\varphi(V_P)(\\\\left.s\\\\right|_{V_P}) = \\\\varphi(V_P)(s^{(P)}) =
        \\\\left.t\\\\right|_{V_P}.$$\\nBy the Locality axiom for the sheaf $\\\\mathcal{G}$
        applied to the covering $\\\\{V_P\\\\}_{P \\\\in U}$, we conclude that $\\\\varphi(U)(s)
        = t$. Thus $\\\\varphi(U)$ is surjective. $\\\\blacksquare$\\n\\n---\\n\\n###
        2.2 Sheafification and the Category of Sheaves\\n\\n**Theorem 2.2.1 (Sheafification).**
        *Given any presheaf $\\\\mathcal{F}$ on $X$, there exists a sheaf $\\\\mathcal{F}^+$
        and a morphism of presheaves $\\\\theta : \\\\mathcal{F} \\\\to \\\\mathcal{F}^+$
        such that for any sheaf $\\\\mathcal{G}$ and any morphism of presheaves $\\\\varphi
        : \\\\mathcal{F} \\\\to \\\\mathcal{G}$, there is a unique morphism of sheaves
        $\\\\psi : \\\\mathcal{F}^+ \\\\to \\\\mathcal{G}$ such that $\\\\varphi =
        \\\\psi \\\\circ \\\\theta$. Furthermore, the pair $(\\\\mathcal{F}^+, \\\\theta)$
        is unique up to unique isomorphism, and $\\\\theta_P : \\\\mathcal{F}_P \\\\to
        (\\\\mathcal{F}^+)_P$ is an isomorphism for all $P \\\\in X$. The sheaf $\\\\mathcal{F}^+$
        is called the sheafification of $\\\\mathcal{F}$ (or the sheaf associated
        to the presheaf $\\\\mathcal{F}$).*\\n\\n*Proof.* For any open set $U \\\\subseteq
        X$, we define $\\\\mathcal{F}^+(U)$ to be the set of functions $s : U \\\\to
        \\\\bigsqcup_{P \\\\in U} \\\\mathcal{F}_P$ satisfying the following two conditions:\\n1.
        For each $P \\\\in U$, $s(P) \\\\in \\\\mathcal{F}_P$.\\n2. For each $P \\\\in
        U$, there exists an open neighborhood $V \\\\subseteq U$ of $P$ and a section
        $t \\\\in \\\\mathcal{F}(V)$ such that for all $Q \\\\in V$, $s(Q) = t_Q$
        (the germ of $t$ at $Q$).\\n\\nWith the natural restriction of functions for
        $W \\\\subseteq U$, it is immediate from the local nature of condition (2)
        that $\\\\mathcal{F}^+$ satisfies both the Locality and Gluing axioms, so
        $\\\\mathcal{F}^+$ is a sheaf.\\n\\nDefine the morphism $\\\\theta : \\\\mathcal{F}
        \\\\to \\\\mathcal{F}^+$ on each open $U$ by sending $t \\\\in \\\\mathcal{F}(U)$
        to the function $\\\\theta(U)(t) : P \\\\mapsto t_P$. Clearly $\\\\theta(U)(t)$
        satisfies conditions (1) and (2) (taking $V = U$), and $\\\\theta$ commutes
        with restrictions.\\n\\nLet $P \\\\in X$. We show that $\\\\theta_P : \\\\mathcal{F}_P
        \\\\to (\\\\mathcal{F}^+)_P$ is an isomorphism. There is a natural evaluation
        map $\\\\operatorname{ev}_P : (\\\\mathcal{F}^+)_P \\\\to \\\\mathcal{F}_P$
        sending the germ of a function $s \\\\in \\\\mathcal{F}^+(U)$ at $P$ to its
        value $s(P) \\\\in \\\\mathcal{F}_P$. For any $t_P \\\\in \\\\mathcal{F}_P$
        represented by $(U, t)$, $\\\\operatorname{ev}_P(\\\\theta_P(t_P)) = (\\\\theta(U)(t))(P)
        = t_P$, so $\\\\operatorname{ev}_P \\\\circ \\\\theta_P = \\\\operatorname{id}_{\\\\mathcal{F}_P}$.
        Conversely, given a germ in $(\\\\mathcal{F}^+)_P$ represented by $s \\\\in
        \\\\mathcal{F}^+(U)$, condition (2) provides a neighborhood $V \\\\subseteq
        U$ of $P$ and $t \\\\in \\\\mathcal{F}(V)$ such that $s(Q) = t_Q = (\\\\theta(V)(t))(Q)$
        for all $Q \\\\in V$. Thus $\\\\left.s\\\\right|_V = \\\\theta(V)(t)$, which
        means they have the same germ in $(\\\\mathcal{F}^+)_P$. Therefore, $\\\\theta_P(\\\\operatorname{ev}_P(s_P))
        = \\\\theta_P(t_P) = s_P$, proving $\\\\theta_P$ is an isomorphism.\\n\\nFinally,
        let $\\\\mathcal{G}$ be a sheaf and $\\\\varphi : \\\\mathcal{F} \\\\to \\\\mathcal{G}$
        a presheaf morphism. Since $\\\\mathcal{G}$ is a sheaf, its own sheafification
        morphism $\\\\theta_{\\\\mathcal{G}} : \\\\mathcal{G} \\\\to \\\\mathcal{G}^+$
        induces an isomorphism on all stalks, hence is an isomorphism of sheaves by
        Proposition 2.1.5. On the other hand, $\\\\varphi$ induces stalk maps $\\\\varphi_P
        : \\\\mathcal{F}_P \\\\to \\\\mathcal{G}_P$, which immediately define a sheaf
        morphism $\\\\varphi^+ : \\\\mathcal{F}^+ \\\\to \\\\mathcal{G}^+$ by $(\\\\varphi^+(U)(s))(P)
        = \\\\varphi_P(s(P))$. Setting $\\\\psi = (\\\\theta_{\\\\mathcal{G}})^{-1}
        \\\\circ \\\\varphi^+ : \\\\mathcal{F}^+ \\\\to \\\\mathcal{G}$ gives a morphism
        satisfying $\\\\psi \\\\circ \\\\theta = \\\\varphi$. Uniqueness of $\\\\psi$
        follows because any such $\\\\psi$ is determined on stalks by $\\\\psi_P =
        \\\\varphi_P \\\\circ (\\\\theta_P)^{-1}$, and a morphism of sheaves is uniquely
        determined by its induced maps on stalks (if $\\\\psi, \\\\psi'$ have the
        same stalk maps, then for any $s \\\\in \\\\mathcal{F}^+(U)$, $\\\\psi(U)(s)$
        and $\\\\psi'(U)(s)$ have the same germ at every $P \\\\in U$, hence are equal
        by Locality of $\\\\mathcal{G}$). $\\\\blacksquare$\\n\\n**Definition 2.2.2.**
        Let $\\\\varphi : \\\\mathcal{F} \\\\to \\\\mathcal{G}$ be a morphism of sheaves
        of abelian groups on $X$.\\n1. The *kernel* of $\\\\varphi$, denoted $\\\\ker
        \\\\varphi$, is the presheaf $U \\\\mapsto \\\\ker(\\\\varphi(U) : \\\\mathcal{F}(U)
        \\\\to \\\\mathcal{G}(U))$.\\n2. The *image* of $\\\\varphi$, denoted $\\\\operatorname{im}
        \\\\varphi$, is the sheafification of the presheaf $U \\\\mapsto \\\\operatorname{im}(\\\\varphi(U)
        : \\\\mathcal{F}(U) \\\\to \\\\mathcal{G}(U))$.\\n3. The *cokernel* of $\\\\varphi$,
        denoted $\\\\operatorname{coker} \\\\varphi$, is the sheafification of the
        presheaf $U \\\\mapsto \\\\operatorname{coker}(\\\\varphi(U) : \\\\mathcal{F}(U)
        \\\\to \\\\mathcal{G}(U))$.\\n\\n**Proposition 2.2.3.** *Let $\\\\varphi :
        \\\\mathcal{F} \\\\to \\\\mathcal{G}$ be a morphism of sheaves of abelian
        groups on $X$.*\\n1. *The presheaf $\\\\ker \\\\varphi$ is already a sheaf,
        and $(\\\\ker \\\\varphi)_P = \\\\ker(\\\\varphi_P)$ for all $P \\\\in X$.*\\n2.
        *For all $P \\\\in X$, $(\\\\operatorname{im} \\\\varphi)_P = \\\\operatorname{im}(\\\\varphi_P)$
        and $(\\\\operatorname{coker} \\\\varphi)_P = \\\\operatorname{coker}(\\\\varphi_P)$.*\\n3.
        *The category $\\\\mathbf{Ab}(X)$ of sheaves of abelian groups on $X$ is an
        abelian category. A sequence of sheaves $\\\\mathcal{F}' \\\\xrightarrow{\\\\alpha}
        \\\\mathcal{F} \\\\xrightarrow{\\\\beta} \\\\mathcal{F}''$ is exact in $\\\\mathbf{Ab}(X)$
        (meaning $\\\\ker \\\\beta = \\\\operatorname{im} \\\\alpha$) if and only
        if the induced sequence of stalks $\\\\mathcal{F}'_P \\\\xrightarrow{\\\\alpha_P}
        \\\\mathcal{F}_P \\\\xrightarrow{\\\\beta_P} \\\\mathcal{F}''_P$ is exact
        as a sequence of abelian groups for every $P \\\\in X$.*\\n\\n*Proof.* (1)
        Let $\\\\{U_i\\\\}$ be an open cover of $U$. If $s \\\\in (\\\\ker \\\\varphi)(U)
        \\\\subseteq \\\\mathcal{F}(U)$ vanishes on each $U_i$, then $s = 0$ because
        $\\\\mathcal{F}$ is a sheaf. If $s_i \\\\in (\\\\ker \\\\varphi)(U_i)$ agree
        on overlaps, they glue to a unique $s \\\\in \\\\mathcal{F}(U)$ since $\\\\mathcal{F}$
        is a sheaf. Then $\\\\left.\\\\varphi(U)(s)\\\\right|_{U_i} = \\\\varphi(U_i)(s_i)
        = 0$ for all $i$. By the Locality axiom for $\\\\mathcal{G}$, $\\\\varphi(U)(s)
        = 0$, so $s \\\\in (\\\\ker \\\\varphi)(U)$. Thus $\\\\ker \\\\varphi$ is
        a sheaf. Since taking direct limits over directed sets is an exact functor
        on $\\\\mathbf{Ab}$, $\\\\varinjlim \\\\ker(\\\\varphi(U)) = \\\\ker(\\\\varinjlim
        \\\\varphi(U))$, giving $(\\\\ker \\\\varphi)_P = \\\\ker(\\\\varphi_P)$.\\n\\n(2)
        Let $\\\\mathcal{I}$ be the presheaf $U \\\\mapsto \\\\operatorname{im}(\\\\varphi(U))$.
        By exactness of filtered direct limits, $\\\\mathcal{I}_P = \\\\operatorname{im}(\\\\varphi_P)$.
        By Theorem 2.2.1, $(\\\\operatorname{im} \\\\varphi)_P = (\\\\mathcal{I}^+)_P
        \\\\cong \\\\mathcal{I}_P = \\\\operatorname{im}(\\\\varphi_P)$. The exact
        same argument applies to $\\\\operatorname{coker} \\\\varphi$. Furthermore,
        since $\\\\mathcal{I}(U) \\\\subseteq \\\\mathcal{G}(U)$ for all $U$, the
        universal property of sheafification gives an induced morphism $\\\\operatorname{im}
        \\\\varphi \\\\to \\\\mathcal{G}$ whose stalk map at $P$ is the natural inclusion
        $\\\\operatorname{im}(\\\\varphi_P) \\\\hookrightarrow \\\\mathcal{G}_P$.
        Thus $\\\\operatorname{im} \\\\varphi$ can be canonically identified with
        a subsheaf of $\\\\mathcal{G}$.\\n\\n(3) Using the universal properties of
        kernels, cokernels, and sheafification, one verifies directly that $\\\\ker
        \\\\varphi$ and $\\\\operatorname{coker} \\\\varphi$ are the categorical kernel
        and cokernel in $\\\\mathbf{Ab}(X)$. To show $\\\\mathbf{Ab}(X)$ is abelian,
        we must check that for any morphism $\\\\varphi : \\\\mathcal{F} \\\\to \\\\mathcal{G}$,
        the canonical morphism $\\\\operatorname{coim} \\\\varphi = \\\\operatorname{coker}(\\\\ker
        \\\\varphi \\\\to \\\\mathcal{F}) \\\\to \\\\ker(\\\\mathcal{G} \\\\to \\\\operatorname{coker}
        \\\\varphi) = \\\\operatorname{im} \\\\varphi$ is an isomorphism. At any stalk
        $P \\\\in X$, the induced map is the canonical map $\\\\mathcal{F}_P / \\\\ker(\\\\varphi_P)
        \\\\to \\\\operatorname{im}(\\\\varphi_P)$, which is an isomorphism in $\\\\mathbf{Ab}$
        by the First Isomorphism Theorem for abelian groups. By Proposition 2.1.5,
        $\\\\operatorname{coim} \\\\varphi \\\\to \\\\operatorname{im} \\\\varphi$
        is an isomorphism of sheaves.\\n\\nFinally, a sequence $\\\\mathcal{F}' \\\\xrightarrow{\\\\alpha}
        \\\\mathcal{F} \\\\xrightarrow{\\\\beta} \\\\mathcal{F}''$ is exact if and
        only if $\\\\beta \\\\circ \\\\alpha = 0$ and the induced inclusion $\\\\operatorname{im}
        \\\\alpha \\\\hookrightarrow \\\\ker \\\\beta$ is an isomorphism. By Proposition
        2.1.5 and parts (1) and (2), this occurs if and only if $\\\\operatorname{im}(\\\\alpha_P)
        = \\\\ker(\\\\beta_P)$ for all $P \\\\in X$. $\\\\blacksquare$\\n\\n---\\n\\n###
        2.3 Ringed Spaces and Locally Ringed Spaces\\n\\n**Definition 2.3.1.** Let
        $f : X \\\\to Y$ be a continuous map of topological spaces.\\n1. For any sheaf
        $\\\\mathcal{F}$ on $X$, the *direct image* (or *pushforward*) sheaf $f_*\\\\mathcal{F}$
        on $Y$ is defined by $(f_*\\\\mathcal{F})(V) = \\\\mathcal{F}(f^{-1}(V))$
        for any open set $V \\\\subseteq Y$. (It is immediate that $f_*\\\\mathcal{F}$
        is a sheaf).\\n2. For any sheaf $\\\\mathcal{G}$ on $Y$, the *inverse image*
        (or *pullback*) sheaf $f^{-1}\\\\mathcal{G}$ on $X$ is defined as the sheafification
        of the presheaf\\n$$U \\\\longmapsto \\\\varinjlim_{V \\\\supseteq f(U)} \\\\mathcal{G}(V)$$\\nwhere
        $U \\\\subseteq X$ is open and the direct limit runs over all open subsets
        $V \\\\subseteq Y$ containing $f(U)$.\\n\\n**Proposition 2.3.2.** *Let $f
        : X \\\\to Y$ be a continuous map. For any sheaf $\\\\mathcal{G}$ on $Y$ and
        any point $P \\\\in X$, there is a natural isomorphism of stalks $(f^{-1}\\\\mathcal{G})_P
        \\\\cong \\\\mathcal{G}_{f(P)}$. Moreover, $f^{-1}$ is left adjoint to $f_*$:
        for any sheaf $\\\\mathcal{F}$ on $X$ and any sheaf $\\\\mathcal{G}$ on $Y$,
        there is a natural bijection*\\n$$\\\\operatorname{Hom}_{\\\\mathbf{Sh}(X)}(f^{-1}\\\\mathcal{G},
        \\\\mathcal{F}) \\\\xrightarrow{\\\\sim} \\\\operatorname{Hom}_{\\\\mathbf{Sh}(Y)}(\\\\mathcal{G},
        f_*\\\\mathcal{F}).$$\\n\\n*Proof.* Let $\\\\mathcal{P}$ be the presheaf on
        $X$ given by $\\\\mathcal{P}(U) = \\\\varinjlim_{V \\\\supseteq f(U)} \\\\mathcal{G}(V)$.
        By Theorem 2.2.1, $(f^{-1}\\\\mathcal{G})_P \\\\cong \\\\mathcal{P}_P = \\\\varinjlim_{P
        \\\\in U} \\\\left(\\\\varinjlim_{V \\\\supseteq f(U)} \\\\mathcal{G}(V)\\\\right)$.
        Since $f$ is continuous, for every open neighborhood $V$ of $f(P)$, $U = f^{-1}(V)$
        is an open neighborhood of $P$ satisfying $f(U) \\\\subseteq V$. Thus the
        cofinality of neighborhoods of the form $f^{-1}(V)$ in the double direct limit
        collapses it to $\\\\varinjlim_{f(P) \\\\in V} \\\\mathcal{G}(V) = \\\\mathcal{G}_{f(P)}$.\\n\\nFor
        the adjunction, by the universal property of sheafification, $\\\\operatorname{Hom}_{\\\\mathbf{Sh}(X)}(f^{-1}\\\\mathcal{G},
        \\\\mathcal{F}) \\\\cong \\\\operatorname{Hom}_{\\\\mathbf{PSh}(X)}(\\\\mathcal{P},
        \\\\mathcal{F})$. Given a presheaf morphism $\\\\alpha : \\\\mathcal{P} \\\\to
        \\\\mathcal{F}$ and an open set $V \\\\subseteq Y$, setting $U = f^{-1}(V)$,
        we have a canonical map $\\\\mathcal{G}(V) \\\\to \\\\varinjlim_{W \\\\supseteq
        f(f^{-1}(V))} \\\\mathcal{G}(W) = \\\\mathcal{P}(f^{-1}(V))$. Composing with
        $\\\\alpha(f^{-1}(V)) : \\\\mathcal{P}(f^{-1}(V)) \\\\to \\\\mathcal{F}(f^{-1}(V))
        = (f_*\\\\mathcal{F})(V)$ gives a morphism $\\\\beta(V) : \\\\mathcal{G}(V)
        \\\\to (f_*\\\\mathcal{F})(V)$. Conversely, given $\\\\beta : \\\\mathcal{G}
        \\\\to f_*\\\\mathcal{F}$ and $U \\\\subseteq X$, for every open $V \\\\supseteq
        f(U)$ we have $U \\\\subseteq f^{-1}(V)$, so we obtain a composite map $\\\\mathcal{G}(V)
        \\\\xrightarrow{\\\\beta(V)} \\\\mathcal{F}(f^{-1}(V)) \\\\xrightarrow{\\\\text{res}}
        \\\\mathcal{F}(U)$. Passing to the direct limit over $V \\\\supseteq f(U)$
        yields $\\\\alpha(U) : \\\\mathcal{P}(U) \\\\to \\\\mathcal{F}(U)$. These
        two constructions are clearly mutually inverse. $\\\\blacksquare$\\n\\n**Definition
        2.3.3.** A *ringed space* is a pair $(X, \\\\mathcal{O}_X)$ consisting of
        a topological space $X$ and a sheaf of commutative rings $\\\\mathcal{O}_X$
        on $X$, called the *structure sheaf* of $X$. A *morphism of ringed spaces*
        from $(X, \\\\mathcal{O}_X)$ to $(Y, \\\\mathcal{O}_Y)$ is a pair $(f, f^\\\\#)$
        consisting of a continuous map $f : X \\\\to Y$ and a morphism of sheaves
        of rings $f^\\\\# : \\\\mathcal{O}_Y \\\\to f_*\\\\mathcal{O}_X$ on $Y$.\\n\\nBy
        the adjunction of Proposition 2.3.2, giving $f^\\\\# : \\\\mathcal{O}_Y \\\\to
        f_*\\\\mathcal{O}_X$ is equivalent to giving a morphism $f^\\\\flat : f^{-1}\\\\mathcal{O}_Y
        \\\\to \\\\mathcal{O}_X$ on $X$. Taking stalks at $P \\\\in X$ and using $(f^{-1}\\\\mathcal{O}_Y)_P
        \\\\cong \\\\mathcal{O}_{Y, f(P)}$, a morphism of ringed spaces induces a
        ring homomorphism on stalks\\n$$f^\\\\#_P : \\\\mathcal{O}_{Y, f(P)} \\\\longrightarrow
        \\\\mathcal{O}_{X, P}.$$\\nExplicitly, $f^\\\\#_P$ sends the germ of $s \\\\in
        \\\\mathcal{O}_Y(V)$ at $f(P)$ to the germ of $f^\\\\#(V)(s) \\\\in \\\\mathcal{O}_X(f^{-1}(V))$
        at $P$.\\n\\n**Definition 2.3.4.** A ringed space $(X, \\\\mathcal{O}_X)$
        is a *locally ringed space* if for every point $P \\\\in X$, the stalk $\\\\mathcal{O}_{X,
        P}$ is a local ring (i.e., has a unique maximal ideal, which we denote $\\\\mathfrak{m}_P$
        or $\\\\mathfrak{m}_{X,P}$). The *residue field* of $P$ is the field $k(P)
        = \\\\mathcal{O}_{X, P} / \\\\mathfrak{m}_P$.\\n\\nA *morphism of locally
        ringed spaces* is a morphism of ringed spaces $(f, f^\\\\#) : (X, \\\\mathcal{O}_X)
        \\\\to (Y, \\\\mathcal{O}_Y)$ such that for every point $P \\\\in X$, the
        induced map of local rings $f^\\\\#_P : \\\\mathcal{O}_{Y, f(P)} \\\\to \\\\mathcal{O}_{X,
        P}$ is a *local homomorphism*, meaning that $(f^\\\\#_P)^{-1}(\\\\mathfrak{m}_{X,P})
        = \\\\mathfrak{m}_{Y, f(P)}$ (or equivalently, $f^\\\\#_P(\\\\mathfrak{m}_{Y,
        f(P)}) \\\\subseteq \\\\mathfrak{m}_{X,P}$).\\n\\n---\\n\\n### Exercises for
        Chapter 2\\n\\n**Exercise 2.1.** Let $X$ be a topological space and $A$ an
        abelian group. The *constant presheaf* associated to $A$ assigns $A$ to every
        non-empty open set $U$ (with identity restrictions). Show that its sheafification,
        the *constant sheaf* $\\\\underline{A}$, can be described as follows: give
        $A$ the discrete topology, and for every open $U \\\\subseteq X$, $\\\\underline{A}(U)$
        is the group of continuous maps $U \\\\to A$ (i.e., locally constant functions
        on $U$).\\n\\n**Exercise 2.2.** Let $X = \\\\mathbb{C}$ with the classical
        (Euclidean) topology. Let $\\\\mathcal{O}$ be the sheaf of holomorphic functions
        on $X$, and $\\\\mathcal{O}^*$ the sheaf of nowhere-vanishing holomorphic
        functions (under multiplication). Prove that the exponential map $f \\\\mapsto
        \\\\exp(2\\\\pi i f)$ defines a short exact sequence of sheaves of abelian
        groups on $X$:\\n$$0 \\\\longrightarrow \\\\underline{\\\\mathbb{Z}} \\\\longrightarrow
        \\\\mathcal{O} \\\\xrightarrow{\\\\exp} \\\\mathcal{O}^* \\\\longrightarrow
        0.$$\\nFind an open subset $U \\\\subset \\\\mathbb{C}$ such that the map
        on sections $\\\\mathcal{O}(U) \\\\to \\\\mathcal{O}^*(U)$ is *not* surjective.\\n\\n**Exercise
        2.3 (Skyscraper Sheaves).** Let $X$ be a topological space, $P \\\\in X$ a
        point, and $A$ an abelian group. Define $i_P(A)$ by $i_P(A)(U) = A$ if $P
        \\\\in U$, and $0$ if $P \\\\notin U$. Prove that $i_P(A)$ is a sheaf, and
        describe its stalk $(i_P(A))_Q$ for all $Q \\\\in X$. Look at how $i_P(A)$
        relates to the pushforward $i_*A$, where $i : \\\\{P\\\\} \\\\hookrightarrow
        X$ is the inclusion.\\n\\n**Exercise 2.4.** Let $\\\\mathcal{F}$ be a sheaf
        of abelian groups on $X$, and $s \\\\in \\\\mathcal{F}(X)$ a global section.
        The *support* of $s$ is defined as $\\\\operatorname{Supp}(s) = \\\\{P \\\\in
        X \\\\mid s_P \\\\neq 0 \\\\text{ in } \\\\mathcal{F}_P\\\\}$. Prove that
        $\\\\operatorname{Supp}(s)$ is a closed subset of $X$. Show by example that
        the support of a sheaf, $\\\\operatorname{Supp}(\\\\mathcal{F}) = \\\\{P \\\\in
        X \\\\mid \\\\mathcal{F}_P \\\\neq 0\\\\}$, need *not* be closed.\\n\\n**Exercise
        2.5 (Gluing Sheaves).** Let $\\\\mathcal{B}$ be a basis for the topology of
        $X$. A *$\\\\mathcal{B}$-sheaf* is the assignment of an object $\\\\mathcal{F}(B)$
        to each $B \\\\in \\\\mathcal{B}$ and restriction maps for $B' \\\\subseteq
        B$ satisfying the sheaf axioms for coverings of basic open sets by basic open
        sets. Prove that any $\\\\mathcal{B}$-sheaf extends uniquely (up to canonical
        isomorphism) to a sheaf on $X$, and any morphism of $\\\\mathcal{B}$-sheaves
        extends uniquely to a morphism of sheaves on $X$.\\n\\n**Exercise 2.6.** Let
        $f : X \\\\to Y$ be a continuous map. Prove that $f_* : \\\\mathbf{Ab}(X)
        \\\\to \\\\mathbf{Ab}(Y)$ is a left-exact functor, and that $f^{-1} : \\\\mathbf{Ab}(Y)
        \\\\to \\\\mathbf{Ab}(X)$ is an exact functor.\\n\\n---\\n\\n## Chapter 3:
        Schemes and Morphisms\\n\\n### 3.1 The Spectrum of a Ring\\n\\nThroughout
        this chapter, all rings are assumed to be commutative with identity $1$.\\n\\n**Definition
        3.1.1.** Let $A$ be a ring. The *prime spectrum* of $A$, denoted $\\\\operatorname{Spec}
        A$, is the set of all prime ideals of $A$. For any subset $E \\\\subseteq
        A$, we define\\n$$V(E) = \\\\{ \\\\mathfrak{p} \\\\in \\\\operatorname{Spec}
        A \\\\mid E \\\\subseteq \\\\mathfrak{p} \\\\}.$$\\n\\n**Lemma 3.1.2.** *Let
        $A$ be a ring.*\\n1. *If $\\\\mathfrak{a}$ is the ideal generated by $E$,
        then $V(E) = V(\\\\mathfrak{a}) = V(\\\\sqrt{\\\\mathfrak{a}})$.*\\n2. *$V(0)
        = \\\\operatorname{Spec} A$ and $V(1) = \\\\emptyset$.*\\n3. *For any family
        of subsets $\\\\{E_i\\\\}_{i \\\\in I}$ of $A$, $V\\\\left(\\\\bigcup_{i \\\\in
        I} E_i\\\\right) = \\\\bigcap_{i \\\\in I} V(E_i)$.*\\n4. *For any ideals
        $\\\\mathfrak{a}, \\\\mathfrak{b} \\\\subseteq A$, $V(\\\\mathfrak{a}) \\\\cup
        V(\\\\mathfrak{b}) = V(\\\\mathfrak{a} \\\\cap \\\\mathfrak{b}) = V(\\\\mathfrak{a}\\\\mathfrak{b})$.*\\n\\n*Proof.*
        Identical to the proof of Lemma 1.1.2, replacing evaluation at $P$ with containment
        in $\\\\mathfrak{p}$ and using the defining property of a prime ideal: $\\\\mathfrak{a}\\\\mathfrak{b}
        \\\\subseteq \\\\mathfrak{p} \\\\implies \\\\mathfrak{a} \\\\subseteq \\\\mathfrak{p}$
        or $\\\\mathfrak{b} \\\\subseteq \\\\mathfrak{p}$. $\\\\blacksquare$\\n\\nBy
        Lemma 3.1.2, the sets $V(\\\\mathfrak{a})$ form the closed sets of a topology
        on $\\\\operatorname{Spec} A$, called the *Zariski topology*. For each element
        $f \\\\in A$, we define the *principal open set* (or *distinguished open set*)\\n$$D(f)
        = \\\\operatorname{Spec} A \\\\setminus V(f) = \\\\{ \\\\mathfrak{p} \\\\in
        \\\\operatorname{Spec} A \\\\mid f \\\\notin \\\\mathfrak{p} \\\\}.$$\\n\\n**Lemma
        3.1.3.** *Let $A$ be a ring and $f, g \\\\in A$.*\\n1. *$D(f) \\\\cap D(g)
        = D(fg)$.*\\n2. *$D(f) = \\\\emptyset \\\\iff f$ is nilpotent; $D(f) = \\\\operatorname{Spec}
        A \\\\iff f \\\\in A^\\\\times$.*\\n3. *The sets $D(f)$ for $f \\\\in A$ form
        a basis for the Zariski topology on $\\\\operatorname{Spec} A$.*\\n4. *$D(f)$
        is quasi-compact (every open cover has a finite subcover). In particular,
        $\\\\operatorname{Spec} A = D(1)$ is quasi-compact.*\\n\\n*Proof.* \\n(1)
        $\\\\mathfrak{p} \\\\in D(f) \\\\cap D(g) \\\\iff f \\\\notin \\\\mathfrak{p}$
        and $g \\\\notin \\\\mathfrak{p} \\\\iff fg \\\\notin \\\\mathfrak{p}$ (as
        $\\\\mathfrak{p}$ is prime) $\\\\iff \\\\mathfrak{p} \\\\in D(fg)$.\\n\\n(2)
        $D(f) = \\\\emptyset \\\\iff f \\\\in \\\\bigcap_{\\\\mathfrak{p} \\\\in \\\\operatorname{Spec}
        A} \\\\mathfrak{p} = \\\\sqrt{(0)}$ (the nilradical of $A$). Also $D(f) =
        \\\\operatorname{Spec} A \\\\iff f$ is not contained in any prime ideal $\\\\iff
        (f) = A \\\\iff f \\\\in A^\\\\times$.\\n\\n(3) Any open set is of the form
        $\\\\operatorname{Spec} A \\\\setminus V(E) = \\\\operatorname{Spec} A \\\\setminus
        \\\\bigcap_{f \\\\in E} V(f) = \\\\bigcup_{f \\\\in E} D(f)$.\\n\\n(4) Since
        the $D(g)$ form a basis, it suffices to show that if $D(f) \\\\subseteq \\\\bigcup_{i
        \\\\in I} D(g_i)$, there is a finite subcover. Taking complements, $V(f) \\\\supseteq
        \\\\bigcap_{i \\\\in I} V(g_i) = V(\\\\mathfrak{a})$, where $\\\\mathfrak{a}$
        is the ideal generated by $\\\\{g_i\\\\}_{i \\\\in I}$. Thus every prime ideal
        containing $\\\\mathfrak{a}$ also contains $f$, so $f \\\\in \\\\bigcap_{\\\\mathfrak{p}
        \\\\supseteq \\\\mathfrak{a}} \\\\mathfrak{p} = \\\\sqrt{\\\\mathfrak{a}}$.
        Hence $f^n \\\\in \\\\mathfrak{a}$ for some $n \\\\ge 1$. We can write $f^n
        = \\\\sum_{j=1}^m r_j g_{i_j}$ for a finite subset $\\\\{i_1, \\\\dots, i_m\\\\}
        \\\\subseteq I$ and $r_j \\\\in A$. Then $V(f) = V(f^n) \\\\supseteq V(g_{i_1},
        \\\\dots, g_{i_m}) = \\\\bigcap_{j=1}^m V(g_{i_j})$, so $D(f) \\\\subseteq
        \\\\bigcup_{j=1}^m D(g_{i_j})$. $\\\\blacksquare$\\n\\n**Definition 3.1.4.**
        We now construct the *structure sheaf* $\\\\mathcal{O}_{\\\\operatorname{Spec}
        A}$ on $X = \\\\operatorname{Spec} A$. For each open set $U \\\\subseteq \\\\operatorname{Spec}
        A$, we define $\\\\mathcal{O}_X(U)$ to be the set of functions\\n$$s : U \\\\longrightarrow
        \\\\bigsqcup_{\\\\mathfrak{p} \\\\in U} A_\\\\mathfrak{p}$$\\nsuch that $s(\\\\mathfrak{p})
        \\\\in A_\\\\mathfrak{p}$ for each $\\\\mathfrak{p} \\\\in U$, and such that
        $s$ is locally a quotient of elements of $A$: for each $\\\\mathfrak{p} \\\\in
        U$, there is an open neighborhood $V \\\\subseteq U$ of $\\\\mathfrak{p}$
        and elements $a, f \\\\in A$ such that for every $\\\\mathfrak{q} \\\\in V$,
        we have $f \\\\notin \\\\mathfrak{q}$ and $s(\\\\mathfrak{q}) = a/f$ in $A_\\\\mathfrak{q}$.\\n\\nWith
        pointwise addition and multiplication, and natural restriction of functions,
        $\\\\mathcal{O}_X$ is clearly a sheaf of commutative rings on $X$.\\n\\n**Theorem
        3.1.5.** *Let $A$ be a ring and $(X, \\\\mathcal{O}_X) = (\\\\operatorname{Spec}
        A, \\\\mathcal{O}_{\\\\operatorname{Spec} A})$.*\\n1. *For any $\\\\mathfrak{p}
        \\\\in X$, the stalk $\\\\mathcal{O}_{X, \\\\mathfrak{p}}$ is canonically
        isomorphic to the local ring $A_\\\\mathfrak{p}$.*\\n2. *For any $f \\\\in
        A$, the ring $\\\\Gamma(D(f), \\\\mathcal{O}_X)$ is canonically isomorphic
        to the localized ring $A_f$. In particular, taking $f = 1$, $\\\\Gamma(X,
        \\\\mathcal{O}_X) \\\\cong A$.*\\n\\n*Proof.* \\n(1) Define a homomorphism
        $\\\\mathcal{O}_{X, \\\\mathfrak{p}} \\\\to A_\\\\mathfrak{p}$ by sending
        the germ of $s \\\\in \\\\mathcal{O}_X(U)$ at $\\\\mathfrak{p}$ to $s(\\\\mathfrak{p})
        \\\\in A_\\\\mathfrak{p}$. This map is surjective because any element $a/f
        \\\\in A_\\\\mathfrak{p}$ ($f \\\\notin \\\\mathfrak{p}$) is the value at
        $\\\\mathfrak{p}$ of the section $s \\\\in \\\\mathcal{O}_X(D(f))$ defined
        by $\\\\mathfrak{q} \\\\mapsto a/f \\\\in A_\\\\mathfrak{q}$. It is injective
        because if $s(\\\\mathfrak{p}) = 0$, then on some neighborhood $V$ of $\\\\mathfrak{p}$,
        $s$ is given by $a/f$. Since $a/f = 0$ in $A_\\\\mathfrak{p}$, there exists
        $h \\\\in A \\\\setminus \\\\mathfrak{p}$ such that $ha = 0$ in $A$. Then
        on the open neighborhood $V \\\\cap D(h)$ of $\\\\mathfrak{p}$, for every
        $\\\\mathfrak{q} \\\\in V \\\\cap D(h)$ we have $h \\\\notin \\\\mathfrak{q}$
        and $ha = 0$, so $s(\\\\mathfrak{q}) = a/f = 0$ in $A_\\\\mathfrak{q}$. Thus
        the germ of $s$ at $\\\\mathfrak{p}$ is zero.\\n\\n(2) Define a ring homomorphism
        $\\\\psi : A_f \\\\to \\\\mathcal{O}_X(D(f))$ by sending $a/f^n$ to the section
        $\\\\mathfrak{q} \\\\mapsto a/f^n \\\\in A_\\\\mathfrak{q}$ (which is well-defined
        since $f \\\\notin \\\\mathfrak{q}$ for all $\\\\mathfrak{q} \\\\in D(f)$).\\n\\n*Step
        1: $\\\\psi$ is injective.* Suppose $\\\\psi(a/f^n) = 0$. Then for every $\\\\mathfrak{q}
        \\\\in D(f)$, $a/f^n = 0$ in $A_\\\\mathfrak{q}$, so there exists $h \\\\notin
        \\\\mathfrak{q}$ such that $ha = 0$ in $A$. Let $\\\\mathfrak{a} = \\\\operatorname{Ann}_A(a)
        = \\\\{r \\\\in A \\\\mid ra = 0\\\\}$. Then for every $\\\\mathfrak{q} \\\\in
        D(f)$, since $h \\\\in \\\\mathfrak{a}$ and $h \\\\notin \\\\mathfrak{q}$,
        we have $\\\\mathfrak{a} \\\\not\\\\subseteq \\\\mathfrak{q}$, which means
        $\\\\mathfrak{q} \\\\notin V(\\\\mathfrak{a})$. Thus $D(f) \\\\cap V(\\\\mathfrak{a})
        = \\\\emptyset$, or $V(\\\\mathfrak{a}) \\\\subseteq V(f)$. By Lemma 3.1.2,
        $f \\\\in \\\\sqrt{\\\\mathfrak{a}}$, so $f^m \\\\in \\\\mathfrak{a}$ for
        some $m \\\\ge 1$. Hence $f^m a = 0$ in $A$, which implies $a/f^n = (f^m a)/f^{n+m}
        = 0$ in $A_f$. Thus $\\\\psi$ is injective.\\n\\n*Step 2: $\\\\psi$ is surjective.*
        Let $s \\\\in \\\\mathcal{O}_X(D(f))$. By definition of $\\\\mathcal{O}_X$,
        we can cover $D(f)$ by open sets $V_i$ on which $s$ is represented by a quotient
        $a_i / g_i$ with $g_i \\\\notin \\\\mathfrak{q}$ for all $\\\\mathfrak{q}
        \\\\in V_i$ (i.e., $V_i \\\\subseteq D(g_i)$). Since the principal open sets
        form a basis, we may shrink $V_i$ to assume $V_i = D(h_i)$ for some $h_i \\\\in
        A$. Since $D(h_i) \\\\subseteq D(g_i)$, we have $V(g_i) \\\\subseteq V(h_i)$,
        so $h_i \\\\in \\\\sqrt{(g_i)}$, meaning $h_i^k = c_i g_i$ for some $k \\\\ge
        1$ and $c_i \\\\in A$. Then $\\\\frac{a_i}{g_i} = \\\\frac{c_i a_i}{h_i^k}$.
        Replacing $h_i$ by $h_i^k$ (note that $D(h_i^k) = D(h_i)$) and $a_i$ by $c_i
        a_i$, we find that $D(f)$ is covered by open sets $D(h_i)$ on which $s$ is
        represented by $a_i / h_i$.\\n\\nBy Lemma 3.1.3(4), $D(f)$ is quasi-compact,
        so we may assume this cover is finite: $D(f) = \\\\bigcup_{i=1}^r D(h_i)$.
        For each pair $i, j$, on the intersection $D(h_i) \\\\cap D(h_j) = D(h_i h_j)$,
        the section $\\\\left.s\\\\right|_{D(h_i h_j)}$ is represented by both $a_i/h_i
        = (a_i h_j)/(h_i h_j)$ and $a_j/h_j = (a_j h_i)/(h_i h_j)$. By the injectivity
        of $\\\\psi$ applied to the open set $D(h_i h_j)$, the elements $a_i/h_i$
        and $a_j/h_j$ are equal in $A_{h_i h_j}$. Thus there exists an integer $N_{ij}
        \\\\ge 1$ such that\\n$$(h_i h_j)^{N_{ij}} (a_i h_j - a_j h_i) = 0 \\\\quad
        \\\\text{in } A.$$\\nSince there are only finitely many pairs $(i,j)$, we
        can choose a single large integer $N$ that works for all $i, j$:\\n$$(h_i
        h_j)^N (a_i h_j - a_j h_i) = 0 \\\\implies h_i^{N+1} (h_j^N a_j) = h_j^{N+1}
        (h_i^N a_i).$$\\nRewrite $h_i' = h_i^{N+1}$ and $a_i' = h_i^N a_i$. Then $D(h_i')
        = D(h_i)$, $s$ is still represented on $D(h_i')$ by $a_i'/h_i' = a_i/h_i$,
        and we now have the exact compatibility relation in $A$:\\n$$h_i' a_j' = h_j'
        a_i' \\\\quad \\\\text{for all } 1 \\\\le i, j \\\\le r.$$\\nFinally, since
        $D(f) \\\\subseteq \\\\bigcup_{i=1}^r D(h_i')$, we saw in the proof of Lemma
        3.1.3(4) that $f \\\\in \\\\sqrt{(h_1', \\\\dots, h_r')}$, so for some integer
        $M \\\\ge 1$, we can write\\n$$f^M = \\\\sum_{i=1}^r b_i h_i' \\\\quad \\\\text{with
        } b_i \\\\in A.$$\\nDefine $a = \\\\sum_{i=1}^r b_i a_i' \\\\in A$. Then for
        every $j \\\\in \\\\{1, \\\\dots, r\\\\}$, we compute in $A$:\\n$$h_j' a =
        \\\\sum_{i=1}^r b_i h_j' a_i' = \\\\sum_{i=1}^r b_i h_i' a_j' = \\\\left(\\\\sum_{i=1}^r
        b_i h_i'\\\\right) a_j' = f^M a_j'.$$\\nTherefore, for any $\\\\mathfrak{q}
        \\\\in D(h_j')$, we have $\\\\frac{a}{f^M} = \\\\frac{a_j'}{h_j'} = s(\\\\mathfrak{q})$
        in $A_\\\\mathfrak{q}$. Since the $D(h_j')$ cover $D(f)$, this means $\\\\psi(a/f^M)
        = s$. Thus $\\\\psi$ is surjective. $\\\\blacksquare$\\n\\n---\\n\\n### 3.2
        The Category of Schemes\\n\\n**Definition 3.2.1.** An *affine scheme* is a
        locally ringed space $(X, \\\\mathcal{O}_X)$ which is isomorphic (as a locally
        ringed space) to $(\\\\operatorname{Spec} A, \\\\mathcal{O}_{\\\\operatorname{Spec}
        A})$ for some ring $A$. A *scheme* is a locally ringed space $(X, \\\\mathcal{O}_X)$
        in which every point has an open neighborhood $U \\\\subseteq X$ such that
        the topological space $U$, together with the restricted sheaf $\\\\left.\\\\mathcal{O}_X\\\\right|_U$,
        is an affine scheme. A *morphism of schemes* is a morphism of the underlying
        locally ringed spaces. The category of schemes is denoted $\\\\mathbf{Sch}$.\\n\\n**Theorem
        3.2.2.** *Let $A$ be a ring and $(X, \\\\mathcal{O}_X)$ be any scheme. The
        map*\\n$$\\\\alpha : \\\\operatorname{Hom}_{\\\\mathbf{Sch}}(X, \\\\operatorname{Spec}
        A) \\\\longrightarrow \\\\operatorname{Hom}_{\\\\mathbf{Ring}}(A, \\\\Gamma(X,
        \\\\mathcal{O}_X))$$\\n*given by sending $(f, f^\\\\#)$ to the global sections
        map $f^\\\\#(\\\\operatorname{Spec} A) : A \\\\cong \\\\Gamma(\\\\operatorname{Spec}
        A, \\\\mathcal{O}_{\\\\operatorname{Spec} A}) \\\\to \\\\Gamma(X, \\\\mathcal{O}_X)$
        is a bijection. In particular, the functor $\\\\operatorname{Spec} : \\\\mathbf{Ring}^{\\\\text{op}}
        \\\\to \\\\mathbf{AffSch}$ is an equivalence of categories.*\\n\\n*Proof.*
        First, suppose $X = \\\\operatorname{Spec} B$ is affine, and let $\\\\varphi
        : A \\\\to B$ be a ring homomorphism. We construct a morphism of locally ringed
        spaces $(f, f^\\\\#) : \\\\operatorname{Spec} B \\\\to \\\\operatorname{Spec}
        A$. For any $\\\\mathfrak{q} \\\\in \\\\operatorname{Spec} B$, define $f(\\\\mathfrak{q})
        = \\\\varphi^{-1}(\\\\mathfrak{q}) \\\\in \\\\operatorname{Spec} A$. For any
        $a \\\\in A$, $f^{-1}(D(a)) = \\\\{\\\\mathfrak{q} \\\\in \\\\operatorname{Spec}
        B \\\\mid \\\\varphi^{-1}(\\\\mathfrak{q}) \\\\in D(a)\\\\} = \\\\{\\\\mathfrak{q}
        \\\\in \\\\operatorname{Spec} B \\\\mid \\\\varphi(a) \\\\notin \\\\mathfrak{q}\\\\}
        = D(\\\\varphi(a))$, which is open in $\\\\operatorname{Spec} B$. Since the
        $D(a)$ form a basis, $f$ is continuous.\\n\\nFor each $\\\\mathfrak{q} \\\\in
        \\\\operatorname{Spec} B$, $\\\\varphi$ localizes to a local ring homomorphism
        $\\\\varphi_\\\\mathfrak{q} : A_{\\\\varphi^{-1}(\\\\mathfrak{q})} = A_{f(\\\\mathfrak{q})}
        \\\\to B_\\\\mathfrak{q}$. For any open $V \\\\subseteq \\\\operatorname{Spec}
        A$, we define $f^\\\\#(V) : \\\\mathcal{O}_{\\\\operatorname{Spec} A}(V) \\\\to
        \\\\mathcal{O}_{\\\\operatorname{Spec} B}(f^{-1}(V))$ by sending a section
        $s : V \\\\to \\\\bigsqcup_{\\\\mathfrak{p} \\\\in V} A_\\\\mathfrak{p}$ to
        the section $f^\\\\#(V)(s) : \\\\mathfrak{q} \\\\mapsto \\\\varphi_\\\\mathfrak{q}(s(f(\\\\mathfrak{q})))$.
        Because $s$ is locally of the form $a/g$, $f^\\\\#(V)(s)$ is locally of the
        form $\\\\varphi(a)/\\\\varphi(g)$, hence is a valid section of $\\\\mathcal{O}_{\\\\operatorname{Spec}
        B}(f^{-1}(V))$. The induced map on stalks at $\\\\mathfrak{q}$ is precisely
        $\\\\varphi_\\\\mathfrak{q}$, which is a local homomorphism. Thus $(f, f^\\\\#)$
        is a morphism of locally ringed spaces, and on global sections it induces
        $\\\\varphi : A \\\\to B$.\\n\\nNow let $X$ be an arbitrary scheme, and let
        $\\\\varphi : A \\\\to \\\\Gamma(X, \\\\mathcal{O}_X)$ be a ring homomorphism.
        We show there is a unique morphism $(f, f^\\\\#) : X \\\\to \\\\operatorname{Spec}
        A$ inducing $\\\\varphi$.\\n\\n*Uniqueness:* Suppose $(f, f^\\\\#)$ induces
        $\\\\varphi$. For any $P \\\\in X$, consider the commutative diagram of ring
        homomorphisms induced by the restriction from global sections to the stalk
        at $P$:\\n$$\\\\begin{array}{ccc}\\nA = \\\\Gamma(\\\\operatorname{Spec} A,
        \\\\mathcal{O}_{\\\\operatorname{Spec} A}) & \\\\xrightarrow{\\\\varphi} &
        \\\\Gamma(X, \\\\mathcal{O}_X) \\\\\\\\\\n\\\\downarrow{\\\\text{loc}} & &
        \\\\downarrow{\\\\text{germ}_P} \\\\\\\\\\nA_{f(P)} \\\\cong \\\\mathcal{O}_{\\\\operatorname{Spec}
        A, f(P)} & \\\\xrightarrow{f^\\\\#_P} & \\\\mathcal{O}_{X, P}\\n\\\\end{array}$$\\nSince
        $(f, f^\\\\#)$ is a morphism of locally ringed spaces, $f^\\\\#_P$ is a local
        homomorphism, so $(f^\\\\#_P)^{-1}(\\\\mathfrak{m}_{X,P}) = \\\\mathfrak{m}_{f(P)}
        = f(P) A_{f(P)}$. Pulling this back to $A$ via the localization map $A \\\\to
        A_{f(P)}$ (noting that the preimage of $f(P) A_{f(P)}$ in $A$ is precisely
        the prime ideal $f(P)$), the commutativity of the diagram forces\\n$$f(P)
        = (\\\\operatorname{germ}_P \\\\circ \\\\varphi)^{-1}(\\\\mathfrak{m}_{X,P}).$$\\nThus
        the continuous map $f : X \\\\to \\\\operatorname{Spec} A$ is uniquely determined
        by $\\\\varphi$. Furthermore, by the universal property of localization, the
        local homomorphism $f^\\\\#_P : A_{f(P)} \\\\to \\\\mathcal{O}_{X,P}$ is uniquely
        determined by $\\\\operatorname{germ}_P \\\\circ \\\\varphi$. Since a morphism
        of sheaves $f^\\\\#$ is uniquely determined by its maps on all stalks $f^\\\\#_P$,
        $f^\\\\#$ is also uniquely determined by $\\\\varphi$. Thus $\\\\alpha$ is
        injective.\\n\\n*Existence:* Let $\\\\{U_i\\\\}$ be an open affine covering
        of $X$, with $U_i \\\\cong \\\\operatorname{Spec} B_i$. Composing $\\\\varphi
        : A \\\\to \\\\Gamma(X, \\\\mathcal{O}_X)$ with the restriction map $\\\\Gamma(X,
        \\\\mathcal{O}_X) \\\\to \\\\Gamma(U_i, \\\\mathcal{O}_X) \\\\cong B_i$ gives
        a ring homomorphism $\\\\varphi_i : A \\\\to B_i$. By the first paragraph
        of the proof, $\\\\varphi_i$ induces a morphism of schemes $(f_i, f_i^\\\\#)
        : U_i \\\\to \\\\operatorname{Spec} A$. On the overlap $U_i \\\\cap U_j$,
        both restrictions $\\\\left.(f_i, f_i^\\\\#)\\\\right|_{U_i \\\\cap U_j}$
        and $\\\\left.(f_j, f_j^\\\\#)\\\\right|_{U_i \\\\cap U_j}$ induce the exact
        same ring homomorphism $A \\\\xrightarrow{\\\\varphi} \\\\Gamma(X, \\\\mathcal{O}_X)
        \\\\to \\\\Gamma(U_i \\\\cap U_j, \\\\mathcal{O}_X)$. By the uniqueness already
        proven (applied to the scheme $U_i \\\\cap U_j$), these two morphisms agree
        on $U_i \\\\cap U_j$. Therefore, the continuous maps $f_i$ glue to a unique
        continuous map $f : X \\\\to \\\\operatorname{Spec} A$, and the sheaf morphisms
        $f_i^\\\\#$ glue to a unique morphism $f^\\\\# : \\\\mathcal{O}_{\\\\operatorname{Spec}
        A} \\\\to f_*\\\\mathcal{O}_X$ recovering $\\\\varphi$ on global sections.
        Thus $\\\\alpha$ is surjective. $\\\\blacksquare$\\n\\n**Definition 3.2.3.**
        A scheme $X$ is:\\n- *connected* if its topological space is connected;\\n-
        *irreducible* if its topological space is irreducible;\\n- *reduced* if for
        every open set $U \\\\subseteq X$, the ring $\\\\mathcal{O}_X(U)$ has no non-zero
        nilpotent elements (equivalently, $\\\\mathcal{O}_{X,P}$ is reduced for all
        $P \\\\in X$);\\n- *integral* if for every non-empty open set $U \\\\subseteq
        X$, the ring $\\\\mathcal{O}_X(U)$ is an integral domain.\\n\\n**Proposition
        3.2.4.** *A scheme $X$ is integral if and only if it is both reduced and irreducible.*\\n\\n*Proof.*
        ($\\\\Rightarrow$) Suppose $X$ is integral. Then $\\\\mathcal{O}_X(U)$ is
        an integral domain for every non-empty $U$, so $X$ is reduced. If $X$ were
        reducible, we could write $X = Y_1 \\\\cup Y_2$ with $Y_1, Y_2$ proper closed
        subsets. Then $U_1 = X \\\\setminus Y_1$ and $U_2 = X \\\\setminus Y_2$ are
        non-empty disjoint open subsets. By the sheaf axioms, $\\\\mathcal{O}_X(U_1
        \\\\cup U_2) \\\\cong \\\\mathcal{O}_X(U_1) \\\\times \\\\mathcal{O}_X(U_2)$,
        which is not an integral domain since both factors are non-zero rings (as
        $U_1, U_2 \\\\neq \\\\emptyset$), a contradiction.\\n\\n($\\\\Leftarrow$)
        Suppose $X$ is reduced and irreducible, and let $U \\\\subseteq X$ be non-empty
        open. Suppose $f, g \\\\in \\\\mathcal{O}_X(U)$ satisfy $fg = 0$. For each
        $P \\\\in U$, let $f_P, g_P \\\\in \\\\mathcal{O}_{X,P}$ be their germs, and
        define $Y_1 = \\\\{P \\\\in U \\\\mid f_P \\\\in \\\\mathfrak{m}_{X,P}\\\\}$
        and $Y_2 = \\\\{P \\\\in U \\\\mid g_P \\\\in \\\\mathfrak{m}_{X,P}\\\\}$.
        On any affine open subset $\\\\operatorname{Spec} A \\\\subseteq U$, $Y_1
        \\\\cap \\\\operatorname{Spec} A = V(\\\\left.f\\\\right|_{\\\\operatorname{Spec}
        A})$, so $Y_1$ and $Y_2$ are closed subsets of $U$. Since $fg = 0$, for every
        $P \\\\in U$, $f_P g_P = 0 \\\\in \\\\mathfrak{m}_{X,P}$; as $\\\\mathfrak{m}_{X,P}$
        is prime, $U = Y_1 \\\\cup Y_2$. Since $X$ is irreducible, any non-empty open
        subset $U$ is irreducible, so $U = Y_1$ or $U = Y_2$, say $U = Y_1$. Then
        on every affine open $\\\\operatorname{Spec} A \\\\subseteq U$, $\\\\left.f\\\\right|_{\\\\operatorname{Spec}
        A}$ lies in every prime ideal of $A$, hence is nilpotent. Since $X$ is reduced,
        $\\\\left.f\\\\right|_{\\\\operatorname{Spec} A} = 0$. As affine opens cover
        $U$, $f = 0$ by the Locality axiom. $\\\\blacksquare$\\n\\n---\\n\\n### 3.3
        Projective Schemes and the Proj Construction\\n\\nLet $S = \\\\bigoplus_{d
        \\\\ge 0} S_d$ be a graded ring. The *irrelevant ideal* is $S_+ = \\\\bigoplus_{d
        \\u003e 0} S_d$.\\n\\n**Definition 3.3.1.** We define $\\\\operatorname{Proj}
        S$ to be the set of all homogeneous prime ideals $\\\\mathfrak{p}$ of $S$
        such that $S_+ \\\\not\\\\subseteq \\\\mathfrak{p}$. For any homogeneous ideal
        $\\\\mathfrak{a} \\\\subseteq S$, we set $V_+(\\\\mathfrak{a}) = \\\\{\\\\mathfrak{p}
        \\\\in \\\\operatorname{Proj} S \\\\mid \\\\mathfrak{a} \\\\subseteq \\\\mathfrak{p}\\\\}$.\\n\\nJust
        as for $\\\\operatorname{Spec} A$, the sets $V_+(\\\\mathfrak{a})$ satisfy
        the axioms for closed sets of a topology on $\\\\operatorname{Proj} S$, called
        the Zariski topology. For any homogeneous element $f \\\\in S_+$ (of degree
        $d \\u003e 0$), we define the basic open set\\n$$D_+(f) = \\\\operatorname{Proj}
        S \\\\setminus V_+(f) = \\\\{ \\\\mathfrak{p} \\\\in \\\\operatorname{Proj}
        S \\\\mid f \\\\notin \\\\mathfrak{p} \\\\}.$$\\nSince every $\\\\mathfrak{p}
        \\\\in \\\\operatorname{Proj} S$ does not contain $S_+$, the sets $D_+(f)$
        for homogeneous $f \\\\in S_+$ cover $\\\\operatorname{Proj} S$ and form a
        basis for its topology.\\n\\nFor $\\\\mathfrak{p} \\\\in \\\\operatorname{Proj}
        S$, let $T$ be the multiplicative system of all homogeneous elements of $S$
        not in $\\\\mathfrak{p}$. The localized ring $T^{-1}S$ has a natural $\\\\mathbb{Z}$-grading
        given by $\\\\deg(a/t) = \\\\deg a - \\\\deg t$. We define $S_{(\\\\mathfrak{p})}$
        to be the subring of elements of degree $0$ in $T^{-1}S$:\\n$$S_{(\\\\mathfrak{p})}
        = \\\\left\\\\{ \\\\frac{a}{t} \\\\in T^{-1}S \\\\;\\\\middle|\\\\; a \\\\in
        S_m, t \\\\in S_m \\\\setminus \\\\mathfrak{p} \\\\text{ for some } m \\\\ge
        0 \\\\right\\\\}.$$\\nSimilarly, for a homogeneous element $f \\\\in S_+$,
        we define $S_{(f)}$ to be the subring of elements of degree $0$ in the localized
        ring $S_f$:\\n$$S_{(f)} = \\\\left\\\\{ \\\\frac{a}{f^n} \\\\in S_f \\\\;\\\\middle|\\\\;
        n \\\\ge 0, a \\\\in S_{n \\\\deg f} \\\\right\\\\}.$$\\nNote that $S_{(\\\\mathfrak{p})}$
        is a local ring with maximal ideal $\\\\mathfrak{m}_{(\\\\mathfrak{p})} =
        \\\\{a/t \\\\in S_{(\\\\mathfrak{p})} \\\\mid a \\\\in \\\\mathfrak{p}\\\\}$.\\n\\n**Definition
        3.3.2.** For each open set $U \\\\subseteq \\\\operatorname{Proj} S$, we define
        $\\\\mathcal{O}_{\\\\operatorname{Proj} S}(U)$ to be the set of functions
        $s : U \\\\to \\\\bigsqcup_{\\\\mathfrak{p} \\\\in U} S_{(\\\\mathfrak{p})}$
        such that $s(\\\\mathfrak{p}) \\\\in S_{(\\\\mathfrak{p})}$ for all $\\\\mathfrak{p}
        \\\\in U$, and locally around each $\\\\mathfrak{p} \\\\in U$ on some neighborhood
        $V \\\\subseteq U$, $s(\\\\mathfrak{q}) = a/f$ for all $\\\\mathfrak{q} \\\\in
        V$, where $a, f \\\\in S$ are homogeneous of the same degree with $f \\\\notin
        \\\\mathfrak{q}$.\\n\\n**Proposition 3.3.3.** *Let $S$ be a graded ring and
        $X = \\\\operatorname{Proj} S$.*\\n1. *For each $\\\\mathfrak{p} \\\\in X$,
        the stalk $\\\\mathcal{O}_{X, \\\\mathfrak{p}}$ is canonically isomorphic
        to $S_{(\\\\mathfrak{p})}$.*\\n2. *For each homogeneous element $f \\\\in
        S_+$, there is a canonical isomorphism of locally ringed spaces*\\n$$\\\\varphi_f
        : (D_+(f), \\\\left.\\\\mathcal{O}_X\\\\right|_{D_+(f)}) \\\\xrightarrow{\\\\sim}
        \\\\operatorname{Spec} S_{(f)}.$$\\n*Consequently, $(\\\\operatorname{Proj}
        S, \\\\mathcal{O}_{\\\\operatorname{Proj} S})$ is a scheme.*\\n\\n*Proof.*
        (1) The proof is identical to Theorem 3.1.5(1).\\n\\n(2) Let $f \\\\in S_d$
        with $d \\u003e 0$. Define a map of sets $\\\\varphi_f : D_+(f) \\\\to \\\\operatorname{Spec}
        S_{(f)}$ by sending a homogeneous prime $\\\\mathfrak{p} \\\\in D_+(f)$ to
        $\\\\varphi_f(\\\\mathfrak{p}) = (\\\\mathfrak{p} S_f) \\\\cap S_{(f)} = \\\\{a/f^n
        \\\\in S_{(f)} \\\\mid a \\\\in \\\\mathfrak{p}\\\\}$. Clearly $\\\\varphi_f(\\\\mathfrak{p})$
        is a prime ideal of $S_{(f)}$.\\n\\nTo show $\\\\varphi_f$ is bijective, let
        $\\\\mathfrak{q} \\\\in \\\\operatorname{Spec} S_{(f)}$. For each $m \\\\ge
        0$, define $\\\\mathfrak{p}_m = \\\\{a \\\\in S_m \\\\mid a^d / f^m \\\\in
        \\\\mathfrak{q}\\\\}$, and set $\\\\mathfrak{p} = \\\\bigoplus_{m \\\\ge 0}
        \\\\mathfrak{p}_m$. Let us check that $\\\\mathfrak{p}_m$ is an additive subgroup
        of $S_m$: if $a, b \\\\in \\\\mathfrak{p}_m$, then in $S_{(f)}$,\\n$$\\\\left(\\\\frac{(a+b)^d}{f^m}\\\\right)^{2d}
        = \\\\sum_{k=0}^{2d^2} \\\\binom{2d^2}{k} \\\\frac{a^k b^{2d^2-k}}{f^{2dm}}.$$\\nIn
        each term of the sum, either $k \\\\ge d^2$ or $2d^2 - k \\\\ge d^2$. If $k
        \\\\ge d^2$, we can factor out $(a^d/f^m)^d \\\\in \\\\mathfrak{q}$ while
        keeping the remaining factor homogeneous of degree $0$ in $S_f$:\\n$$\\\\frac{a^k
        b^{2d^2-k}}{f^{2dm}} = \\\\left(\\\\frac{a^d}{f^m}\\\\right)^d \\\\cdot \\\\left(\\\\frac{a^{k-d^2}
        b^{2d^2-k}}{f^{dm}}\\\\right) \\\\in \\\\mathfrak{q}.$$\\nSince $\\\\mathfrak{q}$
        is an ideal, the entire sum lies in $\\\\mathfrak{q}$. Since $\\\\mathfrak{q}$
        is prime, $(a+b)^d / f^m \\\\in \\\\mathfrak{q}$, so $a + b \\\\in \\\\mathfrak{p}_m$.
        Furthermore, if $a \\\\in S_m, b \\\\in S_l$ satisfy $ab \\\\in \\\\mathfrak{p}_{m+l}$,
        then $(a^d/f^m)(b^d/f^l) = (ab)^d / f^{m+l} \\\\in \\\\mathfrak{q}$, so $a
        \\\\in \\\\mathfrak{p}_m$ or $b \\\\in \\\\mathfrak{p}_l$. Hence $\\\\mathfrak{p}$
        is a homogeneous prime ideal of $S$. Since $f^d / f^d = 1 \\\\notin \\\\mathfrak{q}$,
        $f \\\\notin \\\\mathfrak{p}$, so $\\\\mathfrak{p} \\\\in D_+(f)$. It is immediate
        that $\\\\mathfrak{q} \\\\mapsto \\\\mathfrak{p}$ is the two-sided inverse
        to $\\\\varphi_f$.\\n\\nMoreover, for any homogeneous element $g \\\\in S_m$,
        let $h = g^d / f^m \\\\in S_{(f)}$. Then $\\\\mathfrak{p} \\\\in D_+(fg) \\\\iff
        g \\\\notin \\\\mathfrak{p} \\\\iff h \\\\notin \\\\varphi_f(\\\\mathfrak{p})
        \\\\iff \\\\varphi_f(\\\\mathfrak{p}) \\\\in D(h) \\\\subseteq \\\\operatorname{Spec}
        S_{(f)}$. Thus $\\\\varphi_f$ maps the basic open sets $D_+(fg)$ of $D_+(f)$
        bijectively onto the basic open sets $D(h)$ of $\\\\operatorname{Spec} S_{(f)}$,
        so $\\\\varphi_f$ is a homeomorphism.\\n\\nFinally, for each $\\\\mathfrak{p}
        \\\\in D_+(f)$, the natural localization map $(S_{(f)})_{\\\\varphi_f(\\\\mathfrak{p})}
        \\\\to S_{(\\\\mathfrak{p})}$ sending $(a/f^n)/(b/f^m)$ to $(a f^m)/(b f^n)$
        is clearly an isomorphism of local rings. Comparing Definition 3.3.2 with
        Definition 3.1.4 shows that $\\\\varphi_f$ identifies $\\\\left.\\\\mathcal{O}_X\\\\right|_{D_+(f)}$
        with $\\\\mathcal{O}_{\\\\operatorname{Spec} S_{(f)}}$. $\\\\blacksquare$\\n\\n**Definition
        3.3.4.** For any ring $A$ and integer $n \\\\ge 0$, *projective $n$-space
        over $A$* is defined as the scheme $\\\\mathbb{P}^n_A = \\\\operatorname{Proj}
        A[x_0, \\\\dots, x_n]$, where the polynomial ring is graded by total degree.
        By Proposition 3.3.3, $\\\\mathbb{P}^n_A$ is covered by the $n+1$ standard
        affine open subsets $U_i = D_+(x_i) \\\\cong \\\\operatorname{Spec} A[x_0/x_i,
        \\\\dots, x_n/x_i] \\\\cong \\\\mathbb{A}^n_A$.\\n\\n---\\n\\n### 3.4 Fiber
        Products of Schemes\\n\\n**Definition 3.4.1.** Let $S$ be a scheme, and let
        $X \\\\to S$ and $Y \\\\to S$ be two schemes over $S$ ($S$-schemes). A *fiber
        product* of $X$ and $Y$ over $S$, denoted $X \\\\times_S Y$, is a scheme equipped
        with projection morphisms $p_1 : X \\\\times_S Y \\\\to X$ and $p_2 : X \\\\times_S
        Y \\\\to Y$ making the diagram commute over $S$, satisfying the universal
        property: for any scheme $Z$ and morphisms $f : Z \\\\to X$ and $g : Z \\\\to
        Y$ whose compositions to $S$ are equal, there exists a unique morphism $\\\\theta
        : Z \\\\to X \\\\times_S Y$ such that $p_1 \\\\circ \\\\theta = f$ and $p_2
        \\\\circ \\\\theta = g$.\\n\\n**Theorem 3.4.2.** *For any two morphisms of
        schemes $X \\\\to S$ and $Y \\\\to S$, the fiber product $X \\\\times_S Y$
        exists in the category of schemes, and is unique up to unique isomorphism.*\\n\\n*Proof.*
        Uniqueness is standard from the universal property. We prove existence in
        four steps by gluing.\\n\\n*Step 1: $X, Y, S$ are all affine.* Let $X = \\\\operatorname{Spec}
        A$, $Y = \\\\operatorname{Spec} B$, and $S = \\\\operatorname{Spec} R$. The
        morphisms to $S$ correspond by Theorem 3.2.2 to ring homomorphisms $R \\\\to
        A$ and $R \\\\to B$. Let $W = \\\\operatorname{Spec}(A \\\\otimes_R B)$, with
        projection maps $p_1 : W \\\\to X$ and $p_2 : W \\\\to Y$ induced by $a \\\\mapsto
        a \\\\otimes 1$ and $b \\\\mapsto 1 \\\\otimes b$. For any scheme $Z$, Theorem
        3.2.2 gives\\n$$\\\\operatorname{Hom}_{\\\\mathbf{Sch}}(Z, \\\\operatorname{Spec}(A
        \\\\otimes_R B)) \\\\cong \\\\operatorname{Hom}_{\\\\mathbf{Ring}}(A \\\\otimes_R
        B, \\\\Gamma(Z, \\\\mathcal{O}_Z)).$$\\nBy the universal property of the tensor
        product of rings over $R$, a ring homomorphism from $A \\\\otimes_R B$ to
        $\\\\Gamma(Z, \\\\mathcal{O}_Z)$ is equivalent to a pair of ring homomorphisms
        from $A$ and $B$ to $\\\\Gamma(Z, \\\\mathcal{O}_Z)$ that agree on $R$. Applying
        Theorem 3.2.2 again, this is equivalent to a pair of scheme morphisms $Z \\\\to
        X$ and $Z \\\\to Y$ that agree on $S$. Thus $\\\\operatorname{Spec}(A \\\\otimes_R
        B)$ is the fiber product $X \\\\times_S Y$.\\n\\n*Step 2: Reduction to Open
        Subschemes.* Suppose $X \\\\times_S Y$ exists, and let $U \\\\subseteq X$
        be an open subscheme. Set $W = p_1^{-1}(U) \\\\subseteq X \\\\times_S Y$,
        equipped with the restricted projections $\\\\left.p_1\\\\right|_W : W \\\\to
        U$ and $\\\\left.p_2\\\\right|_W : W \\\\to Y$. If $f : Z \\\\to U$ and $g
        : Z \\\\to Y$ agree over $S$, composing $f$ with $U \\\\hookrightarrow X$
        gives a unique morphism $\\\\theta : Z \\\\to X \\\\times_S Y$ such that $p_1
        \\\\circ \\\\theta = f$. Since $f(Z) \\\\subseteq U$, the topological image
        $\\\\theta(Z)$ lies in $p_1^{-1}(U) = W$, so $\\\\theta$ factors uniquely
        through the open subscheme $W$. Thus $p_1^{-1}(U)$ is the fiber product $U
        \\\\times_S Y$.\\n\\n*Step 3: Gluing $X$ when $Y$ and $S$ are fixed.* Suppose
        $Y$ and $S$ are fixed, and $X$ is covered by open subschemes $\\\\{X_i\\\\}_{i
        \\\\in I}$ such that $W_i = X_i \\\\times_S Y$ exists for every $i \\\\in
        I$. For each pair $i, j$, let $X_{ij} = X_i \\\\cap X_j$. By Step 2, both
        $W_{ij} = p_{1,i}^{-1}(X_{ij}) \\\\subseteq W_i$ and $W_{ji} = p_{1,j}^{-1}(X_{ij})
        \\\\subseteq W_j$ serve as the fiber product $X_{ij} \\\\times_S Y$. By uniqueness
        of the fiber product, there is a unique isomorphism $\\\\varphi_{ij} : W_{ij}
        \\\\xrightarrow{\\\\sim} W_{ji}$ commuting with the projections to $X_{ij}$
        and $Y$. Furthermore, by uniqueness on triple overlaps $X_i \\\\cap X_j \\\\cap
        X_k$, the isomorphisms $\\\\varphi_{ij}$ automatically satisfy the cocycle
        condition $\\\\varphi_{jk} \\\\circ \\\\varphi_{ij} = \\\\varphi_{ik}$.\\n\\nThus
        we can glue the schemes $\\\\{W_i\\\\}$ along the open subschemes $W_{ij}$
        via $\\\\varphi_{ij}$ to obtain a scheme $W$, together with projections $p_1
        : W \\\\to X$ and $p_2 : W \\\\to Y$ such that $p_1^{-1}(X_i) \\\\cong W_i$.
        Given any test scheme $Z$ with $f : Z \\\\to X$ and $g : Z \\\\to Y$ over
        $S$, let $Z_i = f^{-1}(X_i)$. By the universal property of $W_i$, there are
        unique morphisms $\\\\theta_i : Z_i \\\\to W_i \\\\subseteq W$ compatible
        with the projections. By uniqueness on $Z_i \\\\cap Z_j$, $\\\\left.\\\\theta_i\\\\right|_{Z_i
        \\\\cap Z_j} = \\\\left.\\\\theta_j\\\\right|_{Z_i \\\\cap Z_j}$, so the $\\\\theta_i$
        glue to a unique morphism $\\\\theta : Z \\\\to W$. Thus $W = X \\\\times_S
        Y$.\\n\\n*Step 4: The General Case.* First suppose $S$ is affine. If $Y$ is
        also affine, we cover $X$ by affine open subschemes $X_i$; by Step 1, $X_i
        \\\\times_S Y$ exists, so by Step 3, $X \\\\times_S Y$ exists for any $X$
        and affine $Y, S$. Next, keeping $S$ affine, let $X$ and $Y$ be arbitrary;
        cover $Y$ by affine opens $Y_j$. Since $X \\\\times_S Y_j$ exists for each
        $j$, applying Step 3 (with the roles of $X$ and $Y$ reversed) shows $X \\\\times_S
        Y$ exists whenever $S$ is affine.\\n\\nFinally, let $X \\\\to S$ and $Y \\\\to
        S$ be completely arbitrary. Cover $S$ by affine open subschemes $S_k$. Let
        $X_k$ and $Y_k$ be the preimages of $S_k$ in $X$ and $Y$. Notice that any
        pair of morphisms $f : Z \\\\to X_k$ and $g : Z \\\\to Y$ that agree in $S$
        must send $Z$ into $S_k$, hence $g(Z) \\\\subseteq Y_k$. This means that the
        fiber product $X_k \\\\times_{S_k} Y_k$ (which exists because $S_k$ is affine)
        also satisfies the universal property of $X_k \\\\times_S Y$. Since $\\\\{X_k\\\\}$
        is an open cover of $X$ for which $X_k \\\\times_S Y$ exists, one final application
        of Step 3 glues these pieces to give $X \\\\times_S Y$. $\\\\blacksquare$\\n\\n**Definition
        3.4.3.** Let $f : X \\\\to S$ be a morphism of schemes, and $s \\\\in S$ a
        point. Let $k(s) = \\\\mathcal{O}_{S,s} / \\\\mathfrak{m}_s$ be the residue
        field of $s$. There is a natural morphism $\\\\operatorname{Spec} k(s) \\\\to
        S$ sending the unique point to $s$ (factored through $\\\\operatorname{Spec}
        \\\\mathcal{O}_{S,s} \\\\to S$). The *scheme-theoretic fiber* of $f$ over
        $s$ is the fiber product\\n$$X_s = X \\\\times_S \\\\operatorname{Spec} k(s).$$\\nNote
        that $X_s$ is a scheme over the field $k(s)$, and its underlying topological
        space is homeomorphic to the set-theoretic fiber $f^{-1}(s) \\\\subseteq X$.\\n\\n---\\n\\n###
        3.5 Separated and Proper Morphisms\\n\\nIn algebraic geometry, the Zariski
        topology is almost never Hausdorff. The correct scheme-theoretic analogue
        of the Hausdorff condition is *separatedness*.\\n\\n**Definition 3.5.1.**
        Let $f : X \\\\to S$ be a morphism of schemes. The *diagonal morphism* is
        the unique morphism $\\\\Delta = \\\\Delta_{X/S} : X \\\\to X \\\\times_S
        X$ obtained by applying the universal property of the fiber product to the
        identity morphisms $\\\\operatorname{id}_X : X \\\\to X$ and $\\\\operatorname{id}_X
        : X \\\\to X$. We say that $f : X \\\\to S$ is *separated* if the diagonal
        morphism $\\\\Delta_{X/S}$ is a closed immersion (meaning $\\\\Delta$ induces
        a homeomorphism of $X$ onto a closed subset of $X \\\\times_S X$, and the
        sheaf map $\\\\Delta^\\\\# : \\\\mathcal{O}_{X \\\\times_S X} \\\\to \\\\Delta_*\\\\mathcal{O}_X$
        is surjective). A scheme $X$ is *separated* if the canonical morphism $X \\\\to
        \\\\operatorname{Spec} \\\\mathbb{Z}$ is separated.\\n\\n**Proposition 3.5.2.**
        *Every morphism of affine schemes $f : \\\\operatorname{Spec} A \\\\to \\\\operatorname{Spec}
        R$ is separated.*\\n\\n*Proof.* By the proof of Theorem 3.4.2, $\\\\operatorname{Spec}
        A \\\\times_{\\\\operatorname{Spec} R} \\\\operatorname{Spec} A = \\\\operatorname{Spec}(A
        \\\\otimes_R A)$, and the diagonal morphism $\\\\Delta : \\\\operatorname{Spec}
        A \\\\to \\\\operatorname{Spec}(A \\\\otimes_R A)$ is induced by the multiplication
        homomorphism $\\\\mu : A \\\\otimes_R A \\\\to A$, $a \\\\otimes a' \\\\mapsto
        aa'$. Since $\\\\mu(a \\\\otimes 1) = a$, $\\\\mu$ is a surjective ring homomorphism.
        Letting $I = \\\\ker \\\\mu$, we have $A \\\\cong (A \\\\otimes_R A) / I$.
        Thus $\\\\Delta$ identifies $\\\\operatorname{Spec} A$ homeomorphically with
        the closed subset $V(I) \\\\subseteq \\\\operatorname{Spec}(A \\\\otimes_R
        A)$, and on affine opens $D(h)$, $\\\\Delta^\\\\#$ is the surjective localization
        map $(A \\\\otimes_R A)_h \\\\to A_{\\\\mu(h)}$, so $\\\\Delta^\\\\#$ is surjective
        on all stalks. Hence $\\\\Delta$ is a closed immersion. $\\\\blacksquare$\\n\\n**Corollary
        3.5.3.** *An arbitrary morphism $f : X \\\\to S$ is separated if and only
        if the image $\\\\Delta(X)$ is a closed subset of $X \\\\times_S X$.*\\n\\n*Proof.*
        For any point $P \\\\in X$, choose an affine open neighborhood $V \\\\subseteq
        S$ of $f(P)$, and an affine open neighborhood $U \\\\subseteq f^{-1}(V)$ of
        $P$. Then $U \\\\times_V U$ is an open neighborhood of $\\\\Delta(P)$ in $X
        \\\\times_S X$, and $\\\\Delta^{-1}(U \\\\times_V U) = U$. By Proposition
        3.5.2, the restricted map $\\\\left.\\\\Delta\\\\right|_U : U \\\\to U \\\\times_V
        U$ is already a closed immersion. This means $\\\\Delta$ is always a *locally
        closed immersion* (a closed immersion into an open subset of $X \\\\times_S
        X$). A locally closed immersion is a closed immersion if and only if its topological
        image is closed in the ambient space. $\\\\blacksquare$\\n\\n**Definition
