      string: "{\n  \"candidates\": [\n    {\n      \"content\": {\n        \"parts\":
        [\n          {\n            \"text\": \"1.5(1) and $\\\\ker(\\\\psi(U)) =
        (\\\\ker \\\\psi)(U) = (\\\\operatorname{im} \\\\varphi)(U) = \\\\mathcal{F}'(U)$,
        proving left exactness of $\\\\Gamma(U, -)$. $\\\\blacksquare$\\n\\n---\\n\\n###
        2.3 Ringed Spaces and Locally Ringed Spaces\\n\\n**Definition 2.3.1.** Let
        $f: X \\\\to Y$ be a continuous map of topological spaces.\\n1. For any sheaf
        $\\\\mathcal{F}$ on $X$, the **direct image** (or **pushforward**) sheaf $f_*
        \\\\mathcal{F}$ on $Y$ is defined by $(f_* \\\\mathcal{F})(V) = \\\\mathcal{F}(f^{-1}(V))$
        for any open subset $V \\\\subseteq Y$. One verifies immediately that $f_*
        \\\\mathcal{F}$ is a sheaf on $Y$.\\n2. For any sheaf $\\\\mathcal{G}$ on
        $Y$, the **inverse image** (or **pullback**) sheaf $f^{-1} \\\\mathcal{G}$
        on $X$ is defined to be the sheafification of the presheaf on $X$ sending
        an open subset $U \\\\subseteq X$ to:\\n$$\\\\varinjlim_{V \\\\supseteq f(U)}
        \\\\mathcal{G}(V),$$\\nwhere the direct limit runs over all open subsets $V
        \\\\subseteq Y$ containing $f(U)$.\\n\\nNotice that for any point $P \\\\in
        X$, taking the direct limit over all open neighborhoods $U$ of $P$ shows that
        the stalk of $f^{-1}\\\\mathcal{G}$ at $P$ is canonically isomorphic to the
        stalk of $\\\\mathcal{G}$ at $f(P)$:\\n$$(f^{-1} \\\\mathcal{G})_P \\\\cong
        \\\\varinjlim_{P \\\\in U} \\\\left( \\\\varinjlim_{V \\\\supseteq f(U)} \\\\mathcal{G}(V)
        \\\\right) = \\\\varinjlim_{f(P) \\\\in V} \\\\mathcal{G}(V) = \\\\mathcal{G}_{f(P)}$$\\n(because
        by continuity of $f$, every open neighborhood $V$ of $f(P)$ contains $f(U)$
        for the open neighborhood $U = f^{-1}(V)$ of $P$). By Theorem 2.2.3(2), the
        functor $f^{-1}: \\\\mathfrak{Ab}(Y) \\\\to \\\\mathfrak{Ab}(X)$ is an **exact
        functor**! Furthermore, $f^{-1}$ is **left adjoint** to $f_*$: for any sheaf
        $\\\\mathcal{G}$ on $Y$ and sheaf $\\\\mathcal{F}$ on $X$, there is a natural
        bijection:\\n$$\\\\operatorname{Hom}_{\\\\mathfrak{Ab}(X)}(f^{-1} \\\\mathcal{G},
        \\\\mathcal{F}) \\\\stackrel{\\\\sim}{\\\\longrightarrow} \\\\operatorname{Hom}_{\\\\mathfrak{Ab}(Y)}(\\\\mathcal{G},
        f_* \\\\mathcal{F}).$$\\nIndeed, giving a morphism of presheaves $(U \\\\mapsto
        \\\\varinjlim_{V \\\\supseteq f(U)} \\\\mathcal{G}(V)) \\\\to \\\\mathcal{F}$
        is equivalent to giving compatible maps $\\\\mathcal{G}(V) \\\\to \\\\mathcal{F}(U)$
        whenever $f(U) \\\\subseteq V$ (i.e., $U \\\\subseteq f^{-1}(V)$), which by
        taking $U = f^{-1}(V)$ is equivalent to giving maps $\\\\mathcal{G}(V) \\\\to
        \\\\mathcal{F}(f^{-1}(V)) = (f_* \\\\mathcal{F})(V)$.\\n\\n**Definition 2.3.2.**
        \\n1. A **ringed space** is a pair $(X, \\\\mathcal{O}_X)$ consisting of a
        topological space $X$ and a sheaf of commutative rings $\\\\mathcal{O}_X$
        on $X$, called the **structure sheaf** of $X$.\\n2. A **morphism of ringed
        spaces** from $(X, \\\\mathcal{O}_X)$ to $(Y, \\\\mathcal{O}_Y)$ is a pair
        $(f, f^\\\\sharp)$ consisting of a continuous map $f: X \\\\to Y$ and a morphism
        of sheaves of rings $f^\\\\sharp: \\\\mathcal{O}_Y \\\\to f_* \\\\mathcal{O}_X$
        on $Y$. (By the adjunction between $f^{-1}$ and $f_*$, giving $f^\\\\sharp:
        \\\\mathcal{O}_Y \\\\to f_* \\\\mathcal{O}_X$ is equivalent to giving a morphism
        of sheaves of rings $f^{-1} \\\\mathcal{O}_Y \\\\to \\\\mathcal{O}_X$ on $X$.)\\n3.
        A ringed space $(X, \\\\mathcal{O}_X)$ is a **locally ringed space** if for
        every point $P \\\\in X$, the stalk $\\\\mathcal{O}_{X,P}$ is a **local ring**
        (that is, $\\\\mathcal{O}_{X,P}$ has a unique maximal ideal, which we denote
        $\\\\mathfrak{m}_P$ or $\\\\mathfrak{m}_{X,P}$; its quotient $\\\\kappa(P)
        = \\\\mathcal{O}_{X,P}/\\\\mathfrak{m}_P$ is called the **residue field**
        of $P$ on $X$).\\n4. A **morphism of locally ringed spaces** $(f, f^\\\\sharp):
        (X, \\\\mathcal{O}_X) \\\\to (Y, \\\\mathcal{O}_Y)$ is a morphism of ringed
        spaces such that for every point $P \\\\in X$, the induced ring homomorphism
        on stalks:\\n$$f^\\\\sharp_P: \\\\mathcal{O}_{Y, f(P)} \\\\longrightarrow
        \\\\mathcal{O}_{X, P}$$\\n(obtained by composing $(f^{-1}\\\\mathcal{O}_Y)_P
        \\\\cong \\\\mathcal{O}_{Y, f(P)} \\\\to \\\\mathcal{O}_{X,P}$, or directly
        by taking the colimit of $\\\\mathcal{O}_Y(V) \\\\to \\\\mathcal{O}_X(f^{-1}(V))$
        over $V \\\\ni f(P)$) is a **local homomorphism of local rings**, meaning
        that:\\n$$(f^\\\\sharp_P)^{-1}(\\\\mathfrak{m}_{X,P}) = \\\\mathfrak{m}_{Y,
        f(P)} \\\\quad \\\\text{(equivalently, } f^\\\\sharp_P(\\\\mathfrak{m}_{Y,
        f(P)}) \\\\subseteq \\\\mathfrak{m}_{X,P}\\\\text{)}.$$\\n\\nNotice that in
        the classical case where $\\\\mathcal{O}_X$ and $\\\\mathcal{O}_Y$ are sheaves
        of $k$-valued functions and $f^\\\\sharp$ is pullback of functions ($f^\\\\sharp(g)
        = g \\\\circ f$), the condition $f^\\\\sharp_P(\\\\mathfrak{m}_{Y, f(P)})
        \\\\subseteq \\\\mathfrak{m}_{X,P}$ is automatic because if $g(f(P)) = 0$,
        then $(g \\\\circ f)(P) = 0$. For abstract locally ringed spaces (such as
        schemes), however, sections of $\\\\mathcal{O}_X$ are not merely functions
        into a fixed field, and the local ring condition on $f^\\\\sharp_P$ is essential!\\n\\n**Definition
        2.3.3.** Let $(X, \\\\mathcal{O}_X)$ be a ringed space. An **$\\\\mathcal{O}_X$-module**
        (or sheaf of $\\\\mathcal{O}_X$-modules) is a sheaf $\\\\mathcal{F}$ on $X$
        such that for every open subset $U \\\\subseteq X$, $\\\\mathcal{F}(U)$ is
        an $\\\\mathcal{O}_X(U)$-module, and for every inclusion $V \\\\subseteq U$,
        the restriction map $\\\\mathcal{F}(U) \\\\to \\\\mathcal{F}(V)$ is compatible
        with the ring restriction $\\\\mathcal{O}_X(U) \\\\to \\\\mathcal{O}_X(V)$
        (i.e., $(a \\\\cdot s)|_V = a|_V \\\\cdot s|_V$ for $a \\\\in \\\\mathcal{O}_X(U),
        s \\\\in \\\\mathcal{F}(U)$). A morphism of $\\\\mathcal{O}_X$-modules $\\\\mathcal{F}
        \\\\to \\\\mathcal{G}$ is a morphism of sheaves such that $\\\\mathcal{F}(U)
        \\\\to \\\\mathcal{G}(U)$ is $\\\\mathcal{O}_X(U)$-linear for each $U$. The
        category of $\\\\mathcal{O}_X$-modules is denoted $\\\\mathfrak{Mod}(X)$,
        and is an abelian category by the exact same arguments as Theorem 2.2.3.\\n\\nStandard
        module-theoretic operations extend to $\\\\mathcal{O}_X$-modules:\\n* **Tensor
        Product:** For two $\\\\mathcal{O}_X$-modules $\\\\mathcal{F}$ and $\\\\mathcal{G}$,
        their **tensor product** $\\\\mathcal{F} \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{G}$
        is the sheafification of the presheaf $U \\\\mapsto \\\\mathcal{F}(U) \\\\otimes_{\\\\mathcal{O}_X(U)}
        \\\\mathcal{G}(U)$. On stalks, $(\\\\mathcal{F} \\\\otimes_{\\\\mathcal{O}_X}
        \\\\mathcal{G})_P \\\\cong \\\\mathcal{F}_P \\\\otimes_{\\\\mathcal{O}_{X,P}}
        \\\\mathcal{G}_P$.\\n* **Sheaf Hom:** For two $\\\\mathcal{O}_X$-modules $\\\\mathcal{F}$
        and $\\\\mathcal{G}$, the presheaf $U \\\\mapsto \\\\operatorname{Hom}_{\\\\mathcal{O}_X|_U}(\\\\mathcal{F}|_U,
        \\\\mathcal{G}|_U)$ is already a sheaf, denoted $\\\\mathcal{H}om_{\\\\mathcal{O}_X}(\\\\mathcal{F},
        \\\\mathcal{G})$.\\n* **Pullback of $\\\\mathcal{O}_X$-Modules:** Let $(f,
        f^\\\\sharp): (X, \\\\mathcal{O}_X) \\\\to (Y, \\\\mathcal{O}_Y)$ be a morphism
        of ringed spaces. If $\\\\mathcal{F}$ is an $\\\\mathcal{O}_X$-module, then
        $f_* \\\\mathcal{F}$ is naturally an $f_* \\\\mathcal{O}_X$-module, and hence
        via $f^\\\\sharp: \\\\mathcal{O}_Y \\\\to f_* \\\\mathcal{O}_X$ an $\\\\mathcal{O}_Y$-module.
        Conversely, if $\\\\mathcal{G}$ is an $\\\\mathcal{O}_Y$-module, then $f^{-1}\\\\mathcal{G}$
        is an $f^{-1}\\\\mathcal{O}_Y$-module, and we define the **pullback $\\\\mathcal{O}_X$-module**
        $f^* \\\\mathcal{G}$ by:\\n$$f^* \\\\mathcal{G} = f^{-1} \\\\mathcal{G} \\\\otimes_{f^{-1}\\\\mathcal{O}_Y}
        \\\\mathcal{O}_X.$$\\nOn stalks, $(f^* \\\\mathcal{G})_P \\\\cong \\\\mathcal{G}_{f(P)}
        \\\\otimes_{\\\\mathcal{O}_{Y, f(P)}} \\\\mathcal{O}_{X,P}$. The functor $f^*:
        \\\\mathfrak{Mod}(Y) \\\\to \\\\mathfrak{Mod}(X)$ is right exact and left
        adjoint to $f_*: \\\\mathfrak{Mod}(X) \\\\to \\\\mathfrak{Mod}(Y)$.\\n\\n---\\n\\n###
        2.4 Exercises for Chapter 2\\n\\n**Exercise 2.1 (Constant and Skyscraper Sheaves).**
        \\n(a) Let $A$ be an abelian group and $X$ be a topological space. Define
        the **constant presheaf** $A_{\\\\text{pre}}$ by $A_{\\\\text{pre}}(U) = A$
        for all non-empty open $U$ (and $0$ for $U = \\\\varnothing$), with identity
        maps for restrictions. Show that its sheafification, the **constant sheaf**
        $\\\\underline{A}_X$, has sections over $U$ given by the group of locally
        constant functions $U \\\\to A$ (i.e., continuous functions when $A$ is given
        the discrete topology).\\n(b) Let $P \\\\in X$ and $A$ be an abelian group.
        Define the **skyscraper sheaf** $i_{P,*} A$ by $(i_{P,*} A)(U) = A$ if $P
        \\\\in U$, and $0$ if $P \\\\notin U$. Prove that $i_{P,*} A$ is a sheaf,
        and compute its stalk $(i_{P,*} A)_Q$ for every point $Q \\\\in X$ when $X$
        is a $T_1$ space vs. when $X$ is an irreducible variety (such as $\\\\mathbb{A}^1_k$)
        and $P$ is a closed point.\\n\\n**Exercise 2.2 (Failure of Surjectivity on
        Global Sections: The Exponential Sequence).** Let $X = \\\\mathbb{C} \\\\setminus
        \\\\{0\\\\}$ with the classical Euclidean topology. Let $\\\\mathcal{O}_X$
        be the sheaf of holomorphic functions on $X$, and $\\\\mathcal{O}_X^\\\\times$
        be the sheaf of nowhere-vanishing holomorphic functions under multiplication.\\n(a)
        Show that the morphism $\\\\exp: \\\\mathcal{O}_X \\\\to \\\\mathcal{O}_X^\\\\times$
        given by $f \\\\mapsto e^{2\\\\pi i f}$ is a surjective morphism of sheaves
        on $X$ with kernel the constant sheaf $\\\\underline{\\\\mathbb{Z}}_X$, yielding
        an exact sequence of sheaves $0 \\\\to \\\\underline{\\\\mathbb{Z}}_X \\\\to
        \\\\mathcal{O}_X \\\\xrightarrow{\\\\exp} \\\\mathcal{O}_X^\\\\times \\\\to
        0$.\\n(b) Show that the induced map on global sections $\\\\mathcal{O}_X(X)
        \\\\to \\\\mathcal{O}_X^\\\\times(X)$ is *not* surjective (consider the identity
        function $z \\\\in \\\\mathcal{O}_X^\\\\times(X)$).\\n\\n**Exercise 2.3 (Sheaves
        on a Basis for a Topology).** Let $X$ be a topological space, and let $\\\\mathcal{B}$
        be a basis of open subsets for the topology of $X$ that is closed under finite
        intersections (for example, principal open sets $D(f)$). A **$\\\\mathcal{B}$-sheaf**
        $\\\\mathcal{F}$ is the assignment of an object $\\\\mathcal{F}(B)$ to each
        $B \\\\in \\\\mathcal{B}$ and restriction maps for $B' \\\\subseteq B$ satisfying
        the sheaf axioms for coverings of $B \\\\in \\\\mathcal{B}$ by elements of
        $\\\\mathcal{B}$.\\nProve that every $\\\\mathcal{B}$-sheaf $\\\\mathcal{F}$
        extends uniquely (up to canonical isomorphism) to a sheaf $\\\\widetilde{\\\\mathcal{F}}$
        on all open subsets of $X$, defined by:\\n$$\\\\widetilde{\\\\mathcal{F}}(U)
        = \\\\varprojlim_{\\\\substack{B \\\\in \\\\mathcal{B} \\\\\\\\ B \\\\subseteq
        U}} \\\\mathcal{F}(B),$$\\nand that the restriction functor from $\\\\mathfrak{Sh}(X)$
        to $\\\\mathcal{B}\\\\text{-}\\\\mathfrak{Sh}(X)$ is an equivalence of categories.\\n\\n**Exercise
        2.4 (Direct Limit of Sheaves and Stalk of $\\\\mathcal{H}om$).** \\n(a) Let
        $X$ be a Noetherian topological space (so every open subset $U \\\\subseteq
        X$ is quasi-compact, meaning every open cover has a finite subcover). Prove
        that for any directed system of sheaves $\\\\{\\\\mathcal{F}_\\\\alpha\\\\}$
        on $X$, the presheaf $U \\\\mapsto \\\\varinjlim \\\\mathcal{F}_\\\\alpha(U)$
        is already a sheaf without needing sheafification.\\n(b) Let $(X, \\\\mathcal{O}_X)$
        be a ringed space, and let $\\\\mathcal{F}, \\\\mathcal{G}$ be $\\\\mathcal{O}_X$-modules.
        Suppose $\\\\mathcal{F}$ is **finitely presented** (meaning locally on open
        sets $U$, there is an exact sequence $\\\\mathcal{O}_U^{\\\\oplus m} \\\\to
        \\\\mathcal{O}_U^{\\\\oplus n} \\\\to \\\\mathcal{F}|_U \\\\to 0$). Prove
        that for every $P \\\\in X$, there is a natural isomorphism:\\n$$\\\\mathcal{H}om_{\\\\mathcal{O}_X}(\\\\mathcal{F},
        \\\\mathcal{G})_P \\\\stackrel{\\\\sim}{\\\\longrightarrow} \\\\operatorname{Hom}_{\\\\mathcal{O}_{X,P}}(\\\\mathcal{F}_P,
        \\\\mathcal{G}_P).$$\\n\\n---\\n\\n## Chapter 3: Schemes\\n\\nClassical algebraic
        geometry over an algebraically closed field $k$ suffers from several limitations:
        it cannot natively handle arithmetic questions over rings such as $\\\\mathbb{Z}$
        or non-algebraically closed fields, nor does it preserve multiplicity information
        (such as tangent vectors $\\\\operatorname{Spec} k[\\\\epsilon]/(\\\\epsilon^2)$
        or double lines $V(x^2)$) which is lost when taking radicals of ideals. Alexander
        Grothendieck revolutionized the subject by replacing maximal ideals of reduced
        $k$-algebras with all prime ideals of arbitrary commutative rings.\\n\\n###
        3.1 The Spectrum of a Ring\\n\\nThroughout this chapter, all rings are assumed
        to be commutative with identity $1$, and ring homomorphisms send $1 \\\\mapsto
        1$.\\n\\n**Definition 3.1.1.** Let $A$ be a commutative ring. As a set, the
        **prime spectrum** of $A$, denoted $\\\\operatorname{Spec} A$, is the set
        of all prime ideals of $A$. For any subset (or ideal) $\\\\mathfrak{a} \\\\subseteq
        A$, we define the **vanishing locus** of $\\\\mathfrak{a}$ in $\\\\operatorname{Spec}
        A$ to be:\\n$$V(\\\\mathfrak{a}) = \\\\{\\\\mathfrak{p} \\\\in \\\\operatorname{Spec}
        A \\\\mid \\\\mathfrak{a} \\\\subseteq \\\\mathfrak{p}\\\\}.$$\\n\\nNotice
        the motivational intuition: if $f \\\\in A$ and $x = \\\\mathfrak{p} \\\\in
        \\\\operatorname{Spec} A$ is a point, we view the image of $f$ in the residue
        field $\\\\kappa(\\\\mathfrak{p}) = \\\\operatorname{Frac}(A/\\\\mathfrak{p})
        \\\\cong A_\\\\mathfrak{p}/\\\\mathfrak{p}A_\\\\mathfrak{p}$ as the \\\"value\\\"
        $f(\\\\mathfrak{p})$ of $f$ at $\\\\mathfrak{p}$. Thus $f(\\\\mathfrak{p})
        = 0$ in $\\\\kappa(\\\\mathfrak{p})$ if and only if $f \\\\in \\\\mathfrak{p}$.\\n\\n**Proposition
        3.1.2.** *Let $A$ be a ring.*\\n1. $V(0) = \\\\operatorname{Spec} A$ *and*
        $V(1) = \\\\varnothing$.\\n2. *If $\\\\{\\\\mathfrak{a}_i\\\\}_{i \\\\in I}$
        is any family of ideals of $A$, then $V\\\\left(\\\\sum_{i \\\\in I} \\\\mathfrak{a}_i\\\\right)
        = \\\\bigcap_{i \\\\in I} V(\\\\mathfrak{a}_i)$.*\\n3. *For any ideals $\\\\mathfrak{a},
        \\\\mathfrak{b} \\\\subseteq A$, $V(\\\\mathfrak{a}) \\\\cup V(\\\\mathfrak{b})
        = V(\\\\mathfrak{a} \\\\cap \\\\mathfrak{b}) = V(\\\\mathfrak{a}\\\\mathfrak{b})$.*\\n4.
        *For any ideal $\\\\mathfrak{a} \\\\subseteq A$, $V(\\\\mathfrak{a}) = V(\\\\sqrt{\\\\mathfrak{a}})$,
        and $V(\\\\mathfrak{a}) \\\\subseteq V(\\\\mathfrak{b})$ if and only if $\\\\sqrt{\\\\mathfrak{b}}
        \\\\subseteq \\\\sqrt{\\\\mathfrak{a}}$.*\\n\\n*Proof.* (1) and (2) are immediate
        from the definitions. For (3), if $\\\\mathfrak{p} \\\\in V(\\\\mathfrak{a})
        \\\\cup V(\\\\mathfrak{b})$, then $\\\\mathfrak{a}\\\\mathfrak{b} \\\\subseteq
        \\\\mathfrak{a} \\\\cap \\\\mathfrak{b} \\\\subseteq \\\\mathfrak{p}$; conversely,
        if $\\\\mathfrak{a}\\\\mathfrak{b} \\\\subseteq \\\\mathfrak{p}$, since $\\\\mathfrak{p}$
        is prime, either $\\\\mathfrak{a} \\\\subseteq \\\\mathfrak{p}$ or $\\\\mathfrak{b}
        \\\\subseteq \\\\mathfrak{p}$ (otherwise pick $a \\\\in \\\\mathfrak{a} \\\\setminus
        \\\\mathfrak{p}$ and $b \\\\in \\\\mathfrak{b} \\\\setminus \\\\mathfrak{p}$,
        then $ab \\\\in \\\\mathfrak{a}\\\\mathfrak{b} \\\\subseteq \\\\mathfrak{p}$,
        contradiction). For (4), recall from commutative algebra that the radical
        $\\\\sqrt{\\\\mathfrak{b}}$ is equal to the intersection of all prime ideals
        containing $\\\\mathfrak{b}$ (if $f \\\\notin \\\\sqrt{\\\\mathfrak{b}}$,
        the localization $A_f/\\\\mathfrak{b}A_f$ is non-zero, hence has a maximal
        ideal, which pulls back to a prime of $A$ containing $\\\\mathfrak{b}$ and
        not containing $f$). Thus $\\\\sqrt{\\\\mathfrak{b}} = \\\\bigcap_{\\\\mathfrak{p}
        \\\\in V(\\\\mathfrak{b})} \\\\mathfrak{p}$. Consequently, $V(\\\\mathfrak{a})
        \\\\subseteq V(\\\\mathfrak{b}) \\\\iff \\\\sqrt{\\\\mathfrak{b}} = \\\\bigcap_{\\\\mathfrak{p}
        \\\\in V(\\\\mathfrak{b})} \\\\mathfrak{p} \\\\subseteq \\\\bigcap_{\\\\mathfrak{p}
        \\\\in V(\\\\mathfrak{a})} \\\\mathfrak{p} = \\\\sqrt{\\\\mathfrak{a}}$. $\\\\blacksquare$\\n\\nBy
        Proposition 3.1.2, the subsets $V(\\\\mathfrak{a})$ form the closed sets of
        a topology on $\\\\operatorname{Spec} A$, called the **Zariski topology**.
        For any element $f \\\\in A$, we define the **principal open subset** (or
        **distinguished open subset**) $D(f)$ to be the complement of $V((f))$:\\n$$D(f)
        = \\\\operatorname{Spec} A \\\\setminus V(f) = \\\\{\\\\mathfrak{p} \\\\in
        \\\\operatorname{Spec} A \\\\mid f \\\\notin \\\\mathfrak{p}\\\\}.$$\\n\\n**Lemma
        3.1.3.** *Let $A$ be a ring.*\\n1. *The sets $\\\\{D(f) \\\\mid f \\\\in A\\\\}$
        form a basis of open subsets for the Zariski topology on $\\\\operatorname{Spec}
        A$, satisfying $D(f) \\\\cap D(g) = D(fg)$. Moreover, the map $\\\\operatorname{Spec}
        A_f \\\\to D(f)$ given by $\\\\mathfrak{q} \\\\mapsto \\\\mathfrak{q} \\\\cap
        A$ is a homeomorphism.*\\n2. $D(f) = \\\\varnothing$ *if and only if $f$ is
        nilpotent ($f \\\\in \\\\sqrt{0}$), and $D(f) = \\\\operatorname{Spec} A$
        if and only if $f \\\\in A^\\\\times$ is a unit.*\\n3. $D(f) \\\\subseteq
        D(g)$ *if and only if $f \\\\in \\\\sqrt{(g)}$ (i.e., $f^n = ag$ for some
        $n \\\\ge 1$ and $a \\\\in A$, which is equivalent to $g$ becoming a unit
        in $A_f$).*\\n4. $\\\\operatorname{Spec} A$ *(and hence every $D(f) \\\\cong
        \\\\operatorname{Spec} A_f$) is **quasi-compact**: every open covering of
        $\\\\operatorname{Spec} A$ has a finite subcovering.*\\n\\n*Proof.* (1) Every
        open set is $\\\\operatorname{Spec} A \\\\setminus V(\\\\mathfrak{a}) = \\\\operatorname{Spec}
        A \\\\setminus \\\\bigcap_{f \\\\in \\\\mathfrak{a}} V(f) = \\\\bigcup_{f
        \\\\in \\\\mathfrak{a}} D(f)$. By primality, $f, g \\\\notin \\\\mathfrak{p}
        \\\\iff fg \\\\notin \\\\mathfrak{p}$, so $D(f) \\\\cap D(g) = D(fg)$. The
        bijection $\\\\operatorname{Spec} A_f \\\\leftrightarrow D(f)$ preserves and
        reflects inclusions of ideals, hence is a homeomorphism.\\n(2) and (3) follow
        immediately from Proposition 3.1.2(4) by taking complements.\\n(4) Let $\\\\operatorname{Spec}
        A = \\\\bigcup_{i \\\\in I} U_i$ be an open covering. Since the principal
        open sets form a basis, we may refine the cover and assume $U_i = D(f_i)$
        for $f_i \\\\in A$. Then $\\\\operatorname{Spec} A = \\\\bigcup_{i \\\\in
        I} D(f_i)$ is equivalent to $\\\\varnothing = \\\\bigcap_{i \\\\in I} V(f_i)
        = V\\\\left(\\\\sum_{i \\\\in I} (f_i)\\\\right)$. By Proposition 3.1.2(4),
        the ideal generated by $\\\\{f_i\\\\}_{i \\\\in I}$ must be the unit ideal
        $A$, so $1$ can be written as a finite linear combination:\\n$$1 = \\\\sum_{j=1}^m
        a_j f_{i_j} \\\\quad \\\\text{for some } i_1, \\\\dots, i_m \\\\in I \\\\text{
        and } a_j \\\\in A.$$\\nReversing the steps, the ideal $(f_{i_1}, \\\\dots,
        f_{i_m}) = A$, so $\\\\bigcup_{j=1}^m D(f_{i_j}) = \\\\operatorname{Spec}
        A$. $\\\\blacksquare$\\n\\nWe now construct the **structure sheaf** $\\\\mathcal{O}_{\\\\operatorname{Spec}
        A}$ on $X = \\\\operatorname{Spec} A$ to make $(X, \\\\mathcal{O}_X)$ a locally
        ringed space.\\n\\n**Definition 3.1.4.** Let $A$ be a ring and $X = \\\\operatorname{Spec}
        A$. For any open subset $U \\\\subseteq X$, we define $\\\\mathcal{O}_X(U)$
        to be the set of functions:\\n$$s: U \\\\longrightarrow \\\\bigsqcup_{\\\\mathfrak{p}
        \\\\in U} A_\\\\mathfrak{p}$$\\nsuch that $s(\\\\mathfrak{p}) \\\\in A_\\\\mathfrak{p}$
        for each $\\\\mathfrak{p} \\\\in U$, and such that $s$ is **locally a fraction**:
        for every $\\\\mathfrak{p} \\\\in U$, there exists an open neighborhood $V
        \\\\subseteq U$ of $\\\\mathfrak{p}$ and elements $a, f \\\\in A$ such that
        for every $\\\\mathfrak{q} \\\\in V$, we have $f \\\\notin \\\\mathfrak{q}$
        (i.e., $V \\\\subseteq D(f)$) and:\\n$$s(\\\\mathfrak{q}) = \\\\frac{a}{f}
        \\\\quad \\\\text{in } A_\\\\mathfrak{q}.$$\\n\\nBecause the conditions defining
        $\\\\mathcal{O}_X(U)$ are purely local on $U$, $\\\\mathcal{O}_X$ is manifestly
        a sheaf of commutative rings on $X = \\\\operatorname{Spec} A$ (with pointwise
        ring operations and restrictions of functions).\\n\\n**Theorem 3.1.5.** *Let
        $A$ be a ring and $(X, \\\\mathcal{O}_X) = (\\\\operatorname{Spec} A, \\\\mathcal{O}_{\\\\operatorname{Spec}
        A})$.*\\n1. *For every $\\\\mathfrak{p} \\\\in X$, the stalk $\\\\mathcal{O}_{X,
        \\\\mathfrak{p}}$ is canonically isomorphic to the local ring $A_\\\\mathfrak{p}$.
        Thus $(X, \\\\mathcal{O}_X)$ is a locally ringed space.*\\n2. *For every $f
        \\\\in A$, there is a canonical isomorphism of rings:*\\n$$\\\\mathcal{O}_X(D(f))
        \\\\stackrel{\\\\sim}{\\\\longrightarrow} A_f.$$\\n*In particular, taking
        $f = 1$, we have $\\\\Gamma(X, \\\\mathcal{O}_X) = \\\\mathcal{O}_X(\\\\operatorname{Spec}
        A) \\\\cong A$.*\\n\\n*Proof.* \\n(1) Define the map $\\\\pi_\\\\mathfrak{p}:
        \\\\mathcal{O}_{X, \\\\mathfrak{p}} \\\\to A_\\\\mathfrak{p}$ by sending the
        germ of a section $s \\\\in \\\\mathcal{O}_X(U)$ (where $\\\\mathfrak{p} \\\\in
        U$) to its value $s(\\\\mathfrak{p}) \\\\in A_\\\\mathfrak{p}$. This is clearly
        a well-defined ring homomorphism. It is surjective: any element of $A_\\\\mathfrak{p}$
        is of the form $a/f$ with $f \\\\notin \\\\mathfrak{p}$, which is the value
        at $\\\\mathfrak{p}$ of the section $s \\\\in \\\\mathcal{O}_X(D(f))$ given
        by $\\\\mathfrak{q} \\\\mapsto a/f \\\\in A_\\\\mathfrak{q}$. To see that
        $\\\\pi_\\\\mathfrak{p}$ is injective, suppose $s \\\\in \\\\mathcal{O}_X(U)$
        satisfies $s(\\\\mathfrak{p}) = 0$ in $A_\\\\mathfrak{p}$. On some open neighborhood
        $V \\\\subseteq U$ of $\\\\mathfrak{p}$, $s$ is represented by a fraction
        $a/f$ with $V \\\\subseteq D(f)$. Since $a/f = 0$ in $A_\\\\mathfrak{p}$,
        by definition of localization there exists an element $g \\\\in A \\\\setminus
        \\\\mathfrak{p}$ such that $ga = 0$ in $A$. Then for every $\\\\mathfrak{q}
        \\\\in V \\\\cap D(g)$, we have $g \\\\notin \\\\mathfrak{q}$ and $ga = 0$,
        so $s(\\\\mathfrak{q}) = a/f = ga/gf = 0$ in $A_\\\\mathfrak{q}$. Since $V
        \\\\cap D(g)$ is an open neighborhood of $\\\\mathfrak{p}$ on which $s$ vanishes
        identically, the germ of $s$ in $\\\\mathcal{O}_{X, \\\\mathfrak{p}}$ is zero.
        Thus $\\\\mathcal{O}_{X, \\\\mathfrak{p}} \\\\cong A_\\\\mathfrak{p}$.\\n\\n(2)
        Define a ring homomorphism $\\\\psi: A_f \\\\to \\\\mathcal{O}_X(D(f))$ by
        sending $a/f^n \\\\in A_f$ to the section $\\\\mathfrak{q} \\\\mapsto a/f^n
        \\\\in A_\\\\mathfrak{q}$ for $\\\\mathfrak{q} \\\\in D(f)$. We must prove
        that $\\\\psi$ is both injective and surjective.\\n\\n*Injectivity of $\\\\psi$:*
        Suppose $\\\\psi(a/f^n) = 0$ in $\\\\mathcal{O}_X(D(f))$. Then for every $\\\\mathfrak{p}
        \\\\in D(f)$, we have $a/f^n = 0$ in $A_\\\\mathfrak{p}$, which means $a/1
        = 0$ in $A_\\\\mathfrak{p}$. Let $\\\\operatorname{Ann}_A(a) = \\\\{b \\\\in
        A \\\\mid ba = 0\\\\}$ be the annihilator ideal of $a$ in $A$. For each $\\\\mathfrak{p}
        \\\\in D(f)$, the fact that $a/1 = 0$ in $A_\\\\mathfrak{p}$ means there exists
        $b_\\\\mathfrak{p} \\\\in A \\\\setminus \\\\mathfrak{p}$ such that $b_\\\\mathfrak{p}
        a = 0$, so $b_\\\\mathfrak{p} \\\\in \\\\operatorname{Ann}_A(a)$ and therefore
        $\\\\mathfrak{p} \\\\notin V(\\\\operatorname{Ann}_A(a))$. This shows that
        $V(\\\\operatorname{Ann}_A(a)) \\\\cap D(f) = \\\\varnothing$, or equivalently:\\n$$D(f)
        \\\\subseteq \\\\operatorname{Spec} A \\\\setminus V(\\\\operatorname{Ann}_A(a)).$$\\nBy
        Proposition 3.1.2(4), $V(\\\\operatorname{Ann}_A(a)) \\\\subseteq V(f)$ implies
        $f \\\\in \\\\sqrt{\\\\operatorname{Ann}_A(a)}$. Therefore, there exists an
        integer $m \\\\ge 1$ such that $f^m \\\\in \\\\operatorname{Ann}_A(a)$, i.e.,
        $f^m a = 0$ in $A$. By definition of localization at $f$, this means $a/f^n
        = 0$ in $A_f$, proving $\\\\psi$ is injective!\\n\\n*Surjectivity of $\\\\psi$:*
        Let $s \\\\in \\\\mathcal{O}_X(D(f))$. By Definition 3.1.4 and the fact that
        principal open sets form a basis, we can cover $D(f)$ by principal open subsets
        $\\\\{D(g_i)\\\\}_{i \\\\in I}$ such that on each $D(g_i)$, $s$ is represented
        by a fraction $a_i / h_i$ with $D(g_i) \\\\subseteq D(h_i)$. By Lemma 3.1.3(3),
        $D(g_i) \\\\subseteq D(h_i)$ implies $g_i^{n_i} = c_i h_i$ for some $n_i \\\\ge
        1$ and $c_i \\\\in A$. Then on $D(g_i) = D(g_i^{n_i})$, we can rewrite the
        fraction as:\\n$$\\\\frac{a_i}{h_i} = \\\\frac{c_i a_i}{c_i h_i} = \\\\frac{c_i
        a_i}{g_i^{n_i}}.$$\\nReplacing $g_i$ by $g_i^{n_i}$ and $a_i$ by $c_i a_i$,
        we may assume $s$ is represented on $D(g_i)$ by $a_i / g_i$. Furthermore,
        since $D(f)$ is quasi-compact by Lemma 3.1.3(4), we can pass to a finite subcover:\\n$$D(f)
        = \\\\bigcup_{i=1}^r D(g_i),$$\\nwhere $s|_{D(g_i)} = \\\\psi(a_i / g_i)$
        on $D(g_i)$ for $i = 1, \\\\dots, r$.\\n\\nNow consider the overlaps $D(g_i)
        \\\\cap D(g_j) = D(g_i g_j)$. On $D(g_i g_j)$, the two fractions $a_i / g_i
        = (g_j a_i)/(g_i g_j)$ and $a_j / g_j = (g_i a_j)/(g_i g_j)$ represent the
        exact same section $s|_{D(g_i g_j)}$. Applying the injectivity of $\\\\psi_{g_i
        g_j}: A_{g_i g_j} \\\\to \\\\mathcal{O}_X(D(g_i g_j))$ that we just proved
        above, we deduce that $a_i / g_i = a_j / g_j$ in $A_{g_i g_j}$. Hence, for
        each pair $(i, j)$, there exists an integer $m_{ij} \\\\ge 1$ such that:\\n$$(g_i
        g_j)^{m_{ij}} (g_j a_i - g_i a_j) = 0 \\\\quad \\\\text{in } A.$$\\nSince
        there are only finitely many pairs $(i, j) \\\\in \\\\{1, \\\\dots, r\\\\}^2$,
        we can choose a single integer $M = \\\\max_{i,j} m_{ij}$ that works simultaneously
        for all $i, j$:\\n$$g_i^M g_j^M (g_j a_i - g_i a_j) = 0 \\\\quad \\\\implies
        \\\\quad g_j^{M+1} (g_i^M a_i) = g_i^{M+1} (g_j^M a_j) \\\\quad \\\\text{in
        } A.$$\\nSetting $\\\\tilde{g}_i = g_i^{M+1}$ and $\\\\tilde{a}_i = g_i^M
        a_i$, we still have $D(\\\\tilde{g}_i) = D(g_i)$ and $\\\\tilde{a}_i / \\\\tilde{g}_i
        = a_i / g_i$, while the compatibility relation simplifies to:\\n$$\\\\tilde{g}_j
        \\\\tilde{a}_i = \\\\tilde{g}_i \\\\tilde{a}_j \\\\quad \\\\text{in } A \\\\text{
        for all } 1 \\\\le i, j \\\\le r.$$\\nFinally, since $D(f) \\\\subseteq \\\\bigcup_{i=1}^r
        D(\\\\tilde{g}_i)$, Lemma 3.1.3(3) (generalized to ideals via Proposition
        3.1.2(4)) implies that $f \\\\in \\\\sqrt{(\\\\tilde{g}_1, \\\\dots, \\\\tilde{g}_r)}$.
        Thus there exist an integer $N \\\\ge 1$ and elements $b_1, \\\\dots, b_r
        \\\\in A$ such that:\\n$$f^N = \\\\sum_{i=1}^r b_i \\\\tilde{g}_i.$$\\nDefine
        the element $a \\\\in A$ by $a = \\\\sum_{i=1}^r b_i \\\\tilde{a}_i$. Then
        for every $j \\\\in \\\\{1, \\\\dots, r\\\\}$, we compute in $A$:\\n$$\\\\tilde{g}_j
        a = \\\\sum_{i=1}^r b_i \\\\tilde{g}_j \\\\tilde{a}_i = \\\\sum_{i=1}^r b_i
        \\\\tilde{g}_i \\\\tilde{a}_j = \\\\left(\\\\sum_{i=1}^r b_i \\\\tilde{g}_i\\\\right)
        \\\\tilde{a}_j = f^N \\\\tilde{a}_j.$$\\nTherefore, in $A_\\\\mathfrak{q}$
        for every $\\\\mathfrak{q} \\\\in D(\\\\tilde{g}_j)$, we have:\\n$$\\\\frac{a}{f^N}
        = \\\\frac{\\\\tilde{a}_j}{\\\\tilde{g}_j} = s(\\\\mathfrak{q}).$$\\nSince
        the sets $D(\\\\tilde{g}_j)$ cover $D(f)$, this proves $\\\\psi(a/f^N) = s$,
        completing the proof of surjectivity! $\\\\blacksquare$\\n\\n---\\n\\n###
        3.2 General Schemes and Gluing\\n\\n**Definition 3.2.1.** \\n1. An **affine
        scheme** is a locally ringed space $(X, \\\\mathcal{O}_X)$ that is isomorphic
        (as a locally ringed space) to $(\\\\operatorname{Spec} A, \\\\mathcal{O}_{\\\\operatorname{Spec}
        A})$ for some commutative ring $A$.\\n2. A **scheme** is a locally ringed
        space $(X, \\\\mathcal{O}_X)$ in which every point $P \\\\in X$ has an open
        neighborhood $U \\\\subseteq X$ such that the restricted locally ringed space
        $(U, \\\\mathcal{O}_X|_U)$ is an affine scheme.\\n3. A **morphism of schemes**
        $f: (X, \\\\mathcal{O}_X) \\\\to (Y, \\\\mathcal{O}_Y)$ is a morphism of locally
        ringed spaces. The category of schemes is denoted $\\\\mathsf{Sch}$. For a
        fixed base scheme $S$ (or ring $A$ with $S = \\\\operatorname{Spec} A$), a
        **scheme over $S$** (or **$S$-scheme**) is a scheme $X$ equipped with a structure
        morphism $X \\\\to S$, and a morphism of $S$-schemes is a morphism $X \\\\to
        Y$ commuting with the structure morphisms to $S$. The category of $S$-schemes
        is denoted $\\\\mathsf{Sch}/S$ (or $\\\\mathsf{Sch}/A$).\\n\\nBefore constructing
        non-affine schemes, we prove the fundamental theorem that the category of
        affine schemes is anti-equivalent to the category of commutative rings, and
        more generally that morphisms from *any* scheme into an affine scheme are
        completely controlled by global sections.\\n\\n**Theorem 3.2.2.** *Let $(X,
        \\\\mathcal{O}_X)$ be an arbitrary scheme and $A$ be a commutative ring. There
        is a canonical bijection:*\\n$$\\\\operatorname{Hom}_{\\\\mathsf{Sch}}(X,
        \\\\operatorname{Spec} A) \\\\stackrel{\\\\sim}{\\\\longrightarrow} \\\\operatorname{Hom}_{\\\\mathsf{Rings}}(A,
        \\\\Gamma(X, \\\\mathcal{O}_X)),$$\\n*sending a morphism of schemes $(f, f^\\\\sharp):
        X \\\\to \\\\operatorname{Spec} A$ to the global sections homomorphism $f^\\\\sharp(\\\\operatorname{Spec}
        A): A \\\\cong \\\\Gamma(\\\\operatorname{Spec} A, \\\\mathcal{O}_{\\\\operatorname{Spec}
        A}) \\\\to \\\\Gamma(X, \\\\mathcal{O}_X)$.*\\n*In particular, the functor
        $\\\\operatorname{Spec}: \\\\mathsf{Rings}^{\\\\text{op}} \\\\to \\\\mathsf{AffSch}$
        is an equivalence of categories.*\\n\\n*Proof.* First, let us show how a ring
        homomorphism $\\\\varphi: A \\\\to B$ induces a canonical morphism of locally
        ringed spaces $(f, f^\\\\sharp): \\\\operatorname{Spec} B \\\\to \\\\operatorname{Spec}
        A$. For any prime ideal $\\\\mathfrak{q} \\\\in \\\\operatorname{Spec} B$,
        define $f(\\\\mathfrak{q}) = \\\\varphi^{-1}(\\\\mathfrak{q}) \\\\in \\\\operatorname{Spec}
        A$. For any ideal $\\\\mathfrak{a} \\\\subseteq A$, $f^{-1}(V(\\\\mathfrak{a}))
        = \\\\{\\\\mathfrak{q} \\\\in \\\\operatorname{Spec} B \\\\mid \\\\mathfrak{a}
        \\\\subseteq \\\\varphi^{-1}(\\\\mathfrak{q})\\\\} = V(\\\\varphi(\\\\mathfrak{a})B)$,
        so $f$ is continuous; on principal open sets, $f^{-1}(D(a)) = D(\\\\varphi(a))$.
        For each $\\\\mathfrak{q} \\\\in \\\\operatorname{Spec} B$, $\\\\varphi$ localizes
        to a local ring homomorphism $\\\\varphi_\\\\mathfrak{q}: A_{f(\\\\mathfrak{q})}
        \\\\to B_\\\\mathfrak{q}$. For any open $V \\\\subseteq \\\\operatorname{Spec}
        A$, define $f^\\\\sharp(V): \\\\mathcal{O}_{\\\\operatorname{Spec} A}(V) \\\\to
        \\\\mathcal{O}_{\\\\operatorname{Spec} B}(f^{-1}(V))$ by sending a section
        $s: V \\\\to \\\\bigsqcup_{\\\\mathfrak{p} \\\\in V} A_\\\\mathfrak{p}$ to
        the section $\\\\mathfrak{q} \\\\mapsto \\\\varphi_\\\\mathfrak{q}(s(f(\\\\mathfrak{q})))$.
        Because $s$ is locally a fraction $a/g$, $\\\\varphi_\\\\mathfrak{q}(s(f(\\\\mathfrak{q})))$
        is locally the fraction $\\\\varphi(a)/\\\\varphi(g)$, so $f^\\\\sharp(V)$
        is well-defined and the induced map on stalks at $\\\\mathfrak{q}$ is precisely
        the local homomorphism $\\\\varphi_\\\\mathfrak{q}: A_{f(\\\\mathfrak{q})}
        \\\\to B_\\\\mathfrak{q}$.\\n\\nNow let $X$ be an arbitrary scheme, and suppose
        we are given a morphism of locally ringed spaces $(f, f^\\\\sharp): X \\\\to
        \\\\operatorname{Spec} A$. Taking global sections gives a ring homomorphism
        $\\\\alpha = f^\\\\sharp(\\\\operatorname{Spec} A): A \\\\to \\\\Gamma(X,
        \\\\mathcal{O}_X)$. Let us show that $(f, f^\\\\sharp)$ is uniquely determined
        by $\\\\alpha$. For any point $x \\\\in X$, the commutative diagram relating
        global sections to stalks is:\\n$$\\\\begin{array}{ccc}\\nA = \\\\Gamma(\\\\operatorname{Spec}
        A, \\\\mathcal{O}_{\\\\operatorname{Spec} A}) & \\\\xrightarrow{\\\\alpha}
        & \\\\Gamma(X, \\\\mathcal{O}_X) \\\\\\\\\\n\\\\downarrow{\\\\operatorname{loc}_{f(x)}}
        & & \\\\downarrow{\\\\operatorname{res}_x} \\\\\\\\\\nA_{f(x)} = \\\\mathcal{O}_{\\\\operatorname{Spec}
        A, f(x)} & \\\\xrightarrow{f^\\\\sharp_x} & \\\\mathcal{O}_{X, x}\\n\\\\end{array}$$\\nBecause
        $(f, f^\\\\sharp)$ is a morphism of **locally** ringed spaces, $f^\\\\sharp_x$
        is a local homomorphism, which means $(f^\\\\sharp_x)^{-1}(\\\\mathfrak{m}_{X,
        x}) = \\\\mathfrak{m}_{\\\\operatorname{Spec} A, f(x)} = f(x) A_{f(x)}$. Pulling
        this maximal ideal back along the canonical localization map $\\\\operatorname{loc}_{f(x)}:
        A \\\\to A_{f(x)}$, the preimage of $f(x)A_{f(x)}$ in $A$ is the prime ideal
        $f(x) \\\\in \\\\operatorname{Spec} A$! By commutativity of the square, this
        preimage must equal $(\\\\operatorname{res}_x \\\\circ \\\\alpha)^{-1}(\\\\mathfrak{m}_{X,
        x})$. Thus the underlying continuous map $f: X \\\\to \\\\operatorname{Spec}
        A$ is forced to be:\\n$$f(x) = (\\\\operatorname{res}_x \\\\circ \\\\alpha)^{-1}(\\\\mathfrak{m}_{X,
        x}) \\\\quad \\\\text{for all } x \\\\in X.$$\\nMoreover, by the universal
        property of localization, the local homomorphism $f^\\\\sharp_x: A_{f(x)}
        \\\\to \\\\mathcal{O}_{X, x}$ is uniquely determined by $\\\\operatorname{res}_x
        \\\\circ \\\\alpha: A \\\\to \\\\mathcal{O}_{X, x}$. Since sections of a sheaf
        are determined by their germs in all stalks (Lemma 2.1.5), $f^\\\\sharp(V)$
        is also uniquely determined by $\\\\alpha$ for every open $V \\\\subseteq
        \\\\operatorname{Spec} A$. (Notice how crucially this uniqueness relies on
        $f^\\\\sharp_x$ being a *local* homomorphism!)\\n\\nConversely, given any
        ring homomorphism $\\\\alpha: A \\\\to \\\\Gamma(X, \\\\mathcal{O}_X)$, we
        cover $X$ by open affine subschemes $U_i \\\\cong \\\\operatorname{Spec} B_i$.
        Composing $\\\\alpha$ with the restriction maps $\\\\Gamma(X, \\\\mathcal{O}_X)
        \\\\to \\\\Gamma(U_i, \\\\mathcal{O}_X) = B_i$ gives ring homomorphisms $\\\\alpha_i:
        A \\\\to B_i$, which by the first paragraph induce morphisms of schemes $f_i:
        U_i \\\\to \\\\operatorname{Spec} A$. On every open affine subset $W \\\\subseteq
        U_i \\\\cap U_j$, the restrictions $f_i|_W$ and $f_j|_W$ induce the exact
        same ring homomorphism $A \\\\to \\\\Gamma(X, \\\\mathcal{O}_X) \\\\to \\\\Gamma(W,
        \\\\mathcal{O}_X)$, so by the uniqueness proved above, $f_i|_{U_i \\\\cap
        U_j} = f_j|_{U_i \\\\cap U_j}$. Thus the morphisms $f_i$ glue to a unique
        global morphism $f: X \\\\to \\\\operatorname{Spec} A$ inducing $\\\\alpha$.
        $\\\\blacksquare$\\n\\n*Example 3.2.3.* By Theorem 3.2.2, since $\\\\mathbb{Z}$
        is the initial object in the category of rings, $\\\\operatorname{Spec} \\\\mathbb{Z}$
        is the **terminal object** in the category of schemes $\\\\mathsf{Sch}$: every
        scheme $X$ has a unique morphism $X \\\\to \\\\operatorname{Spec} \\\\mathbb{Z}$.\\n\\nJust
        as differentiable manifolds are constructed by gluing open charts, schemes
        can be constructed by gluing schemes along open subsets, or directly from
        graded rings via the $\\\\operatorname{Proj}$ construction.\\n\\n**Lemma 3.2.4
        (Gluing Schemes).** *Suppose we are given a family of schemes $\\\\{X_i\\\\}_{i
        \\\\in I}$, for each $i, j \\\\in I$ an open subscheme $U_{ij} \\\\subseteq
        X_i$ (with $U_{ii} = X_i$), and isomorphisms of schemes $\\\\varphi_{ij}:
        U_{ij} \\\\stackrel{\\\\sim}{\\\\longrightarrow} U_{ji}$ such that:*\\n1.
        $\\\\varphi_{ii} = \\\\operatorname{id}_{X_i}$, *and* $\\\\varphi_{ji} = \\\\varphi_{ij}^{-1}$;\\n2.
        *For all $i, j, k \\\\in I$, $\\\\varphi_{ij}(U_{ij} \\\\cap U_{ik}) = U_{ji}
        \\\\cap U_{jk}$, and the **cocycle condition** holds on $U_{ij} \\\\cap U_{ik}$:*\\n$$\\\\varphi_{ik}
        = \\\\varphi_{jk} \\\\circ \\\\varphi_{ij}.$$\\n*Then there exists a scheme
        $X$, together with open embeddings $\\\\psi_i: X_i \\\\hookrightarrow X$ such
        that $X = \\\\bigcup_{i \\\\in I} \\\\psi_i(X_i)$, $\\\\psi_i(U_{ij}) = \\\\psi_i(X_i)
        \\\\cap \\\\psi_j(X_j)$, and $\\\\psi_i = \\\\psi_j \\\\circ \\\\varphi_{ij}$
        on $U_{ij}$. Moreover, $X$ is unique up to canonical isomorphism.*\\n\\n*Proof.*
        The cocycle condition ensures that the relation $x \\\\sim \\\\varphi_{ij}(x)$
        for $x \\\\in U_{ij}$ is an equivalence relation on the disjoint union $\\\\bigsqcup_{i
        \\\\in I} X_i$. Define $X = \\\\left(\\\\bigsqcup_{i \\\\in I} X_i\\\\right)/\\\\sim$
        with the quotient topology. Then the natural maps $\\\\psi_i: X_i \\\\to X$
        are open embeddings onto open subsets $V_i = \\\\psi_i(X_i)$ covering $X$.
        Via $\\\\psi_i$, each $V_i$ inherits a sheaf of rings $\\\\mathcal{O}_{V_i}
        = (\\\\psi_i)_* \\\\mathcal{O}_{X_i}$, and the isomorphisms $\\\\varphi_{ij}$
        induce isomorphisms $\\\\theta_{ij}: \\\\mathcal{O}_{V_i}|_{V_i \\\\cap V_j}
        \\\\stackrel{\\\\sim}{\\\\longrightarrow} \\\\mathcal{O}_{V_j}|_{V_i \\\\cap
        V_j}$ satisfying $\\\\theta_{ik} = \\\\theta_{jk} \\\\circ \\\\theta_{ij}$
        on $V_i \\\\cap V_j \\\\cap V_k$. For any open $U \\\\subseteq X$, defining
        $\\\\mathcal{O}_X(U) = \\\\{(s_i) \\\\in \\\\prod_i \\\\mathcal{O}_{V_i}(U
        \\\\cap V_i) \\\\mid \\\\theta_{ij}(s_i|_{U \\\\cap V_i \\\\cap V_j}) = s_j|_{U
        \\\\cap V_i \\\\cap V_j}\\\\}$ yields a sheaf of rings on $X$ restricting
        to $\\\\mathcal{O}_{V_i}$ on $V_i$, making $(X, \\\\mathcal{O}_X)$ a scheme.
        $\\\\blacksquare$\\n\\n**Definition 3.2.5 (The $\\\\operatorname{Proj}$ Construction).**
        Let $S = \\\\bigoplus_{d \\\\ge 0} S_d$ be a graded commutative ring. Let
        $S_+ = \\\\bigoplus_{d \\u003e 0} S_d$ be the **irrelevant ideal**. We define
        the set $\\\\operatorname{Proj} S$ to be the set of all **homogeneous prime
        ideals** $\\\\mathfrak{p} \\\\subset S$ such that $S_+ \\\\not\\\\subseteq
        \\\\mathfrak{p}$.\\n\\nFor any homogeneous ideal $\\\\mathfrak{a} \\\\subseteq
        S$, we define $V_+(\\\\mathfrak{a}) = \\\\{\\\\mathfrak{p} \\\\in \\\\operatorname{Proj}
        S \\\\mid \\\\mathfrak{a} \\\\subseteq \\\\mathfrak{p}\\\\}$. Exactly as in
        Proposition 3.1.2, the sets $V_+(\\\\mathfrak{a})$ form the closed sets of
        the **Zariski topology** on $\\\\operatorname{Proj} S$. For any homogeneous
        element $f \\\\in S_+$ of positive degree, we define the principal open subset
        $D_+(f) = \\\\{\\\\mathfrak{p} \\\\in \\\\operatorname{Proj} S \\\\mid f \\\\notin
        \\\\mathfrak{p}\\\\}$.\\n\\nFor each $\\\\mathfrak{p} \\\\in \\\\operatorname{Proj}
        S$, we define the **homogeneous localization** $S_{(\\\\mathfrak{p})}$ to
        be the subring of degree-$0$ elements in the localization of $S$ at the multiplicative
        set of homogeneous elements in $S \\\\setminus \\\\mathfrak{p}$:\\n$$S_{(\\\\mathfrak{p})}
        = \\\\left\\\\{ \\\\frac{a}{t} \\\\,\\\\middle|\\\\, a, t \\\\in S_d \\\\text{
        for some } d \\\\ge 0, \\\\, t \\\\notin \\\\mathfrak{p} \\\\right\\\\}.$$\\nNote
        that $S_{(\\\\mathfrak{p})}$ is a local ring with unique maximal ideal $\\\\mathfrak{m}_{(\\\\mathfrak{p})}
        = \\\\{a/t \\\\in S_{(\\\\mathfrak{p})} \\\\mid a \\\\in \\\\mathfrak{p}\\\\}$.
        Similarly, for homogeneous $f \\\\in S_d$ ($d \\u003e 0$), $S_{(f)}$ denotes
        the degree-$0$ subring of $S_f$:\\n$$S_{(f)} = \\\\left\\\\{ \\\\frac{a}{f^m}
        \\\\,\\\\middle|\\\\, m \\\\ge 0, \\\\, a \\\\in S_{md} \\\\right\\\\}.$$\\nFor
        any open $U \\\\subseteq \\\\operatorname{Proj} S$, we define $\\\\mathcal{O}_{\\\\operatorname{Proj}
        S}(U)$ to be the ring of functions $s: U \\\\to \\\\bigsqcup_{\\\\mathfrak{p}
        \\\\in U} S_{(\\\\mathfrak{p})}$ with $s(\\\\mathfrak{p}) \\\\in S_{(\\\\mathfrak{p})}$
        that are locally given by homogeneous fractions $a/f$ of degree $0$.\\n\\n**Proposition
        3.2.6.** *Let $S$ be a graded ring and $X = \\\\operatorname{Proj} S$.*\\n1.
        *For every $\\\\mathfrak{p} \\\\in X$, the stalk $\\\\mathcal{O}_{X, \\\\mathfrak{p}}$
        is canonically isomorphic to $S_{(\\\\mathfrak{p})}$.*\\n2. *The sets $\\\\{D_+(f)
        \\\\mid f \\\\in S_+ \\\\text{ homogeneous}\\\\}$ form an open cover of $X$,
        and for each homogeneous $f \\\\in S_+$, there is a canonical isomorphism
        of locally ringed spaces:*\\n$$(D_+(f), \\\\mathcal{O}_X|_{D_+(f)}) \\\\stackrel{\\\\sim}{\\\\longrightarrow}
        \\\\operatorname{Spec} S_{(f)}.$$\\n*Consequently, $(\\\\operatorname{Proj}
        S, \\\\mathcal{O}_{\\\\operatorname{Proj} S})$ is a scheme (and is naturally
        an $S_0$-scheme via $S_0 \\\\to S_{(f)}$).*\\n\\n*Proof.* Fix homogeneous
        $f \\\\in S_d$ ($d \\u003e 0$). We construct a bijection $\\\\phi: D_+(f)
        \\\\to \\\\operatorname{Spec} S_{(f)}$ by sending a homogeneous prime $\\\\mathfrak{p}
        \\\\in D_+(f)$ to $\\\\phi(\\\\mathfrak{p}) = \\\\{a/f^m \\\\in S_{(f)} \\\\mid
        a \\\\in \\\\mathfrak{p} \\\\cap S_{md}\\\\}$. Clearly $\\\\phi(\\\\mathfrak{p})$
        is a prime ideal of $S_{(f)}$. Conversely, given a prime ideal $\\\\mathfrak{q}
        \\\\in \\\\operatorname{Spec} S_{(f)}$, define a homogeneous ideal $\\\\mathfrak{p}
        = \\\\bigoplus_{e \\\\ge 0} \\\\mathfrak{p}_e \\\\subset S$ by setting:\\n$$\\\\mathfrak{p}_e
        = \\\\{a \\\\in S_e \\\\mid a^d / f^e \\\\in \\\\mathfrak{q}\\\\}.$$\\nLet
        us check that $\\\\mathfrak{p}_e$ is closed under addition: if $a, b \\\\in
        \\\\mathfrak{p}_e$, then $(a+b)^{2d}/f^{2e}$ expands as a sum of terms $(a^i
        b^{2d-i})/f^{2e}$; in each term, either $i \\\\ge d$ (so it is a multiple
        of $a^d/f^e \\\\in \\\\mathfrak{q}$) or $2d - i \\\\ge d$ (so it is a multiple
        of $b^d/f^e \\\\in \\\\mathfrak{q}$). Hence $((a+b)^d/f^e)^2 \\\\in \\\\mathfrak{q}$,
        and since $\\\\mathfrak{q}$ is prime, $(a+b)^d/f^e \\\\in \\\\mathfrak{q}$,
        so $a+b \\\\in \\\\mathfrak{p}_e$! Primality of $\\\\mathfrak{p}$ for homogeneous
        elements is immediate: $(ab)^d/f^{e+e'} = (a^d/f^e)(b^d/f^{e'}) \\\\in \\\\mathfrak{q}
        \\\\implies a \\\\in \\\\mathfrak{p}_e$ or $b \\\\in \\\\mathfrak{p}_{e'}$.
        Moreover, $\\\\phi$ and $\\\\mathfrak{q} \\\\mapsto \\\\mathfrak{p}$ are mutually
        inverse, and for homogeneous $g \\\\in S_e$, $\\\\phi(D_+(f) \\\\cap D_+(g))
        = \\\\phi(D_+(fg)) = D(g^d/f^e) \\\\subseteq \\\\operatorname{Spec} S_{(f)}$,
        showing $\\\\phi$ is a homeomorphism. Finally, for any $\\\\mathfrak{p} \\\\in
        D_+(f)$, the localization $(S_{(f)})_{\\\\phi(\\\\mathfrak{p})}$ is canonically
        isomorphic to $S_{(\\\\mathfrak{p})}$ (since any homogeneous fraction $a/t$
        with $t \\\\in S_e \\\\setminus \\\\mathfrak{p}$ can be written as $(a t^{d-1}
        / f^e) / (t^d / f^e)$), matching the structure sheaves identically. $\\\\blacksquare$\\n\\n**Example
        3.2.7 (Projective $n$-Space over a Ring).** For any ring $A$, we define **projective
        $n$-space over $A$** to be:\\n$$\\\\mathbb{P}^n_A = \\\\operatorname{Proj}
        A[x_0, x_1, \\\\dots, x_n],$$\\nwhere $\\\\deg x_i = 1$. By Proposition 3.2.6,
        $\\\\mathbb{P}^n_A$ is covered by the $n+1$ standard open affine charts $U_i
        = D_+(x_i) \\\\cong \\\\operatorname{Spec} A\\\\left[\\\\frac{x_0}{x_i}, \\\\dots,
        \\\\frac{\\\\widehat{x_i}}{x_i}, \\\\dots, \\\\frac{x_n}{x_i}\\\\right] \\\\cong
        \\\\mathbb{A}^n_A := \\\\operatorname{Spec} A[y_1, \\\\dots, y_n]$.\\n\\n---\\n\\n###
        3.3 Properties of Schemes\\n\\n**Definition 3.3.1.** Let $X$ be a scheme.\\n1.
        $X$ is **connected** if its underlying topological space is connected.\\n2.
        $X$ is **irreducible** if its underlying topological space is irreducible.\\n3.
        $X$ is **reduced** if for every open subset $U \\\\subseteq X$, the ring $\\\\mathcal{O}_X(U)$
        has no non-zero nilpotent elements. (Equivalently, by passing to stalks, $\\\\mathcal{O}_{X,
        x}$ is a reduced local ring for every $x \\\\in X$.)\\n4. $X$ is **integral**
        if for every non-empty open subset $U \\\\subseteq X$, the ring $\\\\mathcal{O}_X(U)$
        is an integral domain.\\n5. $X$ is **locally Noetherian** if it can be covered
        by open affine subsets $\\\\operatorname{Spec} A_i$ where each $A_i$ is a
        Noetherian ring. $X$ is **Noetherian** if it is locally Noetherian and quasi-compact
        (equivalently, $X$ can be covered by *finitely many* open affine subsets $\\\\operatorname{Spec}
        A_i$ with each $A_i$ Noetherian).\\n\\n**Proposition 3.3.2.** *A scheme $X$
        is integral if and only if it is both reduced and irreducible.*\\n\\n*Proof.*
        Suppose $X$ is integral. Then every $\\\\mathcal{O}_X(U)$ is a domain, hence
        reduced. If $X$ were reducible, we could find two non-empty disjoint open
        subsets $U_1, U_2 \\\\subseteq X$; then $\\\\mathcal{O}_X(U_1 \\\\sqcup U_2)
        = \\\\mathcal{O}_X(U_1) \\\\times \\\\mathcal{O}_X(U_2)$ would not be an integral
        domain (since $(1,0)(0,1) = (0,0)$), contradiction.\\n\\nConversely, suppose
        $X$ is reduced and irreducible, and let $U \\\\subseteq X$ be a non-empty
        open subset. Let $f, g \\\\in \\\\mathcal{O}_X(U)$ satisfy $fg = 0$. For each
        $x \\\\in U$, let $f_x, g_x \\\\in \\\\mathcal{O}_{X, x}$ be their germs,
        and define two closed subsets of $U$:\\n$$Z_1 = \\\\{x \\\\in U \\\\mid f_x
        \\\\in \\\\mathfrak{m}_{X, x}\\\\}, \\\\qquad Z_2 = \\\\{x \\\\in U \\\\mid
        g_x \\\\in \\\\mathfrak{m}_{X, x}\\\\}$$\\n(these are closed because on any
        affine chart $\\\\operatorname{Spec} A \\\\subseteq U$, $Z_1 \\\\cap \\\\operatorname{Spec}
        A = V(f|_{\\\\operatorname{Spec} A})$). For every $x \\\\in U$, since $\\\\mathcal{O}_{X,
        x}$ is local and $f_x g_x = 0 \\\\in \\\\mathfrak{m}_{X, x}$, at least one
        of $f_x$ or $g_x$ must lie in $\\\\mathfrak{m}_{X, x}$. Thus $U = Z_1 \\\\cup
        Z_2$. Since $X$ is irreducible, $U$ is irreducible, so $U = Z_1$ or $U = Z_2$;
        assume $U = Z_1$. Then on every open affine $\\\\operatorname{Spec} A \\\\subseteq
        U$, $V(f|_{\\\\operatorname{Spec} A}) = \\\\operatorname{Spec} A$, which by
        Lemma 3.1.3(2) means $f|_{\\\\operatorname{Spec} A}$ is nilpotent in $A$.
        Since $X$ is reduced, $A$ is reduced, so $f|_{\\\\operatorname{Spec} A} =
        0$. Covering $U$ by open affines gives $f = 0$, so $\\\\mathcal{O}_X(U)$ is
        an integral domain. $\\\\blacksquare$\\n\\nNotice that if $X$ is an integral
        scheme, then for every irreducible closed subset $Z \\\\subseteq X$ (and in
        particular for $Z = X$), there is a unique **generic point** $\\\\eta_Z \\\\in
        Z$ whose closure is $\\\\overline{\\\\{\\\\eta_Z\\\\}} = Z$: indeed, on any
        open affine $\\\\operatorname{Spec} A$ meeting $Z$, $Z \\\\cap \\\\operatorname{Spec}
        A = V(\\\\mathfrak{p})$ for a prime ideal $\\\\mathfrak{p} \\\\in \\\\operatorname{Spec}
        A$, and $\\\\overline{\\\\{\\\\mathfrak{p}\\\\}} = V(\\\\mathfrak{p})$. For
        $Z = X$, the stalk $\\\\mathcal{O}_{X, \\\\eta_X}$ at the generic point $\\\\eta_X$
        is a field, called the **function field** $K(X)$ of the integral scheme $X$
        (on any non-empty open affine $\\\\operatorname{Spec} A \\\\subseteq X$, $\\\\eta_X$
        corresponds to the zero ideal $(0) \\\\subset A$, so $K(X) = A_{(0)} = \\\\operatorname{Frac}(A)$).\\n\\nA
        subtlety of scheme theory is that a property defined via *an* open affine
        cover must be shown to hold for *every* open affine subscheme. This is handled
        by the **Affine Communication Lemma**.\\n\\n**Lemma 3.3.3 (Affine Communication
        Lemma).** *Let $\\\\mathcal{P}$ be a property of commutative rings satisfying:*\\n1.
        *(Localization)* *If $A$ satisfies $\\\\mathcal{P}$, then $A_f$ satisfies
        $\\\\mathcal{P}$ for every $f \\\\in A$.*\\n2. *(Finite Gluing)* *If $f_1,
        \\\\dots, f_r \\\\in A$ generate the unit ideal $(f_1, \\\\dots, f_r) = A$
        and $A_{f_i}$ satisfies $\\\\mathcal{P}$ for each $i = 1, \\\\dots, r$, then
        $A$ satisfies $\\\\mathcal{P}$.*\\n\\n*Suppose $X$ is a scheme covered by
        open affine subschemes $U_\\\\alpha = \\\\operatorname{Spec} A_\\\\alpha$
        such that each $A_\\\\alpha$ satisfies $\\\\mathcal{P}$. Then for **every**
        open affine subscheme $V = \\\\operatorname{Spec} B \\\\subseteq X$, the ring
        $B$ satisfies $\\\\mathcal{P}$.*\\n\\n*Proof.* First note that in any scheme
        $X$, the intersection of two open affine subschemes $U = \\\\operatorname{Spec}
        A$ and $V = \\\\operatorname{Spec} B$ can be covered by open subsets that
        are simultaneously principal open subsets of $U$ and of $V$: indeed, for any
        $x \\\\in U \\\\cap V$, choose $f \\\\in A$ with $x \\\\in D_A(f) \\\\subseteq
        U \\\\cap V$, and then since $D_A(f)$ is open in $V$, choose $g \\\\in B$
        with $x \\\\in D_B(g) \\\\subseteq D_A(f)$; then $D_B(g) = D_{A_f}(\\\\bar{g})
        = D_A(f \\\\tilde{g})$ where $\\\\bar{g} = \\\\tilde{g}/f^n \\\\in \\\\mathcal{O}_X(D_A(f))
        = A_f$.\\n\\nNow let $V = \\\\operatorname{Spec} B \\\\subseteq X$ be any
        open affine subscheme. Covering each $V \\\\cap U_\\\\alpha$ by simultaneous
        principal open subsets and using the quasi-compactness of $\\\\operatorname{Spec}
        B$, we find finitely many elements $g_1, \\\\dots, g_r \\\\in B$ such that
        $\\\\operatorname{Spec} B = \\\\bigcup_{i=1}^r D_B(g_i)$ (so $(g_1, \\\\dots,
        g_r) = B$) and for each $i$, there exists $\\\\alpha_i$ and $f_i \\\\in A_{\\\\alpha_i}$
        such that $D_B(g_i) = D_{A_{\\\\alpha_i}}(f_i)$ as open subschemes of $X$.
        Taking global sections gives $B_{g_i} \\\\cong (A_{\\\\alpha_i})_{f_i}$. Since
        $A_{\\\\alpha_i}$ satisfies $\\\\mathcal{P}$, Property (1) implies $B_{g_i}
        \\\\cong (A_{\\\\alpha_i})_{f_i}$ satisfies $\\\\mathcal{P}$ for each $i =
        1, \\\\dots, r$. By Property (2), $B$ satisfies $\\\\mathcal{P}$. $\\\\blacksquare$\\n\\n**Proposition
        3.3.4.** *A scheme $X$ is locally Noetherian if and only if for **every**
        open affine subscheme $U = \\\\operatorname{Spec} A \\\\subseteq X$, the ring
        $A$ is Noetherian.*\\n\\n*Proof.* By Lemma 3.3.3, it suffices to verify conditions
        (1) and (2) for the property of a ring being Noetherian. Condition (1) is
        standard: any ideal $I \\\\subseteq A_f$ is the extension $(I \\\\cap A)A_f$,
        so if $A$ is Noetherian, $I \\\\cap A$ is finitely generated, hence $I$ is
        finitely generated.\\n\\nFor Condition (2), suppose $(f_1, \\\\dots, f_r)
        = A$ and each $A_{f_i}$ is Noetherian. Let $\\\\phi_i: A \\\\to A_{f_i}$ be
        the localization map. Notice that for any ideal $I \\\\subseteq A$, we have:\\n$$I
        = \\\\bigcap_{i=1}^r \\\\phi_i^{-1}(I A_{f_i}).$$\\nIndeed, the inclusion
        $\\\\subseteq$ is obvious. Conversely, if $a \\\\in \\\\bigcap_{i=1}^r \\\\phi_i^{-1}(I
        A_{f_i})$, then for each $i$ there is an integer $n_i \\\\ge 1$ such that
        $f_i^{n_i} a \\\\in I$. Taking $N = \\\\max_i n_i$, the powers $f_1^N, \\\\dots,
        f_r^N$ also generate the unit ideal $A$ (since $V(f_1^N, \\\\dots, f_r^N)
        = \\\\bigcap V(f_i) = \\\\varnothing$), so $1 = \\\\sum_{i=1}^r c_i f_i^N$,
        giving $a = \\\\sum_{i=1}^r c_i (f_i^N a) \\\\in I$.\\n\\nNow if $I_1 \\\\subseteq
        I_2 \\\\subseteq I_3 \\\\subseteq \\\\dots$ is an ascending chain of ideals
        in $A$, then for each $i = 1, \\\\dots, r$, $I_1 A_{f_i} \\\\subseteq I_2
        A_{f_i} \\\\subseteq \\\\dots$ is an ascending chain in the Noetherian ring
        $A_{f_i}$, so it stabilizes. Since there are finitely many $i$, there exists
        $M$ such that $I_m A_{f_i} = I_M A_{f_i}$ for all $m \\\\ge M$ and all $i
        = 1, \\\\dots, r$. Then $I_m = \\\\bigcap_{i=1}^r \\\\phi_i^{-1}(I_m A_{f_i})
        = \\\\bigcap_{i=1}^r \\\\phi_i^{-1}(I_M A_{f_i}) = I_M$ for all $m \\\\ge
        M$, proving $A$ is Noetherian. $\\\\blacksquare$\\n\\n**Definition 3.3.5 (Properties
        of Morphisms).** Let $f: X \\\\to Y$ be a morphism of schemes.\\n1. $f$ is
        **locally of finite type** if there exists a covering of $Y$ by open affine
        subschemes $V_i = \\\\operatorname{Spec} B_i$ such that for each $i$, $f^{-1}(V_i)$
        can be covered by open affine subschemes $U_{ij} = \\\\operatorname{Spec}
        A_{ij}$ where each $A_{ij}$ is a finitely generated $B_i$-algebra.\\n2. $f$
        is **quasi-compact** if the preimage $f^{-1}(V)$ of every quasi-compact open
        subset $V \\\\subseteq Y$ (or equivalently, every open affine $V \\\\subseteq
        Y$) is quasi-compact.\\n3. $f$ is **of finite type** if it is locally of finite
        type and quasi-compact (equivalently, each $f^{-1}(V_i)$ can be covered by
        *finitely many* $\\\\operatorname{Spec} A_{ij}$ with $A_{ij}$ finitely generated
        over $B_i$).\\n4. $f$ is **affine** if for every open affine $V \\\\subseteq
        Y$, $f^{-1}(V)$ is an affine scheme.\\n5. $f$ is **finite** if it is affine
        and for every open affine $V = \\\\operatorname{Spec} B \\\\subseteq Y$, $f^{-1}(V)
        = \\\\operatorname{Spec} A$ where $A$ is a finitely generated $B$-module.\\n6.
        An **open immersion** (or open embedding) is a morphism $f: X \\\\to Y$ that
        induces an isomorphism of $X$ onto an open subscheme of $Y$.\\n7. A **closed
        immersion** (or closed embedding) is an affine morphism $f: X \\\\to Y$ such
        that for every open affine $V = \\\\operatorname{Spec} B \\\\subseteq Y$,
        $f^{-1}(V) \\\\cong \\\\operatorname{Spec}(B/I)$ for some ideal $I \\\\subseteq
        B$ (equivalently, $f$ is a homeomorphism onto a closed subset of $Y$ and $f^\\\\sharp:
        \\\\mathcal{O}_Y \\\\to f_* \\\\mathcal{O}_X$ is surjective).\\n\\nUsing the
        Affine Communication Lemma (Exercise 3.3), one checks that if $f: X \\\\to
        Y$ is locally of finite type (resp. finite, affine, a closed immersion), then
        the defining condition holds for *every* open affine $V = \\\\operatorname{Spec}
        B \\\\subseteq Y$ and open affine $U = \\\\operatorname{Spec} A \\\\subseteq
        f^{-1}(V)$.\\n\\n---\\n\\n### 3.4 Fiber Products of Schemes\\n\\nIn the category
        of schemes, the role of the Cartesian product (as well as intersections of
        subschemes, fibers of morphisms, and extensions of scalars) is unified by
        the categorical **fiber product**.\\n\\n**Definition 3.4.1.** Let $S$ be a
        scheme, and let $f: X \\\\to S$ and $g: Y \\\\to S$ be two $S$-schemes. A
        **fiber product** of $X$ and $Y$ over $S$, denoted $X \\\\times_S Y$, is a
        scheme equipped with projection morphisms $p_1: X \\\\times_S Y \\\\to X$
        and $p_2: X \\\\times_S Y \\\\to Y$ satisfying $f \\\\circ p_1 = g \\\\circ
        p_2$, which is universal with respect to this property: for any scheme $Z$
        and any morphisms $q_1: Z \\\\to X$ and $q_2: Z \\\\to Y$ such that $f \\\\circ
        q_1 = g \\\\circ q_2$, there exists a unique morphism $\\\\theta: Z \\\\to
        X \\\\times_S Y$ such that $p_1 \\\\circ \\\\theta = q_1$ and $p_2 \\\\circ
        \\\\theta = q_2$:\\n$$\\\\begin{array}{ccccc}\\nZ \\\\\\\\\\n& \\\\searrow^{\\\\exists
        ! \\\\theta} & \\\\xrightarrow{\\\\quad q_1 \\\\quad} & X \\\\\\\\\\n& \\\\downarrow{q_2}
        & X \\\\times_S Y & \\\\xrightarrow{p_1} & \\\\downarrow{f} \\\\\\\\\\n& Y
        & \\\\xrightarrow{p_2} & \\\\longrightarrow & S \\\\\\\\\\n& & \\\\xrightarrow{\\\\quad
        g \\\\quad}\\n\\\\end{array}$$\\nBy standard category theory, if $X \\\\times_S
        Y$ exists, it is unique up to unique isomorphism.\\n\\n**Theorem 3.4.2 (Existence
        of Fiber Products).** *For any two morphisms of schemes $f: X \\\\to S$ and
        $g: Y \\\\to S$, the fiber product $X \\\\times_S Y$ exists in the category
        of schemes.*\\n\\n*Proof.* We carry out the proof in four transparent steps
        by building up from affine schemes via gluing.\\n\\n**Step 1: $X = \\\\operatorname{Spec}
        A$, $Y = \\\\operatorname{Spec} B$, and $S = \\\\operatorname{Spec} R$ are
        all affine.**\\nBy Theorem 3.2.2, the morphisms $X \\\\to S$ and $Y \\\\to
        S$ correspond to ring homomorphisms $R \\\\to A$ and $R \\\\to B$, making
        $A$ and $B$ into $R$-algebras. Consider the tensor product $A \\\\otimes_R
        B$, equipped with the canonical $R$-algebra homomorphisms $i_1: A \\\\to A
        \\\\otimes_R B$ ($a \\\\mapsto a \\\\otimes 1$) and $i_2: B \\\\to A \\\\otimes_R
        B$ ($b \\\\mapsto 1 \\\\otimes b$). In the category of commutative rings,
        $(A \\\\otimes_R B, i_1, i_2)$ is the coproduct (pushout) of $A$ and $B$ over
        $R$: for any ring $C$ and ring homomorphisms $\\\\alpha: A \\\\to C$ and $\\\\beta:
        B \\\\to C$ agreeing on $R$, there is a unique ring homomorphism $\\\\gamma:
        A \\\\otimes_R B \\\\to C$ (sending $a \\\\otimes b \\\\mapsto \\\\alpha(a)\\\\beta(b)$)
        such that $\\\\gamma \\\\circ i_1 = \\\\alpha$ and $\\\\gamma \\\\circ i_2
        = \\\\beta$.\\n\\nNow let $W = \\\\operatorname{Spec}(A \\\\otimes_R B)$,
        with projection morphisms $p_1 = \\\\operatorname{Spec}(i_1): W \\\\to X$
        and $p_2 = \\\\operatorname{Spec}(i_2): W \\\\to Y$. For *any* scheme $Z$,
        applying the natural bijection $\\\\operatorname{Hom}_{\\\\mathsf{Sch}}(Z,
        \\\\operatorname{Spec} C) \\\\cong \\\\operatorname{Hom}_{\\\\mathsf{Rings}}(C,
        \\\\Gamma(Z, \\\\mathcal{O}_Z))$ of Theorem 3.2.2 reduces the universal property
        of $(W, p_1, p_2)$ for maps from $Z$ directly to the universal property of
        $A \\\\otimes_R B$ for maps into the ring $C = \\\\Gamma(Z, \\\\mathcal{O}_Z)$.
        Thus $\\\\operatorname{Spec}(A \\\\otimes_R B)$ is the fiber product $\\\\operatorname{Spec}
        A \\\\times_{\\\\operatorname{Spec} R} \\\\operatorname{Spec} B$ in the category
        of *all* schemes!\\n\\n**Step 2: Localization of fiber products for open subschemes.**\\nSuppose
        $X \\\\times_S Y$ exists for $X \\\\to S$ and $Y \\\\to S$, with projections
        $p_1, p_2$. If $U \\\\subseteq X$ is an open subscheme, then the open subscheme
        $p_1^{-1}(U) \\\\subseteq X \\\\times_S Y$ (with the restricted projections
        $p_1|_{p_1^{-1}(U)}: p_1^{-1}(U) \\\\to U$ and $p_2|_{p_1^{-1}(U)}$) is immediately
        seen to satisfy the universal property of the fiber product $U \\\\times_S
        Y$: indeed, any pair of morphisms $q_1: Z \\\\to U \\\\hookrightarrow X$ and
        $q_2: Z \\\\to Y$ agreeing over $S$ induces a unique morphism $\\\\theta:
        Z \\\\to X \\\\times_S Y$, and since $p_1 \\\\circ \\\\theta = q_1$ has image
        inside $U$, $\\\\theta(Z) \\\\subseteq p_1^{-1}(U)$, so $\\\\theta$ factors
        uniquely through the open subscheme $p_1^{-1}(U)$. Similarly, for open subschemes
        $U \\\\subseteq X$ and $V \\\\subseteq Y$, $p_1^{-1}(U) \\\\cap p_2^{-1}(V)$
        is canonically isomorphic to $U \\\\times_S V$.\\n\\n**Step 3: Gluing over
        an open cover of $X$ (with $Y$ and $S$ fixed).**\\nSuppose $Y$ and $S$ are
        fixed schemes, and $X = \\\\bigcup_{i \\\\in I} X_i$ is covered by open subschemes
        $X_i \\\\subseteq X$ such that the fiber product $W_i = X_i \\\\times_S Y$
        exists for every $i \\\\in I$ (with projections $p_{1,i}: W_i \\\\to X_i$
        and $p_{2,i}: W_i \\\\to Y$). For each pair $i, j \\\\in I$, let $X_{ij} =
        X_i \\\\cap X_j$. By Step 2, both $U_{ij} := p_{1,i}^{-1}(X_{ij}) \\\\subseteq
        W_i$ and $U_{ji} := p_{1,j}^{-1}(X_{ij}) \\\\subseteq W_j$ satisfy the universal
        property of the fiber product $X_{ij} \\\\times_S Y$. By the uniqueness up
        to *unique* isomorphism of universal objects, there is a unique isomorphism
        of schemes $\\\\varphi_{ij}: U_{ij} \\\\stackrel{\\\\sim}{\\\\longrightarrow}
        U_{ji}$ commuting with the projections to $X_{ij}$ and $Y$; furthermore, uniqueness
        of universal isomorphisms forces the cocycle condition $\\\\varphi_{ik} =
        \\\\varphi_{jk} \\\\circ \\\\varphi_{ij}$ on $U_{ij} \\\\cap U_{ik} = p_{1,i}^{-1}(X_i
        \\\\cap X_j \\\\cap X_k)$.\\n\\nBy the Gluing Lemma (Lemma 3.2.4), we can
        glue the schemes $\\\\{W_i\\\\}_{i \\\\in I}$ along $U_{ij}$ to obtain a scheme
        $W$ with open embeddings $W_i \\\\hookrightarrow W$ (which we treat as inclusions)
        and glued projection morphisms $p_1: W \\\\to X$ and $p_2: W \\\\to Y$ such
        that $p_1^{-1}(X_i) = W_i$. To verify that $W$ satisfies the universal property
        of $X \\\\times_S Y$, let $q_1: Z \\\\to X$ and $q_2: Z \\\\to Y$ satisfy
        $f \\\\circ q_1 = g \\\\circ q_2$. Setting $Z_i = q_1^{-1}(X_i)$, the universal
        property of $W_i = X_i \\\\times_S Y$ gives a unique morphism $\\\\theta_i:
        Z_i \\\\to W_i \\\\subseteq W$ commuting with projections. On $Z_i \\\\cap
        Z_j = q_1^{-1}(X_{ij})$, both $\\\\theta_i$ and $\\\\theta_j$ satisfy the
        universal property for $U_{ij} \\\\cong X_{ij} \\\\times_S Y$, so $\\\\theta_i|_{Z_i
        \\\\cap Z_j} = \\\\theta_j|_{Z_i \\\\cap Z_j}$. Thus the $\\\\theta_i$ glue
        to a unique morphism $\\\\theta: Z \\\\to W$, proving $W = X \\\\times_S Y$.\\n\\n**Step
        4: The general case.**\\nFirst assume $S = \\\\operatorname{Spec} R$ is affine
        and $Y = \\\\operatorname{Spec} B$ is affine, while $X$ is an arbitrary scheme.
        Cover $X = \\\\bigcup_i X_i$ by open affine subschemes $X_i = \\\\operatorname{Spec}
        A_i$. By Step 1, $X_i \\\\times_S Y$ exists for each $i$. By Step 3, $X \\\\times_S
        Y$ exists for arbitrary $X$ and affine $Y, S$.\\nNext, keep $S$ affine, and
        let $X$ and $Y$ both be arbitrary. Cover $Y = \\\\bigcup_j Y_j$ by open affines;
        since $X \\\\times_S Y_j$ exists for each $j$, applying Step 3 (with the roles
        of $X$ and $Y$ reversed) proves $X \\\\times_S Y$ exists whenever $S$ is affine.\\nFinally,
        let $X, Y, S$ be completely arbitrary schemes. Cover $S = \\\\bigcup_k S_k$
        by open affine subschemes $S_k$. Set $X_k = f^{-1}(S_k)$ and $Y_k = g^{-1}(S_k)$.
        Note that any two morphisms $q_1: Z \\\\to X_k$ and $q_2: Z \\\\to Y$ satisfying
        $f \\\\circ q_1 = g \\\\circ q_2$ automatically satisfy $q_2(Z) \\\\subseteq
        g^{-1}(S_k) = Y_k$. Thus the fiber product $X_k \\\\times_{S_k} Y_k$ (which
        exists because $S_k$ is affine) also satisfies the universal property of $X_k
        \\\\times_S Y$! Applying Step 3 to the open cover $X = \\\\bigcup_k X_k$ yields
        the fiber product $X \\\\times_S Y$. $\\\\blacksquare$\\n\\n**Applications
        of Fiber Products:**\\n1. **Fibers of a Morphism:** Let $f: X \\\\to Y$ be
        a morphism of schemes, and let $y \\\\in Y$ be a point with residue field
        $\\\\kappa(y) = \\\\mathcal{O}_{Y, y}/\\\\mathfrak{m}_{Y, y}$. The natural
        ring homomorphism $\\\\mathcal{O}_{Y, y} \\\\to \\\\kappa(y)$ induces a canonical
        morphism $\\\\operatorname{Spec} \\\\kappa(y) \\\\to \\\\operatorname{Spec}
        \\\\mathcal{O}_{Y, y} \\\\to Y$ with image $\\\\{y\\\\}$. We define the **scheme-theoretic
        fiber** of $f$ over $y$ to be the fiber product:\\n$$X_y = X \\\\times_Y \\\\operatorname{Spec}
        \\\\kappa(y).$$\\nIt is a scheme over the field $\\\\kappa(y)$ whose underlying
        topological space is canonically homeomorphic to the set-theoretic fiber $f^{-1}(y)
        \\\\subseteq X$ (Exercise 3.4).\\n2. **Base Change (Extension of Scalars):**
        If $X \\\\to S$ is an $S$-scheme and $S' \\\\to S$ is any morphism ofBase
        schemes, then $X_{S'} = X \\\\times_S S'$ is an $S'$-scheme called the **base
        change** of $X$ to $S'$. For instance, if $X$ is a scheme over a field $k$
        and $K/k$ is a field extension, $X_K = X \\\\times_{\\\\operatorname{Spec}
        k} \\\\operatorname{Spec} K$ is the base change of $X$ to $K$. Notice that
        by construction (Step 1 of Theorem 3.4.2), the properties of a morphism being
        locally of finite type, quasi-compact, of finite type, affine, finite, an
        open immersion, or a closed immersion are all **stable under base change**
        (i.e., if $X \\\\to S$ has the property, so does $X \\\\times_S S' \\\\to
        S'$).\\n\\n---\\n\\n### 3.5 Separated and Proper Morphisms\\n\\nBecause the
        Zariski topology is almost never Hausdorff (for any irreducible scheme of
        dimension $\\\\ge 1$, any two non-empty open sets intersect), we need a scheme-theoretic
        analogue of the Hausdorff condition. Recall that a topological space $X$ is
        Hausdorff if and only if the diagonal $\\\\Delta(X) \\\\subseteq X \\\\times
        X$ is closed.\\n\\n**Definition 3.5.1.** Let $f: X \\\\to Y$ be a morphism
        of schemes. By the universal property of the fiber product $X \\\\times_Y
        X$, the identity morphisms $\\\\operatorname{id}_X: X \\\\to X$ on both factors
        induce a unique morphism:\\n$$\\\\Delta = \\\\Delta_{X/Y}: X \\\\longrightarrow
        X \\\\times_Y X$$\\nsuch that $p_1 \\\\circ \\\\Delta = \\\\operatorname{id}_X$
        and $p_2 \\\\circ \\\\Delta = \\\\operatorname{id}_X$, called the **diagonal
        morphism**.\\nWe say that $f: X \\\\to Y$ is **separated** if the diagonal
        morphism $\\\\Delta_{X/Y}$ is a **closed immersion**. We say a scheme $X$
        is **separated** if its canonical morphism $X \\\\to \\\\operatorname{Spec}
        \\\\mathbb{Z}$ is separated.\\n\\n**Proposition 3.5.2.** *Every morphism of
        affine schemes $f: \\\\operatorname{Spec} A \\\\to \\\\operatorname{Spec}
        B$ is separated. Moreover, an arbitrary morphism $f: X \\\\to Y$ is separated
        if and only if the image $\\\\Delta(X)$ is a closed subset of $X \\\\times_Y
        X$.*\\n\\n*Proof.* For $X = \\\\operatorname{Spec} A$ and $Y = \\\\operatorname{Spec}
        B$, we have $X \\\\times_Y X = \\\\operatorname{Spec}(A \\\\otimes_B A)$,
        and the diagonal morphism $\\\\Delta: \\\\operatorname{Spec} A \\\\to \\\\operatorname{Spec}(A
        \\\\otimes_B A)$ corresponds to the multiplication ring homomorphism $\\\\mu:
        A \\\\otimes_B A \\\\to A$ sending $a \\\\otimes a' \\\\mapsto aa'$. Since
        $\\\\mu(a \\\\otimes 1) = a$, $\\\\mu$ is surjective! Thus $A \\\\cong (A
        \\\\otimes_B A)/\\\\ker(\\\\mu)$, which means $\\\\Delta$ is a closed immersion.\\n\\nFor
        a general morphism $f: X \\\\to Y$, cover $Y$ by open affines $V_i$ and $f^{-1}(V_i)$
        by open affines $U_{ij}$. Then for each $i, j$, the open subset $\\\\Omega_{ij}
        = p_1^{-1}(U_{ij}) \\\\cap p_2^{-1}(U_{ij}) \\\\cong U_{ij} \\\\times_{V_i}
        U_{ij}$ is an open neighborhood of $\\\\Delta(U_{ij})$ in $X \\\\times_Y X$,
        and $\\\\Delta^{-1}(\\\\Omega_{ij}) = U_{ij}$. By the affine case just proved,
        the restriction $\\\\Delta|_{U_{ij}}: U_{ij} \\\\to U_{ij} \\\\times_{V_i}
        U_{ij} = \\\\Omega_{ij}$ is already a closed immersion! This means $\\\\Delta$
        is *always* a **locally closed immersion** (a closed immersion into the open
        subset $\\\\Omega = \\\\bigcup_{i,j} \\\\Omega_{ij} \\\\subseteq X \\\\times_Y
        X$). A closed immersion into an open subset $\\\\Omega$ is a closed immersion
        into the ambient space $X \\\\times_Y X$ if and only if its image $\\\\Delta(X)$
        is closed in $X \\\\times_Y X$. $\\\\blacksquare$\\n\\nThe geometric analogue
        of a compact Hausdorff space (or a proper map of locally compact Hausdorff
        spaces) is a **proper morphism**. Since the Zariski topology is always quasi-compact,
        naive compactness is useless (for example, $\\\\mathbb{A}^1_k$ is quasi-compact,
        but it is \\\"missing\\\" the point at infinity). The breakthrough insight
        is that a variety $X$ is complete if and only if its product $X \\\\times
        Y$ with *every* test space $Y$ projects closed sets to closed sets.\\n\\n**Definition
        3.5.3.** A morphism of schemes $f: X \\\\to Y$ is **universally closed** if
        for every morphism $Y' \\\\to Y$, the base-changed morphism $f': X \\\\times_Y
        Y' \\\\to Y'$ is a closed map on underlying topological spaces (i.e., sends
        closed subsets to closed subsets).\\nA morphism $f: X \\\\to Y$ is **proper**
        if it is separated, of finite type, and universally closed. A scheme $X$ over
        a field $k$ is called **proper over $k$** (or **complete**) if the structure
        morphism $X \\\\to \\\\operatorname{Spec} k$ is proper.\\n\\n*Example 3.5.4.*
        The affine line $\\\\mathbb{A}^1_k \\\\to \\\\operatorname{Spec} k$ is *not*
        universally closed (and hence not proper): base changing by $\\\\mathbb{A}^1_k
        \\\\to \\\\operatorname{Spec} k$ gives the projection $p_2: \\\\mathbb{A}^1_k
        \\\\times_k \\\\mathbb{A}^1_k = \\\\mathbb{A}^2_k \\\\to \\\\mathbb{A}^1_k$
        sending $(x, y) \\\\mapsto y$. The hyperbola $Z = V(xy - 1) \\\\subseteq \\\\mathbb{A}^2_k$
        is closed, but its projection $p_2(Z) = \\\\mathbb{A}^1_k \\\\setminus \\\\{0\\\\}$
        is not closed in $\\\\mathbb{A}^1_k$!\\n\\nTo test separatedness and properness
        effectively\u2014and to prove that projective space $\\\\mathbb{P}^n_A \\\\to
        \\\\operatorname{Spec} A$ is proper\u2014Grothendieck introduced the **valuative
        criteria**, where valuation rings play the role of infinitesimal curves or
        sequences approaching a limit point.\\n\\nRecall that an integral domain $R$
        with fraction field $K = \\\\operatorname{Frac}(R)$ is a **valuation ring**
        if for every non-zero element $x \\\\in K^\\\\times$, either $x \\\\in R$
        or $x^{-1} \\\\in R$. Every valuation ring $R$ is a local ring: its non-units
        form the unique maximal ideal $\\\\mathfrak{m}_R = \\\\{x \\\\in R \\\\setminus
        \\\\{0\\\\} \\\\mid x^{-1} \\\\notin R\\\\} \\\\cup \\\\{0\\\\}$. Therefore,
        $T = \\\\operatorname{Spec} R$ has two key points: the **generic point** $\\\\eta
        = (0)$ (with $\\\\operatorname{Spec} K \\\\hookrightarrow \\\\operatorname{Spec}
        R$ mapping onto $\\\\{\\\\eta\\\\}$) and the **closed point** $s = \\\\mathfrak{m}_R$
        (the \\\"limit point\\\"). Furthermore, a local ring $(A, \\\\mathfrak{m}_A)$
        contained in $K$ is said to be **dominated** by $(R, \\\\mathfrak{m}_R)$ if
        $A \\\\subseteq R$ and $\\\\mathfrak{m}_R \\\\cap A = \\\\mathfrak{m}_A$.
        By a fundamental theorem of Chevalley and Krull (proved via Zorn's Lemma on
        local rings $(A, \\\\mathfrak{m}_A)$ ordered by domination), a subring $B
        \\\\subseteq K$ is integrally closed in $K$ if and only if $B$ is the intersection
        of all valuation rings of $K$ containing $B$, and any local subring $(A, \\\\mathfrak{m}_A)
        \\\\subseteq K$ is dominated by some valuation ring $(R, \\\\mathfrak{m}_R)$
        of $K$.\\n\\n**Theorem 3.5.5 (Valuative Criteria of Separatedness and Properness).**
        *Let $f: X \\\\to Y$ be a morphism of schemes, and assume $f$ is of finite
        type (or more generally, for separatedness, quasi-separated, meaning $\\\\Delta_{X/Y}$
        is quasi-compact). Consider any valuation ring $R$ with field of fractions
        $K = \\\\operatorname{Frac}(R)$, and any commutative solid-arrow diagram of
        schemes:*\\n$$\\\\begin{array}{ccc}\\n\\\\operatorname{Spec} K & \\\\xrightarrow{\\\\quad
        u \\\\quad} & X \\\\\\\\\\n\\\\downarrow{\\\\iota} & \\\\nearrow_{\\\\exists
        ! \\\\tilde{u}} & \\\\downarrow{f} \\\\\\\\\\n\\\\operatorname{Spec} R & \\\\xrightarrow{\\\\quad
        v \\\\quad} & Y\\n\\\\end{array}$$\\n1. *(Valuative Criterion of Separatedness)*
        $f$ *is separated if and only if for every valuation ring $R$ and every diagram
        as above, there exists **at most one** morphism $\\\\tilde{u}: \\\\operatorname{Spec}
        R \\\\to X$ making both triangles commute.*\\n2. *(Valuative Criterion of
        Properness)* $f$ *is proper if and only if for every valuation ring $R$ and
        every diagram as above, there exists a **unique** morphism $\\\\tilde{u}:
        \\\\operatorname{Spec} R \\\\to X$ making both triangles commute.*\\n\\n*Proof
        (Core Implications and Geometric Mechanism).* \\nFirst, suppose $f: X \\\\to
        Y$ is separated, and let $\\\\tilde{u}_1, \\\\tilde{u}_2: \\\\operatorname{Spec}
        R \\\\to X$ be two morphisms extending $u: \\\\operatorname{Spec} K \\\\to
        X$ over $v: \\\\operatorname{Spec} R \\\\to Y$. By the universal property
        of $X \\\\times_Y X$, the pair $(\\\\tilde{u}_1, \\\\tilde{u}_2)$ induces
        a morphism $w: \\\\operatorname{Spec} R \\\\to X \\\\times_Y X$ whose composition
        with $\\\\iota: \\\\operatorname{Spec} K \\\\to \\\\operatorname{Spec} R$
        factors through the diagonal $\\\\Delta(X)$ (since $\\\\tilde{u}_1 \\\\circ
        \\\\iota = u = \\\\tilde{u}_2 \\\\circ \\\\iota$). Since $f$ is separated,
        $\\\\Delta: X \\\\hookrightarrow X \\\\times_Y X$ is a closed immersion, so
        $w^{-1}(\\\\Delta(X)) \\\\subseteq \\\\operatorname{Spec} R$ is a closed subscheme
        containing the generic point $\\\\eta = (0) \\\\in \\\\operatorname{Spec}
        R$. Because the closure of $\\\\eta$ is all of $\\\\operatorname{Spec} R$
        and $R$ is an integral domain (hence reduced, so the only closed subscheme
        of $\\\\operatorname{Spec} R$ with underlying set $\\\\operatorname{Spec}
        R$ is $\\\\operatorname{Spec} R$ itself), $w$ must factor scheme-theoretically
        through $\\\\Delta(X) \\\\cong X$, which means $\\\\tilde{u}_1 = \\\\tilde{u}_2$!\\n\\nNext,
        suppose $f$ is proper, and we are given the solid diagram with $u, v$. Base
        changing $f: X \\\\to Y$ along $v: T = \\\\operatorname{Spec} R \\\\to Y$,
        a lift $\\\\tilde{u}: T \\\\to X$ is equivalent to a section $T \\\\to X_T
        = X \\\\times_Y T$ extending the induced map $u_T: \\\\operatorname{Spec}
        K \\\\to X_T$. Let $x_0 = u_T(\\\\eta) \\\\in X_T$, and let $Z = \\\\overline{\\\\{x_0\\\\}}
        \\\\subseteq X_T$ be its closure, equipped with the reduced induced closed
        subscheme structure (so $Z$ is an integral scheme with function field $\\\\mathcal{O}_{Z,
        x_0}$). Since $f$ is universally closed, $f_T: X_T \\\\to T$ is a closed map,
        so $f_T(Z) \\\\subseteq T$ is a closed subset containing the generic point
        $\\\\eta \\\\in T$. Thus $f_T(Z) = T$, which means there exists a point $z_1
        \\\\in Z$ mapping to the closed point $s = \\\\mathfrak{m}_R \\\\in T$. Considering
        the local ring $\\\\mathcal{O}_{Z, z_1} \\\\subseteq \\\\mathcal{O}_{Z, x_0}
        \\\\subseteq K$, the map $Z \\\\to T$ induces local homomorphisms $R \\\\to
        \\\\mathcal{O}_{Z, z_1} \\\\subseteq K$. Since $R$ is a valuation ring of
        $K$, it is a *maximal* local subring of $K$ under domination (if $R \\\\subseteq
        A \\\\subseteq K$ with $\\\\mathfrak{m}_A \\\\cap R = \\\\mathfrak{m}_R$,
        then for any $a \\\\in A \\\\setminus R$, $a^{-1} \\\\in \\\\mathfrak{m}_R
        \\\\subseteq \\\\mathfrak{m}_A$, impossible since $a \\\\in A$). Therefore
        $R = \\\\mathcal{O}_{Z, z_1}$! This isomorphism $\\\\mathcal{O}_{Z, z_1} \\\\stackrel{\\\\sim}{\\\\leftarrow}
        R$ induces a morphism $\\\\operatorname{Spec} R = \\\\operatorname{Spec} \\\\mathcal{O}_{Z,
        z_1} \\\\to Z \\\\hookrightarrow X_T \\\\to X$, providing the desired lift
        $\\\\tilde{u}$!\\n\\nConversely, if the valuative criterion of properness
        holds, the criterion for separatedness holds, and for any base change $X'
        \\\\to Y'$ and closed subset $Z \\\\subseteq X'$ (viewed as a reduced closed
        subscheme, which is a finite union of integral schemes $Z_i$), to show $f'(Z_i)$
        is closed in $Y'$, let $y_0 = f'(\\\\eta_{Z_i})$ and let $y_1 \\\\in \\\\overline{\\\\{y_0\\\\}}$
        be any specialization of $y_0$ in $Y'$. Replacing $Y'$ by the integral closed
        subscheme $\\\\overline{\\\\{y_0\\\\}}$, we have an inclusion of function
        fields $K(Y') \\\\hookrightarrow K(Z_i)$, and the local ring $\\\\mathcal{O}_{Y',
        y_1} \\\\subseteq K(Y') \\\\subseteq K(Z_i)$ can be dominated by a valuation
        ring $R$ of $K(Z_i)$. Applying the valuative criterion to $\\\\operatorname{Spec}
        K(Z_i) \\\\to Z_i \\\\hookrightarrow X'$ and $\\\\operatorname{Spec} R \\\\to
        \\\\operatorname{Spec} \\\\mathcal{O}_{Y', y_1} \\\\to Y'$ yields a lift $\\\\operatorname{Spec}
        R \\\\to X'$ factoring through the closed set $Z_i$ and sending the closed
        point $\\\\mathfrak{m}_R$ to a point $z_1 \\\\in Z_i$ mapping to $y_1 \\\\in
        Y'$, proving $f'(Z_i)$ is stable under specialization. Since $f'$ is quasi-compact,
        a constructible set (by Chevalley's theorem) or image of a quasi-compact morphism
        stable under specialization is closed! $\\\\blacksquare$\\n\\n**Corollary
        3.5.6.** *For every ring $A$ and integer $n \\\\ge 1$, projective $n$-space
        $\\\\mathbb{P}^n_A \\\\to \\\\operatorname{Spec} A$ is proper over $\\\\operatorname{Spec}
        A$. Consequently, every closed subscheme $X \\\\subseteq \\\\mathbb{P}^n_A$
        (a **projective $A$-scheme**) is proper over $\\\\operatorname{Spec} A$.*\\n\\n*Proof.*
        Clearly $\\\\mathbb{P}^n_A$ is of finite type over $\\\\operatorname{Spec}
        A$, being covered by $n+1$ copies of $\\\\mathbb{A}^n_A = \\\\operatorname{Spec}
        A[y_1, \\\\dots, y_n]$. To check the valuative criterion of properness (Theorem
        3.5.5(2)), let $R$ be a valuation ring with fraction field $K$, and suppose
        we are given a commutative diagram with $v: \\\\operatorname{Spec} R \\\\to
        \\\\operatorname{Spec} A$ (making $R$ an $A$-algebra) and $u: \\\\operatorname{Spec}
        K \\\\to \\\\mathbb{P}^n_A$.\\n\\nSince $\\\\operatorname{Spec} K$ is a single
        point, its image under $u$ lies in at least one of the standard open charts
        $U_i = D_+(x_i) \\\\subseteq \\\\mathbb{P}^n_A$. On the intersection of all
        $U_j$ containing $u(\\\\operatorname{Spec} K)$, the coordinates $x_j/x_i$
        become units in $K$, which means $u$ is given by a tuple of ratios $(c_0,
        c_1, \\\\dots, c_n) \\\\in K^{n+1} \\\\setminus \\\\{(0, \\\\dots, 0)\\\\}$
        defined up to simultaneous scaling by $K^\\\\times$ (where $x_j/x_i \\\\mapsto
        c_j/c_i$).\\n\\nConsider the fractional $R$-submodule of $K$ generated by
        $c_0, c_1, \\\\dots, c_n$: Because $R$ is a valuation ring, for any two elements
        $c_i, c_j \\\\in K^\\\\times$, either $c_i / c_j \\\\in R$ or $c_j / c_i \\\\in
        R$! By induction on $n$, among the non-zero elements in $\\\\{c_0, \\\\dots,
        c_n\\\\}$, there exists an index $i_0 \\\\in \\\\{0, \\\\dots, n\\\\}$ such
        that $c_{i_0} \\\\neq 0$ and:\\n$$a_j := \\\\frac{c_j}{c_{i_0}} \\\\in R \\\\quad
        \\\\text{for all } j = 0, 1, \\\\dots, n.$$\\nSince $a_{i_0} = 1 \\\\in R$
        and $a_j \\\\in R$ for all $j$, the $A$-algebra homomorphism $A[x_0/x_{i_0},
        \\\\dots, x_n/x_{i_0}] \\\\to R$ sending $x_j/x_{i_0} \\\\mapsto a_j$ defines
        a morphism $\\\\tilde{u}: \\\\operatorname{Spec} R \\\\to U_{i_0} \\\\subseteq
        \\\\mathbb{P}^n_A$ whose restriction to $\\\\operatorname{Spec} K$ is precisely
        $u$! Moreover, if $\\\\tilde{u}'$ is any other lift, it maps $\\\\operatorname{Spec}
        R$ into some chart $U_{j_0}$, hence is determined by the ring homomorphism
        $A[x_j/x_{j_0}] \\\\to R \\\\hookrightarrow K$, which is uniquely determined
        by $u: \\\\operatorname{Spec} K \\\\to \\\\mathbb{P}^n_A$. Thus $\\\\mathbb{P}^n_A
        \\\\to \\\\operatorname{Spec} A$ is proper. Finally, any closed immersion
        $X \\\\hookrightarrow \\\\mathbb{P}^n_A$ is manifestly proper, and the composition
        of proper morphisms is proper. $\\\\blacksquare$\\n\\n---\\n\\n### 3.6 Exercises
        for Chapter 3\\n\\n**Exercise 3.1 (Spectrum of $\\\\mathbb{Z}[x]$).** Describe
        all prime ideals of the ring $\\\\mathbb{Z}[x]$ and sketch $\\\\operatorname{Spec}
        \\\\mathbb{Z}[x]$ alongside its projection morphism $\\\\pi: \\\\operatorname{Spec}
        \\\\mathbb{Z}[x] \\\\to \\\\operatorname{Spec} \\\\mathbb{Z}$. Specifically:\\n(a)
        What is the generic point of $\\\\operatorname{Spec} \\\\mathbb{Z}[x]$, and
        what are the height-$1$ prime ideals of $\\\\mathbb{Z}[x]$?\\n(b) Prove that
        every maximal ideal of $\\\\mathbb{Z}[x]$ has height $2$ and is of the form
        $(p, f(x))$ where $p \\\\in \\\\mathbb{Z}$ is a prime number and $f(x) \\\\in
        \\\\mathbb{Z}[x]$ is a monic polynomial whose reduction modulo $p$ is irreducible
        in $\\\\mathbb{F}_p[x]$. What is the residue field $\\\\kappa(\\\\mathfrak{m})$?\\n\\n**Exercise
        3.2 (The Affine Line with a Doubled Origin).** Let $k$ be a field, and let
        $X_1 = \\\\operatorname{Spec} k[t]$ and $X_2 = \\\\operatorname{Spec} k[u]$
        be two copies of the affine line $\\\\mathbb{A}^1_k$. Let $U_{12} = D(t) =
        \\\\operatorname{Spec} k[t, t^{-1}] \\\\subseteq X_1$ and $U_{21} = D(u) =
        \\\\operatorname{Spec} k[u, u^{-1}] \\\\subseteq X_2$.\\n(a) If we glue $X_1$
        and $X_2$ along $U_{12} \\\\stackrel{\\\\sim}{\\\\longrightarrow} U_{21}$
        via the isomorphism induced by $u \\\\mapsto t$, show that the resulting scheme
        $X$ (the **affine line with a doubled origin**) is **not separated** over
        $k$. Verify explicitly that the valuative criterion of separatedness fails
        for $R = k[t]_{(t)}$.\\n(b) If instead we glue $X_1$ and $X_2$ along $U_{12}
        \\\\stackrel{\\\\sim}{\\\\longrightarrow} U_{21}$ via the isomorphism induced
        by $u \\\\mapsto t^{-1}$, show that the resulting scheme is canonically isomorphic
        to $\\\\mathbb{P}^1_k = \\\\operatorname{Proj} k[x_0, x_1]$, and is therefore
        separated and proper over $k$.\\n\\n**Exercise 3.3 (Affine Communication for
        Finite-Type Morphisms).** Let $f: X \\\\to Y$ be a morphism of schemes that
        is locally of finite type. Use Lemma 3.3.3 to prove that for *every* open
        affine subscheme $V = \\\\operatorname{Spec} B \\\\subseteq Y$ and *every*
        open affine subscheme $U = \\\\operatorname{Spec} A \\\\subseteq f^{-1}(V)$,
        $A$ is a finitely generated $B$-algebra.\\n\\n**Exercise 3.4 (Topological
        Space of Fibers and Geometric Points).** Let $f: X \\\\to Y$ be a morphism
        of schemes and $y \\\\in Y$ be a point.\\n(a) Prove that the projection $p_1:
        X_y = X \\\\times_Y \\\\operatorname{Spec} \\\\kappa(y) \\\\to X$ induces
        a homeomorphism from the underlying topological space of $X_y$ onto the subspace
        $f^{-1}(y) \\\\subseteq X$.\\n(b) Give an example of two reduced schemes $X$
        and $Y$ over a field $k$ such that the fiber product $X \\\\times_{\\\\operatorname{Spec}
        k} Y$ is: (i) not connected (even though $X$ and $Y$ are integral); (ii) not
        reduced! (Hint for (i): take $X = Y = \\\\operatorname{Spec} \\\\mathbb{C}$
        over $k = \\\\mathbb{R}$; for (ii): take $X = Y = \\\\operatorname{Spec} \\\\mathbb{F}_p(t^{1/p})$
        over $k = \\\\mathbb{F}_p(t)$.)\\n\\n**Exercise 3.5 (Stein Factorization Intuition:
        Global Functions on Proper Schemes).** Let $k$ be a field, and let $X$ be
        a connected, reduced scheme that is **proper** over $\\\\operatorname{Spec}
        k$.\\n(a) Let $f \\\\in \\\\Gamma(X, \\\\mathcal{O}_X)$ be a global section,
        which by Theorem 3.2.2 corresponds to a morphism $\\\\varphi_f: X \\\\to \\\\mathbb{A}^1_k
        = \\\\operatorname{Spec} k[t]$. By composing with the open immersion $\\\\mathbb{A}^1_k
        \\\\hookrightarrow \\\\mathbb{P}^1_k$, view $\\\\varphi_f$ as a morphism $X
        \\\\to \\\\mathbb{P}^1_k$.\\n(b) Prove that the image $\\\\varphi_f(X)$ is
        a closed, connected subset of $\\\\mathbb{P}^1_k$ that does not contain the
        point at infinity $\\\\infty \\\\in \\\\mathbb{P}^1_k \\\\setminus \\\\mathbb{A}^1_k$,
        and deduce that $\\\\Gamma(X, \\\\mathcal{O}_X)$ is a finite field extension
        of $k$ (and equal to $k$ if $k$ is algebraically closed).\\n\\n---\\n\\n##
        Chapter 4: Quasi-Coherent and Coherent Sheaves, Differentials, and Divisors\\n\\nOn
        a scheme $(X, \\\\mathcal{O}_X)$, general sheaves of $\\\\mathcal{O}_X$-modules
        can have pathological local behavior not reflective of the commutative algebra
        of the open affine charts. The sheaves that arise from modules over coordinate
        rings are called **quasi-coherent sheaves**; they form the true heart of algebraic
        geometry on schemes.\\n\\n### 4.1 The $\\\\widetilde{M}$ Construction and
        Quasi-Coherent Sheaves\\n\\n**Definition 4.1.1.** Let $A$ be a commutative
        ring, $X = \\\\operatorname{Spec} A$, and $M$ be an $A$-module. We define
        a sheaf of $\\\\mathcal{O}_X$-modules on $X$, denoted $\\\\widetilde{M}$,
        as follows. For every open subset $U \\\\subseteq X$, $\\\\widetilde{M}(U)$
        is the set of functions:\\n$$s: U \\\\longrightarrow \\\\bigsqcup_{\\\\mathfrak{p}
        \\\\in U} M_\\\\mathfrak{p}$$\\nsuch that $s(\\\\mathfrak{p}) \\\\in M_\\\\mathfrak{p}$
        for each $\\\\mathfrak{p} \\\\in U$, and such that $s$ is locally a fraction:
        for every $\\\\mathfrak{p} \\\\in U$, there exists an open neighborhood $V
        \\\\subseteq U$ of $\\\\mathfrak{p}$, an element $m \\\\in M$, and an element
        $f \\\\in A$ such that for every $\\\\mathfrak{q} \\\\in V$, we have $f \\\\notin
        \\\\mathfrak{q}$ and $s(\\\\mathfrak{q}) = m/f$ in $M_\\\\mathfrak{q}$.\\n\\n**Theorem
        4.1.2.** *Let $A$ be a ring, $X = \\\\operatorname{Spec} A$, and $M$ be an
        $A$-module.*\\n1. $\\\\widetilde{M}$ *is a sheaf of $\\\\mathcal{O}_X$-modules
        on $X$.*\\n2. *For every $\\\\mathfrak{p} \\\\in X$, the stalk $(\\\\widetilde{M})_\\\\mathfrak{p}$
        is canonically isomorphic to the localized $A_\\\\mathfrak{p}$-module $M_\\\\mathfrak{p}$.*\\n3.
        *For every $f \\\\in A$, there is a canonical isomorphism of $A_f$-modules:*\\n$$\\\\widetilde{M}(D(f))
        \\\\stackrel{\\\\sim}{\\\\longrightarrow} M_f.$$\\n*In particular, taking
        $f = 1$, we have $\\\\Gamma(X, \\\\widetilde{M}) \\\\cong M$.*\\n4. *The functor
        $M \\\\mapsto \\\\widetilde{M}$ from the category $\\\\mathfrak{Mod}(A)$ of
        $A$-modules to the category $\\\\mathfrak{Mod}(X)$ of $\\\\mathcal{O}_X$-modules
        is an exact, fully faithful functor that commutes with arbitrary direct sums
        and tensor products ($\\\\widetilde{M \\\\otimes_A N} \\\\cong \\\\widetilde{M}
        \\\\otimes_{\\\\mathcal{O}_X} \\\\widetilde{N}$).*\\n\\n*Proof.* The proofs
        of (1), (2), and (3) are verbatim identical to the proof of Theorem 3.1.5,
        replacing elements $a \\\\in A$ in numerators by elements $m \\\\in M$ and
        using the annihilator ideal $\\\\operatorname{Ann}_A(m) = \\\\{b \\\\in A
        \\\\mid bm = 0\\\\} \\\\subseteq A$.\\n\\nFor (4), full faithfulness follows
        from the adjunction between global sections $\\\\Gamma(X, -)$ and $\\\\widetilde{(-)}$:
        any morphism of $\\\\mathcal{O}_X$-modules $\\\\widetilde{M} \\\\to \\\\widetilde{N}$
        induces an $A$-module homomorphism $M = \\\\Gamma(X, \\\\widetilde{M}) \\\\to
        \\\\Gamma(X, \\\\widetilde{N}) = N$, which determines the map on every $D(f)$
        by localization $M_f \\\\to N_f$. Exactness of $M \\\\mapsto \\\\widetilde{M}$
        follows immediately from Theorem 2.2.3(2) because for every $\\\\mathfrak{p}
        \\\\in X$, localization $M \\\\mapsto M_\\\\mathfrak{p} \\\\cong (\\\\widetilde{M})_\\\\mathfrak{p}$
        is an exact functor! Similarly, for any two $A$-modules $M, N$, the natural
        morphism $\\\\widetilde{M} \\\\otimes_{\\\\mathcal{O}_X} \\\\widetilde{N}
        \\\\to \\\\widetilde{M \\\\otimes_A N}$ induces the canonical isomorphism
        $M_\\\\mathfrak{p} \\\\otimes_{A_\\\\mathfrak{p}} N_\\\\mathfrak{p} \\\\stackrel{\\\\sim}{\\\\longrightarrow}
        (M \\\\otimes_A N)_\\\\mathfrak{p}$ on all stalks, hence is an isomorphism
        by Lemma 2.1.5(2). $\\\\blacksquare$\\n\\nIf $\\\\varphi: A \\\\to B$ is a
        ring homomorphism and $f: \\\\operatorname{Spec} B \\\\to \\\\operatorname{Spec}
        A$ is the corresponding morphism of affine schemes, then for any $B$-module
        $N$ we have $f_*(\\\\widetilde{N}) = \\\\widetilde{N_A}$ (where $N_A$ is $N$
        viewed as an $A$-module), and for any $A$-module $M$ we have $f^*(\\\\widetilde{M})
        \\\\cong \\\\widetilde{M \\\\otimes_A B}$ (since $f^*$ is left adjoint to
        $f_*$, just as $-\\\\otimes_A B$ is left adjoint to restriction of scalars).\\n\\n**Definition
        4.1.3.** Let $(X, \\\\mathcal{O}_X)$ be an arbitrary scheme.\\n1. A sheaf
        of $\\\\mathcal{O}_X$-modules $\\\\mathcal{F}$ is **quasi-coherent** if $X$
        can be covered by open affine subschemes $U_i = \\\\operatorname{Spec} A_i$
        such that for each $i$, there exists an $A_i$-module $M_i$ with $\\\\mathcal{F}|_{U_i}
        \\\\cong \\\\widetilde{M_i}$ as $\\\\mathcal{O}_{U_i}$-modules.\\n2. Suppose
        $X$ is a locally Noetherian scheme (or more generally, define finite type
        / coherent modules). A sheaf of $\\\\mathcal{O}_X$-modules $\\\\mathcal{F}$
        on a locally Noetherian scheme $X$ is **coherent** if $X$ can be covered by
        open affine subschemes $U_i = \\\\operatorname{Spec} A_i$ such that for each
        $i$, there exists a **finitely generated** $A_i$-module $M_i$ with $\\\\mathcal{F}|_{U_i}
        \\\\cong \\\\widetilde{M_i}$.\\n\\nWe denote the full subcategory of $\\\\mathfrak{Mod}(X)$
        consisting of quasi-coherent (resp. coherent) $\\\\mathcal{O}_X$-modules by
        $\\\\mathfrak{Qcoh}(X)$ (resp. $\\\\mathfrak{Coh}(X)$). To prove that a quasi-coherent
        sheaf is of the form $\\\\widetilde{M}$ on *every* open affine subscheme of
        $X$, we establish a fundamental lemma on extending sections over principal
        open subsets.\\n\\n**Lemma 4.1.4.** *Let $X$ be a scheme, $\\\\mathcal{F}$
        be a quasi-coherent $\\\\mathcal{O}_X$-module on $X$, and $f \\\\in \\\\Gamma(X,
        \\\\mathcal{O}_X)$ be a global function, with $X_f = \\\\{x \\\\in X \\\\mid
        f_x \\\\notin \\\\mathfrak{m}_{X, x}\\\\}$ the open subset where $f$ does
        not vanish.*\\n1. *Suppose $X$ is quasi-compact. If $s \\\\in \\\\Gamma(X,
        \\\\mathcal{F})$ is a global section whose restriction $s|_{X_f} = 0$ in $\\\\mathcal{F}(X_f)$,
        then there exists an integer $n \\\\ge 1$ such that $f^n s = 0$ in $\\\\Gamma(X,
        \\\\mathcal{F})$.*\\n2. *Suppose $X$ is quasi-compact and quasi-separated
        (meaning the intersection of any two open affine subschemes of $X$ is quasi-compact;
        for instance, if $X$ is separated or Noetherian). Then for every section $t
        \\\\in \\\\mathcal{F}(X_f)$, there exists an integer $n \\\\ge 1$ such that
        $f^n t \\\\in \\\\mathcal{F}(X_f)$ is the restriction to $X_f$ of a global
        section in $\\\\Gamma(X, \\\\mathcal{F})$. In short, the canonical map:*\\n$$\\\\Gamma(X,
        \\\\mathcal{F})_f \\\\stackrel{\\\\sim}{\\\\longrightarrow} \\\\Gamma(X_f,
        \\\\mathcal{F})$$\\n*is an isomorphism!*\\n\\n*Proof.* (1) Since $X$ is quasi-compact
        and $\\\\mathcal{F}$ is quasi-coherent, we can cover $X$ by finitely many
        open affine subschemes $U_i = \\\\operatorname{Spec} A_i$ ($i = 1, \\\\dots,
        r$) such that $\\\\mathcal{F}|_{U_i} \\\\cong \\\\widetilde{M_i}$ for an $A_i$-module
        $M_i$. Notice that $U_i \\\\cap X_f = D_{A_i}(f|_{U_i})$. Since $s|_{U_i \\\\cap
        X_f} = 0$, Theorem 4.1.2(3) gives $\\\\mathcal{F}(U_i \\\\cap X_f) \\\\cong
        (M_i)_{f|_{U_i}}$, so there exists an integer $n_i \\\\ge 1$ such that $f^{n_i}
        s|_{U_i} = 0$ in $M_i = \\\\mathcal{F}(U_i)$. Taking $n = \\\\max_{1 \\\\le
        i \\\\le r} n_i$, we have $(f^n s)|_{U_i} = 0$ for all $i = 1, \\\\dots, r$,
        so $f^n s = 0$ in $\\\\Gamma(X, \\\\mathcal{F})$ by the sheaf Locality Axiom.\\n\\n(2)
        Keep the finite open affine cover $X = \\\\bigcup_{i=1}^r U_i$ with $\\\\mathcal{F}|_{U_i}
        \\\\cong \\\\widetilde{M_i}$. Let $t \\\\in \\\\mathcal{F}(X_f)$. For each
        $i$, the restriction $t|_{U_i \\\\cap X_f}$ lies in $\\\\mathcal{F}(D_{A_i}(f|_{U_i}))
        \\\\cong (M_i)_{f|_{U_i}}$, so there exists an integer $m_i \\\\ge 1$ and
        a section $s_i \\\\in \\\\mathcal{F}(U_i) = M_i$ such that $s_i|_{U_i \\\\cap
        X_f} = f^{m_i} t|_{U_i \\\\cap X_f}$. Taking $m = \\\\max_i m_i$ and replacing
        $s_i$ by $f^{m - m_i} s_i$ and $t$ by $f^m t$, we have sections $s_i \\\\in
        \\\\mathcal{F}(U_i)$ such that $s_i|_{U_i \\\\cap X_f} = t|_{U_i \\\\cap X_f}$
        for each $i = 1, \\\\dots, r$.\\n\\nNow consider the overlaps $U_i \\\\cap
        U_j$. On $(U_i \\\\cap U_j) \\\\cap X_f = (U_i \\\\cap U_j)_f$, the difference
        $s_i|_{U_i \\\\cap U_j} - s_j|_{U_i \\\\cap U_j} \\\\in \\\\mathcal{F}(U_i
        \\\\cap U_j)$ restricts to $t - t = 0$. Since $X$ is quasi-separated, $U_i
        \\\\cap U_j$ is a quasi-compact scheme! Applying part (1) to the quasi-compact
        scheme $U_i \\\\cap U_j$ and the section $s_i|_{U_i \\\\cap U_j} - s_j|_{U_i
        \\\\cap U_j}$, there exists an integer $k_{ij} \\\\ge 1$ such that:\\n$$f^{k_{ij}}
        \\\\left(s_i|_{U_i \\\\cap U_j} - s_j|_{U_i \\\\cap U_j}\\\\right) = 0 \\\\quad
        \\\\text{in } \\\\mathcal{F}(U_i \\\\cap U_j).$$\\nTaking $k = \\\\max_{1
        \\\\le i,j \\\\le r} k_{ij}$, the sections $f^k s_i \\\\in \\\\mathcal{F}(U_i)$
        agree on all overlaps $U_i \\\\cap U_j$, hence glue by the sheaf Gluing Axiom
        to a global section $s \\\\in \\\\Gamma(X, \\\\mathcal{F})$ satisfying $s|_{X_f}
        = f^k t$. $\\\\blacksquare$\\n\\n**Theorem 4.1.5.** *Let $X$ be a scheme and
        $\\\\mathcal{F}$ be an $\\\\mathcal{O}_X$-module.*\\n1. $\\\\mathcal{F}$ *is
        quasi-coherent if and only if for **every** open affine subscheme $U = \\\\operatorname{Spec}
        A \\\\subseteq X$, there is an $A$-module $M$ such that $\\\\mathcal{F}|_U
        \\\\cong \\\\widetilde{M}$.*\\n2. *In particular, if $X = \\\\operatorname{Spec}
        A$ is affine, the functor $M \\\\mapsto \\\\widetilde{M}$ is an equivalence
        of categories between $\\\\mathfrak{Mod}(A)$ and $\\\\mathfrak{Qcoh}(\\\\operatorname{Spec}
        A)$, with quasi-inverse $\\\\mathcal{F} \\\\mapsto \\\\Gamma(X, \\\\mathcal{F})$.*\\n3.
        *For any scheme $X$, kernels, cokernels, and images of morphisms of quasi-coherent
        sheaves are quasi-coherent, so $\\\\mathfrak{Qcoh}(X)$ is an abelian subcategory
        of $\\\\mathfrak{Mod}(X)$ (and $\\\\mathfrak{Coh}(X)$ is an abelian subcategory
        when $X$ is locally Noetherian).*\\n\\n*Proof.* Let $\\\\mathcal{F}$ be quasi-coherent
        on $X$, and let $U = \\\\operatorname{Spec} A \\\\subseteq X$ be any open
        affine subscheme. Set $M = \\\\Gamma(U, \\\\mathcal{F})$. By adjunction (evaluating
        sections on principal open subsets $D(f)$), there is a natural morphism of
        $\\\\mathcal{O}_U$-modules $\\\\alpha: \\\\widetilde{M} \\\\to \\\\mathcal{F}|_U$.
        Because $U = \\\\operatorname{Spec} A$ is an affine scheme, it is both quasi-compact
        and separated (Proposition 3.5.2), hence quasi-separated! For every $f \\\\in
        A$, applying Lemma 4.1.4(2) to the quasi-coherent sheaf $\\\\mathcal{F}|_U$
        on the affine scheme $U = \\\\operatorname{Spec} A$ shows that the map on
        sections over $D(f)$:\\n$$\\\\alpha(D(f)): \\\\widetilde{M}(D(f)) = M_f =
        \\\\Gamma(U, \\\\mathcal{F})_f \\\\stackrel{\\\\sim}{\\\\longrightarrow} \\\\Gamma(D(f),
        \\\\mathcal{F})$$\\nis an isomorphism! Since $\\\\{D(f) \\\\mid f \\\\in A\\\\}$
        is a basis for the topology of $U$, $\\\\alpha: \\\\widetilde{M} \\\\stackrel{\\\\sim}{\\\\longrightarrow}
        \\\\mathcal{F}|_U$ is an isomorphism of sheaves. This proves (1) and (2).
        Finally, (3) follows immediately from (1) and the exactness of $M \\\\mapsto
        \\\\widetilde{M}$ (Theorem 4.1.2(4)). $\\\\blacksquare$\\n\\n---\\n\\n###
        4.2 Sheaves on Projective Schemes\\n\\nLet $S = \\\\bigoplus_{d \\\\ge 0}
        S_d$ be a graded ring, and let $X = \\\\operatorname{Proj} S$. We extend the
        $\\\\widetilde{M}$ construction to graded $S$-modules.\\n\\n**Definition 4.2.1.**
        Let $M = \\\\bigoplus_{d \\\\in \\\\mathbb{Z}} M_d$ be a $\\\\mathbb{Z}$-graded
        $S$-module. For each homogeneous prime ideal $\\\\mathfrak{p} \\\\in \\\\operatorname{Proj}
        S$, we define the **homogeneous localization** $M_{(\\\\mathfrak{p})}$ to
        be the $S_{(\\\\mathfrak{p})}$-module of degree-$0$ fractions:\\n$$M_{(\\\\mathfrak{p})}
        = \\\\left\\\\{ \\\\frac{m}{t} \\\\,\\\\middle|\\\\, m \\\\in M_d, \\\\, t
        \\\\in S_d \\\\setminus \\\\mathfrak{p} \\\\text{ for some } d \\\\ge 0 \\\\right\\\\}.$$\\nWe
        define the sheaf $\\\\widetilde{M}$ on $X = \\\\operatorname{Proj} S$ by setting
        $\\\\widetilde{M}(U)$ for each open $U \\\\subseteq X$ to be the set of functions
        $s: U \\\\to \\\\bigsqcup_{\\\\mathfrak{p} \\\\in U} M_{(\\\\mathfrak{p})}$
        with $s(\\\\mathfrak{p}) \\\\in M_{(\\\\mathfrak{p})}$ that are locally represented
        by homogeneous fractions $m/f$ of degree $0$.\\n\\nFor each homogeneous element
        $f \\\\in S_d$ ($d \\u003e 0$), let $M_{(f)} = \\\\{m/f^k \\\\mid k \\\\ge
        0, m \\\\in M_{kd}\\\\}$ be the degree-$0$ part of $M_f$, which is naturally
        an $S_{(f)}$-module. Just as in Proposition 3.2.6, under the canonical isomorphism
        $D_+(f) \\\\cong \\\\operatorname{Spec} S_{(f)}$, the restriction $\\\\widetilde{M}|_{D_+(f)}$
        is canonically identified with the quasi-coherent sheaf $\\\\widetilde{M_{(f)}}$
        on $\\\\operatorname{Spec} S_{(f)}$. Thus $\\\\widetilde{M}$ is a quasi-coherent
        $\\\\mathcal{O}_X$-module on $X = \\\\operatorname{Proj} S$ (and is coherent
        if $S$ is Noetherian and $M$ is finitely generated).\\n\\n**Definition 4.2.2
        (Twisting Sheaves $\\\\mathcal{O}_X(n)$).** For any integer $n \\\\in \\\\mathbb{Z}$
        and any graded $S$-module $M$, define the **shifted graded $S$-module** $M(n)$
        by setting its degree-$d$ piece to be:\\n$$M(n)_d = M_{n+d}.$$\\nWe define
        the **twisting sheaf** $\\\\mathcal{O}_X(n)$ on $X = \\\\operatorname{Proj}
        S$ to be:\\n$$\\\\mathcal{O}_X(n) = \\\\widetilde{S(n)}.$$\\nMore generally,
        for any $\\\\mathcal{O}_X$-module $\\\\mathcal{F}$ on $X$, we define $\\\\mathcal{F}(n)
        = \\\\mathcal{F} \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{O}_X(n)$.\\n\\n**Assume
        henceforth that the graded ring $S$ is generated as an $S_0$-algebra by $S_1$**
        (for example, $S = A[x_0, \\\\dots, x_n]$ with $X = \\\\mathbb{P}^n_A$). This
        assumption has a crucial geometric consequence: $X = \\\\operatorname{Proj}
        S$ is covered by the principal open sets $\\\\{D_+(f) \\\\mid f \\\\in S_1\\\\}$
        where $\\\\deg f = 1$!\\n\\n**Proposition 4.2.3.** *Suppose $S$ is generated
        by $S_1$ as an $S_0$-algebra, and let $X = \\\\operatorname{Proj} S$.*\\n1.
        *For every $n \\\\in \\\\mathbb{Z}$, $\\\\mathcal{O}_X(n)$ is an **invertible
        sheaf** (i.e., a locally free $\\\\mathcal{O}_X$-module of rank $1$, or line
        bundle) on $X$.*\\n2. *For any graded $S$-module $M$ and any $n \\\\in \\\\mathbb{Z}$,
        there is a canonical isomorphism $\\\\widetilde{M(n)} \\\\cong \\\\widetilde{M}
        \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{O}_X(n) = \\\\widetilde{M}(n)$.
        In particular, for all $n, m \\\\in \\\\mathbb{Z}$:*\\n$$\\\\mathcal{O}_X(n)
        \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{O}_X(m) \\\\stackrel{\\\\sim}{\\\\longrightarrow}
        \\\\mathcal{O}_X(n+m).$$\\n\\n*Proof.* Since $S$ is generated by $S_1$ over
        $S_0$, $X$ is covered by the open affines $D_+(f) = \\\\operatorname{Spec}
        S_{(f)}$ for $f \\\\in S_1$. On $D_+(f)$ with $\\\\deg f = 1$, the $S_{(f)}$-module
        $S(n)_{(f)}$ consists of fractions $a/f^k$ where $a \\\\in S(n)_k = S_{n+k}$.
        Multiplication by $f^n$ gives an isomorphism of $S_{(f)}$-modules:\\n$$S_{(f)}
        \\\\stackrel{\\\\sim}{\\\\longrightarrow} S(n)_{(f)}, \\\\qquad \\\\frac{b}{f^k}
        \\\\longmapsto \\\\frac{b f^n}{f^k} = f^n \\\\cdot \\\\frac{b}{f^k}.$$\\nThus
        $S(n)_{(f)} = f^n S_{(f)}$ is a free $S_{(f)}$-module of rank $1$ generated
        by $f^n/1 \\\\in S(n)_{(f)}$. Taking associated sheaves shows $\\\\mathcal{O}_X(n)|_{D_+(f)}
        \\\\cong \\\\mathcal{O}_{D_+(f)}$, proving (1). Similarly, for any graded
        $S$-module $M$, on $D_+(f)$ ($\\\\deg f = 1$), we have $M_{(f)} \\\\otimes_{S_{(f)}}
        S(n)_{(f)} = M_{(f)} \\\\otimes_{S_{(f)}} f^n S_{(f)} \\\\stackrel{\\\\sim}{\\\\longrightarrow}
        M(n)_{(f)}$ via $(m/f^k) \\\\otimes f^n \\\\mapsto (m f^n)/f^k$, which is
        canonical (independent of $f$) and therefore glues over all $f \\\\in S_1$
        to an isomorphism $\\\\widetilde{M} \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{O}_X(n)
        \\\\stackrel{\\\\sim}{\\\\longrightarrow} \\\\widetilde{M(n)}$. $\\\\blacksquare$\\n\\n*Example
        4.2.4 (Global Sections of $\\\\mathcal{O}(n)$ on $\\\\mathbb{P}^r_A$).* Let
        $S = A[x_0, \\\\dots, x_r]$ and $X = \\\\mathbb{P}^r_A$. For any $n \\\\in
        \\\\mathbb{Z}$, there is a natural $A$-module homomorphism $S_n \\\\to \\\\Gamma(\\\\mathbb{P}^r_A,
        \\\\mathcal{O}(n))$ sending a homogeneous polynomial $g \\\\in S_n$ to the
        global section whose restriction to $D_+(x_i)$ is $g = (g/x_i^n) \\\\cdot
        x_i^n \\\\in S(n)_{(x_i)}$. We will prove in Theorem 5.3.1 (when we compute
        the cohomology of projective space) that for $r \\\\ge 1$, this canonical
        map:\\n$$S_n = A[x_0, \\\\dots, x_r]_n \\\\stackrel{\\\\sim}{\\\\longrightarrow}
        \\\\Gamma(\\\\mathbb{P}^r_A, \\\\mathcal{O}_{\\\\mathbb{P}^r_A}(n))$$\\nis
        an isomorphism for all $n \\\\in \\\\mathbb{Z}$ (in particular, $\\\\Gamma(\\\\mathbb{P}^r_A,
        \\\\mathcal{O}(n)) = 0$ for $n \\u003c 0$, and $\\\\Gamma(\\\\mathbb{P}^r_A,
        \\\\mathcal{O}_{\\\\mathbb{P}^r_A}) = A$).\\n\\n---\\n\\n### 4.3 Divisors,
        Line Bundles, and the Picard Group\\n\\nIn algebraic geometry, codimension-$1$
        subvarieties (hypersurfaces) can be studied either as formal linear combinations
        of irreducible subschemes (Weil divisors) or as locally principal subschemes
        defined by local equations (Cartier divisors), which correspond to invertible
        sheaves (line bundles).\\n\\n#### Part A: Weil Divisors and the Class Group\\n\\n**Definition
        4.3.1.** Let $X$ be a Noetherian integral scheme. We say $X$ is **normal**
        if for every point $x \\\\in X$, the local ring $\\\\mathcal{O}_{X, x}$ is
        an integrally closed domain (inside the function field $K(X)$). We say $X$
        is **regular in codimension $1$** if for every point $y \\\\in X$ of codimension
        $1$ (meaning $\\\\dim \\\\mathcal{O}_{X, y} = 1$), the local ring $\\\\mathcal{O}_{X,
        y}$ is a regular local ring of dimension $1$.\\n\\nRecall from commutative
        algebra that for a Noetherian local domain $(R, \\\\mathfrak{m})$ of dimension
        $1$, the following are equivalent: (i) $R$ is regular ($\\\\dim_{R/\\\\mathfrak{m}}
        \\\\mathfrak{m}/\\\\mathfrak{m}^2 = 1$, i.e., $\\\\mathfrak{m} = (\\\\pi)$
        is principal); (ii) $R$ is integrally closed; (iii) $R$ is a **Discrete Valuation
        Ring (DVR)**, meaning there is a surjective valuation $v: K^\\\\times \\\\to
        \\\\mathbb{Z}$ such that $R = \\\\{f \\\\in K^\\\\times \\\\mid v(f) \\\\ge
        0\\\\} \\\\cup \\\\{0\\\\}$ and $\\\\mathfrak{m} = \\\\{f \\\\in K^\\\\times
        \\\\mid v(f) \\\\ge 1\\\\} \\\\cup \\\\{0\\\\}$. Thus, any normal Noetherian
        integral scheme (and any smooth variety) is regular in codimension $1$.\\n\\n**Definition
        4.3.2.** Let $X$ be a Noetherian integral scheme that is regular in codimension
        $1$.\\n1. A **prime divisor** on $X$ is a closed integral subscheme $Y \\\\subseteq
        X$ of codimension $1$ (meaning the local ring $\\\\mathcal{O}_{X, \\\\eta_Y}$
        of $X$ at the generic point $\\\\eta_Y$ of $Y$ has dimension $1$, and hence
        is a DVR with valuation $v_Y: K(X)^\\\\times \\\\to \\\\mathbb{Z}$).\\n2.
        A **Weil divisor** on $X$ is an element of the free abelian group $\\\\operatorname{Div}(X)$
        generated by the prime divisors on $X$, i.e., a finite formal integer linear
        combination:\\n$$D = \\\\sum_{Y} n_Y Y, \\\\qquad n_Y \\\\in \\\\mathbb{Z}
        \\\\text{ (all but finitely many } n_Y = 0\\\\text{)}.$$\\nWe say $D$ is **effective**
        (written $D \\\\ge 0$) if $n_Y \\\\ge 0$ for all $Y$.\\n\\nFor any non-zero
        rational function $f \\\\in K(X)^\\\\times$ and any prime divisor $Y \\\\subseteq
        X$, the integer $v_Y(f) \\\\in \\\\mathbb{Z}$ is called the **order of vanishing**
        (if $v_Y(f) \\u003e 0$) or **order of pole** (if $v_Y(f) \\u003c 0$) of $f$
        along $Y$. Notice that $v_Y(f) = 0$ for all but finitely many prime divisors
        $Y$: indeed, on a non-empty open affine $U = \\\\operatorname{Spec} A \\\\subseteq
        X$ where $f \\\\in A \\\\setminus \\\\{0\\\\}$, the complement $X \\\\setminus
        U$ is a closed subset of codimension $\\\\ge 1$, so it contains only finitely
        many irreducible components of codimension $1$, and inside $U$, $v_Y(f) \\\\neq
        0$ implies $Y \\\\cap U \\\\subseteq V(f)$, which also has only finitely many
        irreducible components since $A$ is Noetherian!\\n\\n**Definition 4.3.3.**
        For any $f \\\\in K(X)^\\\\times$, the **principal Weil divisor** of $f$ is
        defined to be:\\n$$\\\\operatorname{div}(f) = \\\\sum_{Y \\\\subset X \\\\text{
        prime}} v_Y(f) \\\\cdot Y \\\\in \\\\operatorname{Div}(X).$$\\nBecause each
        $v_Y: K(X)^\\\\times \\\\to \\\\mathbb{Z}$ is a group homomorphism ($v_Y(fg)
        = v_Y(f) + v_Y(g)$), the map $\\\\operatorname{div}: K(X)^\\\\times \\\\to
        \\\\operatorname{Div}(X)$ is a group homomorphism. Two Weil divisors $D_1,
        D_2 \\\\in \\\\operatorname{Div}(X)$ are **linearly equivalent** (written
        $D_1 \\\\sim D_2$) if $D_1 - D_2 = \\\\operatorname{div}(f)$ for some $f \\\\in
        K(X)^\\\\times$. The **divisor class group** of $X$, denoted $\\\\operatorname{Cl}(X)$,
        is the quotient group:\\n$$\\\\operatorname{Cl}(X) = \\\\operatorname{Div}(X)
        / \\\\operatorname{im}\\\\left(\\\\operatorname{div}: K(X)^\\\\times \\\\to
        \\\\operatorname{Div}(X)\\\\right).$$\\n\\n**Proposition 4.3.4.** \\n1. *Let
        $A$ be a Noetherian integral domain. Then $A$ is a Unique Factorization Domain
        (UFD) if and only if $X = \\\\operatorname{Spec} A$ is normal and $\\\\operatorname{Cl}(\\\\operatorname{Spec}
        A) = 0$. In particular, $\\\\operatorname{Cl}(\\\\mathbb{A}^n_k) = 0$.*\\n2.
        *For projective $n$-space $\\\\mathbb{P}^n_k$ over a field $k$, the degree
        map $\\\\deg: \\\\operatorname{Div}(\\\\mathbb{P}^n_k) \\\\to \\\\mathbb{Z}$
        sending a prime divisor $Y = V_+(f)$ (where $f \\\\in k[x_0, \\\\dots, x_n]$
        is an irreducible homogeneous polynomial of degree $d$) to $\\\\deg(Y) = d$
        induces an isomorphism:*\\n$$\\\\deg: \\\\operatorname{Cl}(\\\\mathbb{P}^n_k)
        \\\\stackrel{\\\\sim}{\\\\longrightarrow} \\\\mathbb{Z}.$$\\n\\n*Proof.* (1)
        A classic theorem of commutative algebra states that a Noetherian domain $A$
        is a UFD if and only if every prime ideal $\\\\mathfrak{p} \\\\subset A$ of
        height $1$ is principal. If $A$ is a UFD, it is integrally closed (hence $X
        = \\\\operatorname{Spec} A$ is normal), and every prime divisor $Y = V(\\\\mathfrak{p})$
        ($\\\\operatorname{ht} \\\\mathfrak{p} = 1$) has $\\\\mathfrak{p} = (f)$ for
        some irreducible $f \\\\in A$, which satisfies $\\\\operatorname{div}(f) =
        1 \\\\cdot Y$, so $\\\\operatorname{Cl}(X) = 0$. Conversely, if $X$ is normal
        and $\\\\operatorname{Cl}(X) = 0$, note first that for a normal Noetherian
        domain $A$, $A = \\\\bigcap_{\\\\operatorname{ht} \\\\mathfrak{p} = 1} A_\\\\mathfrak{p}$
        (by Krull's theorem on associated primes of principal ideals $(b)$ in integrally
        closed Noetherian domains). For any height-$1$ prime $\\\\mathfrak{p}$ with
        $Y = V(\\\\mathfrak{p})$, since $\\\\operatorname{Cl}(X) = 0$, $Y = \\\\operatorname{div}(f)$
        for some $f \\\\in K(X)^\\\\times$. Then $v_Z(f) \\\\ge 0$ for all height-$1$
        primes $Z$, so $f \\\\in \\\\bigcap_{\\\\operatorname{ht} \\\\mathfrak{q}
        = 1} A_\\\\mathfrak{q} = A$, and similarly any $g \\\\in \\\\mathfrak{p}$
        satisfies $v_Z(g/f) \\\\ge 0$ for all $Z$, so $g/f \\\\in A$, proving $\\\\mathfrak{p}
        = (f)$ is principal!\\n\\n(2) In $\\\\mathbb{P}^n_k = \\\\operatorname{Proj}
        k[x_0, \\\\dots, x_n]$, every prime divisor $Y$ is of the form $V_+(f)$ for
        a unique (up to scaling) irreducible homogeneous polynomial $f \\\\in k[x_0,
        \\\\dots, x_n]$ of some degree $d \\\\ge 1$. Any non-zero rational function
        $\\\\phi \\\\in K(\\\\mathbb{P}^n_k)^\\\\times$ is a ratio $\\\\phi = g/h$
        of two homogeneous polynomials $g, h$ of the **exact same degree**. Factoring
        $g$ and $h$ into irreducible homogeneous polynomials in the UFD $k[x_0, \\\\dots,
        x_n]$ as $g = \\\\prod f_i^{e_i}$ and $h = \\\\prod f_i^{m_i}$, we have $\\\\operatorname{div}(\\\\phi)
        = \\\\sum (e_i - m_i) V_+(f_i)$, and therefore:\\n$$\\\\deg(\\\\operatorname{div}(\\\\phi))
        = \\\\sum (e_i - m_i) \\\\deg(f_i) = \\\\deg(g) - \\\\deg(h) = 0.$$\\nConversely,
        if $D = \\\\sum n_i V_+(f_i)$ has $\\\\deg(D) = \\\\sum n_i \\\\deg(f_i) =
        0$, then separating positive and negative coefficients puts $\\\\prod f_i^{n_i}$
        as a homogeneous fraction of degree $0$ in $K(\\\\mathbb{P}^n_k)^\\\\times$
        with divisor $D$. Since a hyperplane $H = V_+(x_0)$ has $\\\\deg(H) = 1$,
        $\\\\deg$ induces an isomorphism $\\\\operatorname{Cl}(\\\\mathbb{P}^n_k)
        \\\\stackrel{\\\\sim}{\\\\longrightarrow} \\\\mathbb{Z}$ generated by $[H]$.
        $\\\\blacksquare$\\n\\n#### Part B: Cartier Divisors and the Picard Group\\n\\nTo
        define divisors on arbitrary schemes (and to pull divisors back along morphisms),
        we introduce Cartier divisors and relate them to invertible sheaves.\\n\\n**Definition
        4.3.5.** Let $X$ be a scheme. For each open $U \\\\subseteq X$, let $S(U)
        \\\\subseteq \\\\mathcal{O}_X(U)$ be the multiplicative set of elements that
        are non-zero-divisors in every stalk $\\\\mathcal{O}_{X, x}$ ($x \\\\in U$).
        The sheafification of the presheaf $U \\\\mapsto S(U)^{-1}\\\\mathcal{O}_X(U)$
        is called the **sheaf of total quotient rings** (or **sheaf of meromorphic
        functions**) on $X$, denoted $\\\\mathcal{K}_X$. (Note: if $X$ is an integral
        scheme with function field $K(X)$, then $\\\\mathcal{K}_X$ is simply the constant
        sheaf $\\\\underline{K(X)}_X$!)\\n\\nLet $\\\\mathcal{K}_X^\\\\times$ and
        $\\\\mathcal{O}_X^\\\\times$ be the sheaves of invertible elements (units)
        in $\\\\mathcal{K}_X$ and $\\\\mathcal{O}_X$, respectively. A **Cartier divisor**
        on $X$ is a global section of the quotient sheaf $\\\\mathcal{K}_X^\\\\times
        / \\\\mathcal{O}_X^\\\\times$, i.e., an element of $\\\\operatorname{CaDiv}(X)
        := \\\\Gamma(X, \\\\mathcal{K}_X^\\\\times / \\\\mathcal{O}_X^\\\\times)$.
        Explicitly, by the definition of quotient sheaves, a Cartier divisor $D$ is
        represented by an open cover $\\\\{U_i\\\\}_{i \\\\in I}$ of $X$ and sections
        $f_i \\\\in \\\\Gamma(U_i, \\\\mathcal{K}_X^\\\\times)$ such that on every
        overlap $U_i \\\\cap U_j$:\\n$$\\\\frac{f_i}{f_j} \\\\in \\\\Gamma(U_i \\\\cap
        U_j, \\\\mathcal{O}_X^\\\\times).$$\\nA Cartier divisor is **principal** if
        it is in the image of the canonical map $\\\\Gamma(X, \\\\mathcal{K}_X^\\\\times)
        \\\\to \\\\Gamma(X, \\\\mathcal{K}_X^\\\\times / \\\\mathcal{O}_X^\\\\times)$.
        The group of Cartier divisors modulo principal Cartier divisors is the **Cartier
        divisor class group** $\\\\operatorname{CaCl}(X)$.\\n\\n**Definition 4.3.6.**
        Let $(X, \\\\mathcal{O}_X)$ be a ringed space. An $\\\\mathcal{O}_X$-module
        $\\\\mathcal{L}$ is called an **invertible sheaf** (or **line bundle**) if
        it is locally free of rank $1$, meaning $X$ can be covered by open subsets
        $U_i$ such that $\\\\mathcal{L}|_{U_i} \\\\cong \\\\mathcal{O}_{U_i}$.\\nIf
        $\\\\mathcal{L}$ and $\\\\mathcal{M}$ are invertible sheaves, then $\\\\mathcal{L}
        \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{M}$ is also locally free of rank
        $1$, and the dual sheaf $\\\\mathcal{L}^\\\\vee = \\\\mathcal{H}om_{\\\\mathcal{O}_X}(\\\\mathcal{L},
        \\\\mathcal{O}_X)$ is an inverse for $\\\\mathcal{L}$ under tensor product:
        the natural evaluation map $\\\\mathcal{L} \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{L}^\\\\vee
        \\\\stackrel{\\\\sim}{\\\\longrightarrow} \\\\mathcal{O}_X$ is an isomorphism
        (checked immediately on open sets $U_i$ where $\\\\mathcal{L}|_{U_i} \\\\cong
        \\\\mathcal{O}_{U_i}$). Thus, the set of isomorphism classes of invertible
        sheaves on $X$ forms an abelian group under $\\\\otimes_{\\\\mathcal{O}_X}$,
        called the **Picard group** of $X$ and denoted $\\\\operatorname{Pic}(X)$.\\n\\nGiven
        a Cartier divisor $D = \\\\{(U_i, f_i)\\\\}$ on a scheme $X$, we define its
        **associated invertible subsheaf** $\\\\mathcal{O}_X(D) \\\\subseteq \\\\mathcal{K}_X$
        by specifying its restriction on each $U_i$ to be the free rank-$1$ $\\\\mathcal{O}_{U_i}$-submodule
        generated by $f_i^{-1}$:\\n$$\\\\mathcal{O}_X(D)|_{U_i} = f_i^{-1} \\\\mathcal{O}_{U_i}
        \\\\subseteq \\\\mathcal{K}_X|_{U_i}.$$\\nNotice why we use $f_i^{-1}$ rather
        than $f_i$: first, since $f_i / f_j \\\\in \\\\mathcal{O}_X(U_i \\\\cap U_j)^\\\\times$,
        the submodules $f_i^{-1} \\\\mathcal{O}_{U_i}$ and $f_j^{-1} \\\\mathcal{O}_{U_j}$
        are identical inside $\\\\mathcal{K}_X|_{U_i \\\\cap U_j}$, so they glue without
        any choices to a well-defined subsheaf $\\\\mathcal{O}_X(D) \\\\subseteq \\\\mathcal{K}_X$!
        Second, if $D \\\\ge 0$ is effective (meaning $f_i \\\\in \\\\mathcal{O}_X(U_i)$
        defines a hypersurface $V(f_i)$), then a global section $s \\\\in \\\\Gamma(X,
        \\\\mathcal{O}_X(D)) \\\\subseteq \\\\Gamma(X, \\\\mathcal{K}_X)$ satisfies\"\n
