        universal property are uniquely determined by $\\\\varphi$) uniquely determine
        $f^\\\\sharp$. $\\\\blacksquare$\\n\\n### 3.3 Schemes and Gluing; Projective
        Schemes and the $\\\\operatorname{Proj}$ Construction\\n\\n**Definition 3.3.1.**
        An *affine scheme* is a locally ringed space $(X, \\\\mathcal{O}_X)$ that
