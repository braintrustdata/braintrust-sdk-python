        B}) \\\\longrightarrow (\\\\operatorname{Spec} A, \\\\mathcal{O}_{\\\\operatorname{Spec}
        A})$$\\nand ring homomorphisms $\\\\varphi: A \\\\to B$.\\n\\n*Proof.* By
        Theorem 3.2.1(1), the stalks of $\\\\mathcal{O}_{\\\\operatorname{Spec} A}$
