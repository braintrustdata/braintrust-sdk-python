        [\n          {\n            \"text\": \" S_{(\\\\mathfrak{p})}$ such that
        $s(\\\\mathfrak{p}) \\\\in S_{(\\\\mathfrak{p})}$ for all $\\\\mathfrak{p}
        \\\\in U$, and locally on a neighborhood $V \\\\subseteq U$ of each $\\\\mathfrak{p}$,
        $s$ is represented by a quotient $a/f$ where $a, f \\\\in S$ are homogeneous
        of the same degree with $V \\\\subseteq D_+(f)$.\\n\\n**Proposition 3.3.3.**
        Let $S$ be a graded ring and $X = \\\\operatorname{Proj} S$.\\n1. For every
        $\\\\mathfrak{p} \\\\in X$, the stalk $\\\\mathcal{O}_{X, \\\\mathfrak{p}}$
        is canonically isomorphic to the local ring $S_{(\\\\mathfrak{p})}$.\\n2.
        For every homogeneous element $f \\\\in S_+$, the natural map $\\\\varphi_f:
        (D_+(f), \\\\mathcal{O}_X|_{D_+(f)}) \\\\to \\\\operatorname{Spec} S_{(f)}$
        sending $\\\\mathfrak{p} \\\\in D_+(f)$ to $(\\\\mathfrak{p} S_f) \\\\cap
        S_{(f)}$ is an isomorphism of locally ringed spaces.\\n3. Consequently, $(\\\\operatorname{Proj}
        S, \\\\mathcal{O}_{\\\\operatorname{Proj} S})$ is a scheme.\\n\\n*Proof.*
        For $\\\\mathfrak{p} \\\\in D_+(f)$ where $f \\\\in S_d$ ($d \\u003e 0$),
        define $\\\\varphi_f(\\\\mathfrak{p}) = \\\\{a/f^m \\\\in S_{(f)} \\\\mid
        a \\\\in \\\\mathfrak{p} \\\\cap S_{md}\\\\}$. It is elementary to check that
        $\\\\varphi_f(\\\\mathfrak{p})$ is a prime ideal of $S_{(f)}$. Conversely,
        if $\\\\mathfrak{q} \\\\subseteq S_{(f)}$ is a prime ideal, define $\\\\mathfrak{p}
        = \\\\bigoplus_{e \\\\ge 0} \\\\mathfrak{p}_e$ where $\\\\mathfrak{p}_e =
        \\\\{a \\\\in S_e \\\\mid a^d / f^e \\\\in \\\\mathfrak{q}\\\\}$. One verifies
        directly that $\\\\mathfrak{p}$ is a homogeneous prime ideal of $S$ with $f
        \\\\notin \\\\mathfrak{p}$ (so $\\\\mathfrak{p} \\\\in D_+(f)$), and that
        this gives an order-preserving bijection between $D_+(f)$ and $\\\\operatorname{Spec}
        S_{(f)}$ mapping basic open subsets $D_+(fg) \\\\subseteq D_+(f)$ to $D(g^d
        / f^{\\\\deg g}) \\\\subseteq \\\\operatorname{Spec} S_{(f)}$. Hence $\\\\varphi_f$
        is a homeomorphism. Furthermore, for $\\\\mathfrak{p} \\\\in D_+(f)$, the
        localization $(S_{(f)})_{\\\\varphi_f(\\\\mathfrak{p})}$ is canonically isomorphic
        to $S_{(\\\\mathfrak{p})}$, identifying the definition of $\\\\mathcal{O}_X|_{D_+(f)}$
        verbatim with the definition of $\\\\mathcal{O}_{\\\\operatorname{Spec} S_{(f)}}$.
        Thus $\\\\varphi_f$ is an isomorphism of locally ringed spaces, and (1) and
        (3) follow immediately from Theorem 3.2.1. $\\\\blacksquare$\\n\\n**Example
        3.3.4 (Projective Space over a Ring).** For any ring $A$, we define *projective
        $n$-space over $A$* to be\\n$$\\\\mathbb{P}^n_A = \\\\operatorname{Proj} A[x_0,
        x_1, \\\\dots, x_n],$$\\nwhere the polynomial ring $S = A[x_0, \\\\dots, x_n]$
        is given the standard grading with $\\\\deg(x_i) = 1$ and $S_0 = A$. By Proposition
        3.3.3, $\\\\mathbb{P}^n_A$ is covered by the $n+1$ standard affine open subsets
        $U_i = D_+(x_i) \\\\cong \\\\operatorname{Spec} A[x_0/x_i, \\\\dots, x_n/x_i]
        \\\\cong \\\\mathbb{A}^n_A = \\\\operatorname{Spec} A[y_1, \\\\dots, y_n]$.\\n\\n###
        3.4 Properties of Schemes\\n\\n**Definition 3.4.1.** Let $X$ be a scheme.\\n1.
        $X$ is *connected* if its underlying topological space is connected.\\n2.
        $X$ is *irreducible* if its underlying topological space is irreducible.\\n3.
        $X$ is *reduced* if for every open subset $U \\\\subseteq X$, the ring $\\\\mathcal{O}_X(U)$
        has no non-zero nilpotent elements (equivalently, for every point $P \\\\in
        X$, the local ring $\\\\mathcal{O}_{X,P}$ has no non-zero nilpotent elements).\\n4.
        $X$ is *integral* if for every non-empty open subset $U \\\\subseteq X$, the
        ring $\\\\mathcal{O}_X(U)$ is an integral domain.\\n\\n**Proposition 3.4.2.**
        A scheme $X$ is integral if and only if it is both reduced and irreducible.\\n\\n*Proof.*
        Suppose $X$ is integral. Then clearly $X$ is reduced. If $X$ were not irreducible,
        there would exist two disjoint non-empty open subsets $U_1, U_2 \\\\subseteq
        X$. Then $\\\\mathcal{O}_X(U_1 \\\\cup U_2) \\\\cong \\\\mathcal{O}_X(U_1)
        \\\\times \\\\mathcal{O}_X(U_2)$ by the sheaf axioms, which is not an integral
        domain since $(1,0)(0,1) = (0,0)$, a contradiction.\\n\\nConversely, suppose
        $X$ is reduced and irreducible, and let $U \\\\subseteq X$ be a non-empty
        open subset. Suppose $f, g \\\\in \\\\mathcal{O}_X(U)$ satisfy $fg = 0$. Define
        two closed subsets of $U$:\\n$$Y_1 = \\\\{P \\\\in U \\\\mid f_P \\\\in \\\\mathfrak{m}_P
        \\\\subseteq \\\\mathcal{O}_{X,P}\\\\}, \\\\quad Y_2 = \\\\{P \\\\in U \\\\mid
        g_P \\\\in \\\\mathfrak{m}_P \\\\subseteq \\\\mathcal{O}_{X,P}\\\\}.$$\\n(Note
        that on any affine open $V = \\\\operatorname{Spec} A \\\\subseteq U$, $Y_1
        \\\\cap V = V(f|_V)$ is indeed closed). For every $P \\\\in U$, $f_P g_P =
        0$ in the local ring $\\\\mathcal{O}_{X,P}$, so either $f_P \\\\in \\\\mathfrak{m}_P$
        or $g_P \\\\in \\\\mathfrak{m}_P$ (otherwise both would be units). Thus $U
        = Y_1 \\\\cup Y_2$. Since $X$ is irreducible, every non-empty open subset
        $U$ is irreducible, so either $U = Y_1$ or $U = Y_2$; say $U = Y_1$. Then
        for any affine open subset $V = \\\\operatorname{Spec} A \\\\subseteq U$,
        $f|_V \\\\in \\\\mathfrak{p}$ for every $\\\\mathfrak{p} \\\\in \\\\operatorname{Spec}
        A$, meaning $f|_V$ lies in the nilradical $\\\\sqrt{(0)}$ of $A$. Since $X$
        is reduced, $A = \\\\mathcal{O}_X(V)$ is reduced, so $f|_V = 0$. Covering
        $U$ by affine open subsets shows $f = 0$. $\\\\blacksquare$\\n\\n**Proposition
        3.4.3 (Generic Points).** Let $X$ be a scheme. For every irreducible closed
        subset $Z \\\\subseteq X$, there exists a unique point $\\\\eta \\\\in Z$
        such that $Z = \\\\overline{\\\\{\\\\eta\\\\}}$ (called the *generic point*
        of $Z$). In particular, an integral scheme $X = \\\\overline{\\\\{\\\\eta\\\\}}$
        has a unique generic point $\\\\eta$, and the local ring $\\\\mathcal{O}_{X,
        \\\\eta}$ is a field, called the *function field* $K(X)$ of $X$ (isomorphic
        to the fraction field of $\\\\mathcal{O}_X(U)$ for any affine open $U = \\\\operatorname{Spec}
        A \\\\subseteq X$).\\n\\n*Proof.* Let $U = \\\\operatorname{Spec} A \\\\subseteq
        X$ be an affine open subset such that $Z \\\\cap U \\\\ne \\\\emptyset$. Since
        $Z$ is irreducible, $Z \\\\cap U$ is an irreducible closed subset of $\\\\operatorname{Spec}
        A$ whose closure in $X$ is $Z$. Now $Z \\\\cap U = V(\\\\mathfrak{a}) = V(\\\\sqrt{\\\\mathfrak{a}})$
        for some radical ideal $\\\\mathfrak{a} \\\\subseteq A$. Exactly as in Corollary
        1.2.6(1), $V(\\\\mathfrak{a})$ is irreducible in $\\\\operatorname{Spec} A$
        if and only if $\\\\mathfrak{p} = \\\\sqrt{\\\\mathfrak{a}}$ is a prime ideal
        of $A$. Then $\\\\eta = \\\\mathfrak{p} \\\\in \\\\operatorname{Spec} A$ is
        a point of $Z \\\\cap U$ whose closure in $U$ is $V(\\\\mathfrak{p}) = Z \\\\cap
        U$, and hence whose closure in $X$ is $Z$. Uniqueness holds because in any
        scheme, if $\\\\overline{\\\\{\\\\eta_1\\\\}} = \\\\overline{\\\\{\\\\eta_2\\\\}}$,
        then $\\\\eta_1$ and $\\\\eta_2$ must lie in the same affine open $U = \\\\operatorname{Spec}
        A$, where $V(\\\\mathfrak{p}_1) = V(\\\\mathfrak{p}_2) \\\\implies \\\\mathfrak{p}_1
        = \\\\mathfrak{p}_2$. If $X$ is integral and $U = \\\\operatorname{Spec} A$,
        $A$ is a domain, its generic point is the zero ideal $(0)$, and $\\\\mathcal{O}_{X,
        \\\\eta} \\\\cong A_{(0)} = \\\\operatorname{Frac}(A)$. $\\\\blacksquare$\\n\\n**Definition
        3.4.4.** A scheme $X$ is *locally Noetherian* if it can be covered by affine
        open subsets $\\\\operatorname{Spec} A_i$ where each $A_i$ is a Noetherian
        ring. $X$ is *Noetherian* if it is locally Noetherian and quasi-compact (equivalently,
        $X$ can be covered by *finitely many* affine open subsets $\\\\operatorname{Spec}
        A_i$ with each $A_i$ Noetherian).\\n\\n**Proposition 3.4.5.** A scheme $X$
        is locally Noetherian if and only if for *every* affine open subset $U = \\\\operatorname{Spec}
        A \\\\subseteq X$, the ring $A$ is Noetherian.\\n\\n*Proof.* \\\"If\\\" is
        immediate. Conversely, suppose $X$ is covered by affine opens $\\\\operatorname{Spec}
        A_i$ with $A_i$ Noetherian, and let $U = \\\\operatorname{Spec} A \\\\subseteq
        X$ be any affine open subset. For each point $P \\\\in U$, $P$ lies in some
        $\\\\operatorname{Spec} A_i$, and we can find a principal open subset of $\\\\operatorname{Spec}
        A_i$ containing $P$ that is contained in $U \\\\cap \\\\operatorname{Spec}
        A_i$. Since a localization $(A_i)_g$ of a Noetherian ring is Noetherian, $U$
        is covered by open subsets that are spectra of Noetherian rings. Within $U
        = \\\\operatorname{Spec} A$, we can shrink these to principal open subsets
        $D(f_j) = \\\\operatorname{Spec} A_{f_j}$ such that each $A_{f_j}$ is a Noetherian
        ring. Since $U = \\\\operatorname{Spec} A$ is quasi-compact, finitely many
        of these cover $U$: $\\\\operatorname{Spec} A = \\\\bigcup_{j=1}^m D(f_j)$,
        where each $A_{f_j}$ is Noetherian and $(f_1, \\\\dots, f_m) = A$.\\n\\nWe
        now prove that if $(f_1, \\\\dots, f_m) = A$ and each $A_{f_j}$ is Noetherian,
        then $A$ is Noetherian. For any ideal $\\\\mathfrak{a} \\\\subseteq A$, consider
        the localization map $\\\\phi: A \\\\to \\\\prod_{j=1}^m A_{f_j}$. We claim
        that $\\\\mathfrak{a} = \\\\phi^{-1}\\\\left(\\\\prod_{j=1}^m \\\\mathfrak{a}
        A_{f_j}\\\\right)$. Clearly $\\\\subseteq$ holds. Conversely, if $x \\\\in
        A$ maps into $\\\\mathfrak{a} A_{f_j}$ for each $j=1, \\\\dots, m$, then for
        each $j$ there exists $n \\\\ge 1$ such that $f_j^n x \\\\in \\\\mathfrak{a}$.
        Since $(f_1, \\\\dots, f_m) = A$, we also have $(f_1^n, \\\\dots, f_m^n) =
        A$, so writing $1 = \\\\sum_{j=1}^m c_j f_j^n$ gives $x = \\\\sum_{j=1}^m
        c_j (f_j^n x) \\\\in \\\\mathfrak{a}$. Since $\\\\prod_{j=1}^m A_{f_j}$ is
        a finite product of Noetherian rings, any ascending chain of ideals $\\\\mathfrak{a}_1
        \\\\subseteq \\\\mathfrak{a}_2 \\\\subseteq \\\\dots$ in $A$ induces a stabilizing
        chain of extended ideals in $\\\\prod_{j=1}^m A_{f_j}$, and contracting back
        via $\\\\phi^{-1}$ shows that the chain in $A$ stabilizes. Thus $A$ is Noetherian.
        $\\\\blacksquare$\\n\\n### 3.5 Fibred Products of Schemes\\n\\nIn the category
        of schemes, products over a base scheme $S$ play a ubiquitous role: they allow
        us to form products of varieties, take scheme-theoretic fibres of morphisms,
        and perform base change (such as extending scalars from $\\\\mathbb{Q}$ to
        $\\\\mathbb{C}$, or reducing modulo $p$ from $\\\\mathbb{Z}$ to $\\\\mathbb{F}_p$).\\n\\n**Definition
        3.5.1.** Let $S$ be a scheme, and let $f: X \\\\to S$ and $g: Y \\\\to S$
        be morphisms of schemes (we say $X$ and $Y$ are *$S$-schemes*). A *fibred
        product* of $X$ and $Y$ over $S$, denoted $X \\\\times_S Y$, is a scheme equipped
        with projection morphisms $p_1: X \\\\times_S Y \\\\to X$ and $p_2: X \\\\times_S
        Y \\\\to Y$ such that $f \\\\circ p_1 = g \\\\circ p_2$, satisfying the following
        universal property: for any scheme $Z$ and any pair of morphisms $q_1: Z \\\\to
        X$ and $q_2: Z \\\\to Y$ such that $f \\\\circ q_1 = g \\\\circ q_2$, there
        exists a unique morphism $\\\\theta: Z \\\\to X \\\\times_S Y$ such that $p_1
        \\\\circ \\\\theta = q_1$ and $p_2 \\\\circ \\\\theta = q_2$.\\n\\n**Theorem
        3.5.2.** For any two morphisms of schemes $X \\\\to S$ and $Y \\\\to S$, the
        fibred product $X \\\\times_S Y$ exists and is unique up to unique isomorphism.\\n\\n*Proof.*
        Uniqueness up to unique isomorphism is an immediate formal consequence of
        the universal property. We prove existence in four logical steps by gluing
        affine pieces.\\n\\n*Step 1: $X = \\\\operatorname{Spec} A$, $Y = \\\\operatorname{Spec}
        B$, and $S = \\\\operatorname{Spec} R$ are all affine.*\\nBy Proposition 3.2.2,
        the morphisms $X \\\\to S$ and $Y \\\\to S$ correspond to ring homomorphisms
        $R \\\\to A$ and $R \\\\to B$, making $A$ and $B$ into $R$-algebras. Consider
        the tensor product $A \\\\otimes_R B$, which is an $R$-algebra equipped with
        canonical homomorphisms $a \\\\mapsto a \\\\otimes 1: A \\\\to A \\\\otimes_R
        B$ and $b \\\\mapsto 1 \\\\otimes b: B \\\\to A \\\\otimes_R B$. We claim
        that $\\\\operatorname{Spec}(A \\\\otimes_R B)$ with the induced projections
        $p_1, p_2$ is the fibred product $X \\\\times_S Y$ in the category of *all*
        schemes (not just affine schemes!). Indeed, for any scheme $Z$, Exercise 3.1
        (or a direct generalization of Proposition 3.2.2 by covering $Z$ with affine
        opens) proves that for any ring $C$, $\\\\operatorname{Hom}_{\\\\mathfrak{Sch}}(Z,
        \\\\operatorname{Spec} C) \\\\cong \\\\operatorname{Hom}_{\\\\mathfrak{Rings}}(C,
        \\\\Gamma(Z, \\\\mathcal{O}_Z))$. Therefore:\\n$$\\\\begin{aligned}\\n\\\\operatorname{Hom}_S(Z,
        \\\\operatorname{Spec}(A \\\\otimes_R B)) &\\\\cong \\\\operatorname{Hom}_{R\\\\text{-alg}}(A
        \\\\otimes_R B, \\\\Gamma(Z, \\\\mathcal{O}_Z)) \\\\\\\\\\n&\\\\cong \\\\operatorname{Hom}_{R\\\\text{-alg}}(A,
        \\\\Gamma(Z, \\\\mathcal{O}_Z)) \\\\times \\\\operatorname{Hom}_{R\\\\text{-alg}}(B,
        \\\\Gamma(Z, \\\\mathcal{O}_Z)) \\\\\\\\\\n&\\\\cong \\\\operatorname{Hom}_S(Z,
        \\\\operatorname{Spec} A) \\\\times \\\\operatorname{Hom}_S(Z, \\\\operatorname{Spec}
        B)\\n\\\\end{aligned}$$\\nby the universal property of the tensor product
        of $R$-algebras. This establishes Step 1.\\n\\n*Step 2: Localization of Fibred
        Products.*\\nObserve that if $X \\\\times_S Y$ exists with projections $p_1,
        p_2$, and $U \\\\subseteq X$ is an open subscheme, then the open subscheme
        $p_1^{-1}(U) \\\\subseteq X \\\\times_S Y$ satisfies the universal property
        of $U \\\\times_S Y$: any morphisms $q_1: Z \\\\to U \\\\hookrightarrow X$
        and $q_2: Z \\\\to Y$ induce a unique morphism $\\\\theta: Z \\\\to X \\\\times_S
        Y$ whose set-theoretic image lies in $p_1^{-1}(U)$, hence factors uniquely
        through the open subscheme $p_1^{-1}(U)$.\\n\\n*Step 3: $Y$ and $S$ are affine,
        and $X$ is an arbitrary scheme.*\\nCover $X$ by affine open subschemes $\\\\{X_i\\\\}_{i
        \\\\in I}$. By Step 1, for each $i \\\\in I$, the fibred product $W_i = X_i
        \\\\times_S Y$ exists (it is an affine scheme). For any $i, j \\\\in I$, write
        $X_{ij} = X_i \\\\cap X_j \\\\subseteq X_i$. By Step 2, $U_{ij} = p_{1,i}^{-1}(X_{ij})
        \\\\subseteq W_i$ and $U_{ji} = p_{1,j}^{-1}(X_{ij}) \\\\subseteq W_j$ are
        both fibred products $X_{ij} \\\\times_S Y$. By the uniqueness of fibred products,
        there is a unique isomorphism $\\\\varphi_{ij}: U_{ij} \\\\xrightarrow{\\\\sim}
        U_{ji}$ commuting with the projections to $X_{ij}$ and $Y$. Furthermore, the
        uniqueness of these universal isomorphisms immediately forces the cocycle
        condition $\\\\varphi_{jk} \\\\circ \\\\varphi_{ij} = \\\\varphi_{ik}$ on
        triple intersections! By the Gluing Lemma for locally ringed spaces (Exercise
        2.5), the schemes $W_i$ glue together to form a scheme $W$ equipped with glued
        projections $p_1: W \\\\to X$ and $p_2: W \\\\to Y$. If $Z$ is any scheme
        with morphisms $q_1: Z \\\\to X$ and $q_2: Z \\\\to Y$ over $S$, then on each
        open subset $Z_i = q_1^{-1}(X_i) \\\\subseteq Z$ we get a unique morphism
        $\\\\theta_i: Z_i \\\\to W_i \\\\subseteq W$, and by uniqueness on overlaps
        $Z_i \\\\cap Z_j$, these glue uniquely to a morphism $\\\\theta: Z \\\\to
        W$. Thus $W = X \\\\times_S Y$ exists.\\n\\n*Step 4: $X, Y, S$ are arbitrary
        schemes.*\\nFirst, assume $S$ is affine and $X, Y$ are arbitrary. By Step
        3, $X \\\\times_S Y_j$ exists for every affine open $Y_j \\\\subseteq Y$;
        repeating the exact gluing argument of Step 3 over an affine open cover of
        $Y$ proves that $X \\\\times_S Y$ exists whenever $S$ is affine. Finally,
        for an arbitrary base scheme $S$, cover $S$ by affine opens $\\\\{S_k\\\\}_{k
        \\\\in K}$, and let $X_k = f^{-1}(S_k) \\\\subseteq X$ and $Y_k = g^{-1}(S_k)
        \\\\subseteq Y$. Notice that any pair of morphisms $q_1: Z \\\\to X_k$ and
        $q_2: Z \\\\to Y_k$ agreeing over $S$ automatically maps into $S_k$, so $X_k
        \\\\times_{S_k} Y_k$ (which exists since $S_k$ is affine) is also $X_k \\\\times_S
        Y_k$. Gluing the schemes $X_k \\\\times_{S_k} Y_k$ along their overlaps $(X_k
        \\\\cap X_l) \\\\times_{S_k \\\\cap S_l} (Y_k \\\\cap Y_l)$ just as in Step
        3 yields the global fibred product $X \\\\times_S Y$. $\\\\blacksquare$\\n\\n**Definition
        3.5.3 (Scheme-Theoretic Fibres).** Let $f: X \\\\to Y$ be a morphism of schemes,
        and let $y \\\\in Y$ be a point. Let $\\\\kappa(y) = \\\\mathcal{O}_{Y,y}
        / \\\\mathfrak{m}_y$ be the residue field of $y$. There is a natural canonical
        morphism $\\\\operatorname{Spec} \\\\kappa(y) \\\\to Y$ factoring through
        any affine open neighborhood $\\\\operatorname{Spec} A \\\\ni y$ via the canonical
        ring homomorphism $A \\\\to A_{\\\\mathfrak{p}_y} \\\\to A_{\\\\mathfrak{p}_y}/\\\\mathfrak{p}_y
        A_{\\\\mathfrak{p}_y} = \\\\kappa(y)$. We define the *fibre of $f$ over $y$*,
        denoted $X_y$, to be the fibred product\\n$$X_y = X \\\\times_Y \\\\operatorname{Spec}
        \\\\kappa(y).$$\\nThus $X_y$ is a scheme over the field $\\\\kappa(y)$, and
        one checks easily (by reducing to the affine case $A \\\\to B$, where $B \\\\otimes_A
        \\\\kappa(\\\\mathfrak{p}) \\\\cong B_\\\\mathfrak{p} / \\\\mathfrak{p}B_\\\\mathfrak{p}$)
        that the underlying topological space of $X_y$ is naturally homeomorphic to
        the set-theoretic preimage $f^{-1}(y) \\\\subseteq X$ equipped with the subspace
        topology! However, $X_y$ carries a scheme structure that may be non-reduced
        even when $X$ and $Y$ are integral varieties (recording ramification and multiplicity).\\n\\n---\\n\\n###
        Exercises for Chapter 3\\n\\n**Exercise 3.1.** Let $X$ be an arbitrary scheme
        and let $A$ be a commutative ring. Prove carefully that taking global sections
        defines a natural bijection\\n$$\\\\operatorname{Hom}_{\\\\mathfrak{Sch}}(X,
        \\\\operatorname{Spec} A) \\\\xrightarrow{\\\\sim} \\\\operatorname{Hom}_{\\\\mathfrak{Rings}}(A,
        \\\\Gamma(X, \\\\mathcal{O}_X)).$$\\nDeduce that $\\\\operatorname{Spec} \\\\mathbb{Z}$
        is the final object in the category of schemes.\\n\\n**Exercise 3.2.** Describe
        the topological space and all residue fields of the following affine schemes:\\n(a)
        $\\\\operatorname{Spec} \\\\mathbb{R}[x]$ (show how points of $\\\\operatorname{Spec}
        \\\\mathbb{C}[x]$ map onto it).\\n(b) $\\\\operatorname{Spec} \\\\mathbb{Z}[x]$
        (draw a schematic diagram of the prime ideals, including $(0)$, $(p)$, $(f(x))$,
        and $(p, f(x))$).\\n(c) $\\\\operatorname{Spec} k[x,y]_{(x,y)}$, where $k$
        is an algebraically closed field.\\n\\n**Exercise 3.3 (The Nilradical and
        Reduced Induced Structure).** Let $X$ be a scheme. For each open set $U \\\\subseteq
        X$, let $\\\\mathcal{N}(U)$ be the nilradical of $\\\\mathcal{O}_X(U)$. Define
        $\\\\mathcal{O}_{X_{\\\\text{red}}}$ to be the quotient sheaf $\\\\mathcal{O}_X
        / \\\\mathcal{N}$. Prove that $X_{\\\\text{red}} = (X, \\\\mathcal{O}_{X_{\\\\text{red}}})$
        is a reduced scheme with the same underlying topological space as $X$, and
        that the natural closed immersion $X_{\\\\text{red}} \\\\to X$ satisfies the
        universal property that every morphism from a reduced scheme $Z \\\\to X$
        factors uniquely through $X_{\\\\text{red}}$.\\n\\n**Exercise 3.4.** Let $k$
        be a field. Consider the scheme $X$ obtained by gluing two copies of the affine
        line, $U_1 = \\\\operatorname{Spec} k[x]$ and $U_2 = \\\\operatorname{Spec}
        k[y]$, along the open subsets $D(x) = \\\\operatorname{Spec} k[x, x^{-1}]$
        and $D(y) = \\\\operatorname{Spec} k[y, y^{-1}]$ via the isomorphism $y \\\\mapsto
        x$ (this is the *affine line with the origin doubled*). Prove that $X$ is
        not an affine scheme, even though $U_1$ and $U_2$ are affine and $\\\\Gamma(X,
        \\\\mathcal{O}_X) \\\\cong k[x]$. Compare this with the gluing via $y \\\\mapsto
        x^{-1}$, which yields $\\\\mathbb{P}^1_k$.\\n\\n**Exercise 3.5.** Let $f:
        \\\\mathbb{A}^1_k \\\\to \\\\mathbb{A}^1_k$ be the morphism of affine schemes
        corresponding to the $k$-algebra homomorphism $k[t] \\\\to k[x]$ given by
        $t \\\\mapsto x^2$, where $\\\\operatorname{char} k \\\\ne 2$. Compute the
        scheme-theoretic fibre $X_y$ over every point $y \\\\in \\\\mathbb{A}^1_k$
        (including the origin $t = 0$ and the generic point $(0)$). Show that the
        fibre over the origin is $\\\\operatorname{Spec} k[x]/(x^2)$, a non-reduced
        scheme of dimension $0$ (\\\"a double point\\\").\\n\\n---\\n\\n## CHAPTER
        4: MORPHISMS OF SCHEMES\\n\\nIn Grothendieck's relative point of view, properties
        once attributed to a space (such as compactness, Hausdorffness, finiteness,
        or smoothness) are formulated instead as properties of *morphisms* $f: X \\\\to
        Y$. A property of a scheme $X$ over a base field $k$ is then simply the corresponding
        property of its structure morphism $X \\\\to \\\\operatorname{Spec} k$.\\n\\n###
        4.1 Finiteness Conditions\\n\\n**Definition 4.1.1.** Let $f: X \\\\to Y$ be
        a morphism of schemes.\\n1. $f$ is *locally of finite type* if there exists
        an affine open covering $Y = \\\\bigcup_{i \\\\in I} \\\\operatorname{Spec}
        B_i$ such that for each $i$, $f^{-1}(\\\\operatorname{Spec} B_i)$ can be covered
        by affine open subsets $\\\\operatorname{Spec} A_{ij}$ where each $A_{ij}$
        is a finitely generated $B_i$-algebra.\\n2. $f$ is *quasi-compact* if there
        exists an affine open covering $Y = \\\\bigcup_{i \\\\in I} V_i$ such that
        $f^{-1}(V_i)$ is quasi-compact for each $i$ (equivalently, the preimage $f^{-1}(V)$
        of *every* quasi-compact open subset $V \\\\subseteq Y$ is quasi-compact).\\n3.
        $f$ is *of finite type* if it is locally of finite type and quasi-compact
        (equivalently, $Y$ can be covered by affine opens $\\\\operatorname{Spec}
        B_i$ such that $f^{-1}(\\\\operatorname{Spec} B_i)$ is covered by *finitely
        many* affine opens $\\\\operatorname{Spec} A_{ij}$ with each $A_{ij}$ a finitely
        generated $B_i$-algebra).\\n4. $f$ is *affine* if there is an affine open
        covering $Y = \\\\bigcup_{i \\\\in I} V_i$ such that $f^{-1}(V_i)$ is an affine
        scheme for each $i$.\\n5. $f$ is *finite* (resp. *integral*) if there is an
        affine open covering $Y = \\\\bigcup_{i \\\\in I} \\\\operatorname{Spec} B_i$
        such that for each $i$, $f^{-1}(\\\\operatorname{Spec} B_i) = \\\\operatorname{Spec}
        A_i$ is affine and $A_i$ is a finitely generated $B_i$-module (resp. $A_i$
        is an integral $B_i$-algebra).\\n\\n**Proposition 4.1.2.** Each of the properties
        (locally of finite type, quasi-compact, of finite type, affine, finite, integral)
        is *local on the target $Y$*: if it holds for one affine open cover of $Y$,
        then it holds for *every* affine open subset $\\\\operatorname{Spec} B \\\\subseteq
        Y$. Moreover, all of these properties are preserved under composition and
        under base change $X \\\\times_Y Y' \\\\to Y'$.\\n\\n*Proof.* We prove the
        local-on-the-target property for *finite* morphisms; the proofs for the other
        properties are completely analogous (using the local-to-global method of Proposition
        3.4.5). Suppose $Y = \\\\bigcup_{i \\\\in I} \\\\operatorname{Spec} B_i$ is
        an open cover such that $f^{-1}(\\\\operatorname{Spec} B_i) = \\\\operatorname{Spec}
        A_i$ is affine and $A_i$ is a finite $B_i$-module. Note that for any $g \\\\in
        B_i$, $f^{-1}(D_{B_i}(g)) = D_{A_i}(f^\\\\sharp(g)) = \\\\operatorname{Spec}
        (A_i)_g$ is affine and $(A_i)_g$ is a finite $(B_i)_g$-module.\\n\\nNow let
        $V = \\\\operatorname{Spec} B \\\\subseteq Y$ be an arbitrary affine open
        subset. As in Proposition 3.4.5, we can cover $V$ by finitely many principal
        open subsets $D(g_1), \\\\dots, D(g_m)$ ($g_j \\\\in B$) such that each $D(g_j)$
        is also a principal open subset of some $\\\\operatorname{Spec} B_i$. Therefore,
        for each $j=1, \\\\dots, m$, $f^{-1}(D(g_j)) = \\\\operatorname{Spec} C_j$
        is affine, and $C_j$ is a finitely generated $B_{g_j}$-module.\\n\\nLet $U
        = f^{-1}(V)$ and let $A = \\\\Gamma(U, \\\\mathcal{O}_X)$. Since $(g_1, \\\\dots,
        g_m) = B$ and $f^{-1}(D(g_j)) = D_U(f^\\\\sharp(g_j)) = \\\\operatorname{Spec}
        C_j$, a standard sheaf-theoretic check on the finite cover $U = \\\\bigcup_{j=1}^m
        \\\\operatorname{Spec} C_j$ (where overlaps are principal affine intersections
        $\\\\operatorname{Spec} (C_j)_{g_k}$) shows that $C_j \\\\cong A_{g_j}$ for
        each $j$, and consequently the canonical morphism $U \\\\to \\\\operatorname{Spec}
        A$ is an isomorphism on each $D(g_j)$, hence an isomorphism globally! Thus
        $U = \\\\operatorname{Spec} A$ is affine. Finally, since $A_{g_j}$ is a finitely
        generated $B_{g_j}$-module for each $j=1, \\\\dots, m$, choose finitely many
        elements of $A$ whose fractions generate $A_{g_j}$ over $B_{g_j}$ for all
        $j=1, \\\\dots, m$. These elements generate a finite $B$-submodule $M \\\\subseteq
        A$ such that $(A/M)_{g_j} = 0$ for all $j$. Since $(g_1, \\\\dots, g_m) =
        B$, this forces $A/M = 0$, so $A = M$ is a finitely generated $B$-module.\\n\\nStability
        under composition is clear from the corresponding ring-theoretic facts, and
        stability under base change follows from Step 1 of Theorem 3.5.2: if $A$ is
        a finitely generated $B$-algebra (resp. $B$-module) and $B \\\\to B'$ is any
        ring homomorphism, then $A \\\\otimes_B B'$ is a finitely generated $B'$-algebra
        (resp. $B'$-module). $\\\\blacksquare$\\n\\n**Definition 4.1.3 (Immersions).**
        Let $f: Z \\\\to X$ be a morphism of schemes.\\n1. $f$ is an *open immersion*
        if $f$ induces an isomorphism of $Z$ onto an open subscheme $(U, \\\\mathcal{O}_X|_U)$
        of $X$.\\n2. $f$ is a *closed immersion* if $f$ induces a homeomorphism of
        the underlying topological space of $Z$ onto a closed subset of $X$, and the
        associated morphism of sheaves of rings $f^\\\\sharp: \\\\mathcal{O}_X \\\\to
        f_* \\\\mathcal{O}_Z$ on $X$ is surjective.\\n\\nIt is an important fact (see
        Exercise 4.1) that a closed immersion $f: Z \\\\to X$ is an affine (and indeed
        finite) morphism: over any affine open $\\\\operatorname{Spec} A \\\\subseteq
        X$, $f^{-1}(\\\\operatorname{Spec} A) \\\\cong \\\\operatorname{Spec}(A/\\\\mathfrak{a})$
        for a unique ideal $\\\\mathfrak{a} \\\\subseteq A$.\\n\\n### 4.2 Separated
        Morphisms and the Valuative Criterion of Separatedness\\n\\nIn the Zariski
        topology, almost no scheme of dimension $\\\\ge 1$ is Hausdorff (since any
        two non-empty open subsets of an irreducible space intersect). Recall from
        general topology that a space $X$ is Hausdorff if and only if the diagonal
        $\\\\Delta(X) \\\\subseteq X \\\\times X$ is a closed subset. In scheme theory,
        the fibred product $X \\\\times_Y X$ does *not* carry the product topology,
        so the diagonal can be closed even when the space is not Hausdorff! This yields
        the algebraic replacement for the Hausdorff condition.\\n\\n**Definition 4.2.1.**
        Let $f: X \\\\to Y$ be a morphism of schemes. The *diagonal morphism* is the
        unique morphism $\\\\Delta = \\\\Delta_{X/Y}: X \\\\to X \\\\times_Y X$ determined
        by applying the universal property of the fibred product to $\\\\operatorname{id}_X:
        X \\\\to X$ and $\\\\operatorname{id}_X: X \\\\to X$ (so $p_1 \\\\circ \\\\Delta
        = \\\\operatorname{id}_X$ and $p_2 \\\\circ \\\\Delta = \\\\operatorname{id}_X$).\\n\\nWe
        say that $f: X \\\\to Y$ is *separated* if the diagonal morphism $\\\\Delta:
        X \\\\to X \\\\times_Y X$ is a closed immersion. We say that a scheme $X$
        is *separated* if its canonical morphism $X \\\\to \\\\operatorname{Spec}
        \\\\mathbb{Z}$ is separated.\\n\\n**Proposition 4.2.2.** Every morphism of
        affine schemes $f: \\\\operatorname{Spec} A \\\\to \\\\operatorname{Spec}
        B$ is separated. Moreover, an arbitrary morphism $f: X \\\\to Y$ is separated
        if and only if the set-theoretic image $\\\\Delta(X)$ is a closed subset of
        $X \\\\times_Y X$.\\n\\n*Proof.* If $X = \\\\operatorname{Spec} A$ and $Y
        = \\\\operatorname{Spec} B$, then $X \\\\times_Y X = \\\\operatorname{Spec}(A
        \\\\otimes_B A)$, and the diagonal morphism $\\\\Delta: \\\\operatorname{Spec}
        A \\\\to \\\\operatorname{Spec}(A \\\\otimes_B A)$ corresponds to the multiplication
        homomorphism $\\\\mu: A \\\\otimes_B A \\\\to A$ given by $a_1 \\\\otimes
        a_2 \\\\mapsto a_1 a_2$. Since $\\\\mu(a \\\\otimes 1) = a$, $\\\\mu$ is surjective!
        A surjective ring homomorphism $C \\\\twoheadrightarrow C/I$ always induces
        a closed immersion $\\\\operatorname{Spec}(C/I) \\\\hookrightarrow \\\\operatorname{Spec}
        C$. Thus $\\\\Delta$ is a closed immersion.\\n\\nFor a general morphism $f:
        X \\\\to Y$, let $P \\\\in X$. Choose an affine open neighborhood $V \\\\subseteq
        Y$ of $f(P)$ and an affine open neighborhood $U \\\\subseteq f^{-1}(V)$ of
        $P$. Then $U \\\\times_V U = p_1^{-1}(U) \\\\cap p_2^{-1}(U)$ is an affine
        open neighborhood of $\\\\Delta(P)$ in $X \\\\times_Y X$ whose preimage under
        $\\\\Delta$ is $\\\\Delta^{-1}(U \\\\times_V U) = U \\\\cap U = U$. By the
        affine case just proved, the restriction $\\\\Delta|_U: U \\\\to U \\\\times_V
        U$ is already a closed immersion! This means $\\\\Delta$ always induces a
        homeomorphism of $X$ onto its image $\\\\Delta(X)$ inside the open neighborhood
        $\\\\mathcal{W} = \\\\bigcup (U \\\\times_V U)$ of $\\\\Delta(X)$ in $X \\\\times_Y
        X$, with surjective sheaf map on $\\\\mathcal{W}$. Therefore, $\\\\Delta:
        X \\\\to X \\\\times_Y X$ is a closed immersion globally if and only if $\\\\Delta(X)$
        is a closed subset of the entire space $X \\\\times_Y X$. $\\\\blacksquare$\\n\\nTo
        test whether a morphism is separated without explicitly computing $X \\\\times_Y
        X$, Grothendieck introduced the *Valuative Criterion*, in which valuation
        rings play the role of small analytic discs or sequences approaching a limit
        point.\\n\\n**Definition 4.2.3.** Let $K$ be a field. A *valuation ring* of
        $K$ is a subring $R \\\\subseteq K$ such that for every non-zero element $x
        \\\\in K^\\\\times$, either $x \\\\in R$ or $x^{-1} \\\\in R$ (or both).\\n\\n**Lemma
        4.2.4.** Let $R$ be a valuation ring with field of fractions $K$.\\n1. $R$
        is a local ring whose unique maximal ideal is $\\\\mathfrak{m} = R \\\\setminus
        R^\\\\times = \\\\{x \\\\in R \\\\mid x = 0 \\\\text{ or } x^{-1} \\\\notin
        R\\\\}$. Thus $\\\\operatorname{Spec} R$ has a unique closed point $\\\\mathfrak{m}$
        and a generic point $(0)$ (if $R \\\\ne K$).\\n2. (Chevalley's Dominance Theorem)
        Let $(A, \\\\mathfrak{m}_A)$ be any local subring of a field $K$. Then there
        exists a valuation ring $(R, \\\\mathfrak{m}_R)$ of $K$ that *dominates* $A$
        (meaning $A \\\\subseteq R$ and $\\\\mathfrak{m}_R \\\\cap A = \\\\mathfrak{m}_A$).\\n\\n*Proof.*
        (1) The ideals of $R$ are totally ordered by inclusion: if $x, y \\\\in R
        \\\\setminus \\\\{0\\\\}$, either $x/y \\\\in R$ (so $(x) \\\\subseteq (y)$)
        or $y/x \\\\in R$ (so $(y) \\\\subseteq (x)$). Thus the set of non-units $\\\\mathfrak{m}
        = R \\\\setminus R^\\\\times$ is closed under addition, forming the unique
        maximal ideal of $R$.\\n\\n(2) Consider the set $\\\\Sigma$ of all subrings
        $B \\\\subseteq K$ such that $A \\\\subseteq B$ and $\\\\mathfrak{m}_A B \\\\ne
        B$ (i.e., $1 \\\\notin \\\\mathfrak{m}_A B$). Partially order $\\\\Sigma$
        by inclusion. Since $A \\\\in \\\\Sigma$ and any chain in $\\\\Sigma$ has
        upper bound equal to its union (if $1 \\\\in \\\\mathfrak{m}_A(\\\\bigcup
        B_i)$, $1$ would lie in $\\\\mathfrak{m}_A B_i$ for some $i$), Zorn's Lemma
        guarantees a maximal element $R \\\\in \\\\Sigma$. Let $\\\\mathfrak{m}_R$
        be a maximal ideal of $R$ containing the proper ideal $\\\\mathfrak{m}_A R$.
        Replacing $R$ by the localization $R_{\\\\mathfrak{m}_R}$ (which still belongs
        to $\\\\Sigma$, so by maximality $R = R_{\\\\mathfrak{m}_R}$), $(R, \\\\mathfrak{m}_R)$
        is a local ring dominating $(A, \\\\mathfrak{m}_A)$.\\n\\nWe show $R$ is a
        valuation ring of $K$. Let $x \\\\in K^\\\\times$, and suppose $x \\\\notin
        R$ and $x^{-1} \\\\notin R$. By maximality of $R$ in $\\\\Sigma$, neither
        $R[x]$ nor $R[x^{-1}]$ belongs to $\\\\Sigma$. Thus $1 \\\\in \\\\mathfrak{m}_A
        R[x] \\\\subseteq \\\\mathfrak{m}_R R[x]$ and $1 \\\\in \\\\mathfrak{m}_A
        R[x^{-1}] \\\\subseteq \\\\mathfrak{m}_R R[x^{-1}]$. This yields two equations
        with coefficients $a_i, b_j \\\\in \\\\mathfrak{m}_R$:\\n$$1 = a_0 + a_1 x
        + \\\\dots + a_n x^n, \\\\qquad 1 = b_0 + b_1 x^{-1} + \\\\dots + b_m x^{-m}.$$\\nChoose
        such equations with $n, m \\\\ge 1$ minimal, and assume without loss of generality
        that $m \\\\le n$. Since $a_0, b_0 \\\\in \\\\mathfrak{m}_R$ and $R$ is local,
        $1 - a_0$ and $1 - b_0$ are units in $R$. Dividing by $1 - a_0$ and $1 - b_0$,
        we may assume\\n$$1 = c_1 x + \\\\dots + c_n x^n, \\\\qquad 1 = d_1 x^{-1}
        + \\\\dots + d_m x^{-m} \\\\quad (c_i, d_j \\\\in \\\\mathfrak{m}_R).$$\\nMultiplying
        the second equation by $c_n x^n$ gives $c_n x^n = c_n d_1 x^{n-1} + \\\\dots
        + c_n d_m x^{n-m}$. Substituting this into the first equation eliminates $x^n$
        and produces an equation of degree $\\\\le n-1$ expressing $1$ as an $\\\\mathfrak{m}_R$-linear
        combination of $x, \\\\dots, x^{n-1}$, contradicting the minimality of $n$.
        Hence either $x \\\\in R$ or $x^{-1} \\\\in R$. $\\\\blacksquare$\\n\\n**Theorem
        4.2.5 (Valuative Criterion of Separatedness).** Let $f: X \\\\to Y$ be a morphism
        of schemes, and assume that $X$ is locally Noetherian (or more generally,
        that $\\\\Delta: X \\\\to X \\\\times_Y X$ is quasi-compact). Then $f$ is
        separated if and only if the following condition holds:\\n\\nFor any valuation
        ring $R$ with field of fractions $K$, let $T = \\\\operatorname{Spec} R$,
        $U = \\\\operatorname{Spec} K$, and let $i: U \\\\hookrightarrow T$ be the
        natural inclusion induced by $R \\\\hookrightarrow K$. Given any commutative
        solid-arrow diagram of morphisms\\n$$\\\\begin{matrix} U & \\\\xrightarrow{}
        & X \\\\\\\\ \\\\downarrow{i} & \\\\nearrow{\\\\exists ! h} & \\\\downarrow{f}
        \\\\\\\\ T & \\\\xrightarrow{} & Y \\\\end{matrix}$$\\nthere exists *at most
        one* morphism $h: T \\\\to X$ making both triangles commute. (If $X$ and $Y$
        are locally Noetherian and $f$ is locally of finite type, it suffices to test
        the criterion for *discrete valuation rings* $R$).\\n\\n*Proof.* First, observe
        by the universal property of the fibred product $X \\\\times_Y X$ that giving
        two morphisms $h_1, h_2: T \\\\to X$ over $Y$ that agree on $U$ is equivalent
        to giving a single morphism $H = (h_1, h_2): T \\\\to X \\\\times_Y X$ such
        that $H \\\\circ i: U \\\\to X \\\\times_Y X$ factors through the diagonal
        $\\\\Delta: X \\\\to X \\\\times_Y X$.\\n\\n*($\\\\implies$)* Suppose $f$
        is separated, so $\\\\Delta: X \\\\to X \\\\times_Y X$ is a closed immersion.
        Let $h_1, h_2: T \\\\to X$ be two morphisms as above, inducing $H: T \\\\to
        X \\\\times_Y X$. Let $\\\\eta \\\\in T = \\\\operatorname{Spec} R$ be the
        generic point $(0)$ (the image of $U = \\\\operatorname{Spec} K$). Since $h_1
        \\\\circ i = h_2 \\\\circ i$, we have $H(\\\\eta) \\\\in \\\\Delta(X)$. Because
        $T = \\\\overline{\\\\{\\\\eta\\\\}}$ and $\\\\Delta(X)$ is closed in $X \\\\times_Y
        X$, $H(T) \\\\subseteq \\\\Delta(X)$ set-theoretically. Moreover, on any affine
        open $\\\\operatorname{Spec} C \\\\subseteq X \\\\times_Y X$ containing the
        image of $T$, $\\\\Delta$ is defined by an ideal $I \\\\subseteq C$, and $H$
        corresponds to a ring homomorphism $\\\\phi: C \\\\to R$ whose composition
        with $R \\\\hookrightarrow K$ kills $I$. Since $R \\\\hookrightarrow K$ is
        injective, $\\\\phi(I) = 0$ in $R$! Thus $H$ factors through the closed subscheme
        $\\\\Delta: X \\\\hookrightarrow X \\\\times_Y X$, meaning $h_1 = p_1 \\\\circ
        H = p_2 \\\\circ H = h_2$.\\n\\n*($\\\\impliedby$)* Suppose the valuative
        criterion holds; by Proposition 4.2.2, we need only show that the image $\\\\Delta(X)$
        is closed in $X \\\\times_Y X$. Since $\\\\Delta$ is quasi-compact (which
        holds automatically if $X$ is locally Noetherian, as every subset of a Noetherian
        space is quasi-compact), a standard topological lemma (Lemma 4.2.6 below)
        states that a quasi-compact constructible subset $Z = \\\\Delta(X)$ of a scheme
        $W = X \\\\times_Y X$ is closed if and only if it is *stable under specialization*:
        whenever $\\\\xi_1 \\\\in Z$ and $\\\\xi_0 \\\\in \\\\overline{\\\\{\\\\xi_1\\\\}}
        \\\\subseteq W$, we must have $\\\\xi_0 \\\\in Z$.\\n\\nLet $\\\\xi_1 \\\\in
        \\\\Delta(X)$ and $\\\\xi_0 \\\\in \\\\overline{\\\\{\\\\xi_1\\\\}} \\\\subseteq
        W = X \\\\times_Y X$. Give $Z' = \\\\overline{\\\\{\\\\xi_1\\\\}}$ its reduced
        induced closed subscheme structure (Exercise 3.3), so $Z'$ is an integral
        closed subscheme of $W$ with generic point $\\\\xi_1$ and function field $K
        = \\\\kappa(\\\\xi_1)$. The local ring $A = \\\\mathcal{O}_{Z', \\\\xi_0}$
        is a local subring of $K$. By Lemma 4.2.4(2), there exists a valuation ring
        $R$ of $K$ dominating $A$. The composite homomorphism $\\\\mathcal{O}_{W,
        \\\\xi_0} \\\\twoheadrightarrow A \\\\hookrightarrow R \\\\hookrightarrow
        K$ defines a morphism $H = (h_1, h_2): T = \\\\operatorname{Spec} R \\\\to
        W = X \\\\times_Y X$ sending the generic point $(0) \\\\in T$ to $\\\\xi_1
        \\\\in \\\\Delta(X)$ and the closed point $\\\\mathfrak{m}_R \\\\in T$ to
        $\\\\xi_0$. Moreover, at the generic point $\\\\xi_1 \\\\in \\\\Delta(X)$,
        the restriction $H|_U: U = \\\\operatorname{Spec} K \\\\to W$ factors through
        $\\\\xi_1 \\\\in \\\\Delta(X)$, so $h_1|_U = h_2|_U$. By the valuative criterion,
        we must have $h_1 = h_2$ on all of $T$, which means $H(T) \\\\subseteq \\\\Delta(X)$,
        and in particular $\\\\xi_0 = H(\\\\mathfrak{m}_R) \\\\in \\\\Delta(X)$. Thus
        $\\\\Delta(X)$ is closed! $\\\\blacksquare$\\n\\n**Lemma 4.2.6.** Let $g:
        X \\\\to W$ be a quasi-compact morphism of schemes such that $g(X)$ is locally
        closed in every small open neighborhood (as holds for $\\\\Delta: X \\\\to
        X \\\\times_Y X$). Then $g(X)$ is closed in $W$ if and only if $g(X)$ is stable
        under specialization.\\n\\n*Proof.* Any closed subset is obviously stable
        under specialization. Conversely, assume $g(X)$ is stable under specialization,
        and let $\\\\xi_0 \\\\in \\\\overline{g(X)}$. Let $V = \\\\operatorname{Spec}
        C \\\\subseteq W$ be an affine open neighborhood of $\\\\xi_0$. Because $g$
        is quasi-compact, $g^{-1}(V)$ can be covered by finitely many affine open
        subsets $U_1, \\\\dots, U_r \\\\subseteq X$. Since $\\\\xi_0 \\\\in \\\\overline{g(X)
        \\\\cap V} = \\\\bigcup_{i=1}^r \\\\overline{g(U_i)}$, we have $\\\\xi_0 \\\\in
        \\\\overline{g(U_i)}$ for some $i$, where $U_i = \\\\operatorname{Spec} B_i$.
        For a morphism of affine schemes $g_i: \\\\operatorname{Spec} B_i \\\\to \\\\operatorname{Spec}
        C$ corresponding to $\\\\phi: C \\\\to B_i$, the closure $\\\\overline{g_i(\\\\operatorname{Spec}
        B_i)}$ is precisely $V(\\\\ker \\\\phi) \\\\subseteq \\\\operatorname{Spec}
        C$. Any minimal prime ideal $\\\\mathfrak{p} \\\\in V(\\\\ker \\\\phi)$ contained
        in $\\\\mathfrak{p}_{\\\\xi_0}$ is the contraction of a minimal prime of $B_i/\\\\phi(\\\\ker
        \\\\phi)$ (by localizing at $\\\\mathfrak{p}$, where $\\\\mathfrak{p}C_\\\\mathfrak{p}
        = \\\\sqrt{\\\\ker \\\\phi_\\\\mathfrak{p}}$), hence lies in the image $\\\\xi_1
        \\\\in g(U_i) \\\\subseteq g(X)$. Then $\\\\xi_0 \\\\in \\\\overline{\\\\{\\\\xi_1\\\\}}$,
        and by stability under specialization, $\\\\xi_0 \\\\in g(X)$. $\\\\blacksquare$\\n\\n###
        4.3 Proper Morphisms and the Valuative Criterion of Properness\\n\\nIn topology,
        a compact space $X$ has the property that for any space $Z$, the projection
        $X \\\\times Z \\\\to Z$ is a closed map (Takes closed sets to closed sets).
        In the Zariski topology, almost all schemes are quasi-compact (including $\\\\mathbb{A}^1_k$),
        yet $\\\\mathbb{A}^1_k$ is clearly not \\\"complete\\\" or \\\"compact\\\":
        the hyperbola $Z(xy - 1) \\\\subseteq \\\\mathbb{A}^1_k \\\\times \\\\mathbb{A}^1_k$
        is closed, but its projection onto the second factor is $\\\\mathbb{A}^1_k
        \\\\setminus \\\\{0\\\\}$, which is *not* closed! Requiring a morphism to
        remain closed after arbitrary base change yields the fundamental notion of
        a *proper* morphism.\\n\\n**Definition 4.3.1.** A morphism of schemes $f:
        X \\\\to Y$ is * universally closed* if for every morphism $Y' \\\\to Y$,
        the base-changed morphism $f': X \\\\times_Y Y' \\\\to Y'$ is a closed map
        on the underlying topological spaces.\\n\\nA morphism $f: X \\\\to Y$ is *proper*
        if it is separated, of finite type, and universally closed. A scheme $X$ over
        a field $k$ is called *proper* (or *complete*) over $k$ if the structure morphism
        $X \\\\to \\\\operatorname{Spec} k$ is proper.\\n\\n**Theorem 4.3.2 (Valuative
        Criterion of Properness).** Let $f: X \\\\to Y$ be a morphism of finite type,
        with $X$ locally Noetherian. Then $f$ is proper if and only if for every valuation
        ring $R$ with field of fractions $K$, and every commutative solid-arrow diagram\\n$$\\\\begin{matrix}
        \\\\operatorname{Spec} K & \\\\xrightarrow{} & X \\\\\\\\ \\\\downarrow{i}
        & \\\\nearrow{\\\\exists ! h} & \\\\downarrow{f} \\\\\\\\ \\\\operatorname{Spec}
        R & \\\\xrightarrow{} & Y \\\\end{matrix}$$\\nthere exists a *unique* morphism
        $h: \\\\operatorname{Spec} R \\\\to X$ making the diagram commute.\\n\\n*Proof.*
        By the Valuative Criterion of Separatedness (Theorem 4.2.5), the uniqueness
        of $h$ is equivalent to $f$ being separated. Assuming $f$ is separated and
        of finite type, we must show that $f$ is universally closed if and only if
        the dashed arrow $h$ always *exists*.\\n\\n*($\\\\implies$)* Suppose $f$ is
        proper, and we are given a commutative square as above with $T = \\\\operatorname{Spec}
        R$ and $U = \\\\operatorname{Spec} K$. By the universal property of the base
        change $X_T = X \\\\times_Y T \\\\to T$, the given morphisms $U \\\\to X$
        and $U \\\\hookrightarrow T$ over $Y$ define a morphism $s: U \\\\to X_T$
        whose composition with the projection $p: X_T \\\\to T$ is the inclusion $i:
        U \\\\hookrightarrow T$. Let $\\\\xi_1 = s((0)) \\\\in X_T$ be the image of
        the single point of $U = \\\\operatorname{Spec} K$, and let $Z = \\\\overline{\\\\{\\\\xi_1\\\\}}
        \\\\subseteq X_T$ be its closure in $X_T$, endowed with the reduced induced
        closed subscheme structure.\\n\\nNotice that at the point $\\\\xi_1 \\\\in
        Z$, the residue field $\\\\kappa(\\\\xi_1)$ sits between $K$ (via $p: Z \\\\to
        T$) and $K$ (via $s: U \\\\to Z$), so the induced map of fields $K \\\\to
        \\\\kappa(\\\\xi_1) \\\\to K$ is the identity, meaning the function field
        of the integral scheme $Z$ is $K(Z) \\\\cong K$!\\n\\nSince $f$ is universally
        closed, the projection $p: X_T \\\\to T$ is a closed map, so $p(Z)$ is a closed
        subset of $T = \\\\operatorname{Spec} R$ containing the generic point $(0)
        = p(\\\\xi_1)$. Since $T = \\\\overline{\\\\{(0)\\\\}}$, we must have $p(Z)
        = T$. Thus there exists a point $\\\\xi_0 \\\\in Z$ such that $p(\\\\xi_0)
        = \\\\mathfrak{m}_R$ (the closed point of $T$). Now consider the local homomorphism
        of local rings induced by $p|_Z: Z \\\\to T$ at $\\\\xi_0$:\\n$$R = \\\\mathcal{O}_{T,
        \\\\mathfrak{m}_R} \\\\longrightarrow \\\\mathcal{O}_{Z, \\\\xi_0} \\\\subseteq
        K(Z) = K.$$\\nThis shows that the local ring $\\\\mathcal{O}_{Z, \\\\xi_0}
        \\\\subseteq K$ dominates the valuation ring $R$. However, it is a trivial
        property of valuation rings that a valuation ring $R$ is *maximal* with respect
        to dominance in its fraction field $K$: if $R \\\\subseteq A \\\\subseteq
        K$ and $\\\\mathfrak{m}_A \\\\cap R = \\\\mathfrak{m}_R$, then for any $x
        \\\\in A \\\\setminus R$, we have $x^{-1} \\\\in \\\\mathfrak{m}_R \\\\subseteq
        \\\\mathfrak{m}_A$, contradicting $x \\\\cdot x^{-1} = 1 \\\\in A$. Therefore,
        $R = \\\\mathcal{O}_{Z, \\\\xi_0}$! This equality gives an inverse homomorphism
        $\\\\mathcal{O}_{Z, \\\\xi_0} \\\\xrightarrow{\\\\sim} R$, which induces a
        morphism $T = \\\\operatorname{Spec} R \\\\to Z \\\\subseteq X_T \\\\to X$
        that extends $U \\\\to X$ and lifts $T \\\\to Y$.\\n\\n*($\\\\impliedby$)*
        Suppose the existence and uniqueness condition holds for all valuation rings.
        Observe first that the valuative criterion is automatically preserved under
        arbitrary base change $Y' \\\\to Y$: any diagram from $U \\\\hookrightarrow
        T$ into $X' = X \\\\times_Y Y' \\\\to Y'$ projects to a diagram into $X \\\\to
        Y$, which admits a lift $T \\\\to X$, and combining this with $T \\\\to Y'$
        gives the required lift $T \\\\to X \\\\times_Y Y'$.\\n\\nTherefore, to show
        $f$ is universally closed, it suffices to show that any quasi-compact morphism
        $f: X \\\\to Y$ satisfying the valuative existence criterion is a closed map!
        Let $Z \\\\subseteq X$ be a closed subset; giving $Z$ its reduced induced
        closed subscheme structure, the composition $Z \\\\hookrightarrow X \\\\to
        Y$ is still quasi-compact and still satisfies the valuative existence criterion
        (since $Z$ is closed in $X$). Thus we are reduced to showing that $f(X)$ is
        closed in $Y$.\\n\\nBy Lemma 4.2.6, since $f$ is quasi-compact, $f(X)$ is
        closed in $Y$ if and only if $f(X)$ is stable under specialization. Let $y_1
        = f(x_1) \\\\in f(X)$, and let $y_0 \\\\in \\\\overline{\\\\{y_1\\\\}} \\\\subseteq
        Y$. Replace $X$ by the integral closed subscheme $\\\\overline{\\\\{x_1\\\\}}$
        and $Y$ by $\\\\overline{\\\\{y_1\\\\}}$, so $f: X \\\\to Y$ is a dominant
        morphism of integral schemes with $K(Y) \\\\hookrightarrow K(X)$. Let $K =
        K(X)$. By Lemma 4.2.4(2), the local ring $\\\\mathcal{O}_{Y, y_0} \\\\subseteq
        K(Y) \\\\subseteq K$ is dominated by a valuation ring $R$ of $K$. This yields
        a commutative diagram:\\n$$\\\\begin{matrix} \\\\operatorname{Spec} K & \\\\xrightarrow{x_1}
        & X \\\\\\\\ \\\\downarrow & & \\\\downarrow{f} \\\\\\\\ \\\\operatorname{Spec}
        R & \\\\xrightarrow{} & Y \\\\end{matrix}$$\\nsending the closed point $\\\\mathfrak{m}_R
        \\\\in \\\\operatorname{Spec} R$ to $y_0 \\\\in Y$. By the valuative criterion,
        there exists a lift $h: \\\\operatorname{Spec} R \\\\to X$, and the image
        $x_0 = h(\\\\mathfrak{m}_R) \\\\in X$ satisfies $f(x_0) = y_0$. Thus $y_0
        \\\\in f(X)$, proving that $f(X)$ is closed. $\\\\blacksquare$\\n\\n**Corollary
        4.3.3.** Let $Y$ be any scheme. Then the projection $\\\\mathbb{P}^n_Y = \\\\mathbb{P}^n_{\\\\mathbb{Z}}
        \\\\times_{\\\\operatorname{Spec} \\\\mathbb{Z}} Y \\\\to Y$ is a proper morphism.
        Consequently, any closed subscheme of $\\\\mathbb{P}^n_Y$ (i.e., any *projective*
        scheme over $Y$) is proper over $Y$.\\n\\n*Proof.* Since properness is preserved
        under base change and closed immersions are proper, it suffices to prove that
        $\\\\mathbb{P}^n_{\\\\mathbb{Z}} \\\\to \\\\operatorname{Spec} \\\\mathbb{Z}$
        is proper. Clearly $\\\\mathbb{P}^n_{\\\\mathbb{Z}}$ is of finite type over
        $\\\\operatorname{Spec} \\\\mathbb{Z}$ (covered by $n+1$ copies of $\\\\mathbb{A}^n_{\\\\mathbb{Z}}$).
        We verify the Valuative Criterion of Properness (Theorem 4.3.2). Let $R$ be
        a valuation ring with fraction field $K$, and suppose we are given a morphism
        $g: \\\\operatorname{Spec} K \\\\to \\\\mathbb{P}^n_{\\\\mathbb{Z}}$.\\n\\nThe
        image of $\\\\operatorname{Spec} K$ is a single point in $\\\\mathbb{P}^n_{\\\\mathbb{Z}}$.
        Cover $\\\\mathbb{P}^n_{\\\\mathbb{Z}}$ by its standard affine opens $U_i
        = D_+(x_i) = \\\\operatorname{Spec} \\\\mathbb{Z}[x_0/x_i, \\\\dots, x_n/x_i]$.
        For each $i$ such that $g(\\\\operatorname{Spec} K) \\\\in U_i$, $g$ corresponds
        to a ring homomorphism $\\\\mathbb{Z}[x_0/x_i, \\\\dots, x_n/x_i] \\\\to K$.
        Let $\\\\xi_0, \\\\xi_1, \\\\dots, \\\\xi_n \\\\in K$ be defined by setting
        $\\\\xi_i = 1$ for some fixed index $i_0$ with $g(\\\\operatorname{Spec} K)
        \\\\in U_{i_0}$, and $\\\\xi_j$ equal to the image of $x_j/x_{i_0}$ in $K$.
        Then on every $U_i$ containing $g(\\\\operatorname{Spec} K)$, $\\\\xi_i \\\\ne
        0$ and the image of $x_j/x_i$ in $K$ is precisely $\\\\xi_j / \\\\xi_i$.\\n\\nNow
        consider the finite set of elements $\\\\{\\\\xi_0, \\\\xi_1, \\\\dots, \\\\xi_n\\\\}
        \\\\subseteq K$, not all zero. Because $R$ is a valuation ring of $K$, the
        ideals $(\\\\xi_0 R), \\\\dots, (\\\\xi_n R)$ (as fractional ideals in $K$)
        are totally ordered by inclusion! Hence there exists an index $m \\\\in \\\\{0,
        1, \\\\dots, n\\\\}$ such that $\\\\xi_m \\\\ne 0$ and $(\\\\xi_j R) \\\\subseteq
        (\\\\xi_m R)$ for all $j = 0, \\\\dots, n$. This means that\\n$$\\\\frac{\\\\xi_j}{\\\\xi_m}
        \\\\in R \\\\quad \\\\text{for all } j = 0, 1, \\\\dots, n.$$\\nTherefore,
        the homomorphism $\\\\mathbb{Z}[x_0/x_m, \\\\dots, x_n/x_m] \\\\to K$ sending
        $x_j/x_m \\\\mapsto \\\\xi_j / \\\\xi_m$ lands entirely inside the subring
        $R \\\\subseteq K$! This defines a morphism $h: \\\\operatorname{Spec} R \\\\to
        U_m \\\\subseteq \\\\mathbb{P}^n_{\\\\mathbb{Z}}$ extending $g: \\\\operatorname{Spec}
        K \\\\to \\\\mathbb{P}^n_{\\\\mathbb{Z}}$.\\n\\nTo verify uniqueness of $h$,
        suppose $h': \\\\operatorname{Spec} R \\\\to \\\\mathbb{P}^n_{\\\\mathbb{Z}}$
        is any lift of $g$. Since $\\\\operatorname{Spec} R$ is a local scheme (its
        unique closed point $\\\\mathfrak{m}_R$ is contained in every open neighborhood
        containing $\\\\operatorname{Spec} R$), the image $h'(\\\\operatorname{Spec}
        R)$ must lie entirely inside one of the standard affine opens $U_k$. Then
        $h'$ corresponds to a homomorphism $\\\\mathbb{Z}[x_0/x_k, \\\\dots, x_n/x_k]
        \\\\to R \\\\subseteq K$ whose composition with $R \\\\hookrightarrow K$ is
        determined by $g$. Since $R \\\\hookrightarrow K$ is injective, $h'$ is uniquely
        determined on $U_k$ (and agrees with $h$ on $U_m \\\\cap U_k$). Thus $\\\\mathbb{P}^n_{\\\\mathbb{Z}}
        \\\\to \\\\operatorname{Spec} \\\\mathbb{Z}$ is proper. $\\\\blacksquare$\\n\\n###
        4.4 Flat and Smooth Morphisms\\n\\nIn algebraic geometry, not every morphism
        has fibres that vary \\\"continuously\\\" in a family. The algebraic condition
        that guarantees the well-behaved variation of fibres (such as constancy of
        dimension and Hilbert polynomial) is *flatness*, introduced by Serre.\\n\\n**Definition
        4.4.1.** Let $A$ be a ring and $M$ an $A$-module. We say that $M$ is *flat*
        over $A$ if the tensor product functor $- \\\\otimes_A M$ is exact on the
        category of $A$-modules (equivalently, for every injective homomorphism of
        $A$-modules $N' \\\\hookrightarrow N$\u2014or even just every ideal inclusion
        $\\\\mathfrak{a} \\\\hookrightarrow A$\u2014the induced map $N' \\\\otimes_A
        M \\\\to N \\\\otimes_A M$ is injective).\\n\\nLet $f: X \\\\to Y$ be a morphism
        of schemes, and let $\\\\mathcal{F}$ be a sheaf of $\\\\mathcal{O}_X$-modules.
        We say that $\\\\mathcal{F}$ is *flat over $Y$* at a point $x \\\\in X$ if
        the stalk $\\\\mathcal{F}_x$ is a flat $\\\\mathcal{O}_{Y, f(x)}$-module (via
        the local ring homomorphism $f^\\\\sharp_x: \\\\mathcal{O}_{Y, f(x)} \\\\to
        \\\\mathcal{O}_{X, x}$). We say that $f: X \\\\to Y$ is a *flat morphism*
        if $\\\\mathcal{O}_X$ is flat over $Y$ at every point $x \\\\in X$.\\n\\n**Proposition
        4.4.2.**\\n1. Let $\\\\varphi: A \\\\to B$ be a ring homomorphism. Then the
        induced morphism of affine schemes $f: \\\\operatorname{Spec} B \\\\to \\\\operatorname{Spec}
        A$ is flat if and only if $B$ is a flat $A$-module.\\n2. Flatness of a morphism
        $f: X \\\\to Y$ is preserved under open immersions, compositions, and arbitrary
        base change $X \\\\times_Y Y' \\\\to Y'$.\\n3. (Going-Down for Flat Morphisms)
        If $\\\\varphi: A \\\\to B$ is a flat ring homomorphism, then for any prime
        ideal $\\\\mathfrak{q} \\\\in \\\\operatorname{Spec} B$ with $\\\\mathfrak{p}
        = \\\\varphi^{-1}(\\\\mathfrak{q}) \\\\in \\\\operatorname{Spec} A$, the local
        map $A_\\\\mathfrak{p} \\\\to B_\\\\mathfrak{q}$ is faithfully flat, hence
        surjective on $\\\\operatorname{Spec}$: every prime ideal $\\\\mathfrak{p}'
        \\\\subseteq \\\\mathfrak{p}$ in $A$ is the contraction of a prime ideal $\\\\mathfrak{q}'
        \\\\subseteq \\\\mathfrak{q}$ in $B$.\\n\\n*Proof.* (1) Recall from commutative
        algebra that flatness is a local property: a $B$-module $M$ is flat over $A$
        if and only if for every prime ideal $\\\\mathfrak{q} \\\\in \\\\operatorname{Spec}
        B$ (with $\\\\mathfrak{p} = \\\\varphi^{-1}(\\\\mathfrak{q})$), the localization
        $M_\\\\mathfrak{q}$ is a flat $A_\\\\mathfrak{p}$-module. Indeed, $N' \\\\to
        N$ is injective after tensoring with $M$ if and only if $(N' \\\\otimes_A
        M)_\\\\mathfrak{q} \\\\to (N \\\\otimes_A M)_\\\\mathfrak{q}$ is injective
        for all $\\\\mathfrak{q} \\\\in \\\\operatorname{Spec} B$, and $(N \\\\otimes_A
        M)_\\\\mathfrak{q} \\\\cong N_\\\\mathfrak{p} \\\\otimes_{A_\\\\mathfrak{p}}
        M_\\\\mathfrak{q}$.\\n(2) Follows immediately from standard properties of
        tensor products: if $B$ is flat over $A$ and $A \\\\to A'$ is any homomorphism,
        then for any $A'$-module $N$, $N \\\\otimes_{A'} (B \\\\otimes_A A') \\\\cong
        N \\\\otimes_A B$, which is an exact functor of $N$.\\n(3) Since $A_\\\\mathfrak{p}
        \\\\to B_\\\\mathfrak{q}$ is a flat local homomorphism of local rings, for
        any non-zero $A_\\\\mathfrak{p}$-module $N$, Nakayama's Lemma implies $N /
        \\\\mathfrak{p}N \\\\ne 0$, and by flatness $(N / \\\\mathfrak{p}N) \\\\otimes_{A_\\\\mathfrak{p}}
        B_\\\\mathfrak{q} \\\\cong (N \\\\otimes_{A_\\\\mathfrak{p}} B_\\\\mathfrak{q})
        / \\\\mathfrak{p}(N \\\\otimes_{A_\\\\mathfrak{p}} B_\\\\mathfrak{q})$ injects
        into a quotient of $N \\\\otimes_{A_\\\\mathfrak{p}} B_\\\\mathfrak{q}$ and
        is non-zero because $B_\\\\mathfrak{q} / \\\\mathfrak{p}B_\\\\mathfrak{q}
        \\\\ne 0$ (as $\\\\mathfrak{p}B_\\\\mathfrak{q} \\\\subseteq \\\\mathfrak{q}B_\\\\mathfrak{q}
        \\\\subsetneq B_\\\\mathfrak{q}$). Applying this to $N = \\\\kappa(\\\\mathfrak{p}')$
        shows $\\\\kappa(\\\\mathfrak{p}') \\\\otimes_{A_\\\\mathfrak{p}} B_\\\\mathfrak{q}
        \\\\ne 0$, so the fibre over $\\\\mathfrak{p}'$ in $\\\\operatorname{Spec}
        B_\\\\mathfrak{q}$ is non-empty! $\\\\blacksquare$\\n\\n**Theorem 4.4.3 (Dimension
        of Fibres of Flat Morphisms).** Let $f: X \\\\to Y$ be a flat morphism of
        finite type between locally Noetherian schemes. Let $x \\\\in X$ and $y =
        f(x) \\\\in Y$. Then\\n$$\\\\dim_x(X_y) = \\\\dim \\\\mathcal{O}_{X_y, x}
        = \\\\dim \\\\mathcal{O}_{X, x} - \\\\dim \\\\mathcal{O}_{Y, y}.$$\\n\\n*Proof.*
        Letting $A = \\\\mathcal{O}_{Y, y}$ (with maximal ideal $\\\\mathfrak{m}_y$)
        and $B = \\\\mathcal{O}_{X, x}$ (with maximal ideal $\\\\mathfrak{m}_x$),
        the local ring of the fibre $X_y$ at $x$ is $\\\\mathcal{O}_{X_y, x} \\\\cong
        B / \\\\mathfrak{m}_y B$. We must prove that for any flat local homomorphism
        of Noetherian local rings $(A, \\\\mathfrak{m}_A) \\\\to (B, \\\\mathfrak{m}_B)$,\\n$$\\\\dim
        B = \\\\dim A + \\\\dim(B / \\\\mathfrak{m}_A B).$$\\nWe prove this by induction
        on $d = \\\\dim A$. If $d = 0$, then $A$ is an Artinian local ring, so $\\\\mathfrak{m}_A^k
        = 0$ for some $k \\\\ge 1$. Then $(\\\\mathfrak{m}_A B)^k = 0$ in $B$, so
        every prime ideal of $B$ contains $\\\\mathfrak{m}_A B$. Thus $\\\\operatorname{Spec}
        B$ and $\\\\operatorname{Spec}(B / \\\\mathfrak{m}_A B)$ are homeomorphic,
        giving $\\\\dim B = \\\\dim(B / \\\\mathfrak{m}_A B) + 0$.\\n\\n generally,
        let $\\\\dim A = d \\u003e 0$ (showing $\\\\dim B \\\\ge \\\\dim A + \\\\dim(B/\\\\mathfrak{m}_A
        B)$ is immediate from the Going-Down property of Proposition 4.4.2(3): take
        a maximal chain of primes in $B/\\\\mathfrak{m}_A B$, which lifts to a chain
        in $B$ from some prime $\\\\mathfrak{q}_0$ containing $\\\\mathfrak{m}_A B$
        up to $\\\\mathfrak{m}_B$; since $\\\\mathfrak{q}_0 \\\\cap A = \\\\mathfrak{m}_A$,
        any chain of length $d$ in $A$ ending at $\\\\mathfrak{m}_A$ lifts by Going-Down
        to a chain of length $d$ in $B$ ending at $\\\\mathfrak{q}_0$, concatenating
        to a chain of length $\\\\dim A + \\\\dim(B/\\\\mathfrak{m}_A B)$ in $B$).\\n\\nTo
        prove the reverse inequality $\\\\dim B \\\\le \\\\dim A + \\\\dim(B/\\\\mathfrak{m}_A
        B)$, we may pass to $A / \\\\sqrt{0}$ (which does not change $\\\\dim A$,
        $\\\\dim B$, or $\\\\dim(B/\\\\mathfrak{m}_A B)$, and preserves flatness upon
        base change). Thus we may assume $A$ is reduced, so the set of minimal primes
        $\\\\{\\\\mathfrak{p}_1, \\\\dots, \\\\mathfrak{p}_r\\\\}$ of $A$ has intersection
        $(0)$, and since $\\\\dim A \\u003e 0$, $\\\\mathfrak{m}_A \\\\not\\\\subseteq
        \\\\bigcup_{i=1}^r \\\\mathfrak{p}_i$ by Prime Avoidance. Choose an element
        $t \\\\in \\\\mathfrak{m}_A \\\\setminus \\\\bigcup_{i=1}^r \\\\mathfrak{p}_i$.
        Then $t$ is a non-zero-divisor in $A$, meaning the multiplication map $A \\\\xrightarrow{\\\\cdot
        t} A$ is injective, and $\\\\dim(A / tA) = \\\\dim A - 1$.\\n\\nBecause $B$
        is flat over $A$, tensoring the injective map $A \\\\xrightarrow{\\\\cdot
        t} A$ with $B$ implies that $B \\\\xrightarrow{\\\\cdot t} B$ is also injective!
        Thus $t$ is a non-zero-divisor in $B$, so by Krull's Principal Ideal Theorem
        (Theorem 1.5.6), $\\\\dim(B / tB) = \\\\dim B - 1$. Furthermore, $B/tB \\\\cong
        B \\\\otimes_A (A/tA)$ is flat over $A/tA$, with the exact same closed fibre
        $(B/tB) / \\\\mathfrak{m}_{A/tA}(B/tB) \\\\cong B / \\\\mathfrak{m}_A B$.
        Applying the induction hypothesis to $A/tA \\\\to B/tB$ gives\\n$$\\\\dim
        B - 1 = \\\\dim(B/tB) = \\\\dim(A/tA) + \\\\dim(B/\\\\mathfrak{m}_A B) = \\\\dim
        A - 1 + \\\\dim(B/\\\\mathfrak{m}_A B),$$\\ncompleting the induction. $\\\\blacksquare$\\n\\n---\\n\\n###
        Exercises for Chapter 4\\n\\n**Exercise 4.1 (Closed Subschemes and Ideals).**
        Let $X = \\\\operatorname{Spec} A$ be an affine scheme. Prove that for every
        ideal $\\\\mathfrak{a} \\\\subseteq A$, the canonical morphism $\\\\operatorname{Spec}(A/\\\\mathfrak{a})
        \\\\to \\\\operatorname{Spec} A$ is a closed immersion. Conversely, prove
        that if $f: Z \\\\to \\\\operatorname{Spec} A$ is *any* closed immersion,
        then $Z$ is an affine scheme isomorphic over $\\\\operatorname{Spec} A$ to
        $\\\\operatorname{Spec}(A/\\\\mathfrak{a})$ for a unique ideal $\\\\mathfrak{a}
        \\\\subseteq A$. (Hint: Show that $Z$ is quasi-compact, cover $Z$ by finitely
        many open sets $D(g_i)$ that are principal in both $Z$ and $X$, and apply
        the method of Proposition 4.1.2).\\n\\n**Exercise 4.2.** Prove that a morphism
        $f: X \\\\to Y$ between affine schemes is separated. Give an explicit example
        of a scheme $X$ over a field $k$ that is *not* separated, and show how the
        Valuative Criterion of Separatedness (Theorem 4.2.5) fails for $X$ using the
        discrete valuation ring $R = k[t]_{(t)}$.\\n\\n**Exercise 4.3.** Let $f: X
        \\\\to Y$ and $g: Y \\\\to Z$ be morphisms of schemes, and choose any property
        $\\\\mathcal{P} \\\\in \\\\{\\\\text{separated, proper}\\\\}$.\\n(a) Prove
        that $\\\\mathcal{P}$ is stable under composition ($g \\\\circ f$ has $\\\\mathcal{P}$
        if $f$ and $g$ have $\\\\mathcal{P}$) and base change.\\n(b) **(Cancellation
        Law)** Prove that if $g \\\\circ f: X \\\\to Z$ is separated, then $f: X \\\\to
        Y$ is separated. Prove that if $g \\\\circ f: X \\\\to Z$ is proper and $g:
        Y \\\\to Z$ is separated (and $X$ is Noetherian), then $f: X \\\\to Y$ is
        proper. (Hint: Consider the graph morphism $\\\\Gamma_f: X \\\\to X \\\\times_Z
        Y$, and show it is the base change of $\\\\Delta_{Y/Z}: Y \\\\to Y \\\\times_Z
        Y$).\\n\\n**Exercise 4.4.** Let $k$ be an algebraically closed field. Prove
        that the affine line $\\\\mathbb{A}^1_k$ is *not* proper over $\\\\operatorname{Spec}
        k$ in two ways:\\n(a) Directly from the definition, by exhibiting a closed
        subset of $\\\\mathbb{A}^1_k \\\\times_k \\\\mathbb{A}^1_k$ whose projection
        to the second factor is not closed.\\n(b) Using the Valuative Criterion of
        Properness with $R = k[t^{-1}]_{(t^{-1})} \\\\subseteq k(t)$.\\n\\n**Exercise
        4.5 (Flatness and Torsion).** Let $A$ be a Principal Ideal Domain (such as
        $\\\\mathbb{Z}$ or $k[t]$), and let $M$ be an $A$-module. Prove that $M$ is
        flat over $A$ if and only if $M$ is torsion-free (i.e., for every $a \\\\in
        A \\\\setminus \\\\{0\\\\}$ and $m \\\\in M \\\\setminus \\\\{0\\\\}$, $am
        \\\\ne 0$). Deduce that if $C$ is a reduced scheme over a smooth curve $Y
        = \\\\operatorname{Spec} A$, then $f: C \\\\to Y$ is flat if and only if every
        irreducible component of $C$ dominates $Y$ (no component is contained in a
        single fibre).\\n\\n---\\n\\n## CHAPTER 5: SHEAVES OF MODULES, DIVISORS, AND
        LINE BUNDLES\\n\\nJust as a commutative ring is studied through its category
        of modules, a scheme $(X, \\\\mathcal{O}_X)$ is studied through its category
        of sheaves of $\\\\mathcal{O}_X$-modules. Among all $\\\\mathcal{O}_X$-modules,
        the *quasi-coherent* and *coherent* sheaves are those that arise directly
        from algebraic modules over the coordinate rings of affine open subsets.\\n\\n###
        5.1 $\\\\mathcal{O}_X$-Modules, Quasi-Coherent and Coherent Sheaves\\n\\n**Definition
        5.1.1.** Let $(X, \\\\mathcal{O}_X)$ be a ringed space. A *sheaf of $\\\\mathcal{O}_X$-modules*
        (or simply an *$\\\\mathcal{O}_X$-module*) is a sheaf $\\\\mathcal{F}$ on
        $X$ such that for each open set $U \\\\subseteq X$, $\\\\mathcal{F}(U)$ is
        an $\\\\mathcal{O}_X(U)$-module, and for each inclusion of open sets $V \\\\subseteq
        U$, the restriction map $\\\\mathcal{F}(U) \\\\to \\\\mathcal{F}(V)$ is compatible
        with the module structures via the ring homomorphism $\\\\mathcal{O}_X(U)
        \\\\to \\\\mathcal{O}_X(V)$ (that is, $(a \\\\cdot s)|_V = a|_V \\\\cdot s|_V$
        for all $a \\\\in \\\\mathcal{O}_X(U)$ and $s \\\\in \\\\mathcal{F}(U)$).\\n\\nA
        morphism of $\\\\mathcal{O}_X$-modules $\\\\varphi: \\\\mathcal{F} \\\\to
        \\\\mathcal{G}$ is a morphism of sheaves such that for every open $U \\\\subseteq
        X$, $\\\\varphi(U): \\\\mathcal{F}(U) \\\\to \\\\mathcal{G}(U)$ is a homomorphism
        of $\\\\mathcal{O}_X(U)$-modules. We denote the category of $\\\\mathcal{O}_X$-modules
        by $\\\\mathfrak{Mod}(X)$.\\n\\n**Definition 5.1.2 (Operations on $\\\\mathcal{O}_X$-Modules).**
        Let $(X, \\\\mathcal{O}_X)$ be a ringed space and $\\\\mathcal{F}, \\\\mathcal{G}
        \\\\in \\\\mathfrak{Mod}(X)$.\\n1. The kernel, image, and cokernel of a morphism
        $\\\\varphi: \\\\mathcal{F} \\\\to \\\\mathcal{G}$ in $\\\\mathfrak{Mod}(X)$
        are naturally $\\\\mathcal{O}_X$-modules.\\n2. The *sheaf Hom*, denoted $\\\\mathcal{H}om_{\\\\mathcal{O}_X}(\\\\mathcal{F},
        \\\\mathcal{G})$, is the presheaf $U \\\\mapsto \\\\operatorname{Hom}_{\\\\mathcal{O}_X|_U}(\\\\mathcal{F}|_U,
        \\\\mathcal{G}|_U)$, which is readily verified to be a sheaf of $\\\\mathcal{O}_X$-modules.\\n3.
        The *tensor product* $\\\\mathcal{F} \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{G}$
        is the sheafification of the presheaf $U \\\\mapsto \\\\mathcal{F}(U) \\\\otimes_{\\\\mathcal{O}_X(U)}
        \\\\mathcal{G}(U)$. For every point $P \\\\in X$, $(\\\\mathcal{F} \\\\otimes_{\\\\mathcal{O}_X}
        \\\\mathcal{G})_P \\\\cong \\\\mathcal{F}_P \\\\otimes_{\\\\mathcal{O}_{X,P}}
        \\\\mathcal{G}_P$.\\n4. If $f: (X, \\\\mathcal{O}_X) \\\\to (Y, \\\\mathcal{O}_Y)$
        is a morphism of ringed spaces, then for any $\\\\mathcal{O}_X$-module $\\\\mathcal{F}$,
        $f_* \\\\mathcal{F}$ is an $f_* \\\\mathcal{O}_X$-module, and hence via $f^\\\\sharp:
        \\\\mathcal{O}_Y \\\\to f_* \\\\mathcal{O}_X$, $f_* \\\\mathcal{F}$ is an
        $\\\\mathcal{O}_Y$-module.\\n5. For any $\\\\mathcal{O}_Y$-module $\\\\mathcal{G}$,
        the topological inverse image $f^{-1}\\\\mathcal{G}$ is an $f^{-1}\\\\mathcal{O}_Y$-module,
        not an $\\\\mathcal{O}_X$-module. We define the *pullback of $\\\\mathcal{O}_Y$-modules*,
        denoted $f^* \\\\mathcal{G}$, by\\n$$f^* \\\\mathcal{G} = f^{-1}\\\\mathcal{G}
        \\\\otimes_{f^{-1}\\\\mathcal{O}_Y} \\\\mathcal{O}_X.$$\\nBy combining the
        adjunction of $f^{-1}$ and $f_*$ (Proposition 2.3.4) with the tensor-Hom adjunction,
        $f^*$ is left adjoint to $f_*$ on categories of modules:\\n$$\\\\operatorname{Hom}_{\\\\mathcal{O}_X}(f^*\\\\mathcal{G},
        \\\\mathcal{F}) \\\\xrightarrow{\\\\sim} \\\\operatorname{Hom}_{\\\\mathcal{O}_Y}(\\\\mathcal{G},
        f_*\\\\mathcal{F}).$$\\n\\nNow let $A$ be a ring, $X = \\\\operatorname{Spec}
        A$, and let $M$ be an $A$-module. Exactly parallel to the construction of
        $\\\\mathcal{O}_{\\\\operatorname{Spec} A}$ in Definition 3.1.5, we construct
        an $\\\\mathcal{O}_X$-module $\\\\widetilde{M}$ on $X = \\\\operatorname{Spec}
        A$:\\n\\n**Definition 5.1.3 (The Sheaf $\\\\widetilde{M}$).** For each open
        subset $U \\\\subseteq \\\\operatorname{Spec} A$, we define $\\\\widetilde{M}(U)$
        to be the set of all functions $s: U \\\\to \\\\bigsqcup_{\\\\mathfrak{p}
        \\\\in U} M_\\\\mathfrak{p}$ such that $s(\\\\mathfrak{p}) \\\\in M_\\\\mathfrak{p}$
        for all $\\\\mathfrak{p} \\\\in U$, and locally on a neighborhood $V \\\\subseteq
        U$ of each $\\\\mathfrak{p} \\\\in U$, there exist $m \\\\in M$ and $f \\\\in
        A$ such that $V \\\\subseteq D(f)$ and $s(\\\\mathfrak{q}) = m/f \\\\in M_\\\\mathfrak{q}$
        for all $\\\\mathfrak{q} \\\\in V$.\\n\\n**Proposition 5.1.4.** Let $A$ be
        a ring, $X = \\\\operatorname{Spec} A$, and $M$ an $A$-module. Then $\\\\widetilde{M}$
        is an $\\\\mathcal{O}_X$-module satisfying:\\n1. For each $\\\\mathfrak{p}
        \\\\in X$, the stalk $(\\\\widetilde{M})_\\\\mathfrak{p}$ is canonically isomorphic
        to $M_\\\\mathfrak{p}$ as an $A_\\\\mathfrak{p}$-module.\\n2. For each $f
        \\\\in A$, $\\\\widetilde{M}(D(f)) \\\\cong M_f$ as an $A_f$-module; in particular,
        $\\\\Gamma(X, \\\\widetilde{M}) \\\\cong M$.\\n3. The functor $M \\\\mapsto
        \\\\widetilde{M}$ from $\\\\mathfrak{Mod}(A)$ to $\\\\mathfrak{Mod}(X)$ is
        an exact, fully faithful functor that commutes with tensor products ($\\\\widetilde{M
        \\\\otimes_A N} \\\\cong \\\\widetilde{M} \\\\otimes_{\\\\mathcal{O}_X} \\\\widetilde{N}$)
        and arbitrary direct sums.\\n4. If $\\\\varphi: A \\\\to B$ is a ring homomorphism
        with $f: \\\\operatorname{Spec} B \\\\to \\\\operatorname{Spec} A$, then for
        any $B$-module $N$, $f_*(\\\\widetilde{N}) \\\\cong \\\\widetilde{N_A}$ (where
        $N_A$ is $N$ viewed as an $A$-module), and for any $A$-module $M$, $f^*(\\\\widetilde{M})
        \\\\cong \\\\widetilde{M \\\\otimes_A B}$.\\n\\n*Proof.* The proofs of (1)
        and (2) are verbatim repetitions of the proof of Theorem 3.2.1, replacing
        $a \\\\in A$ by $m \\\\in M$. For (3), exactness follows because a sequence
        of $A$-modules $M' \\\\to M \\\\to M''$ is exact if and only if $M'_\\\\mathfrak{p}
        \\\\to M_\\\\mathfrak{p} \\\\to M''_\\\\mathfrak{p}$ is exact for all $\\\\mathfrak{p}
        \\\\in \\\\operatorname{Spec} A$, which by Proposition 2.3.2 is equivalent
        to exactness of $\\\\widetilde{M'} \\\\to \\\\widetilde{M} \\\\to \\\\widetilde{M''}$.
        Full faithfulness $\\\\operatorname{Hom}_A(M, N) \\\\cong \\\\operatorname{Hom}_{\\\\mathcal{O}_X}(\\\\widetilde{M},
        \\\\widetilde{N})$ follows because any sheaf morphism $\\\\widetilde{M} \\\\to
        \\\\widetilde{N}$ induces on global sections an $A$-module map $M \\\\to N$
        that determines the localizations $M_\\\\mathfrak{p} \\\\to N_\\\\mathfrak{p}$
        on all stalks. Tensor products and direct sums commute with localization,
        yielding the remaining assertions of (3) and (4). $\\\\blacksquare$\\n\\n**Definition
        5.1.5.** Let $(X, \\\\mathcal{O}_X)$ be a scheme, and let $\\\\mathcal{F}$
        be an $\\\\mathcal{O}_X$-module.\\n1. $\\\\mathcal{F}$ is *quasi-coherent*
        if $X$ can be covered by affine open subsets $U_i = \\\\operatorname{Spec}
        A_i$ such that for each $i$, there exists an $A_i$-module $M_i$ with $\\\\mathcal{F}|_{U_i}
        \\\\cong \\\\widetilde{M_i}$.\\n2. $\\\\mathcal{F}$ is *coherent* if $X$ can
        be covered by affine open subsets $U_i = \\\\operatorname{Spec} A_i$ such
        that for each $i$, there exists a *finitely generated* $A_i$-module $M_i$
        with $\\\\mathcal{F}|_{U_i} \\\\cong \\\\widetilde{M_i}$. (On non-Noetherian
        schemes, one ordinarily requires coherent sheaves to be finitely presented,
        but on locally Noetherian schemes\u2014which we assume whenever discussing
        coherent sheaves\u2014finitely generated modules are automatically finitely
        presented).\\n\\n### 5.2 Classification of Quasi-Coherent Sheaves on $\\\\operatorname{Spec}
        A$\\n\\nWe now prove that on an affine scheme $X = \\\\operatorname{Spec}
        A$, *every* quasi-coherent sheaf is globally of the form $\\\\widetilde{M}$
        for a unique $A$-module $M$. The key tool is an important extension lemma
        for sections over principal open subsets.\\n\\n**Lemma 5.2.1.** Let $X$ be
        a scheme, $\\\\mathcal{F}$ a quasi-coherent $\\\\mathcal{O}_X$-module, and
        $f \\\\in \\\\Gamma(X, \\\\mathcal{O}_X)$ a global section of $\\\\mathcal{O}_X$.
        Define $X_f = \\\\{x \\\\in X \\\\mid f_x \\\\notin \\\\mathfrak{m}_x \\\\subseteq
        \\\\mathcal{O}_{X,x}\\\\}$ (which is an open subset of $X$ whose intersection
        with any affine open $U = \\\\operatorname{Spec} A$ is $D(f|_U)$). Assume
        $X$ is quasi-compact and separated (for instance, $X = \\\\operatorname{Spec}
        A$ is affine).\\n1. Let $s \\\\in \\\\Gamma(X, \\\\mathcal{F})$ be a global
        section whose restriction $s|_{X_f} = 0$. Then there exists an integer $n
        \\\\ge 1$ such that $f^n s = 0$ in $\\\\Gamma(X, \\\\mathcal{F})$.\\n2. Let
        $t \\\\in \\\\Gamma(X_f, \\\\mathcal{F})$ be a section over $X_f$. Then there
        exists an integer $n \\\\ge 1$ such that $f^n t$ extends to a global section
        $s \\\\in \\\\Gamma(X, \\\\mathcal{F})$ (meaning $s|_{X_f} = f^n t$).\\n\\n*Proof.*
        Cover $X$ by finitely many affine open subsets $U_i = \\\\operatorname{Spec}
        A_i$ ($i = 1, \\\\dots, r$) such that $\\\\mathcal{F}|_{U_i} \\\\cong \\\\widetilde{M_i}$
        for some $A_i$-module $M_i$. Note that $U_i \\\\cap X_f = D(f_i)$, where $f_i
        = f|_{U_i} \\\\in A_i$, and $\\\\mathcal{F}(U_i \\\\cap X_f) \\\\cong (M_i)_{f_i}$.\\n\\n(1)
        For each $i = 1, \\\\dots, r$, the section $s_i = s|_{U_i} \\\\in M_i$ maps
        to $0$ in $(M_i)_{f_i} = \\\\mathcal{F}(U_i \\\\cap X_f)$. By definition of
        module localization, there exists an integer $n_i \\\\ge 1$ such that $f_i^{n_i}
        s_i = 0$ in $M_i$. Letting $n = \\\\max(n_1, \\\\dots, n_r)$, we have $(f^n
        s)|_{U_i} = f_i^n s_i = 0$ for all $i = 1, \\\\dots, r$. By the Locality Axiom
        for the sheaf $\\\\mathcal{F}$, $f^n s = 0$ in $\\\\Gamma(X, \\\\mathcal{F})$.\\n\\n(2)
        For each $i = 1, \\\\dots, r$, the restriction $t|_{U_i \\\\cap X_f} \\\\in
        \\\\mathcal{F}(D(f_i)) = (M_i)_{f_i}$ can be written as a fraction $m_i /
        f_i^{n_i}$ for some $m_i \\\\in M_i$ and $n_i \\\\ge 1$. Choosing $N = \\\\max(n_1,
        \\\\dots, n_r)$ and replacing $m_i$ by $f_i^{N - n_i} m_i$, we have a section
        $m_i \\\\in \\\\mathcal{F}(U_i)$ for each $i$ such that $m_i|_{U_i \\\\cap
        X_f} = (f^N t)|_{U_i \\\\cap X_f}$.\\n\\nNow consider the overlaps $U_i \\\\cap
        U_j$. Since $X$ is separated (or affine), $U_i \\\\cap U_j$ is quasi-compact
        (indeed, if $X$ is affine, $U_i$ can be chosen as basic open sets $D(g_i)$,
        so $U_i \\\\cap U_j = D(g_i g_j)$ is affine!). On $U_i \\\\cap U_j$, the difference
        $m_i|_{U_i \\\\cap U_j} - m_j|_{U_i \\\\cap U_j} \\\\in \\\\mathcal{F}(U_i
        \\\\cap U_j)$ vanishes when restricted to $(U_i \\\\cap U_j)_f = U_i \\\\cap
        U_j \\\\cap X_f$. Applying Part (1) to the quasi-compact open set $U_i \\\\cap
        U_j$, there exists an integer $k_{ij} \\\\ge 1$ such that $f^{k_{ij}}(m_i
        - m_j) = 0$ on $U_i \\\\cap U_j$. Letting $k = \\\\max_{i,j} k_{ij}$, the
        sections $f^k m_i \\\\in \\\\mathcal{F}(U_i)$ agree on all overlaps $U_i \\\\cap
        U_j$:\\n$$(f^k m_i)|_{U_i \\\\cap U_j} = (f^k m_j)|_{U_i \\\\cap U_j}.$$\\nBy
        the Gluing Axiom for $\\\\mathcal{F}$, there exists a global section $s \\\\in
        \\\\Gamma(X, \\\\mathcal{F})$ such that $s|_{U_i} = f^k m_i$ for all $i$.
        Then on each $U_i \\\\cap X_f$, $s|_{U_i \\\\cap X_f} = (f^{N+k} t)|_{U_i
        \\\\cap X_f}$, so $s|_{X_f} = f^{N+k} t$. $\\\\blacksquare$\\n\\n**Theorem
        5.2.2.** Let $A$ be a ring and $X = \\\\operatorname{Spec} A$. An $\\\\mathcal{O}_X$-module
        $\\\\mathcal{F}$ is quasi-coherent if and only if $\\\\mathcal{F} \\\\cong
        \\\\widetilde{M}$ for some $A$-module $M$ (namely $M = \\\\Gamma(X, \\\\mathcal{F})$).
        If $A$ is Noetherian, $\\\\mathcal{F}$ is coherent if and only if $\\\\mathcal{F}
        \\\\cong \\\\widetilde{M}$ for a finitely generated $A$-module $M$. Consequently,
        the functor $M \\\\mapsto \\\\widetilde{M}$ defines an equivalence of categories
        between $\\\\mathfrak{Mod}(A)$ and the category $\\\\mathfrak{Qco}(X)$ of
        quasi-coherent sheaves on $\\\\operatorname{Spec} A$ (and when $A$ is Noetherian,
        between finitely generated $A$-modules and $\\\\mathfrak{Coh}(X)$).\\n\\n*Proof.*
        Clearly $\\\\widetilde{M}$ is quasi-coherent. Conversely, suppose $\\\\mathcal{F}$
        is a quasi-coherent sheaf on $X = \\\\operatorname{Spec} A$, and let $M =
        \\\\Gamma(X, \\\\mathcal{F})$, which is an $A$-module. For every $f \\\\in
        A$, Lemma 5.2.1(1) and (2) applied to $X = \\\\operatorname{Spec} A$ and $X_f
        = D(f)$ translate directly into the statement that the natural $A_f$-module
        homomorphism\\n$$M_f \\\\longrightarrow \\\\mathcal{F}(D(f)), \\\\quad \\\\frac{s}{f^n}
        \\\\longmapsto f^{-n} (s|_{D(f)})$$\\nis both injective (by Lemma 5.2.1(1))
        and surjective (by Lemma 5.2.1(2))! Since $\\\\widetilde{M}(D(f)) = M_f$,
        we have natural isomorphisms $\\\\widetilde{M}(D(f)) \\\\xrightarrow{\\\\sim}
        \\\\mathcal{F}(D(f))$ for all basic open subsets $D(f) \\\\subseteq \\\\operatorname{Spec}
        A$, commuting with all restriction maps $D(fg) \\\\hookrightarrow D(f)$. By
        Proposition 2.3.5(1) (sheaves on a basis), this extends to an isomorphism
        of $\\\\mathcal{O}_X$-modules $\\\\widetilde{M} \\\\xrightarrow{\\\\sim} \\\\mathcal{F}$.
        If $A$ is Noetherian and $\\\\mathcal{F}$ is coherent, covering $\\\\operatorname{Spec}
        A$ by finitely many $D(g_i)$ on which $M_{g_i}$ is a finitely generated $A_{g_i}$-module
        implies (just as in the proof of Proposition 4.1.2) that $M$ is a finitely
        generated $A$-module. $\\\\blacksquare$\\n\\n**Corollary 5.2.3.** Let $X$
        be an arbitrary scheme. An $\\\\mathcal{O}_X$-module $\\\\mathcal{F}$ is quasi-coherent
        (resp. coherent, if $X$ is locally Noetherian) if and only if for *every*
        affine open subset $U = \\\\operatorname{Spec} A \\\\subseteq X$, $\\\\mathcal{F}|_U
        \\\\cong \\\\widetilde{M}$ for some $A$-module (resp. finitely generated $A$-module)
        $M$. Moreover, the kernel, cokernel, and image of any morphism of quasi-coherent
        (resp. coherent) sheaves on $X$ are again quasi-coherent (resp. coherent).\\n\\n*Proof.*
        If $\\\\mathcal{F}$ is quasi-coherent on $X$, then for any affine open $U
        = \\\\operatorname{Spec} A \\\\subseteq X$, $\\\\mathcal{F}|_U$ is a quasi-coherent
        sheaf on $\\\\operatorname{Spec} A$, hence isomorphic to $\\\\widetilde{\\\\mathcal{F}(U)}$
        by Theorem 5.2.2. Exactness of $M \\\\mapsto \\\\widetilde{M}$ (Proposition
        5.1.4(3)) immediately shows that kernels, images, and cokernels of morphisms
        between sheaves of the form $\\\\widetilde{M}$ and $\\\\widetilde{N}$ on $\\\\operatorname{Spec}
        A$ are again of the form $\\\\widetilde{\\\\ker}$, $\\\\widetilde{\\\\operatorname{im}}$,
        and $\\\\widetilde{\\\\operatorname{coker}}$. $\\\\blacksquare$\\n\\n### 5.3
        Weil Divisors, Cartier Divisors, and the Picard Group\\n\\nIn Chapter 1, we
        saw by Krull's Principal Ideal Theorem that the zero locus of a single equation
        on an $n$-dimensional variety has codimension $1$. Formal linear combinations
        of codimension $1$ subvarieties\u2014called *divisors*\u2014provide the fundamental
        bridge between projective embeddings, rational functions, and line bundles.\\n\\n**Definition
        5.3.1 (Weil Divisors).** Let $X$ be a Noetherian integral separated scheme.
        We say that $X$ is *regular in codimension one* if every local ring $\\\\mathcal{O}_{X,
        x}$ of dimension $1$ is a regular local ring (which in dimension $1$ is equivalent
        to saying $\\\\mathcal{O}_{X, x}$ is a *discrete valuation ring*, or DVR:
        a Principal Ideal Domain with a unique non-zero prime ideal $\\\\mathfrak{m}_x
        = (t)$).\\n\\nA *prime divisor* on $X$ is a closed integral subscheme $Y \\\\subseteq
        X$ of codimension $1$ (meaning the local ring $\\\\mathcal{O}_{X, \\\\eta_Y}$
        of $X$ at the generic point $\\\\eta_Y$ of $Y$ has Krull dimension $1$). A
        *Weil divisor* on $X$ is a formal $\\\\mathbb{Z}$-linear combination of prime
        divisors:\\n$$D = \\\\sum_{Y} n_Y Y \\\\quad (n_Y \\\\in \\\\mathbb{Z}, \\\\text{
        where } n_Y = 0 \\\\text{ for all but finitely many } Y).$$\\nThe group of
        all Weil divisors on $X$ is the free abelian group on the prime divisors,
        denoted $\\\\operatorname{Div}(X)$. A Weil divisor $D = \\\\sum n_Y Y$ is
        called *effective* (written $D \\\\ge 0$) if $n_Y \\\\ge 0$ for all $Y$.\\n\\nLet
        $Y \\\\subseteq X$ be a prime divisor with generic point $\\\\eta_Y$. Since
        $X$ is regular in codimension one, $\\\\mathcal{O}_{X, \\\\eta_Y}$ is a discrete
        valuation ring with fraction field $K(X)$ (the function field of $X$). Let
        $v_Y: K(X)^\\\\times \\\\to \\\\mathbb{Z}$ be the associated discrete valuation
        (sending $f \\\\in \\\\mathcal{O}_{X, \\\\eta_Y} \\\\setminus \\\\{0\\\\}$
        to the unique integer $k \\\\ge 0$ such that $(f) = \\\\mathfrak{m}_{\\\\eta_Y}^k$).
        If $v_Y(f) \\u003e 0$, we say $f$ has a *zero* of order $v_Y(f)$ along $Y$;
        if $v_Y(f) \\u003c 0$, we say $f$ has a *pole* of order $-v_Y(f)$ along $Y$.\\n\\n**Lemma
        5.3.2.** Let $X$ be a Noetherian integral separated scheme that is regular
        in codimension one, and let $f \\\\in K(X)^\\\\times$ be a non-zero rational
        function. Then $v_Y(f) = 0$ for all but finitely many prime divisors $Y \\\\subseteq
        X$.\\n\\n*Proof.* Choose a non-empty affine open subset $U = \\\\operatorname{Spec}
        A \\\\subseteq X$ on which $f \\\\in A$ and $f^{-1} \\\\in A$ (for instance,
        take any affine open $\\\\operatorname{Spec} B$, write $f = a/b$ with $a,
        b \\\\in B \\\\setminus \\\\{0\\\\}$, and set $U = D(ab) = \\\\operatorname{Spec}
        B_{ab}$). Then for every prime divisor $Y$ meeting $U$ (so $\\\\eta_Y \\\\in
        U$), both $f$ and $f^{-1}$ lie in $\\\\mathcal{O}_{X, \\\\eta_Y}$, which forces
        $f \\\\in \\\\mathcal{O}_{X, \\\\eta_Y}^\\\\times$ and hence $v_Y(f) = 0$.
        On the other hand, the complement $Z = X \\\\setminus U$ is a proper closed
        subset of the Noetherian space $X$, hence has only finitely many irreducible
        components $Z_1, \\\\dots, Z_r$, each of codimension $\\\\ge 1$ in $X$. Any
        prime divisor $Y$ not meeting $U$ must be contained in $Z$, hence must be
        equal to one of the finitely many components $Z_i$ of codimension $1$. $\\\\blacksquare$\\n\\n**Definition
        5.3.3.** For any $f \\\\in K(X)^\\\\times$, the *principal Weil divisor* associated
        to $f$ is\\n$$(f) = \\\\sum_{Y} v_Y(f) Y \\\\in \\\\operatorname{Div}(X).$$\\nBecause
        each $v_Y: K(X)^\\\\times \\\\to \\\\mathbb{Z}$ is a group homomorphism, the
        map $f \\\\mapsto (f): K(X)^\\\\times \\\\to \\\\operatorname{Div}(X)$ is
        a group homomorphism; its image is the subgroup of principal divisors. Two
        Weil divisors $D, D' \\\\in \\\\operatorname{Div}(X)$ are said to be *linearly
        equivalent* (written $D \\\\sim D'$) if $D - D' = (f)$ for some $f \\\\in
        K(X)^\\\\times$. The quotient group of all Weil divisors modulo principal
        divisors is called the *(Weil) Divisor Class Group* of $X$, denoted $\\\\operatorname{Cl}(X)$.\\n\\n**Theorem
        5.3.4.** Let $A$ be a Noetherian integral domain. Then $A$ is a Unique Factorization
        Domain (UFD) if and only if $X = \\\\operatorname{Spec} A$ is regular in codimension
        one and $\\\\operatorname{Cl}(X) = 0$. In particular, $\\\\operatorname{Cl}(\\\\mathbb{A}^n_k)
        = 0$, and $\\\\operatorname{Cl}(\\\\mathbb{P}^n_k) \\\\cong \\\\mathbb{Z}$
        generated by the class of a hyperplane $H = V_+(x_0) \\\\subseteq \\\\mathbb{P}^n_k$.\\n\\n*Proof.*
        Recall from commutative algebra that a Noetherian domain $A$ is a UFD if and
        only if every prime ideal $\\\\mathfrak{p}$ of height $1$ is principal. If
        every height $1$ prime $\\\\mathfrak{p}$ is principal, say $\\\\mathfrak{p}
        = (t)$, then $A_\\\\mathfrak{p}$ has principal maximal ideal $(t)$, so $A_\\\\mathfrak{p}$
        is a DVR (hence $X$ is regular in codimension one), and the prime divisor
        $Y = V(\\\\mathfrak{p})$ is the principal divisor $(t)$, so $\\\\operatorname{Cl}(X)
        = 0$. Conversely, if $X$ is regular in codimension one and $\\\\operatorname{Cl}(X)
        = 0$, let $\\\\mathfrak{p}$ be a prime ideal of height $1$ and $Y = V(\\\\mathfrak{p})$.
        Since $\\\\operatorname{Cl}(X) = 0$, $Y = (f)$ for some $f \\\\in K(X)^\\\\times$.
        Then for every height $1$ prime $\\\\mathfrak{q}$ of $A$, $v_\\\\mathfrak{q}(f)
        \\\\ge 0$, which for a Noetherian domain regular in codimension one (or normal:
        $A = \\\\bigcap_{\\\\operatorname{ht} \\\\mathfrak{q} = 1} A_\\\\mathfrak{q}$,
        which holds here because $f \\\\in A_\\\\mathfrak{p}$ for all height $1$ primes
        and any prime ideal associated to a principal ideal has height $1$ if $f$
        were not in $A$; more directly, since $Y = (f)$, for any $g \\\\in \\\\mathfrak{p}$,
        $v_\\\\mathfrak{q}(g/f) \\\\ge 0$ for all height $1$ primes, and checking
        locally shows $(f) = \\\\mathfrak{p}$ in $A$) proves $\\\\mathfrak{p} = (f)$
        is principal.\\n\\nFor $\\\\mathbb{P}^n_k$, let $H = V_+(x_0)$ be a hyperplane.
        Notice that $\\\\mathbb{P}^n_k \\\\setminus H = U_0 \\\\cong \\\\mathbb{A}^n_k$.
        Defining the degree of a prime divisor $Y = V_+(\\\\mathfrak{p})$ to be the
        degree of the generator $F \\\\in k[x_0, \\\\dots, x_n]$ of the height $1$
        homogeneous prime ideal $\\\\mathfrak{p} = (F)$, any rational function $g/h
        \\\\in K(\\\\mathbb{P}^n_k)^\\\\times$ (where $\\\\deg g = \\\\deg h$) has
        $\\\\deg((g/h)) = \\\\deg g - \\\\deg h = 0$, and if $F \\\\in S_d$, then
        $(F/x_0^d) = Y - d H$, so $Y \\\\sim d H$. Thus $\\\\deg: \\\\operatorname{Cl}(\\\\mathbb{P}^n_k)
        \\\\xrightarrow{\\\\sim} \\\\mathbb{Z}$. $\\\\blacksquare$\\n\\nOn singular
        schemes (or non-reduced schemes), Weil divisors cannot always be pulled back
        under morphisms or intersected with curves. The sheaf-theoretic counterpart
        to Weil divisors is the notion of *Cartier divisors* and *invertible sheaves*.\\n\\n**Definition
        5.3.5 (Cartier Divisors and the Picard Group).** Let $X$ be a scheme. For
        each open subset $U \\\\subseteq X$, let $S(U) \\\\subseteq \\\\mathcal{O}_X(U)$
        be the multiplicative subset of elements whose germs at all $x \\\\in U$ are
        non-zero-divisors in $\\\\mathcal{O}_{X,x}$. Let $\\\\mathcal{K}_X$ be the
        sheafification of the presheaf of total quotient rings $U \\\\mapsto S(U)^{-1}\\\\mathcal{O}_X(U)$,
        called the *sheaf of total quotient rings of $X$* (if $X$ is an integral scheme,
        $\\\\mathcal{K}_X$ is simply the constant sheaf $\\\\underline{K(X)}$ of the
        function field $K(X)$!). Let $\\\\mathcal{K}_X^*$ be the sheaf of invertible
        elements (units) of $\\\\mathcal{K}_X$, and let $\\\\mathcal{O}_X^*$ be the
        sheaf of units of $\\\\mathcal{O}_X$.\\n\\nA *Cartier divisor* on $X$ is a
        global section of the quotient sheaf $\\\\mathcal{K}_X^* / \\\\mathcal{O}_X^*$.
        Explicitly, by definition of the quotient sheaf, a Cartier divisor on $X$
        is given by an open cover $\\\\{U_i\\\\}_{i \\\\in I}$ of $X$ and sections
        $f_i \\\\in \\\\Gamma(U_i, \\\\mathcal{K}_X^*)$ such that on every overlap
        $U_i \\\\cap U_j$,\\n$$\\\\frac{f_i}{f_j} \\\\in \\\\Gamma(U_i \\\\cap U_j,
        \\\\mathcal{O}_X^*).$$\\nA Cartier divisor is *principal* if it lies in the
        image of the natural map $\\\\Gamma(X, \\\\mathcal{K}_X^*) \\\\to \\\\Gamma(X,
        \\\\mathcal{K}_X^* / \\\\mathcal{O}_X^*)$. Two Cartier divisors are *linearly
        equivalent* if their difference (written additively) is principal; the group
        of Cartier divisors modulo principal Cartier divisors is the *Cartier divisor
        class group* $\\\\operatorname{CaCl}(X)$.\\n\\n**Definition 5.3.6.** Let $(X,
        \\\\mathcal{O}_X)$ be a scheme. An $\\\\mathcal{O}_X$-module $\\\\mathcal{E}$
        is called *locally free of rank $r$* if there exists an open cover $\\\\{U_i\\\\}$
        of $X$ such that $\\\\mathcal{E}|_{U_i} \\\\cong \\\\mathcal{O}_{U_i}^{\\\\oplus
        r}$ for each $i$. A locally free $\\\\mathcal{O}_X$-module of rank $1$ is
        called an *invertible sheaf* (or *line bundle*).\\n\\nIf $\\\\mathcal{L}$
        and $\\\\mathcal{M}$ are invertible sheaves on $X$, then $\\\\mathcal{L} \\\\otimes_{\\\\mathcal{O}_X}
        \\\\mathcal{M}$ is again an invertible sheaf, and the dual sheaf $\\\\mathcal{L}^\\\\vee
        = \\\\mathcal{H}om_{\\\\mathcal{O}_X}(\\\\mathcal{L}, \\\\mathcal{O}_X)$ is
        an invertible sheaf satisfying a canonical isomorphism $\\\\mathcal{L} \\\\otimes_{\\\\mathcal{O}_X}
        \\\\mathcal{L}^\\\\vee \\\\xrightarrow{\\\\sim} \\\\mathcal{O}_X$. Therefore,
        the set of isomorphism classes of invertible sheaves on $X$ forms an abelian
        group under $\\\\otimes_{\\\\mathcal{O}_X}$, with identity element $\\\\mathcal{O}_X$
        and inverse $\\\\mathcal{L}^{-1} = \\\\mathcal{L}^\\\\vee$. This group is
        called the *Picard group* of $X$, denoted $\\\\operatorname{Pic}(X)$.\\n\\n###
        5.4 Equivalence of Cartier Divisors and Invertible Sheaves\\n\\n**Definition
        5.4.1.** Let $D = \\\\{(U_i, f_i)\\\\}$ be a Cartier divisor on a scheme $X$.
        We define the *sheaf associated to $D$*, denoted $\\\\mathcal{O}_X(D)$ or
        $\\\\mathcal{L}(D)$, to be the sub-$\\\\mathcal{O}_X$-module of $\\\\mathcal{K}_X$
        generated on each $U_i$ by $f_i^{-1}$:\\n$$\\\\mathcal{O}_X(D)|_{U_i} = f_i^{-1}
        \\\\mathcal{O}_{U_i} \\\\subseteq \\\\mathcal{K}_X|_{U_i}.$$\\nNotice that
        on each overlap $U_i \\\\cap U_j$, $f_i / f_j \\\\in \\\\mathcal{O}_X(U_i
        \\\\cap U_j)^*$ is a unit, so $f_i^{-1} \\\\mathcal{O}_{U_i \\\\cap U_j} =
        f_j^{-1} \\\\mathcal{O}_{U_i \\\\cap U_j}$. Thus these local subsheaves coincide
        on all overlaps and define a well-defined subsheaf $\\\\mathcal{O}_X(D) \\\\subseteq
        \\\\mathcal{K}_X$. (The convention of using $f_i^{-1}$ rather than $f_i$ ensures
        that when $D \\\\ge 0$ is an effective divisor\u2014so $f_i \\\\in \\\\mathcal{O}_X(U_i)$\u2014global
        sections $s \\\\in \\\\Gamma(X, \\\\mathcal{O}_X(D)) \\\\subseteq K(X)$ are
        rational functions $s$ such that $s f_i \\\\in \\\\mathcal{O}_X(U_i)$, i.e.,
        functions with poles no worse than $D$, meaning $(s) + D \\\\ge 0$!).\\n\\n**Theorem
        5.4.2.** Let $X$ be a scheme.\\n1. For any Cartier divisor $D$ on $X$, $\\\\mathcal{O}_X(D)$
        is an invertible sheaf on $X$.\\n2. For any two Cartier divisors $D_1, D_2$,
        $\\\\mathcal{O}_X(D_1 + D_2) \\\\cong \\\\mathcal{O}_X(D_1) \\\\otimes_{\\\\mathcal{O}_X}
        \\\\mathcal{O}_X(D_2)$ and $\\\\mathcal{O}_X(-D_1) \\\\cong \\\\mathcal{O}_X(D_1)^\\\\vee$.\\n3.
        $D_1 \\\\sim D_2$ if and only if $\\\\mathcal{O}_X(D_1) \\\\cong \\\\mathcal{O}_X(D_2)$
        as $\\\\mathcal{O}_X$-modules.\\n4. If $X$ is an integral scheme, the map
        $D \\\\mapsto \\\\mathcal{O}_X(D)$ induces an isomorphism of groups\\n$$\\\\operatorname{CaCl}(X)
        \\\\xrightarrow{\\\\sim} \\\\operatorname{Pic}(X).$$\\n5. Furthermore, if
        $X$ is a Noetherian, integral, separated, *locally factorial* scheme (meaning
        every local ring $\\\\mathcal{O}_{X, x}$ is a Unique Factorization Domain,
        which holds whenever $X$ is regular/nonsingular), then every Weil divisor
        is locally principal, furnishing canonical isomorphisms\\n$$\\\\operatorname{Cl}(X)
        \\\\xleftarrow{\\\\sim} \\\\operatorname{CaCl}(X) \\\\xrightarrow{\\\\sim}
        \\\\operatorname{Pic}(X).$$\\n\\n*Proof.* (1) On each $U_i$, since $f_i \\\\in
        \\\\mathcal{K}_X(U_i)^*$ is a non-zero-divisor, multiplication by $f_i^{-1}$
        gives an $\\\\mathcal{O}_{U_i}$-module isomorphism $\\\\mathcal{O}_{U_i} \\\\xrightarrow{\\\\sim}
        f_i^{-1}\\\\mathcal{O}_{U_i} = \\\\mathcal{O}_X(D)|_{U_i}$, so $\\\\mathcal{O}_X(D)$
        is locally free of rank $1$.\\n\\n(2) Refining the open covers, if $D_1 =
        \\\\{(U_i, f_i)\\\\}$ and $D_2 = \\\\{(U_i, g_i)\\\\}$, then $D_1 + D_2 =
        \\\\{(U_i, f_i g_i)\\\\}$. Multiplication inside $\\\\mathcal{K}_X$ sends
        $f_i^{-1} \\\\otimes g_i^{-1} \\\\mapsto (f_i g_i)^{-1}$, defining an isomorphism
        $\\\\mathcal{O}_X(D_1) \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{O}_X(D_2)
        \\\\xrightarrow{\\\\sim} \\\\mathcal{O}_X(D_1 + D_2)$.\\n\\n(3) By (2), it
        suffices to show $D$ is principal if and only if $\\\\mathcal{O}_X(D) \\\\cong
        \\\\mathcal{O}_X$. If $D = (f)$ for a global section $f \\\\in \\\\Gamma(X,
        \\\\mathcal{K}_X^*)$, then $\\\\mathcal{O}_X(D) = f^{-1}\\\\mathcal{O}_X \\\\cong
        \\\\mathcal{O}_X$ via multiplication by $f^{-1}$. Conversely, if $\\\\varphi:
        \\\\mathcal{O}_X \\\\xrightarrow{\\\\sim} \\\\mathcal{O}_X(D) \\\\subseteq
        \\\\mathcal{K}_X$ is an isomorphism, let $g = \\\\varphi(1) \\\\in \\\\Gamma(X,
        \\\\mathcal{O}_X(D)) \\\\subseteq \\\\Gamma(X, \\\\mathcal{K}_X)$. On each
        $U_i$, $g$ must generate $\\\\mathcal{O}_X(D)|_{U_i} = f_i^{-1}\\\\mathcal{O}_{U_i}$,
        so $g = u_i f_i^{-1}$ for some unit $u_i \\\\in \\\\mathcal{O}_X(U_i)^*$.
        Thus $f = g^{-1} \\\\in \\\\Gamma(X, \\\\mathcal{K}_X^*)$ satisfies $f|_{U_i}
        = u_i^{-1} f_i$, meaning $D$ is represented by the global section $f$ and
        is therefore principal!\\n\\n(4) Suppose $X$ is integral, so $\\\\mathcal{K}_X
        = \\\\underline{K(X)}$ is the constant sheaf of the function field $K(X)$.
        Let $\\\\mathcal{L}$ be any invertible sheaf on $X$. Since $\\\\mathcal{L}$
        is locally free of rank $1$, $\\\\mathcal{L} \\\\otimes_{\\\\mathcal{O}_X}
        \\\\mathcal{K}_X$ is locally isomorphic to $\\\\mathcal{K}_X = \\\\underline{K(X)}$,
        and on any non-empty open $U_0 \\\\subseteq X$ where $\\\\mathcal{L}|_{U_0}
        \\\\cong \\\\mathcal{O}_{U_0}$, we get a trivialization $(\\\\mathcal{L} \\\\otimes
        \\\\mathcal{K}_X)|_{U_0} \\\\cong \\\\underline{K(X)}|_{U_0}$. Since $X$ is
        irreducible and $\\\\underline{K(X)}$ is a constant sheaf, any section of
        $\\\\mathcal{L} \\\\otimes \\\\mathcal{K}_X$ over $U_0$ extends uniquely to
        the whole constant sheaf $\\\\underline{K(X)}$ on $X$! Thus we can embed $\\\\mathcal{L}
        \\\\hookrightarrow \\\\mathcal{L} \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{K}_X
        \\\\cong \\\\underline{K(X)}$ as an invertible subsheaf of $\\\\mathcal{K}_X$.
        Choose an open cover $\\\\{U_i\\\\}$ trivializing $\\\\mathcal{L}$, and let
        $g_i \\\\in K(X)^\\\\times$ be a generator of $\\\\mathcal{L}|_{U_i} \\\\subseteq
        \\\\underline{K(X)}|_{U_i}$. Letting $f_i = g_i^{-1} \\\\in K(X)^\\\\times$,
        on $U_i \\\\cap U_j$ both $f_i^{-1}$ and $f_j^{-1}$ generate $\\\\mathcal{L}|_{U_i
        \\\\cap U_j}$, so $f_i / f_j \\\\in \\\\mathcal{O}_X(U_i \\\\cap U_j)^*$.
        Thus $D = \\\\{(U_i, f_i)\\\\}$ is a Cartier divisor with $\\\\mathcal{O}_X(D)
        = \\\\mathcal{L}$.\\n\\n(5) Suppose every local ring $\\\\mathcal{O}_{X, x}$
        is a UFD. Since a localization of a UFD at a height $1$ prime is a DVR, $X$
        is regular in codimension one. For any Cartier divisor $D = \\\\{(U_i, f_i)\\\\}$,
        we associate a Weil divisor $[D] = \\\\sum_Y n_Y Y$ by choosing for each prime
        divisor $Y$ an open set $U_i$ meeting $Y$ and setting $n_Y = v_Y(f_i)$ (this
        is well-defined because $f_i/f_j \\\\in \\\\mathcal{O}_{X, \\\\eta_Y}^\\\\times$
        has valuation $0$). Since a UFD is integrally closed ($A = \\\\bigcap_{\\\\operatorname{ht}
        \\\\mathfrak{p} = 1} A_\\\\mathfrak{p}$), an element $h \\\\in K(X)^\\\\times$
        has $v_Y(h) = 0$ for all $Y \\\\cap U \\\\ne \\\\emptyset$ if and only if
        $h \\\\in \\\\mathcal{O}_X(U)^*$, proving $D \\\\mapsto [D]$ is injective.
        Finally, to prove surjectivity, let $D = \\\\sum n_Y Y$ be any Weil divisor,
        and let $x \\\\in X$. In the UFD $\\\\mathcal{O}_{X, x}$, each prime divisor
        $Y$ passing through $x$ corresponds to a height $1$ prime ideal $\\\\mathfrak{p}_Y
        \\\\subseteq \\\\mathcal{O}_{X, x}$, which is principal: $\\\\mathfrak{p}_Y
        = (g_Y)$! Setting $f_x = \\\\prod_{x \\\\in Y} g_Y^{n_Y} \\\\in K(X)^\\\\times$,
        the divisor $(f_x) - D$ has no components passing through $x$, hence its support
        is a closed subset of $X$ not containing $x$. On the open neighborhood $U_x
        = X \\\\setminus \\\\operatorname{Supp}((f_x) - D)$ of $x$, we have $(f_x)|_{U_x}
        = D|_{U_x}$. Thus $\\\\{(U_x, f_x)\\\\}_{x \\\\in X}$ is a Cartier divisor
        mapping to $D$. $\\\\blacksquare$\\n\\n### 5.5 Sheaves on Projective Space
        and Twisting Sheaves $\\\\mathcal{O}(n)$\\n\\nJust as modules over a ring
        $A$ give quasi-coherent sheaves on $\\\\operatorname{Spec} A$, graded modules
        over a graded ring $S$ give quasi-coherent sheaves on $\\\\operatorname{Proj}
        S$.\\n\\n**Definition 5.5.1.** Let $S = \\\\bigoplus_{d \\\\ge 0} S_d$ be
        a graded ring, $X = \\\\operatorname{Proj} S$, and let $M = \\\\bigoplus_{d
        \\\\in \\\\mathbb{Z}} M_d$ be a $\\\\mathbb{Z}$-graded $S$-module. We define
        an $\\\\mathcal{O}_X$-module $\\\\widetilde{M}$ on $X = \\\\operatorname{Proj}
        S$ as follows: for each $\\\\mathfrak{p} \\\\in \\\\operatorname{Proj} S$,
        let $M_{(\\\\mathfrak{p})}$ be the group of elements of degree $0$ in the
        homogeneous localization $T^{-1}M$ (where $T$ is the set of homogeneous elements
        of $S$ not in $\\\\mathfrak{p}$). Note that $M_{(\\\\mathfrak{p})}$ is an
        $S_{(\\\\mathfrak{p})}$-module. For each open $U \\\\subseteq X$, $\\\\widetilde{M}(U)$
        is the module of functions $s: U \\\\to \\\\bigsqcup_{\\\\mathfrak{p} \\\\in
        U} M_{(\\\\mathfrak{p})}$ that are locally given on $V \\\\subseteq D_+(f)
        \\\\cap U$ by fractions $m/f^k$ where $m \\\\in M$ is homogeneous with $\\\\deg(m)
        = k \\\\deg(f)$.\\n\\nOn each basic open affine subset $D_+(f) \\\\cong \\\\operatorname{Spec}
        S_{(f)}$ (where $f \\\\in S_+$ is homogeneous), $\\\\widetilde{M}|_{D_+(f)}$
        corresponds under the affine equivalence of Theorem 5.2.2 to the $S_{(f)}$-module
        $M_{(f)}$ of degree-zero elements in $M_f$. In particular, $\\\\widetilde{M}$
        is always a quasi-coherent $\\\\mathcal{O}_X$-module!\\n\\nFor any integer
        $n \\\\in \\\\mathbb{Z}$, we define the *twisted graded module* $M(n)$ by
        shifting the grading by $n$:\\n$$M(n)_d = M_{n+d} \\\\quad \\\\text{for all
        } d \\\\in \\\\mathbb{Z}.$$\\nWe define the *twisting sheaf of Serre* $\\\\mathcal{O}_X(n)$
        on $X = \\\\operatorname{Proj} S$ to be $\\\\widetilde{S(n)}$. For any $\\\\mathcal{O}_X$-module
        $\\\\mathcal{F}$, we define $\\\\mathcal{F}(n) = \\\\mathcal{F} \\\\otimes_{\\\\mathcal{O}_X}
        \\\\mathcal{O}_X(n)$.\\n\\n**Proposition 5.5.2.** Assume that the graded ring
        $S$ is generated as an $S_0$-algebra by $S_1$ (as holds for $S = A[x_0, \\\\dots,
        x_n]$ and any quotient thereof). Let $X = \\\\operatorname{Proj} S$.\\n1.
        For every $n \\\\in \\\\mathbb{Z}$, $\\\\mathcal{O}_X(n)$ is an invertible
        sheaf on $X$.\\n2. For any graded $S$-module $M$ and any $n, m \\\\in \\\\mathbb{Z}$,
        $\\\\widetilde{M(n)} \\\\cong \\\\widetilde{M}(n)$, and in particular $\\\\mathcal{O}_X(n
        + m) \\\\cong \\\\mathcal{O}_X(n) \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{O}_X(m)$.\\n3.
        Let $A$ be a ring and $X = \\\\mathbb{P}^r_A = \\\\operatorname{Proj} A[x_0,
        \\\\dots, x_r]$. Then for every $n \\\\in \\\\mathbb{Z}$, the natural homomorphism
        $S_n \\\\to \\\\Gamma(\\\\mathbb{P}^r_A, \\\\mathcal{O}(n))$ is an isomorphism!
        That is, $\\\\Gamma(\\\\mathbb{P}^r_A, \\\\mathcal{O}(n)) = 0$ for $n \\u003c
        0$, and for $n \\\\ge 0$, $\\\\Gamma(\\\\mathbb{P}^r_A, \\\\mathcal{O}(n))$
        is the free $A$-module of homogeneous polynomials of degree $n$ in $x_0, \\\\dots,
        x_r$.\\n\\n*Proof.* (1) Since $S$ is generated over $S_0$ by $S_1$, $X = \\\\operatorname{Proj}
        S$ is covered by the affine open sets $D_+(f)$ as $f$ ranges over $S_1$. Fix
        $f \\\\in S_1$ (of degree $1$). On $D_+(f) = \\\\operatorname{Spec} S_{(f)}$,
        $\\\\mathcal{O}_X(n)|_{D_+(f)}$ is the sheaf associated to the $S_{(f)}$-module
        $S(n)_{(f)}$, which consists of fractions $a / f^k$ with $a \\\\in S(n)_k
        = S_{n+k}$. Multiplication by $f^n$ defines an $S_{(f)}$-module isomorphism\\n$$S_{(f)}
        \\\\xrightarrow{\\\\sim} S(n)_{(f)}, \\\\quad \\\\frac{b}{f^k} \\\\longmapsto
        \\\\frac{f^n b}{f^k} \\\\quad (\\\\text{where } b \\\\in S_k, \\\\text{ so
        } f^n b \\\\in S_{n+k} = S(n)_k),$$\\nwith inverse $a/f^k \\\\mapsto a/f^{n+k}$.
        Thus $\\\\mathcal{O}_X(n)|_{D_+(f)} \\\\cong \\\\mathcal{O}_{D_+(f)}$ is free
        of rank $1$ on $D_+(f)$, proving $\\\\mathcal{O}_X(n)$ is an invertible sheaf.
        Part (2) follows immediately from this explicit local generator $f^n$ on $D_+(f)$:
        $M_{(f)} \\\\otimes_{S_{(f)}} S(n)_{(f)} \\\\xrightarrow{\\\\sim} M(n)_{(f)}$.\\n\\n(3)
        On $X = \\\\mathbb{P}^r_A = \\\\operatorname{Proj} A[x_0, \\\\dots, x_r]$,
        cover $X$ by $U_i = D_+(x_i)$ for $0 \\\\le i \\\\le r$. By the sheaf axiom,
        a global section $s \\\\in \\\\Gamma(X, \\\\mathcal{O}(n))$ is given by elements
        $s_i \\\\in S(n)_{(x_i)}$ for $0 \\\\le i \\\\le r$ that agree in $S(n)_{(x_i
        x_j)}$ for all $i, j$. Note that $S(n)_{(x_i)} = \\\\bigoplus_{k_i \\\\in
        \\\\mathbb{Z}, \\\\, \\\\sum k_j = n} A x_0^{k_0} \\\\cdots x_r^{k_r}$ where
        $k_j \\\\ge 0$ for all $j \\\\ne i$ (only $x_i$ is allowed to appear with
        a negative exponent $k_i$). Because $x_i$ and $x_j$ are non-zero-divisors
        in the polynomial ring $S$, all localizations $S_{x_i}$ and $S_{x_i x_j}$
        sit inside the single Laurent polynomial ring $S_{x_0 x_1 \\\\cdots x_r} =
        A[x_0^{\\\\pm 1}, \\\\dots, x_r^{\\\\pm 1}]$! Thus $s_0 = s_1 = \\\\dots =
        s_r$ in $A[x_0^{\\\\pm 1}, \\\\dots, x_r^{\\\\pm 1}]$, meaning\\n$$\\\\Gamma(\\\\mathbb{P}^r_A,
        \\\\mathcal{O}(n)) = \\\\bigcap_{i=0}^r S(n)_{(x_i)}.$$\\nA Laurent polynomial
        of total degree $n$ lies in $S(n)_{(x_i)}$ for *every* $i = 0, \\\\dots, r$
        if and only if no variable $x_i$ appears with a negative exponent\u2014that
        is, every exponent $k_i \\\\ge 0$ and $\\\\sum_{i=0}^r k_i = n$. If $n \\u003c
        0$, no such monomials exist, so the intersection is $0$; if $n \\\\ge 0$,
        the intersection is precisely $S_n$. $\\\\blacksquare$\\n\\n---\\n\\n### Exercises
        for Chapter 5\\n\\n**Exercise 5.1 (Projection Formula).** Let $f: (X, \\\\mathcal{O}_X)
        \\\\to (Y, \\\\mathcal{O}_Y)$ be a morphism of ringed spaces, let $\\\\mathcal{F}$
        be an $\\\\mathcal{O}_X$-module, and let $\\\\mathcal{E}$ be a *locally free*
        $\\\\mathcal{O}_Y$-module of finite rank. Prove that there is a natural isomorphism
        of $\\\\mathcal{O}_Y$-modules\\n$$f_*(\\\\mathcal{F} \\\\otimes_{\\\\mathcal{O}_X}
        f^*\\\\mathcal{E}) \\\\cong f_*\\\\mathcal{F} \\\\otimes_{\\\\mathcal{O}_Y}
        \\\\mathcal{E}.$$\\n\\n**Exercise 5.2.** Let $X$ be a Noetherian scheme and
        let $\\\\mathcal{E}$ be a coherent $\\\\mathcal{O}_X$-module. Prove that $\\\\mathcal{E}$
        is locally free of rank $r$ around a point $x \\\\in X$ if and only if the
        stalk $\\\\mathcal{E}_x$ is a free $\\\\mathcal{O}_{X,x}$-module of rank $r$.
        (Hint: Choose $r$ elements in $\\\\mathcal{E}(U)$ whose germs generate $\\\\mathcal{E}_x$,
        forming a morphism $\\\\varphi: \\\\mathcal{O}_U^{\\\\oplus r} \\\\to \\\\mathcal{E}|_U$;
        apply Nakayama's Lemma to the coherent sheaves $\\\\operatorname{coker} \\\\varphi$
        and $\\\\ker \\\\varphi$ at $x$, and use the fact that the support of a coherent
        sheaf is closed).\\n\\n**Exercise 5.3 (The Divisor Class Group of a Quadric
        Cone).** Let $k$ be an algebraically closed field with $\\\\operatorname{char}
        k \\\\ne 2$, and let $X = Z(xy - z^2) \\\\subseteq \\\\mathbb{A}^3_k$ be the
        affine quadric cone.\\n(a) Show that $X$ is normal (and in particular regular
        in codimension one), and that the line $Y = Z(x, z) \\\\subseteq X$ is a prime
        Weil divisor.\\n(b) Notice that $X \\\\setminus Y = D(x) \\\\cong \\\\operatorname{Spec}
        k[x, x^{-1}, z]$ is the spectrum of a UFD. Using the exact sequence $\\\\mathbb{Z}
        \\\\cdot Y \\\\to \\\\operatorname{Cl}(X) \\\\to \\\\operatorname{Cl}(X \\\\setminus
        Y) \\\\to 0$, show that $\\\\operatorname{Cl}(X)$ is cyclic generated by $Y$,
        that $2Y = (x)$ is principal, and that $Y$ itself is not principal (not even
        locally principal at the vertex $(0,0,0)$!). Conclude that $\\\\operatorname{Cl}(X)
        \\\\cong \\\\mathbb{Z}/2\\\\mathbb{Z}$, while $\\\\operatorname{Pic}(X) =
        0$.\\n\\n**Exercise 5.4.** Let $k$ be an algebraically closed field, and let
        $Q = V_+(xy - zw) \\\\subseteq \\\\mathbb{P}^3_k$ be the smooth projective
        quadric surface (isomorphic via the Segre embedding of Exercise 1.3 to $\\\\mathbb{P}^1_k
        \\\\times \\\\mathbb{P}^1_k$). Prove that $\\\\operatorname{Pic}(\\\\mathbb{P}^1_k
        \\\\times \\\\mathbb{P}^1_k) \\\\cong \\\\mathbb{Z} \\\\oplus \\\\mathbb{Z}$,
        generated by the rulings $L_1 = \\\\{P\\\\} \\\\times \\\\mathbb{P}^1_k$ and
        $L_2 = \\\\mathbb{P}^1_k \\\\times \\\\{Q\\\\}$. Under the Segre embedding
        into $\\\\mathbb{P}^3_k$, show that $\\\\mathcal{O}_Q(1)$ (the pullback of
        a hyperplane in $\\\\mathbb{P}^3_k$) corresponds to the class $(1,1) = L_1
        + L_2$.\\n\\n**Exercise 5.5 (Morphisms to Projective Space).** Let $X$ be
        a scheme over a ring $A$. Prove that giving an $A$-morphism $\\\\varphi: X
        \\\\to \\\\mathbb{P}^n_A$ is equivalent to giving an invertible sheaf $\\\\mathcal{L}$
        on $X$ together with $n+1$ global sections $s_0, s_1, \\\\dots, s_n \\\\in
        \\\\Gamma(X, \\\\mathcal{L})$ that *generate* $\\\\mathcal{L}$ (meaning their
        germs generate $\\\\mathcal{L}_x$ for every $x \\\\in X$), up to isomorphism
        of $(\\\\mathcal{L}, s_0, \\\\dots, s_n)$. (Under this correspondence, $\\\\mathcal{L}
        \\\\cong \\\\varphi^* \\\\mathcal{O}_{\\\\mathbb{P}^n_A}(1)$ and $s_i = \\\\varphi^*(x_i)$).\\n\\n---\\n\\n##
        CHAPTER 6: DIFFERENTIALS AND SMOOTHNESS\\n\\nTo develop calculus on schemes\u2014tangent
        spaces, differential 1-forms, the Jacobian criterion for nonsingularity, and
        the canonical bundle\u2014we need a purely algebraic formulation of the module
        of differential forms. This is the theory of K\xE4hler differentials.\\n\\n###
        6.1 Derivations and the Module of Relative Differential Forms $\\\\Omega_{B/A}^1$\\n\\n**Definition
        6.1.1.** Let $A$ be a ring, let $B$ be an $A$-algebra, and let $M$ be a $B$-module.
        An *$A$-derivation* of $B$ into $M$ is a map $D: B \\\\to M$ satisfying:\\n1.
        $D$ is additive: $D(b_1 + b_2) = D(b_1) + D(b_2)$ for all $b_1, b_2 \\\\in
        B$.\\n2. (Leibniz Rule) $D(b_1 b_2) = b_1 D(b_2) + b_2 D(b_1)$ for all $b_1,
        b_2 \\\\in B$.\\n3. $D(a \\\\cdot 1_B) = 0$ for all $a \\\\in A$ (which by
        the Leibniz rule is equivalent to $D$ being $A$-linear).\\n\\nThe set of all
        $A$-derivations $B \\\\to M$ is naturally a $B$-module (where $(bD)(x) = b
        \\\\cdot D(x)$), denoted $\\\\operatorname{Der}_A(B, M)$.\\n\\n**Definition
        6.1.2.** Let $B$ be an $A$-algebra. The *module of relative differential forms
        (or K\xE4hler differentials) of $B$ over $A$*, denoted $\\\\Omega_{B/A}^1$,
        is a $B$-module equipped with an $A$-derivation $d = d_{B/A}: B \\\\to \\\\Omega_{B/A}^1$
        satisfying the following universal property: for any $B$-module $M$ and any
        $A$-derivation $D: B \\\\to M$, there exists a unique $B$-module homomorphism
        $f: \\\\Omega_{B/A}^1 \\\\to M$ such that $D = f \\\\circ d$. In other words,
        composition with $d$ induces a functorial isomorphism of $B$-modules\\n$$\\\\operatorname{Hom}_B(\\\\Omega_{B/A}^1,
        M) \\\\xrightarrow{\\\\sim} \\\\operatorname{Der}_A(B, M).$$\\n\\n**Proposition
        6.1.3 (Existence and Explicit Constructions of $\\\\Omega_{B/A}^1$).** For
        any $A$-algebra $B$, the module of K\xE4hler differentials $(\\\\Omega_{B/A}^1,
        d)$ exists and is unique up to unique isomorphism, and admits the following
        two equivalent constructions:\\n1. *(Generators and Relations)* Let $F$ be
        the free $B$-module on the symbols $\\\\{db \\\\mid b \\\\in B\\\\}$, and
        let $N \\\\subseteq F$ be the $B$-submodule generated by all elements of the
        forms:\\n   * $d(b_1 + b_2) - db_1 - db_2$ ($b_1, b_2 \\\\in B$),\\n   * $d(b_1
        b_2) - b_1 db_2 - b_2 db_1$ ($b_1, b_2 \\\\in B$),\\n   * $da$ ($a \\\\in
        A$).\\n   Then $\\\\Omega_{B/A}^1 = F / N$, with $d: B \\\\to \\\\Omega_{B/A}^1$
        sending $b \\\\mapsto db \\\\pmod N$.\\n2. *(Diagonal Ideal Construction)*
        Let $\\\\mu: B \\\\otimes_A B \\\\to B$ be the multiplication homomorphism
        $b_1 \\\\otimes b_2 \\\\mapsto b_1 b_2$, and let $I = \\\\ker(\\\\mu) \\\\subseteq
        B \\\\otimes_A B$. Notice that $I / I^2$ is a module over $(B \\\\otimes_A
        B) / I \\\\cong B$. Define $d: B \\\\to I/I^2$ by\\n$$d(b) = (1 \\\\otimes
        b - b \\\\otimes 1) \\\\pmod{I^2}.$$\\nThen $(I/I^2, d)$ satisfies the universal
        property of $(\\\\Omega_{B/A}^1, d)$, so $\\\\Omega_{B/A}^1 \\\\cong I/I^2$.\\n\\n*Proof.*
        Construction (1) satisfies the universal property immediately by the definition
        of an $A$-derivation. To prove that Construction (2) is isomorphic to Construction
        (1), first verify that $d: B \\\\to I/I^2$ is an $A$-derivation: clearly $d$
        is $A$-linear and kills $A$. For any $b_1, b_2 \\\\in B$, we have the algebraic
        identity in $B \\\\otimes_A B$:\\n$$1 \\\\otimes (b_1 b_2) - (b_1 b_2) \\\\otimes
        1 = (b_1 \\\\otimes 1)(1 \\\\otimes b_2 - b_2 \\\\otimes 1) + (b_2 \\\\otimes
        1)(1 \\\\otimes b_1 - b_1 \\\\otimes 1) + (1 \\\\otimes b_1 - b_1 \\\\otimes
        1)(1 \\\\otimes b_2 - b_2 \\\\otimes 1).$$\\nSince the last term is a product
        of two elements of $I$, it lies in $I^2$! Reducing modulo $I^2$ gives $d(b_1
        b_2) = b_1 d(b_2) + b_2 d(b_1)$ in $I/I^2$. By the universal property of $\\\\Omega_{B/A}^1$,
        there is a unique $B$-module homomorphism $\\\\Phi: \\\\Omega_{B/A}^1 \\\\to
        I/I^2$ sending $db \\\\mapsto (1 \\\\otimes b - b \\\\otimes 1) \\\\pmod{I^2}$.\\n\\nConversely,
        define a $B$-linear map $\\\\tilde{\\\\Psi}: B \\\\otimes_A B \\\\to \\\\Omega_{B/A}^1$
        (where $B \\\\otimes_A B$ is a $B$-module via the left factor $b \\\\cdot
        (x \\\\otimes y) = (bx) \\\\otimes y$) by $\\\\tilde{\\\\Psi}(x \\\\otimes
        y) = x \\\\, dy$. Restrict $\\\\tilde{\\\\Psi}$ to $I = \\\\ker(\\\\mu)$.
        Notice that for any $x \\\\otimes y \\\\in B \\\\otimes_A B$, we can write
        $x \\\\otimes y = (xy) \\\\otimes 1 + (x \\\\otimes 1)(1 \\\\otimes y - y
        \\\\otimes 1)$, so $I$ is generated as a left $B$-module by elements of the
        form $1 \\\\otimes b - b \\\\otimes 1$. For any two such generators, their
        product is\\n$$(1 \\\\otimes b_1 - b_1 \\\\otimes 1)(1 \\\\otimes b_2 - b_2
        \\\\otimes 1) = 1 \\\\otimes (b_1 b_2) - b_1 \\\\otimes b_2 - b_2 \\\\otimes
        b_1 + (b_1 b_2) \\\\otimes 1.$$\\nApplying $\\\\tilde{\\\\Psi}$ to this product
        yields\\n$$d(b_1 b_2) - b_1 \\\\, db_2 - b_2 \\\\, db_1 + 0 = 0 \\\\quad \\\\text{in
        } \\\\Omega_{B/A}^1!$$\\nThus $\\\\tilde{\\\\Psi}(I^2) = 0$, inducing a $B$-module
        homomorphism $\\\\Psi: I/I^2 \\\\to \\\\Omega_{B/A}^1$ sending $(1 \\\\otimes
        b - b \\\\otimes 1) \\\\pmod{I^2} \\\\mapsto db$. Clearly $\\\\Phi$ and $\\\\Psi$
        are mutually inverse isomorphisms. $\\\\blacksquare$\\n\\n**Example 6.1.4.**
        If $B = A[x_1, \\\\dots, x_n]$ is a polynomial ring over $A$, then $\\\\Omega_{B/A}^1$
        is the free $B$-module of rank $n$ with basis $dx_1, \\\\dots, dx_n$, and
        $d: B \\\\to \\\\Omega_{B/A}^1$ is the usual total differential $df = \\\\sum_{i=1}^n
        \\\\frac{\\\\partial f}{\\\\partial x_i} dx_i$. (Indeed, any $A$-derivation
        $D: B \\\\to M$ is uniquely determined by the arbitrary values $D(x_1), \\\\dots,
        D(x_n) \\\\in M$ via $D(f) = \\\\sum \\\\frac{\\\\partial f}{\\\\partial x_i}
        D(x_i)$).\\n\\nFurthermore, one checks directly from the universal property
        that $\\\\Omega_{B/A}^1$ commutes with base change and localization:\\n1.
        If $A' $ is an $A$-algebra and $B' = B \\\\otimes_A A'$, then $\\\\Omega_{B'/A'}^1
        \\\\cong \\\\Omega_{B/A}^1 \\\\otimes_B B'$.\\n2. If $S \\\\subseteq B$ is
        a multiplicative subset, then $\\\\Omega_{S^{-1}B / A}^1 \\\\cong S^{-1} \\\\Omega_{B/A}^1$
        (by the quotient rule $d(b/s) = (s \\\\, db - b \\\\, ds)/s^2$).\\n\\n###
        6.2 The Exact Sequences of Differentials\\n\\nThe computation and functorial
        behavior of K\xE4hler differentials are governed by two fundamental exact
        sequences.\\n\\n**Proposition 6.2.1 (First Fundamental Exact Sequence).**
        Let $A \\\\to B \\\\to C$ be ring homomorphisms. Then there is a natural exact
        sequence of $C$-modules:\\n$$\\\\Omega_{B/A}^1 \\\\otimes_B C \\\\xrightarrow{\\\\alpha}
        \\\\Omega_{C/A}^1 \\\\xrightarrow{\\\\beta} \\\\Omega_{C/B}^1 \\\\longrightarrow
        0,$$\\nwhere $\\\\alpha(db \\\\otimes c) = c \\\\cdot d_{C/A}(\\\\text{im
        } b)$ and $\\\\beta(d_{C/A} c) = d_{C/B} c$.\\n\\n*Proof.* By the Yoneda Lemma,
        a sequence of $C$-modules $M' \\\\to M \\\\to M'' \\\\to 0$ is exact if and
        only if for every $C$-module $N$, applying the contravariant functor $\\\\operatorname{Hom}_C(-,
        N)$ yields an exact sequence\\n$$0 \\\\longrightarrow \\\\operatorname{Hom}_C(M'',
        N) \\\\longrightarrow \\\\operatorname{Hom}_C(M, N) \\\\longrightarrow \\\\operatorname{Hom}_C(M',
        N).$$\\nApplying $\\\\operatorname{Hom}_C(-, N)$ to our sequence and using
        the universal property $\\\\operatorname{Hom}_C(\\\\Omega_{B/A}^1 \\\\otimes_B
        C, N) \\\\cong \\\\operatorname{Hom}_B(\\\\Omega_{B/A}^1, N) \\\\cong \\\\operatorname{Der}_A(B,
        N)$, we obtain the sequence\\n$$0 \\\\longrightarrow \\\\operatorname{Der}_B(C,
        N) \\\\xrightarrow{\\\\beta^*} \\\\operatorname{Der}_A(C, N) \\\\xrightarrow{\\\\alpha^*}
        \\\\operatorname{Der}_A(B, N).$$\\nThis sequence is manifestly exact: a $B$-derivation
        $C \\\\to N$ is precisely an $A$-derivation $C \\\\to N$ whose restriction
        to $B$ is zero! $\\\\blacksquare$\\n\\n**Proposition 6.2.2 (Second Fundamental
        Exact Sequence / Conormal Exact Sequence).** Let $B$ be an $A$-algebra, let
