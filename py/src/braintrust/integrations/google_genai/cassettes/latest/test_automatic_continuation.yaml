        [\n          {\n            \"text\": \"# FOUNDATIONS OF MODERN ALGEBRAIC
        GEOMETRY\\n\\n---\\n\\n## Chapter 1: Classical Algebraic Varieties\\n\\nAlgebraic
        geometry is the study of geometries that arise as the loci of common zeros
        of collections of polynomials. In its classical formulation, the subject bridges
        commutative algebra and the geometry of affine and projective spaces over
        an algebraically closed field. In this opening chapter, we develop the foundational
        correspondence between geometric spaces\u2014affine and projective varieties\u2014and
        algebraic structures\u2014finitely generated reduced algebras and homogeneous
        coordinate rings.\\n\\nThroughout this chapter, unless explicitly stated otherwise,
        $k$ denotes an algebraically closed field.\\n\\n---\\n\\n### 1.1 Affine Space
        and Algebraic Sets\\n\\n**Definition 1.1.1.** Let $k$ be an algebraically
        closed field. The *affine $n$-space* over $k$, denoted $\\\\mathbb{A}^n_k$
        (or simply $\\\\mathbb{A}^n$ when $k$ is understood), is the set of all $n$-tuples
        of elements of $k$:\\n$$\\\\mathbb{A}^n_k = \\\\{(a_1, a_2, \\\\dots, a_n)
        \\\\mid a_i \\\\in k \\\\text{ for all } 1 \\\\le i \\\\le n\\\\}.$$\\nAn
        element $P = (a_1, \\\\dots, a_n) \\\\in \\\\mathbb{A}^n_k$ is called a *point*,
        and the elements $a_i$ are called the *coordinates* of $P$.\\n\\nLet $k[x_1,
        \\\\dots, x_n]$ be the polynomial ring in $n$ variables over $k$. Elements
        $f \\\\in k[x_1, \\\\dots, x_n]$ act as functions $f: \\\\mathbb{A}^n_k \\\\to
        k$ by evaluation: $P = (a_1, \\\\dots, a_n) \\\\mapsto f(a_1, \\\\dots, a_n)$.\\n\\n**Definition
        1.1.2.** Let $T \\\\subseteq k[x_1, \\\\dots, x_n]$ be an arbitrary subset
        of polynomials. The *zero locus* (or *vanishing locus*) of $T$ is the subset
        of $\\\\mathbb{A}^n_k$ defined by\\n$$Z(T) = \\\\{P \\\\in \\\\mathbb{A}^n_k
        \\\\mid f(P) = 0 \\\\text{ for all } f \\\\in T\\\\}.$$\\nA subset $Y \\\\subseteq
        \\\\mathbb{A}^n_k$ is called an *affine algebraic set* if there exists a subset
        $T \\\\subseteq k[x_1, \\\\dots, x_n]$ such that $Y = Z(T)$.\\n\\nIf $\\\\mathfrak{a}$
        is the ideal of $k[x_1, \\\\dots, x_n]$ generated by $T$, then any $g \\\\in
        \\\\mathfrak{a}$ can be written as a finite sum $g = \\\\sum_{i=1}^m h_i f_i$
        with $h_i \\\\in k[x_1, \\\\dots, x_n]$ and $f_i \\\\in T$. Consequently,
        if $f(P) = 0$ for all $f \\\\in T$, then $g(P) = 0$ for all $g \\\\in \\\\mathfrak{a}$.
        Thus $Z(T) = Z(\\\\mathfrak{a})$. By Hilbert's Basis Theorem, the ring $k[x_1,
        \\\\dots, x_n]$ is Noetherian, meaning every ideal $\\\\mathfrak{a}$ is finitely
        generated: $\\\\mathfrak{a} = (f_1, \\\\dots, f_r)$. Therefore, every affine
        algebraic set is the intersection of finitely many hypersurfaces $Z(f_i)$.\\n\\n**Proposition
        1.1.3.** *The operation $Z$ satisfies the following properties:*\\n1. $Z(0)
        = \\\\mathbb{A}^n_k$ *and* $Z(k[x_1, \\\\dots, x_n]) = \\\\varnothing$.\\n2.
        *If $\\\\mathfrak{a} \\\\subseteq \\\\mathfrak{b}$ are ideals in $k[x_1, \\\\dots,
        x_n]$, then $Z(\\\\mathfrak{b}) \\\\subseteq Z(\\\\mathfrak{a})$.*\\n3. *For
        any two ideals $\\\\mathfrak{a}, \\\\mathfrak{b} \\\\subseteq k[x_1, \\\\dots,
        x_n]$, we have $Z(\\\\mathfrak{a}) \\\\cup Z(\\\\mathfrak{b}) = Z(\\\\mathfrak{a}\\\\mathfrak{b})
        = Z(\\\\mathfrak{a} \\\\cap \\\\mathfrak{b})$.*\\n4. *For any family of ideals
        $\\\\{\\\\mathfrak{a}_i\\\\}_{i \\\\in I}$ in $k[x_1, \\\\dots, x_n]$, we
        have $\\\\bigcap_{i \\\\in I} Z(\\\\mathfrak{a}_i) = Z\\\\left(\\\\sum_{i
        \\\\in I} \\\\mathfrak{a}_i\\\\right)$.*\\n\\n*Proof.* \\n(1) Every point
        $P \\\\in \\\\mathbb{A}^n_k$ satisfies $0(P) = 0$, so $Z(0) = \\\\mathbb{A}^n_k$.
        Since $1 \\\\in k[x_1, \\\\dots, x_n]$ and $1(P) = 1 \\\\neq 0$ for all $P$,
        we have $Z(k[x_1, \\\\dots, x_n]) = \\\\varnothing$.\\n\\n(2) If $P \\\\in
        Z(\\\\mathfrak{b})$, then $f(P) = 0$ for all $f \\\\in \\\\mathfrak{b}$. Since
        $\\\\mathfrak{a} \\\\subseteq \\\\mathfrak{b}$, this holds for all $f \\\\in
        \\\\mathfrak{a}$, so $P \\\\in Z(\\\\mathfrak{a})$.\\n\\n(3) Since $\\\\mathfrak{a}\\\\mathfrak{b}
        \\\\subseteq \\\\mathfrak{a} \\\\cap \\\\mathfrak{b} \\\\subseteq \\\\mathfrak{a},
        \\\\mathfrak{b}$, property (2) immediately yields $Z(\\\\mathfrak{a}) \\\\cup
        Z(\\\\mathfrak{b}) \\\\subseteq Z(\\\\mathfrak{a} \\\\cap \\\\mathfrak{b})
        \\\\subseteq Z(\\\\mathfrak{a}\\\\mathfrak{b})$. Conversely, suppose $P \\\\in
        Z(\\\\mathfrak{a}\\\\mathfrak{b})$ and $P \\\\notin Z(\\\\mathfrak{a})$. Then
        there exists $f \\\\in \\\\mathfrak{a}$ such that $f(P) \\\\neq 0$. For any
        $g \\\\in \\\\mathfrak{b}$, we have $fg \\\\in \\\\mathfrak{a}\\\\mathfrak{b}$,
        so $(fg)(P) = f(P)g(P) = 0$. Since $k$ is a field and $f(P) \\\\neq 0$, we
        must have $g(P) = 0$. As $g \\\\in \\\\mathfrak{b}$ was arbitrary, $P \\\\in
        Z(\\\\mathfrak{b})$. Thus $Z(\\\\mathfrak{a}\\\\mathfrak{b}) \\\\subseteq
        Z(\\\\mathfrak{a}) \\\\cup Z(\\\\mathfrak{b})$, establishing the equalities.\\n\\n(4)
        A point $P$ belongs to $Z\\\\left(\\\\sum_{i \\\\in I} \\\\mathfrak{a}_i\\\\right)$
        if and only if every finite sum $\\\\sum f_i$ (with $f_i \\\\in \\\\mathfrak{a}_i$)
        vanishes at $P$. This holds if and only if $f_i(P) = 0$ for all $i \\\\in
        I$ and all $f_i \\\\in \\\\mathfrak{a}_i$, which is equivalent to $P \\\\in
        \\\\bigcap_{i \\\\in I} Z(\\\\mathfrak{a}_i)$. $\\\\blacksquare$\\n\\n**Definition
        1.1.4.** Proposition 1.1.3 demonstrates that the collection of affine algebraic
        sets in $\\\\mathbb{A}^n_k$ satisfies the axioms for the closed subsets of
        a topology. This topology on $\\\\mathbb{A}^n_k$ is called the *Zariski topology*.\\n\\nThe
        Zariski topology is drastically different from the classical Euclidean topology
        on $\\\\mathbb{C}^n$. For instance, on $\\\\mathbb{A}^1_k$, every ideal in
        $k[x]$ is principal. Since a non-zero polynomial in one variable has only
        finitely many roots, the proper closed subsets of $\\\\mathbb{A}^1_k$ are
        precisely the finite subsets. Thus the Zariski topology on $\\\\mathbb{A}^1_k$
        is the cofinite topology, which is non-Hausdorff whenever $k$ is infinite
        (which is always true for algebraically closed fields).\\n\\n**Definition
        1.1.5.** A non-empty topological space $X$ is called *irreducible* if it cannot
        be expressed as the union $X = X_1 \\\\cup X_2$ of two proper closed subsets
        $X_1, X_2 \\\\subsetneq X$. Equivalently, $X$ is irreducible if and only if
        every pair of non-empty open subsets $U_1, U_2 \\\\subseteq X$ has a non-empty
        intersection $U_1 \\\\cap U_2 \\\\neq \\\\varnothing$, which in turn is equivalent
        to the condition that every non-empty open subset of $X$ is dense in $X$.\\n\\nAn
        *affine algebraic variety* (or simply an *affine variety*) is an irreducible
        closed subset of $\\\\mathbb{A}^n_k$, endowed with the induced Zariski topology.
        An open subset of an affine variety is called a *quasi-affine variety*.\\n\\nTo
        connect geometry back to algebra, we define the inverse operation to $Z$.\\n\\n**Definition
        1.1.6.** For any subset $Y \\\\subseteq \\\\mathbb{A}^n_k$, the *ideal of
        $Y$* in $k[x_1, \\\\dots, x_n]$ is defined by\\n$$I(Y) = \\\\{f \\\\in k[x_1,
        \\\\dots, x_n] \\\\mid f(P) = 0 \\\\text{ for all } P \\\\in Y\\\\}.$$\\n\\nRecall
        that for an ideal $\\\\mathfrak{a}$ in a commutative ring $R$, the *radical*
        of $\\\\mathfrak{a}$ is the ideal $\\\\sqrt{\\\\mathfrak{a}} = \\\\{r \\\\in
        R \\\\mid r^m \\\\in \\\\mathfrak{a} \\\\text{ for some integer } m \\\\ge
        1\\\\}$. An ideal $\\\\mathfrak{a}$ is called a *radical ideal* if $\\\\mathfrak{a}
        = \\\\sqrt{\\\\mathfrak{a}}$. Every prime ideal is clearly a radical ideal.\\n\\n**Proposition
        1.1.7.** *The operation $I$ satisfies the following properties:*\\n1. *If
        $Y_1 \\\\subseteq Y_2 \\\\subseteq \\\\mathbb{A}^n_k$, then $I(Y_2) \\\\subseteq
        I(Y_1)$.*\\n2. $I(\\\\varnothing) = k[x_1, \\\\dots, x_n]$ *and, since $k$
        is infinite, $I(\\\\mathbb{A}^n_k) = (0)$.*\\n3. *For any subsets $Y_1, Y_2
        \\\\subseteq \\\\mathbb{A}^n_k$, $I(Y_1 \\\\cup Y_2) = I(Y_1) \\\\cap I(Y_2)$.*\\n4.
        *For any subset $Y \\\\subseteq \\\\mathbb{A}^n_k$, $I(Y)$ is a radical ideal.*\\n5.
        *For any subset $Y \\\\subseteq \\\\mathbb{A}^n_k$, $Z(I(Y)) = \\\\overline{Y}$,
        the closure of $Y$ in the Zariski topology.*\\n6. *For any ideal $\\\\mathfrak{a}
        \\\\subseteq k[x_1, \\\\dots, x_n]$, $\\\\sqrt{\\\\mathfrak{a}} \\\\subseteq
        I(Z(\\\\mathfrak{a}))$.*\\n\\n*Proof.* \\n(1) and (3) follow immediately from
        the definitions.\\n\\n(2) The statement $I(\\\\varnothing) = k[x_1, \\\\dots,
        x_n]$ is vacuous. To see that $I(\\\\mathbb{A}^n_k) = (0)$, we proceed by
        induction on $n$. For $n=1$, a non-zero polynomial in $k[x_1]$ of degree $d$
        has at most $d$ roots in $k$; since $k$ is algebraically closed, it is infinite,
        so no non-zero polynomial can vanish on all of $k$. For $n \\u003e 1$, write
        $f \\\\in k[x_1, \\\\dots, x_n]$ as a polynomial in $x_n$ with coefficients
        in $k[x_1, \\\\dots, x_{n-1}]$: $f = \\\\sum_{i=0}^d g_i(x_1, \\\\dots, x_{n-1})
        x_n^i$. For any fixed $(a_1, \\\\dots, a_{n-1}) \\\\in \\\\mathbb{A}^{n-1}_k$,
        the polynomial $f(a_1, \\\\dots, a_{n-1}, x_n) \\\\in k[x_n]$ vanishes for
        all $a_n \\\\in k$, hence is identically zero. Thus $g_i(a_1, \\\\dots, a_{n-1})
        = 0$ for all $i$. By the induction hypothesis, $g_i = 0$ in $k[x_1, \\\\dots,
        x_{n-1}]$ for all $i$, so $f = 0$.\\n\\n(4) Suppose $f \\\\in \\\\sqrt{I(Y)}$.
        Then $f^m \\\\in I(Y)$ for some $m \\\\ge 1$. For any $P \\\\in Y$, $(f(P))^m
        = f^m(P) = 0$ in $k$. Since $k$ has no non-zero nilpotent elements, $f(P)
        = 0$ for all $P \\\\in Y$, so $f \\\\in I(Y)$.\\n\\n(5) By definition, $Y
        \\\\subseteq Z(I(Y))$, and since $Z(I(Y))$ is closed, $\\\\overline{Y} \\\\subseteq
        Z(I(Y))$. Conversely, let $W = Z(\\\\mathfrak{a})$ be any closed set containing
        $Y$. Then $I(W) \\\\subseteq I(Y)$, and since $\\\\mathfrak{a} \\\\subseteq
        I(Z(\\\\mathfrak{a})) = I(W)$, we have $\\\\mathfrak{a} \\\\subseteq I(Y)$.
        Applying $Z$ yields $Z(I(Y)) \\\\subseteq Z(\\\\mathfrak{a}) = W$. Taking
        $W = \\\\overline{Y}$ gives $Z(I(Y)) \\\\subseteq \\\\overline{Y}$.\\n\\n(6)
        If $f \\\\in \\\\sqrt{\\\\mathfrak{a}}$, then $f^m \\\\in \\\\mathfrak{a}$
        for some $m \\\\ge 1$. For any $P \\\\in Z(\\\\mathfrak{a})$, $(f(P))^m =
        f^m(P) = 0$, so $f(P) = 0$. Thus $f \\\\in I(Z(\\\\mathfrak{a}))$. $\\\\blacksquare$\\n\\n---\\n\\n###
        1.2 Hilbert's Nullstellensatz\\n\\nThe inclusion $\\\\sqrt{\\\\mathfrak{a}}
        \\\\subseteq I(Z(\\\\mathfrak{a}))$ in Proposition 1.1.7(6) is in fact an
        equality. This fundamental result, due to David Hilbert, forms the bridge
        between commutative algebra and algebraic geometry. We will provide a complete,
        self-contained proof, beginning with Zariski's Lemma via the Artin\u2013Tate
        Lemma.\\n\\n**Lemma 1.2.1 (Artin\u2013Tate).** *Let $A \\\\subseteq B \\\\subseteq
        C$ be commutative rings such that $A$ is Noetherian, $C$ is a finitely generated
        $A$-algebra, and $C$ is a finitely generated $B$-module. Then $B$ is a finitely
        generated $A$-algebra.*\\n\\n*Proof.* Let $x_1, \\\\dots, x_n \\\\in C$ generate
        $C$ as an $A$-algebra, and let $y_1, \\\\dots, y_m \\\\in C$ generate $C$
        as a $B$-module. Then we can express each $x_i$ and each product $y_i y_j$
        as $B$-linear combinations of the generators $y_k$:\\n$$x_i = \\\\sum_{k=1}^m
        b_{ik} y_k \\\\quad (1 \\\\le i \\\\le n), \\\\qquad y_i y_j = \\\\sum_{k=1}^m
        b_{ijk} y_k \\\\quad (1 \\\\le i, j \\\\le m),$$\\nwhere $b_{ik}, b_{ijk}
        \\\\in B$. Let $B_0 \\\\subseteq B$ be the $A$-subalgebra generated by the
        finite set of all these coefficients $\\\\{b_{ik}, b_{ijk}\\\\}$. Since $A$
        is a Noetherian ring and $B_0$ is a finitely generated $A$-algebra, Hilbert's
        Basis Theorem implies that $B_0$ is a Noetherian ring.\\n\\nAny element $c
        \\\\in C$ is a polynomial in $x_1, \\\\dots, x_n$ with coefficients in $A$.
        Using the equations above, we can rewrite each $x_i$ as a $B_0$-linear combination
        of the $y_k$, and any product of the $y_k$ can be reduced to a $B_0$-linear
        combination of $y_1, \\\\dots, y_m$. Consequently, $C$ is finitely generated
        as a $B_0$-module (generated by $1, y_1, \\\\dots, y_m$).\\n\\nSince $B_0$
        is Noetherian and $C$ is a finitely generated $B_0$-module, $C$ is a Noetherian
        $B_0$-module. Because $B_0 \\\\subseteq B \\\\subseteq C$, $B$ is a $B_0$-submodule
        of $C$, and therefore $B$ is finitely generated as a $B_0$-module. Let $z_1,
        \\\\dots, z_r \\\\in B$ generate $B$ as a $B_0$-module. Since $B_0$ is finitely
        generated as an $A$-algebra by $\\\\{b_{ik}, b_{ijk}\\\\}$, it follows immediately
        that $B$ is finitely generated as an $A$-algebra by $\\\\{b_{ik}, b_{ijk}\\\\}
        \\\\cup \\\\{z_1, \\\\dots, z_r\\\\}$. $\\\\blacksquare$\\n\\n**Proposition
        1.2.2 (Zariski's Lemma).** *Let $k$ be a field, and let $E$ be a finitely
        generated $k$-algebra. If $E$ is a field, then $E$ is a finite algebraic extension
        of $k$.*\\n\\n*Proof.* Let $x_1, \\\\dots, x_n \\\\in E$ generate $E$ as a
        $k$-algebra, so $E = k[x_1, \\\\dots, x_n]$. Since $E$ is a field, we also
        have $E = k(x_1, \\\\dots, x_n)$. Suppose, for the sake of contradiction,
        that $E$ is not algebraic over $k$. After reindexing the generators $x_1,
        \\\\dots, x_n$, we may assume that $x_1, \\\\dots, x_r$ (for some $1 \\\\le
        r \\\\le n$) form a transcendence basis of $E$ over $k$, and that $x_{r+1},
        \\\\dots, x_n$ are algebraic over the purely transcendental subfield $F =
        k(x_1, \\\\dots, x_r)$.\\n\\nSince $E = F(x_{r+1}, \\\\dots, x_n)$ is finitely
        generated and algebraic over $F$, $E$ is a finite field extension of $F$;
        in particular, $E$ is a finitely generated $F$-module. Let $A = k[x_1, \\\\dots,
        x_r]$ be the polynomial ring in $r$ variables over $k$. Because $k$ is a field,
        $A$ is Noetherian. We now have a tower of rings\\n$$A = k[x_1, \\\\dots, x_r]
        \\\\subseteq F = k(x_1, \\\\dots, x_r) \\\\subseteq E$$\\nwhere $A$ is Noetherian,
        $E$ is a finitely generated $A$-algebra (generated by $x_{r+1}, \\\\dots,
        x_n$), and $E$ is a finitely generated $F$-module. By the Artin\u2013Tate
        Lemma (Lemma 1.2.1), $F$ is a finitely generated $A$-algebra.\\n\\nThus there
        exist finitely many rational functions $f_1/g_1, \\\\dots, f_s/g_s \\\\in
        F$ (with $f_i, g_i \\\\in A$ and $g_i \\\\neq 0$) such that $F = A[f_1/g_1,
        \\\\dots, f_s/g_s]$. Let $g = \\\\prod_{i=1}^s g_i \\\\in A$. Then every element
        of $F$ can be written with a denominator that is a power of $g$, so $F = A[1/g]$.\\n\\nHowever,
        $A = k[x_1, \\\\dots, x_r]$ is a Unique Factorization Domain with infinitely
        many non-associate irreducible elements (by Euclid's argument: if $p_1, \\\\dots,
        p_t$ were all the irreducibles, then $p_1 \\\\cdots p_t + 1$ would have an
        irreducible factor distinct from all $p_i$). Therefore, there exists an irreducible
        element $p \\\\in A$ that does not divide $g$. Since $1/p \\\\in F = A[1/g]$,
        there exist an integer $N \\\\ge 0$ and an element $a \\\\in A$ such that\\n$$\\\\frac{1}{p}
        = \\\\frac{a}{g^N} \\\\implies g^N = p a.$$\\nSince $p$ is irreducible in
        the UFD $A$, $p$ must divide $g$, a contradiction. Thus $E$ must be algebraic
        over $k$, and since it is finitely generated, it is a finite extension of
        $k$. $\\\\blacksquare$\\n\\n**Theorem 1.2.3 (Weak Nullstellensatz).** *Let
        $k$ be an algebraically closed field. Every maximal ideal $\\\\mathfrak{m}$
        of the polynomial ring $k[x_1, \\\\dots, x_n]$ is of the form*\\n$$\\\\mathfrak{m}
        = (x_1 - a_1, x_2 - a_2, \\\\dots, x_n - a_n)$$\\n*for a unique point $P =
        (a_1, \\\\dots, a_n) \\\\in \\\\mathbb{A}^n_k$. Equivalently, for every proper
        ideal $\\\\mathfrak{a} \\\\subsetneq k[x_1, \\\\dots, x_n]$, we have $Z(\\\\mathfrak{a})
        \\\\neq \\\\varnothing$.*\\n\\n*Proof.* Let $\\\\mathfrak{m} \\\\subset k[x_1,
        \\\\dots, x_n]$ be a maximal ideal. The quotient $E = k[x_1, \\\\dots, x_n]/\\\\mathfrak{m}$
        is a field and is finitely generated as a $k$-algebra by the cosets $\\\\bar{x}_1,
        \\\\dots, \\\\bar{x}_n$. By Zariski's Lemma (Proposition 1.2.2), $E$ is a
        finite algebraic extension of $k$. Since $k$ is algebraically closed, it has
        no non-trivial algebraic extensions, so the natural inclusion $k \\\\hookrightarrow
        E$ is an isomorphism.\\n\\nConsequently, for each $1 \\\\le i \\\\le n$, there
        exists a unique element $a_i \\\\in k$ such that $\\\\bar{x}_i = a_i$ in $E
        = k[x_1, \\\\dots, x_n]/\\\\mathfrak{m}$. This means $x_i - a_i \\\\in \\\\mathfrak{m}$
        for all $i$, so the ideal $\\\\mathfrak{m}_P = (x_1 - a_1, \\\\dots, x_n -
        a_n)$ is contained in $\\\\mathfrak{m}$. However, the evaluation map $k[x_1,
        \\\\dots, x_n] \\\\to k$ given by $f \\\\mapsto f(a_1, \\\\dots, a_n)$ is
        a surjective ring homomorphism with kernel precisely $\\\\mathfrak{m}_P$.
        Thus $\\\\mathfrak{m}_P$ is already a maximal ideal, forcing $\\\\mathfrak{m}
        = \\\\mathfrak{m}_P$.\\n\\nFor the second statement, if $\\\\mathfrak{a} \\\\subsetneq
        k[x_1, \\\\dots, x_n]$ is a proper ideal, then by Zorn's Lemma (or the Noetherian
        property) $\\\\mathfrak{a}$ is contained in some maximal ideal $\\\\mathfrak{m}
        = (x_1 - a_1, \\\\dots, x_n - a_n)$. Then $P = (a_1, \\\\dots, a_n) \\\\in
        Z(\\\\mathfrak{m}) \\\\subseteq Z(\\\\mathfrak{a})$, so $Z(\\\\mathfrak{a})
        \\\\neq \\\\varnothing$. $\\\\blacksquare$\\n\\n**Theorem 1.2.4 (Hilbert's
        Nullstellensatz).** *Let $k$ be an algebraically closed field, and let $\\\\mathfrak{a}$
        be an ideal in $k[x_1, \\\\dots, x_n]$. Then*\\n$$I(Z(\\\\mathfrak{a})) =
        \\\\sqrt{\\\\mathfrak{a}}.$$\\n\\n*Proof.* We already proved $\\\\sqrt{\\\\mathfrak{a}}
        \\\\subseteq I(Z(\\\\mathfrak{a}))$ in Proposition 1.1.7(6). For the reverse
        inclusion, we employ **Rabinowitsch's trick**. Suppose $f \\\\in I(Z(\\\\mathfrak{a}))$.
        If $f = 0$, then $f \\\\in \\\\sqrt{\\\\mathfrak{a}}$ trivially, so assume
        $f \\\\neq 0$. Since $k[x_1, \\\\dots, x_n]$ is Noetherian, let $\\\\mathfrak{a}
        = (g_1, \\\\dots, g_m)$.\\n\\nConsider the polynomial ring in $n+1$ variables
        $k[x_1, \\\\dots, x_n, y]$, where $y$ is a new indeterminate. Let $\\\\mathfrak{b}
        \\\\subseteq k[x_1, \\\\dots, x_n, y]$ be the ideal generated by $g_1, \\\\dots,
        g_m$ and the polynomial $1 - y f(x_1, \\\\dots, x_n)$:\\n$$\\\\mathfrak{b}
        = (g_1, \\\\dots, g_m, 1 - yf).$$\\nWe claim that $Z(\\\\mathfrak{b}) = \\\\varnothing$
        in $\\\\mathbb{A}^{n+1}_k$. Indeed, suppose $(a_1, \\\\dots, a_n, b) \\\\in
        Z(\\\\mathfrak{b})$. Since $g_i(a_1, \\\\dots, a_n) = 0$ for all $1 \\\\le
        i \\\\le m$, the point $P = (a_1, \\\\dots, a_n)$ lies in $Z(\\\\mathfrak{a})
        \\\\subseteq \\\\mathbb{A}^n_k$. Since $f \\\\in I(Z(\\\\mathfrak{a}))$, we
        must have $f(a_1, \\\\dots, a_n) = 0$. Evaluating the last generator of $\\\\mathfrak{b}$
        at $(a_1, \\\\dots, a_n, b)$ gives\\n$$0 = 1 - b \\\\cdot f(a_1, \\\\dots,
        a_n) = 1 - b \\\\cdot 0 = 1,$$\\nwhich is impossible. Thus $Z(\\\\mathfrak{b})
        = \\\\varnothing$.\\n\\nBy the contrapositive of the Weak Nullstellensatz
        (Theorem 1.2.3) applied to $k[x_1, \\\\dots, x_n, y]$, the ideal $\\\\mathfrak{b}$
        cannot be a proper ideal; hence $1 \\\\in \\\\mathfrak{b}$. Therefore, there
        exist polynomials $h_1, \\\\dots, h_m, h_{m+1} \\\\in k[x_1, \\\\dots, x_n,
        y]$ such that\\n$$1 = \\\\sum_{i=1}^m h_i(x_1, \\\\dots, x_n, y) g_i(x_1,
        \\\\dots, x_n) + h_{m+1}(x_1, \\\\dots, x_n, y)(1 - yf).$$\\nWe now apply
        the $k[x_1, \\\\dots, x_n]$-algebra homomorphism $k[x_1, \\\\dots, x_n, y]
        \\\\to k(x_1, \\\\dots, x_n)$ that sends $y \\\\mapsto 1/f$. Under this substitution,
        $1 - yf \\\\mapsto 0$, and the identity becomes\\n$$1 = \\\\sum_{i=1}^m h_i\\\\left(x_1,
        \\\\dots, x_n, \\\\frac{1}{f}\\\\right) g_i(x_1, \\\\dots, x_n)$$\\nin the
        field of rational functions $k(x_1, \\\\dots, x_n)$. Let $N \\\\ge 1$ be the
        highest power of $y$ appearing in any of the polynomials $h_1, \\\\dots, h_m$.
        Multiplying both sides of the equation by $f^N$ clears all denominators, yielding\\n$$f^N
        = \\\\sum_{i=1}^m \\\\tilde{h}_i(x_1, \\\\dots, x_n) g_i(x_1, \\\\dots, x_n)$$\\nfor
        some polynomials $\\\\tilde{h}_i \\\\in k[x_1, \\\\dots, x_n]$. Thus $f^N
        \\\\in \\\\mathfrak{a}$, which means $f \\\\in \\\\sqrt{\\\\mathfrak{a}}$.
        $\\\\blacksquare$\\n\\n**Theorem 1.2.5 (The Algebra\u2013Geometry Dictionary).**
        *Let $k$ be an algebraically closed field. The maps $Y \\\\mapsto I(Y)$ and
        $\\\\mathfrak{a} \\\\mapsto Z(\\\\mathfrak{a})$ induce an inclusion-reversing
        bijection between the collection of affine algebraic sets in $\\\\mathbb{A}^n_k$
        and the collection of radical ideals in $k[x_1, \\\\dots, x_n]$. Under this
        bijection:*\\n1. *Affine varieties (irreducible algebraic sets) correspond
        bijectively to prime ideals.*\\n2. *Points of $\\\\mathbb{A}^n_k$ correspond
        bijectively to maximal ideals.*\\n\\n*Proof.* For any algebraic set $Y = Z(\\\\mathfrak{a})$,
        Proposition 1.1.7(5) gives $Z(I(Y)) = \\\\overline{Y} = Y$. For any radical
        ideal $\\\\mathfrak{a}$, Hilbert's Nullstellensatz gives $I(Z(\\\\mathfrak{a}))
        = \\\\sqrt{\\\\mathfrak{a}} = \\\\mathfrak{a}$. Thus $I$ and $Z$ are mutually
        inverse bijections.\\n\\nTo prove (1), let $Y$ be an algebraic set. Suppose
        $Y$ is irreducible, and let $f, g \\\\in k[x_1, \\\\dots, x_n]$ be such that
        $fg \\\\in I(Y)$. Then $Y \\\\subseteq Z(fg) = Z(f) \\\\cup Z(g)$, so $Y =
        (Y \\\\cap Z(f)) \\\\cup (Y \\\\cap Z(g))$. Since $Y$ is irreducible and $Y
        \\\\cap Z(f), Y \\\\cap Z(g)$ are closed in $Y$, we must have $Y = Y \\\\cap
        Z(f)$ or $Y = Y \\\\cap Z(g)$, meaning $Y \\\\subseteq Z(f)$ or $Y \\\\subseteq
        Z(g)$. Hence $f \\\\in I(Y)$ or $g \\\\in I(Y)$, proving $I(Y)$ is prime.
        Conversely, suppose $\\\\mathfrak{p}$ is a prime ideal and $Z(\\\\mathfrak{p})
        = Y_1 \\\\cup Y_2$ for closed sets $Y_1, Y_2$. Then $\\\\mathfrak{p} = I(Z(\\\\mathfrak{p}))
        = I(Y_1) \\\\cap I(Y_2)$. Since $\\\\mathfrak{p}$ is prime, a standard property
        of prime ideals yields $\\\\mathfrak{p} = I(Y_1)$ or $\\\\mathfrak{p} = I(Y_2)$,
        whence $Z(\\\\mathfrak{p}) = Z(I(Y_1)) = Y_1$ or $Z(\\\\mathfrak{p}) = Y_2$.
        Thus $Z(\\\\mathfrak{p})$ is irreducible.\\n\\nStatement (2) is an immediate
        consequence of the Weak Nullstellensatz (Theorem 1.2.3). $\\\\blacksquare$\\n\\n**Definition
        1.2.6.** A topological space $X$ is called *Noetherian* if it satisfies the
        descending chain condition for closed subsets: for any sequence $Y_1 \\\\supseteq
        Y_2 \\\\supseteq Y_3 \\\\supseteq \\\\dots$ of closed subsets of $X$, there
        exists an integer $r$ such that $Y_r = Y_{r+1} = \\\\dots$.\\n\\nBecause $k[x_1,
        \\\\dots, x_n]$ is a Noetherian ring (satisfying the ascending chain condition
        on ideals) and $Y \\\\mapsto I(Y)$ reverses inclusions, $\\\\mathbb{A}^n_k$
        and all of its subspaces are Noetherian topological spaces.\\n\\n**Proposition
        1.2.7.** *In a Noetherian topological space $X$, every non-empty closed subset
        $Y$ can be expressed as a finite union $Y = Y_1 \\\\cup \\\\dots \\\\cup Y_r$
        of irreducible closed subsets. If we require that $Y_i \\\\not\\\\subseteq
        Y_j$ for $i \\\\neq j$, then the subsets $Y_1, \\\\dots, Y_r$ are uniquely
        determined up to permutation. They are called the irreducible components of
        $Y$.*\\n\\n*Proof.* Let $\\\\mathfrak{S}$ be the set of non-empty closed subsets
        of $X$ that cannot be written as a finite union of irreducible closed subsets.
        If $\\\\mathfrak{S} \\\\neq \\\\varnothing$, then since $X$ is Noetherian,
        $\\\\mathfrak{S}$ contains a minimal element $Y$. By definition of $\\\\mathfrak{S}$,
        $Y$ is not irreducible, so $Y = Y' \\\\cup Y''$ for proper closed subsets
        $Y', Y'' \\\\subsetneq Y$. By minimality of $Y$, $Y', Y'' \\\\notin \\\\mathfrak{S}$,
        so both $Y'$ and $Y''$ are finite unions of irreducible closed subsets. Then
        $Y = Y' \\\\cup Y''$ is also such a finite union, contradicting $Y \\\\in
        \\\\mathfrak{S}$. Thus $\\\\mathfrak{S} = \\\\varnothing$.\\n\\nBy discarding
        redundant subsets in $Y = Y_1 \\\\cup \\\\dots \\\\cup Y_r$, we may assume
        $Y_i \\\\not\\\\subseteq Y_j$ for $i \\\\neq j$. For uniqueness, suppose $Y
        = Y_1' \\\\cup \\\\dots \\\\cup Y_s'$ is another such decomposition. Then
        $Y_1' = Y_1' \\\\cap Y = \\\\bigcup_{i=1}^r (Y_1' \\\\cap Y_i)$. Since $Y_1'$
        is irreducible, $Y_1' = Y_1' \\\\cap Y_i$ for some $i$, so $Y_1' \\\\subseteq
        Y_i$. By symmetry, $Y_i \\\\subseteq Y_j'$ for some $j$, yielding $Y_1' \\\\subseteq
        Y_i \\\\subseteq Y_j'$. Since the decomposition $Y_1', \\\\dots, Y_s'$ is
        irredundant, $j = 1$ and $Y_1' = Y_i$. Proceeding by induction (or repeating
        for each index), the two decompositions are identical up to permutation. $\\\\blacksquare$\\n\\n---\\n\\n###
        1.3 Coordinate Rings, Regular Functions, and Morphisms\\n\\n**Definition 1.3.1.**
        Let $Y \\\\subseteq \\\\mathbb{A}^n_k$ be an affine algebraic set. The *affine
        coordinate ring* of $Y$, denoted $A(Y)$ or $k[Y]$, is defined to be the quotient
        ring\\n$$A(Y) = k[x_1, \\\\dots, x_n] / I(Y).$$\\n\\nSince $I(Y)$ is a radical
        ideal, $A(Y)$ is a finitely generated *reduced* $k$-algebra (a ring with no
        non-zero nilpotent elements). If $Y$ is an affine variety, then $I(Y)$ is
        a prime ideal, so $A(Y)$ is an integral domain. Furthermore, by Hilbert's
        Nullstellensatz, the closed subsets of $Y$ correspond bijectively to radical
        ideals of $A(Y)$, and the points of $Y$ correspond bijectively to maximal
        ideals of $A(Y)$.\\n\\nElements of $A(Y)$ represent polynomial functions restricted
        to $Y$. However, to obtain a notion of \\\"regular function\\\" that is local
        in nature (and extends naturally to quasi-affine and projective varieties),
        we define regularity locally via rational expressions.\\n\\n**Definition 1.3.2.**
        Let $Y \\\\subseteq \\\\mathbb{A}^n_k$ be a quasi-affine variety (an open
        subset of an affine variety $\\\\overline{Y}$). A function $f: Y \\\\to k$
        is *regular at a point $P \\\\in Y$* if there exists an open neighborhood
        $U$ of $P$ in $Y$ and polynomials $g, h \\\\in k[x_1, \\\\dots, x_n]$ such
        that for all $Q \\\\in U$, $h(Q) \\\\neq 0$ and $f(Q) = g(Q)/h(Q)$. We say
        that $f$ is *regular on $Y$* if it is regular at every point of $Y$. The ring
        of all regular functions on $Y$ is denoted $\\\\mathcal{O}(Y)$.\\n\\n**Lemma
        1.3.3.** *A regular function $f: Y \\\\to k$ on a quasi-affine variety $Y$
        is continuous when $k$ is identified with $\\\\mathbb{A}^1_k$ endowed with
        the Zariski topology.*\\n\\n*Proof.* Since the closed subsets of $\\\\mathbb{A}^1_k$
        are $\\\\mathbb{A}^1_k$ and finite sets of points, and since finite unions
        of closed sets are closed, it suffices to show that $f^{-1}(\\\\{a\\\\})$
        is closed in $Y$ for every $a \\\\in k$. Replacing $f$ by $f - a$, we need
        only show that $Z_Y(f) = \\\\{P \\\\in Y \\\\mid f(P) = 0\\\\}$ is closed
        in $Y$, or equivalently, that $Y \\\\setminus Z_Y(f)$ is open in $Y$.\\n\\nLet
        $P \\\\in Y \\\\setminus Z_Y(f)$, so $f(P) \\\\neq 0$. Since $f$ is regular
        at $P$, there is an open neighborhood $U \\\\subseteq Y$ of $P$ and polynomials
        $g, h \\\\in k[x_1, \\\\dots, x_n]$ such that $h$ vanishes nowhere on $U$
        and $f = g/h$ on $U$. Let $V = U \\\\setminus Z(g) = U \\\\cap (\\\\mathbb{A}^n_k
        \\\\setminus Z(g))$. Then $V$ is open in $Y$, $P \\\\in V$ (since $g(P) =
        f(P)h(P) \\\\neq 0$), and for all $Q \\\\in V$, $f(Q) = g(Q)/h(Q) \\\\neq
        0$. Thus $V \\\\subseteq Y \\\\setminus Z_Y(f)$, proving $Y \\\\setminus Z_Y(f)$
        is open. $\\\\blacksquare$\\n\\nBecause $Y$ is irreducible, every non-empty
        open subset $U \\\\subseteq Y$ is dense in $Y$. By Lemma 1.3.3, if two regular
        functions $f_1, f_2 \\\\in \\\\mathcal{O}(Y)$ agree on a non-empty open subset
        $U \\\\subseteq Y$, then the closed set $(f_1 - f_2)^{-1}(0)$ contains the
        dense set $U$ and therefore must be all of $Y$; thus $f_1 = f_2$ on $Y$. This
        observation leads us to the concept of rational functions and local rings.\\n\\n**Definition
        1.3.4.** Let $Y$ be a quasi-affine variety.\\n1. For a point $P \\\\in Y$,
        consider pairs $(U, f)$ where $U \\\\subseteq Y$ is an open neighborhood of
        $P$ and $f \\\\in \\\\mathcal{O}(U)$. We declare $(U, f) \\\\sim (V, g)$ if
        $f = g$ on $U \\\\cap V$. An equivalence class of such pairs is called a *germ
        of a regular function at $P$*. The set of all germs at $P$ forms a $k$-algebra
        denoted $\\\\mathcal{O}_{Y,P}$ (or $\\\\mathcal{O}_P$), called the *local
        ring of $Y$ at $P$*.\\n2. Consider pairs $(U, f)$ where $U \\\\subseteq Y$
        is an arbitrary non-empty open subset and $f \\\\in \\\\mathcal{O}(U)$, with
        the same equivalence relation $(U, f) \\\\sim (V, g)$ if $f = g$ on $U \\\\cap
        V$ (which is non-empty by irreducibility of $Y$). The set of equivalence classes
        forms a field $K(Y)$ (or $k(Y)$), called the *function field* of $Y$. Elements
        of $K(Y)$ are called *rational functions* on $Y$.\\n\\nNotice that for every
        non-empty open $U \\\\subseteq Y$ and every $P \\\\in U$, there are canonical
        injective $k$-algebra homomorphisms\\n$$\\\\mathcal{O}(Y) \\\\hookrightarrow
        \\\\mathcal{O}(U) \\\\hookrightarrow \\\\mathcal{O}_{Y,P} \\\\hookrightarrow
        K(Y).$$\\n\\n**Theorem 1.3.5.** *Let $Y \\\\subseteq \\\\mathbb{A}^n_k$ be
        an affine variety with affine coordinate ring $A(Y)$. Then:*\\n1. $\\\\mathcal{O}(Y)
        \\\\cong A(Y)$ *as $k$-algebras.*\\n2. *For each point $P \\\\in Y$, let $\\\\mathfrak{m}_P
        = \\\\{f \\\\in A(Y) \\\\mid f(P) = 0\\\\}$ be the maximal ideal of $P$ in
        $A(Y)$. Then $\\\\mathcal{O}_{Y,P} \\\\cong A(Y)_{\\\\mathfrak{m}_P}$, the
        localization of $A(Y)$ at $\\\\mathfrak{m}_P$. In particular, $\\\\mathcal{O}_{Y,P}$
        is a Noetherian local domain of Krull dimension equal to $\\\\dim Y$.*\\n3.
        $K(Y)$ *is isomorphic to the field of fractions of $A(Y)$.*\\n\\n*Proof.*
        We first establish (2). Every element of the localization $A(Y)_{\\\\mathfrak{m}_P}$
        is a fraction $g/h$ with $g, h \\\\in A(Y)$ and $h \\\\notin \\\\mathfrak{m}_P$,
        meaning $h(P) \\\\neq 0$. In the open neighborhood $U = Y \\\\setminus Z(h)$
        of $P$, $g/h$ defines a regular function, giving a canonical $k$-algebra homomorphism
        $\\\\psi: A(Y)_{\\\\mathfrak{m}_P} \\\\to \\\\mathcal{O}_{Y,P}$. If $\\\\psi(g/h)
        = 0$, then $g/h = 0$ on some non-empty open $V \\\\subseteq U$, so $g$ vanishes
        on $V$. Since $Y$ is irreducible, $\\\\overline{V} = Y$, so $g$ vanishes on
        all of $Y$, meaning $g = 0$ in $A(Y)$. Thus $\\\\psi$ is injective. Conversely,
        any germ in $\\\\mathcal{O}_{Y,P}$ is represented on some neighborhood of
        $P$ by a quotient of polynomials $G/H$ with $H(P) \\\\neq 0$. Passing to their
        images $\\\\bar{G}, \\\\bar{H} \\\\in A(Y)$, we have $\\\\bar{H} \\\\notin
        \\\\mathfrak{m}_P$ and $\\\\psi(\\\\bar{G}/\\\\bar{H})$ equals the given germ.
        Thus $\\\\psi$ is an isomorphism.\\n\\nStatement (3) follows immediately from
        (2): any rational function on $Y$ is regular at some point $P \\\\in Y$, so
        $K(Y) = \\\\bigcup_{P \\\\in Y} \\\\mathcal{O}_{Y,P}$ sits inside the field
        of fractions $\\\\operatorname{Frac}(A(Y))$ and contains $A(Y)$, hence equals
        $\\\\operatorname{Frac}(A(Y))$.\\n\\nFinally, we prove (1). Clearly there
        is an injective homomorphism $\\\\alpha: A(Y) \\\\hookrightarrow \\\\mathcal{O}(Y)$
        sending a polynomial coset to the function it defines on $Y$. Through the
        embeddings into $K(Y) = \\\\operatorname{Frac}(A(Y))$, we can identify both
        $A(Y)$ and $\\\\mathcal{O}(Y)$ with subrings of $K(Y)$. Specifically, a rational
        function $f \\\\in K(Y)$ belongs to $\\\\mathcal{O}(Y)$ if and only if it
        is regular at every point $P \\\\in Y$, which means\\n$$\\\\mathcal{O}(Y)
        = \\\\bigcap_{P \\\\in Y} \\\\mathcal{O}_{Y,P} = \\\\bigcap_{P \\\\in Y} A(Y)_{\\\\mathfrak{m}_P}$$\\ninside
        $K(Y)$. Let $f \\\\in \\\\bigcap_{P \\\\in Y} A(Y)_{\\\\mathfrak{m}_P}$. Consider
        the *conductor ideal* of $f$ in $A(Y)$:\\n$$\\\\mathfrak{a} = \\\\{h \\\\in
        A(Y) \\\\mid hf \\\\in A(Y)\\\\}.$$\\nClearly $\\\\mathfrak{a}$ is an ideal
        of $A(Y)$. For each $P \\\\in Y$, since $f \\\\in A(Y)_{\\\\mathfrak{m}_P}$,
        we can write $f = g_P / h_P$ with $g_P, h_P \\\\in A(Y)$ and $h_P(P) \\\\neq
        0$. Thus $h_P \\\\in \\\\mathfrak{a}$ and $h_P \\\\notin \\\\mathfrak{m}_P$.
        This implies that $\\\\mathfrak{a}$ is not contained in $\\\\mathfrak{m}_P$
        for any $P \\\\in Y$. By the Weak Nullstellensatz (transferred to the quotient
        ring $A(Y)$), every maximal ideal of $A(Y)$ is of the form $\\\\mathfrak{m}_P$
        for some $P \\\\in Y$. Since $\\\\mathfrak{a}$ is not contained in any maximal
        ideal of $A(Y)$, we must have $\\\\mathfrak{a} = A(Y)$. Therefore $1 \\\\in
        \\\\mathfrak{a}$, so $f = 1 \\\\cdot f \\\\in A(Y)$. Thus $\\\\mathcal{O}(Y)
        = A(Y)$. $\\\\blacksquare$\\n\\nWe can now define morphisms between varieties
        and establish the fundamental categorical equivalence of affine algebraic
        geometry.\\n\\n**Definition 1.3.6.** Let $X$ and $Y$ be two varieties (affine
        or quasi-affine). A *morphism* $\\\\varphi: X \\\\to Y$ is a continuous map
        such that for every open subset $V \\\\subseteq Y$ and every regular function
        $f \\\\in \\\\mathcal{O}(V)$, the composition $f \\\\circ \\\\varphi: \\\\varphi^{-1}(V)
        \\\\to k$ is a regular function in $\\\\mathcal{O}(\\\\varphi^{-1}(V))$. An
        *isomorphism* is a morphism $\\\\varphi: X \\\\to Y$ that admits an inverse
        morphism $\\\\psi: Y \\\\to X$ with $\\\\psi \\\\circ \\\\varphi = \\\\operatorname{id}_X$
        and $\\\\varphi \\\\circ \\\\psi = \\\\operatorname{id}_Y$.\\n\\n**Theorem
        1.3.7 (Equivalence of Categories for Affine Varieties).** *Let $X \\\\subseteq
        \\\\mathbb{A}^n_k$ and $Y \\\\subseteq \\\\mathbb{A}^m_k$ be affine varieties.*\\n1.
        *A map of sets $\\\\varphi: X \\\\to Y$ is a morphism of varieties if and
        only if there exist polynomials $f_1, \\\\dots, f_m \\\\in k[x_1, \\\\dots,
        x_n]$ such that $\\\\varphi(P) = (f_1(P), \\\\dots, f_m(P))$ for all $P \\\\in
        X$.*\\n2. *For any morphism $\\\\varphi: X \\\\to Y$, composition with $\\\\varphi$
        induces a $k$-algebra homomorphism $\\\\varphi^*: A(Y) \\\\to A(X)$ given
        by $g \\\\mapsto g \\\\circ \\\\varphi$. The assignment $\\\\varphi \\\\mapsto
        \\\\varphi^*$ gives a bijection*\\n$$\\\\operatorname{Hom}_{\\\\mathfrak{Var}}(X,
        Y) \\\\xrightarrow{\\\\sim} \\\\operatorname{Hom}_{k\\\\text{-}\\\\mathfrak{Alg}}(A(Y),
        A(X)).$$\\n3. *The functor $X \\\\mapsto A(X)$ defines an equivalence of categories
        between the category of affine varieties over $k$ and the opposite category
        of finitely generated integral domains over $k$ (and similarly between affine
        algebraic sets and finitely generated reduced $k$-algebras).*\\n\\n*Proof.*
        (1) Suppose $\\\\varphi: X \\\\to Y$ is a morphism. Let $y_1, \\\\dots, y_m
        \\\\in A(Y) = \\\\mathcal{O}(Y)$ be the coordinate functions on $Y \\\\subseteq
        \\\\mathbb{A}^m_k$. By Definition 1.3.6 applied to $V = Y$, the functions
        $\\\\varphi_i = y_i \\\\circ \\\\varphi$ must belong to $\\\\mathcal{O}(X)
        = A(X)$. Thus each $\\\\varphi_i$ is the restriction to $X$ of a polynomial
        $f_i \\\\in k[x_1, \\\\dots, x_n]$, so $\\\\varphi(P) = (f_1(P), \\\\dots,
        f_m(P))$ for all $P \\\\in X$.\\n\\nConversely, suppose $\\\\varphi(P) = (f_1(P),
        \\\\dots, f_m(P))$ for $f_i \\\\in k[x_1, \\\\dots, x_n]$. For any closed
        subset $Z(\\\\mathfrak{b}) \\\\subseteq Y$ defined by an ideal $\\\\mathfrak{b}
        \\\\subseteq k[y_1, \\\\dots, y_m]$, a point $P \\\\in X$ lies in $\\\\varphi^{-1}(Z(\\\\mathfrak{b}))$
        if and only if $g(f_1(P), \\\\dots, f_m(P)) = 0$ for all $g \\\\in \\\\mathfrak{b}$.
        Thus $\\\\varphi^{-1}(Z(\\\\mathfrak{b}))$ is closed in $X$, so $\\\\varphi$
        is continuous. Moreover, if $h \\\\in \\\\mathcal{O}(V)$ is regular at $Q
        = \\\\varphi(P) \\\\in V$, then near $Q$, $h = G(y_1, \\\\dots, y_m)/H(y_1,
        \\\\dots, y_m)$ with $H(Q) \\\\neq 0$. Then near $P$ in $\\\\varphi^{-1}(V)$,
        $(h \\\\circ \\\\varphi)(P') = G(f_1(P'), \\\\dots, f_m(P')) / H(f_1(P'),
        \\\\dots, f_m(P'))$, which is clearly regular at $P$. Thus $\\\\varphi$ is
        a morphism.\\n\\n(2) Let $\\\\alpha: A(Y) \\\\to A(X)$ be a $k$-algebra homomorphism.
        Let $\\\\bar{y}_1, \\\\dots, \\\\bar{y}_m \\\\in A(Y)$ be the images of the
        coordinate variables of $\\\\mathbb{A}^m_k$. For each $i$, choose a polynomial
        $f_i \\\\in k[x_1, \\\\dots, x_n]$ whose image in $A(X)$ is $\\\\alpha(\\\\bar{y}_i)$.
        This defines a polynomial map $\\\\varphi = (f_1, \\\\dots, f_m): \\\\mathbb{A}^n_k
        \\\\to \\\\mathbb{A}^m_k$. If $g \\\\in I(Y) \\\\subseteq k[y_1, \\\\dots,
        y_m]$, then $\\\\bar{g} = 0$ in $A(Y)$, so $g(\\\\alpha(\\\\bar{y}_1), \\\\dots,
        \\\\alpha(\\\\bar{y}_m)) = \\\\alpha(\\\\bar{g}) = 0$ in $A(X)$. This means
        $g(f_1, \\\\dots, f_m) \\\\in I(X)$, so for every $P \\\\in X$, $g(\\\\varphi(P))
        = 0$. Therefore $\\\\varphi(X) \\\\subseteq Z(I(Y)) = Y$, defining a morphism
        $\\\\varphi: X \\\\to Y$ with $\\\\varphi^*(\\\\bar{y}_i) = \\\\bar{y}_i \\\\circ
        \\\\varphi = \\\\bar{f}_i = \\\\alpha(\\\\bar{y}_i)$. Since the $\\\\bar{y}_i$
        generate $A(Y)$ as a $k$-algebra, $\\\\varphi^* = \\\\alpha$. Uniqueness is
        clear since $\\\\varphi$ is completely determined by its coordinate functions
        $\\\\varphi^*(\\\\bar{y}_i)$.\\n\\n(3) Part (2) proves that the contravariant
        functor $X \\\\mapsto A(X)$ is fully faithful. To show it is essentially surjective,
        let $R$ be any finitely generated integral domain over $k$. Choose generators
        $a_1, \\\\dots, a_n$ of $R$ as a $k$-algebra, giving a surjective $k$-algebra
        homomorphism $\\\\pi: k[x_1, \\\\dots, x_n] \\\\twoheadrightarrow R$ sending
        $x_i \\\\mapsto a_i$. Since $R$ is an integral domain, $\\\\mathfrak{p} =
        \\\\ker(\\\\pi)$ is a prime ideal in $k[x_1, \\\\dots, x_n]$. By Theorem 1.2.5,
        $X = Z(\\\\mathfrak{p}) \\\\subseteq \\\\mathbb{A}^n_k$ is an affine variety
        with $I(X) = \\\\mathfrak{p}$, and hence $A(X) = k[x_1, \\\\dots, x_n]/\\\\mathfrak{p}
        \\\\cong R$. $\\\\blacksquare$\\n\\n---\\n\\n### 1.4 Rational Maps and Birational
        Equivalence\\n\\nMany natural geometric constructions\u2014such as projecting
        from a point or blowing up a subvariety\u2014yield maps that are defined only
        on a dense open subset.\\n\\n**Definition 1.4.1.** Let $X$ and $Y$ be varieties.
        A *rational map* $\\\\varphi: X \\\\dashrightarrow Y$ is an equivalence class
        of pairs $(U, \\\\varphi_U)$ where $U \\\\subseteq X$ is a non-empty open
        subset and $\\\\varphi_U: U \\\\to Y$ is a morphism of varieties, under the
        equivalence relation $(U, \\\\varphi_U) \\\\sim (V, \\\\varphi_V)$ if $\\\\varphi_U|_{U
        \\\\cap V} = \\\\varphi_V|_{U \\\\cap V}$.\\n\\nA rational map $\\\\varphi:
        X \\\\dashrightarrow Y$ is called *dominant* if for some (and hence every)
        representative $(U, \\\\varphi_U)$, the image $\\\\varphi_U(U)$ is dense in
        $Y$.\\n\\nIf $\\\\varphi: X \\\\dashrightarrow Y$ and $\\\\psi: Y \\\\dashrightarrow
        Z$ are dominant rational maps represented by $(U, \\\\varphi_U)$ and $(V,
        \\\\psi_V)$, then since $\\\\varphi_U(U)$ is dense in $Y$ and $V$ is non-empty
        open in $Y$, the intersection $\\\\varphi_U(U) \\\\cap V$ is non-empty. Consequently,
        $W = \\\\varphi_U^{-1}(V) \\\\subseteq U$ is a non-empty open subset of $X$,
        and the composition $\\\\psi_V \\\\circ \\\\varphi_U|_W: W \\\\to Z$ is a
        dominant morphism. Thus, varieties over $k$ together with dominant rational
        maps form a category.\\n\\n**Definition 1.4.2.** A *birational map* $\\\\varphi:
        X \\\\dashrightarrow Y$ is a rational map which is an isomorphism in the category
        of varieties and dominant rational maps; that is, $\\\\varphi$ is dominant
        and admits a dominant rational map $\\\\psi: Y \\\\dashrightarrow X$ such
        that $\\\\psi \\\\circ \\\\varphi = \\\\operatorname{id}_X$ and $\\\\varphi
        \\\\circ \\\\psi = \\\\operatorname{id}_Y$ as rational maps. Two varieties
        $X$ and $Y$ are *birationally equivalent* (or *birational*) if there exists
        a birational map between them.\\n\\n**Theorem 1.4.3.** *Let $X$ and $Y$ be
        varieties over $k$.*\\n1. *Every dominant rational map $\\\\varphi: X \\\\dashrightarrow
        Y$ induces a $k$-algebra homomorphism of function fields $\\\\varphi^*: K(Y)
        \\\\to K(X)$. This assignment induces a bijection between the set of dominant
        rational maps from $X$ to $Y$ and the set of $k$-algebra homomorphisms from
        $K(Y)$ to $K(X)$.*\\n2. *For any two varieties $X$ and $Y$, the following
        conditions are equivalent:*\\n   *(a) $X$ and $Y$ are birationally equivalent.*\\n
        \  *(b) There exist non-empty open subsets $U \\\\subseteq X$ and $V \\\\subseteq
        Y$ such that $U$ is isomorphic to $V$ as varieties.*\\n   *(c) $K(X) \\\\cong
        K(Y)$ as $k$-algebras.*\\n3. *The functor $X \\\\mapsto K(X)$ gives a contravariant
        equivalence of categories between the category of varieties over $k$ with
        dominant rational maps and the category of finitely generated field extensions
        of $k$.*\\n\\n*Proof.* Since every variety contains a non-empty open affine
        subset, and replacing a variety by a non-empty open subset changes neither
        its rational maps nor its function field, we may assume without loss of generality
        that $X \\\\subseteq \\\\mathbb{A}^n_k$ and $Y \\\\subseteq \\\\mathbb{A}^m_k$
        are affine varieties.\\n\\n(1) Let $\\\\varphi: X \\\\dashrightarrow Y$ be
        a dominant rational map represented by $\\\\varphi_U: U \\\\to Y$. If $(V,
        g) \\\\in K(Y)$ is a rational function on $Y$, then since $\\\\varphi_U(U)$
        is dense in $Y$, $\\\\varphi_U^{-1}(V)$ is a non-empty open subset of $U \\\\subseteq
        X$, and $g \\\\circ \\\\varphi_U$ is regular on $\\\\varphi_U^{-1}(V)$. This
        defines $\\\\varphi^*(g) \\\\in K(X)$.\\n\\nConversely, let $\\\\theta: K(Y)
        \\\\to K(X)$ be a $k$-algebra homomorphism. Let $y_1, \\\\dots, y_m \\\\in
        A(Y) \\\\subseteq K(Y)$ be the coordinate generators of $A(Y)$. Their images
        $\\\\theta(y_1), \\\\dots, \\\\theta(y_m) \\\\in K(X)$ are rational functions
        on $X$. Thus we can write $\\\\theta(y_i) = a_i / b_i$ with $a_i, b_i \\\\in
        A(X)$ and $b_i \\\\neq 0$. Let $b = \\\\prod_{i=1}^m b_i \\\\in A(X)$, and
        consider the principal open subset $U = X \\\\setminus Z(b)$, which is a non-empty
        affine open subset of $X$ with coordinate ring $A(X)[1/b]$. Then $\\\\theta(y_i)
        \\\\in \\\\mathcal{O}(U)$ for all $i$, so $\\\\theta$ restricts to a $k$-algebra
        homomorphism $A(Y) \\\\to \\\\mathcal{O}(U) = A(U)$. By Theorem 1.3.7, this
        corresponds to a morphism $\\\\varphi_U: U \\\\to Y$. Furthermore, since $\\\\theta:
        K(Y) \\\\to K(X)$ is a homomorphism of fields, it is injective, meaning the
        restriction $A(Y) \\\\to A(U)$ is injective. If $\\\\varphi_U(U)$ were contained
        in a proper closed subset $Z(h) \\\\subsetneq Y$ for some $0 \\\\neq h \\\\in
        A(Y)$, then $\\\\theta(h) = h \\\\circ \\\\varphi_U = 0$, contradicting the
        injectivity of $\\\\theta$. Hence $\\\\varphi_U$ is dominant.\\n\\n(2) (a)
        $\\\\iff$ (c) follows immediately from the categorical equivalence in (1).
        Clearly (b) $\\\\implies$ (a). To show (a) $\\\\implies$ (b), suppose $\\\\varphi:
        X \\\\dashrightarrow Y$ and $\\\\psi: Y \\\\dashrightarrow X$ are mutually
        inverse birational maps represented by morphisms $\\\\varphi_U: U \\\\to Y$
        and $\\\\psi_V: V \\\\to X$. Then $\\\\psi \\\\circ \\\\varphi = \\\\operatorname{id}_X$
        means that on the non-empty open subset $U' = \\\\varphi_U^{-1}(V) \\\\subseteq
        U$, the composition $\\\\psi_V \\\\circ \\\\varphi_U|_{U'}$ equals the inclusion
        $U' \\\\hookrightarrow X$. Similarly, on $V' = \\\\psi_V^{-1}(U) \\\\subseteq
        V$, $\\\\varphi_U \\\\circ \\\\psi_V|_{V'}$ equals the inclusion $V' \\\\hookrightarrow
        Y$. Let $U'' = \\\\varphi_U^{-1}(V') \\\\cap U'$ and $V'' = \\\\psi_V^{-1}(U')
        \\\\cap V'$. For $P \\\\in U''$, $\\\\varphi_U(P) \\\\in V'$ and $\\\\psi_V(\\\\varphi_U(P))
        = P \\\\in U'$, so $\\\\varphi_U(P) \\\\in \\\\psi_V^{-1}(U') \\\\cap V' =
        V''$. Thus $\\\\varphi_U$ maps $U''$ into $V''$, and symmetrically $\\\\psi_V$
        maps $V''$ into $U''$. These restricted morphisms are mutually inverse isomorphisms
        between the open varieties $U''$ and $V''$.\\n\\n(3) Fully faithfulness is
        established in (1). For essential surjectivity, if $K$ is a finitely generated
        field extension of $k$ with generators $\\\\alpha_1, \\\\dots, \\\\alpha_n$,
        then the sub-$k$-algebra $R = k[\\\\alpha_1, \\\\dots, \\\\alpha_n] \\\\subseteq
        K$ is a finitely generated integral domain over $k$ with $\\\\operatorname{Frac}(R)
        = K$. By Theorem 1.3.7(3), $R \\\\cong A(X)$ for some affine variety $X$,
        and hence $K \\\\cong K(X)$. $\\\\blacksquare$\\n\\n---\\n\\n### 1.5 Projective
        Varieties\\n\\nAffine varieties fail to be \\\"compact\\\" in any reasonable
        geometric sense; for example, two distinct lines in $\\\\mathbb{A}^2_k$ may
        be parallel and fail to intersect. We remedy this by embedding affine space
        into projective space.\\n\\n**Definition 1.5.1.** The *projective $n$-space*
        over $k$, denoted $\\\\mathbb{P}^n_k$ (or $\\\\mathbb{P}^n$), is the set of
        equivalence classes of $(n+1)$-tuples $(a_0, a_1, \\\\dots, a_n) \\\\in \\\\mathbb{A}^{n+1}_k
        \\\\setminus \\\\{(0, \\\\dots, 0)\\\\}$ under the equivalence relation\\n$$(a_0,
        a_1, \\\\dots, a_n) \\\\sim (\\\\lambda a_0, \\\\lambda a_1, \\\\dots, \\\\lambda
        a_n) \\\\quad \\\\text{for all } \\\\lambda \\\\in k^\\\\times = k \\\\setminus
        \\\\{0\\\\}.$$\\nThe equivalence class of $(a_0, \\\\dots, a_n)$ is denoted
        $[a_0 : a_1 : \\\\dots : a_n]$, and $a_0, \\\\dots, a_n$ are called *homogeneous
        coordinates* of the point.\\n\\nLet $S = k[x_0, x_1, \\\\dots, x_n]$ be the
        polynomial ring in $n+1$ variables. We grade $S$ by total degree: $S = \\\\bigoplus_{d
        \\\\ge 0} S_d$, where $S_d$ is the $k$-vector space spanned by all monomials
        $x_0^{i_0} \\\\cdots x_n^{i_n}$ of total degree $i_0 + \\\\dots + i_n = d$.
        Elements of $S_d$ are called *homogeneous polynomials* (or *forms*) of degree
        $d$.\\n\\nAlthough a polynomial $f \\\\in S$ does not define a well-defined
        function on $\\\\mathbb{P}^n_k$, if $f \\\\in S_d$ is homogeneous of degree
        $d$, it satisfies the Euler scaling identity\\n$$f(\\\\lambda a_0, \\\\dots,
        \\\\lambda a_n) = \\\\lambda^d f(a_0, \\\\dots, a_n) \\\\quad \\\\text{for
        all } \\\\lambda \\\\in k^\\\\times.$$\\nConsequently, the condition $f(a_0,
        \\\\dots, a_n) = 0$ is independent of the choice of homogeneous coordinates
        for a point $P = [a_0 : \\\\dots : a_n] \\\\in \\\\mathbb{P}^n_k$.\\n\\n**Definition
        1.5.2.** An ideal $\\\\mathfrak{a} \\\\subseteq S$ is called *homogeneous*
        if it can be generated by homogeneous polynomials, or equivalently, if $\\\\mathfrak{a}
        = \\\\bigoplus_{d \\\\ge 0} (\\\\mathfrak{a} \\\\cap S_d)$. For any subset
        $T \\\\subseteq \\\\bigcup_{d \\\\ge 0} S_d$ of homogeneous polynomials, we
        define its projective zero locus\\n$$Z_+(T) = \\\\{P \\\\in \\\\mathbb{P}^n_k
        \\\\mid f(P) = 0 \\\\text{ for all } f \\\\in T\\\\}.$$\\nSubsets of $\\\\mathbb{P}^n_k$
        of the form $Z_+(T)$ are called *projective algebraic sets*. They form the
        closed sets of the *Zariski topology* on $\\\\mathbb{P}^n_k$. An irreducible
        projective algebraic set is called a *projective variety*, and an open subset
        of a projective variety is called a *quasi-projective variety*.\\n\\nConversely,
        for any subset $Y \\\\subseteq \\\\mathbb{P}^n_k$, the *homogeneous ideal
        of $Y$*, denoted $I_+(Y)$, is the ideal in $S$ generated by all homogeneous
        polynomials $f \\\\in S$ that vanish at every point of $Y$.\\n\\nNotice that
        the homogeneous ideal $S_+ = \\\\bigoplus_{d \\\\ge 1} S_d = (x_0, x_1, \\\\dots,
        x_n)$ has $Z_+(S_+) = \\\\varnothing$, because the origin $(0, \\\\dots, 0)$
        is excluded from $\\\\mathbb{P}^n_k$. For this reason, $S_+$ is called the
        *irrelevant maximal ideal* of $S$.\\n\\n**Theorem 1.5.3 (Projective Nullstellensatz).**
        *Let $\\\\mathfrak{a} \\\\subseteq S = k[x_0, \\\\dots, x_n]$ be a homogeneous
        ideal.*\\n1. $Z_+(\\\\mathfrak{a}) = \\\\varnothing$ *if and only if $\\\\sqrt{\\\\mathfrak{a}}$
        contains the irrelevant ideal $S_+ = (x_0, \\\\dots, x_n)$ (which is equivalent
        to saying that $\\\\mathfrak{a} \\\\supseteq S_d$ for all sufficiently large
        $d$).*\\n2. *If $Z_+(\\\\mathfrak{a}) \\\\neq \\\\varnothing$, then $I_+(Z_+(\\\\mathfrak{a}))
        = \\\\sqrt{\\\\mathfrak{a}}$.*\\n\\n*Proof.* Let $\\\\pi: \\\\mathbb{A}^{n+1}_k
        \\\\setminus \\\\{0\\\\} \\\\to \\\\mathbb{P}^n_k$ be the canonical projection
        $(a_0, \\\\dots, a_n) \\\\mapsto [a_0 : \\\\dots : a_n]$. For any projective
        algebraic set $Y = Z_+(\\\\mathfrak{a}) \\\\subseteq \\\\mathbb{P}^n_k$, its
        *affine cone* is the affine algebraic set $C(Y) = \\\\pi^{-1}(Y) \\\\cup \\\\{0\\\\}
        = Z(\\\\mathfrak{a}) \\\\subseteq \\\\mathbb{A}^{n+1}_k$.\\n\\n(1) We have
        $Z_+(\\\\mathfrak{a}) = \\\\varnothing$ in $\\\\mathbb{P}^n_k$ if and only
        if the affine zero locus $Z(\\\\mathfrak{a}) \\\\subseteq \\\\mathbb{A}^{n+1}_k$
        is contained in $\\\\{0\\\\}$. By the affine Nullstellensatz (Theorem 1.2.4),
        this holds if and only if\\n$$\\\\sqrt{\\\\mathfrak{a}} = I(Z(\\\\mathfrak{a}))
        \\\\supseteq I(\\\\{0\\\\}) = (x_0, x_1, \\\\dots, x_n) = S_+.$$\\nSince $S_+$
        is finitely generated by $x_0, \\\\dots, x_n$, $S_+ \\\\subseteq \\\\sqrt{\\\\mathfrak{a}}$
        if and only if $x_i^m \\\\in \\\\mathfrak{a}$ for some $m \\\\ge 1$ and all
        $0 \\\\le i \\\\le n$, which forces $S_d \\\\subseteq \\\\mathfrak{a}$ for
        all $d \\u003e (n+1)(m-1)$.\\n\\n(2) Suppose $Z_+(\\\\mathfrak{a}) \\\\neq
        \\\\varnothing$. Then $Z(\\\\mathfrak{a}) \\\\subseteq \\\\mathbb{A}^{n+1}_k$
        contains points other than $0$, and since $\\\\mathfrak{a}$ is homogeneous,
        $Z(\\\\mathfrak{a})$ is closed under scalar multiplication and hence contains
        $0$. Therefore $Z(\\\\mathfrak{a}) = \\\\pi^{-1}(Z_+(\\\\mathfrak{a})) \\\\cup
        \\\\{0\\\\}$. If $f \\\\in S_d$ is a homogeneous polynomial of degree $d \\\\ge
        1$, then $f$ vanishes on $Z_+(\\\\mathfrak{a})$ if and only if $f$ vanishes
        on $\\\\pi^{-1}(Z_+(\\\\mathfrak{a})) \\\\cup \\\\{0\\\\} = Z(\\\\mathfrak{a})$
        (for $d=0$, a non-zero constant vanishes nowhere since $Z_+(\\\\mathfrak{a})
        \\\\neq \\\\varnothing$). Since both $I_+(Z_+(\\\\mathfrak{a}))$ and $I(Z(\\\\mathfrak{a}))
        = \\\\sqrt{\\\\mathfrak{a}}$ are homogeneous ideals, and they contain the
        exact same homogeneous polynomials, we conclude that $I_+(Z_+(\\\\mathfrak{a}))
        = I(Z(\\\\mathfrak{a})) = \\\\sqrt{\\\\mathfrak{a}}$. $\\\\blacksquare$\\n\\nProjective
        space is covered by standard affine open subsets. For each $i \\\\in \\\\{0,
        1, \\\\dots, n\\\\}$, define\\n$$U_i = \\\\{[a_0 : \\\\dots : a_n] \\\\in
        \\\\mathbb{P}^n_k \\\\mid a_i \\\\neq 0\\\\} = \\\\mathbb{P}^n_k \\\\setminus
        Z_+(x_i).$$\\nClearly $\\\\mathbb{P}^n_k = \\\\bigcup_{i=0}^n U_i$, and each
        $U_i$ is open and dense in $\\\\mathbb{P}^n_k$.\\n\\n**Proposition 1.5.4.**
        *For each $0 \\\\le i \\\\le n$, the map $\\\\varphi_i: U_i \\\\to \\\\mathbb{A}^n_k$
        defined by*\\n$$\\\\varphi_i([a_0 : \\\\dots : a_n]) = \\\\left(\\\\frac{a_0}{a_i},
        \\\\dots, \\\\frac{a_{i-1}}{a_i}, \\\\frac{a_{i+1}}{a_i}, \\\\dots, \\\\frac{a_n}{a_i}\\\\right)$$\\n*is
        a homeomorphism for the respective Zariski topologies. Consequently, for any
        projective variety $Y \\\\subseteq \\\\mathbb{P}^n_k$, the intersections $Y
        \\\\cap U_i$ form an open cover of $Y$ by affine varieties.*\\n\\n*Proof.*
        The map $\\\\varphi_i$ is clearly a bijection with inverse $\\\\psi_i: (b_1,
        \\\\dots, b_n) \\\\mapsto [b_1 : \\\\dots : b_i : 1 : b_{i+1} : \\\\dots :
        b_n]$. Let $A = k[y_1, \\\\dots, y_n]$ be the coordinate ring of $\\\\mathbb{A}^n_k$.
        The homogenization and dehomogenization operations respect zero loci: specifically,
        for any polynomial $g(y_1, \\\\dots, y_n) \\\\in A$ of degree $d$, its homogenization
        with respect to $x_i$ is\\n$$\\\\beta(g) = x_i^d g\\\\left(\\\\frac{x_0}{x_i},
        \\\\dots, \\\\frac{x_n}{x_i}\\\\right) \\\\in S_d,$$\\nand conversely, for
        any homogeneous $f \\\\in S_d$, its dehomogenization is $\\\\alpha(f) = f(y_1,
        \\\\dots, 1, \\\\dots, y_n) \\\\in A$. For any point $P \\\\in U_i$, $f(P)
        = 0$ if and only if $\\\\alpha(f)(\\\\varphi_i(P)) = 0$. Therefore, $\\\\varphi_i(Z_+(\\\\mathfrak{a})
        \\\\cap U_i) = Z(\\\\alpha(\\\\mathfrak{a}))$, showing that $\\\\varphi_i$
        maps closed subsets of $U_i$ bijectively onto closed subsets of $\\\\mathbb{A}^n_k$.
        $\\\\blacksquare$\\n\\nTo unify affine, quasi-affine, projective, and quasi-projective
        varieties under a single rigorous framework, we define regular functions on
        projective varieties via homogeneous localizations.\\n\\n**Definition 1.5.5.**
        Let $Y \\\\subseteq \\\\mathbb{P}^n_k$ be a quasi-projective variety with
        homogeneous coordinate ring $S(Y) = k[x_0, \\\\dots, x_n]/I_+(Y)$. A function
        $f: Y \\\\to k$ is *regular at $P \\\\in Y$* if there exists an open neighborhood
        $U \\\\subseteq Y$ of $P$ and homogeneous elements $g, h \\\\in S(Y)_d$ *of
        the same degree $d \\\\ge 0$* such that for all $Q \\\\in U$, $h(Q) \\\\neq
        0$ and $f(Q) = g(Q)/h(Q)$. (Notice that because $g$ and $h$ have the same
        degree $d$, the ratio $g(a_0, \\\\dots, a_n)/h(a_0, \\\\dots, a_n)$ is invariant
        under scaling $a_i \\\\mapsto \\\\lambda a_i$ and thus defines a genuine function
        on $U$.)\\n\\nChecking on the standard affine open cover $U_i$, one verifies
        immediately that this notion of regularity coincides with Definition 1.3.2
        on each affine open piece $Y \\\\cap U_i \\\\subseteq \\\\mathbb{A}^n_k$.
        Whereas an affine variety $X$ is completely recovered from its ring of global
        regular functions $\\\\mathcal{O}(X) = A(X)$, projective varieties exhibit
        the exact opposite behavior: as we will prove later via sheaf cohomology (and
        as explored in the exercises below), for any connected projective variety
        $Y$ over $k$, the only global regular functions are the constants: $\\\\mathcal{O}(Y)
        = k$.\\n\\n---\\n\\n### Exercises for Chapter 1\\n\\n**Exercise 1.1.** Let
        $Y \\\\subseteq \\\\mathbb{A}^3_k$ be the *twisted cubic curve*, defined as
        the image of the map $\\\\varphi: \\\\mathbb{A}^1_k \\\\to \\\\mathbb{A}^3_k$
        given by $t \\\\mapsto (t, t^2, t^3)$.\\n(a) Prove that $Y$ is an affine variety
        and that its ideal $I(Y) \\\\subseteq k[x, y, z]$ is generated by $y - x^2$
        and $z - x^3$.\\n(b) Prove that $Y$ is isomorphic to $\\\\mathbb{A}^1_k$.\\n(c)
        Show that $I(Y)$ can be generated by two elements, and use this to describe
        $Y$ as the intersection of two surfaces in $\\\\mathbb{A}^3_k$.\\n\\n**Exercise
        1.2.** Let $X \\\\subseteq \\\\mathbb{A}^3_k$ be the union of the three coordinate
        axes.\\n(a) Determine the ideal $I(X)$ in $k[x, y, z]$ and prove that it cannot
        be generated by fewer than three elements.\\n(b) Describe the irreducible
        components of $X$ and their corresponding minimal prime ideals in $A(X)$.\\n\\n**Exercise
        1.3.** Let $k$ be an algebraically closed field of characteristic zero, and
        consider the plane curve $Y = Z(y^2 - x^3) \\\\subseteq \\\\mathbb{A}^2_k$
        (the cuspidal cubic).\\n(a) Prove that $y^2 - x^3$ is irreducible in $k[x,
        y]$, so $Y$ is an affine variety.\\n(b) Show that the morphism $\\\\varphi:
        \\\\mathbb{A}^1_k \\\\to Y$ given by $t \\\\mapsto (t^2, t^3)$ is a bijective
        homeomorphism and a birational equivalence, but is *not* an isomorphism of
        varieties.\\n(c) Identify $A(Y)$ with the subring $k[t^2, t^3] \\\\subseteq
        k[t]$, and show that $A(Y)$ is not integrally closed in its field of fractions.\\n\\n**Exercise
        1.4.** Consider the punctured affine plane $U = \\\\mathbb{A}^2_k \\\\setminus
        \\\\{(0,0)\\\\}$.\\n(a) Prove that every regular function $f \\\\in \\\\mathcal{O}(U)$
        extends uniquely to a regular function on all of $\\\\mathbb{A}^2_k$, so $\\\\mathcal{O}(U)
        = k[x, y]$. *(Hint: Compute $\\\\mathcal{O}(D(x)) \\\\cap \\\\mathcal{O}(D(y))$
        inside $k(x,y)$ using unique factorization in $k[x,y]$.)*\\n(b) Deduce that
        the quasi-affine variety $U = \\\\mathbb{A}^2_k \\\\setminus \\\\{(0,0)\\\\}$
        is *not* isomorphic to any affine variety.\\n\\n**Exercise 1.5.** Let $Y \\\\subseteq
        \\\\mathbb{A}^n_k$ be an affine algebraic set. Prove that the following three
        conditions are equivalent:\\n(a) $Y$ is a finite set of points.\\n(b) The
        coordinate ring $A(Y)$ is finite-dimensional as a $k$-vector space.\\n(c)
        $A(Y)$ is an Artinian ring.\\nWhen these conditions hold, prove that the number
        of points in $Y$ equals $\\\\dim_k A(Y)$, and that $A(Y) \\\\cong \\\\prod_{P
        \\\\in Y} k$.\\n\\n**Exercise 1.6.** (The Segre Embedding) Define a map $\\\\sigma:
        \\\\mathbb{P}^n_k \\\\times \\\\mathbb{P}^m_k \\\\to \\\\mathbb{P}^{nm+n+m}_k$
        by sending $([a_0 : \\\\dots : a_n], [b_0 : \\\\dots : b_m])$ to the point
        with homogeneous coordinates $[z_{00} : z_{01} : \\\\dots : z_{nm}]$ where
        $z_{ij} = a_i b_j$.\\n(a) Prove that $\\\\sigma$ is well-defined and injective.\\n(b)
        Prove that the image $\\\\Sigma_{n,m} = \\\\sigma(\\\\mathbb{P}^n_k \\\\times
        \\\\mathbb{P}^m_k)$ is the projective algebraic set defined by the homogeneous
        ideal generated by all $2 \\\\times 2$ minors $z_{ij} z_{kl} - z_{il} z_{kj}$.\\n(c)
        Show that $\\\\Sigma_{n,m}$ is an irreducible projective variety. Use this
        to endow $\\\\mathbb{P}^n_k \\\\times \\\\mathbb{P}^m_k$ with the structure
        of a projective variety, and verify that for $n=m=1$, $\\\\Sigma_{1,1}$ is
        a quadric surface in $\\\\mathbb{P}^3_k$.\\n\\n**Exercise 1.7.** (The Veronese
        Embedding) Let $n, d \\\\ge 1$ be integers, and let $N = \\\\binom{n+d}{n}
        - 1$. Let $M_0, M_1, \\\\dots, M_N$ be all the monic monomials of degree $d$
        in $x_0, \\\\dots, x_n$. The *d-uple Veronese embedding* is the map $\\\\nu_d:
        \\\\mathbb{P}^n_k \\\\to \\\\mathbb{P}^N_k$ defined by $P \\\\mapsto [M_0(P)
        : M_1(P) : \\\\dots : M_N(P)]$.\\n(a) Prove that $\\\\nu_d$ is an isomorphism
        of $\\\\mathbb{P}^n_k$ onto a closed projective subvariety $V_{n,d} \\\\subseteq
        \\\\mathbb{P}^N_k$.\\n(b) Deduce that for any homogeneous polynomial $f \\\\in
        k[x_0, \\\\dots, x_n]$ of degree $d \\u003e 0$, the complement $\\\\mathbb{P}^n_k
        \\\\setminus Z_+(f)$ of the hypersurface $Z_+(f)$ is isomorphic to an affine
        variety.\\n\\n**Exercise 1.8.** (Blowing up a Point in $\\\\mathbb{A}^2_k$)
        In $\\\\mathbb{A}^2_k \\\\times \\\\mathbb{P}^1_k$ (with affine coordinates
        $(x, y)$ and homogeneous coordinates $[t : u]$), let $X$ be the closed subset
        defined by the equation $xu - yt = 0$. Let $\\\\pi: X \\\\to \\\\mathbb{A}^2_k$
        be the projection onto the first factor.\\n(a) Prove that $X$ is an irreducible
        quasi-projective variety.\\n(b) Show that $\\\\pi$ induces an isomorphism
        $X \\\\setminus \\\\pi^{-1}(\\\\{(0,0)\\\\}) \\\\xrightarrow{\\\\sim} \\\\mathbb{A}^2_k
        \\\\setminus \\\\{(0,0)\\\\}$, while the *exceptional divisor* $E = \\\\pi^{-1}(\\\\{(0,0)\\\\})$
        is isomorphic to $\\\\mathbb{P}^1_k$.\\n(c) Let $Y = Z(y^2 - x^2(x+1)) \\\\subseteq
        \\\\mathbb{A}^2_k$ be the nodal cubic curve. The *strict transform* $\\\\widetilde{Y}$
        of $Y$ is the Zariski closure of $\\\\pi^{-1}(Y \\\\setminus \\\\{(0,0)\\\\})$
        in $X$. Prove that $\\\\widetilde{Y}$ is isomorphic to $\\\\mathbb{A}^1_k$
        and that $\\\\widetilde{Y} \\\\cap E$ consists of two distinct points corresponding
        to the two tangent directions of $Y$ at $(0,0)$.\\n\\n---\\n\\n## Chapter
        2: Sheaves and Locally Ringed Spaces\\n\\nTo liberate algebraic geometry from
        a fixed ambient affine or projective space\u2014and simultaneously to allow
        geometries over arbitrary commutative rings such as $\\\\mathbb{Z}$\u2014Grothendieck
        introduced the language of schemes. The foundational apparatus underlying
        schemes is the theory of *sheaves* and *locally ringed spaces*, which allows
        global geometric objects to be constructed by gluing local algebraic data.\\n\\n---\\n\\n###
        2.1 Presheaves and the Sheaf Axiom\\n\\n**Definition 2.1.1.** Let $X$ be a
        topological space. Let $\\\\mathfrak{Top}(X)$ be the category whose objects
        are the open subsets of $X$ and whose morphisms are the inclusion maps $V
        \\\\hookrightarrow U$ whenever $V \\\\subseteq U$. A *presheaf* $\\\\mathcal{F}$
        on $X$ with values in a category $\\\\mathfrak{C}$ (typically the category
        $\\\\mathfrak{Set}$ of sets, $\\\\mathfrak{Ab}$ of abelian groups, or $\\\\mathfrak{Rings}$
        of commutative rings) is a contravariant functor $\\\\mathcal{F}: \\\\mathfrak{Top}(X)^{\\\\text{op}}
        \\\\to \\\\mathfrak{C}$.\\n\\nExplicitly, a presheaf $\\\\mathcal{F}$ of abelian
        groups on $X$ consists of:\\n1. For every open subset $U \\\\subseteq X$,
        an abelian group $\\\\mathcal{F}(U)$ (often denoted $\\\\Gamma(U, \\\\mathcal{F})$),
        whose elements are called the *sections of $\\\\mathcal{F}$ over $U$*.\\n2.
        For every inclusion of open subsets $V \\\\subseteq U$, a group homomorphism
        $\\\\rho_{U,V}: \\\\mathcal{F}(U) \\\\to \\\\mathcal{F}(V)$, called the *restriction
        map* (often written $s \\\\mapsto s|_V$), satisfying:\\n   (a) $\\\\rho_{U,U}
        = \\\\operatorname{id}_{\\\\mathcal{F}(U)}$ for all open $U \\\\subseteq X$,
        and\\n   (b) $\\\\rho_{V,W} \\\\circ \\\\rho_{U,V} = \\\\rho_{U,W}$ for all
        open subsets $W \\\\subseteq V \\\\subseteq U$.\\n\\n**Definition 2.1.2.**
        A presheaf $\\\\mathcal{F}$ (of sets, abelian groups, or rings) on a topological
        space $X$ is called a *sheaf* if it satisfies the following two local-to-global
        axioms for every open subset $U \\\\subseteq X$ and every open covering $\\\\{U_i\\\\}_{i
        \\\\in I}$ of $U$ (i.e., $U = \\\\bigcup_{i \\\\in I} U_i$):\\n1. **(Locality
        / Identity Axiom)** If $s, t \\\\in \\\\mathcal{F}(U)$ are two sections such
        that $s|_{U_i} = t|_{U_i}$ for all $i \\\\in I$, then $s = t$.\\n2. **(Gluing
        Axiom)** If we are given a family of sections $s_i \\\\in \\\\mathcal{F}(U_i)$
        for each $i \\\\in I$ such that on every overlap they agree:\\n   $$s_i|_{U_i
        \\\\cap U_j} = s_j|_{U_i \\\\cap U_j} \\\\quad \\\\text{for all } i, j \\\\in
        I,$$\\n   then there exists a section $s \\\\in \\\\mathcal{F}(U)$ such that
        $s|_{U_i} = s_i$ for all $i \\\\in I$. (By the Locality Axiom, this section
        $s$ is necessarily unique.)\\n\\nNotice that applying the Gluing Axiom to
        the empty open cover of $U = \\\\varnothing$ (where the compatibility condition
        is vacuous) implies that $\\\\mathcal{F}(\\\\varnothing)$ must be the terminal
        object of the target category (a one-point set in $\\\\mathfrak{Set}$, the
        trivial group $\\\\{0\\\\}$ in $\\\\mathfrak{Ab}$, or the zero ring $\\\\{0\\\\}$
        in $\\\\mathfrak{Rings}$).\\n\\nEquivalently, a presheaf $\\\\mathcal{F}$
        of abelian groups is a sheaf if and only if for every open subset $U \\\\subseteq
        X$ and every open cover $\\\\{U_i\\\\}_{i \\\\in I}$ of $U$, the sequence
        of abelian groups\\n$$0 \\\\longrightarrow \\\\mathcal{F}(U) \\\\xrightarrow{\\\\;\\\\alpha\\\\;}
        \\\\prod_{i \\\\in I} \\\\mathcal{F}(U_i) \\\\xrightarrow{\\\\;\\\\beta\\\\;}
        \\\\prod_{(i, j) \\\\in I \\\\times I} \\\\mathcal{F}(U_i \\\\cap U_j)$$\\nis
        exact, where $\\\\alpha(s) = (s|_{U_i})_{i \\\\in I}$ and $\\\\beta((s_i)_{i
        \\\\in I}) = (s_i|_{U_i \\\\cap U_j} - s_j|_{U_i \\\\cap U_j})_{(i,j) \\\\in
        I \\\\times I}$.\\n\\n**Definition 2.1.3.** Let $\\\\mathcal{F}$ be a presheaf
        on $X$ and let $P \\\\in X$ be a point. The *stalk* of $\\\\mathcal{F}$ at
        $P$, denoted $\\\\mathcal{F}_P$, is the direct limit (colimit) of $\\\\mathcal{F}(U)$
        over the directed system of all open neighborhoods $U$ of $P$ ordered by reverse
        inclusion:\\n$$\\\\mathcal{F}_P = \\\\varinjlim_{P \\\\in U} \\\\mathcal{F}(U).$$\\nConcretely,
        an element of $\\\\mathcal{F}_P$ is an equivalence class of pairs $(U, s)$
        where $U$ is an open neighborhood of $P$ and $s \\\\in \\\\mathcal{F}(U)$,
        under the equivalence relation $(U, s) \\\\sim (V, t)$ if there exists an
        open neighborhood $W \\\\subseteq U \\\\cap V$ of $P$ such that $s|_W = t|_W$.
        The equivalence class of $(U, s)$ is denoted $s_P \\\\in \\\\mathcal{F}_P$
        and is called the *germ* of $s$ at $P$.\\n\\n**Definition 2.1.4.** Let $\\\\mathcal{F}$
        and $\\\\mathcal{G}$ be presheaves on $X$. A *morphism of presheaves* $\\\\varphi:
        \\\\mathcal{F} \\\\to \\\\mathcal{G}$ is a natural transformation of functors;
        that is, a collection of morphisms $\\\\varphi(U): \\\\mathcal{F}(U) \\\\to
        \\\\mathcal{G}(U)$ for each open $U \\\\subseteq X$ such that for every inclusion
        $V \\\\subseteq U$, the diagram\\n$$\\\\begin{array}{ccc} \\\\mathcal{F}(U)
        & \\\\xrightarrow{\\\\varphi(U)} & \\\\mathcal{G}(U) \\\\\\\\ \\\\downarrow{\\\\scriptstyle\\\\rho^{\\\\mathcal{F}}_{U,V}}
        & & \\\\downarrow{\\\\scriptstyle\\\\rho^{\\\\mathcal{G}}_{U,V}} \\\\\\\\
        \\\\mathcal{F}(V) & \\\\xrightarrow{\\\\varphi(V)} & \\\\mathcal{G}(V) \\\\end{array}$$\\ncommutes.
        A *morphism of sheaves* is simply a morphism of the underlying presheaves.
        Any morphism $\\\\varphi: \\\\mathcal{F} \\\\to \\\\mathcal{G}$ induces a
        morphism on stalks $\\\\varphi_P: \\\\mathcal{F}_P \\\\to \\\\mathcal{G}_P$
        for each $P \\\\in X$, given by $\\\\varphi_P(s_P) = (\\\\varphi(U)(s))_P$.\\n\\nThe
        power of stalks lies in the fact that for sheaves, global isomorphisms can
        be detected entirely at the level of stalks.\\n\\n**Proposition 2.1.5.** *Let
        $\\\\varphi: \\\\mathcal{F} \\\\to \\\\mathcal{G}$ be a morphism of sheaves
        of abelian groups on a topological space $X$. Then $\\\\varphi$ is an isomorphism
        of sheaves (meaning $\\\\varphi(U): \\\\mathcal{F}(U) \\\\to \\\\mathcal{G}(U)$
        is an isomorphism for every open $U \\\\subseteq X$) if and only if the induced
        map on stalks $\\\\varphi_P: \\\\mathcal{F}_P \\\\to \\\\mathcal{G}_P$ is
        an isomorphism for every point $P \\\\in X$.*\\n\\n*Proof.* ($\\\\Rightarrow$)
        If $\\\\varphi(U)$ is an isomorphism for every open $U \\\\subseteq X$, then
        passing to the direct limit over all open neighborhoods $U$ of $P$ immediately
        shows that $\\\\varphi_P = \\\\varinjlim \\\\varphi(U)$ is an isomorphism.\\n\\n($\\\\Leftarrow$)
        Suppose $\\\\varphi_P: \\\\mathcal{F}_P \\\\to \\\\mathcal{G}_P$ is an isomorphism
        for every $P \\\\in X$. Let $U \\\\subseteq X$ be an open subset. We must
        prove that $\\\\varphi(U): \\\\mathcal{F}(U) \\\\to \\\\mathcal{G}(U)$ is
        both injective and surjective.\\n\\n*Injectivity:* Suppose $s \\\\in \\\\mathcal{F}(U)$
        satisfies $\\\\varphi(U)(s) = 0$ in $\\\\mathcal{G}(U)$. For every point $P
        \\\\in U$, we have $\\\\varphi_P(s_P) = (\\\\varphi(U)(s))_P = 0$ in $\\\\mathcal{G}_P$.
        Since $\\\\varphi_P$ is injective, $s_P = 0$ in $\\\\mathcal{F}_P$. By definition
        of the direct limit, for each $P \\\\in U$ there exists an open neighborhood
        $U_P \\\\subseteq U$ of $P$ such that $s|_{U_P} = 0$ in $\\\\mathcal{F}(U_P)$.
        The collection $\\\\{U_P\\\\}_{P \\\\in U}$ forms an open cover of $U$, and
        the section $s \\\\in \\\\mathcal{F}(U)$ restricts to $0 = 0|_{U_P}$ on every
        $U_P$. By the Locality Axiom for $\\\\mathcal{F}$, we conclude that $s = 0$
        in $\\\\mathcal{F}(U)$.\\n\\n*Surjectivity:* Let $t \\\\in \\\\mathcal{G}(U)$.
        For each point $P \\\\in U$, consider the germ $t_P \\\\in \\\\mathcal{G}_P$.
        Since $\\\\varphi_P$ is surjective, there exists a germ in $\\\\mathcal{F}_P$
        mapping to $t_P$; this germ is represented by some section $s^{(P)} \\\\in
        \\\\mathcal{F}(V_P)$ on an open neighborhood $V_P \\\\subseteq U$ of $P$.
        The equality $\\\\varphi_P((s^{(P)})_P) = t_P$ in $\\\\mathcal{G}_P$ means
        that there exists a possibly smaller open neighborhood $U_P \\\\subseteq V_P$
        of $P$ such that, after replacing $s^{(P)}$ by its restriction $s^{(P)}|_{U_P}
        \\\\in \\\\mathcal{F}(U_P)$, we have\\n$$\\\\varphi(U_P)(s^{(P)}) = t|_{U_P}
        \\\\quad \\\\text{in } \\\\mathcal{G}(U_P).$$\\nNow consider two points $P,
        Q \\\\in U$ and the restrictions of $s^{(P)}$ and $s^{(Q)}$ to the overlap
        $U_P \\\\cap U_Q$. Applying $\\\\varphi(U_P \\\\cap U_Q)$ gives\\n$$\\\\varphi(U_P
        \\\\cap U_Q)\\\\left(s^{(P)}|_{U_P \\\\cap U_Q} - s^{(Q)}|_{U_P \\\\cap U_Q}\\\\right)
        = t|_{U_P \\\\cap U_Q} - t|_{U_P \\\\cap U_Q} = 0.$$\\nSince we have already
        proven that $\\\\varphi(W)$ is injective for *every* open subset $W \\\\subseteq
        X$, applying injectivity to $W = U_P \\\\cap U_Q$ yields\\n$$s^{(P)}|_{U_P
        \\\\cap U_Q} = s^{(Q)}|_{U_P \\\\cap U_Q} \\\\quad \\\\text{for all } P, Q
        \\\\in U.$$\\nBecause $\\\\{U_P\\\\}_{P \\\\in U}$ is an open cover of $U$
        and $\\\\mathcal{F}$ is a sheaf, the Gluing Axiom guarantees the existence
        of a unique section $s \\\\in \\\\mathcal{F}(U)$ such that $s|_{U_P} = s^{(P)}$
        for all $P \\\\in U$. Finally, for every $P \\\\in U$,\\n$$(\\\\varphi(U)(s))|_{U_P}
        = \\\\varphi(U_P)(s|_{U_P}) = \\\\varphi(U_P)(s^{(P)}) = t|_{U_P}.$$\\nBy
        the Locality Axiom for the sheaf $\\\\mathcal{G}$, it follows that $\\\\varphi(U)(s)
        = t$. Thus $\\\\varphi(U)$ is surjective. $\\\\blacksquare$\\n\\n---\\n\\n###
        2.2 Sheafification and the Category of Sheaves\\n\\nMany natural algebraic
        operations on sheaves (such as taking quotients, images, or tensor products)
        produce presheaves that fail to satisfy the gluing axiom. We therefore require
        a canonical functorial procedure that turns any presheaf into a sheaf.\\n\\n**Theorem
        2.2.1 (Existence and Universal Property of Sheafification).** *Let $\\\\mathcal{F}$
        be a presheaf of sets (or abelian groups, or rings) on a topological space
        $X$. There exists a sheaf $\\\\mathcal{F}^+$ on $X$ and a morphism of presheaves
        $\\\\theta: \\\\mathcal{F} \\\\to \\\\mathcal{F}^+$ satisfying the following
        universal property: for any sheaf $\\\\mathcal{G}$ on $X$ and any morphism
        of presheaves $\\\\varphi: \\\\mathcal{F} \\\\to \\\\mathcal{G}$, there exists
        a unique morphism of sheaves $\\\\tilde{\\\\varphi}: \\\\mathcal{F}^+ \\\\to
        \\\\mathcal{G}$ such that $\\\\varphi = \\\\tilde{\\\\varphi} \\\\circ \\\\theta$.*\\n$$\\\\begin{array}{ccc}
        \\\\mathcal{F} & \\\\xrightarrow{\\\\;\\\\theta\\\\;} & \\\\mathcal{F}^+ \\\\\\\\
        & \\\\underset{\\\\varphi}{\\\\searrow} & \\\\downarrow{\\\\scriptstyle\\\\exists!\\\\,\\\\tilde{\\\\varphi}}
        \\\\\\\\ & & \\\\mathcal{G} \\\\end{array}$$\\n*Furthermore, the pair $(\\\\mathcal{F}^+,
        \\\\theta)$ is unique up to unique isomorphism, and for every point $P \\\\in
        X$, the induced map on stalks $\\\\theta_P: \\\\mathcal{F}_P \\\\to (\\\\mathcal{F}^+)_P$
        is an isomorphism.*\\n\\n*Proof.* For each open subset $U \\\\subseteq X$,
        we define $\\\\mathcal{F}^+(U)$ to be the set of all functions $s: U \\\\to
        \\\\bigsqcup_{P \\\\in U} \\\\mathcal{F}_P$ matching the following two conditions:\\n1.
        For every $P \\\\in U$, $s(P) \\\\in \\\\mathcal{F}_P$.\\n2. **(Local Representation
        by Sections)** For every $P \\\\in U$, there exists an open neighborhood $V
        \\\\subseteq U$ of $P$ and a section $t \\\\in \\\\mathcal{F}(V)$ such that
        for all $Q \\\\in V$, $s(Q) = t_Q$ in $\\\\mathcal{F}_Q$.\\n\\nFor an inclusion
        of open subsets $W \\\\subseteq U$, the restriction map $\\\\mathcal{F}^+(U)
        \\\\to \\\\mathcal{F}^+(W)$ is simply the restriction of functions $s \\\\mapsto
        s|_W$. If $\\\\mathcal{F}$ is a presheaf of abelian groups (or rings), pointwise
        addition (and multiplication) in the stalks $\\\\mathcal{F}_P$ makes $\\\\mathcal{F}^+(U)$
        an abelian group (or ring). Because the condition (2) is purely local and
        functions $U \\\\to \\\\bigsqcup_{P \\\\in U} \\\\mathcal{F}_P$ are determined
        pointwise and glue uniquely on open covers, it is immediate that $\\\\mathcal{F}^+$
        is a sheaf on $X$.\\n\\nWe define the canonical morphism of presheaves $\\\\theta:
        \\\\mathcal{F} \\\\to \\\\mathcal{F}^+$ by sending a section $t \\\\in \\\\mathcal{F}(U)$
        to the function $\\\\theta(U)(t): U \\\\to \\\\bigsqcup_{P \\\\in U} \\\\mathcal{F}_P$
        given by $P \\\\mapsto t_P$. Clearly $\\\\theta(U)(t)$ satisfies conditions
        (1) and (2) (taking $V = U$).\\n\\nNext, we prove that $\\\\theta_P: \\\\mathcal{F}_P
        \\\\to (\\\\mathcal{F}^+)_P$ is an isomorphism for every $P \\\\in X$. There
        is a natural evaluation map $\\\\mathrm{ev}_P: (\\\\mathcal{F}^+)_P \\\\to
        \\\\mathcal{F}_P$ sending the germ of a function $s \\\\in \\\\mathcal{F}^+(U)$
        (where $P \\\\in U$) to its value $s(P) \\\\in \\\\mathcal{F}_P$. For any
        germ $t_P \\\\in \\\\mathcal{F}_P$ represented by $t \\\\in \\\\mathcal{F}(U)$,
        we have $\\\\mathrm{ev}_P(\\\\theta_P(t_P)) = (\\\\theta(U)(t))(P) = t_P$,
        so $\\\\mathrm{ev}_P \\\\circ \\\\theta_P = \\\\operatorname{id}_{\\\\mathcal{F}_P}$.
        Conversely, let $s_P \\\\in (\\\\mathcal{F}^+)_P$ be represented by $s \\\\in
        \\\\mathcal{F}^+(U)$. By condition (2), there is an open neighborhood $V \\\\subseteq
        U$ of $P$ and a section $t \\\\in \\\\mathcal{F}(V)$ such that $s(Q) = t_Q
        = (\\\\theta(V)(t))(Q)$ for all $Q \\\\in V$. This means $s|_V = \\\\theta(V)(t)$
        in $\\\\mathcal{F}^+(V)$, so in the stalk $(\\\\mathcal{F}^+)_P$ we have $s_P
        = \\\\theta_P(t_P) = \\\\theta_P(\\\\mathrm{ev}_P(s_P))$. Thus $\\\\theta_P$
        and $\\\\mathrm{ev}_P$ are mutually inverse isomorphisms.\\n\\nNote also that
        if $\\\\mathcal{G}$ is *already* a sheaf, then $\\\\theta_{\\\\mathcal{G}}:
        \\\\mathcal{G} \\\\to \\\\mathcal{G}^+$ is an isomorphism of sheaves. Indeed,
        by the Locality Axiom, $\\\\theta_{\\\\mathcal{G}}(U)$ is injective; by the
        Gluing Axiom applied to the local sections $t \\\\in \\\\mathcal{G}(V)$ from
        condition (2), $\\\\theta_{\\\\mathcal{G}}(U)$ is surjective (or simply apply
        Proposition 2.1.5 since $(\\\\theta_{\\\\mathcal{G}})_P$ is an isomorphism).\\n\\nFinally,
        given a morphism of presheaves $\\\\varphi: \\\\mathcal{F} \\\\to \\\\mathcal{G}$
        where $\\\\mathcal{G}$ is a sheaf, the induced maps on stalks $\\\\varphi_P:
        \\\\mathcal{F}_P \\\\to \\\\mathcal{G}_P$ induce a morphism of sheaves $\\\\varphi^+:
        \\\\mathcal{F}^+ \\\\to \\\\mathcal{G}^+$ defined by $(\\\\varphi^+(U)(s))(P)
        = \\\\varphi_P(s(P))$. Composing with the inverse of the isomorphism $\\\\theta_{\\\\mathcal{G}}:
        \\\\mathcal{G} \\\\xrightarrow{\\\\sim} \\\\mathcal{G}^+$, we set $\\\\tilde{\\\\varphi}
        = \\\\theta_{\\\\mathcal{G}}^{-1} \\\\circ \\\\varphi^+: \\\\mathcal{F}^+
        \\\\to \\\\mathcal{G}$. Clearly $\\\\tilde{\\\\varphi} \\\\circ \\\\theta
        = \\\\varphi$. If $\\\\psi: \\\\mathcal{F}^+ \\\\to \\\\mathcal{G}$ is any
        morphism of sheaves satisfying $\\\\psi \\\\circ \\\\theta = \\\\varphi$,
        then for every $P \\\\in X$, $\\\\psi_P \\\\circ \\\\theta_P = \\\\varphi_P
        = \\\\tilde{\\\\varphi}_P \\\\circ \\\\theta_P$. Since $\\\\theta_P$ is an
        isomorphism, $\\\\psi_P = \\\\tilde{\\\\varphi}_P$ for all $P \\\\in X$, which
        forces $\\\\psi = \\\\tilde{\\\\varphi}$ because two morphisms of sheaves
        that induce the same map on all stalks are identical (for any $s \\\\in \\\\mathcal{F}^+(U)$,
        $\\\\psi(U)(s)$ and $\\\\tilde{\\\\varphi}(U)(s)$ have the same germ at every
        $P \\\\in U$, hence are equal in $\\\\mathcal{G}(U)$ by the Locality Axiom).
        $\\\\blacksquare$\\n\\n**Definition 2.2.2.** Let $\\\\varphi: \\\\mathcal{F}
        \\\\to \\\\mathcal{G}$ be a morphism of sheaves of abelian groups on $X$.\\n1.
        The *kernel* of $\\\\varphi$, denoted $\\\\ker(\\\\varphi)$, is the presheaf
        $U \\\\mapsto \\\\ker(\\\\varphi(U): \\\\mathcal{F}(U) \\\\to \\\\mathcal{G}(U))$.
        One checks directly from the left-exactness of the sheaf condition that $\\\\ker(\\\\varphi)$
        is already a sheaf.\\n2. The *image* of $\\\\varphi$, denoted $\\\\operatorname{im}(\\\\varphi)$,
        is the sheafification of the *presheaf image* $U \\\\mapsto \\\\operatorname{im}(\\\\varphi(U):
        \\\\mathcal{F}(U) \\\\to \\\\mathcal{G}(U))$. By the universal property of
        sheafification, $\\\\operatorname{im}(\\\\varphi)$ embeds canonically as a
        subsheaf of $\\\\mathcal{G}$.\\n3. For a subsheaf $\\\\mathcal{F}' \\\\subseteq
        \\\\mathcal{F}$, the *quotient sheaf* $\\\\mathcal{F}/\\\\mathcal{F}'$ is
        the sheafification of the presheaf $U \\\\mapsto \\\\mathcal{F}(U)/\\\\mathcal{F}'(U)$.
        The *cokernel* of $\\\\varphi$ is $\\\\operatorname{coker}(\\\\varphi) = \\\\mathcal{G}/\\\\operatorname{im}(\\\\varphi)$.\\n\\n**Proposition
        2.2.3.** *Let $\\\\varphi: \\\\mathcal{F} \\\\to \\\\mathcal{G}$ be a morphism
        of sheaves of abelian groups on $X$, and let $P \\\\in X$. Then:*\\n1. $(\\\\ker
        \\\\varphi)_P = \\\\ker(\\\\varphi_P: \\\\mathcal{F}_P \\\\to \\\\mathcal{G}_P)$
        *and* $(\\\\operatorname{im} \\\\varphi)_P = \\\\operatorname{im}(\\\\varphi_P:
        \\\\mathcal{F}_P \\\\to \\\\mathcal{G}_P)$.\\n2. *A sequence of sheaves of
        abelian groups $\\\\dots \\\\to \\\\mathcal{F}^{i-1} \\\\xrightarrow{d^{i-1}}
        \\\\mathcal{F}^i \\\\xrightarrow{d^i} \\\\mathcal{F}^{i+1} \\\\to \\\\dots$
        is exact (meaning $\\\\ker(d^i) = \\\\operatorname{im}(d^{i-1})$ for all $i$)
        if and only if for every $P \\\\in X$, the induced sequence of stalks $\\\\dots
        \\\\to \\\\mathcal{F}^{i-1}_P \\\\to \\\\mathcal{F}^i_P \\\\to \\\\mathcal{F}^{i+1}_P
        \\\\to \\\\dots$ is an exact sequence of abelian groups.*\\n3. *If $0 \\\\to
        \\\\mathcal{F}' \\\\to \\\\mathcal{F} \\\\to \\\\mathcal{F}'' \\\\to 0$ is
        an exact sequence of sheaves on $X$, then for every open subset $U \\\\subseteq
        X$, the sequence of sections*\\n$$0 \\\\longrightarrow \\\\mathcal{F}'(U)
        \\\\longrightarrow \\\\mathcal{F}(U) \\\\longrightarrow \\\\mathcal{F}''(U)$$\\n*is
        left-exact.*\\n\\n*Proof.* (1) Filtered direct limits of abelian groups are
        exact functors, so taking stalks commutes with presheaf kernels and presheaf
        images. Since sheafification induces an isomorphism on stalks (Theorem 2.2.1),
        $(\\\\operatorname{im} \\\\varphi)_P$ equals the stalk of the presheaf image,
        which is $\\\\operatorname{im}(\\\\varphi_P)$.\\n\\n(2) By (1), the inclusion
        $\\\\operatorname{im}(d^{i-1}) \\\\hookrightarrow \\\\ker(d^i)$ (assuming
        $d^i \\\\circ d^{i-1} = 0$) induces an isomorphism on all stalks if and only
        if $\\\\operatorname{im}(d^{i-1}_P) = \\\\ker(d^i_P)$ for all $P \\\\in X$.
        By Proposition 2.1.5, this holds if and only if $\\\\operatorname{im}(d^{i-1})
        = \\\\ker(d^i)$ as subsheaves of $\\\\mathcal{F}^i$.\\n\\n(3) By definition
        of $\\\\ker$, $\\\\mathcal{F}'(U) = \\\\ker(\\\\mathcal{F}(U) \\\\to \\\\mathcal{F}''(U))$,
        which immediately gives left-exactness on $U$. (Right-exactness fails in general;
        this failure is the genesis of sheaf cohomology in Chapter 5.) $\\\\blacksquare$\\n\\n---\\n\\n###
        2.3 Ringed Spaces and Locally Ringed Spaces\\n\\n**Definition 2.3.1.** Let
        $f: X \\\\to Y$ be a continuous map of topological spaces.\\n1. For any sheaf
        $\\\\mathcal{F}$ on $X$, the *direct image* (or *pushforward*) sheaf $f_*\\\\mathcal{F}$
        on $Y$ is defined for every open $V \\\\subseteq Y$ by\\n   $$(f_*\\\\mathcal{F})(V)
        = \\\\mathcal{F}(f^{-1}(V)).$$\\n   One checks immediately that $f_*\\\\mathcal{F}$
        is a sheaf on $Y$.\\n2. For any sheaf $\\\\mathcal{G}$ on $Y$, the *inverse
        image* sheaf $f^{-1}\\\\mathcal{G}$ on $X$ is defined to be the sheafification
        of the presheaf\\n   $$U \\\\longmapsto \\\\varinjlim_{V \\\\supseteq f(U)}
        \\\\mathcal{G}(V),$$\\n   where the direct limit runs over all open subsets
        $V \\\\subseteq Y$ containing $f(U)$.\\n\\nNotice that for every point $P
        \\\\in X$, a cofinal system of open neighborhoods of $f(P)$ in $Y$ pulls back
        to open subsets containing neighborhoods of $P$, so there is a canonical isomorphism
        of stalks $(f^{-1}\\\\mathcal{G})_P \\\\cong \\\\mathcal{G}_{f(P)}$. Moreover,
        the functors $f^{-1}$ and $f_*$ form an adjoint pair: for any sheaf $\\\\mathcal{F}$
        on $X$ and any sheaf $\\\\mathcal{G}$ on $Y$, there is a natural bijection\\n$$\\\\operatorname{Hom}_{\\\\mathfrak{Sh}(X)}(f^{-1}\\\\mathcal{G},
        \\\\mathcal{F}) \\\\xrightarrow{\\\\;\\\\sim\\\\;} \\\\operatorname{Hom}_{\\\\mathfrak{Sh}(Y)}(\\\\mathcal{G},
        f_*\\\\mathcal{F}).$$\\n\\n**Definition 2.3.2.**\\n1. A *ringed space* is
        a pair $(X, \\\\mathcal{O}_X)$ consisting of a topological space $X$ and a
        sheaf of commutative rings $\\\\mathcal{O}_X$ on $X$, called the *structure
        sheaf* of $X$.\\n2. A *morphism of ringed spaces* from $(X, \\\\mathcal{O}_X)$
        to $(Y, \\\\mathcal{O}_Y)$ is a pair $(f, f^\\\\#)$ consisting of a continuous
        map $f: X \\\\to Y$ and a morphism of sheaves of rings $f^\\\\#: \\\\mathcal{O}_Y
        \\\\to f_*\\\\mathcal{O}_X$ on $Y$.\\n3. A ringed space $(X, \\\\mathcal{O}_X)$
        is called a *locally ringed space* if for every point $P \\\\in X$, the stalk
        $\\\\mathcal{O}_{X,P}$ is a local ring (meaning it has a unique maximal ideal,
        which we denote by $\\\\mathfrak{m}_{X,P}$ or $\\\\mathfrak{m}_P$). The quotient
        field $\\\\kappa(P) = \\\\mathcal{O}_{X,P}/\\\\mathfrak{m}_P$ is called the
        *residue field* of $X$ at $P$.\\n4. A *morphism of locally ringed spaces*
        from $(X, \\\\mathcal{O}_X)$ to $(Y, \\\\mathcal{O}_Y)$ is a morphism of ringed
        spaces $(f, f^\\\\#)$ such that for every point $P \\\\in X$, the induced
        ring homomorphism on stalks\\n   $$f^\\\\#_P: \\\\mathcal{O}_{Y, f(P)} \\\\longrightarrow
        \\\\mathcal{O}_{X,P}$$\\n   (obtained by passing to the direct limit of $f^\\\\#(V):
        \\\\mathcal{O}_Y(V) \\\\to \\\\mathcal{O}_X(f^{-1}(V))$ over all open neighborhoods
        $V$ of $f(P)$, or equivalently via the adjoint morphism $f^{-1}\\\\mathcal{O}_Y
        \\\\to \\\\mathcal{O}_X$) is a *local homomorphism of local rings*, meaning
        that\\n   $$(f^\\\\#_P)^{-1}(\\\\mathfrak{m}_{X,P}) = \\\\mathfrak{m}_{Y,
        f(P)}, \\\\quad \\\\text{or equivalently,} \\\\quad f^\\\\#_P(\\\\mathfrak{m}_{Y,
        f(P)}) \\\\subseteq \\\\mathfrak{m}_{X,P}.$$\\n\\nIn classical varieties,
        if $\\\\varphi: X \\\\to Y$ is a morphism and $f^\\\\#$ is given by pullback
        of functions $g \\\\mapsto g \\\\circ \\\\varphi$, then $g \\\\in \\\\mathfrak{m}_{\\\\varphi(P)}$
        means $g(\\\\varphi(P)) = 0$, which automatically implies $(g \\\\circ \\\\varphi)(P)
        = 0$, so $g \\\\circ \\\\varphi \\\\in \\\\mathfrak{m}_P$. In the abstract
        setting of schemes, however, the sections of $\\\\mathcal{O}_X$ are not literally
        functions into a fixed base field, so the condition that $f^\\\\#_P$ be a
        local homomorphism is not automatic and must be imposed as a fundamental axiom.\\n\\n---\\n\\n###
        Exercises for Chapter 2\\n\\n**Exercise 2.1.** Let $X$ be a topological space
        and $A$ a non-zero abelian group.\\n(a) Let $\\\\mathcal{F}$ be the *constant
        presheaf* with $U \\\\mapsto A$ for all non-empty open $U \\\\subseteq X$
        (and $\\\\mathcal{F}(\\\\varnothing) = 0$), with identity restriction maps.
        Show that if $X$ contains two disjoint non-empty open subsets, $\\\\mathcal{F}$
        is not a sheaf.\\n(b) Prove that the sheafification $\\\\mathcal{F}^+$ of
        $\\\\mathcal{F}$ is the *constant sheaf* $\\\\underline{A}_X$, whose sections
        over an open set $U \\\\subseteq X$ are the continuous functions $U \\\\to
        A$, where $A$ is given the discrete topology.\\n\\n**Exercise 2.2.** Let $\\\\varphi:
        \\\\mathcal{F} \\\\to \\\\mathcal{G}$ be a morphism of sheaves of abelian
        groups on $X$. Prove that the following are equivalent:\\n(a) $\\\\varphi$
        is surjective as a morphism of sheaves (meaning $\\\\operatorname{im} \\\\varphi
        = \\\\mathcal{G}$, or $\\\\operatorname{coker} \\\\varphi = 0$).\\n(b) $\\\\varphi_P:
        \\\\mathcal{F}_P \\\\to \\\\mathcal{G}_P$ is surjective for every $P \\\\in
        X$.\\n(c) For every open subset $U \\\\subseteq X$ and every section $t \\\\in
        \\\\mathcal{G}(U)$, there exists an open cover $\\\\{U_i\\\\}_{i \\\\in I}$
        of $U$ and sections $s_i \\\\in \\\\mathcal{F}(U_i)$ such that $\\\\varphi(U_i)(s_i)
        = t|_{U_i}$ for all $i \\\\in I$.\\nGive an explicit example of a surjective
        morphism of sheaves $\\\\varphi: \\\\mathcal{F} \\\\to \\\\mathcal{G}$ such
        that $\\\\varphi(X): \\\\mathcal{F}(X) \\\\to \\\\mathcal{G}(X)$ is *not*
        surjective.\\n\\n**Exercise 2.3.** (Gluing Sheaves) Let $X$ be a topological
        space and $\\\\{U_i\\\\}_{i \\\\in I}$ an open cover of $X$. Suppose that
        for each $i \\\\in I$ we are given a sheaf $\\\\mathcal{F}_i$ on $U_i$, and
        for each pair $(i, j) \\\\in I \\\\times I$ an isomorphism of sheaves $\\\\varphi_{ij}:
        \\\\mathcal{F}_i|_{U_i \\\\cap U_j} \\\\xrightarrow{\\\\sim} \\\\mathcal{F}_j|_{U_i
        \\\\cap U_j}$ satisfying:\\n(i) $\\\\varphi_{ii} = \\\\operatorname{id}_{\\\\mathcal{F}_i}$
        for all $i \\\\in I$, and\\n(ii) **(Cocycle Condition)** On every triple intersection
        $U_i \\\\cap U_j \\\\cap U_k$, we have $\\\\varphi_{jk} \\\\circ \\\\varphi_{ij}
        = \\\\varphi_{ik}$.\\nProve that there exists a sheaf $\\\\mathcal{F}$ on
        $X$, unique up to unique isomorphism, together with isomorphisms $\\\\psi_i:
        \\\\mathcal{F}|_{U_i} \\\\xrightarrow{\\\\sim} \\\\mathcal{F}_i$ such that
        $\\\\varphi_{ij} \\\\circ \\\\psi_i|_{U_i \\\\cap U_j} = \\\\psi_j|_{U_i \\\\cap
        U_j}$ for all $i, j \\\\in I$.\\n\\n**Exercise 2.4.** (Sheaves on a Base)
        Let $X$ be a topological space and $\\\\mathfrak{B}$ a *base* for the topology
        of $X$ (so every open set is a union of elements of $\\\\mathfrak{B}$, and
        the intersection of two elements of $\\\\mathfrak{B}$ is covered by elements
        of $\\\\mathfrak{B}$). A *$\\\\mathfrak{B}$-sheaf* is a contravariant functor
        $\\\\mathcal{F}$ defined only on the open sets in $\\\\mathfrak{B}$ satisfying
        the locality and gluing axioms for covers of $B \\\\in \\\\mathfrak{B}$ by
        elements of $\\\\mathfrak{B}$.\\nProve that every $\\\\mathfrak{B}$-sheaf
        $\\\\mathcal{F}$ extends uniquely (up to canonical isomorphism) to a sheaf
        $\\\\widetilde{\\\\mathcal{F}}$ on $X$ via the formula\\n$$\\\\widetilde{\\\\mathcal{F}}(U)
        = \\\\varprojlim_{B \\\\in \\\\mathfrak{B},\\\\, B \\\\subseteq U} \\\\mathcal{F}(B).$$\\n\\n**Exercise
        2.5.** Let $f: X \\\\to Y$ be a continuous map of topological spaces. Construct
        explicitly the adjunction bijections\\n$$\\\\operatorname{Hom}_{\\\\mathfrak{Sh}(X)}(f^{-1}\\\\mathcal{G},
        \\\\mathcal{F}) \\\\xrightarrow{\\\\;\\\\sim\\\\;} \\\\operatorname{Hom}_{\\\\mathfrak{Sh}(Y)}(\\\\mathcal{G},
        f_*\\\\mathcal{F})$$\\nand prove that $f^{-1}: \\\\mathfrak{Ab}(Y) \\\\to
        \\\\mathfrak{Ab}(X)$ is an exact functor, whereas $f_*: \\\\mathfrak{Ab}(X)
        \\\\to \\\\mathfrak{Ab}(Y)$ is left-exact.\\n\\n**Exercise 2.6.** (Skyscraper
        Sheaves) Let $X$ be a topological space, $P \\\\in X$ a point, and $A$ an
        abelian group. Define $i_P(A)(U) = A$ if $P \\\\in U$ and $i_P(A)(U) = 0$
        if $P \\\\notin U$.\\n(a) Prove that $i_P(A)$ is a sheaf on $X$, and that
        it is isomorphic to the pushforward $i_*\\\\underline{A}_{\\\\{P\\\\}}$ under
        the inclusion $i: \\\\{P\\\\} \\\\hookrightarrow X$.\\n(b) Determine the stalk
        $(i_P(A))_Q$ for an arbitrary point $Q \\\\in X$ in terms of the closure $\\\\overline{\\\\{P\\\\}}$
        of $\\\\{P\\\\}$ in $X$.\\n\\n---\\n\\n## Chapter 3: Schemes: Construction
        and Fundamental Properties\\n\\nWe now arrive at the central object of modern
        algebraic geometry: the *scheme*. By associating a locally ringed space $\\\\operatorname{Spec}
        A$ to every commutative ring $A$ with identity, we embed the entire category
        of commutative rings contravariantly into geometric spaces, unifying arithmetic
        and geometry.\\n\\n---\\n\\n### 3.1 The Prime Spectrum of a Ring\\n\\nThroughout
        this chapter, all rings are assumed to be commutative with a multiplicative
        identity $1$.\\n\\n**Definition 3.1.1.** Let $A$ be a ring. The *prime spectrum*
        (or simply *spectrum*) of $A$, denoted $\\\\operatorname{Spec} A$, is the
        set of all prime ideals of $A$. For any subset $E \\\\subseteq A$, we define
        the *vanishing locus* $V(E)$ to be the set of all prime ideals of $A$ containing
        $E$:\\n$$V(E) = \\\\{\\\\mathfrak{p} \\\\in \\\\operatorname{Spec} A \\\\mid
        E \\\\subseteq \\\\mathfrak{p}\\\\}.$$\\n\\nIf $\\\\mathfrak{a} = (E)$ is
        the ideal of $A$ generated by $E$, then clearly $V(E) = V(\\\\mathfrak{a})
        = V(\\\\sqrt{\\\\mathfrak{a}})$.\\n\\n**Proposition 3.1.2.** *Let $A$ be a
        ring. The operation $V$ satisfies:*\\n1. $V(0) = \\\\operatorname{Spec} A$
        *and* $V(1) = V(A) = \\\\varnothing$.\\n2. *For any family of ideals $\\\\{\\\\mathfrak{a}_i\\\\}_{i
        \\\\in I}$ of $A$, $\\\\bigcap_{i \\\\in I} V(\\\\mathfrak{a}_i) = V\\\\left(\\\\sum_{i
        \\\\in I} \\\\mathfrak{a}_i\\\\right)$.*\\n3. *For any two ideals $\\\\mathfrak{a},
        \\\\mathfrak{b}$ of $A$, $V(\\\\mathfrak{a}) \\\\cup V(\\\\mathfrak{b}) =
        V(\\\\mathfrak{a}\\\\mathfrak{b}) = V(\\\\mathfrak{a} \\\\cap \\\\mathfrak{b})$.*\\n4.
        *For any ideal $\\\\mathfrak{a} \\\\subseteq A$, $\\\\bigcap_{\\\\mathfrak{p}
        \\\\in V(\\\\mathfrak{a})} \\\\mathfrak{p} = \\\\sqrt{\\\\mathfrak{a}}$. Consequently,
        $V(\\\\mathfrak{a}) \\\\subseteq V(\\\\mathfrak{b})$ if and only if $\\\\sqrt{\\\\mathfrak{b}}
        \\\\subseteq \\\\sqrt{\\\\mathfrak{a}}$.*\\n\\n*Proof.* Properties (1), (2),
        and (3) are proved identically to Proposition 1.1.3, using the defining property
        of prime ideals: if $\\\\mathfrak{a}\\\\mathfrak{b} \\\\subseteq \\\\mathfrak{p}$,
        then $\\\\mathfrak{a} \\\\subseteq \\\\mathfrak{p}$ or $\\\\mathfrak{b} \\\\subseteq
        \\\\mathfrak{p}$.\\n\\nFor (4), it is a foundational fact of commutative algebra
        that the radical $\\\\sqrt{\\\\mathfrak{a}}$ is the intersection of all prime
        ideals containing $\\\\mathfrak{a}$. (Indeed, if $f \\\\notin \\\\sqrt{\\\\mathfrak{a}}$,
        then the multiplicatively closed set $S = \\\\{1, f, f^2, \\\\dots\\\\}$ is
        disjoint from $\\\\mathfrak{a}$, so the localization $(A/\\\\mathfrak{a})_f$
        is a non-zero ring and thus possesses a maximal ideal, whose preimage in $A$
        is a prime ideal containing $\\\\mathfrak{a}$ and not containing $f$.) The
        second assertion of (4) follows immediately. $\\\\blacksquare$\\n\\nBy Proposition
        3.1.2, the sets $V(\\\\mathfrak{a})$ form the closed subsets of a topology
        on $\\\\operatorname{Spec} A$, called the *Zariski topology*.\\n\\n**Definition
        3.1.3.** For each element $f \\\\in A$, we define the *principal open subset*
        (or *distinguished open subset*) $D(f) \\\\subseteq \\\\operatorname{Spec}
        A$ to be the complement of $V((f))$:\\n$$D(f) = \\\\operatorname{Spec} A \\\\setminus
        V((f)) = \\\\{\\\\mathfrak{p} \\\\in \\\\operatorname{Spec} A \\\\mid f \\\\notin
        \\\\mathfrak{p}\\\\}.$$\\n\\n**Proposition 3.1.4.** *Let $A$ be a ring and
        $f, g \\\\in A$.*\\n1. $D(f) \\\\cap D(g) = D(fg)$.\\n2. $D(f) = \\\\varnothing
        \\\\iff f$ *is nilpotent; $D(f) = \\\\operatorname{Spec} A \\\\iff f \\\\in
        A^\\\\times$ is a unit.*\\n3. *The collection $\\\\{D(f) \\\\mid f \\\\in
        A\\\\}$ forms a base for the Zariski topology on $\\\\operatorname{Spec} A$.*\\n4.
        *Each open set $D(f)$ (and in particular $\\\\operatorname{Spec} A = D(1)$)
        is quasi-compact: every open cover of $D(f)$ has a finite subcover.*\\n\\n*Proof.*
        (1) A prime ideal $\\\\mathfrak{p}$ satisfies $fg \\\\notin \\\\mathfrak{p}$
        if and only if $f \\\\notin \\\\mathfrak{p}$ and $g \\\\notin \\\\mathfrak{p}$.\\n\\n(2)
        By Proposition 3.1.2(4), $D(f) = \\\\varnothing \\\\iff V((f)) = \\\\operatorname{Spec}
        A \\\\iff f \\\\in \\\\bigcap_{\\\\mathfrak{p} \\\\in \\\\operatorname{Spec}
        A} \\\\mathfrak{p} = \\\\sqrt{(0)}$. Similarly, $D(f) = \\\\operatorname{Spec}
        A \\\\iff V((f)) = \\\\varnothing \\\\iff (f) = A \\\\iff f \\\\in A^\\\\times$.\\n\\n(3)
        Any open set in $\\\\operatorname{Spec} A$ is of the form $\\\\operatorname{Spec}
        A \\\\setminus V(E) = \\\\operatorname{Spec} A \\\\setminus \\\\bigcap_{f
        \\\\in E} V((f)) = \\\\bigcup_{f \\\\in E} D(f)$.\\n\\n(4) Since the sets
        $D(g)$ form a base for the topology, it suffices to show that if $D(f) \\\\subseteq
        \\\\bigcup_{i \\\\in I} D(g_i)$, then there is a finite subset $J \\\\subseteq
        I$ such that $D(f) \\\\subseteq \\\\bigcup_{j \\\\in J} D(g_j)$. Taking complements,
        the inclusion $D(f) \\\\subseteq \\\\bigcup_{i \\\\in I} D(g_i)$ is equivalent
        to $V((f)) \\\\supseteq \\\\bigcap_{i \\\\in I} V((g_i)) = V\\\\left(\\\\sum_{i
        \\\\in I} (g_i)\\\\right)$. By Proposition 3.1.2(4), this is equivalent to
        $f \\\\in \\\\sqrt{\\\\sum_{i \\\\in I} (g_i)}$. Thus there exists an integer
        $n \\\\ge 1$ such that $f^n \\\\in \\\\sum_{i \\\\in I} (g_i)$. Because an
        element of a sum of ideals is a *finite* linear combination, there exists
