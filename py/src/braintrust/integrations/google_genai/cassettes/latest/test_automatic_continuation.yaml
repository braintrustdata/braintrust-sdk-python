        [\n          {\n            \"text\": \"3.5.4.** Let $f : X \\\\to S$ be a
        morphism of schemes.\\n1. $f$ is *locally of finite type* if $S$ can be covered
        by affine open subsets $V_i = \\\\operatorname{Spec} B_i$ such that for each
        $i$, $f^{-1}(V_i)$ can be covered by affine open subsets $U_{ij} = \\\\operatorname{Spec}
        A_{ij}$ where each $A_{ij}$ is a finitely generated $B_i$-algebra.\\n2. $f$
        is *quasi-compact* if the preimage of every quasi-compact open subset of $S$
        is quasi-compact.\\n3. $f$ is *of finite type* if it is locally of finite
        type and quasi-compact.\\n4. $f$ is *universally closed* if it is closed (maps
        closed sets to closed sets) and for every morphism $S' \\\\to S$, the base-change
        morphism $f' : X \\\\times_S S' \\\\to S'$ is closed.\\n5. $f$ is *proper*
        if it is separated, of finite type, and universally closed. (Properness is
        the scheme-theoretic analogue of compactness).\\n\\nTo test separatedness
        and properness effectively, we use valuation rings. Recall that a *valuation
        ring* is an integral domain $R$ with field of fractions $K$ such that for
        every $x \\\\in K^\\\\times$, either $x \\\\in R$ or $x^{-1} \\\\in R$. Every
        valuation ring is a local ring.\\n\\n**Theorem 3.5.5 (Valuative Criterion
        of Separatedness and Properness).** *Let $f : X \\\\to S$ be a morphism of
        schemes, where $X$ is a Noetherian scheme (or $f$ is of finite type with $S$
        locally Noetherian). For any valuation ring $R$ with field of fractions $K$,
        consider a commutative diagram of solid arrows:*\\n$$\\\\begin{array}{ccc}\\n\\\\operatorname{Spec}
        K & \\\\xrightarrow{u} & X \\\\\\\\\\n\\\\downarrow{j} & \\\\swarrow{h} &
        \\\\downarrow{f} \\\\\\\\\\n\\\\operatorname{Spec} R & \\\\xrightarrow{v}
        & S\\n\\\\end{array}$$\\n*where $j$ is induced by the inclusion $R \\\\hookrightarrow
        K$.*\\n1. *(Separatedness) $f$ is separated if and only if for every valuation
        ring $R$ and every diagram as above, there exists at most one morphism $h
        : \\\\operatorname{Spec} R \\\\to X$ making both triangles commute.*\\n2.
        *(Properness) Suppose $f$ is of finite type. Then $f$ is proper if and only
        if for every valuation ring $R$ and every diagram as above, there exists a
        unique morphism $h : \\\\operatorname{Spec} R \\\\to X$ making both triangles
        commute.*\\n\\n*Proof of the ($\\\\Rightarrow$) directions.* Suppose $f$ is
        separated, and let $h_1, h_2 : \\\\operatorname{Spec} R \\\\to X$ be two morphisms
        fitting into the diagram. By the universal property of $X \\\\times_S X$,
        the pair $(h_1, h_2)$ defines a morphism $H : \\\\operatorname{Spec} R \\\\to
        X \\\\times_S X$. Since $h_1 \\\\circ j = u = h_2 \\\\circ j$, the composition
        $H \\\\circ j : \\\\operatorname{Spec} K \\\\to X \\\\times_S X$ factors through
        the diagonal $\\\\Delta : X \\\\to X \\\\times_S X$. \\n\\nLet $\\\\eta \\\\in
        \\\\operatorname{Spec} R$ be the generic point $(0)$; then $j(\\\\operatorname{Spec}
        K) = \\\\{\\\\eta\\\\}$, and the closure of $\\\\{\\\\eta\\\\}$ in $\\\\operatorname{Spec}
        R$ is the entire space $\\\\operatorname{Spec} R$. Since $\\\\Delta$ is a
        closed immersion, $\\\\Delta(X)$ is closed in $X \\\\times_S X$. Because $H(\\\\eta)
        \\\\in \\\\Delta(X)$, by continuity we have $H(\\\\operatorname{Spec} R) =
        H(\\\\overline{\\\\{\\\\eta\\\\}}) \\\\subseteq \\\\overline{H(\\\\{\\\\eta\\\\})}
        \\\\subseteq \\\\Delta(X)$. Moreover, since $\\\\operatorname{Spec} R$ is
        reduced and $\\\\Delta$ is a closed immersion, $H$ factors scheme-theoretically
        through $\\\\Delta : X \\\\to X \\\\times_S X$ (on an affine neighborhood
        $\\\\operatorname{Spec} C \\\\subseteq X \\\\times_S X$ where $\\\\Delta(X)
        = V(I)$, the ring map $C \\\\to R$ sends $I$ into the nilradical of $R$, which
        is $(0)$ since $R$ is an integral domain). Factoring $H = \\\\Delta \\\\circ
        h$ gives $h_1 = p_1 \\\\circ H = p_1 \\\\circ \\\\Delta \\\\circ h = h = p_2
        \\\\circ \\\\Delta \\\\circ h = h_2$.\\n\\nNow suppose $f$ is proper, and
        consider the diagram. We already have uniqueness of $h$ by separatedness.
        For existence, make the base change by $v : \\\\operatorname{Spec} R \\\\to
        S$; replacing $X \\\\to S$ by $X \\\\times_S \\\\operatorname{Spec} R \\\\to
        \\\\operatorname{Spec} R$, we may assume $S = \\\\operatorname{Spec} R$ and
        $v = \\\\operatorname{id}_{\\\\operatorname{Spec} R}$. Let $\\\\xi = u(\\\\operatorname{Spec}
        K) \\\\in X$, and let $Z = \\\\overline{\\\\{\\\\xi\\\\}}$ be its closure
        in $X$, endowed with the reduced induced closed subscheme structure. Then
        $Z$ is an integral scheme, and $\\\\xi$ is its generic point.\\n\\nSince $f$
        is proper, it is universally closed, so $f(Z)$ is a closed subset of $\\\\operatorname{Spec}
        R$. Since $f(\\\\xi) = j(\\\\operatorname{Spec} K) = \\\\{\\\\eta\\\\}$ is
        the generic point of $\\\\operatorname{Spec} R$, its closure is all of $\\\\operatorname{Spec}
        R$, so $f(Z) = \\\\operatorname{Spec} R$. In particular, the closed point
        $\\\\mathfrak{m}_R \\\\in \\\\operatorname{Spec} R$ lies in $f(Z)$. Let $P
        \\\\in Z$ be a point such that $f(P) = \\\\mathfrak{m}_R$. Consider the local
        ring $\\\\mathcal{O}_{Z, P}$; since $Z$ is integral with generic point $\\\\xi$,
        the function field of $Z$ is $K(Z) = \\\\mathcal{O}_{Z, \\\\xi} = k(\\\\xi)$,
        and $\\\\mathcal{O}_{Z, P}$ is a local subring of $k(\\\\xi)$. The morphism
        $u : \\\\operatorname{Spec} K \\\\to Z$ with image $\\\\xi$ gives a field
        embedding $k(\\\\xi) \\\\hookrightarrow K$, and the local homomorphism $f^\\\\#_P
        : R = \\\\mathcal{O}_{\\\\operatorname{Spec} R, \\\\mathfrak{m}_R} \\\\to
        \\\\mathcal{O}_{Z, P}$ fits into a chain of local rings inside $K$:\\n$$R
        \\\\subseteq \\\\mathcal{O}_{Z, P} \\\\subseteq k(\\\\xi) \\\\subseteq K$$\\nwhere
        the inclusion $R \\\\hookrightarrow \\\\mathcal{O}_{Z, P}$ is a local homomorphism
        (meaning $\\\\mathfrak{m}_{Z,P} \\\\cap R = \\\\mathfrak{m}_R$). However,
        it is a fundamental property of valuation rings that a valuation ring $R$
        is maximal with respect to the relation of domination among local subrings
        of $K$: if $R \\\\subseteq B \\\\subseteq K$ is a local ring with $\\\\mathfrak{m}_B
        \\\\cap R = \\\\mathfrak{m}_R$, then $R = B$ (if $x \\\\in B \\\\setminus
        R$, then $x^{-1} \\\\in \\\\mathfrak{m}_R \\\\subseteq \\\\mathfrak{m}_B$,
        contradicting that $x \\\\in B$ implies $x^{-1}$ cannot be in $\\\\mathfrak{m}_B$).
        Therefore, $R = \\\\mathcal{O}_{Z, P}$. The inverse isomorphism $\\\\mathcal{O}_{Z,P}
        \\\\xrightarrow{\\\\sim} R$ induces a morphism $\\\\operatorname{Spec} R \\\\to
        \\\\operatorname{Spec} \\\\mathcal{O}_{Z,P} \\\\to Z \\\\subseteq X$, which
        gives the required lift $h$. $\\\\blacksquare$\\n\\n---\\n\\n### Exercises
        for Chapter 3\\n\\n**Exercise 3.1.** Describe the topological space and stalks
        of $\\\\operatorname{Spec} \\\\mathbb{Z}$, $\\\\operatorname{Spec} k[x]$,
        and $\\\\operatorname{Spec} \\\\mathbb{Z}[x]$. For $\\\\operatorname{Spec}
        \\\\mathbb{Z}[x]$, classify all prime ideals into three geometric types (the
        generic point, \\\"horizontal\\\" curves, and \\\"vertical\\\" fibers over
        primes $p \\\\in \\\\mathbb{Z}$, plus closed points) and sketch the space.\\n\\n**Exercise
        3.2 (The Affine Line with Two Origins).** Let $k$ be a field, and let $X_1
        = \\\\operatorname{Spec} k[t]$ and $X_2 = \\\\operatorname{Spec} k[u]$. Let
        $U_1 = D(t) = \\\\operatorname{Spec} k[t, t^{-1}] \\\\subset X_1$ and $U_2
        = D(u) = \\\\operatorname{Spec} k[u, u^{-1}] \\\\subset X_2$. Glue $X_1$ and
        $X_2$ along $U_1$ and $U_2$ via the isomorphism induced by $u \\\\mapsto t$.
        Prove that the resulting scheme $X$ is *not* separated over $k$,both by directly
        analyzing the diagonal $\\\\Delta(X) \\\\subset X \\\\times_k X$ and by applying
        the Valuative Criterion of Separatedness (Theorem 3.5.5) with $R = k[t]_{(t)}$.\\n\\n**Exercise
        3.3.** Let $X$ be a scheme. Prove that for any two affine open subschemes
        $U, V \\\\subseteq X$, the intersection $U \\\\cap V$ can be covered by open
        subsets that are simultaneously principal open subsets of $U$ and of $V$.
        Moreover, prove that if $X$ is separated, then the intersection $U \\\\cap
        V$ of any two affine open subschemes is itself an affine open subscheme. *(Hint:
        Express $U \\\\cap V$ using the diagonal $\\\\Delta : X \\\\to X \\\\times_{\\\\mathbb{Z}}
        X$ and $U \\\\times_{\\\\mathbb{Z}} V$).*\\n\\n**Exercise 3.4.** Let $S$ be
        a graded ring. For any integer $d \\\\ge 1$, define the $d$-th *Veronese subring*
        of $S$ to be the graded ring $S^{(d)} = \\\\bigoplus_{n \\\\ge 0} S_{nd}$.
        Prove that there is a canonical isomorphism of schemes $\\\\operatorname{Proj}
        S \\\\cong \\\\operatorname{Proj} S^{(d)}$.\\n\\n**Exercise 3.5.** Use the
        Valuative Criterion of Properness (Theorem 3.5.5) to prove directly that projective
        $n$-space $\\\\mathbb{P}^n_A$ is proper over $\\\\operatorname{Spec} A$ for
        any Noetherian ring $A$. *(Hint: Given a map $\\\\operatorname{Spec} K \\\\to
        \\\\mathbb{P}^n_R$, represent it on homogeneous coordinates by elements $a_0,
        \\\\dots, a_n \\\\in K$, and use the valuation on $K$ to find an index $i$
        such that $a_j / a_i \\\\in R$ for all $j$).*\\n\\n**Exercise 3.6.** Let $k$
        be an algebraically closed field. Define a functor $t$ from the category of
        varieties over $k$ (in the sense of Chapter 1) to the category of schemes
        over $\\\\operatorname{Spec} k$, by sending a variety $V$ to the set $t(V)$
        of all non-empty irreducible closed subsets of $V$, equipped with the topology
        and structure sheaf inherited from $V$. Prove that $t$ is a fully faithful
        functor whose essential image is the category of integral, separated schemes
        of finite type over $\\\\operatorname{Spec} k$.\\n\\n---\\n\\n## Chapter 4:
        Sheaves of Modules, Differentials, and Smoothness\\n\\n### 4.1 Quasi-Coherent
        and Coherent Sheaves\\n\\n**Definition 4.1.1.** Let $(X, \\\\mathcal{O}_X)$
        be a ringed space. A *sheaf of $\\\\mathcal{O}_X$-modules* (or simply an *$\\\\mathcal{O}_X$-module*)
        is a sheaf $\\\\mathcal{F}$ of abelian groups on $X$ such that for each open
        set $U \\\\subseteq X$, $\\\\mathcal{F}(U)$ is an $\\\\mathcal{O}_X(U)$-module,
        and for each inclusion of open sets $V \\\\subseteq U$, the restriction map
        $\\\\mathcal{F}(U) \\\\to \\\\mathcal{F}(V)$ is compatible with the module
        structures via the ring homomorphism $\\\\mathcal{O}_X(U) \\\\to \\\\mathcal{O}_X(V)$:
        that is, $\\\\left.(as)\\\\right|_V = \\\\left.a\\\\right|_V \\\\left.s\\\\right|_V$
        for all $a \\\\in \\\\mathcal{O}_X(U)$ and $s \\\\in \\\\mathcal{F}(U)$.\\n\\nA
        *morphism of $\\\\mathcal{O}_X$-modules* $\\\\varphi : \\\\mathcal{F} \\\\to
        \\\\mathcal{G}$ is a morphism of sheaves such that $\\\\varphi(U) : \\\\mathcal{F}(U)
        \\\\to \\\\mathcal{G}(U)$ is $\\\\mathcal{O}_X(U)$-linear for every open $U
        \\\\subseteq X$. The category of $\\\\mathcal{O}_X$-modules is denoted $\\\\mathbf{Mod}(\\\\mathcal{O}_X)$;
        by the same proof as Proposition 2.2.3, it is an abelian category.\\n\\nNow
        let $A$ be a ring, $X = \\\\operatorname{Spec} A$, and $M$ an $A$-module.
        We construct an $\\\\mathcal{O}_X$-module $\\\\widetilde{M}$ on $X$ in exact
        analogy with $\\\\mathcal{O}_X = \\\\widetilde{A}$.\\n\\n**Definition 4.1.2.**
        For each open set $U \\\\subseteq \\\\operatorname{Spec} A$, define $\\\\widetilde{M}(U)$
        to be the set of functions $s : U \\\\to \\\\bigsqcup_{\\\\mathfrak{p} \\\\in
        U} M_\\\\mathfrak{p}$ such that $s(\\\\mathfrak{p}) \\\\in M_\\\\mathfrak{p}$
        for each $\\\\mathfrak{p} \\\\in U$, and locally around each $\\\\mathfrak{p}
        \\\\in U$ on some open neighborhood $V \\\\subseteq U$, there exist $m \\\\in
        M$ and $f \\\\in A$ such that for all $\\\\mathfrak{q} \\\\in V$, $f \\\\notin
        \\\\mathfrak{q}$ and $s(\\\\mathfrak{q}) = m/f$ in $M_\\\\mathfrak{q}$.\\n\\n**Theorem
        4.1.3.** *Let $A$ be a ring, $X = \\\\operatorname{Spec} A$, and $M$ an $A$-module.
        Then $\\\\widetilde{M}$ is an $\\\\mathcal{O}_X$-module satisfying:*\\n1.
        *For each $\\\\mathfrak{p} \\\\in X$, the stalk $(\\\\widetilde{M})_\\\\mathfrak{p}$
        is canonically isomorphic to $M_\\\\mathfrak{p}$ as an $A_\\\\mathfrak{p}$-module.*\\n2.
        *For each $f \\\\in A$, $\\\\Gamma(D(f), \\\\widetilde{M}) \\\\cong M_f$ as
        an $A_f$-module. In particular, $\\\\Gamma(X, \\\\widetilde{M}) \\\\cong M$.*\\n3.
        *The functor $M \\\\mapsto \\\\widetilde{M}$ from $\\\\mathbf{Mod}_A$ to $\\\\mathbf{Mod}(\\\\mathcal{O}_X)$
        is an exact, fully faithful functor. Moreover, for any $A$-modules $M, N$,
        we have $\\\\widetilde{M \\\\otimes_A N} \\\\cong \\\\widetilde{M} \\\\otimes_{\\\\mathcal{O}_X}
        \\\\widetilde{N}$.*\\n\\n*Proof.* The proofs of (1) and (2) are verbatim identical
        to the proof of Theorem 3.1.5, replacing elements $a \\\\in A$ with $m \\\\in
        M$ and $A_\\\\mathfrak{p}, A_f$ with $M_\\\\mathfrak{p}, M_f$.\\n\\nFor (3),
        let $M' \\\\to M \\\\to M''$ be an exact sequence of $A$-modules. For every
        $\\\\mathfrak{p} \\\\in \\\\operatorname{Spec} A$, since localization is an
        exact functor, the localized sequence $M'_\\\\mathfrak{p} \\\\to M_\\\\mathfrak{p}
        \\\\to M''_\\\\mathfrak{p}$ is exact. By part (1) and Proposition 2.2.3(3),
        the sequence of sheaves $\\\\widetilde{M'} \\\\to \\\\widetilde{M} \\\\to
        \\\\widetilde{M''}$ is exact. Thus $M \\\\mapsto \\\\widetilde{M}$ is exact.\\n\\nTo
        show it is fully faithful, let $M, N$ be $A$-modules. Taking global sections
        gives a map $\\\\operatorname{Hom}_{\\\\mathcal{O}_X}(\\\\widetilde{M}, \\\\widetilde{N})
        \\\\to \\\\operatorname{Hom}_A(M, N)$. Conversely, any $A$-linear map $\\\\varphi
        : M \\\\to N$ localizes to $\\\\varphi_\\\\mathfrak{p} : M_\\\\mathfrak{p}
        \\\\to N_\\\\mathfrak{p}$, inducing a morphism $\\\\widetilde{\\\\varphi}
        : \\\\widetilde{M} \\\\to \\\\widetilde{N}$. Since any $\\\\mathcal{O}_X$-module
        morphism $\\\\psi : \\\\widetilde{M} \\\\to \\\\widetilde{N}$ must commute
        with restrictions from $X$ to $D(f)$, on $D(f)$ the map $\\\\psi(D(f)) : M_f
        \\\\to N_f$ is uniquely determined by $\\\\psi(X) : M \\\\to N$ via $\\\\psi(D(f))(m/f^n)
        = \\\\psi(X)(m)/f^n$. Thus the two maps are mutually inverse. The compatibility
        with tensor products follows immediately by checking on stalks $(M \\\\otimes_A
        N)_\\\\mathfrak{p} \\\\cong M_\\\\mathfrak{p} \\\\otimes_{A_\\\\mathfrak{p}}
        N_\\\\mathfrak{p}$. $\\\\blacksquare$\\n\\n**Definition 4.1.4.** Let $(X,
        \\\\mathcal{O}_X)$ be a scheme. An $\\\\mathcal{O}_X$-module $\\\\mathcal{F}$
        is *quasi-coherent* if $X$ can be covered by affine open subsets $U_i = \\\\operatorname{Spec}
        A_i$ such that for each $i$, there is an $A_i$-module $M_i$ with $\\\\left.\\\\mathcal{F}\\\\right|_{U_i}
        \\\\cong \\\\widetilde{M_i}$. We say $\\\\mathcal{F}$ is *coherent* if furthermore
        each $M_i$ can be chosen to be a finitely generated $A_i$-module. The category
        of quasi-coherent sheaves on $X$ is denoted $\\\\mathbf{QCoh}(X)$, and the
        category of coherent sheaves is denoted $\\\\mathbf{Coh}(X)$.\\n\\n**Theorem
        4.1.5.** *Let $X$ be a scheme and $\\\\mathcal{F}$ an $\\\\mathcal{O}_X$-module.
        Then $\\\\mathcal{F}$ is quasi-coherent if and only if for every affine open
        subset $U = \\\\operatorname{Spec} A$ of $X$, there is an $A$-module $M$ such
        that $\\\\left.\\\\mathcal{F}\\\\right|_U \\\\cong \\\\widetilde{M}$. In particular,
        if $X = \\\\operatorname{Spec} A$, the functor $M \\\\mapsto \\\\widetilde{M}$
        is an equivalence of categories between $\\\\mathbf{Mod}_A$ and $\\\\mathbf{QCoh}(\\\\operatorname{Spec}
        A)$, with quasi-inverse $\\\\mathcal{F} \\\\mapsto \\\\Gamma(X, \\\\mathcal{F})$.
        If $A$ is Noetherian, it restricts to an equivalence between finitely generated
        $A$-modules and $\\\\mathbf{Coh}(\\\\operatorname{Spec} A)$.*\\n\\n*Proof.*
        The \\\"if\\\" direction is trivial. For the \\\"only if\\\" direction, suppose
        $\\\\mathcal{F}$ is quasi-coherent, and let $U = \\\\operatorname{Spec} A$
        be an affine open subset of $X$. By definition, we can cover $U$ by open subsets
        that are affine opens in our given quasi-coherent cover, and by shrinking
        to basic opens of $U$, we can cover $U = \\\\operatorname{Spec} A$ by finitely
        many principal open subsets $D(g_1), \\\\dots, D(g_r)$ (with $g_i \\\\in A$)
        such that $\\\\left.\\\\mathcal{F}\\\\right|_{D(g_i)} \\\\cong \\\\widetilde{M_i}$
        for some $A_{g_i}$-module $M_i$.\\n\\nSet $M = \\\\Gamma(U, \\\\mathcal{F})$,
        which is an $A$-module. There is a natural morphism of $\\\\mathcal{O}_U$-modules
        $\\\\alpha : \\\\widetilde{M} \\\\to \\\\left.\\\\mathcal{F}\\\\right|_U$
        corresponding by adjunction to the identity map $M \\\\to \\\\Gamma(U, \\\\mathcal{F})$.
        To show $\\\\alpha$ is an isomorphism, it suffices to show that for each $i$,
        the restriction of $\\\\alpha$ to $D(g_i) = \\\\operatorname{Spec} A_{g_i}$
        is an isomorphism, which by Theorem 4.1.3(3) is equivalent to showing that
        the canonical localization map\\n$$\\\\rho : M_{g_i} = \\\\Gamma(U, \\\\mathcal{F})_{g_i}
        \\\\longrightarrow \\\\Gamma(D(g_i), \\\\mathcal{F}) = M_i$$\\nis an isomorphism
        of $A_{g_i}$-modules.\\n\\nLet $g = g_i$. On each overlap $D(g_j) \\\\cap
        D(g_k) = D(g_j g_k)$, the restriction of $\\\\mathcal{F}$ is $\\\\widetilde{(M_j)_{g_k}}$.
        Since $\\\\mathcal{F}$ is a sheaf, for any section $s \\\\in \\\\Gamma(U,
        \\\\mathcal{F})$ such that $\\\\left.s\\\\right|_{D(g)} = 0$, we have $\\\\left.s\\\\right|_{D(g
        g_j)} = 0$ in $(M_j)_g$ for all $j$. Thus for each $j$, there exists $n_j
        \\\\ge 1$ such that $g^{n_j} (\\\\left.s\\\\right|_{D(g_j)}) = 0$ in $M_j
        = \\\\Gamma(D(g_j), \\\\mathcal{F})$. Taking $N = \\\\max_j n_j$, we have
        $\\\\left.(g^N s)\\\\right|_{D(g_j)} = 0$ for all $j$. By the Locality axiom
        for $\\\\mathcal{F}$ on the cover $\\\\{D(g_j)\\\\}$ of $U$, $g^N s = 0$ in
        $M = \\\\Gamma(U, \\\\mathcal{F})$. This proves that $\\\\rho : M_g \\\\to
        \\\\Gamma(D(g), \\\\mathcal{F})$ is injective!\\n\\nSimilarly, to show $\\\\rho$
        is surjective, let $t \\\\in \\\\Gamma(D(g), \\\\mathcal{F})$. For each $j$,
        the restriction $\\\\left.t\\\\right|_{D(g g_j)} \\\\in \\\\Gamma(D(g g_j),
        \\\\mathcal{F}) = (M_j)_g$ can be written as $t_j / g^{m_j}$ for some $t_j
        \\\\in M_j = \\\\Gamma(D(g_j), \\\\mathcal{F})$. Choosing a single large $m$,
        we have elements $t_j \\\\in \\\\Gamma(D(g_j), \\\\mathcal{F})$ such that
        $\\\\left.t_j\\\\right|_{D(g g_j)} = g^m (\\\\left.t\\\\right|_{D(g g_j)})$.
        On the triple overlap $D(g g_j g_k)$, the sections $t_j$ and $t_k$ agree,
        which means $\\\\left.t_j\\\\right|_{D(g_j g_k)} - \\\\left.t_k\\\\right|_{D(g_j
        g_k)} \\\\in \\\\Gamma(D(g_j g_k), \\\\mathcal{F})$ vanishes on $D(g g_j g_k)$.
        By the injectivity already proven (applied to the affine open $D(g_j g_k)$),
        there is a large integer $l$ such that $g^l(t_j - t_k) = 0$ on $D(g_j g_k)$
        for all $j, k$. Then the sections $g^l t_j \\\\in \\\\Gamma(D(g_j), \\\\mathcal{F})$
        agree on all overlaps $D(g_j g_k)$, so by the Gluing axiom for $\\\\mathcal{F}$,
        they glue to a global section $s \\\\in \\\\Gamma(U, \\\\mathcal{F}) = M$
        satisfying $\\\\left.s\\\\right|_{D(g)} = g^{m+l} t$. Thus $\\\\rho(s / g^{m+l})
        = t$, proving $\\\\rho$ is surjective. $\\\\blacksquare$\\n\\n**Corollary
        4.1.6.** *On any scheme $X$, the kernel, cokernel, and image of any morphism
        of quasi-coherent sheaves are quasi-coherent. Hence $\\\\mathbf{QCoh}(X)$
        is an abelian subcategory of $\\\\mathbf{Mod}(\\\\mathcal{O}_X)$.* $\\\\blacksquare$\\n\\n**Definition
        4.1.7 (Twisting Sheaves on $\\\\operatorname{Proj} S$).** Let $S$ be a graded
        ring and $X = \\\\operatorname{Proj} S$. For any graded $S$-module $M = \\\\bigoplus_{d
        \\\\in \\\\mathbb{Z}} M_d$, we define a quasi-coherent $\\\\mathcal{O}_X$-module
        $\\\\widetilde{M}$ on $X$ by gluing the sheaves $\\\\widetilde{M_{(f)}}$ on
        the affine open cover $D_+(f) = \\\\operatorname{Spec} S_{(f)}$, where $M_{(f)}$
        is the $S_{(f)}$-module of degree-$0$ elements in $M_f$.\\n\\nFor any integer
        $n \\\\in \\\\mathbb{Z}$, let $S(n)$ be the graded $S$-module obtained by
        shifting the grading of $S$ by $n$: $S(n)_d = S_{n+d}$. We define the *twisting
        sheaf* $\\\\mathcal{O}_X(n)$ on $X = \\\\operatorname{Proj} S$ by\\n$$\\\\mathcal{O}_X(n)
        = \\\\widetilde{S(n)}.$$\\nAssume henceforth that $S$ is generated by $S_1$
        as an $S_0$-algebra (e.g., $X = \\\\mathbb{P}^r_A$). Then $X$ is covered by
        the open sets $D_+(f)$ for $f \\\\in S_1$. On $D_+(f)$, the module $S(n)_{(f)}$
        is generated freely as an $S_{(f)}$-module by the single element $f^n \\\\in
        S(n)_{-n+n} = S(n)_0$ via the isomorphism $S_{(f)} \\\\xrightarrow{\\\\sim}
        S(n)_{(f)}$, $a/f^m \\\\mapsto a f^{n-m}$. Thus $\\\\mathcal{O}_X(n)$ is a
        *locally free $\\\\mathcal{O}_X$-module of rank $1$* (an *invertible sheaf*),
        and for any $n, m \\\\in \\\\mathbb{Z}$, we have a canonical isomorphism $\\\\mathcal{O}_X(n)
        \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{O}_X(m) \\\\cong \\\\mathcal{O}_X(n+m)$.
        The sheaf $\\\\mathcal{O}_X(1)$ is called the *twisting sheaf of Serre* (or
        the *hyperplane bundle*).\\n\\n---\\n\\n### 4.2 Divisors, Invertible Sheaves,
        and the Picard Group\\n\\n**Definition 4.2.1.** Let $(X, \\\\mathcal{O}_X)$
        be a ringed space. An $\\\\mathcal{O}_X$-module $\\\\mathcal{E}$ is *locally
        free of rank $r$* if $X$ can be covered by open sets $U$ for which $\\\\left.\\\\mathcal{E}\\\\right|_U
        \\\\cong \\\\left.\\\\mathcal{O}_X^{\\\\oplus r}\\\\right|_U$. A locally free
        sheaf of rank $1$ is called an *invertible sheaf* (or *line bundle*).\\n\\nFor
        any invertible sheaf $\\\\mathcal{L}$, its *dual* $\\\\mathcal{L}^\\\\vee
        = \\\\mathcal{H}om_{\\\\mathcal{O}_X}(\\\\mathcal{L}, \\\\mathcal{O}_X)$ (the
        sheaf $U \\\\mapsto \\\\operatorname{Hom}_{\\\\left.\\\\mathcal{O}_X\\\\right|_U}(\\\\left.\\\\mathcal{L}\\\\right|_U,
        \\\\left.\\\\mathcal{O}_X\\\\right|_U)$) is also an invertible sheaf, and
        the natural evaluation map\\n$$\\\\mathcal{L} \\\\otimes_{\\\\mathcal{O}_X}
        \\\\mathcal{L}^\\\\vee \\\\xrightarrow{\\\\sim} \\\\mathcal{O}_X$$\\nis an
        isomorphism (as can be checked immediately on a local trivializing cover where
        $\\\\left.\\\\mathcal{L}\\\\right|_U \\\\cong \\\\left.\\\\mathcal{O}_X\\\\right|_U$).
        Consequently, the set of isomorphism classes of invertible sheaves on $X$
        forms an abelian group under the operation $\\\\otimes_{\\\\mathcal{O}_X}$,
        with identity element $\\\\mathcal{O}_X$ and inverse $\\\\mathcal{L}^{-1}
        = \\\\mathcal{L}^\\\\vee$. This group is called the *Picard group* of $X$,
        denoted $\\\\operatorname{Pic}(X)$.\\n\\nWe now relate $\\\\operatorname{Pic}(X)$
        to divisors. Let $X$ be an integral scheme, with generic point $\\\\eta$ and
        function field $K = K(X) = \\\\mathcal{O}_{X, \\\\eta}$. Let $\\\\mathcal{K}$
        be the constant sheaf on $X$ with value $K$ (since $X$ is irreducible, $\\\\mathcal{K}(U)
        = K$ for every non-empty open $U \\\\subseteq X$). Note that $\\\\mathcal{O}_X$
        is canonically a subsheaf of $\\\\mathcal{K}$.\\n\\n**Definition 4.2.2.**
        Let $X$ be an integral scheme. A *Cartier divisor* on $X$ is a global section
        of the quotient sheaf $\\\\mathcal{K}^\\\\times / \\\\mathcal{O}_X^\\\\times$.
        By the construction of quotient sheaves (sheafification), a Cartier divisor
        $D$ is represented by data $\\\\{(U_i, f_i)\\\\}_{i \\\\in I}$, where $\\\\{U_i\\\\}$
        is an open covering of $X$ and $f_i \\\\in \\\\Gamma(U_i, \\\\mathcal{K}^\\\\times)
        = K^\\\\times$, such that for all $i, j$, the ratio $f_i / f_j$ lies in $\\\\Gamma(U_i
        \\\\cap U_j, \\\\mathcal{O}_X^\\\\times)$. Two such collections $\\\\{(U_i,
        f_i)\\\\}$ and $\\\\{(V_j, g_j)\\\\}$ define the same Cartier divisor if $f_i
        / g_j \\\\in \\\\Gamma(U_i \\\\cap V_j, \\\\mathcal{O}_X^\\\\times)$ for all
        $i, j$.\\n\\nThe Cartier divisors form an abelian group $\\\\operatorname{Div}(X)
        = \\\\Gamma(X, \\\\mathcal{K}^\\\\times / \\\\mathcal{O}_X^\\\\times)$, which
        we write additively: if $D_1 = \\\\{(U_i, f_i)\\\\}$ and $D_2 = \\\\{(U_i,
        g_i)\\\\}$ (after passing to a common refinement), then $D_1 + D_2 = \\\\{(U_i,
        f_i g_i)\\\\}$. A Cartier divisor is *principal* if it lies in the image of
        the natural map $\\\\Gamma(X, \\\\mathcal{K}^\\\\times) = K^\\\\times \\\\to
        \\\\operatorname{Div}(X)$, i.e., it can be represented by a single pair $(X,
        f)$ for $f \\\\in K^\\\\times$. Two Cartier divisors $D_1, D_2$ are *linearly
        equivalent*, written $D_1 \\\\sim D_2$, if $D_1 - D_2$ is principal. The quotient
        group of Cartier divisors modulo principal divisors is the *Cartier divisor
        class group*, denoted $\\\\operatorname{CaCl}(X)$.\\n\\n**Definition 4.2.3.**
        Let $D = \\\\{(U_i, f_i)\\\\}$ be a Cartier divisor on an integral scheme
        $X$. We define an $\\\\mathcal{O}_X$-submodule $\\\\mathcal{O}_X(D) \\\\subseteq
        \\\\mathcal{K}$ by specifying its restriction on each open set $U_i$:\\n$$\\\\left.\\\\mathcal{O}_X(D)\\\\right|_{U_i}
        = f_i^{-1} \\\\left.\\\\mathcal{O}_X\\\\right|_{U_i} \\\\subseteq \\\\left.\\\\mathcal{K}\\\\right|_{U_i}.$$\\nSince
        $f_i / f_j \\\\in \\\\mathcal{O}_X(U_i \\\\cap U_j)^\\\\times$, we have $f_i^{-1}
        \\\\mathcal{O}_X = f_j^{-1} (f_j / f_i) \\\\mathcal{O}_X = f_j^{-1} \\\\mathcal{O}_X$
        on $U_i \\\\cap U_j$, so these subsheaves agree on overlaps and define a well-defined
        invertible subsheaf $\\\\mathcal{O}_X(D) \\\\subseteq \\\\mathcal{K}$.\\n\\n**Proposition
        4.2.4.** *Let $X$ be an integral scheme.*\\n1. *For any two Cartier divisors
        $D_1, D_2$, there is a canonical isomorphism $\\\\mathcal{O}_X(D_1 + D_2)
        \\\\cong \\\\mathcal{O}_X(D_1) \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{O}_X(D_2)$.*\\n2.
        *$D_1 \\\\sim D_2$ if and only if $\\\\mathcal{O}_X(D_1) \\\\cong \\\\mathcal{O}_X(D_2)$
        as abstract $\\\\mathcal{O}_X$-modules.*\\n3. *The map $D \\\\mapsto \\\\mathcal{O}_X(D)$
        induces a group isomorphism $\\\\operatorname{CaCl}(X) \\\\xrightarrow{\\\\sim}
        \\\\operatorname{Pic}(X)$.*\\n\\n*Proof.* (1) Multiplication inside $\\\\mathcal{K}$
        defines a surjective morphism $\\\\mathcal{O}_X(D_1) \\\\otimes_{\\\\mathcal{O}_X}
        \\\\mathcal{O}_X(D_2) \\\\to \\\\mathcal{O}_X(D_1 + D_2)$, which on a common
        trivializing open $U_i$ sends $f_i^{-1} \\\\otimes g_i^{-1} \\\\mapsto (f_i
        g_i)^{-1}$, hence is an isomorphism.\\n\\n(2) By (1), it suffices to show
        $D$ is principal if and only if $\\\\mathcal{O}_X(D) \\\\cong \\\\mathcal{O}_X$.
        If $D = \\\\operatorname{div}(f) = \\\\{(X, f)\\\\}$, then $\\\\mathcal{O}_X(D)
        = f^{-1} \\\\mathcal{O}_X$, and multiplication by $f$ gives an isomorphism
        $f^{-1}\\\\mathcal{O}_X \\\\xrightarrow{\\\\sim} \\\\mathcal{O}_X$. Conversely,
        if $\\\\varphi : \\\\mathcal{O}_X \\\\xrightarrow{\\\\sim} \\\\mathcal{O}_X(D)$
        is an isomorphism, tensoring with $\\\\mathcal{K}$ over $\\\\mathcal{O}_X$
        yields an automorphism of $\\\\mathcal{K}$, which is multiplication by $f^{-1}
        = \\\\varphi(X)(1) \\\\in \\\\Gamma(X, \\\\mathcal{O}_X(D)) \\\\subseteq K^\\\\times$.
        Then $\\\\mathcal{O}_X(D) = \\\\varphi(\\\\mathcal{O}_X) = f^{-1}\\\\mathcal{O}_X$,
        so on each $U_i$, $f^{-1}\\\\mathcal{O}_{U_i} = f_i^{-1}\\\\mathcal{O}_{U_i}$,
        meaning $f / f_i \\\\in \\\\mathcal{O}_X(U_i)^\\\\times$. Thus $D = \\\\{(X,
        f)\\\\}$ is principal.\\n\\n(3) By (1) and (2), $D \\\\mapsto \\\\mathcal{O}_X(D)$
        induces an injective homomorphism $\\\\operatorname{CaCl}(X) \\\\hookrightarrow
        \\\\operatorname{Pic}(X)$. To show surjectivity, let $\\\\mathcal{L}$ be any
        invertible sheaf on $X$. Since $\\\\mathcal{L}$ is locally isomorphic to $\\\\mathcal{O}_X$,
        $\\\\mathcal{L} \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{K}$ is a sheaf of
        $\\\\mathcal{K}$-modules that is locally isomorphic to $\\\\mathcal{K}$. Since
        $X$ is irreducible and $\\\\mathcal{K}$ is the constant sheaf $K$, on the
        generic stalk $\\\\eta$ we have $(\\\\mathcal{L} \\\\otimes_{\\\\mathcal{O}_X}
        \\\\mathcal{K})_\\\\eta \\\\cong \\\\mathcal{L}_\\\\eta \\\\otimes_{\\\\mathcal{O}_{X,\\\\eta}}
        K = \\\\mathcal{L}_\\\\eta \\\\cong K$, and this isomorphism extends to a
        global isomorphism of constant sheaves $\\\\mathcal{L} \\\\otimes_{\\\\mathcal{O}_X}
        \\\\mathcal{K} \\\\xrightarrow{\\\\sim} \\\\mathcal{K}$. Since $\\\\mathcal{L}$
        is locally free and $X$ is integral, the natural map $\\\\mathcal{L} \\\\to
        \\\\mathcal{L} \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{K} \\\\cong \\\\mathcal{K}$
        is injective, embedding $\\\\mathcal{L}$ as an invertible $\\\\mathcal{O}_X$-submodule
        of $\\\\mathcal{K}$. Choose an open cover $\\\\{U_i\\\\}$ of $X$ trivializing
        $\\\\mathcal{L}$, and let $e_i \\\\in \\\\mathcal{L}(U_i) \\\\subseteq \\\\mathcal{K}(U_i)
        = K$ be a local generator of $\\\\left.\\\\mathcal{L}\\\\right|_{U_i}$. Since
        $\\\\mathcal{L}(U_i) \\\\neq 0$, $e_i \\\\in K^\\\\times$. Set $f_i = e_i^{-1}
        \\\\in K^\\\\times$. On $U_i \\\\cap U_j$, both $f_i^{-1}$ and $f_j^{-1}$
        generate $\\\\left.\\\\mathcal{L}\\\\right|_{U_i \\\\cap U_j}$, so $f_i /
        f_j \\\\in \\\\mathcal{O}_X(U_i \\\\cap U_j)^\\\\times$. Thus $D = \\\\{(U_i,
        f_i)\\\\}$ is a Cartier divisor satisfying $\\\\mathcal{O}_X(D) = \\\\mathcal{L}$.
        $\\\\blacksquare$\\n\\n---\\n\\n### 4.3 K\xE4hler Differentials and Nonsingularity\\n\\n**Definition
        4.3.1.** Let $A$ be a ring, $B$ an $A$-algebra, and $M$ a $B$-module. An *$A$-derivation*
        of $B$ into $M$ is an $A$-linear map $d : B \\\\to M$ satisfying the Leibniz
        rule:\\n$$d(bb') = b\\\\,db' + b'\\\\,db \\\\quad \\\\text{for all } b, b'
        \\\\in B.$$\\n(Note that $d(1) = d(1 \\\\cdot 1) = 2d(1) \\\\implies d(1)
        = 0$, so $d(a) = 0$ for all $a \\\\in A$). The set of all $A$-derivations
        of $B$ into $M$ is a $B$-module denoted $\\\\operatorname{Der}_A(B, M)$.\\n\\nThe
        *module of relative differential forms* (or *K\xE4hler differentials*) of
        $B$ over $A$, denoted $\\\\Omega_{B/A}^1$, is a $B$-module equipped with a
        universal $A$-derivation $d : B \\\\to \\\\Omega_{B/A}^1$, such that for any
        $B$-module $M$, the natural map\\n$$\\\\operatorname{Hom}_B(\\\\Omega_{B/A}^1,
        M) \\\\xrightarrow{\\\\sim} \\\\operatorname{Der}_A(B, M), \\\\quad \\\\varphi
        \\\\longmapsto \\\\varphi \\\\circ d$$\\nis an isomorphism of $B$-modules.\\n\\n**Proposition
        4.3.2.** *For any $A$-algebra $B$, the pair $(\\\\Omega_{B/A}^1, d)$ exists
        and is unique up to unique isomorphism. Explicitly, let $\\\\mu : B \\\\otimes_A
        B \\\\to B$ be the multiplication homomorphism $b \\\\otimes b' \\\\mapsto
        bb'$, and let $I = \\\\ker \\\\mu$. Then $I / I^2$ has a natural structure
        of a $(B \\\\otimes_A B)/I \\\\cong B$-module, and there is a canonical isomorphism
        $\\\\Omega_{B/A}^1 \\\\cong I / I^2$, under which the universal derivation
        is given by $d(b) = (1 \\\\otimes b - b \\\\otimes 1) \\\\pmod{I^2}$.*\\n\\n*Proof.*
        One can construct $\\\\Omega_{B/A}^1$ directly as the quotient of the free
        $B$-module generated by symbols $\\\\{db \\\\mid b \\\\in B\\\\}$ modulo the
        relations $d(b+b') - db - db'$, $d(bb') - b\\\\,db' - b'\\\\,db$, and $da$
        for $a \\\\in A$; the universal property is then immediate.\\n\\nTo prove
        the alternative description via $I / I^2$, let $d' : B \\\\to I / I^2$ be
        the map $d'(b) = (1 \\\\otimes b - b \\\\otimes 1) \\\\pmod{I^2}$. Clearly
        $d'$ is $A$-linear. For $b, b' \\\\in B$, we compute in $B \\\\otimes_A B$:\\n$$1
        \\\\otimes bb' - bb' \\\\otimes 1 = (1 \\\\otimes b - b \\\\otimes 1)(1 \\\\otimes
        b') + (b \\\\otimes 1)(1 \\\\otimes b' - b' \\\\otimes 1).$$\\nNote that in
        $I / I^2$, the $B$-module structure is given simultaneously by left multiplication
        by $b \\\\otimes 1$ or right multiplication by $1 \\\\otimes b$, because their
        difference is $(1 \\\\otimes b - b \\\\otimes 1) \\\\in I$, which annihilates
        $I / I^2$. Therefore, reducing modulo $I^2$, the identity above becomes\\n$$d'(bb')
        = b'\\\\,d'(b) + b\\\\,d'(b'),$$\\nso $d'$ is an $A$-derivation. By the universal
        property of $\\\\Omega_{B/A}^1$, there is a unique $B$-module homomorphism
        $\\\\alpha : \\\\Omega_{B/A}^1 \\\\to I / I^2$ sending $db \\\\mapsto d'(b)$.\\n\\nConversely,
        consider the ring $(B \\\\oplus \\\\Omega_{B/A}^1)$ where multiplication is
        given by $(b_1, \\\\omega_1)(b_2, \\\\omega_2) = (b_1 b_2, b_1 \\\\omega_2
        + b_2 \\\\omega_1)$ (so $\\\\Omega_{B/A}^1$ is a square-zero ideal). Define
        an $A$-bilinear map $B \\\\times B \\\\to B \\\\oplus \\\\Omega_{B/A}^1$ by
        $(b_1, b_2) \\\\mapsto (b_1 b_2, b_1\\\\,db_2)$. This induces an $A$-algebra
        homomorphism $\\\\psi : B \\\\otimes_A B \\\\to B \\\\oplus \\\\Omega_{B/A}^1$
        sending $\\\\sum b_i \\\\otimes c_i \\\\mapsto (\\\\sum b_i c_i, \\\\sum b_i\\\\,dc_i)$.
        Notice that if $x = \\\\sum b_i \\\\otimes c_i \\\\in I = \\\\ker \\\\mu$,
        then $\\\\sum b_i c_i = 0$, so $\\\\psi(x) = (0, \\\\sum b_i\\\\,dc_i) \\\\in
        \\\\Omega_{B/A}^1$. Since $\\\\Omega_{B/A}^1$ has square zero in $B \\\\oplus
        \\\\Omega_{B/A}^1$, $\\\\psi(I^2) = 0$. Thus $\\\\psi$ induces a $B$-linear
        map $\\\\beta : I / I^2 \\\\to \\\\Omega_{B/A}^1$. For any $b \\\\in B$, $\\\\beta(d'(b))
        = \\\\beta(1 \\\\otimes b - b \\\\otimes 1) = 1\\\\,db - b\\\\,d(1) = db$.
        Moreover, since $I$ is generated as a left $B$-module by elements of the form
        $1 \\\\otimes b - b \\\\otimes 1$ (as $\\\\sum b_i \\\\otimes c_i = \\\\sum
        (b_i \\\\otimes 1)(1 \\\\otimes c_i - c_i \\\\otimes 1)$ when $\\\\sum b_i
        c_i = 0$), $\\\\alpha$ and $\\\\beta$ are mutually inverse isomorphisms. $\\\\blacksquare$\\n\\n**Proposition
        4.3.3 (Fundamental Exact Sequences of Differentials).** \\n1. *(First Exact
        Sequence) Let $A \\\\to B \\\\to C$ be ring homomorphisms. Then there is a
        natural exact sequence of $C$-modules:*\\n$$\\\\Omega_{B/A}^1 \\\\otimes_B
        C \\\\xrightarrow{\\\\alpha} \\\\Omega_{C/A}^1 \\\\xrightarrow{\\\\beta} \\\\Omega_{C/B}^1
        \\\\longrightarrow 0.$$\\n2. *(Second Exact Sequence / Conormal Sequence)
        Let $B$ be an $A$-algebra, $\\\\mathfrak{a} \\\\subseteq B$ an ideal, and
        $C = B/\\\\mathfrak{a}$. Then there is a natural exact sequence of $C$-modules:*\\n$$\\\\mathfrak{a}/\\\\mathfrak{a}^2
        \\\\xrightarrow{\\\\delta} \\\\Omega_{B/A}^1 \\\\otimes_B C \\\\xrightarrow{\\\\alpha}
        \\\\Omega_{C/A}^1 \\\\longrightarrow 0$$\\n*where $\\\\delta(\\\\bar{x}) =
        dx \\\\otimes 1$ for $x \\\\in \\\\mathfrak{a}$.*\\n\\n*Proof.* By the Yoneda
        Lemma, a sequence of $C$-modules $M' \\\\to M \\\\to M'' \\\\to 0$ is exact
        if and only if for every $C$-module $N$, the induced sequence $0 \\\\to \\\\operatorname{Hom}_C(M'',
        N) \\\\to \\\\operatorname{Hom}_C(M, N) \\\\to \\\\operatorname{Hom}_C(M',
        N)$ is exact.\\n\\n(1) Using the universal property and the adjunction $\\\\operatorname{Hom}_C(\\\\Omega_{B/A}^1
        \\\\otimes_B C, N) \\\\cong \\\\operatorname{Hom}_B(\\\\Omega_{B/A}^1, N)
        \\\\cong \\\\operatorname{Der}_A(B, N)$, applying $\\\\operatorname{Hom}_C(-,
        N)$ yields the sequence\\n$$0 \\\\longrightarrow \\\\operatorname{Der}_B(C,
        N) \\\\xrightarrow{\\\\beta^*} \\\\operatorname{Der}_A(C, N) \\\\xrightarrow{\\\\alpha^*}
        \\\\operatorname{Der}_A(B, N).$$\\nHere $\\\\beta^*$ is the natural inclusion
        (a $B$-derivation is automatically an $A$-derivation), and $\\\\alpha^*$ is
        restriction/composition with $f : B \\\\to C$. An $A$-derivation $D : C \\\\to
        N$ is a $B$-derivation if and only if $D(f(b)) = 0$ for all $b \\\\in B$,
        which is precisely $\\\\alpha^*(D) = 0$. Thus the dual sequence is exact for
        all $N$.\\n\\n(2) Since $C = B/\\\\mathfrak{a}$ is a quotient of $B$, every
        $B$-derivation of $C$ is zero, so $\\\\Omega_{C/B}^1 = 0$ and $\\\\alpha$
        is surjective by (1). Notice that for $x, y \\\\in \\\\mathfrak{a}$, $d(xy)
        \\\\otimes 1 = x\\\\,dy \\\\otimes 1 + y\\\\,dx \\\\otimes 1 = dy \\\\otimes
        \\\\bar{x} + dx \\\\otimes \\\\bar{y} = 0$ because $\\\\bar{x} = \\\\bar{y}
        = 0$ in $C$. Thus $\\\\delta : \\\\mathfrak{a}/\\\\mathfrak{a}^2 \\\\to \\\\Omega_{B/A}^1
        \\\\otimes_B C$ is well-defined and $C$-linear. Applying $\\\\operatorname{Hom}_C(-,
        N)$ gives\\n$$0 \\\\longrightarrow \\\\operatorname{Der}_A(C, N) \\\\xrightarrow{\\\\alpha^*}
        \\\\operatorname{Der}_A(B, N) \\\\xrightarrow{\\\\delta^*} \\\\operatorname{Hom}_C(\\\\mathfrak{a}/\\\\mathfrak{a}^2,
        N).$$\\nNote that for any $A$-derivation $D : B \\\\to N$ into a $C = B/\\\\mathfrak{a}$-module
        $N$, its restriction to $\\\\mathfrak{a}$ vanishes on $\\\\mathfrak{a}^2$
        (by the Leibniz rule and the fact that $\\\\mathfrak{a}N = 0$) and is $B$-linear
        (hence $C$-linear). Thus $D \\\\in \\\\operatorname{Der}_A(B, N)$ factors
        through $C = B/\\\\mathfrak{a}$ (meaning $D \\\\in \\\\operatorname{im} \\\\alpha^*$)
        if and only if $\\\\left.D\\\\right|_{\\\\mathfrak{a}} = 0$, which is $\\\\delta^*(D)
        = 0$. $\\\\blacksquare$\\n\\n**Definition 4.3.4.** Let $f : X \\\\to Y$ be
        a morphism of schemes. By Corollary 3.5.3, the diagonal morphism $\\\\Delta
        : X \\\\to X \\\\times_Y X$ is a locally closed immersion: there is an open
        subscheme $W \\\\subseteq X \\\\times_Y X$ such that $\\\\Delta : X \\\\to
        W$ is a closed immersion. Let $\\\\mathcal{I} \\\\subseteq \\\\mathcal{O}_W$
        be the quasi-coherent ideal sheaf defining the closed subscheme $\\\\Delta(X)$
        inside $W$. We define the *sheaf of relative differentials* of $X$ over $Y$
        to be the quasi-coherent $\\\\mathcal{O}_X$-module\\n$$\\\\Omega_{X/Y}^1 =
        \\\\Delta^*(\\\\mathcal{I}/\\\\mathcal{I}^2).$$\\nBy Proposition 4.3.2, for
        any affine open $V = \\\\operatorname{Spec} A \\\\subseteq Y$ and any affine
        open $U = \\\\operatorname{Spec} B \\\\subseteq f^{-1}(V)$, we have $\\\\left.\\\\Omega_{X/Y}^1\\\\right|_U
        \\\\cong \\\\widetilde{\\\\Omega_{B/A}^1}$.\\n\\n**Theorem 4.3.5 (The Euler
        Exact Sequence).** *Let $A$ be a ring, $Y = \\\\operatorname{Spec} A$, and
        $X = \\\\mathbb{P}^n_A = \\\\operatorname{Proj} S$ where $S = A[x_0, \\\\dots,
        x_n]$. There is a canonical exact sequence of locally free $\\\\mathcal{O}_X$-modules
        on $X$:*\\n$$0 \\\\longrightarrow \\\\Omega_{X/Y}^1 \\\\longrightarrow \\\\mathcal{O}_X(-1)^{\\\\oplus
        (n+1)} \\\\longrightarrow \\\\mathcal{O}_X \\\\longrightarrow 0.$$\\n\\n*Proof.*
        Let $E = \\\\bigoplus_{i=0}^n S(-1) e_i$ be the free graded $S$-module generated
        by symbols $e_0, \\\\dots, e_n$ in degree $1$, so that $\\\\widetilde{E} =
        \\\\mathcal{O}_X(-1)^{\\\\oplus (n+1)}$. Define a degree-$0$ homomorphism
        of graded $S$-modules $\\\\beta : E \\\\to S$ by sending $e_i \\\\mapsto x_i$.
        Since the image of $\\\\beta$ is the irrelevant ideal $(x_0, \\\\dots, x_n)
        = S_+$, the induced morphism of sheaves $\\\\widetilde{\\\\beta} : \\\\mathcal{O}_X(-1)^{\\\\oplus
        (n+1)} \\\\to \\\\mathcal{O}_X$ is surjective on every basic open $D_+(x_j)$
        (since $x_j$ becomes a unit in $S_{(x_j)}$), hence is a surjective morphism
        of sheaves.\\n\\nNow we construct an injective morphism $\\\\alpha : \\\\Omega_{X/Y}^1
        \\\\to \\\\mathcal{O}_X(-1)^{\\\\oplus (n+1)}$ whose image is $\\\\ker \\\\widetilde{\\\\beta}$.
        On each standard affine open $U_j = D_+(x_j) = \\\\operatorname{Spec} A\\\\left[\\\\frac{x_0}{x_j},
        \\\\dots, \\\\frac{x_n}{x_j}\\\\right]$, the module of differentials $\\\\Gamma(U_j,
        \\\\Omega_{X/Y}^1)$ is the free $S_{(x_j)}$-module of rank $n$ generated by
        the differentials $d\\\\left(\\\\frac{x_i}{x_j}\\\\right)$ for $i \\\\neq
        j$. On $U_j$, we have $\\\\Gamma(U_j, \\\\mathcal{O}_X(-1)^{\\\\oplus (n+1)})
        = \\\\bigoplus_{i=0}^n S(-1)_{(x_j)} e_i$. Define $\\\\alpha(U_j)$ by setting\\n$$\\\\alpha(U_j)\\\\left(d\\\\left(\\\\frac{x_i}{x_j}\\\\right)\\\\right)
        = \\\\frac{1}{x_j} e_i - \\\\frac{x_i}{x_j^2} e_j \\\\in \\\\Gamma(U_j, \\\\mathcal{O}_X(-1)^{\\\\oplus
        (n+1)})$$\\n(noting that $\\\\frac{1}{x_j}$ and $\\\\frac{x_i}{x_j^2}$ have
        degree $-1$ in $S_{x_j}$, hence lie in $S(-1)_{(x_j)}$). Let us check that
        $\\\\alpha(U_j)$ and $\\\\alpha(U_k)$ agree on the overlap $U_j \\\\cap U_k$:
        using the quotient rule for derivations in $S_{(x_j x_k)}$,\\n$$d\\\\left(\\\\frac{x_i}{x_k}\\\\right)
        = d\\\\left(\\\\frac{x_i/x_j}{x_k/x_j}\\\\right) = \\\\frac{x_j}{x_k} d\\\\left(\\\\frac{x_i}{x_j}\\\\right)
        - \\\\frac{x_i x_j}{x_k^2} d\\\\left(\\\\frac{x_k}{x_j}\\\\right).$$\\nApplying
        $\\\\alpha(U_j)$ to the right-hand side yields\\n$$\\\\frac{x_j}{x_k}\\\\left(\\\\frac{1}{x_j}
        e_i - \\\\frac{x_i}{x_j^2} e_j\\\\right) - \\\\frac{x_i x_j}{x_k^2}\\\\left(\\\\frac{1}{x_j}
        e_k - \\\\frac{x_k}{x_j^2} e_j\\\\right) = \\\\frac{1}{x_k} e_i - \\\\frac{x_i}{x_k^2}
        e_k = \\\\alpha(U_k)\\\\left(d\\\\left(\\\\frac{x_i}{x_k}\\\\right)\\\\right).$$\\nThus
        the maps $\\\\alpha(U_j)$ glue to a well-defined global morphism $\\\\alpha
        : \\\\Omega_{X/Y}^1 \\\\to \\\\mathcal{O}_X(-1)^{\\\\oplus (n+1)}$.\\n\\nFinally,
        we check exactness on $U_j$. Under the map $\\\\widetilde{\\\\beta}(U_j)$
        sending $e_i \\\\mapsto x_i$, the image of $\\\\alpha(U_j)\\\\left(d\\\\left(\\\\frac{x_i}{x_j}\\\\right)\\\\right)$
        is $\\\\frac{1}{x_j} x_i - \\\\frac{x_i}{x_j^2} x_j = 0$, so $\\\\operatorname{im}
        \\\\alpha \\\\subseteq \\\\ker \\\\widetilde{\\\\beta}$. Moreover, on $U_j$,
        using the basis elements $f_i = \\\\frac{1}{x_j} e_i$ of $\\\\Gamma(U_j, \\\\mathcal{O}_X(-1)^{\\\\oplus
        (n+1)}) \\\\cong S_{(x_j)}^{\\\\oplus (n+1)}$, the map $\\\\widetilde{\\\\beta}(U_j)$
        sends $f_j \\\\mapsto 1$ and $f_i \\\\mapsto \\\\frac{x_i}{x_j}$. Thus $\\\\ker
        \\\\widetilde{\\\\beta}(U_j)$ is freely generated by the $n$ elements $f_i
        - \\\\frac{x_i}{x_j} f_j$ for $i \\\\neq j$, which are precisely the images
        under $\\\\alpha(U_j)$ of the basis elements $d\\\\left(\\\\frac{x_i}{x_j}\\\\right)$
        of $\\\\Gamma(U_j, \\\\Omega_{X/Y}^1)$. Therefore, $\\\\alpha(U_j)$ is injective
        and its image is $\\\\ker \\\\widetilde{\\\\beta}(U_j)$. $\\\\blacksquare$\\n\\n**Definition
        4.3.6.** Let $X$ be a Noetherian scheme. A point $P \\\\in X$ is *regular*
        (or *nonsingular*) if the local ring $\\\\mathcal{O}_{X,P}$ is a *regular
        local ring*, meaning that the dimension of its Zariski cotangent space as
        a vector space over the residue field $k(P) = \\\\mathcal{O}_{X,P}/\\\\mathfrak{m}_P$
        equals the Krull dimension of $\\\\mathcal{O}_{X,P}$:\\n$$\\\\dim_{k(P)} (\\\\mathfrak{m}_P
        / \\\\mathfrak{m}_P^2) = \\\\dim \\\\mathcal{O}_{X,P}.$$\\nWe say $X$ is *regular*
        (or *nonsingular*) if it is regular at every point.\\n\\n**Theorem 4.3.7 (The
        Jacobian Criterion and Smoothness).** *Let $k$ be an algebraically closed
        field, and let $X$ be an irreducible variety of dimension $d$ over $k$ (viewed
        as an integral scheme of finite type over $k$).*\\n1. *(Jacobian Criterion)
        Suppose $X \\\\subseteq \\\\mathbb{A}^n_k = \\\\operatorname{Spec} k[x_1,
        \\\\dots, x_n]$ is an affine variety with ideal $I(X) = (f_1, \\\\dots, f_m)$.
        Let $P \\\\in X$ be a closed point. Then $X$ is nonsingular at $P$ if and
        only if the rank of the $m \\\\times n$ Jacobian matrix $J_P = \\\\left(\\\\frac{\\\\partial
        f_i}{\\\\partial x_j}(P)\\\\right)$ is equal to $n - d$.*\\n2. *A closed point
        $P \\\\in X$ is nonsingular if and only if the stalk $(\\\\Omega_{X/k}^1)_P$
        is a free $\\\\mathcal{O}_{X,P}$-module of rank $d$. Consequently, $X$ is
        nonsingular at all closed points if and only if $\\\\Omega_{X/k}^1$ is a locally
        free sheaf of rank $d$.*\\n\\n*Proof.* (1) Let $A = k[x_1, \\\\dots, x_n]$,
        $\\\\mathfrak{m} = (x_1 - a_1, \\\\dots, x_n - a_n)$ be the maximal ideal
        of $P = (a_1, \\\\dots, a_n)$ in $A$, and $\\\\mathfrak{a} = I(X) \\\\subseteq
        \\\\mathfrak{m}$. Then $\\\\mathcal{O}_{X,P} = (A/\\\\mathfrak{a})_\\\\mathfrak{m}$
        has maximal ideal $\\\\mathfrak{m}_P = \\\\mathfrak{m}/\\\\mathfrak{a}$ (localized
        at $\\\\mathfrak{m}$), and $\\\\mathfrak{m}_P / \\\\mathfrak{m}_P^2 \\\\cong
        \\\\mathfrak{m} / (\\\\mathfrak{m}^2 + \\\\mathfrak{a})$. Thus there is an
        exact sequence of $k$-vector spaces:\\n$$0 \\\\longrightarrow (\\\\mathfrak{a}
        + \\\\mathfrak{m}^2)/\\\\mathfrak{m}^2 \\\\longrightarrow \\\\mathfrak{m}/\\\\mathfrak{m}^2
        \\\\longrightarrow \\\\mathfrak{m}_P/\\\\mathfrak{m}_P^2 \\\\longrightarrow
        0.$$\\nNotice that $\\\\mathfrak{m}/\\\\mathfrak{m}^2$ is an $n$-dimensional
        $k$-vector space with basis $dx_j = (x_j - a_j) \\\\pmod{\\\\mathfrak{m}^2}$.
        By Taylor expansion at $P$, for any polynomial $f \\\\in \\\\mathfrak{a}$,
        its class in $(\\\\mathfrak{a} + \\\\mathfrak{m}^2)/\\\\mathfrak{m}^2 \\\\subseteq
        \\\\mathfrak{m}/\\\\mathfrak{m}^2$ is given by\\n$$f \\\\equiv \\\\sum_{j=1}^n
        \\\\frac{\\\\partial f}{\\\\partial x_j}(P) (x_j - a_j) \\\\pmod{\\\\mathfrak{m}^2}.$$\\nTherefore,
        the subspace $(\\\\mathfrak{a} + \\\\mathfrak{m}^2)/\\\\mathfrak{m}^2$ is
        spanned by the rows of the Jacobian matrix $J_P$, so its dimension is $\\\\operatorname{rank}(J_P)$.
        By the exact sequence, $\\\\dim_k(\\\\mathfrak{m}_P/\\\\mathfrak{m}_P^2) =
        n - \\\\operatorname{rank}(J_P)$. Since $\\\\dim \\\\mathcal{O}_{X,P} = \\\\dim
        X = d$, $P$ is nonsingular if and only if $n - \\\\operatorname{rank}(J_P)
        = d$, i.e., $\\\\operatorname{rank}(J_P) = n - d$.\\n\\n(2) By the Second
        Exact Sequence of differentials (Proposition 4.3.3(2)) applied to $B = A_\\\\mathfrak{m}$,
        $C = \\\\mathcal{O}_{X,P} = B/\\\\mathfrak{a}B$, and $k$, after tensoring
        with $k(P) = k$ we obtain an exact sequence of $k$-vector spaces:\\n$$\\\\mathfrak{a}B/\\\\mathfrak{a}\\\\mathfrak{m}B
        \\\\xrightarrow{\\\\bar{\\\\delta}} \\\\Omega_{B/k}^1 \\\\otimes_B k \\\\longrightarrow
        (\\\\Omega_{X/k}^1)_P \\\\otimes_{\\\\mathcal{O}_{X,P}} k \\\\longrightarrow
        0.$$\\nSince $\\\\Omega_{B/k}^1$ is free of rank $n$ with basis $dx_1, \\\\dots,
        dx_n$, the map $\\\\bar{\\\\delta}$ sends $f_i$ to $\\\\sum_j \\\\frac{\\\\partial
        f_i}{\\\\partial x_j}(P) dx_j$, so its image has dimension $\\\\operatorname{rank}(J_P)$.
        Thus $\\\\dim_k((\\\\Omega_{X/k}^1)_P \\\\otimes k) = n - \\\\operatorname{rank}(J_P)
        = \\\\dim_k(\\\\mathfrak{m}_P / \\\\mathfrak{m}_P^2)$!\\n\\nNow, let $K =
        K(X)$ be the function field of $X$. Since $k$ is algebraically closed (hence
        perfect), $K/k$ is a separably generated extension of transcendence degree
        $d$, so $(\\\\Omega_{X/k}^1)_\\\\eta = \\\\Omega_{K/k}^1$ is a $K$-vector
        space of dimension $d$. By Nakayama's Lemma, for any closed point $P \\\\in
        X$, the finitely generated $\\\\mathcal{O}_{X,P}$-module $M = (\\\\Omega_{X/k}^1)_P$
        can be generated by $r = \\\\dim_k(M \\\\otimes k) = \\\\dim_k(\\\\mathfrak{m}_P/\\\\mathfrak{m}_P^2)
        \\\\ge \\\\dim \\\\mathcal{O}_{X,P} = d$ elements. If $M$ is free of rank
        $d$, then $r = d$, so $\\\\dim_k(\\\\mathfrak{m}_P/\\\\mathfrak{m}_P^2) =
        d$ and $P$ is nonsingular. Conversely, if $P$ is nonsingular, then $r = d$,
        so there is a surjection $\\\\varphi : \\\\mathcal{O}_{X,P}^{\\\\oplus d}
        \\\\to M$. Localizing at the generic point $\\\\eta$, $\\\\varphi_\\\\eta
        : K^{\\\\oplus d} \\\\to \\\\Omega_{K/k}^1 \\\\cong K^{\\\\oplus d}$ is a
        surjective linear map between $d$-dimensional vector spaces, hence is injective!
        Since $\\\\mathcal{O}_{X,P} \\\\subseteq K$ is an integral domain, $\\\\mathcal{O}_{X,P}^{\\\\oplus
        d} \\\\subseteq K^{\\\\oplus d}$, so $\\\\ker \\\\varphi \\\\subseteq \\\\ker
        \\\\varphi_\\\\eta = 0$. Thus $\\\\varphi$ is an isomorphism, and $M = (\\\\Omega_{X/k}^1)_P$
        is free of rank $d$. $\\\\blacksquare$\\n\\n---\\n\\n### Exercises for Chapter
        4\\n\\n**Exercise 4.1.** Let $f : X \\\\to Y$ be a morphism of schemes, where
        $X$ is Noetherian (or $f$ is quasi-compact and quasi-separated). Prove that
        for any quasi-coherent sheaf $\\\\mathcal{F}$ on $X$, the direct image $f_*\\\\mathcal{F}$
        is a quasi-coherent sheaf on $Y$. Also prove that for any morphism $f : X
        \\\\to Y$ and any quasi-coherent sheaf $\\\\mathcal{G}$ on $Y$, the module
        pullback $f^*\\\\mathcal{G} = f^{-1}\\\\mathcal{G} \\\\otimes_{f^{-1}\\\\mathcal{O}_Y}
        \\\\mathcal{O}_X$ is quasi-coherent on $X$.\\n\\n**Exercise 4.2 (Projection
        Formula).** Let $f : X \\\\to Y$ be a morphism of ringed spaces, $\\\\mathcal{F}$
        an $\\\\mathcal{O}_X$-module, and $\\\\mathcal{E}$ a locally free $\\\\mathcal{O}_Y$-module
        of finite rank. Prove that there is a natural isomorphism of $\\\\mathcal{O}_Y$-modules:\\n$$f_*\\\\left(\\\\mathcal{F}
        \\\\otimes_{\\\\mathcal{O}_X} f^*\\\\mathcal{E}\\\\right) \\\\cong f_*\\\\mathcal{F}
        \\\\otimes_{\\\\mathcal{O}_Y} \\\\mathcal{E}.$$\\n\\n**Exercise 4.3.** Let
        $X$ be a Noetherian, integral, separated scheme which is regular in codimension
        $1$ (meaning every local ring $\\\\mathcal{O}_{X,P}$ of dimension $1$ is a
        discrete valuation ring). A *prime Weil divisor* is a closed integral subscheme
        $Y \\\\subset X$ of codimension $1$ (meaning $\\\\dim \\\\mathcal{O}_{X, \\\\eta_Y}
        = 1$), and a *Weil divisor* is a formal finite $\\\\mathbb{Z}$-linear combination
        $\\\\sum n_Y Y$. Using the discrete valuations $v_Y : K(X)^\\\\times \\\\to
        \\\\mathbb{Z}$, define the principal Weil divisor $(f) = \\\\sum v_Y(f) Y$
        and the Weil divisor class group $\\\\operatorname{Cl}(X)$.\\n(a) Prove that
        $\\\\operatorname{Cl}(\\\\mathbb{A}^n_k) = 0$ and $\\\\operatorname{Cl}(\\\\mathbb{P}^n_k)
        \\\\cong \\\\mathbb{Z}$, generated by the class of a hyperplane $H = V_+(x_0)$.\\n(b)
        Prove that if $X$ is locally factorial (every local ring $\\\\mathcal{O}_{X,P}$
        is a unique factorization domain, which holds in particular if $X$ is regular),
        then there is a natural isomorphism $\\\\operatorname{Cl}(X) \\\\cong \\\\operatorname{CaCl}(X)
        \\\\cong \\\\operatorname{Pic}(X)$. Conclude that $\\\\operatorname{Pic}(\\\\mathbb{P}^n_k)
        \\\\cong \\\\mathbb{Z}$, generated by $\\\\mathcal{O}_{\\\\mathbb{P}^n}(1)$.\\n\\n**Exercise
        4.4.** Let $X$ be a scheme over $S$, and $S' \\\\to S$ any morphism of schemes.
        Let $X' = X \\\\times_S S'$, with projection $p : X' \\\\to X$. Prove that
        there is a canonical isomorphism of sheaves of differentials $\\\\Omega_{X'/S'}^1
        \\\\cong p^*\\\\Omega_{X/S}^1$.\\n\\n**Exercise 4.5.** Let $X$ be a nonsingular
        variety of dimension $n$ over an algebraically closed field $k$. The *canonical
        sheaf* of $X$ is defined as the $n$-th exterior power $\\\\omega_X = \\\\bigwedge^n
        \\\\Omega_{X/k}^1$, which is an invertible sheaf on $X$.\\n(a) Prove that
        for any short exact sequence of locally free sheaves $0 \\\\to \\\\mathcal{E}'
        \\\\to \\\\mathcal{E} \\\\to \\\\mathcal{E}'' \\\\to 0$ of ranks $r', r, r''$,
        there is a canonical isomorphism of invertible sheaves $\\\\bigwedge^r \\\\mathcal{E}
        \\\\cong \\\\left(\\\\bigwedge^{r'} \\\\mathcal{E}'\\\\right) \\\\otimes \\\\left(\\\\bigwedge^{r''}
        \\\\mathcal{E}''\\\\right)$.\\n(b) Apply (a) to the Euler exact sequence (Theorem
        4.3.5) to prove that the canonical sheaf of projective $n$-space is $\\\\omega_{\\\\mathbb{P}^n_k}
        \\\\cong \\\\mathcal{O}_{\\\\mathbb{P}^n_k}(-n-1)$.\\n(c) Let $Y \\\\subset
        X$ be a nonsingular closed subvariety of codimension $1$, defined by an invertible
        ideal sheaf $\\\\mathcal{I} = \\\\mathcal{O}_X(-Y)$. Use the Second Exact
        Sequence of differentials (Proposition 4.3.3(2)) to establish the *Adjunction
        Formula*:\\n$$\\\\omega_Y \\\\cong \\\\left.\\\\left(\\\\omega_X \\\\otimes_{\\\\mathcal{O}_X}
        \\\\mathcal{O}_X(Y)\\\\right)\\\\right|_Y.$$\\nDeduce that if $Y \\\\subset
        \\\\mathbb{P}^n_k$ is a nonsingular hypersurface of degree $d$, then $\\\\omega_Y
        \\\\cong \\\\mathcal{O}_Y(d - n - 1)$.\\n\\n---\\n\\n## Chapter 5: Cohomology
        of Schemes and Curves\\n\\n### 5.1 Derived Functors and Sheaf Cohomology\\n\\n**Definition
        5.1.1.** Let $\\\\mathcal{A}$ be an abelian category. An object $I \\\\in
        \\\\mathcal{A}$ is *injective* if the functor $\\\\operatorname{Hom}_{\\\\mathcal{A}}(-,
        I)$ is exact; that is, for every monomorphism $A \\\\hookrightarrow B$ in
        $\\\\mathcal{A}$ and every morphism $A \\\\to I$, there exists an extension
        $B \\\\to I$. We say $\\\\mathcal{A}$ *has enough injectives* if for every
        object $A \\\\in \\\\mathcal{A}$, there exists a monomorphism $A \\\\hookrightarrow
        I$ into an injective object $I$.\\n\\n**Proposition 5.1.2.** *For any ringed
        space $(X, \\\\mathcal{O}_X)$, the category $\\\\mathbf{Mod}(\\\\mathcal{O}_X)$
        (and in particular $\\\\mathbf{Ab}(X)$ when $\\\\mathcal{O}_X = \\\\underline{\\\\mathbb{Z}}$)
        has enough injectives.*\\n\\n*Proof.* First, recall from commutative algebra
        that for any ring $R$, the category $\\\\mathbf{Mod}_R$ has enough injectives.
        Indeed, for $R = \\\\mathbb{Z}$, an abelian group is injective if and only
        if it is divisible, and any abelian group $M$ embeds into the divisible group
        $\\\\mathbb{Q}^{\\\\oplus I} / K$ or into $\\\\operatorname{Hom}_{\\\\mathbb{Z}}(\\\\mathbb{Z}[\\\\operatorname{Hom}(M,
        \\\\mathbb{Q}/\\\\mathbb{Z})], \\\\mathbb{Q}/\\\\mathbb{Z})$. For a general
        ring $R$, the functor $J \\\\mapsto \\\\operatorname{Hom}_{\\\\mathbb{Z}}(R,
        J)$ is right adjoint to the exact forgetful functor $\\\\mathbf{Mod}_R \\\\to
        \\\\mathbf{Ab}$, hence sends injective abelian groups to injective $R$-modules;
        for any $R$-module $M$, choosing an embedding of $M$ into an injective abelian
        group $J$ yields an $R$-module monomorphism $M \\\\cong \\\\operatorname{Hom}_R(R,
        M) \\\\hookrightarrow \\\\operatorname{Hom}_{\\\\mathbb{Z}}(R, M) \\\\hookrightarrow
        \\\\operatorname{Hom}_{\\\\mathbb{Z}}(R, J)$.\\n\\nNow let $\\\\mathcal{F}
        \\\\in \\\\mathbf{Mod}(\\\\mathcal{O}_X)$. For each point $P \\\\in X$, the
        stalk $\\\\mathcal{F}_P$ is an $\\\\mathcal{O}_{X,P}$-module. By the paragraph
        above, there exists an injective $\\\\mathcal{O}_{X,P}$-module $I_P$ and an
        injective $\\\\mathcal{O}_{X,P}$-module homomorphism $\\\\alpha_P : \\\\mathcal{F}_P
        \\\\hookrightarrow I_P$. Let $j_P : \\\\{P\\\\} \\\\hookrightarrow X$ be the
        inclusion of the one-point space. Then the skyscraper sheaf $(j_P)_*(I_P)$
        is an $\\\\mathcal{O}_X$-module, and for any $\\\\mathcal{O}_X$-module $\\\\mathcal{G}$,
        the adjunction of Proposition 2.3.2 immediately gives\\n$$\\\\operatorname{Hom}_{\\\\mathcal{O}_X}(\\\\mathcal{G},
        (j_P)_*(I_P)) \\\\cong \\\\operatorname{Hom}_{\\\\mathcal{O}_{X,P}}(\\\\mathcal{G}_P,
        I_P).$$\\nDefine the product sheaf $\\\\mathcal{I} = \\\\prod_{P \\\\in X}
        (j_P)_*(I_P)$, which on any open set $U \\\\subseteq X$ is given by $\\\\mathcal{I}(U)
        = \\\\prod_{P \\\\in U} I_P$. Then for any $\\\\mathcal{O}_X$-module $\\\\mathcal{G}$,
        we have\\n$$\\\\operatorname{Hom}_{\\\\mathcal{O}_X}(\\\\mathcal{G}, \\\\mathcal{I})
        \\\\cong \\\\prod_{P \\\\in X} \\\\operatorname{Hom}_{\\\\mathcal{O}_X}(\\\\mathcal{G},
        (j_P)_*(I_P)) \\\\cong \\\\prod_{P \\\\in X} \\\\operatorname{Hom}_{\\\\mathcal{O}_{X,P}}(\\\\mathcal{G}_P,
        I_P).$$\\nSince taking the stalk $\\\\mathcal{G} \\\\mapsto \\\\mathcal{G}_P$
        is an exact functor, and $\\\\operatorname{Hom}_{\\\\mathcal{O}_{X,P}}(-,
        I_P)$ is exact because $I_P$ is injective, and arbitrary direct products of
        exact sequences of abelian groups are exact, it follows that the functor $\\\\operatorname{Hom}_{\\\\mathcal{O}_X}(-,
        \\\\mathcal{I})$ is exact! Thus $\\\\mathcal{I}$ is an injective object of
        $\\\\mathbf{Mod}(\\\\mathcal{O}_X)$.\\n\\nFinally, there is a natural morphism
        $\\\\alpha : \\\\mathcal{F} \\\\to \\\\mathcal{I}$ defined on open sets $U
        \\\\subseteq X$ by sending $s \\\\in \\\\mathcal{F}(U)$ to $(\\\\alpha_P(s_P))_{P
        \\\\in U} \\\\in \\\\prod_{P \\\\in U} I_P$. At each stalk $Q \\\\in X$, the
        composition $\\\\mathcal{F}_Q \\\\xrightarrow{\\\\alpha_Q} \\\\mathcal{I}_Q
        \\\\to I_Q$ is the injective map $\\\\alpha_Q$, so $\\\\alpha_Q$ is injective
        for all $Q \\\\in X$. By Proposition 2.2.3, $\\\\alpha : \\\\mathcal{F} \\\\hookrightarrow
        \\\\mathcal{I}$ is a monomorphism in $\\\\mathbf{Mod}(\\\\mathcal{O}_X)$.
        $\\\\blacksquare$\\n\\n**Definition 5.1.3.** Let $X$ be a topological space.
        The global sections functor $\\\\Gamma(X, -) : \\\\mathbf{Ab}(X) \\\\to \\\\mathbf{Ab}$
        is left exact. Its *right derived functors* $R^i\\\\Gamma(X, -)$ are called
        the *sheaf cohomology functors*, and for any sheaf of abelian groups $\\\\mathcal{F}$
        on $X$, we write\\n$$H^i(X, \\\\mathcal{F}) = R^i\\\\Gamma(X, \\\\mathcal{F}).$$\\nExplicitly,
        to compute $H^i(X, \\\\mathcal{F})$, one chooses an *injective resolution*
        of $\\\\mathcal{F}$, which is an exact sequence in $\\\\mathbf{Ab}(X)$:\\n$$0
        \\\\longrightarrow \\\\mathcal{F} \\\\longrightarrow \\\\mathcal{I}^0 \\\\xrightarrow{d^0}
        \\\\mathcal{I}^1 \\\\xrightarrow{d^1} \\\\mathcal{I}^2 \\\\longrightarrow
        \\\\cdots$$\\nwhere each $\\\\mathcal{I}^n$ is an injective sheaf (such a
        resolution always exists by repeatedly applying Proposition 5.1.2 to cokernels),
        and sets $H^i(X, \\\\mathcal{F}) = \\\\ker \\\\Gamma(X, d^i) / \\\\operatorname{im}
        \\\\Gamma(X, d^{i-1})$. By standard homological algebra, $H^i(X, \\\\mathcal{F})$
        is independent of the choice of injective resolution up to canonical isomorphism,
        $H^0(X, \\\\mathcal{F}) \\\\cong \\\\Gamma(X, \\\\mathcal{F})$, and every
        short exact sequence of sheaves $0 \\\\to \\\\mathcal{F}' \\\\to \\\\mathcal{F}
        \\\\to \\\\mathcal{F}'' \\\\to 0$ induces a natural *long exact sequence of
        cohomology*:\\n$$0 \\\\to H^0(X, \\\\mathcal{F}') \\\\to H^0(X, \\\\mathcal{F})
        \\\\to H^0(X, \\\\mathcal{F}'') \\\\xrightarrow{\\\\delta} H^1(X, \\\\mathcal{F}')
        \\\\to H^1(X, \\\\mathcal{F}) \\\\to \\\\cdots.$$\\n\\nTo compute sheaf cohomology
        without using huge injective sheaves, we use *flasque* (or *flabby*) sheaves.\\n\\n**Definition
        5.1.4.** A sheaf $\\\\mathcal{F}$ on $X$ is *flasque* if for every inclusion
        of open subsets $V \\\\subseteq U$, the restriction map $\\\\mathcal{F}(U)
        \\\\to \\\\mathcal{F}(V)$ is surjective.\\n\\n**Proposition 5.1.5.** *Let
        $X$ be a topological space.*\\n1. *Every injective sheaf $\\\\mathcal{I} \\\\in
        \\\\mathbf{Ab}(X)$ is flasque.*\\n2. *If $0 \\\\to \\\\mathcal{F}' \\\\to
        \\\\mathcal{F} \\\\to \\\\mathcal{F}'' \\\\to 0$ is a short exact sequence
        of sheaves of abelian groups and $\\\\mathcal{F}'$ is flasque, then for every
        open set $U \\\\subseteq X$, the sequence of sections $0 \\\\to \\\\mathcal{F}'(U)
        \\\\to \\\\mathcal{F}(U) \\\\to \\\\mathcal{F}''(U) \\\\to 0$ is exact.*\\n3.
        *If $0 \\\\to \\\\mathcal{F}' \\\\to \\\\mathcal{F} \\\\to \\\\mathcal{F}''
        \\\\to 0$ is a short exact sequence of sheaves and both $\\\\mathcal{F}'$
        and $\\\\mathcal{F}$ are flasque, then $\\\\mathcal{F}''$ is also flasque.*\\n4.
        *Every flasque sheaf $\\\\mathcal{F}$ is $\\\\Gamma(X, -)$-acyclic: $H^i(X,
        \\\\mathcal{F}) = 0$ for all $i \\u003e 0$. Consequently, cohomology can be
        computed using any resolution by flasque sheaves.*\\n\\n*Proof.* (1) For any
        open subset $U \\\\subseteq X$, let $\\\\mathbb{Z}_U$ be the sheaf obtained
        by extending the constant sheaf $\\\\underline{\\\\mathbb{Z}}$ on $U$ by zero
        outside $U$ (its stalks are $\\\\mathbb{Z}$ on $U$ and $0$ on $X \\\\setminus
        U$). Clearly $\\\\operatorname{Hom}_{\\\\mathbf{Ab}(X)}(\\\\mathbb{Z}_U, \\\\mathcal{F})
        \\\\cong \\\\mathcal{F}(U)$. For $V \\\\subseteq U$, there is a natural monomorphism
        of sheaves $\\\\mathbb{Z}_V \\\\hookrightarrow \\\\mathbb{Z}_U$. Since $\\\\mathcal{I}$
        is injective, applying $\\\\operatorname{Hom}(-, \\\\mathcal{I})$ gives a
        surjection $\\\\mathcal{I}(U) \\\\to \\\\mathcal{I}(V)$.\\n\\n(2) Let $s''
        \\\\in \\\\mathcal{F}''(U)$. By Zorn's Lemma, consider the set of pairs $(V,
        s)$ where $V \\\\subseteq U$ is open, $s \\\\in \\\\mathcal{F}(V)$, and $s$
        maps to $\\\\left.s''\\\\right|_V \\\\in \\\\mathcal{F}''(V)$, ordered by
        extension of sections. This poset is non-empty (since $\\\\mathcal{F} \\\\to
        \\\\mathcal{F}''$ is locally surjective on stalks) and chains have upper bounds
        by the Gluing axiom, so there is a maximal element $(V, s)$. Suppose $V \\\\neq
        U$, and pick $P \\\\in U \\\\setminus V$. There exists an open neighborhood
        $W \\\\subseteq U$ of $P$ and a section $t \\\\in \\\\mathcal{F}(W)$ lifting
        $\\\\left.s''\\\\right|_W$. On the overlap $V \\\\cap W$, the difference $\\\\left.s\\\\right|_{V
        \\\\cap W} - \\\\left.t\\\\right|_{V \\\\cap W}$ maps to $0$ in $\\\\mathcal{F}''(V
        \\\\cap W)$, so it comes from a section $r' \\\\in \\\\mathcal{F}'(V \\\\cap
        W)$. Since $\\\\mathcal{F}'$ is flasque, $r'$ extends to a section $\\\\tilde{r}'
        \\\\in \\\\mathcal{F}'(W)$. Replacing $t$ by $t + \\\\tilde{r}'$ on $W$, the
        sections $s$ and $t + \\\\tilde{r}'$ now agree on $V \\\\cap W$ and glue to
        a section on $V \\\\cup W \\\\supsetneq V$ lifting $\\\\left.s''\\\\right|_{V
        \\\\cup W}$, contradicting maximality of $V$. Thus $V = U$.\\n\\n(3) For $V
        \\\\subseteq U$, in the commutative diagram with exact rows given by (2),
        the maps $\\\\mathcal{F}(U) \\\\to \\\\mathcal{F}(V)$ and $\\\\mathcal{F}(V)
        \\\\to \\\\mathcal{F}''(V)$ are surjective, so the composite $\\\\mathcal{F}(U)
        \\\\to \\\\mathcal{F}''(U) \\\\to \\\\mathcal{F}''(V)$ is surjective, forcing
        $\\\\mathcal{F}''(U) \\\\to \\\\mathcal{F}''(V)$ to be surjective.\\n\\n(4)
        Embed the flasque sheaf $\\\\mathcal{F}$ into an injective sheaf $\\\\mathcal{I}$
        (which is flasque by (1)), and let $\\\\mathcal{Q} = \\\\mathcal{I}/\\\\mathcal{F}$.
        By (3), $\\\\mathcal{Q}$ is also flasque. By (2), the global sections sequence
        $0 \\\\to \\\\Gamma(X, \\\\mathcal{F}) \\\\to \\\\Gamma(X, \\\\mathcal{I})
        \\\\to \\\\Gamma(X, \\\\mathcal{Q}) \\\\to 0$ is exact. Taking the long exact
        sequence in cohomology (and noting $H^i(X, \\\\mathcal{I}) = 0$ for $i \\u003e
        0$ since $\\\\mathcal{I}$ is injective) gives $H^1(X, \\\\mathcal{F}) = 0$
        and $H^i(X, \\\\mathcal{F}) \\\\cong H^{i-1}(X, \\\\mathcal{Q})$ for all $i
        \\\\ge 2$. By induction on $i$ applied to the flasque sheaf $\\\\mathcal{Q}$,
        $H^i(X, \\\\mathcal{F}) = 0$ for all $i \\\\ge 1$. $\\\\blacksquare$\\n\\n---\\n\\n###
        5.2 \u010Cech Cohomology and Affine Vanishing\\n\\n**Definition 5.2.1.** Let
        $X$ be a topological space, $\\\\mathcal{F}$ a sheaf of abelian groups on
        $X$, and $\\\\mathcal{U} = \\\\{U_i\\\\}_{i \\\\in I}$ an open covering of
        $X$, where $I$ is equipped with a strict total ordering. For any $p \\\\ge
        0$ and any $(p+1)$-tuple of indices $i_0, \\\\dots, i_p \\\\in I$, let $U_{i_0
        \\\\dots i_p} = U_{i_0} \\\\cap \\\\dots \\\\cap U_{i_p}$. We define the *\u010Cech
        complex* $\\\\check{C}^\\\\bullet(\\\\mathcal{U}, \\\\mathcal{F})$ by\\n$$\\\\check{C}^p(\\\\mathcal{U},
        \\\\mathcal{F}) = \\\\prod_{i_0 \\u003c i_1 \\u003c \\\\dots \\u003c i_p}
        \\\\mathcal{F}(U_{i_0 \\\\dots i_p})$$\\nwith differential $d^p : \\\\check{C}^p(\\\\mathcal{U},
        \\\\mathcal{F}) \\\\to \\\\check{C}^{p+1}(\\\\mathcal{U}, \\\\mathcal{F})$
        given for $\\\\alpha \\\\in \\\\check{C}^p(\\\\mathcal{U}, \\\\mathcal{F})$
        by\\n$$(d^p \\\\alpha)_{i_0, \\\\dots, i_{p+1}} = \\\\sum_{k=0}^{p+1} (-1)^k
        \\\\left.\\\\alpha_{i_0, \\\\dots, \\\\widehat{i_k}, \\\\dots, i_{p+1}}\\\\right|_{U_{i_0
        \\\\dots i_{p+1}}}.$$\\nA standard calculation shows $d^{p+1} \\\\circ d^p
        = 0$. The $p$-th *\u010Cech cohomology group* of $\\\\mathcal{F}$ with respect
        to the covering $\\\\mathcal{U}$ is defined as $\\\\check{H}^p(\\\\mathcal{U},
        \\\\mathcal{F}) = H^p(\\\\check{C}^\\\\bullet(\\\\mathcal{U}, \\\\mathcal{F}))$.
        Note that by the sheaf axioms, $\\\\check{H}^0(\\\\mathcal{U}, \\\\mathcal{F})
        = \\\\Gamma(X, \\\\mathcal{F})$.\\n\\n**Theorem 5.2.2 (Serre's Affine Vanishing
        Theorem).** *Let $X = \\\\operatorname{Spec} A$ be an affine scheme. For every
        quasi-coherent sheaf $\\\\mathcal{F} = \\\\widetilde{M}$ on $X$ and every
        $i \\u003e 0$, we have $H^i(X, \\\\mathcal{F}) = 0$.*\\n\\n*Proof.* First,
        we prove that if $I$ is an injective $A$-module, then the quasi-coherent sheaf
        $\\\\widetilde{I}$ on $X = \\\\operatorname{Spec} A$ is flasque! To prove
        $\\\\widetilde{I}$ is flasque, it suffices to show that for every open subset
        $U \\\\subseteq X$ and section $s \\\\in \\\\Gamma(U, \\\\widetilde{I})$,
        we can extend $s$ to a larger open set $U \\\\cup D(f)$ whenever $D(f)$ is
        a basic open set not contained in $U$ (by Zorn's Lemma, this implies extension
        to all of $X$). \\n\\nBy the equivalence of categories on basic opens, restricting
        $s$ to $U \\\\cap D(f)$ corresponds to a morphism of sheaves $\\\\left.\\\\mathcal{O}_{D(f)}\\\\right|_{U
        \\\\cap D(f)} \\\\to \\\\left.\\\\widetilde{I}\\\\right|_{U \\\\cap D(f)}$.
        Let $\\\\mathfrak{a} \\\\subseteq A_f$ be the ideal defining the closed complement
        $D(f) \\\\setminus (U \\\\cap D(f))$ inside $D(f) = \\\\operatorname{Spec}
        A_f$. Cover $U \\\\cap D(f)$ by basic open sets $D(g_j)$ with $g_j \\\\in
        \\\\mathfrak{a}$. On each $D(g_j)$, the section $s$ is represented by an element
        $m_j / g_j^n \\\\in I_{g_j}$. Since $I$ is an injective $A$-module, it is
        easy to see that $I_f$ is an injective $A_f$-module (or we can work directly
        over $A$ by clearing powers of $f$): the compatible elements $m_j / g_j^n$
        define an $A$-module homomorphism from the ideal $\\\\mathfrak{b} = (g_1^N,
        g_2^N, \\\\dots) \\\\subseteq A$ into $I$. Since $I$ is an injective $A$-module,
        this homomorphism $\\\\mathfrak{b} \\\\to I$ extends to an $A$-module homomorphism
        $A \\\\to I$, which is given by $1 \\\\mapsto m \\\\in I$. Then the global
        section $m \\\\in \\\\Gamma(X, \\\\widetilde{I})$ agrees with $s$ on a power
        of each $g_j$, hence on $U \\\\cap D(f)$! Glueing $\\\\left.m\\\\right|_{D(f)}$
        with $s$ on $U$ extends $s$ to $U \\\\cup D(f)$. Thus $\\\\widetilde{I}$ is
        flasque.\\n\\nNow let $\\\\mathcal{F} = \\\\widetilde{M}$ be any quasi-coherent
        sheaf on $X = \\\\operatorname{Spec} A$. Choose an injective resolution of
        the $A$-module $M$ in the category $\\\\mathbf{Mod}_A$:\\n$$0 \\\\longrightarrow
        M \\\\longrightarrow I^0 \\\\longrightarrow I^1 \\\\longrightarrow I^2 \\\\longrightarrow
        \\\\cdots.$$\\nBy Theorem 4.1.3(3), the functor $N \\\\mapsto \\\\widetilde{N}$
        is exact, so applying $\\\\widetilde{(-)}$ yields an exact sequence of sheaves
        on $X$:\\n$$0 \\\\longrightarrow \\\\widetilde{M} \\\\longrightarrow \\\\widetilde{I^0}
        \\\\longrightarrow \\\\widetilde{I^1} \\\\longrightarrow \\\\widetilde{I^2}
        \\\\longrightarrow \\\\cdots.$$\\nBy the first paragraph of the proof, each
        $\\\\widetilde{I^k}$ is a flasque sheaf! Therefore, by Proposition 5.1.5(4),
        we can compute the sheaf cohomology $H^i(X, \\\\widetilde{M})$ by taking global
        sections of the resolution $\\\\widetilde{I^\\\\bullet}$. However, by Theorem
        4.1.3(2), $\\\\Gamma(X, \\\\widetilde{I^k}) = I^k$, so the complex of global
        sections is simply the exact sequence $0 \\\\to I^0 \\\\to I^1 \\\\to I^2
        \\\\to \\\\cdots$. Since this sequence is exact at $I^k$ for all $k \\\\ge
        1$, we conclude that $H^i(X, \\\\widetilde{M}) = 0$ for all $i \\\\ge 1$.
        $\\\\blacksquare$\\n\\n**Theorem 5.2.3 (Leray's Theorem and \u010Cech-to-Derived
        Comparison).** *Let $X$ be a separated scheme, $\\\\mathcal{F}$ a quasi-coherent
        sheaf on $X$, and $\\\\mathcal{U} = \\\\{U_i\\\\}_{i \\\\in I}$ an open affine
        covering of $X$. Then for every $p \\\\ge 0$, there is a natural isomorphism*\\n$$\\\\check{H}^p(\\\\mathcal{U},
        \\\\mathcal{F}) \\\\xrightarrow{\\\\sim} H^p(X, \\\\mathcal{F}).$$\\n\\n*Proof.*
        For any open set $V \\\\subseteq X$, let $j_V : V \\\\hookrightarrow X$ be
        the inclusion, and define a sheaf version of the \u010Cech complex $\\\\mathcal{C}^\\\\bullet(\\\\mathcal{U},
        \\\\mathcal{F})$ on $X$ by setting\\n$$\\\\mathcal{C}^p(\\\\mathcal{U}, \\\\mathcal{F})
        = \\\\prod_{i_0 \\u003c \\\\dots \\u003c i_p} (j_{U_{i_0 \\\\dots i_p}})_*\\\\left(\\\\left.\\\\mathcal{F}\\\\right|_{U_{i_0
        \\\\dots i_p}}\\\\right).$$\\nNotice that $\\\\Gamma(X, \\\\mathcal{C}^\\\\bullet(\\\\mathcal{U},
        \\\\mathcal{F})) = \\\\check{C}^\\\\bullet(\\\\mathcal{U}, \\\\mathcal{F})$.
        We claim that the natural sequence of sheaves\\n$$0 \\\\longrightarrow \\\\mathcal{F}
        \\\\xrightarrow{\\\\epsilon} \\\\mathcal{C}^0(\\\\mathcal{U}, \\\\mathcal{F})
        \\\\xrightarrow{d^0} \\\\mathcal{C}^1(\\\\mathcal{U}, \\\\mathcal{F}) \\\\xrightarrow{d^1}
        \\\\cdots$$\\nis an exact resolution of $\\\\mathcal{F}$! To check exactness
        at a stalk $P \\\\in X$, choose an index $k \\\\in I$ such that $P \\\\in
        U_k$. For any open neighborhood $W \\\\subseteq U_k$ of $P$, we can define
        a contracting homotopy $h^p : \\\\mathcal{C}^p(\\\\mathcal{U}, \\\\mathcal{F})(W)
        \\\\to \\\\mathcal{C}^{p-1}(\\\\mathcal{U}, \\\\mathcal{F})(W)$ by setting
        $(h^p \\\\alpha)_{i_0 \\\\dots i_{p-1}} = \\\\alpha_{k i_0 \\\\dots i_{p-1}}$
        (using alternating signs if $k$ is not the smallest index; since $W \\\\subseteq
        U_k$, we have $W \\\\cap U_{i_0 \\\\dots i_{p-1}} = W \\\\cap U_{k i_0 \\\\dots
        i_{p-1}}$, so no restriction is needed!). A direct calculation gives $(d^{p-1}
        h^p + h^{p+1} d^p)(\\\\alpha) = \\\\alpha$, proving exactness on stalks at
        $P$.\\n\\nFinally, since $X$ is separated and each $U_i$ is affine, every
        finite intersection $V = U_{i_0 \\\\dots i_p}$ is an affine scheme (by Exercise
        3.3). For any affine open $V \\\\subseteq X$ and quasi-coherent sheaf $\\\\mathcal{G}$
        on $V$, taking an injective resolution $\\\\mathcal{G} \\\\to \\\\mathcal{I}^\\\\bullet$
        on $V$ (note that $(j_V)_*\\\\mathcal{I}^q$ is flasque on $X$) shows that
        $H^q(X, (j_V)_*\\\\mathcal{G}) = H^q(V, \\\\mathcal{G}) = 0$ for all $q \\u003e
        0$ by Theorem 5.2.2. Thus each term $\\\\mathcal{C}^p(\\\\mathcal{U}, \\\\mathcal{F})$
        is $\\\\Gamma(X, -)$-acyclic. By the standard dimension-shifting argument
        (identical to the proof of Proposition 5.1.5(4)), the cohomology of a sheaf
        can be computed from any resolution by $\\\\Gamma(X, -)$-acyclic sheaves.
        Thus $H^p(X, \\\\mathcal{F}) \\\\cong H^p(\\\\Gamma(X, \\\\mathcal{C}^\\\\bullet(\\\\mathcal{U},
        \\\\mathcal{F}))) = \\\\check{H}^p(\\\\mathcal{U}, \\\\mathcal{F})$. $\\\\blacksquare$\\n\\n---\\n\\n###
        5.3 Cohomology of Projective Space\\n\\n**Theorem 5.3.1 (Cohomology of Projective
        Space).** *Let $A$ be a ring, $S = A[x_0, \\\\dots, x_n]$ the polynomial ring
        graded by degree, and $X = \\\\mathbb{P}^n_A = \\\\operatorname{Proj} S$ with
        $n \\\\ge 1$. Then:*\\n1. *The natural map $S_m \\\\to H^0(X, \\\\mathcal{O}_X(m))$
        is an isomorphism for all $m \\\\in \\\\mathbb{Z}$. In particular, $H^0(X,
        \\\\mathcal{O}_X(m)) = 0$ for $m \\u003c 0$, and is a free $A$-module of rank
        $\\\\binom{n+m}{n}$ for $m \\\\ge 0$.*\\n2. *$H^i(X, \\\\mathcal{O}_X(m))
        = 0$ for all $0 \\u003c i \\u003c n$ and all $m \\\\in \\\\mathbb{Z}$.*\\n3.
        *$H^n(X, \\\\mathcal{O}_X(-n-1))$ is a free $A$-module of rank $1$, generated
        by the \u010Cech cocycle $\\\\frac{1}{x_0 x_1 \\\\cdots x_n}$.*\\n4. *For
        every $m \\\\in \\\\mathbb{Z}$, the natural cup-product pairing*\\n$$H^0(X,
        \\\\mathcal{O}_X(m)) \\\\times H^n(X, \\\\mathcal{O}_X(-m-n-1)) \\\\longrightarrow
        H^n(X, \\\\mathcal{O}_X(-n-1)) \\\\cong A$$\\n*is a perfect pairing of finitely
        generated free $A$-modules. In particular, $H^n(X, \\\\mathcal{O}_X(m)) =
        0$ for $m \\u003e -n-1$, and for $m \\\\le -n-1$ it is a free $A$-module of
        rank $\\\\binom{-m-1}{n}$ with basis $\\\\left\\\\{ x_0^{k_0} \\\\cdots x_n^{k_n}
        \\\\;\\\\middle|\\\\; k_i \\u003c 0 \\\\text{ for all } i, \\\\sum k_i = m
        \\\\right\\\\}$.*\\n\\n*Proof.* It is convenient to compute for all $m \\\\in
        \\\\mathbb{Z}$ simultaneously by setting $\\\\mathcal{F} = \\\\bigoplus_{m
        \\\\in \\\\mathbb{Z}} \\\\mathcal{O}_X(m)$. Since $X$ is quasi-compact and
        separated, cohomology commutes with direct sums, so $H^i(X, \\\\mathcal{F})
        = \\\\bigoplus_{m \\\\in \\\\mathbb{Z}} H^i(X, \\\\mathcal{O}_X(m))$. Let
        $\\\\mathcal{U} = \\\\{U_i\\\\}_{i=0}^n$ be the standard affine open cover
        $U_i = D_+(x_i)$. By Theorem 5.2.3, we can compute $H^i(X, \\\\mathcal{F})$
        using the \u010Cech complex $\\\\check{C}^\\\\bullet(\\\\mathcal{U}, \\\\mathcal{F})$.\\n\\nNotice
        that on any intersection $U_{i_0 \\\\dots i_p} = D_+(x_{i_0} \\\\cdots x_{i_p})$,
        we have $\\\\Gamma(U_{i_0 \\\\dots i_p}, \\\\mathcal{O}_X(m)) = (S_{x_{i_0}
        \\\\cdots x_{i_p}})_m$. Summing over all $m \\\\in \\\\mathbb{Z}$ simply recovers
        the full localized ring! That is, the \u010Cech complex $\\\\check{C}^\\\\bullet(\\\\mathcal{U},
        \\\\mathcal{F})$ is given by\\n$$0 \\\\longrightarrow \\\\prod_{i_0} S_{x_{i_0}}
        \\\\xrightarrow{d^0} \\\\prod_{i_0 \\u003c i_1} S_{x_{i_0} x_{i_1}} \\\\longrightarrow
        \\\\cdots \\\\longrightarrow S_{x_0 x_1 \\\\cdots x_n} \\\\longrightarrow
        0.$$\\n\\n(1) An element of $\\\\ker d^0$ consists of fractions $f_i / x_i^{r_i}
        \\\\in S_{x_i}$ such that $f_i / x_i^{r_i} = f_j / x_j^{r_j}$ in $S_{x_i x_j}$.
        Since $S = A[x_0, \\\\dots, x_n]$ is a polynomial ring, $x_0, \\\\dots, x_n$
        is a regular sequence and $S$ is a subring of $S_{x_0 \\\\cdots x_n}$ in which
        $S_{x_i} \\\\cap S_{x_j} = S$ (since no monomial in $S_{x_i} \\\\cap S_{x_j}$
        can have both negative powers of $x_i$ and no negative powers of $x_i$). Thus
        $\\\\ker d^0 = S = \\\\bigoplus_{m \\\\ge 0} S_m$, proving (1).\\n\\n(3) &
        (4) Look at the top degree $p = n$: $\\\\check{C}^n(\\\\mathcal{U}, \\\\mathcal{F})
        = S_{x_0 \\\\cdots x_n}$ is a free $A$-module with basis consisting of all
        Laurent monomials $x_0^{k_0} \\\\cdots x_n^{k_n}$ for $(k_0, \\\\dots, k_n)
        \\\\in \\\\mathbb{Z}^{n+1}$. The image of $d^{n-1} : \\\\prod_{j=0}^n S_{x_0
        \\\\cdots \\\\widehat{x_j} \\\\cdots x_n} \\\\to S_{x_0 \\\\cdots x_n}$ is
        spanned over $A$ by all Laurent monomials in which *at least one* exponent
        $k_j$ is $\\\\ge 0$. Therefore, the quotient $H^n(X, \\\\mathcal{F}) = \\\\operatorname{coker}
        d^{n-1}$ is a free $A$-module with basis consisting of all Laurent monomials
        $x_0^{k_0} \\\\cdots x_n^{k_n}$ with $k_i \\\\le -1$ for *all* $0 \\\\le i
        \\\\le n$! \\n\\nLooking at the total degree $m = k_0 + \\\\dots + k_n$ of
        such a monomial, since each $k_i \\\\le -1$, we must have $m \\\\le -n-1$.
        For $m = -n-1$, the only such monomial is $x_0^{-1} x_1^{-1} \\\\cdots x_n^{-1}$,
        proving (3). For general $m \\\\le -n-1$, the basis of $H^n(X, \\\\mathcal{O}_X(m))$
        is in bijection with the basis of $H^0(X, \\\\mathcal{O}_X(-m-n-1))$ via sending
        $x_0^{k_0} \\\\cdots x_n^{k_n}$ (with $k_i \\\\le -1$) to the dual polynomial
        monomial $x_0^{-k_0-1} \\\\cdots x_n^{-k_n-1}$ (with exponents $\\\\ge 0$),
        and their product in $H^n(X, \\\\mathcal{O}_X(-n-1))$ is the generator $x_0^{-1}
        \\\\cdots x_n^{-1}$ (while the product of any two non-dual monomials has at
        least one exponent $\\\\ge 0$, hence vanishes in $H^n(X, \\\\mathcal{O}_X(-n-1))$).
        This proves (4).\\n\\n(2) We proceed by induction on $n$. For $n = 1$, there
        are no integers $i$ with $0 \\u003c i \\u003c 1$, so the statement is vacuous.
        Suppose $n \\\\ge 2$ and the result holds for $\\\\mathbb{P}^{n-1}_A$. Notice
        that setting $x_n = 0$ defines a closed hyperplane $H = V_+(x_n) \\\\cong
        \\\\mathbb{P}^{n-1}_A \\\\subset X$, and multiplication by $x_n$ gives a short
        exact sequence of graded $S$-modules $0 \\\\to S(-1) \\\\xrightarrow{\\\\cdot
        x_n} S \\\\to S/(x_n) \\\\to 0$. Twisting by $m$ and sheafifying gives a short
        exact sequence of sheaves on $X$:\\n$$0 \\\\longrightarrow \\\\mathcal{O}_X(m-1)
        \\\\xrightarrow{\\\\cdot x_n} \\\\mathcal{O}_X(m) \\\\longrightarrow \\\\mathcal{O}_H(m)
        \\\\longrightarrow 0.$$\\nSumming over all $m \\\\in \\\\mathbb{Z}$ gives
        $0 \\\\to \\\\mathcal{F}(-1) \\\\xrightarrow{\\\\cdot x_n} \\\\mathcal{F}
        \\\\to \\\\mathcal{F}_H \\\\to 0$, where $\\\\mathcal{F}_H = \\\\bigoplus_{m
        \\\\in \\\\mathbb{Z}} \\\\mathcal{O}_H(m)$. By the induction hypothesis applied
        to $H \\\\cong \\\\mathbb{P}^{n-1}_A$, we have $H^i(H, \\\\mathcal{F}_H) =
        0$ for $0 \\u003c i \\u003c n-1$. Looking at the long exact cohomology sequence,
        for $1 \\u003c i \\u003c n-1$ this immediately gives that multiplication by
        $x_n$,\\n$$\\\\cdot x_n : H^i(X, \\\\mathcal{F}(-1)) \\\\xrightarrow{\\\\sim}
        H^i(X, \\\\mathcal{F}),$$\\nis an isomorphism for $1 \\u003c i \\u003c n-1$.
        What about $i = 1$ and $i = n-1$? For $i = 1$, the map $H^0(X, \\\\mathcal{F})
        = S \\\\to H^0(H, \\\\mathcal{F}_H) = S/(x_n)$ is surjective, so $\\\\cdot
        x_n : H^1(X, \\\\mathcal{F}(-1)) \\\\to H^1(X, \\\\mathcal{F})$ is injective.
        For $i = n-1$, look at the map $H^{n-1}(H, \\\\mathcal{F}_H) \\\\to H^n(X,
        \\\\mathcal{F}(-1)) \\\\xrightarrow{\\\\cdot x_n} H^n(X, \\\\mathcal{F})$:
        using our explicit Laurent monomial basis from (4), the kernel of multiplication
        by $x_n$ on $H^n(X, \\\\mathcal{F}(-1))$ consists of monomials $x_0^{k_0}
        \\\\cdots x_{n-1}^{k_{n-1}} x_n^{-1}$ with $k_j \\\\le -1$, which is isomorphic
        to the basis of $H^{n-1}(H, \\\\mathcal{F}_H)$! In fact, the connecting homomorphism
        $\\\\delta : H^{n-1}(H, \\\\mathcal{F}_H) \\\\to H^n(X, \\\\mathcal{F}(-1))$
        sends $x_0^{k_0} \\\\cdots x_{n-1}^{k_{n-1}}$ to $x_0^{k_0} \\\\cdots x_{n-1}^{k_{n-1}}
        x_n^{-1}$, so $\\\\delta$ is injective! Consequently, the map $H^{n-1}(X,
        \\\\mathcal{F}) \\\\to H^{n-1}(H, \\\\mathcal{F}_H)$ is zero, so $\\\\cdot
        x_n : H^{n-1}(X, \\\\mathcal{F}(-1)) \\\\to H^{n-1}(X, \\\\mathcal{F})$ is
        surjective (and injective for $n \\u003e 2$, or injective for $n = 2$ by the
        $i=1$ case).\\n\\nThus, for *every* $0 \\u003c i \\u003c n$, multiplication
        by $x_n$ on $H^i(X, \\\\mathcal{F})$ is bijective! This means that $H^i(X,
        \\\\mathcal{F})$ equals its localization $H^i(X, \\\\mathcal{F})_{x_n}$. However,
        localizing the \u010Cech complex $\\\\check{C}^\\\\bullet(\\\\mathcal{U},
        \\\\mathcal{F})$ at $x_n$ yields the \u010Cech complex of $\\\\left.\\\\mathcal{F}\\\\right|_{U_n}$
        on the affine scheme $U_n = D_+(x_n)$! Since $U_n$ is affine, by Theorem 5.2.2
        we have $H^i(X, \\\\mathcal{F})_{x_n} \\\\cong H^i(U_n, \\\\left.\\\\mathcal{F}\\\\right|_{U_n})
        = 0$ for all $i \\u003e 0$. Since $H^i(X, \\\\mathcal{F}) \\\\xrightarrow{\\\\sim}
        H^i(X, \\\\mathcal{F})_{x_n}$ for $0 \\u003c i \\u003c n$, we conclude that
        $H^i(X, \\\\mathcal{F}) = 0$ for all $0 \\u003c i \\u003c n$. $\\\\blacksquare$\\n\\n---\\n\\n###
        5.4 Curves and the Riemann-Roch Theorem\\n\\nIn this final section, $k$ denotes
        an algebraically closed field. A *curve* over $k$ is an integral, separated,
        regular scheme $X$ of proper finite type over $k$ of dimension $1$ (a smooth
        projective curve).\\n\\nSince $X$ is regular of dimension $1$, for every closed
        point $P \\\\in X$, the local ring $\\\\mathcal{O}_{X,P}$ is a discrete valuation
        ring (DVR). A *divisor* $D$ on $X$ is a formal finite linear combination $D
        = \\\\sum_{P \\\\in X} n_P P$ of closed points with $n_P \\\\in \\\\mathbb{Z}$.
        The *degree* of $D$ is defined as\\n$$\\\\deg D = \\\\sum_{P \\\\in X} n_P
        \\\\in \\\\mathbb{Z}.$$\\nBy Exercise 4.3, since every DVR is a UFD, Weil
        divisors and Cartier divisors coincide on $X$: for each $D = \\\\sum n_P P$,
        the invertible sheaf $\\\\mathcal{O}_X(D) \\\\subseteq \\\\mathcal{K}$ is
        given on open sets $U \\\\subseteq X$ by\\n$$\\\\Gamma(U, \\\\mathcal{O}_X(D))
        = \\\\left\\\\{ f \\\\in K(X)^\\\\times \\\\;\\\\middle|\\\\; v_P(f) + n_P
        \\\\ge 0 \\\\text{ for all } P \\\\in U \\\\right\\\\} \\\\cup \\\\{0\\\\},$$\\nwhere
        $v_P : K(X)^\\\\times \\\\to \\\\mathbb{Z}$ is the discrete valuation at $P$.
        Note that if $P \\\\in X$ is a closed point, the ideal sheaf of $P$ is $\\\\mathcal{I}_P
        = \\\\mathcal{O}_X(-P)$, so we have the fundamental short exact sequence of
        sheaves on $X$:\\n$$0 \\\\longrightarrow \\\\mathcal{O}_X(-P) \\\\longrightarrow
        \\\\mathcal{O}_X \\\\longrightarrow k(P) \\\\longrightarrow 0$$\\nwhere $k(P)$
        is the skyscraper sheaf at $P$ with value $k(P) \\\\cong k$. Tensoring this
        exact sequence with the invertible (hence locally free and flat) sheaf $\\\\mathcal{O}_X(D)$
        yields the exact sequence:\\n$$0 \\\\longrightarrow \\\\mathcal{O}_X(D - P)
        \\\\longrightarrow \\\\mathcal{O}_X(D) \\\\longrightarrow k(P) \\\\longrightarrow
        0, \\\\quad (*)$$\\nsince $\\\\mathcal{O}_X(D) \\\\otimes_{\\\\mathcal{O}_X}
        k(P) \\\\cong k(P)$ (selecting a uniformizer $t \\\\in \\\\mathcal{O}_{X,P}$
        gives a local generator $t^{-n_P}$ of $\\\\mathcal{O}_X(D)_P$, identifying
        the fiber with $k(P)$).\\n\\n**Lemma 5.4.1.** *Let $X$ be a curve over $k$.*\\n1.
        *$H^0(X, \\\\mathcal{O}_X) = k$, and for any coherent sheaf $\\\\mathcal{F}$
        on $X$, $H^i(X, \\\\mathcal{F})$ is a finite-dimensional $k$-vector space
        for $i = 0, 1$, and $H^i(X, \\\\mathcal{F}) = 0$ for $i \\\\ge 2$.*\\n2. *For
        any non-zero rational function $f \\\\in K(X)^\\\\times$, the principal divisor
        $\\\\operatorname{div}(f) = \\\\sum_{P \\\\in X} v_P(f) P$ has degree $0$:
        $\\\\deg(\\\\operatorname{div}(f)) = 0$. Consequently, the degree of a divisor
        depends only on its linear equivalence class, defining a homomorphism $\\\\deg
        : \\\\operatorname{Pic}(X) \\\\to \\\\mathbb{Z}$.*\\n\\n*Proof.* (1) Since
        $X$ is proper of dimension $1$ over $k$, it can be covered by TWO affine open
        subsets $U_1, U_2$ (pick a non-empty affine open $U_1$; its complement is
        a finite set of closed points $P_1, \\\\dots, P_r$, which in a projective
        curve is always contained in a single affine open $U_2$). By Theorem 5.2.3,
        the \u010Cech complex for $\\\\{U_1, U_2\\\\}$ has length $1$ ($\\\\check{C}^p
        = 0$ for $p \\\\ge 2$), so $H^i(X, \\\\mathcal{F}) = 0$ for $i \\\\ge 2$.
        Finiteness of $\\\\dim_k H^i(X, \\\\mathcal{F})$ and $H^0(X, \\\\mathcal{O}_X)
        = k$ follow from Serre's finiteness theorem for projective schemes (or because
        any $f \\\\in H^0(X, \\\\mathcal{O}_X)$ defines a proper morphism $X \\\\to
        \\\\mathbb{A}^1_k \\\\subset \\\\mathbb{P}^1_k$ whose image must be closed
        in $\\\\mathbb{P}^1_k$ and contained in $\\\\mathbb{A}^1_k$, hence a single
        point).\\n\\n(2) For $f \\\\in K(X)^\\\\times \\\\setminus k$, $f$ defines
        a non-constant finite morphism $\\\\varphi : X \\\\to \\\\mathbb{P}^1_k$ of
        degree $d = [K(X) : k(t)]$. Then $\\\\operatorname{div}(f) = \\\\varphi^*(0)
        - \\\\varphi^*(\\\\infty)$. Both $\\\\varphi^*(0)$ and $\\\\varphi^*(\\\\infty)$
        have degree equal to $\\\\dim_k (\\\\mathcal{O}_X / f\\\\mathcal{O}_X) = [K(X)
        : k(t)] = d$, so $\\\\deg(\\\\operatorname{div}(f)) = d - d = 0$. $\\\\blacksquare$\\n\\n**Definition
        5.4.2.** For any divisor $D$ on a curve $X$, we write $l(D) = \\\\dim_k H^0(X,
        \\\\mathcal{O}_X(D))$ and $h^1(D) = \\\\dim_k H^1(X, \\\\mathcal{O}_X(D))$.
        The *Euler characteristic* of $\\\\mathcal{O}_X(D)$ is defined as\\n$$\\\\chi(\\\\mathcal{O}_X(D))
        = l(D) - h^1(D).$$\\nThe *genus* of the curve $X$ is defined as $g = \\\\dim_k
        H^1(X, \\\\mathcal{O}_X) = h^1(0)$. Note that since $l(0) = \\\\dim_k H^0(X,
        \\\\mathcal{O}_X) = 1$, we have $\\\\chi(\\\\mathcal{O}_X) = 1 - g$.\\n\\nTo
        state the full Riemann-Roch Theorem, we invoke **Serre Duality** for curves:
        let $\\\\omega_X = \\\\Omega_{X/k}^1$ be the canonical invertible sheaf on
        $X$, and let $K$ be a *canonical divisor* on $X$, meaning any divisor such
        that $\\\\mathcal{O}_X(K) \\\\cong \\\\omega_X$. Serre Duality states that
        for every divisor $D$ on $X$, there is a canonical isomorphism of $k$-vector
        spaces:\\n$$H^1(X, \\\\mathcal{O}_X(D))^\\\\vee \\\\cong H^0(X, \\\\omega_X
        \\\\otimes \\\\mathcal{O}_X(-D)) = H^0(X, \\\\mathcal{O}_X(K - D)).$$\\nIn
        particular, taking dimensions gives $h^1(D) = l(K - D)$.\\n\\n**Theorem 5.4.3
        (The Riemann-Roch Theorem for Curves).** *Let $X$ be a curve of genus $g$
        over $k$, and let $K$ be a canonical divisor on $X$. Then for every divisor
        $D$ on $X$, we have*\\n$$l(D) - l(K - D) = \\\\deg D + 1 - g.$$\\n\\n*Proof.*
        By Serre Duality, $l(K - D) = h^1(D)$, so $l(D) - l(K - D) = \\\\chi(\\\\mathcal{O}_X(D))$.
        Thus it suffices to prove the Riemann-Roch formula in Euler characteristic
        form:\\n$$\\\\chi(\\\\mathcal{O}_X(D)) = \\\\deg D + 1 - g \\\\quad \\\\text{for
        all divisors } D.$$\\nFirst, consider $D = 0$: then $\\\\deg 0 = 0$, and by
        definition of $g$, $\\\\chi(\\\\mathcal{O}_X) = l(0) - h^1(0) = 1 - g$. Thus
        the formula holds for $D = 0$.\\n\\nNow let $D$ be any divisor and $P \\\\in
        X$ any closed point. Consider the fundamental short exact sequence $(*)$:\\n$$0
        \\\\longrightarrow \\\\mathcal{O}_X(D - P) \\\\longrightarrow \\\\mathcal{O}_X(D)
        \\\\longrightarrow k(P) \\\\longrightarrow 0.$$\\nTaking the long exact sequence
        of sheaf cohomology on $X$ (and using $H^2 = 0$ by Lemma 5.4.1(1)), we obtain
        an exact sequence of finite-dimensional $k$-vector spaces:\\n$$0 \\\\to H^0(X,
        \\\\mathcal{O}_X(D-P)) \\\\to H^0(X, \\\\mathcal{O}_X(D)) \\\\to H^0(X, k(P))
        \\\\to H^1(X, \\\\mathcal{O}_X(D-P)) \\\\to H^1(X, \\\\mathcal{O}_X(D)) \\\\to
        H^1(X, k(P)) \\\\to 0.$$\\nNotice that the skyscraper sheaf $k(P)$ is flasque
        (its sections are $k$ on any open set containing $P$ and $0$ otherwise, so
        all restriction maps are either $\\\\operatorname{id}_k$ or $k \\\\to 0$,
        both surjective). Therefore, by Proposition 5.1.5(4), $H^1(X, k(P)) = 0$,
        while clearly $H^0(X, k(P)) = k$ has dimension $1$. Thus $\\\\chi(k(P)) =
        1 - 0 = 1$.\\n\\nRecall from linear algebra that in any finite exact sequence
        of finite-dimensional vector spaces $0 \\\\to V_0 \\\\to V_1 \\\\to \\\\dots
        \\\\to V_r \\\\to 0$, the alternating sum of dimensions is zero: $\\\\sum_{i=0}^r
        (-1)^i \\\\dim_k V_i = 0$. Applying this to our 6-term cohomology exact sequence
        gives\\n$$\\\\chi(\\\\mathcal{O}_X(D)) - \\\\chi(\\\\mathcal{O}_X(D - P))
        = \\\\chi(k(P)) = 1.$$\\nSince $\\\\deg D - \\\\deg(D - P) = 1$, we see that
        the formula $\\\\chi(\\\\mathcal{O}_X(D)) = \\\\deg D + 1 - g$ holds for $D$
        if and only if it holds for $D - P$! Since any divisor $D = \\\\sum n_P P$
        can be obtained from the zero divisor $0$ by finitely many steps of adding
        or subtracting a single point $P$, induction immediately proves that $\\\\chi(\\\\mathcal{O}_X(D))
        = \\\\deg D + 1 - g$ for all divisors $D$. $\\\\blacksquare$\\n\\n**Corollary
        5.4.4.** *Let $X$ be a curve of genus $g$ with canonical divisor $K$.*\\n1.
        *$\\\\deg K = 2g - 2$.*\\n2. *If $\\\\deg D \\u003c 0$, then $l(D) = 0$.*\\n3.
        *If $\\\\deg D \\u003e 2g - 2$, then $l(K - D) = 0$, so $l(D) = \\\\deg D
        + 1 - g$.*\\n\\n*Proof.* (1) Apply Theorem 5.4.3 to $D = K$: notice that $l(K)
        = h^1(0) = g$ by Serre Duality, and $l(K - K) = l(0) = 1$. Thus Riemann-Roch
        gives\\n$$g - 1 = \\\\deg K + 1 - g \\\\implies \\\\deg K = 2g - 2.$$\\n\\n(2)
        Suppose $l(D) \\u003e 0$, so there exists a non-zero global section $f \\\\in
        H^0(X, \\\\mathcal{O}_X(D))$. Then $v_P(f) + n_P \\\\ge 0$ for all $P \\\\in
        X$, which means $\\\\operatorname{div}(f) + D \\\\ge 0$ is an effective divisor.
        Taking degrees and using Lemma 5.4.1(2) gives $0 \\\\le \\\\deg(\\\\operatorname{div}(f)
        + D) = \\\\deg(\\\\operatorname{div}(f)) + \\\\deg D = \\\\deg D$. Thus if
        $\\\\deg D \\u003c 0$, we must have $l(D) = 0$.\\n\\n(3) If $\\\\deg D \\u003e
        2g - 2$, then by (1), $\\\\deg(K - D) = \\\\deg K - \\\\deg D = (2g - 2) -
        \\\\deg D \\u003c 0$. By (2), $l(K - D) = 0$, so Riemann-Roch reduces to $l(D)
        = \\\\deg D + 1 - g$. $\\\\blacksquare$\\n\\n---\\n\\n### Exercises for Chapter
        5\\n\\n**Exercise 5.1.** Let $X$ be a projective scheme over a field $k$,
        and let $Y \\\\subset \\\\mathbb{P}^n_k$ be a hypersurface of degree $d$.
        Using the exact sequence $0 \\\\to \\\\mathcal{O}_{\\\\mathbb{P}^n}(-d) \\\\to
        \\\\mathcal{O}_{\\\\mathbb{P}^n} \\\\to \\\\mathcal{O}_Y \\\\to 0$ and Theorem
        5.3.1, compute $\\\\dim_k H^i(Y, \\\\mathcal{O}_Y)$ for all $i \\\\ge 0$.
        In particular, show that if $Y \\\\subset \\\\mathbb{P}^2_k$ is a smooth plane
        curve of degree $d$, its genus is given by the *degree-genus formula*:\\n$$g
        = \\\\frac{(d-1)(d-2)}{2}.$$\\n\\n**Exercise 5.2 (Hilbert Polynomials).**
        Let $X \\\\subseteq \\\\mathbb{P}^n_k$ be a projective scheme over a field
        $k$, and $\\\\mathcal{F}$ a coherent sheaf on $X$. Define the *Euler characteristic*
        of $\\\\mathcal{F}$ by $\\\\chi(\\\\mathcal{F}) = \\\\sum_{i=0}^n (-1)^i \\\\dim_k
        H^i(X, \\\\mathcal{F})$. Prove that there exists a numerical polynomial $P_{\\\\mathcal{F}}(z)
        \\\\in \\\\mathbb{Q}[z]$ (called the *Hilbert polynomial* of $\\\\mathcal{F}$)
        such that $\\\\chi(\\\\mathcal{F}(m)) = P_{\\\\mathcal{F}}(m)$ for all $m
        \\\\in \\\\mathbb{Z}$, and that the degree of $P_{\\\\mathcal{F}}(z)$ is equal
        to the dimension of the support of $\\\\mathcal{F}$.\\n\\n**Exercise 5.3 (Criterion
        for Very Ampleness on Curves).** Let $X$ be a curve of genus $g$ over $k$,
        and $D$ a divisor on $X$.\\n(a) Prove that the complete linear system $|D|$
        is *base-point-free* (meaning $\\\\mathcal{O}_X(D)$ is generated by global
        sections) if and only if $l(D - P) = l(D) - 1$ for every point $P \\\\in X$.\\n(b)
        Prove that $D$ is *very ample* (meaning global sections of $\\\\mathcal{O}_X(D)$
        define a closed immersion $X \\\\hookrightarrow \\\\mathbb{P}^{l(D)-1}_k$)
        if and only if $l(D - P - Q) = l(D) - 2$ for all points $P, Q \\\\in X$ (including
        $P = Q$).\\n(c) Using Corollary 5.4.4(3), deduce that any divisor $D$ with
        $\\\\deg D \\\\ge 2g$ is base-point-free, and any divisor $D$ with $\\\\deg
        D \\\\ge 2g + 1$ is very ample. In particular, every curve of genus $g = 0$
        is isomorphic to $\\\\mathbb{P}^1_k$, and every curve of genus $g = 1$ (an
        *elliptic curve*) can be embedded as a smooth cubic curve in $\\\\mathbb{P}^2_k$.\\n\\n**Exercise
        5.4 (Canonical Curves and Hyperelliptic Curves).** Let $X$ be a curve of genus
        $g \\\\ge 2$, and $K$ a canonical divisor. We say $X$ is *hyperelliptic* if
        there exists a finite morphism $X \\\\to \\\\mathbb{P}^1_k$ of degree $2$
        (equivalently, a divisor $D$ of degree $2$ with $l(D) = 2$). Prove that the
        canonical divisor $K$ is very ample if and only if $X$ is *not* hyperelliptic.
        Conclude that every non-hyperelliptic curve of genus $3$ is isomorphic to
        a smooth plane quartic curve in $\\\\mathbb{P}^2_k$.\\n\\n**Exercise 5.5 (Riemann-Hurwitz
        Formula).** Let $f : X \\\\to Y$ be a finite separable morphism of degree
        $n$ between two curves over $k$ of genera $g(X)$ and $g(Y)$. Using the First
        Exact Sequence of differentials $0 \\\\to f^*\\\\Omega_{Y/k}^1 \\\\to \\\\Omega_{X/k}^1
        \\\\to \\\\Omega_{X/Y}^1 \\\\to 0$ (show the left map is injective since $f$
        is separable) and taking degrees of the corresponding divisors, prove the
        *Riemann-Hurwitz Formula*:\\n$$2g(X) - 2 = n(2g(Y) - 2) + \\\\deg R$$\\nwhere
        $R = \\\\sum_{P \\\\in X} \\\\operatorname{length}(\\\\Omega_{X/Y}^1)_P \\\\cdot
        P$ is the *ramification divisor* of $f$. Show that if the characteristic of
        $k$ does not divide the ramification index $e_P$ at $P$ (tame ramification),
        then the coefficient of $P$ in $R$ is simply $e_P - 1$.\"\n          }\n        ],\n
