        (where $\\\\mathfrak{p} \\\\in U$) to its value $s(\\\\mathfrak{p}) \\\\in
        A_{\\\\mathfrak{p}}$. This is clearly well-defined. To see that $\\\\pi_{\\\\mathfrak{p}}$
