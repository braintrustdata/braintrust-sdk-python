        [\n          {\n            \"text\": \"# FOUNDATIONS OF ALGEBRAIC GEOMETRY\\n\\n---\\n\\n##
        PREFACE\\n\\nAlgebraic geometry is the study of geometric spaces locally defined
        by the vanishing of polynomial equations. Over the course of the twentieth
        century, the subject underwent a profound metamorphosis\u2014from the classical
        study of projective varieties over the complex numbers to Alexander Grothendieck\u2019s
        monumental theory of schemes. By replacing points with prime ideals and coordinate
        rings with sheaves of local rings, scheme theory unified arithmetic and geometry,
        providing a language capable of addressing problems in number theory, topology,
        and complex geometry on an equal footing.\\n\\nThis text provides a self-contained,
        rigorous graduate-level introduction to modern algebraic geometry. We begin
        in Chapter 1 with the classical theory of affine and projective varieties
        over an algebraically closed field, establishing the fundamental dictionary
        between geometry and commutative algebra via Hilbert's Nullstellensatz and
        Noether Normalization. Chapter 2 develops the machinery of sheaves and locally
        ringed spaces, culminating in the construction of sheafification and operations
        on $\\\\mathcal{O}_X$-modules. In Chapter 3, we introduce affine and general
        schemes, the $\\\\operatorname{Proj}$ construction, and fibred products. Chapter
        4 develops the local and global properties of morphisms, emphasizing the valuative
        criteria for separatedness and properness. Chapter 5 examines quasi-coherent
        and coherent sheaves, Weil and Cartier divisors, and the Picard group. Chapter
        6 develops the theory of K\xE4hler differentials, exact sequences of cotangent
        sheaves, and algebraic smoothness. Chapter 7 builds the homological foundations
        of sheaf cohomology, proving Grothendieck's and Serre's vanishing theorems
        and explicitly computing the cohomology of projective space. Finally, Chapter
        8 synthesizes the entire apparatus to study algebraic curves, proving the
        Riemann-Roch theorem, Serre duality, and Hurwitz\u2019s theorem, and exploring
        the geometry of elliptic and canonical curves.\\n\\nEvery chapter concludes
        with a substantial collection of exercises designed to solidify the theory
        and introduce vital examples. We assume familiarity with basic commutative
        algebra (rings, ideals, modules, localization, tensor products, and Noetherian
        rings) and elementary point-set topology.\\n\\n---\\n\\n## CHAPTER 1: CLASSICAL
        ALGEBRAIC GEOMETRY: AFFINE AND PROJECTIVE VARIETIES\\n\\nThroughout this chapter,
        unless explicitly stated otherwise, $k$ denotes an algebraically closed field.\\n\\n###
        1.1 Affine Algebraic Sets and the Zariski Topology\\n\\n**Definition 1.1.1.**
        Let $k$ be an algebraically closed field. *Affine $n$-space* over $k$, denoted
        $\\\\mathbb{A}^n_k$ or simply $\\\\mathbb{A}^n$, is the set of all $n$-tuples
        of elements of $k$:\\n$$\\\\mathbb{A}^n_k = \\\\{P = (a_1, \\\\dots, a_n)
        \\\\mid a_i \\\\in k \\\\text{ for all } 1 \\\\le i \\\\le n\\\\}.$$\\nLet
        $A = k[x_1, \\\\dots, x_n]$ be the polynomial ring in $n$ variables over $k$.
        Elements $f \\\\in A$ are viewed as functions $f: \\\\mathbb{A}^n \\\\to k$
        via evaluation: $f(P) = f(a_1, \\\\dots, a_n)$.\\n\\nFor any subset $T \\\\subseteq
        A$, we define the *zero locus* (or *vanishing set*) of $T$ to be\\n$$Z(T)
        = \\\\{P \\\\in \\\\mathbb{A}^n \\\\mid f(P) = 0 \\\\text{ for all } f \\\\in
        T\\\\}.$$\\nA subset $Y \\\\subseteq \\\\mathbb{A}^n$ is called an *affine
        algebraic set* if there exists a subset $T \\\\subseteq A$ such that $Y =
        Z(T)$.\\n\\n**Lemma 1.1.2.** Let $\\\\mathfrak{a}$ be the ideal of $A$ generated
        by $T$. Then $Z(T) = Z(\\\\mathfrak{a})$. Consequently, every affine algebraic
        set is the zero locus of a finitely generated ideal $Z(f_1, \\\\dots, f_r)$.\\n\\n*Proof.*
        Clearly $T \\\\subseteq \\\\mathfrak{a}$ implies $Z(\\\\mathfrak{a}) \\\\subseteq
        Z(T)$. Conversely, if $P \\\\in Z(T)$ and $g \\\\in \\\\mathfrak{a}$, then
        $g = \\\\sum_{i=1}^m h_i f_i$ for some $h_i \\\\in A$ and $f_i \\\\in T$.
        Thus $g(P) = \\\\sum_{i=1}^m h_i(P)f_i(P) = 0$, so $P \\\\in Z(\\\\mathfrak{a})$.
        By Hilbert's Basis Theorem, the polynomial ring $A = k[x_1, \\\\dots, x_n]$
        is Noetherian, meaning every ideal $\\\\mathfrak{a} \\\\subseteq A$ is finitely
        generated: $\\\\mathfrak{a} = (f_1, \\\\dots, f_r)$. Hence $Z(T) = Z(\\\\mathfrak{a})
        = Z(f_1, \\\\dots, f_r)$. $\\\\blacksquare$\\n\\n**Proposition 1.1.3.** The
        collection of affine algebraic sets in $\\\\mathbb{A}^n$ satisfies the axioms
        for the closed subsets of a topology on $\\\\mathbb{A}^n$:\\n1. $\\\\emptyset
        = Z(1)$ and $\\\\mathbb{A}^n = Z(0)$ are algebraic sets.\\n2. If $Y_1 = Z(\\\\mathfrak{a}_1)$
        and $Y_2 = Z(\\\\mathfrak{a}_2)$ are algebraic sets, then $Y_1 \\\\cup Y_2
        = Z(\\\\mathfrak{a}_1 \\\\cap \\\\mathfrak{a}_2) = Z(\\\\mathfrak{a}_1 \\\\mathfrak{a}_2)$.\\n3.
        If $\\\\{Y_\\\\alpha = Z(\\\\mathfrak{a}_\\\\alpha)\\\\}_{\\\\alpha \\\\in
        I}$ is any family of algebraic sets, then $\\\\bigcap_{\\\\alpha \\\\in I}
        Y_\\\\alpha = Z\\\\left(\\\\sum_{\\\\alpha \\\\in I} \\\\mathfrak{a}_\\\\alpha\\\\right)$.\\n\\n*Proof.*
        \\n(1) The constant polynomial $1$ vanishes nowhere, so $Z(1) = \\\\emptyset$.
        The zero polynomial vanishes everywhere, so $Z(0) = \\\\mathbb{A}^n$.\\n\\n(2)
        Since $\\\\mathfrak{a}_1 \\\\mathfrak{a}_2 \\\\subseteq \\\\mathfrak{a}_1
        \\\\cap \\\\mathfrak{a}_2 \\\\subseteq \\\\mathfrak{a}_1, \\\\mathfrak{a}_2$,
        we have $Y_1 \\\\cup Y_2 \\\\subseteq Z(\\\\mathfrak{a}_1 \\\\cap \\\\mathfrak{a}_2)
        \\\\subseteq Z(\\\\mathfrak{a}_1 \\\\mathfrak{a}_2)$. To show $Z(\\\\mathfrak{a}_1
        \\\\mathfrak{a}_2) \\\\subseteq Y_1 \\\\cup Y_2$, suppose $P \\\\in Z(\\\\mathfrak{a}_1
        \\\\mathfrak{a}_2)$ and $P \\\\notin Y_1$. Then there exists $f \\\\in \\\\mathfrak{a}_1$
        such that $f(P) \\\\ne 0$. For every $g \\\\in \\\\mathfrak{a}_2$, we have
        $fg \\\\in \\\\mathfrak{a}_1 \\\\mathfrak{a}_2$, so $(fg)(P) = f(P)g(P) =
        0$. Since $k$ is a field and $f(P) \\\\ne 0$, it follows that $g(P) = 0$ for
        all $g \\\\in \\\\mathfrak{a}_2$, so $P \\\\in Y_2$.\\n\\n(3) A point $P \\\\in
        \\\\mathbb{A}^n$ lies in $\\\\bigcap_{\\\\alpha \\\\in I} Z(\\\\mathfrak{a}_\\\\alpha)$
        if and only if $f(P) = 0$ for all $\\\\alpha \\\\in I$ and all $f \\\\in \\\\mathfrak{a}_\\\\alpha$.
        Since every element of $\\\\sum_{\\\\alpha \\\\in I} \\\\mathfrak{a}_\\\\alpha$
        is a finite linear combination of elements from the $\\\\mathfrak{a}_\\\\alpha$,
        this is equivalent to $P \\\\in Z\\\\left(\\\\sum_{\\\\alpha \\\\in I} \\\\mathfrak{a}_\\\\alpha\\\\right)$.
        $\\\\blacksquare$\\n\\n**Definition 1.1.4.** The *Zariski topology* on $\\\\mathbb{A}^n$
        is the topology whose closed subsets are the affine algebraic sets. A subset
        $Y \\\\subseteq \\\\mathbb{A}^n$ is given the induced subspace topology, also
        called the Zariski topology on $Y$.\\n\\nA non-empty topological space $X$
        is called *irreducible* if it cannot be expressed as the union $X = X_1 \\\\cup
        X_2$ of two proper closed subsets $X_1, X_2 \\\\subsetneq X$. Equivalently,
        every pair of non-empty open subsets of $X$ has a non-empty intersection,
        or every non-empty open subset is dense in $X$.\\n\\n**Definition 1.1.5.**
        An *affine algebraic variety* (or simply *affine variety*) is an irreducible
        closed subset of $\\\\mathbb{A}^n$ (equipped with the induced Zariski topology).
        An open subset of an affine variety is called a *quasi-affine variety*.\\n\\n###
        1.2 Hilbert's Nullstellensatz\\n\\nTo establish the precise correspondence
        between subsets of $\\\\mathbb{A}^n$ and ideals of $A = k[x_1, \\\\dots, x_n]$,
        we introduce the ideal-theoretic counterpart to the zero locus operator $Z$.\\n\\n**Definition
        1.2.1.** For any subset $Y \\\\subseteq \\\\mathbb{A}^n$, the *ideal of $Y$*
        in $A$ is defined as\\n$$I(Y) = \\\\{f \\\\in A \\\\mid f(P) = 0 \\\\text{
        for all } P \\\\in Y\\\\}.$$\\nIt is immediate that $I(Y)$ is an ideal of
        $A$. Moreover, $I(Y)$ is a *radical ideal*: if $f^m \\\\in I(Y)$ for some
        integer $m \\\\ge 1$, then $(f(P))^m = 0$ in $k$ for all $P \\\\in Y$, which
        implies $f(P) = 0$, so $f \\\\in I(Y)$. Recall that the radical of an ideal
        $\\\\mathfrak{a} \\\\subseteq A$ is $\\\\sqrt{\\\\mathfrak{a}} = \\\\{f \\\\in
        A \\\\mid f^m \\\\in \\\\mathfrak{a} \\\\text{ for some } m \\\\ge 1\\\\}$.\\n\\nWe
        now prove Hilbert's Nullstellensatz in full generality. Our proof proceeds
        via the Artin-Tate Lemma and Zariski's Lemma.\\n\\n**Lemma 1.2.2 (Artin-Tate
        Lemma).** Let $R$ be a Noetherian ring, and let $R \\\\subseteq B \\\\subseteq
        C$ be rings such that $C$ is a finitely generated $R$-algebra and $C$ is a
        finitely generated $B$-module. Then $B$ is a finitely generated $R$-algebra.\\n\\n*Proof.*
        Let $x_1, \\\\dots, x_n$ be generators of $C$ as an $R$-algebra, and let $y_1,
        \\\\dots, y_m$ be generators of $C$ as a $B$-module. Then we can write each
        $x_i$ and each product $y_i y_j$ as a $B$-linear combination of the $y_k$:\\n$$x_i
        = \\\\sum_{k=1}^m b_{ik} y_k \\\\quad (b_{ik} \\\\in B),$$\\n$$y_i y_j = \\\\sum_{k=1}^m
        b_{ijk} y_k \\\\quad (b_{ijk} \\\\in B).$$\\nLet $B_0 \\\\subseteq B$ be the
        $R$-subalgebra generated by the finite set of elements $\\\\{b_{ik}, b_{ijk}\\\\}$.
        Since $R$ is Noetherian, Hilbert's Basis Theorem implies that $B_0$ is a Noetherian
        ring.\\n\\nAny element of $C$ is a polynomial in the $x_i$ with coefficients
        in $R$. Substituting the expressions for $x_i$ and repeatedly expanding products
        of the $y_k$ using the relations for $y_i y_j$, we see that every element
        of $C$ can be written as a $B_0$-linear combination of $y_1, \\\\dots, y_m$.
        Thus, $C$ is a finitely generated $B_0$-module. Since $B_0$ is Noetherian
        and $B$ is a $B_0$-submodule of $C$, $B$ must also be a finitely generated
        $B_0$-module. If $z_1, \\\\dots, z_r$ generate $B$ as a $B_0$-module, then
        $\\\\{b_{ik}, b_{ijk}, z_1, \\\\dots, z_r\\\\}$ generates $B$ as an $R$-algebra.
        $\\\\blacksquare$\\n\\n**Theorem 1.2.3 (Zariski's Lemma).** Let $k$ be a field
        and let $L$ be a finitely generated $k$-algebra. If $L$ is a field, then $L$
        is a finite algebraic extension of $k$.\\n\\n*Proof.* Let $L = k[x_1, \\\\dots,
        x_n]$. Suppose by way of contradiction that $L$ is not algebraic over $k$.
        By reordering the $x_i$, we may assume that $x_1, \\\\dots, x_r$ ($r \\\\ge
        1$) are algebraically independent over $k$, and that $L$ is finite and algebraic
        over the rational function field $K = k(x_1, \\\\dots, x_r)$.\\n\\nSince $L$
        is a finitely generated $K$-algebra and is algebraic over $K$, $L$ is a finite-dimensional
        $K$-vector space (hence a finitely generated $K$-module). Now apply the Artin-Tate
        Lemma to the tower of rings\\n$$k \\\\subseteq K \\\\subseteq L.$$\\nSince
        $k$ is a field (thus Noetherian), $L$ is a finitely generated $k$-algebra,
        and $L$ is a finitely generated $K$-module, the Artin-Tate Lemma implies that
        $K = k(x_1, \\\\dots, x_r)$ is a finitely generated $k$-algebra.\\n\\nSuppose
        $K = k[g_1/h_1, \\\\dots, g_s/h_s]$, where $g_i, h_i \\\\in k[x_1, \\\\dots,
        x_r]$. Since $k[x_1, \\\\dots, x_r]$ is a unique factorization domain with
        infinitely many non-associate irreducible elements (for example, by Euclid's
        argument applied to polynomials: if $p_1, \\\\dots, p_t$ were all the irreducibles,
        $p_1 \\\\cdots p_t + 1$ would have a new irreducible factor), there exists
        an irreducible polynomial $q \\\\in k[x_1, \\\\dots, x_r]$ that does not divide
        any of $h_1, \\\\dots, h_s$. However, $1/q \\\\in K$, so we must be able to
        write\\n$$\\\\frac{1}{q} = P\\\\left(\\\\frac{g_1}{h_1}, \\\\dots, \\\\frac{g_s}{h_s}\\\\right)$$\\nfor
        some polynomial $P$. Clearing denominators yields an equation of the form
        $h_1^{d_1} \\\\cdots h_s^{d_s} = q \\\\cdot F$ in $k[x_1, \\\\dots, x_r]$,
        implying that $q$ divides some $h_i$, a contradiction. Thus $r = 0$, and $L$
        is algebraic over $k$. $\\\\blacksquare$\\n\\n**Corollary 1.2.4 (Weak Nullstellensatz).**
        Let $k$ be an algebraically closed field, and let $\\\\mathfrak{m}$ be a maximal
        ideal of $A = k[x_1, \\\\dots, x_n]$. Then there exists a unique point $P
        = (a_1, \\\\dots, a_n) \\\\in \\\\mathbb{A}^n_k$ such that $\\\\mathfrak{m}
        = (x_1 - a_1, \\\\dots, x_n - a_n)$. In particular, for any proper ideal $\\\\mathfrak{a}
        \\\\subsetneq A$, $Z(\\\\mathfrak{a}) \\\\ne \\\\emptyset$.\\n\\n*Proof.*
        The quotient ring $L = A/\\\\mathfrak{m}$ is a field that is a finitely generated
        $k$-algebra. By Zariski's Lemma, $L$ is a finite algebraic extension of $k$.
        Since $k$ is algebraically closed, the natural inclusion $k \\\\hookrightarrow
        A/\\\\mathfrak{m}$ is an isomorphism. Let $a_i \\\\in k$ be the unique element
        mapping to the coset $x_i + \\\\mathfrak{m}$. Then $x_i - a_i \\\\in \\\\mathfrak{m}$
        for all $i=1, \\\\dots, n$, so $(x_1 - a_1, \\\\dots, x_n - a_n) \\\\subseteq
        \\\\mathfrak{m}$. Since $(x_1 - a_1, \\\\dots, x_n - a_n)$ is clearly a maximal
        ideal (its quotient is $k$), equality holds.\\n\\nIf $\\\\mathfrak{a} \\\\subsetneq
        A$ is any proper ideal, then by Zorn's Lemma $\\\\mathfrak{a}$ is contained
        in some maximal ideal $\\\\mathfrak{m} = (x_1 - a_1, \\\\dots, x_n - a_n)$.
        Then $P = (a_1, \\\\dots, a_n) \\\\in Z(\\\\mathfrak{m}) \\\\subseteq Z(\\\\mathfrak{a})$,
        so $Z(\\\\mathfrak{a}) \\\\ne \\\\emptyset$. $\\\\blacksquare$\\n\\n**Theorem
        1.2.5 (Hilbert's Nullstellensatz).** Let $k$ be an algebraically closed field,
        and let $\\\\mathfrak{a}$ be an ideal in $A = k[x_1, \\\\dots, x_n]$. Then\\n$$I(Z(\\\\mathfrak{a}))
        = \\\\sqrt{\\\\mathfrak{a}}.$$\\n\\n*Proof.* We carry out the \\\"Rabinowitsch
        Trick.\\\" The inclusion $\\\\sqrt{\\\\mathfrak{a}} \\\\subseteq I(Z(\\\\mathfrak{a}))$
        is immediate: if $f \\\\in \\\\sqrt{\\\\mathfrak{a}}$, then $f^m \\\\in \\\\mathfrak{a}$
        for some $m \\\\ge 1$. For any $P \\\\in Z(\\\\mathfrak{a})$, $(f(P))^m =
        f^m(P) = 0$, so $f(P) = 0$, hence $f \\\\in I(Z(\\\\mathfrak{a}))$.\\n\\nConversely,
        let $f \\\\in I(Z(\\\\mathfrak{a}))$, and assume $f \\\\ne 0$. Let $\\\\mathfrak{a}
        = (g_1, \\\\dots, g_r)$. Consider the polynomial ring in $n+1$ variables $A[y]
        = k[x_1, \\\\dots, x_n, y]$, and let $\\\\mathfrak{b} \\\\subseteq A[y]$ be
        the ideal generated by $g_1, \\\\dots, g_r$ and $1 - yf$:\\n$$\\\\mathfrak{b}
        = (g_1, \\\\dots, g_r, 1 - yf) \\\\subseteq k[x_1, \\\\dots, x_n, y].$$\\nSuppose
        $Q = (a_1, \\\\dots, a_n, b) \\\\in \\\\mathbb{A}^{n+1}_k$ is a point in $Z(\\\\mathfrak{b})$.
        Then $P = (a_1, \\\\dots, a_n) \\\\in \\\\mathbb{A}^n_k$ satisfies $g_i(P)
        = 0$ for all $i=1, \\\\dots, r$, so $P \\\\in Z(\\\\mathfrak{a})$. Since $f
        \\\\in I(Z(\\\\mathfrak{a}))$, we must have $f(P) = 0$. On the other hand,
        $Q \\\\in Z(\\\\mathfrak{b})$ implies $1 - b f(P) = 0$, which reduces to $1
        = 0$, a contradiction.\\n\\nTherefore, $Z(\\\\mathfrak{b}) = \\\\emptyset$
        in $\\\\mathbb{A}^{n+1}_k$. By the Weak Nullstellensatz (Corollary 1.2.4),
        $\\\\mathfrak{b}$ cannot be a proper ideal of $A[y]$, so $1 \\\\in \\\\mathfrak{b}$.
        Thus there exist polynomials $h_1, \\\\dots, h_r, h_{r+1} \\\\in k[x_1, \\\\dots,
        x_n, y]$ such that\\n$$1 = \\\\sum_{i=1}^r h_i(x_1, \\\\dots, x_n, y) g_i(x_1,
        \\\\dots, x_n) + h_{r+1}(x_1, \\\\dots, x_n, y)(1 - yf).$$\\nThis is an identity
        in the polynomial ring $A[y]$, so it holds in the localization $A_f = A[1/f]$
        upon substituting $y = 1/f$. Under this substitution, the last term vanishes,
        leaving\\n$$1 = \\\\sum_{i=1}^r h_i\\\\left(x_1, \\\\dots, x_n, \\\\frac{1}{f}\\\\right)
        g_i(x_1, \\\\dots, x_n).$$\\nLet $m \\\\ge 1$ be the highest power of $y$
        appearing in any of the polynomials $h_1, \\\\dots, h_r$. Multiplying both
        sides of the equation by $f^m$ clears all denominators and yields\\n$$f^m
        = \\\\sum_{i=1}^r H_i(x_1, \\\\dots, x_n) g_i(x_1, \\\\dots, x_n)$$\\nfor
        some polynomials $H_i \\\\in A$. Hence $f^m \\\\in \\\\mathfrak{a}$, so $f
        \\\\in \\\\sqrt{\\\\mathfrak{a}}$. $\\\\blacksquare$\\n\\n**Corollary 1.2.6.**
        There is an inclusion-reversing bijection between algebraic sets in $\\\\mathbb{A}^n$
        and radical ideals in $A = k[x_1, \\\\dots, x_n]$, given by $Y \\\\mapsto
        I(Y)$ and $\\\\mathfrak{a} \\\\mapsto Z(\\\\mathfrak{a})$. Under this correspondence:\\n1.
        An algebraic set $Y$ is irreducible (i.e., an affine variety) if and only
        if $I(Y)$ is a prime ideal.\\n2. Points of $\\\\mathbb{A}^n$ correspond bijectively
        to maximal ideals of $A$.\\n3. Every algebraic set $Y \\\\subseteq \\\\mathbb{A}^n$
        can be written uniquely as a finite union $Y = Y_1 \\\\cup \\\\dots \\\\cup
        Y_r$ of irreducible algebraic sets such that $Y_i \\\\not\\\\subseteq Y_j$
        for $i \\\\ne j$ (the *irreducible components* of $Y$).\\n\\n*Proof.* For
        any algebraic set $Y = Z(\\\\mathfrak{b})$, we have $Z(I(Y)) = Z(I(Z(\\\\mathfrak{b})))
        = Z(\\\\sqrt{\\\\mathfrak{b}}) = Z(\\\\mathfrak{b}) = Y$. For any radical
        ideal $\\\\mathfrak{a}$, Theorem 1.2.5 gives $I(Z(\\\\mathfrak{a})) = \\\\sqrt{\\\\mathfrak{a}}
        = \\\\mathfrak{a}$. Thus $I$ and $Z$ are mutually inverse bijections.\\n\\nTo
        prove (1), suppose $Y$ is irreducible and $fg \\\\in I(Y)$. Then $Y \\\\subseteq
        Z(fg) = Z(f) \\\\cup Z(g)$, so $Y = (Y \\\\cap Z(f)) \\\\cup (Y \\\\cap Z(g))$.
        Since $Y$ is irreducible, either $Y = Y \\\\cap Z(f)$ or $Y = Y \\\\cap Z(g)$,
        meaning $Y \\\\subseteq Z(f)$ or $Y \\\\subseteq Z(g)$, so $f \\\\in I(Y)$
        or $g \\\\in I(Y)$. Conversely, if $I(Y)$ is prime and $Y = Y_1 \\\\cup Y_2
        = Z(\\\\mathfrak{a}_1) \\\\cup Z(\\\\mathfrak{a}_2) = Z(\\\\mathfrak{a}_1
        \\\\mathfrak{a}_2)$, then $\\\\mathfrak{a}_1 \\\\mathfrak{a}_2 \\\\subseteq
        I(Y)$. Since $I(Y)$ is prime, either $\\\\mathfrak{a}_1 \\\\subseteq I(Y)$
        or $\\\\mathfrak{a}_2 \\\\subseteq I(Y)$, so $Y \\\\subseteq Y_1$ or $Y \\\\subseteq
        Y_2$.\\n\\nPart (2) is Corollary 1.2.4. Part (3) is the topological translation
        of the primary decomposition of radical ideals in a Noetherian ring (or may
        be proven directly by Noetherian induction on the closed subsets of $\\\\mathbb{A}^n$,
        since $A$ being Noetherian implies $\\\\mathbb{A}^n$ is a Noetherian topological
        space, i.e., satisfies the descending chain condition on closed subsets).
        $\\\\blacksquare$\\n\\n### 1.3 The Coordinate Ring, Morphisms, and Rational
        Maps\\n\\n**Definition 1.3.1.** Let $Y \\\\subseteq \\\\mathbb{A}^n$ be an
        affine algebraic set. The *affine coordinate ring* of $Y$, denoted $A(Y)$,
        is defined to be the quotient ring\\n$$A(Y) = k[x_1, \\\\dots, x_n] / I(Y).$$\\nNotice
        that $A(Y)$ is a finitely generated $k$-algebra. If $Y$ is an affine variety,
        then $I(Y)$ is prime, so $A(Y)$ is an integral domain. Even if $Y$ is not
        irreducible, $I(Y)$ is a radical ideal, so $A(Y)$ is a *reduced* finitely
        generated $k$-algebra (it has no non-zero nilpotent elements).\\n\\n**Definition
        1.3.2.** Let $Y \\\\subseteq \\\\mathbb{A}^n$ be an affine variety, and let
        $U \\\\subseteq Y$ be an open subset (so $U$ is a quasi-affine variety). A
        function $f: U \\\\to k$ is said to be *regular* at a point $P \\\\in U$ if
        there is an open neighborhood $V$ of $P$ in $U$ and polynomials $g, h \\\\in
        k[x_1, \\\\dots, x_n]$ such that $h(Q) \\\\ne 0$ for all $Q \\\\in V$, and
        $f(Q) = g(Q)/h(Q)$ for all $Q \\\\in V$. We say that $f$ is *regular on $U$*
        if it is regular at every point of $U$. The ring of all regular functions
        on $U$ is denoted $\\\\mathcal{O}(U)$.\\n\\n**Lemma 1.3.3.** A regular function
        $f: U \\\\to k$ is continuous when $k$ is identified with $\\\\mathbb{A}^1_k$
        equipped with the Zariski topology. Consequently, if $f, g \\\\in \\\\mathcal{O}(U)$
        agree on a dense open subset of $U$, then $f = g$ on all of $U$.\\n\\n*Proof.*
        Since continuity is a local property, it suffices to show $f$ is continuous
        on an open neighborhood $V$ where $f = g/h$. The closed subsets of $\\\\mathbb{A}^1_k$
        are finite sets of points and $\\\\mathbb{A}^1_k$ itself. For any $a \\\\in
        k$, $f^{-1}(a) \\\\cap V = \\\\{Q \\\\in V \\\\mid (g - ah)(Q) = 0\\\\} =
        V \\\\cap Z(g - ah)$, which is closed in $V$. Thus the preimage of any finite
        set is closed. If $f$ and $g$ agree on a dense subset $W \\\\subseteq U$,
        then $(f - g)^{-1}(0)$ is a closed subset of $U$ containing $W$, hence must
        be all of $U$. $\\\\blacksquare$\\n\\n**Definition 1.3.4.** Let $Y \\\\subseteq
        \\\\mathbb{A}^n$ be an affine variety. Since $A(Y)$ is an integral domain,
        we may form its field of fractions, denoted $K(Y)$ and called the *function
        field* (or *field of rational functions*) of $Y$. For each point $P \\\\in
        Y$, let $\\\\mathfrak{m}_P = \\\\{f \\\\in A(Y) \\\\mid f(P) = 0\\\\}$ be
        the maximal ideal of $A(Y)$ corresponding to $P$. We define the *local ring
        of $P$ on $Y$*, denoted $\\\\mathcal{O}_{P,Y}$ or $\\\\mathcal{O}_P$, to be
        the localization of $A(Y)$ at $\\\\mathfrak{m}_P$:\\n$$\\\\mathcal{O}_P =
        A(Y)_{\\\\mathfrak{m}_P} \\\\subseteq K(Y).$$\\n\\n**Theorem 1.3.5.** Let
        $Y \\\\subseteq \\\\mathbb{A}^n$ be an affine variety.\\n1. For any point
        $P \\\\in Y$, $\\\\mathcal{O}_P$ is isomorphic to the ring of germs of regular
        functions in a neighborhood of $P$.\\n2. For any non-empty open subset $U
        \\\\subseteq Y$, $\\\\mathcal{O}(U) = \\\\bigcap_{P \\\\in U} \\\\mathcal{O}_P$
        (where the intersection is taken inside $K(Y)$).\\n3. In particular, $\\\\mathcal{O}(Y)
        \\\\cong A(Y)$.\\n\\n*Proof.* (1) A germ of a regular function at $P$ is given
        on some open neighborhood $V \\\\ni P$ by $g/h$ with $g, h \\\\in k[x_1, \\\\dots,
        x_n]$ and $h(P) \\\\ne 0$. Passing to residue classes modulo $I(Y)$, $\\\\bar{g},
        \\\\bar{h} \\\\in A(Y)$ with $\\\\bar{h} \\\\notin \\\\mathfrak{m}_P$, defining
        a unique element $\\\\bar{g}/\\\\bar{h} \\\\in A(Y)_{\\\\mathfrak{m}_P}$.
        By Lemma 1.3.3, two rational expressions define the same function on a neighborhood
        of $P$ if and only if they agree on a non-empty open set, which (since $Y$
        is irreducible) holds if and only if they represent the same element in the
        fraction field $K(Y)$.\\n\\n(2) By (1), every regular function $f \\\\in \\\\mathcal{O}(U)$
        defines at each $P \\\\in U$ an element of $\\\\mathcal{O}_P$, and because
        $U$ is irreducible, these local fractions must all coincide in $K(Y)$. Thus
        $\\\\mathcal{O}(U)$ embeds naturally into $\\\\bigcap_{P \\\\in U} \\\\mathcal{O}_P$,
        and clearly they are equal.\\n\\n(3) Setting $U = Y$, we have a natural injective
        homomorphism $A(Y) \\\\hookrightarrow \\\\mathcal{O}(Y) = \\\\bigcap_{P \\\\in
        Y} A(Y)_{\\\\mathfrak{m}_P}$. To show surjectivity, let $\\\\xi \\\\in \\\\bigcap_{P
        \\\\in Y} A(Y)_{\\\\mathfrak{m}_P} \\\\subseteq K(Y)$. Define the *ideal of
        denominators* of $\\\\xi$:\\n$$\\\\mathfrak{b} = \\\\{h \\\\in A(Y) \\\\mid
        h\\\\xi \\\\in A(Y)\\\\}.$$\\nClearly $\\\\mathfrak{b}$ is an ideal of $A(Y)$.
        For every $P \\\\in Y$, since $\\\\xi \\\\in A(Y)_{\\\\mathfrak{m}_P}$, we
        can write $\\\\xi = g_P / h_P$ with $g_P, h_P \\\\in A(Y)$ and $h_P(P) \\\\ne
        0$. Then $h_P \\\\in \\\\mathfrak{b}$ and $h_P \\\\notin \\\\mathfrak{m}_P$.
        Thus $\\\\mathfrak{b}$ is not contained in $\\\\mathfrak{m}_P$ for any $P
        \\\\in Y$. By the Weak Nullstellensatz, every maximal ideal of $A(Y)$ is of
        the form $\\\\mathfrak{m}_P$ for some $P \\\\in Y$. Since $\\\\mathfrak{b}$
        is not contained in any maximal ideal, we must have $\\\\mathfrak{b} = A(Y)$.
        Therefore $1 \\\\in \\\\mathfrak{b}$, which means $1 \\\\cdot \\\\xi = \\\\xi
        \\\\in A(Y)$. $\\\\blacksquare$\\n\\n**Definition 1.3.6.** Let $X$ and $Y$
        be quasi-affine varieties. A map $\\\\varphi: X \\\\to Y$ is a *morphism*
        if it is continuous in the Zariski topology and if for every open subset $V
        \\\\subseteq Y$ and every regular function $f \\\\in \\\\mathcal{O}(V)$, the
        composition $f \\\\circ \\\\varphi: \\\\varphi^{-1}(V) \\\\to k$ is a regular
        function in $\\\\mathcal{O}(\\\\varphi^{-1}(V))$.\\n\\n**Proposition 1.3.7.**
        Let $X$ and $Y$ be affine varieties. There is a natural bijection between
        the set of morphisms $\\\\operatorname{Hom}_{\\\\text{Var}}(X, Y)$ and the
        set of $k$-algebra homomorphisms $\\\\operatorname{Hom}_{k\\\\text{-alg}}(A(Y),
        A(X))$. Consequently, the category of affine varieties over $k$ is anti-equivalent
        to the category of finitely generated $k$-algebras that are integral domains.\\n\\n*Proof.*
        Given a morphism $\\\\varphi: X \\\\to Y$, pulling back regular functions
        on $Y$ defines a $k$-algebra homomorphism $\\\\varphi^*: \\\\mathcal{O}(Y)
        \\\\to \\\\mathcal{O}(X)$, which by Theorem 1.3.5(3) is a homomorphism $\\\\varphi^*:
        A(Y) \\\\to A(X)$.\\n\\nConversely, let $\\\\alpha: A(Y) \\\\to A(X)$ be a
        $k$-algebra homomorphism. Suppose $Y \\\\subseteq \\\\mathbb{A}^m$ has coordinate
        functions $\\\\bar{y}_1, \\\\dots, \\\\bar{y}_m \\\\in A(Y)$. Let $\\\\xi_i
        = \\\\alpha(\\\\bar{y}_i) \\\\in A(X)$ for $1 \\\\le i \\\\le m$. We define
        a map $\\\\varphi: X \\\\to \\\\mathbb{A}^m$ by\\n$$\\\\varphi(P) = (\\\\xi_1(P),
        \\\\dots, \\\\xi_m(P)).$$\\nFor any polynomial $g \\\\in I(Y) \\\\subseteq
        k[y_1, \\\\dots, y_m]$, its class $\\\\bar{g}$ in $A(Y)$ is zero, so $g(\\\\xi_1,
        \\\\dots, \\\\xi_m) = \\\\alpha(\\\\bar{g}) = 0$ in $A(X)$. Thus for every
        $P \\\\in X$, $g(\\\\varphi(P)) = 0$, proving that $\\\\varphi(X) \\\\subseteq
        Y$. It is straightforward to verify that $\\\\varphi: X \\\\to Y$ is continuous,
        pulls back regular functions to regular functions, and that the constructions
        $\\\\varphi \\\\mapsto \\\\varphi^*$ and $\\\\alpha \\\\mapsto \\\\varphi$
        are mutual inverses. Finally, any finitely generated $k$-algebra $B$ that
        is an integral domain is isomorphic to $k[x_1, \\\\dots, x_n]/\\\\mathfrak{p}$
        for some prime ideal $\\\\mathfrak{p}$, which is the coordinate ring of the
        affine variety $Z(\\\\mathfrak{p}) \\\\subseteq \\\\mathbb{A}^n$. $\\\\blacksquare$\\n\\n**Example
        1.3.8 (Principal Open Sets).** Let $Y \\\\subseteq \\\\mathbb{A}^n$ be an
        affine variety and let $f \\\\in A(Y)$ be a non-zero element. The open subset
        $D(f) = Y \\\\setminus Z(f) = \\\\{P \\\\in Y \\\\mid f(P) \\\\ne 0\\\\}$
        is called a *principal* (or *distinguished*) *open subset*. Notice that $D(f)$
        is naturally isomorphic to an affine variety in $\\\\mathbb{A}^{n+1}$: if
        $Y = Z(\\\\mathfrak{p})$ and $F \\\\in k[x_1, \\\\dots, x_n]$ represents $f$,
        let $W \\\\subseteq \\\\mathbb{A}^{n+1}$ be the zero locus of $\\\\mathfrak{p}$
        and $x_{n+1}F - 1$. The projection $\\\\mathbb{A}^{n+1} \\\\to \\\\mathbb{A}^n$
        restricts to an isomorphism $W \\\\xrightarrow{\\\\sim} D(f)$ whose inverse
        is $P \\\\mapsto (P, 1/f(P))$. Its coordinate ring is $\\\\mathcal{O}(D(f))
        \\\\cong A(Y)_f = A(Y)[1/f]$. Since any closed set $Z(\\\\mathfrak{a}) = Z(f_1,
        \\\\dots, f_r)$ has complement $\\\\bigcup_{i=1}^r D(f_i)$, the principal
        open subsets form a basis for the Zariski topology on $Y$.\\n\\n### 1.4 Projective
        Space and Projective Varieties\\n\\n**Definition 1.4.1.** *Projective $n$-space*
        over $k$, denoted $\\\\mathbb{P}^n_k$ or $\\\\mathbb{P}^n$, is the set of
        equivalence classes of $(n+1)$-tuples $(a_0, a_1, \\\\dots, a_n) \\\\in \\\\mathbb{A}^{n+1}
        \\\\setminus \\\\{(0, \\\\dots, 0)\\\\}$ under the equivalence relation\\n$$(a_0,
        \\\\dots, a_n) \\\\sim (\\\\lambda a_0, \\\\dots, \\\\lambda a_n) \\\\quad
        \\\\text{for all } \\\\lambda \\\\in k^\\\\times = k \\\\setminus \\\\{0\\\\}.$$\\nThe
        equivalence class of $(a_0, \\\\dots, a_n)$ is denoted $[a_0 : a_1 : \\\\dots
        : a_n]$, and $a_0, \\\\dots, a_n$ are called *homogeneous coordinates* for
        the point.\\n\\nLet $S = k[x_0, x_1, \\\\dots, x_n]$ be the polynomial ring
        in $n+1$ variables. We decompose $S$ as a graded ring $S = \\\\bigoplus_{d
        \\\\ge 0} S_d$, where $S_d$ is the $k$-vector space of *homogeneous polynomials*
        of degree $d$ (along with the zero polynomial). While a polynomial $f \\\\in
        S$ does not define a function on $\\\\mathbb{P}^n$, if $f \\\\in S_d$ is homogeneous
        of degree $d$, then for any $\\\\lambda \\\\in k^\\\\times$,\\n$$f(\\\\lambda
        a_0, \\\\dots, \\\\lambda a_n) = \\\\lambda^d f(a_0, \\\\dots, a_n).$$\\nConsequently,
        the condition $f(P) = 0$ is well-defined for $P = [a_0 : \\\\dots : a_n] \\\\in
        \\\\mathbb{P}^n$.\\n\\n**Definition 1.4.2.** An ideal $\\\\mathfrak{a} \\\\subseteq
        S$ is called *homogeneous* if $\\\\mathfrak{a} = \\\\bigoplus_{d \\\\ge 0}
        (\\\\mathfrak{a} \\\\cap S_d)$; equivalently, $\\\\mathfrak{a}$ is generated
        by homogeneous polynomials. For any subset $T \\\\subseteq S$ of homogeneous
        elements, we define its projective zero locus\\n$$Z_+(T) = \\\\{P \\\\in \\\\mathbb{P}^n
        \\\\mid f(P) = 0 \\\\text{ for all } f \\\\in T\\\\}.$$\\nIf $\\\\mathfrak{a}$
        is the homogeneous ideal generated by $T$, then $Z_+(T) = Z_+(\\\\mathfrak{a})$.
        Subsets of $\\\\mathbb{P}^n$ of the form $Z_+(\\\\mathfrak{a})$ are called
        *projective algebraic sets*. They satisfy the axioms for closed sets of a
        topology on $\\\\mathbb{P}^n$, called the *Zariski topology* on $\\\\mathbb{P}^n$.
        An irreducible projective algebraic set is a *projective variety*, and an
        open subset of a projective variety is a *quasi-projective variety*.\\n\\n**Definition
        1.4.3.** Let $S_+ = \\\\bigoplus_{d \\u003e 0} S_d = (x_0, x_1, \\\\dots,
        x_n)$ be the *irrelevant maximal ideal* of $S$. For any subset $Y \\\\subseteq
        \\\\mathbb{P}^n$, the *homogeneous ideal of $Y$*, denoted $I(Y)$, is the ideal
        in $S$ generated by all homogeneous polynomials vanishing on $Y$.\\n\\n**Theorem
        1.4.4 (Projective Nullstellensatz).** Let $\\\\mathfrak{a} \\\\subseteq S
        = k[x_0, \\\\dots, x_n]$ be a homogeneous ideal.\\n1. $Z_+(\\\\mathfrak{a})
        = \\\\emptyset$ if and only if $\\\\sqrt{\\\\mathfrak{a}} \\\\supseteq S_+$
        (which is equivalent to saying $\\\\mathfrak{a} \\\\supseteq S_d$ for some
        $d \\\\ge 1$).\\n2. If $Z_+(\\\\mathfrak{a}) \\\\ne \\\\emptyset$, then $I(Z_+(\\\\mathfrak{a}))
        = \\\\sqrt{\\\\mathfrak{a}}$.\\n3. There is an inclusion-reversing bijection
        between projective algebraic sets in $\\\\mathbb{P}^n$ and homogeneous radical
        ideals of $S$ not containing $S_+$, under which projective varieties correspond
        to homogeneous prime ideals not containing $S_+$.\\n\\n*Proof.* Consider the
        projection $\\\\pi: \\\\mathbb{A}^{n+1} \\\\setminus \\\\{0\\\\} \\\\to \\\\mathbb{P}^n$.
        For any projective algebraic set $Y = Z_+(\\\\mathfrak{a}) \\\\subseteq \\\\mathbb{P}^n$,
        its *affine cone* is $C(Y) = \\\\pi^{-1}(Y) \\\\cup \\\\{0\\\\} = Z(\\\\mathfrak{a})
        \\\\subseteq \\\\mathbb{A}^{n+1}$. Notice that $Z_+(\\\\mathfrak{a}) = \\\\emptyset$
        in $\\\\mathbb{P}^n$ if and only if $Z(\\\\mathfrak{a}) \\\\subseteq \\\\{0\\\\}$
        in $\\\\mathbb{A}^{n+1}$. By the Affine Nullstellensatz (Theorem 1.2.5), $Z(\\\\mathfrak{a})
        \\\\subseteq \\\\{0\\\\} = Z(x_0, \\\\dots, x_n)$ if and only if $\\\\sqrt{\\\\mathfrak{a}}
        = I(Z(\\\\mathfrak{a})) \\\\supseteq I(\\\\{0\\\\}) = (x_0, \\\\dots, x_n)
        = S_+$. Since $S_+$ is generated by $x_0, \\\\dots, x_n$, $\\\\sqrt{\\\\mathfrak{a}}
        \\\\supseteq S_+$ if and only if $x_i^m \\\\in \\\\mathfrak{a}$ for all $i$,
        which implies $S_d \\\\subseteq \\\\mathfrak{a}$ for $d \\u003e n(m-1)$. This
        proves (1).\\n\\nIf $Z_+(\\\\mathfrak{a}) \\\\ne \\\\emptyset$, then the affine
        zero locus $Z(\\\\mathfrak{a})$ contains points other than the origin. For
        any homogeneous polynomial $f$ of degree $d \\\\ge 1$, $f$ vanishes on $Z_+(\\\\mathfrak{a})$
        if and only if $f$ vanishes on $\\\\pi^{-1}(Z_+(\\\\mathfrak{a}))$, and since
        $f(0) = 0$ automatically, this holds if and only if $f \\\\in I_{\\\\text{aff}}(Z(\\\\mathfrak{a}))
        = \\\\sqrt{\\\\mathfrak{a}}$. Since $I(Z_+(\\\\mathfrak{a}))$ and $\\\\sqrt{\\\\mathfrak{a}}$
        are both homogeneous ideals with the exact same homogeneous elements of positive
        degree (and neither contains non-zero constants since $Z_+(\\\\mathfrak{a})
        \\\\ne \\\\emptyset$), they are equal. Part (3) follows immediately from (1)
        and (2). $\\\\blacksquare$\\n\\n**Proposition 1.4.5 (The Standard Affine Open
        Cover of $\\\\mathbb{P}^n$).** For each $i = 0, 1, \\\\dots, n$, let $U_i
        = D_+(x_i) = \\\\{[a_0 : \\\\dots : a_n] \\\\in \\\\mathbb{P}^n \\\\mid a_i
        \\\\ne 0\\\\}$. Then:\\n1. $U_i$ is a dense open subset of $\\\\mathbb{P}^n$,
        and $\\\\mathbb{P}^n = \\\\bigcup_{i=0}^n U_i$.\\n2. The map $\\\\varphi_i:
        U_i \\\\to \\\\mathbb{A}^n$ defined by\\n$$\\\\varphi_i([a_0 : \\\\dots :
        a_n]) = \\\\left(\\\\frac{a_0}{a_i}, \\\\dots, \\\\frac{a_{i-1}}{a_i}, \\\\frac{a_{i+1}}{a_i},
        \\\\dots, \\\\frac{a_n}{a_i}\\\\right)$$\\nis a homeomorphism with respect
        to the Zariski topologies.\\n3. For any projective variety $Y \\\\subseteq
        \\\\mathbb{P}^n$, $Y_i = Y \\\\cap U_i$ is either empty or isomorphic via
        $\\\\varphi_i$ to an affine variety in $\\\\mathbb{A}^n$, whose ideal is obtained
        from $I(Y)$ by dehomogenizing with respect to $x_i$ (setting $x_i = 1$).\\n\\n*Proof.*
        It is clear that $\\\\bigcup_{i=0}^n U_i = \\\\mathbb{P}^n$ and that $\\\\varphi_i$
        is a bijection with inverse $(b_1, \\\\dots, b_n) \\\\mapsto [b_1 : \\\\dots
        : b_i : 1 : b_{i+1} : \\\\dots : b_n]$. Let $A_i = k[y_1, \\\\dots, y_n]$
        be the coordinate ring of $\\\\mathbb{A}^n$, where $y_j = x_{j-1}/x_i$ for
        $j \\\\le i$ and $y_j = x_j/x_i$ for $j \\u003e i$. We define the *dehomogenization*
        map $\\\\alpha_i: S \\\\to A_i$ by substituting $x_i = 1$ and $x_j = y_j$
        (with the appropriate index shift). Conversely, for any polynomial $g \\\\in
        A_i$ of degree $d$, its *homogenization* is $g^\\\\ = x_i^d g(x_0/x_i, \\\\dots)
        \\\\in S_d$.\\n\\nFor any homogeneous polynomial $f \\\\in S_d$ and any point
        $P \\\\in U_i$, $f(P) = 0$ if and only if $\\\\alpha_i(f)(\\\\varphi_i(P))
        = 0$. Therefore, $\\\\varphi_i(Z_+(f) \\\\cap U_i) = Z(\\\\alpha_i(f))$, and
        conversely $\\\\varphi_i^{-1}(Z(g)) = Z_+(g^\\\\) \\\\cap U_i$. Thus $\\\\varphi_i$
        is a homeomorphism, and (3) follows immediately. $\\\\blacksquare$\\n\\n**Definition
        1.4.6.** Let $Y \\\\subseteq \\\\mathbb{P}^n$ be a projective variety with
        homogeneous coordinate ring $S(Y) = S/I(Y)$. Let $U \\\\subseteq Y$ be an
        open subset. A function $f: U \\\\to k$ is *regular at $P \\\\in U$* if there
        exists an open neighborhood $V \\\\subseteq U$ of $P$ and homogeneous polynomials
        $g, h \\\\in S_d$ of the *same degree* $d$ such that $h(Q) \\\\ne 0$ for all
        $Q \\\\in V$ and $f(Q) = g(Q)/h(Q)$ for all $Q \\\\in V$. (Because $g$ and
        $h$ have the same degree $d$, the ratio $g(Q)/h(Q)$ is invariant under rescaling
        the homogeneous coordinates of $Q$, hence defines a well-defined function
        into $k$). We denote by $\\\\mathcal{O}(U)$ the ring of regular functions
        on $U$.\\n\\nThe *function field* $K(Y)$ of $Y$ is the subring of the fraction
        field of $S(Y)$ consisting of ratios $g/h$ where $g, h \\\\in S(Y)$ are homogeneous
        of the same degree and $h \\\\ne 0$. The local ring $\\\\mathcal{O}_{P,Y}$
        at $P \\\\in Y$ is the subring of $K(Y)$ of elements expressible as $g/h$
        with $h(P) \\\\ne 0$. Note that if $P \\\\in Y_i = Y \\\\cap U_i$, then $K(Y)
        \\\\cong K(Y_i)$ and $\\\\mathcal{O}_{P,Y} \\\\cong \\\\mathcal{O}_{P, Y_i}$.\\n\\n###
        1.5 Dimension Theory of Varieties\\n\\n**Definition 1.5.1.** Let $X$ be a
        topological space. The *dimension* of $X$, denoted $\\\\dim X$, is the supremum
        of all integers $n \\\\ge 0$ such that there exists a strictly increasing
        chain of irreducible closed subsets of $X$:\\n$$\\\\emptyset \\\\subsetneq
        Z_0 \\\\subsetneq Z_1 \\\\subsetneq \\\\dots \\\\subsetneq Z_n \\\\subseteq
        X.$$\\nIf $A$ is a commutative ring, the *Krull dimension* of $A$, denoted
        $\\\\dim A$, is the supremum of the lengths $n$ of chains of prime ideals
        $\\\\mathfrak{p}_0 \\\\subsetneq \\\\mathfrak{p}_1 \\\\subsetneq \\\\dots
        \\\\subsetneq \\\\mathfrak{p}_n$ in $A$. By Corollary 1.2.6, if $Y$ is an
        affine algebraic set, $\\\\dim Y = \\\\dim A(Y)$.\\n\\nTo connect the topological
        dimension of a variety $Y$ to the transcendence degree of its function field
        $K(Y)$ over $k$, we prove Emmy Noether's Normalization Lemma.\\n\\n**Theorem
        1.5.2 (Noether Normalization Lemma).** Let $k$ be a field (not necessarily
        algebraically closed) and let $A = k[x_1, \\\\dots, x_n]$ be a finitely generated
        $k$-algebra. Then there exist elements $y_1, \\\\dots, y_d \\\\in A$ that
        are algebraically independent over $k$ such that $A$ is an integral extension
        of the polynomial subring $k[y_1, \\\\dots, y_d]$ (and hence a finitely generated
        $k[y_1, \\\\dots, y_d]$-module).\\n\\n*Proof.* We proceed by induction on
        $n$. If $x_1, \\\\dots, x_n$ are algebraically independent over $k$, we simply
        take $d = n$ and $y_i = x_i$. Otherwise, there exists a non-zero polynomial
        $F \\\\in k[T_1, \\\\dots, T_n]$ such that $F(x_1, \\\\dots, x_n) = 0$. We
        want to make a change of variables so that this equation becomes monic in
        $x_n$.\\n\\nLet $r \\\\ge 1$ be an integer to be chosen sufficiently large,
        and define new elements $x_1', \\\\dots, x_{n-1}' \\\\in A$ by\\n$$x_i' =
        x_i - x_n^{r^i} \\\\quad \\\\text{for } 1 \\\\le i \\\\le n-1.$$\\nSubstituting
        $x_i = x_i' + x_n^{r^i}$ into $F(x_1, \\\\dots, x_n) = 0$, we obtain\\n$$F\\\\left(x_1'
        + x_n^r, \\\\, x_2' + x_n^{r^2}, \\\\, \\\\dots, \\\\, x_{n-1}' + x_n^{r^{n-1}},
        \\\\, x_n\\\\right) = 0.$$\\nLet $F = \\\\sum_{\\\\alpha} c_\\\\alpha T_1^{\\\\alpha_1}
        \\\\cdots T_n^{\\\\alpha_n}$ where $c_\\\\alpha \\\\in k^\\\\times$. Expanding
        each monomial $(x_1' + x_n^r)^{\\\\alpha_1} \\\\cdots (x_{n-1}' + x_n^{r^{n-1}})^{\\\\alpha_{n-1}}
        x_n^{\\\\alpha_n}$, we obtain a highest pure power of $x_n$ equal to\\n$$c_\\\\alpha
        x_n^{e(\\\\alpha)}, \\\\quad \\\\text{where } e(\\\\alpha) = \\\\alpha_1 r
        + \\\\alpha_2 r^2 + \\\\dots + \\\\alpha_{n-1} r^{n-1} + \\\\alpha_n.$$\\nChoose
        $r$ strictly greater than the degree of $F$ in any variable, so $\\\\alpha_i
        \\u003c r$ for all $i$ and all $\\\\alpha$ appearing in $F$. By the uniqueness
        of base-$r$ representations of integers, the exponents $e(\\\\alpha)$ are
        all distinct for distinct multi-indices $\\\\alpha = (\\\\alpha_1, \\\\dots,
        \\\\alpha_n)$!\\n\\nConsequently, there is a unique multi-index $\\\\alpha^*$
        appearing in $F$ for which $e(\\\\alpha^*)$ is maximum, and no cancellation
        can occur among the pure $x_n$-terms of highest degree. Dividing the expanded
        polynomial by $c_{\\\\alpha^*} \\\\in k^\\\\times$, we obtain an equation
        of the form\\n$$x_n^{e(\\\\alpha^*)} + g_1(x_1', \\\\dots, x_{n-1}') x_n^{e(\\\\alpha^*)
        - 1} + \\\\dots + g_{e(\\\\alpha^*)}(x_1', \\\\dots, x_{n-1}') = 0.$$\\nThis
        proves that $x_n$ is integral over the subring $A' = k[x_1', \\\\dots, x_{n-1}']$.
        Since $x_i = x_i' + x_n^{r^i}$, each $x_i$ is also in $A'[x_n]$, so $A = A'[x_n]$
        is integral over $A'$. By the induction hypothesis applied to $A'$, there
        exist algebraically independent elements $y_1, \\\\dots, y_d \\\\in A'$ such
        that $A'$ is integral over $k[y_1, \\\\dots, y_d]$. By the transitivity of
        integral extensions, $A$ is integral over $k[y_1, \\\\dots, y_d]$. $\\\\blacksquare$\\n\\nTo
        connect integral extensions with chains of prime ideals, we establish the
        Going-Up and Going-Down theorems of Cohen and Seidenberg.\\n\\n**Proposition
        1.5.3 (Going-Up Theorem).** Let $R \\\\subseteq B$ be an integral extension
        of rings.\\n1. If $\\\\mathfrak{q} \\\\subseteq B$ is a prime ideal and $\\\\mathfrak{p}
        = \\\\mathfrak{q} \\\\cap R$, then $\\\\mathfrak{q}$ is maximal in $B$ if
        and only if $\\\\mathfrak{p}$ is maximal in $R$.\\n2. (Incomparability) If
        $\\\\mathfrak{q}_1 \\\\subseteq \\\\mathfrak{q}_2$ are prime ideals of $B$
        such that $\\\\mathfrak{q}_1 \\\\cap R = \\\\mathfrak{q}_2 \\\\cap R$, then
        $\\\\mathfrak{q}_1 = \\\\mathfrak{q}_2$.\\n3. (Lying-Over) For any prime ideal
        $\\\\mathfrak{p} \\\\subseteq R$, there exists a prime ideal $\\\\mathfrak{q}
        \\\\subseteq B$ such that $\\\\mathfrak{q} \\\\cap R = \\\\mathfrak{p}$.\\n4.
        (Going-Up) Given a chain of prime ideals $\\\\mathfrak{p}_1 \\\\subseteq \\\\dots
        \\\\subseteq \\\\mathfrak{p}_m$ in $R$ and a chain $\\\\mathfrak{q}_1 \\\\subseteq
        \\\\dots \\\\subseteq \\\\mathfrak{q}_r$ ($r \\u003c m$) in $B$ with $\\\\mathfrak{q}_i
        \\\\cap R = \\\\mathfrak{p}_i$, the chain in $B$ can be extended to $\\\\mathfrak{q}_1
        \\\\subseteq \\\\dots \\\\subseteq \\\\mathfrak{q}_m$ with $\\\\mathfrak{q}_i
        \\\\cap R = \\\\mathfrak{p}_i$ for all $i$.\\n\\n*Proof.* (1) Passing to the
        quotient $R/\\\\mathfrak{p} \\\\hookrightarrow B/\\\\mathfrak{q}$, we have
        an integral extension of integral domains. If $R/\\\\mathfrak{p}$ is a field,
        let $0 \\\\ne b \\\\in B/\\\\mathfrak{q}$. Then $b$ satisfies a monic equation
        $b^n + a_{n-1}b^{n-1} + \\\\dots + a_0 = 0$ of minimal degree over $R/\\\\mathfrak{p}$,
        so $a_0 \\\\ne 0$. Then $b(-a_0^{-1}(b^{n-1} + \\\\dots + a_1)) = 1$, so $B/\\\\mathfrak{q}$
        is a field. Conversely, if $B/\\\\mathfrak{q}$ is a field and $0 \\\\ne a
        \\\\in R/\\\\mathfrak{p}$, then $a^{-1} \\\\in B/\\\\mathfrak{q}$ is integral
        over $R/\\\\mathfrak{p}$: $a^{-m} + c_{m-1}a^{-(m-1)} + \\\\dots + c_0 = 0$.
        Multiplying by $a^{m-1}$ shows $a^{-1} = -(c_{m-1} + c_{m-2}a + \\\\dots +
        c_0 a^{m-1}) \\\\in R/\\\\mathfrak{p}$.\\n\\n(2) Localizing at $S = R \\\\setminus
        \\\\mathfrak{p}$ (where $\\\\mathfrak{p} = \\\\mathfrak{q}_1 \\\\cap R = \\\\mathfrak{q}_2
        \\\\cap R$), the extension $R_\\\\mathfrak{p} \\\\subseteq B_S$ remains integral,
        and $\\\\mathfrak{p}R_\\\\mathfrak{p}$ is maximal. By (1), both $\\\\mathfrak{q}_1
        B_S$ and $\\\\mathfrak{q}_2 B_S$ must be maximal ideals of $B_S$. Since $\\\\mathfrak{q}_1
        B_S \\\\subseteq \\\\mathfrak{q}_2 B_S$, they are equal, and contracting back
        to $B$ gives $\\\\mathfrak{q}_1 = \\\\mathfrak{q}_2$.\\n\\n(3) Localizing
        at $S = R \\\\setminus \\\\mathfrak{p}$, let $\\\\mathfrak{m}$ be any maximal
        ideal of $B_S$. By (1), $\\\\mathfrak{m} \\\\cap R_\\\\mathfrak{p}$ is maximal
        in the local ring $R_\\\\mathfrak{p}$, hence equals $\\\\mathfrak{p}R_\\\\mathfrak{p}$.
        Contracting $\\\\mathfrak{m}$ to $B$ yields a prime $\\\\mathfrak{q} \\\\subseteq
        B$ with $\\\\mathfrak{q} \\\\cap R = \\\\mathfrak{p}$.\\n\\n(4) Follows by
        induction from (3) applied to the integral extension $R/\\\\mathfrak{p}_r
        \\\\subseteq B/\\\\mathfrak{q}_r$. $\\\\blacksquare$\\n\\n**Theorem 1.5.4.**
        Let $Y$ be an affine variety over $k$. Then the dimension of $Y$ is equal
        to the transcendence degree of its function field $K(Y)$ over $k$:\\n$$\\\\dim
        Y = \\\\dim A(Y) = \\\\operatorname{tr.deg}_k K(Y).$$\\n\\n*Proof.* First,
        we show $\\\\dim A(Y) \\\\le \\\\operatorname{tr.deg}_k K(Y)$. Suppose $(0)
        = \\\\mathfrak{p}_0 \\\\subsetneq \\\\mathfrak{p}_1 \\\\subsetneq \\\\dots
        \\\\subsetneq \\\\mathfrak{p}_m$ is a chain of prime ideals in $A = A(Y)$.
        By passing to $A/\\\\mathfrak{p}_1$, we obtain a finitely generated domain
        over $k$ of Krull dimension at least $m-1$. Note that by Noether Normalization,
        $A$ is integral over a polynomial ring $R = k[y_1, \\\\dots, y_d]$, where
        $d = \\\\operatorname{tr.deg}_k K(Y)$. By Incomparability (Proposition 1.5.3(2)),
        the contractions $\\\\mathfrak{p}_i \\\\cap R$ form a strictly increasing
        chain of primes in $R$, and $\\\\mathfrak{p}_1 \\\\cap R \\\\ne (0)$. Any
        non-zero element $f \\\\in \\\\mathfrak{p}_1 \\\\cap R$ is an algebraic relation
        among the reductions $\\\\bar{y}_1, \\\\dots, \\\\bar{y}_d$ in $R/(\\\\mathfrak{p}_1
        \\\\cap R)$. Thus $\\\\operatorname{tr.deg}_k \\\\operatorname{Frac}(R/(\\\\mathfrak{p}_1
        \\\\cap R)) \\\\le d - 1$. Since $A/\\\\mathfrak{p}_1$ is integral over $R/(\\\\mathfrak{p}_1
        \\\\cap R)$, its fraction field is algebraic over $\\\\operatorname{Frac}(R/(\\\\mathfrak{p}_1
        \\\\cap R))$, so $\\\\operatorname{tr.deg}_k \\\\operatorname{Frac}(A/\\\\mathfrak{p}_1)
        \\\\le d - 1$. By induction on $d$, it follows immediately that $m \\\\le
        d$.\\n\\nTo show equality $\\\\dim A(Y) = d$, we construct a chain of primes
        of length $d$. By Noether Normalization, $A$ is integral over $R = k[y_1,
        \\\\dots, y_d]$. In $R$, we have the explicit chain of prime ideals of length
        $d$:\\n$$(0) \\\\subsetneq (y_1) \\\\subsetneq (y_1, y_2) \\\\subsetneq \\\\dots
        \\\\subsetneq (y_1, \\\\dots, y_d).$$\\nBy the Going-Up Theorem (Proposition
        1.5.3(4)), this chain lifts to a chain of prime ideals $(0) = \\\\mathfrak{q}_0
        \\\\subsetneq \\\\mathfrak{q}_1 \\\\subsetneq \\\\dots \\\\subsetneq \\\\mathfrak{q}_d$
        in $A$. Thus $\\\\dim A(Y) \\\\ge d$, completing the proof. $\\\\blacksquare$\\n\\n**Corollary
        1.5.5.** Let $Y$ be a quasi-projective variety and let $U \\\\subseteq Y$
        be a non-empty open subset. Then $\\\\dim U = \\\\dim Y = \\\\operatorname{tr.deg}_k
        K(Y)$. In particular, $\\\\dim \\\\mathbb{A}^n = \\\\dim \\\\mathbb{P}^n =
        n$.\\n\\n*Proof.* Every non-empty open subset of $Y$ contains a principal
        affine open subset $V$, and any chain of irreducible closed subsets in $V$
        has closures forming a strictly increasing chain of irreducible closed subsets
        in $Y$. Conversely, given a chain of maximum length in $Y$, its minimal element
        is a single point $P \\\\in Y$; choosing an affine open neighborhood $V \\\\subseteq
        U$ (if we work locally at $P$, or noting that all maximal ideals of $A(V)$
        have the same height $d$ by iterating the refined Noether Normalization where
        $\\\\mathfrak{p}_1$ is a principal prime), we see that $\\\\dim U = \\\\dim
        V = \\\\operatorname{tr.deg}_k K(V) = \\\\operatorname{tr.deg}_k K(Y) = \\\\dim
        Y$. $\\\\blacksquare$\\n\\n**Theorem 1.5.6 (Krull's Principal Ideal Theorem
        / Hauptidealsatz).** Let $A$ be a Noetherian ring and let $f \\\\in A$ be
        an element that is neither a unit nor a zero-divisor. Let $\\\\mathfrak{p}$
        be a minimal prime ideal containing $(f)$. Then $\\\\operatorname{ht}(\\\\mathfrak{p})
        = 1$. Consequently, if $Y \\\\subseteq \\\\mathbb{A}^n$ is an affine variety
        and $f \\\\in A(Y)$ is a non-zero non-unit, then every irreducible component
        of $Z(f) \\\\subseteq Y$ has dimension $\\\\dim Y - 1$. Conversely, any affine
        variety $Y \\\\subseteq \\\\mathbb{A}^n$ of dimension $n-1$ is the zero locus
        $Z(f)$ of a single irreducible polynomial $f \\\\in k[x_1, \\\\dots, x_n]$.\\n\\n*Proof.*
        By localizing $A$ at $\\\\mathfrak{p}$, we may assume $A$ is a local Noetherian
        ring with unique maximal ideal $\\\\mathfrak{p}$, and $\\\\mathfrak{p}$ is
        the sole prime ideal containing $(f)$. Thus $A/(f)$ is a Noetherian ring with
        a single prime ideal $\\\\mathfrak{p}/(f)$, which means $A/(f)$ is an Artinian
        ring.\\n\\nSuppose $\\\\mathfrak{q} \\\\subsetneq \\\\mathfrak{p}$ is a prime
        ideal of $A$; we must show $\\\\operatorname{ht}(\\\\mathfrak{q}) = 0$. Consider
        the descending chain of symbolic powers of $\\\\mathfrak{q}$: for each integer
        $m \\\\ge 1$, let $\\\\mathfrak{q}^{(m)} = \\\\{a \\\\in A \\\\mid sa \\\\in
        \\\\mathfrak{q}^m \\\\text{ for some } s \\\\in A \\\\setminus \\\\mathfrak{q}\\\\}$
        be the contraction of $\\\\mathfrak{q}^m A_\\\\mathfrak{q}$ to $A$. Since
        $A/(f)$ is Artinian, the descending chain of ideals $\\\\frac{\\\\mathfrak{q}^{(m)}
        + (f)}{(f)}$ stabilizes: there exists $m$ such that\\n$$\\\\mathfrak{q}^{(m)}
        \\\\subseteq \\\\mathfrak{q}^{(m+1)} + (f).$$\\nThus for any $x \\\\in \\\\mathfrak{q}^{(m)}$,
        we can write $x = y + af$ with $y \\\\in \\\\mathfrak{q}^{(m+1)}$ and $a \\\\in
        A$. Then $af = x - y \\\\in \\\\mathfrak{q}^{(m)}$. Since $\\\\mathfrak{p}$
        is the minimal prime over $f$ and $\\\\mathfrak{q} \\\\subsetneq \\\\mathfrak{p}$,
        we have $f \\\\notin \\\\mathfrak{q}$. By definition of $\\\\mathfrak{q}^{(m)}$,
        there exists $s \\\\notin \\\\mathfrak{q}$ such that $s(af) \\\\in \\\\mathfrak{q}^m$.
        Since $sf \\\\notin \\\\mathfrak{q}$, this implies $a \\\\in \\\\mathfrak{q}^{(m)}$.
        Therefore,\\n$$\\\\mathfrak{q}^{(m)} = \\\\mathfrak{q}^{(m+1)} + f \\\\mathfrak{q}^{(m)}.$$\\nSince
        $f \\\\in \\\\mathfrak{p}$ (the maximal ideal of the local ring $A$), Nakayama's
        Lemma applied to the finitely generated $A$-module $\\\\mathfrak{q}^{(m)}
        / \\\\mathfrak{q}^{(m+1)}$ implies $\\\\mathfrak{q}^{(m)} = \\\\mathfrak{q}^{(m+1)}$.
        Localizing at $\\\\mathfrak{q}$, we obtain $\\\\mathfrak{q}^m A_\\\\mathfrak{q}
        = \\\\mathfrak{q}^{m+1} A_\\\\mathfrak{q}$. Applying Nakayama's Lemma again
        in the local ring $A_\\\\mathfrak{q}$ gives $\\\\mathfrak{q}^m A_\\\\mathfrak{q}
        = 0$. Thus every element of $\\\\mathfrak{q} A_\\\\mathfrak{q}$ is nilpotent,
        meaning $\\\\mathfrak{q} A_\\\\mathfrak{q}$ is the unique prime ideal of $A_\\\\mathfrak{q}$.
        Hence $\\\\operatorname{ht}(\\\\mathfrak{q}) = 0$, proving $\\\\operatorname{ht}(\\\\mathfrak{p})
        = 1$.\\n\\nFor the converse statement in $\\\\mathbb{A}^n$, if $Y \\\\subseteq
        \\\\mathbb{A}^n$ has dimension $n-1$, then $\\\\mathfrak{p} = I(Y)$ is a prime
        ideal of $k[x_1, \\\\dots, x_n]$ of height $1$. Since $k[x_1, \\\\dots, x_n]$
        is a unique factorization domain (UFD), every height 1 prime ideal is principal:
        let $0 \\\\ne g \\\\in \\\\mathfrak{p}$, let $f$ be an irreducible factor
        of $g$ in $\\\\mathfrak{p}$ (which exists since $\\\\mathfrak{p}$ is prime),
        so $(0) \\\\subsetneq (f) \\\\subseteq \\\\mathfrak{p}$. Since $f$ is irreducible
        in a UFD, $(f)$ is prime, and since $\\\\operatorname{ht}(\\\\mathfrak{p})
        = 1$, we must have $\\\\mathfrak{p} = (f)$. $\\\\blacksquare$\\n\\n---\\n\\n###
        Exercises for Chapter 1\\n\\n**Exercise 1.1.** Let $Y \\\\subseteq \\\\mathbb{A}^3_k$
        be the *twisted cubic curve*, defined as the image of the map $\\\\varphi:
        \\\\mathbb{A}^1_k \\\\to \\\\mathbb{A}^3_k$ given by $t \\\\mapsto (t, t^2,
        t^3)$.\\n(a) Prove that $Y$ is an affine variety of dimension 1, and show
        that $I(Y) = (y - x^2, z - x^3) \\\\subseteq k[x, y, z]$.\\n(b) Prove that
        $A(Y) \\\\cong k[t]$.\\n(c) Let $f_1 = y - x^2$ and $f_2 = xz - y^2$. Show
        that $Z(f_1, f_2) = Y \\\\cup L$, where $L$ is the line $x = y = 0$. Conclude
        that $Y$ can be defined set-theoretically by two polynomials in some open
        subsets, and investigate whether $I(Y)$ can be generated by two elements.\\n\\n**Exercise
        1.2.** Let $k$ be an algebraically closed field of characteristic $p \\u003e
        0$. Consider the *Frobenius morphism* $F: \\\\mathbb{A}^1_k \\\\to \\\\mathbb{A}^1_k$
        defined by $x \\\\mapsto x^p$. Prove that $F$ is a bijective morphism of affine
        varieties and a homeomorphism in the Zariski topology, but that $F$ is *not*
        an isomorphism of varieties.\\n\\n**Exercise 1.3 (The Segre Embedding).**
        Define the Segre map $\\\\sigma: \\\\mathbb{P}^r_k \\\\times \\\\mathbb{P}^s_k
        \\\\to \\\\mathbb{P}^{rs + r + s}_k$ by sending the pair $([a_0 : \\\\dots
        : a_r], [b_0 : \\\\dots : b_s])$ to the point with homogeneous coordinates
        $[a_i b_j]_{0 \\\\le i \\\\le r, \\\\, 0 \\\\le j \\\\le s}$ (ordered lexicographically).\\n(a)
        Prove that $\\\\sigma$ is well-defined and injective.\\n(b) Let $z_{ij}$ be
        the homogeneous coordinates on $\\\\mathbb{P}^N$ ($N = rs + r + s$). Prove
        that the image of $\\\\sigma$ is the projective algebraic set defined by the
        $2 \\\\times 2$ minors $z_{ij} z_{kl} - z_{il} z_{kj} = 0$.\\n(c) Prove that
        the image of $\\\\sigma$ is irreducible of dimension $r + s$, endowing $\\\\mathbb{P}^r
        \\\\times \\\\mathbb{P}^s$ with the structure of a projective variety. Show
        that the induced Zariski topology on $\\\\mathbb{P}^1 \\\\times \\\\mathbb{P}^1$
        is strictly finer than the product topology.\\n\\n**Exercise 1.4 (The Veronese
        Embedding).** For integers $n, d \\\\ge 1$, let $M_0, M_1, \\\\dots, M_N \\\\in
        k[x_0, \\\\dots, x_n]$ be all the distinct monic monomials of degree $d$,
        where $N = \\\\binom{n+d}{n} - 1$. The *d-uple Veronese map* is $\\\\nu_d:
        \\\\mathbb{P}^n \\\\to \\\\mathbb{P}^N$ defined by $\\\\nu_d(P) = [M_0(P)
        : M_1(P) : \\\\dots : M_N(P)]$.\\n(a) Prove that $\\\\nu_d$ is an isomorphism
        of $\\\\mathbb{P}^n$ onto a closed projective subvariety $V_{n,d} \\\\subseteq
        \\\\mathbb{P}^N$.\\n(b) Show that any hypersurface $Z_+(f) \\\\subseteq \\\\mathbb{P}^n$
        of degree $d$ is the preimage under $\\\\nu_d$ of the intersection of $V_{n,d}$
        with a hyperplane in $\\\\mathbb{P}^N$.\\n\\n**Exercise 1.5.** Let $Y \\\\subseteq
        \\\\mathbb{A}^2_k$ be the cuspidal cubic curve $Z(y^2 - x^3)$ (assume $\\\\operatorname{char}
        k \\\\ne 2$).\\n(a) Show that the map $\\\\varphi: \\\\mathbb{A}^1_k \\\\to
        Y$ given by $t \\\\mapsto (t^2, t^3)$ is a bijective morphism and a homeomorphism,
        but not an isomorphism.\\n(b) Show that the coordinate ring $A(Y) \\\\cong
        k[t^2, t^3] \\\\subseteq k[t]$ is not integrally closed in its field of fractions
        $k(t)$, and deduce that the local ring $\\\\mathcal{O}_{P,Y}$ at the origin
        $P = (0,0)$ is not a regular local ring (its maximal ideal $\\\\mathfrak{m}_P$
        satisfies $\\\\dim_k(\\\\mathfrak{m}_P / \\\\mathfrak{m}_P^2) = 2 \\u003e
        \\\\dim Y$).\\n\\n---\\n\\n## CHAPTER 2: SHEAVES AND RINGED SPACES\\n\\nTo
        study geometric objects without relying on a fixed ambient embedding into
        $\\\\mathbb{A}^n$ or $\\\\mathbb{P}^n$, we need a systematic framework for
        tracking locally defined functions and algebraic structures. This is the theory
        of sheaves and locally ringed spaces.\\n\\n### 2.1 Presheaves and Sheaves\\n\\n**Definition
        2.1.1.** Let $X$ be a topological space, and let $\\\\mathfrak{C}$ be a category
        (typically the category $\\\\mathfrak{Sets}$ of sets, $\\\\mathfrak{Ab}$ of
        abelian groups, or $\\\\mathfrak{Rings}$ of commutative rings). A *presheaf*
        $\\\\mathcal{F}$ on $X$ with values in $\\\\mathfrak{C}$ consists of:\\n1.
        For every open subset $U \\\\subseteq X$, an object $\\\\mathcal{F}(U) \\\\in
        \\\\operatorname{Ob}(\\\\mathfrak{C})$ (whose elements, when $\\\\mathfrak{C}$
        is a concrete category, are called the *sections of $\\\\mathcal{F}$ over
        $U$*, often also denoted $\\\\Gamma(U, \\\\mathcal{F})$),\\n2. For every inclusion
        of open subsets $V \\\\subseteq U$, a morphism $\\\\rho_{UV}: \\\\mathcal{F}(U)
        \\\\to \\\\mathcal{F}(V)$ in $\\\\mathfrak{C}$ (called the *restriction map*;
        for $s \\\\in \\\\mathcal{F}(U)$, we often write $s|_V$ for $\\\\rho_{UV}(s)$),\\n\\nsatisfying
        the following two functoriality axioms:\\n* $\\\\mathcal{F}(\\\\emptyset)$
        is a terminal object in $\\\\mathfrak{C}$ (e.g., a one-element set, the zero
        group, or the zero ring).\\n* For every open set $U \\\\subseteq X$, $\\\\rho_{UU}
        = \\\\operatorname{id}_{\\\\mathcal{F}(U)}$.\\n* For every chain of open inclusions
        $W \\\\subseteq V \\\\subseteq U$, $\\\\rho_{UW} = \\\\rho_{VW} \\\\circ \\\\rho_{UV}$.\\n\\nEquivalently,
        let $\\\\operatorname{Open}(X)$ be the category whose objects are open subsets
        of $X$ and whose morphisms are inclusions $V \\\\hookrightarrow U$. A presheaf
        on $X$ with values in $\\\\mathfrak{C}$ is simply a contravariant functor
        $\\\\mathcal{F}: \\\\operatorname{Open}(X)^{\\\\text{op}} \\\\to \\\\mathfrak{C}$.\\n\\n**Definition
        2.1.2.** A presheaf $\\\\mathcal{F}$ of sets (or abelian groups, rings, modules)
        on a topological space $X$ is a *sheaf* if it satisfies the following two
        local-to-global axioms for every open subset $U \\\\subseteq X$ and every
        open covering $U = \\\\bigcup_{i \\\\in I} U_i$:\\n1. **(Locality / Identity
        Axiom)** If $s, t \\\\in \\\\mathcal{F}(U)$ are two sections such that $s|_{U_i}
        = t|_{U_i}$ for all $i \\\\in I$, then $s = t$.\\n2. **(Gluing Axiom)** If
        we are given a family of sections $s_i \\\\in \\\\mathcal{F}(U_i)$ for each
        $i \\\\in I$ such that for all $i, j \\\\in I$, their restrictions to the
        overlap agree:\\n$$s_i|_{U_i \\\\cap U_j} = s_j|_{U_i \\\\cap U_j} \\\\in
        \\\\mathcal{F}(U_i \\\\cap U_j),$$\\nthen there exists a section $s \\\\in
        \\\\mathcal{F}(U)$ such that $s|_{U_i} = s_i$ for all $i \\\\in I$. (By the
        Locality Axiom, this section $s$ is necessarily unique).\\n\\nNote that the
        condition $\\\\mathcal{F}(\\\\emptyset) = \\\\{0\\\\}$ follows directly from
        the Gluing and Locality axioms applied to the empty covering of $U = \\\\emptyset$.
        Furthermore, the sheaf axioms can be stated concisely by requiring that for
        every open cover $U = \\\\bigcup_{i \\\\in I} U_i$, the sequence\\n$$\\\\mathcal{F}(U)
        \\\\longrightarrow \\\\prod_{i \\\\in I} \\\\mathcal{F}(U_i) \\\\rightrightarrows
        \\\\prod_{(i,j) \\\\in I \\\\times I} \\\\mathcal{F}(U_i \\\\cap U_j)$$\\nis
        an equalizer diagram.\\n\\n**Definition 2.1.3.** Let $\\\\mathcal{F}$ be a
        presheaf on $X$, and let $P \\\\in X$ be a point. The *stalk* of $\\\\mathcal{F}$
        at $P$, denoted $\\\\mathcal{F}_P$, is the direct limit (colimit) of $\\\\mathcal{F}(U)$
        over all open neighborhoods $U$ of $P$, ordered by reverse inclusion:\\n$$\\\\mathcal{F}_P
        = \\\\varinjlim_{P \\\\in U} \\\\mathcal{F}(U).$$\\nExplicitly, an element
        of $\\\\mathcal{F}_P$ is an equivalence class of pairs $(U, s)$ where $U$
        is an open neighborhood of $P$ and $s \\\\in \\\\mathcal{F}(U)$, under the
        equivalence relation $(U, s) \\\\sim (V, t)$ if and only if there exists an
        open neighborhood $W \\\\subseteq U \\\\cap V$ of $P$ such that $s|_W = t|_W$.
        The equivalence class of $(U, s)$ in $\\\\mathcal{F}_P$ is denoted $s_P$ and
        called the *germ of $s$ at $P$*.\\n\\n**Definition 2.1.4.** If $\\\\mathcal{F}$
        and $\\\\mathcal{G}$ are presheaves (or sheaves) on $X$, a *morphism* $\\\\varphi:
        \\\\mathcal{F} \\\\to \\\\mathcal{G}$ is a natural transformation of functors;
        that is, a collection of morphisms $\\\\varphi(U): \\\\mathcal{F}(U) \\\\to
        \\\\mathcal{G}(U)$ for each open $U \\\\subseteq X$ such that for every inclusion
        $V \\\\subseteq U$, the diagram\\n$$\\\\begin{matrix} \\\\mathcal{F}(U) &
        \\\\xrightarrow{\\\\varphi(U)} & \\\\mathcal{G}(U) \\\\\\\\ \\\\downarrow{\\\\rho_{UV}^{\\\\mathcal{F}}}
        & & \\\\downarrow{\\\\rho_{UV}^{\\\\mathcal{G}}} \\\\\\\\ \\\\mathcal{F}(V)
        & \\\\xrightarrow{\\\\varphi(V)} & \\\\mathcal{G}(V) \\\\end{matrix}$$\\ncommutes.
        A morphism $\\\\varphi: \\\\mathcal{F} \\\\to \\\\mathcal{G}$ induces for
        every point $P \\\\in X$ a canonical morphism on stalks $\\\\varphi_P: \\\\mathcal{F}_P
        \\\\to \\\\mathcal{G}_P$, given by $\\\\varphi_P([(U, s)]) = [(U, \\\\varphi(U)(s))]$.
        An *isomorphism* is a morphism that admits a two-sided inverse.\\n\\n**Proposition
        2.1.5.** Let $\\\\varphi: \\\\mathcal{F} \\\\to \\\\mathcal{G}$ be a morphism
        of sheaves on a topological space $X$. Then $\\\\varphi$ is an isomorphism
        if and only if the induced map on stalks $\\\\varphi_P: \\\\mathcal{F}_P \\\\to
        \\\\mathcal{G}_P$ is an isomorphism for every point $P \\\\in X$.\\n\\n*Proof.*
        Necessity is obvious by functoriality of direct limits. Conversely, suppose
        $\\\\varphi_P: \\\\mathcal{F}_P \\\\to \\\\mathcal{G}_P$ is bijective for
        all $P \\\\in X$. We must show that for every open $U \\\\subseteq X$, $\\\\varphi(U):
        \\\\mathcal{F}(U) \\\\to \\\\mathcal{G}(U)$ is bijective.\\n\\n*Injectivity
        of $\\\\varphi(U)$:* Let $s, t \\\\in \\\\mathcal{F}(U)$ be such that $\\\\varphi(U)(s)
        = \\\\varphi(U)(t)$. Then for every $P \\\\in U$, their germs satisfy $\\\\varphi_P(s_P)
        = (\\\\varphi(U)(s))_P = (\\\\varphi(U)(t))_P = \\\\varphi_P(t_P)$. Since
        $\\\\varphi_P$ is injective, $s_P = t_P$ in $\\\\mathcal{F}_P$. By definition
        of the stalk, for each $P \\\\in U$ there exists an open neighborhood $V_P
        \\\\subseteq U$ of $P$ such that $s|_{V_P} = t|_{V_P}$. Since $U = \\\\bigcup_{P
        \\\\in U} V_P$ is an open cover of $U$, the Locality Axiom for the sheaf $\\\\mathcal{F}$
        implies $s = t$.\\n\\n*Surjectivity of $\\\\varphi(U)$:* Let $t \\\\in \\\\mathcal{G}(U)$.
        For each $P \\\\in U$, consider the germ $t_P \\\\in \\\\mathcal{G}_P$. Since
        $\\\\varphi_P$ is surjective, there exists a germ in $\\\\mathcal{F}_P$ mapping
        to $t_P$, represented by some section $s^{(P)} \\\\in \\\\mathcal{F}(W_P)$
        on an open neighborhood $W_P \\\\subseteq U$ of $P$. Then $(\\\\varphi(W_P)(s^{(P)}))_P
        = t_P$ in $\\\\mathcal{G}_P$, so after shrinking $W_P$ to a smaller open neighborhood
        $V_P \\\\subseteq W_P$ of $P$, we have\\n$$\\\\varphi(V_P)(s^{(P)}|_{V_P})
        = t|_{V_P} \\\\quad \\\\text{in } \\\\mathcal{G}(V_P).$$\\nWrite $s_P = s^{(P)}|_{V_P}
        \\\\in \\\\mathcal{F}(V_P)$. Now, for any two points $P, Q \\\\in U$, consider
        the restrictions $s_P|_{V_P \\\\cap V_Q}$ and $s_Q|_{V_P \\\\cap V_Q}$ in
        $\\\\mathcal{F}(V_P \\\\cap V_Q)$. Applying $\\\\varphi(V_P \\\\cap V_Q)$
        to both sections yields\\n$$\\\\varphi(V_P \\\\cap V_Q)(s_P|_{V_P \\\\cap
        V_Q}) = (\\\\varphi(V_P)(s_P))|_{V_P \\\\cap V_Q} = t|_{V_P \\\\cap V_Q} =
        \\\\varphi(V_P \\\\cap V_Q)(s_Q|_{V_P \\\\cap V_Q}).$$\\nSince we have already
        proved that $\\\\varphi(W)$ is injective for *every* open subset $W \\\\subseteq
        X$ (including $W = V_P \\\\cap V_Q$), it follows that\\n$$s_P|_{V_P \\\\cap
        V_Q} = s_Q|_{V_P \\\\cap V_Q}$$\\nfor all $P, Q \\\\in U$. By the Gluing Axiom
        for the sheaf $\\\\mathcal{F}$ applied to the open cover $U = \\\\bigcup_{P
        \\\\in U} V_P$, there exists a unique section $s \\\\in \\\\mathcal{F}(U)$
        such that $s|_{V_P} = s_P$ for all $P \\\\in U$. Then for every $P \\\\in
        U$,\\n$$(\\\\varphi(U)(s))|_{V_P} = \\\\varphi(V_P)(s|_{V_P}) = \\\\varphi(V_P)(s_P)
        = t|_{V_P}.$$\\nBy the Locality Axiom for the sheaf $\\\\mathcal{G}$, we conclude
        that $\\\\varphi(U)(s) = t$. Thus $\\\\varphi(U)$ is bijective for all $U$,
        and its collection of set-theoretic (or algebraic) inverses $\\\\varphi(U)^{-1}$
        automatically commutes with restriction maps, defining an inverse morphism
        $\\\\varphi^{-1}: \\\\mathcal{G} \\\\to \\\\mathcal{F}$. $\\\\blacksquare$\\n\\n###
        2.2 Sheafification\\n\\nMany natural constructions on sheaves (such as quotients,
        images, and tensor products) yield only presheaves. We now construct the *sheafification*
        functor, which canonically associates a sheaf to any presheaf.\\n\\n**Theorem
        2.2.1 (Existence and Universal Property of Sheafification).** Let $\\\\mathcal{F}$
        be a presheaf on a topological space $X$. There exists a sheaf $\\\\mathcal{F}^+$
        on $X$ and a morphism of presheaves $\\\\theta: \\\\mathcal{F} \\\\to \\\\mathcal{F}^+$
        such that for any sheaf $\\\\mathcal{G}$ on $X$ and any morphism of presheaves
        $\\\\varphi: \\\\mathcal{F} \\\\to \\\\mathcal{G}$, there exists a unique
        morphism of sheaves $\\\\tilde{\\\\varphi}: \\\\mathcal{F}^+ \\\\to \\\\mathcal{G}$
        making the following diagram commute:\\n$$\\\\begin{matrix} \\\\mathcal{F}
        & \\\\xrightarrow{\\\\theta} & \\\\mathcal{F}^+ \\\\\\\\ & \\\\searrow{\\\\varphi}
        & \\\\downarrow{\\\\tilde{\\\\varphi}} \\\\\\\\ & & \\\\mathcal{G} \\\\end{matrix}$$\\nFurthermore,
        the pair $(\\\\mathcal{F}^+, \\\\theta)$ is unique up to unique isomorphism,
        and for every point $P \\\\in X$, the induced map on stalks $\\\\theta_P:
        \\\\mathcal{F}_P \\\\to (\\\\mathcal{F}^+)_P$ is an isomorphism. The sheaf
        $\\\\mathcal{F}^+$ is called the *sheafification* of (or the *sheaf associated
        to*) the presheaf $\\\\mathcal{F}$.\\n\\n*Proof.* For any open subset $U \\\\subseteq
        X$, we define $\\\\mathcal{F}^+(U)$ to be the set of all functions $s: U \\\\to
        \\\\bigsqcup_{P \\\\in U} \\\\mathcal{F}_P$ satisfying the following two conditions:\\n1.
        For each $P \\\\in U$, $s(P) \\\\in \\\\mathcal{F}_P$.\\n2. For each $P \\\\in
        U$, there is an open neighborhood $V \\\\subseteq U$ of $P$ and a section
        $t \\\\in \\\\mathcal{F}(V)$ such that for all $Q \\\\in V$, $s(Q) = t_Q$
        (the germ of $t$ at $Q$).\\n\\nWith the obvious restriction of functions $\\\\mathcal{F}^+(U)
        \\\\to \\\\mathcal{F}^+(V)$ for $V \\\\subseteq U$ (and componentwise algebraic
        operations if $\\\\mathcal{F}$ takes values in $\\\\mathfrak{Ab}$ or $\\\\mathfrak{Rings}$),
        it is immediate that $\\\\mathcal{F}^+$ is a sheaf: because elements of $\\\\mathcal{F}^+(U)$
        are actual set-theoretic functions on $U$ defined by a purely local condition
        (condition 2), two functions agreeing on an open cover are equal on $U$, and
        compatible functions on an open cover glue uniquely to a function on $U$ that
        still satisfies condition 2 at every point.\\n\\nWe define the morphism $\\\\theta:
        \\\\mathcal{F} \\\\to \\\\mathcal{F}^+$ by sending a section $t \\\\in \\\\mathcal{F}(U)$
        to the function $\\\\theta(U)(t): P \\\\mapsto t_P$ for $P \\\\in U$. Clearly
        this function satisfies conditions (1) and (2) (taking $V = U$).\\n\\nNext,
        we verify that $\\\\theta_P: \\\\mathcal{F}_P \\\\to (\\\\mathcal{F}^+)_P$
        is an isomorphism for every $P \\\\in X$. There is a natural evaluation map
        $\\\\operatorname{ev}_P: (\\\\mathcal{F}^+)_P \\\\to \\\\mathcal{F}_P$ sending
        the germ of a function $s \\\\in \\\\mathcal{F}^+(U)$ at $P$ to its value
        $s(P) \\\\in \\\\mathcal{F}_P$. Clearly $\\\\operatorname{ev}_P \\\\circ \\\\theta_P
        = \\\\operatorname{id}_{\\\\mathcal{F}_P}$, so $\\\\theta_P$ is injective
        and $\\\\operatorname{ev}_P$ is surjective. Conversely, given any germ $[s]
        \\\\in (\\\\mathcal{F}^+)_P$ represented by $s \\\\in \\\\mathcal{F}^+(U)$,
        condition (2) guarantees the existence of an open neighborhood $V \\\\subseteq
        U$ of $P$ and $t \\\\in \\\\mathcal{F}(V)$ such that $s(Q) = t_Q = (\\\\theta(V)(t))(Q)$
        for all $Q \\\\in V$. Thus $s|_V = \\\\theta(V)(t)$ in $\\\\mathcal{F}^+(V)$,
        meaning $[s] = \\\\theta_P(t_P)$ in $(\\\\mathcal{F}^+)_P$. Hence $\\\\theta_P$
        is an isomorphism.\\n\\nNotice that if $\\\\mathcal{G}$ is already a sheaf,
        then $\\\\theta_{\\\\mathcal{G}}: \\\\mathcal{G} \\\\to \\\\mathcal{G}^+$
        is a morphism of sheaves inducing isomorphisms on all stalks, hence is an
        isomorphism of sheaves by Proposition 2.1.5. Now, let $\\\\varphi: \\\\mathcal{F}
        \\\\to \\\\mathcal{G}$ be any morphism from $\\\\mathcal{F}$ to a sheaf $\\\\mathcal{G}$.
        By functoriality of the $(-)^+$ construction (which simply applies the induced
        stalk maps $\\\\varphi_P: \\\\mathcal{F}_P \\\\to \\\\mathcal{G}_P$ pointwise
        to functions $s \\\\in \\\\mathcal{F}^+(U)$), we obtain a commutative square:\\n$$\\\\begin{matrix}
        \\\\mathcal{F} & \\\\xrightarrow{\\\\theta_{\\\\mathcal{F}}} & \\\\mathcal{F}^+
        \\\\\\\\ \\\\downarrow{\\\\varphi} & & \\\\downarrow{\\\\varphi^+} \\\\\\\\
        \\\\mathcal{G} & \\\\xrightarrow{\\\\theta_{\\\\mathcal{G}}} & \\\\mathcal{G}^+
        \\\\end{matrix}$$\\nSince $\\\\theta_{\\\\mathcal{G}}$ is an isomorphism,
        we define $\\\\tilde{\\\\varphi} = \\\\theta_{\\\\mathcal{G}}^{-1} \\\\circ
        \\\\varphi^+: \\\\mathcal{F}^+ \\\\to \\\\mathcal{G}$, which satisfies $\\\\tilde{\\\\varphi}
        \\\\circ \\\\theta_{\\\\mathcal{F}} = \\\\varphi$. To prove uniqueness of
        $\\\\tilde{\\\\varphi}$, suppose $\\\\psi: \\\\mathcal{F}^+ \\\\to \\\\mathcal{G}$
        also satisfies $\\\\psi \\\\circ \\\\theta_{\\\\mathcal{F}} = \\\\varphi$.
        Then for every $P \\\\in X$, $\\\\psi_P \\\\circ (\\\\theta_{\\\\mathcal{F}})_P
        = \\\\varphi_P = \\\\tilde{\\\\varphi}_P \\\\circ (\\\\theta_{\\\\mathcal{F}})_P$.
        Since $(\\\\theta_{\\\\mathcal{F}})_P$ is an isomorphism, $\\\\psi_P = \\\\tilde{\\\\varphi}_P$
        for all $P \\\\in X$. Since two morphisms of sheaves that agree on all stalks
        are equal (by local representation via sections, as in the proof of Proposition
        2.1.5), we have $\\\\psi = \\\\tilde{\\\\varphi}$. $\\\\blacksquare$\\n\\n###
        2.3 Operations on Sheaves\\n\\nThroughout this section, we consider sheaves
        of abelian groups on a topological space $X$, forming the category $\\\\mathfrak{Ab}(X)$.\\n\\n**Definition
        2.3.1.** Let $\\\\varphi: \\\\mathcal{F} \\\\to \\\\mathcal{G}$ be a morphism
        of sheaves of abelian groups on $X$.\\n1. The *presheaf kernel* of $\\\\varphi$
        is the presheaf $U \\\\mapsto \\\\ker(\\\\varphi(U): \\\\mathcal{F}(U) \\\\to
        \\\\mathcal{G}(U))$. One checks directly from the sheaf axioms that the presheaf
        kernel is already a sheaf! We denote it by $\\\\ker(\\\\varphi)$.\\n2. The
        *presheaf image* of $\\\\varphi$, given by $U \\\\mapsto \\\\operatorname{im}(\\\\varphi(U))$,
        is in general *not* a sheaf. We define the *sheaf image* of $\\\\varphi$,
        denoted $\\\\operatorname{im}(\\\\varphi)$, to be the sheafification of the
        presheaf image. By the universal property of sheafification, $\\\\operatorname{im}(\\\\varphi)$
        is naturally a subsheaf of $\\\\mathcal{G}$ (i.e., for every $U$, $\\\\operatorname{im}(\\\\varphi)(U)
        \\\\subseteq \\\\mathcal{G}(U)$ consists of sections $t \\\\in \\\\mathcal{G}(U)$
        that locally lie in the image of $\\\\varphi$).\\n3. The *cokernel* of $\\\\varphi$,
        denoted $\\\\operatorname{coker}(\\\\varphi)$, is the sheafification of the
        presheaf cokernel $U \\\\mapsto \\\\mathcal{G}(U) / \\\\operatorname{im}(\\\\varphi(U))$.
        If $\\\\mathcal{F} \\\\subseteq \\\\mathcal{G}$ is a subsheaf, the cokernel
        of the inclusion is the *quotient sheaf* $\\\\mathcal{G}/\\\\mathcal{F}$.\\n\\n**Proposition
        2.3.2.** Let $\\\\varphi: \\\\mathcal{F} \\\\to \\\\mathcal{G}$ be a morphism
        in $\\\\mathfrak{Ab}(X)$. Then for every point $P \\\\in X$:\\n$$(\\\\ker
        \\\\varphi)_P = \\\\ker(\\\\varphi_P), \\\\quad (\\\\operatorname{im} \\\\varphi)_P
        = \\\\operatorname{im}(\\\\varphi_P), \\\\quad (\\\\operatorname{coker} \\\\varphi)_P
        = \\\\operatorname{coker}(\\\\varphi_P).$$\\nConsequently, a sequence of sheaves
        and morphisms $\\\\mathcal{F}' \\\\xrightarrow{\\\\varphi} \\\\mathcal{F}
        \\\\xrightarrow{\\\\psi} \\\\mathcal{F}''$ in $\\\\mathfrak{Ab}(X)$ is *exact*
        (meaning $\\\\operatorname{im}(\\\\varphi) = \\\\ker(\\\\psi)$) if and only
        if the induced sequence on stalks $\\\\mathcal{F}'_P \\\\xrightarrow{\\\\varphi_P}
        \\\\mathcal{F}_P \\\\xrightarrow{\\\\psi_P} \\\\mathcal{F}''_P$ is an exact
        sequence of abelian groups for every $P \\\\in X$.\\n\\n*Proof.* Taking stalks
        is a filtered direct limit $\\\\varinjlim_{P \\\\in U}$, and in the category
        of abelian groups, filtered direct limits are exact functors (they commute
        with kernels, images, and cokernels). Since sheafification preserves stalks
        by Theorem 2.2.1, the stalk of the sheaf image or cokernel coincides with
        the stalk of the presheaf image or cokernel, which in turn equals the image
        or cokernel of the stalk map $\\\\varphi_P$. If $\\\\operatorname{im}(\\\\varphi)$
        and $\\\\ker(\\\\psi)$ are subsheaves of $\\\\mathcal{F}$ with $\\\\operatorname{im}(\\\\varphi)
        \\\\subseteq \\\\ker(\\\\psi)$ (i.e., $\\\\psi \\\\circ \\\\varphi = 0$),
        the inclusion $\\\\operatorname{im}(\\\\varphi) \\\\hookrightarrow \\\\ker(\\\\psi)$
        is an isomorphism of sheaves if and only if it induces an isomorphism on all
        stalks by Proposition 2.1.5, which occurs if and only if $\\\\operatorname{im}(\\\\varphi_P)
        = \\\\ker(\\\\psi_P)$ for all $P \\\\in X$. $\\\\blacksquare$\\n\\n**Definition
        2.3.3 (Direct and Inverse Image).** Let $f: X \\\\to Y$ be a continuous map
        of topological spaces.\\n1. For any sheaf $\\\\mathcal{F}$ on $X$, the *direct
        image* (or *pushforward*) sheaf $f_* \\\\mathcal{F}$ on $Y$ is defined for
        every open subset $V \\\\subseteq Y$ by\\n$$(f_* \\\\mathcal{F})(V) = \\\\mathcal{F}(f^{-1}(V)).$$\\nBecause
        $f^{-1}$ preserves unions and intersections of open sets, $f_* \\\\mathcal{F}$
        is immediately verified to be a sheaf on $Y$.\\n2. For any sheaf $\\\\mathcal{G}$
        on $Y$, the *inverse image* (or *pullback*) sheaf $f^{-1} \\\\mathcal{G}$
        on $X$ is defined to be the sheafification of the presheaf\\n$$U \\\\longmapsto
        \\\\varinjlim_{V \\\\supseteq f(U)} \\\\mathcal{G}(V),$$\\nwhere the direct
        limit runs over all open subsets $V \\\\subseteq Y$ containing $f(U)$. Notice
        that for every point $P \\\\in X$, the stalk of $f^{-1}\\\\mathcal{G}$ at
        $P$ is canonically isomorphic to the stalk of $\\\\mathcal{G}$ at $f(P)$:\\n$$(f^{-1}\\\\mathcal{G})_P
        \\\\cong \\\\varinjlim_{P \\\\in U} \\\\left( \\\\varinjlim_{V \\\\supseteq
        f(U)} \\\\mathcal{G}(V) \\\\right) = \\\\varinjlim_{f(P) \\\\in V} \\\\mathcal{G}(V)
        = \\\\mathcal{G}_{f(P)}.$$\\nIf $Z \\\\subseteq X$ is a subset equipped with
        the subspace topology and $i: Z \\\\hookrightarrow X$ is the inclusion, we
        call $i^{-1}\\\\mathcal{F}$ the *restriction* of $\\\\mathcal{F}$ to $Z$,
        denoted $\\\\mathcal{F}|_Z$.\\n\\n**Proposition 2.3.4 (Adjunction of $f^{-1}$
        and $f_*$).** Let $f: X \\\\to Y$ be a continuous map of topological spaces.
        The functors $f^{-1}$ and $f_*$ form an adjoint pair: for any sheaf $\\\\mathcal{G}$
        on $Y$ and any sheaf $\\\\mathcal{F}$ on $X$, there is a natural bijection\\n$$\\\\operatorname{Hom}_X(f^{-1}\\\\mathcal{G},
        \\\\mathcal{F}) \\\\xrightarrow{\\\\sim} \\\\operatorname{Hom}_Y(\\\\mathcal{G},
        f_*\\\\mathcal{F}).$$\\n\\n*Proof.* By the universal property of sheafification
        (Theorem 2.2.1), a morphism of sheaves $f^{-1}\\\\mathcal{G} \\\\to \\\\mathcal{F}$
        is equivalent to a morphism of presheaves from $U \\\\mapsto \\\\varinjlim_{V
        \\\\supseteq f(U)} \\\\mathcal{G}(V)$ to $\\\\mathcal{F}$. Giving a compatible
        family of maps $\\\\varinjlim_{V \\\\supseteq f(U)} \\\\mathcal{G}(V) \\\\to
        \\\\mathcal{F}(U)$ for all open $U \\\\subseteq X$ is equivalent to giving
        compatible maps $\\\\mathcal{G}(V) \\\\to \\\\mathcal{F}(U)$ whenever $f(U)
        \\\\subseteq V$, i.e., whenever $U \\\\subseteq f^{-1}(V)$. Since $U = f^{-1}(V)$
        is the largest such open set for a fixed $V$ and all maps commute with restrictions,
        this is equivalent to giving a compatible collection of maps $\\\\mathcal{G}(V)
        \\\\to \\\\mathcal{F}(f^{-1}(V)) = (f_*\\\\mathcal{F})(V)$ for all open $V
        \\\\subseteq Y$, which is precisely a morphism of sheaves $\\\\mathcal{G}
        \\\\to f_*\\\\mathcal{F}$. $\\\\blacksquare$\\n\\n**Proposition 2.3.5 (Sheaves
        on a Basis and Gluing of Sheaves).** Let $X$ be a topological space and let
        $\\\\mathcal{B}$ be a basis of open subsets for the topology of $X$.\\n1.
        Suppose $\\\\mathcal{F}$ is a sheaf on $\\\\mathcal{B}$ (meaning $\\\\mathcal{F}(B)$
        is defined for $B \\\\in \\\\mathcal{B}$ with transitive restriction maps
        satisfying the Locality and Gluing axioms for coverings of $B \\\\in \\\\mathcal{B}$
        by elements of $\\\\mathcal{B}$). Then $\\\\mathcal{F}$ extends uniquely (up
        to unique isomorphism) to a sheaf on $X$.\\n2. Suppose $X = \\\\bigcup_{i
        \\\\in I} U_i$ is an open cover, and we are given a sheaf $\\\\mathcal{F}_i$
        on each $U_i$, along with isomorphisms $\\\\varphi_{ij}: \\\\mathcal{F}_i|_{U_i
        \\\\cap U_j} \\\\xrightarrow{\\\\sim} \\\\mathcal{F}_j|_{U_i \\\\cap U_j}$
        satisfying:\\n   * $\\\\varphi_{ii} = \\\\operatorname{id}_{\\\\mathcal{F}_i}$,\\n
        \  * **(Cocycle Condition)** On every triple overlap $U_i \\\\cap U_j \\\\cap
        U_k$, $\\\\varphi_{jk} \\\\circ \\\\varphi_{ij} = \\\\varphi_{ik}$.\\n   Then
        there exists a unique sheaf $\\\\mathcal{F}$ on $X$ (up to unique isomorphism)
        together with isomorphisms $\\\\psi_i: \\\\mathcal{F}|_{U_i} \\\\xrightarrow{\\\\sim}
        \\\\mathcal{F}_i$ such that $\\\\varphi_{ij} \\\\circ \\\\psi_i = \\\\psi_j$
        on $U_i \\\\cap U_j$.\\n\\n*Proof.* (1) For each point $P \\\\in X$, since
        $\\\\mathcal{B}$ is a basis, we may define the stalk $\\\\mathcal{F}_P = \\\\varinjlim_{P
        \\\\in B \\\\in \\\\mathcal{B}} \\\\mathcal{F}(B)$. For any open $U \\\\subseteq
        X$, define $\\\\tilde{\\\\mathcal{F}}(U)$ just as in the sheafification proof:
        the set of functions $s: U \\\\to \\\\bigsqcup_{P \\\\in U} \\\\mathcal{F}_P$
        such that locally on basic neighborhoods $B \\\\subseteq U$ with $B \\\\in
        \\\\mathcal{B}$, $s$ is given by the germs of an element $t \\\\in \\\\mathcal{F}(B)$.
        The sheaf axioms on $\\\\mathcal{B}$ ensure that $\\\\tilde{\\\\mathcal{F}}(B)
        \\\\cong \\\\mathcal{F}(B)$ naturally for all $B \\\\in \\\\mathcal{B}$. Uniqueness
        follows in the exact same way: any morphism of sheaves on $\\\\mathcal{B}$
        extends uniquely to a morphism of sheaves on $X$, and isomorphisms on $\\\\mathcal{B}$
        induce isomorphisms on all stalks $\\\\mathcal{F}_P$, hence isomorphisms on
        $X$.\\n\\n(2) Let $\\\\mathcal{B}$ be the basis of open subsets of $X$ that
        are contained in at least one $U_i$. Or more directly, for any open $V \\\\subseteq
        X$, define\\n$$\\\\mathcal{F}(V) = \\\\left\\\\{ (s_i)_{i \\\\in I} \\\\in
        \\\\prod_{i \\\\in I} \\\\mathcal{F}_i(V \\\\cap U_i) \\\\;\\\\middle|\\\\;
        \\\\varphi_{ij}\\\\left(s_i|_{V \\\\cap U_i \\\\cap U_j}\\\\right) = s_j|_{V
        \\\\cap U_i \\\\cap U_j} \\\\text{ for all } i, j \\\\in I \\\\right\\\\}.$$\\nOne
        checks readily that $\\\\mathcal{F}$ is a sheaf on $X$. For a fixed $k \\\\in
        I$ and $V \\\\subseteq U_k$, projection onto the $k$-th factor gives a map
        $\\\\psi_k(V): \\\\mathcal{F}(V) \\\\to \\\\mathcal{F}_k(V)$. Conversely,
        given $t \\\\in \\\\mathcal{F}_k(V)$, the cocycle condition ensures that the
        elements $s_i = \\\\varphi_{ki}(t|_{V \\\\cap U_i}) \\\\in \\\\mathcal{F}_i(V
        \\\\cap U_i)$ agree under $\\\\varphi_{ij}$ on $V \\\\cap U_i \\\\cap U_j$,
        hence glue inside $\\\\mathcal{F}_i(V \\\\cap U_i)$ to give a unique inverse
        image in $\\\\mathcal{F}(V)$. Thus $\\\\psi_k$ is an isomorphism on $U_k$
        satisfying the compatibility conditions. $\\\\blacksquare$\\n\\n### 2.4 Ringed
        Spaces and Locally Ringed Spaces\\n\\n**Definition 2.4.1.** A *ringed space*
        is a pair $(X, \\\\mathcal{O}_X)$ consisting of a topological space $X$ and
        a sheaf of commutative rings $\\\\mathcal{O}_X$ on $X$, called the *structure
        sheaf* of $X$. A *morphism of ringed spaces* from $(X, \\\\mathcal{O}_X)$
        to $(Y, \\\\mathcal{O}_Y)$ is a pair $(f, f^\\\\sharp)$ consisting of a continuous
        map $f: X \\\\to Y$ and a morphism of sheaves of rings on $Y$,\\n$$f^\\\\sharp:
        \\\\mathcal{O}_Y \\\\to f_* \\\\mathcal{O}_X.$$\\nBy the adjunction of Proposition
        2.3.4, giving $f^\\\\sharp: \\\\mathcal{O}_Y \\\\to f_* \\\\mathcal{O}_X$
        is equivalent to giving a morphism of sheaves of rings $f^\\\\flat: f^{-1}\\\\mathcal{O}_Y
        \\\\to \\\\mathcal{O}_X$ on $X$. For every point $P \\\\in X$, $f^\\\\flat$
        induces on stalks at $P$ a ring homomorphism\\n$$f^\\\\sharp_P: \\\\mathcal{O}_{Y,
        f(P)} \\\\cong (f^{-1}\\\\mathcal{O}_Y)_P \\\\longrightarrow \\\\mathcal{O}_{X,
        P}.$$\\nExplicitly, $f^\\\\sharp_P$ is the direct limit over all open neighborhoods
        $V$ of $f(P)$ in $Y$ of the homomorphisms\\n$$\\\\mathcal{O}_Y(V) \\\\xrightarrow{f^\\\\sharp(V)}
        \\\\mathcal{O}_X(f^{-1}(V)) \\\\longrightarrow \\\\mathcal{O}_{X, P}.$$\\n\\n**Definition
        2.4.2.** A ringed space $(X, \\\\mathcal{O}_X)$ is a *locally ringed space*
        if for every point $P \\\\in X$, the stalk $\\\\mathcal{O}_{X, P}$ is a local
        ring (i.e., possesses a unique maximal ideal, which we denote by $\\\\mathfrak{m}_P$
        or $\\\\mathfrak{m}_{X,P}$). The quotient field $\\\\kappa(P) = \\\\mathcal{O}_{X,P}
        / \\\\mathfrak{m}_P$ is called the *residue field* of $P$ on $X$.\\n\\nA *morphism
        of locally ringed spaces* $(f, f^\\\\sharp): (X, \\\\mathcal{O}_X) \\\\to
        (Y, \\\\mathcal{O}_Y)$ is a morphism of ringed spaces such that for every
        point $P \\\\in X$, the induced map of local rings on stalks $f^\\\\sharp_P:
        \\\\mathcal{O}_{Y, f(P)} \\\\to \\\\mathcal{O}_{X, P}$ is a *local homomorphism*
        of local rings; that is,\\n$$(f^\\\\sharp_P)^{-1}(\\\\mathfrak{m}_{X, P})
        = \\\\mathfrak{m}_{Y, f(P)}$$\\n(equivalently, $f^\\\\sharp_P(\\\\mathfrak{m}_{Y,
        f(P)}) \\\\subseteq \\\\mathfrak{m}_{X, P}$, since the preimage of a prime
        ideal is prime and $\\\\mathfrak{m}_{Y, f(P)}$ is the unique maximal ideal
        of $\\\\mathcal{O}_{Y, f(P)}$). Note that an isomorphism of locally ringed
        spaces is simply a morphism $(f, f^\\\\sharp)$ for which $f$ is a homeomorphism
        and $f^\\\\sharp$ is an isomorphism of sheaves of rings (for then each $f^\\\\sharp_P$
        is a ring isomorphism, hence automatically local with local inverse).\\n\\n**Example
        2.4.3.** Let $X$ be a quasi-projective variety over an algebraically closed
        field $k$ (as in Chapter 1), and let $\\\\mathcal{O}_X$ be the sheaf of regular
        functions on $X$, assigning to each open $U \\\\subseteq X$ the ring $\\\\mathcal{O}(U)$
        of regular functions $U \\\\to k$. By Theorem 1.3.5, the stalk $\\\\mathcal{O}_{X,P}$
        is the local ring $\\\\mathcal{O}_{P,X}$ of rational functions regular at
        $P$, whose unique maximal ideal $\\\\mathfrak{m}_P$ consists of germs of functions
        vanishing at $P$. Thus $(X, \\\\mathcal{O}_X)$ is a locally ringed space.
        Moreover, if $f: X \\\\to Y$ is any continuous map between varieties, pulling
        back functions $g \\\\mapsto g \\\\circ f$ automatically takes functions vanishing
        at $f(P)$ to functions vanishing at $P$, so $(f, f^\\\\sharp)$ is automatically
        a local homomorphism on stalks! In general locally ringed spaces (such as
        schemes), however, sections of $\\\\mathcal{O}_X$ are *not* set-theoretic
        functions into a fixed base field, so the local homomorphism condition on
        $f^\\\\sharp_P$ is an essential, non-redundant axiom that replaces the notion
        of \\\"vanishing at a point.\\\"\\n\\n---\\n\\n### Exercises for Chapter 2\\n\\n**Exercise
        2.1.** Let $X$ be a topological space and let $A$ be a nonzero abelian group.
        The *constant presheaf* $\\\\mathcal{F}$ associated to $A$ assigns $\\\\mathcal{F}(U)
        = A$ for all non-empty open $U \\\\subseteq X$ (and $\\\\mathcal{F}(\\\\emptyset)
        = 0$), with identity restriction maps. Show that if $X$ contains two disjoint
        non-empty open subsets, $\\\\mathcal{F}$ is not a sheaf. Prove that its sheafification
        $\\\\mathcal{F}^+$ (called the *constant sheaf* $\\\\underline{A}$) assigns
        to each open $U \\\\subseteq X$ the group of locally constant functions from
        $U$ to $A$ (i.e., continuous functions $U \\\\to A$ when $A$ is given the
        discrete topology).\\n\\n**Exercise 2.2 (Skyscraper Sheaves).** Let $X$ be
        a topological space, $P \\\\in X$ a point, and $A$ an abelian group. Define
        $i_P(A)$ by $i_P(A)(U) = A$ if $P \\\\in U$, and $i_P(A)(U) = 0$ if $P \\\\notin
        U$.\\n(a) Prove that $i_P(A)$ is a sheaf on $X$ (called the *skyscraper sheaf*
        at $P$ with group $A$), and verify that $i_P(A) = i_* \\\\underline{A}$, where
        $i: \\\\{P\\\\} \\\\hookrightarrow X$ is the inclusion.\\n(b) Determine the
        stalk $(i_P(A))_Q$ for all $Q \\\\in X$ in terms of the closure $\\\\overline{\\\\{P\\\\}}$.\\n\\n**Exercise
        2.3.** Let $X = \\\\mathbb{C}$ equipped with the classical (Euclidean) topology.
        Let $\\\\mathcal{O}_X$ be the sheaf of holomorphic functions on $X$, and let
        $\\\\mathcal{O}_X^*$ be the sheaf of nowhere-vanishing holomorphic functions
        on $X$ (under multiplication). Consider the exponential morphism $\\\\exp:
        \\\\mathcal{O}_X \\\\to \\\\mathcal{O}_X^*$ defined on each open $U \\\\subseteq
        \\\\mathbb{C}$ by $f \\\\mapsto e^{2\\\\pi i f}$.\\n(a) Prove that $\\\\exp:
        \\\\mathcal{O}_X \\\\to \\\\mathcal{O}_X^*$ is a surjective morphism of sheaves
        of abelian groups, and identify its kernel with the constant sheaf $\\\\underline{\\\\mathbb{Z}}$.\\n(b)
        Show that for the punctured plane $U = \\\\mathbb{C} \\\\setminus \\\\{0\\\\}$,
        the map on sections $\\\\exp(U): \\\\mathcal{O}_X(U) \\\\to \\\\mathcal{O}_X^*(U)$
        is *not* surjective.\\n\\n**Exercise 2.4 (Direct Limit of Sheaves).** Let
        $\\\\{\\\\mathcal{F}_\\\\alpha\\\\}_{\\\\alpha \\\\in I}$ be a directed system
        of sheaves of abelian groups on a Noetherian topological space $X$ (meaning
        every open subset of $X$ is quasi-compact, i.e., every open cover has a finite
        subcover). Prove that the presheaf $U \\\\mapsto \\\\varinjlim_{\\\\alpha
        \\\\in I} \\\\mathcal{F}_\\\\alpha(U)$ is already a sheaf on $X$.\\n\\n**Exercise
        2.5 (Gluing Ringed Spaces).** Let $\\\\{(X_i, \\\\mathcal{O}_{X_i})\\\\}_{i
        \\\\in I}$ be a family of locally ringed spaces. Suppose for each $i, j \\\\in
        I$ we are given an open subset $U_{ij} \\\\subseteq X_i$ and an isomorphism
        of locally ringed spaces $\\\\varphi_{ij}: (U_{ij}, \\\\mathcal{O}_{X_i}|_{U_{ij}})
        \\\\xrightarrow{\\\\sim} (U_{ji}, \\\\mathcal{O}_{X_j}|_{U_{ji}})$ such that:\\n1.
        $U_{ii} = X_i$ and $\\\\varphi_{ii} = \\\\operatorname{id}_{X_i}$ for all
        $i$.\\n2. For all $i, j, k \\\\in I$, $\\\\varphi_{ij}(U_{ij} \\\\cap U_{ik})
        = U_{ji} \\\\cap U_{jk}$, and $\\\\varphi_{jk} \\\\circ \\\\varphi_{ij} =
        \\\\varphi_{ik}$ on $U_{ij} \\\\cap U_{ik}$.\\nProve that there exists a locally
        ringed space $(X, \\\\mathcal{O}_X)$, unique up to unique isomorphism, together
        with open immersions $\\\\psi_i: X_i \\\\hookrightarrow X$ such that $X =
        \\\\bigcup_{i \\\\in I} \\\\psi_i(X_i)$, $\\\\psi_i(U_{ij}) = \\\\psi_i(X_i)
        \\\\cap \\\\psi_j(X_j)$, and $\\\\psi_j \\\\circ \\\\varphi_{ij} = \\\\psi_i$
        on $U_{ij}$.\\n\\n---\\n\\n## CHAPTER 3: SCHEMES\\n\\nWe now enter the heart
        of modern algebraic geometry. By replacing varieties over an algebraically
        closed field with the spectrum of an arbitrary commutative ring, we can study
        algebraic varieties over any base field, arithmetic schemes over $\\\\mathbb{Z}$,
        and schemes with nilpotent elements (which record intersection multiplicities
        and infinitesimal deformations).\\n\\n### 3.1 The Spectrum of a Ring\\n\\nThroughout
        this chapter, all rings are assumed to be commutative with identity $1$.\\n\\n**Definition
        3.1.1.** Let $A$ be a ring. We define $\\\\operatorname{Spec} A$ to be the
        set of all prime ideals of $A$. For any subset $E \\\\subseteq A$, we define
        the vanishing locus\\n$$V(E) = \\\\{\\\\mathfrak{p} \\\\in \\\\operatorname{Spec}
        A \\\\mid E \\\\subseteq \\\\mathfrak{p}\\\\}.$$\\n\\n**Lemma 3.1.2.** Let
        $A$ be a ring.\\n1. If $\\\\mathfrak{a}$ is the ideal of $A$ generated by
        $E$, then $V(E) = V(\\\\mathfrak{a}) = V(\\\\sqrt{\\\\mathfrak{a}})$.\\n2.
        $V(0) = \\\\operatorname{Spec} A$ and $V(1) = \\\\emptyset$.\\n3. If $\\\\{E_i\\\\}_{i
        \\\\in I}$ is any family of subsets of $A$, then $V\\\\left(\\\\bigcup_{i
        \\\\in I} E_i\\\\right) = \\\\bigcap_{i \\\\in I} V(E_i)$.\\n4. For any ideals
        $\\\\mathfrak{a}, \\\\mathfrak{b}$ of $A$, $V(\\\\mathfrak{a} \\\\cap \\\\mathfrak{b})
        = V(\\\\mathfrak{a}\\\\mathfrak{b}) = V(\\\\mathfrak{a}) \\\\cup V(\\\\mathfrak{b})$.\\n\\n*Proof.*
        (1), (2), and (3) follow directly from the definition of an ideal and a prime
        ideal. For (4), clearly $\\\\mathfrak{a}\\\\mathfrak{b} \\\\subseteq \\\\mathfrak{a}
        \\\\cap \\\\mathfrak{b} \\\\subseteq \\\\mathfrak{a}, \\\\mathfrak{b}$ gives
        $V(\\\\mathfrak{a}) \\\\cup V(\\\\mathfrak{b}) \\\\subseteq V(\\\\mathfrak{a}
        \\\\cap \\\\mathfrak{b}) \\\\subseteq V(\\\\mathfrak{a}\\\\mathfrak{b})$.
        Conversely, if $\\\\mathfrak{p} \\\\in V(\\\\mathfrak{a}\\\\mathfrak{b})$,
        then $\\\\mathfrak{a}\\\\mathfrak{b} \\\\subseteq \\\\mathfrak{p}$, and by
        the definition of a prime ideal, either $\\\\mathfrak{a} \\\\subseteq \\\\mathfrak{p}$
        or $\\\\mathfrak{b} \\\\subseteq \\\\mathfrak{p}$, so $\\\\mathfrak{p} \\\\in
        V(\\\\mathfrak{a}) \\\\cup V(\\\\mathfrak{b})$. $\\\\blacksquare$\\n\\nBy
        Lemma 3.1.2, the subsets of the form $V(\\\\mathfrak{a})$ satisfy the axioms
        for the closed sets of a topology on $\\\\operatorname{Spec} A$, called the
        *Zariski topology*.\\n\\n**Definition 3.1.3.** For each element $f \\\\in
        A$, we define the *principal* (or *distinguished*) *open subset* $D(f) \\\\subseteq
        \\\\operatorname{Spec} A$ to be the complement of $V(f)$:\\n$$D(f) = \\\\operatorname{Spec}
        A \\\\setminus V(f) = \\\\{\\\\mathfrak{p} \\\\in \\\\operatorname{Spec} A
        \\\\mid f \\\\notin \\\\mathfrak{p}\\\\}.$$\\n\\n**Lemma 3.1.4.** Let $A$
        be a ring.\\n1. For any $f, g \\\\in A$, $D(f) \\\\cap D(g) = D(fg)$.\\n2.
        $D(f) = \\\\emptyset$ if and only if $f$ is nilpotent (i.e., $f \\\\in \\\\sqrt{(0)}$),
        and $D(f) = \\\\operatorname{Spec} A$ if and only if $f$ is a unit in $A$.\\n3.
        The sets $D(f)$ for $f \\\\in A$ form a basis of open subsets for the Zariski
        topology on $\\\\operatorname{Spec} A$.\\n4. Every open subset $D(f)$ is *quasi-compact*
