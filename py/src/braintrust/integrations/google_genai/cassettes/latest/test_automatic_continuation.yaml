        \\\\subseteq V(g_i) \\\\iff g_i \\\\in \\\\sqrt{(h_i)}$, so $g_i^{m_i} = c_i
        h_i$ for some $m_i \\\\ge 1$ and $c_i \\\\in A$. Rewriting $\\\\frac{a_i}{h_i}
