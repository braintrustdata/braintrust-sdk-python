        of $A$ is the intersection of all prime ideals of $A$. Thus $D(f) = \\\\emptyset
        \\\\iff f \\\\in \\\\mathfrak{p}$ for all $\\\\mathfrak{p} \\\\in \\\\operatorname{Spec}
        A \\\\iff f \\\\in \\\\sqrt{(0)}$. Similarly, $D(f) = \\\\operatorname{Spec}
        A \\\\iff f \\\\notin \\\\mathfrak{p}$ for any prime $\\\\mathfrak{p} \\\\iff
        (f)$ is not contained in any maximal ideal $\\\\iff (f) = A \\\\iff f \\\\in
        A^\\\\times$.\\n(3) Any open set is of the form $\\\\operatorname{Spec} A
