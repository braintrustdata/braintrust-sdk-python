        $\\\\blacksquare$\\n\\n**Proposition 3.2.2.** For any ring $A$, $(\\\\operatorname{Spec}
        A, \\\\mathcal{O}_{\\\\operatorname{Spec} A})$ is a locally ringed space.
        Moreover, for any two rings $A$ and $B$, there is a natural bijection between
