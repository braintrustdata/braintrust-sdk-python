        A$ such that $U \\\\subseteq D(f)$ and $s(\\\\mathfrak{q}) = a/f$ in $A_\\\\mathfrak{q}$
        for all $\\\\mathfrak{q} \\\\in U$. Since $s(\\\\mathfrak{p}) = a/f = 0$ in
        $A_\\\\mathfrak{p}$, there exists an element $h \\\\in A \\\\setminus \\\\mathfrak{p}$
        such that $ha = 0$ in $A$. Then $U \\\\cap D(h)$ is an open neighborhood of
        $\\\\mathfrak{p}$ on which $h \\\\notin \\\\mathfrak{q}$ for all $\\\\mathfrak{q}
        \\\\in U \\\\cap D(h)$, so $a/f = (ha)/(hf) = 0$ in $A_\\\\mathfrak{q}$ for
        all $\\\\mathfrak{q} \\\\in U \\\\cap D(h)$. Thus $s|_{U \\\\cap D(h)} = 0$,
