        = a/f$.\\n\\nTo see that $\\\\pi_{\\\\mathfrak{p}}$ is injective, let $U$
        be an open neighborhood of $\\\\mathfrak{p}$ and $s \\\\in \\\\mathcal{O}_X(U)$
        a section such that $\\\\pi_{\\\\mathfrak{p}}(s_{\\\\mathfrak{p}}) = s(\\\\mathfrak{p})
        = 0$ in $A_{\\\\mathfrak{p}}$. By Definition 3.2.1(2), after shrinking $U$,
