      string: "{\n  \"candidates\": [\n    {\n      \"content\": {\n        \"parts\":
        [\n          {\n            \"text\": \"# Foundations of Algebraic Geometry\\n\\n---\\n\\n##
        Chapter 1: Affine and Projective Varieties\\n\\nIn this opening chapter, we
        develop the classical theory of algebraic varieties over an algebraically
        closed field $k$. While later chapters will recast and vastly generalize this
        framework into the language of Grothendieck's schemes, the geometric intuition
        of algebraic geometry is rooted in the study of solution sets to systems of
        polynomial equations. Throughout this chapter, unless explicitly stated otherwise,
        $k$ denotes an algebraically closed field.\\n\\n### 1.1 The Zariski Topology
        and Hilbert's Nullstellensatz\\n\\nLet $k$ be an algebraically closed field.
        We define **affine $n$-space** over $k$, denoted $\\\\mathbb{A}^n_k$ (or simply
        $\\\\mathbb{A}^n$), to be the set of $n$-tuples of elements of $k$:\\n$$\\\\mathbb{A}^n_k
        = \\\\{(a_1, \\\\dots, a_n) \\\\mid a_i \\\\in k\\\\}.$$\\nAssociated to $\\\\mathbb{A}^n_k$
        is the polynomial ring in $n$ variables, $R = k[x_1, \\\\dots, x_n]$. Elements
        $f \\\\in R$ are viewed as functions $f: \\\\mathbb{A}^n_k \\\\to k$ by evaluation:
        for $P = (a_1, \\\\dots, a_n) \\\\in \\\\mathbb{A}^n_k$, $f(P) = f(a_1, \\\\dots,
        a_n)$.\\n\\n**Definition 1.1.1.** Let $S \\\\subseteq k[x_1, \\\\dots, x_n]$
        be any subset of polynomials. The **zero locus** (or **vanishing locus**)
        of $S$ is the subset of $\\\\mathbb{A}^n_k$ defined by:\\n$$V(S) = \\\\{P
        \\\\in \\\\mathbb{A}^n_k \\\\mid f(P) = 0 \\\\text{ for all } f \\\\in S\\\\}.$$\\nA
        subset $Y \\\\subseteq \\\\mathbb{A}^n_k$ is called an **algebraic set** if
        there exists a subset $S \\\\subseteq k[x_1, \\\\dots, x_n]$ such that $Y
        = V(S)$.\\n\\nIf $\\\\mathfrak{a} = (S)$ is the ideal generated by $S$ in
        $k[x_1, \\\\dots, x_n]$, it is immediate from the definition of an ideal that
        $V(S) = V(\\\\mathfrak{a})$. Since $k[x_1, \\\\dots, x_n]$ is a Noetherian
        ring by Hilbert's Basis Theorem, any ideal $\\\\mathfrak{a}$ is finitely generated,
        say $\\\\mathfrak{a} = (f_1, \\\\dots, f_r)$. Thus, any algebraic set is the
        common zero locus of a finite collection of polynomials:\\n$$V(\\\\mathfrak{a})
        = V(f_1, \\\\dots, f_r) = \\\\bigcap_{i=1}^r V(f_i).$$\\n\\n**Proposition
        1.1.2.** *The collection of algebraic sets in $\\\\mathbb{A}^n_k$ satisfies
        the axioms for the closed subsets of a topology on $\\\\mathbb{A}^n_k$:*\\n1.
        $\\\\ = V(1)$ *and* $\\\\mathbb{A}^n_k = V(0)$ *are algebraic sets.*\\n2.
        *If $Y_1 = V(\\\\mathfrak{a}_1)$ and $Y_2 = V(\\\\mathfrak{a}_2)$ are algebraic
        sets, then $Y_1 \\\\cup Y_2 = V(\\\\mathfrak{a}_1 \\\\cap \\\\mathfrak{a}_2)
        = V(\\\\mathfrak{a}_1 \\\\mathfrak{a}_2)$ is an algebraic set.*\\n3. *If $\\\\{Y_\\\\alpha
        = V(\\\\mathfrak{a}_\\\\alpha)\\\\}_{\\\\alpha \\\\in I}$ is any family of
        algebraic sets, then $\\\\bigcap_{\\\\alpha \\\\in I} Y_\\\\alpha = V\\\\left(\\\\sum_{\\\\alpha
        \\\\in I} \\\\mathfrak{a}_\\\\alpha\\\\right)$ is an algebraic set.*\\n\\n*Proof.*
        \\n(1) The constant polynomial $1$ vanishes nowhere, so $V(1) = \\\\varnothing$.
        The zero polynomial vanishes everywhere, so $V(0) = \\\\mathbb{A}^n_k$.\\n\\n(2)
        Let $P \\\\in V(\\\\mathfrak{a}_1) \\\\cup V(\\\\mathfrak{a}_2)$. Any element
        of $\\\\mathfrak{a}_1\\\\mathfrak{a}_2$ is a finite sum $\\\\sum f_i g_i$
        with $f_i \\\\in \\\\mathfrak{a}_1$ and $g_i \\\\in \\\\mathfrak{a}_2$. Since
        $P$ vanishes on all elements of $\\\\mathfrak{a}_1$ or all elements of $\\\\mathfrak{a}_2$,
        every product $f_i(P)g_i(P) = 0$. Since $\\\\mathfrak{a}_1\\\\mathfrak{a}_2
        \\\\subseteq \\\\mathfrak{a}_1 \\\\cap \\\\mathfrak{a}_2$, we have $V(\\\\mathfrak{a}_1)
        \\\\cup V(\\\\mathfrak{a}_2) \\\\subseteq V(\\\\mathfrak{a}_1 \\\\cap \\\\mathfrak{a}_2)
        \\\\subseteq V(\\\\mathfrak{a}_1\\\\mathfrak{a}_2)$. Conversely, suppose $P
        \\\\notin V(\\\\mathfrak{a}_1) \\\\cup V(\\\\mathfrak{a}_2)$. Then there exist
        $f \\\\in \\\\mathfrak{a}_1$ and $g \\\\in \\\\mathfrak{a}_2$ such that $f(P)
        \\\\neq 0$ and $g(P) \\\\neq 0$. Since $k$ is a field (and thus an integral
        domain), $(fg)(P) = f(P)g(P) \\\\neq 0$. Because $fg \\\\in \\\\mathfrak{a}_1\\\\mathfrak{a}_2$,
        we have $P \\\\notin V(\\\\mathfrak{a}_1\\\\mathfrak{a}_2)$. Thus $V(\\\\mathfrak{a}_1)
        \\\\cup V(\\\\mathfrak{a}_2) = V(\\\\mathfrak{a}_1 \\\\cap \\\\mathfrak{a}_2)
        = V(\\\\mathfrak{a}_1\\\\mathfrak{a}_2)$.\\n\\n(3) A point $P$ lies in $\\\\bigcap_{\\\\alpha
        \\\\in I} V(\\\\mathfrak{a}_\\\\alpha)$ if and only if $f(P) = 0$ for all
        $f \\\\in \\\\bigcup_{\\\\alpha \\\\in I} \\\\mathfrak{a}_\\\\alpha$, which
        holds if and only if $P$ vanishes on the ideal generated by $\\\\bigcup_{\\\\alpha
        \\\\in I} \\\\mathfrak{a}_\\\\alpha$, namely $\\\\sum_{\\\\alpha \\\\in I}
        \\\\mathfrak{a}_\\\\alpha$. $\\\\blacksquare$\\n\\n**Definition 1.1.3.** The
        topology on $\\\\mathbb{A}^n_k$ whose closed sets are the algebraic sets is
        called the **Zariski topology**. Any subset $Y \\\\subseteq \\\\mathbb{A}^n_k$
        inherits the subspace topology, also referred to as the Zariski topology on
        $Y$.\\n\\nTo establish a dictionary between geometry and algebra, we define
        the inverse operation to $V$.\\n\\n**Definition 1.1.4.** For any subset $Y
        \\\\subseteq \\\\mathbb{A}^n_k$, the **ideal of $Y$** in $k[x_1, \\\\dots,
        x_n]$ is defined by:\\n$$I(Y) = \\\\{f \\\\in k[x_1, \\\\dots, x_n] \\\\mid
        f(P) = 0 \\\\text{ for all } P \\\\in Y\\\\}.$$\\n\\nRecall that for an ideal
        $\\\\mathfrak{a}$ in a commutative ring $R$, the **radical** of $\\\\mathfrak{a}$
        is the ideal:\\n$$\\\\sqrt{\\\\mathfrak{a}} = \\\\{f \\\\in R \\\\mid f^m
        \\\\in \\\\mathfrak{a} \\\\text{ for some integer } m \\\\ge 1\\\\}.$$\\nAn
        ideal $\\\\mathfrak{a}$ is called a **radical ideal** if $\\\\mathfrak{a}
        = \\\\sqrt{\\\\mathfrak{a}}$. Since $k$ has no nonzero nilpotent elements,
        $I(Y)$ is always a radical ideal: if $f^m \\\\in I(Y)$, then $(f(P))^m = 0$
        for all $P \\\\in Y$, which implies $f(P) = 0$ for all $P \\\\in Y$, so $f
        \\\\in I(Y)$.\\n\\nThe fundamental bridge between commutative algebra and
        algebraic geometry is Hilbert's Nullstellensatz. We will prove this by first
        establishing Zariski's Lemma, which is a purely algebraic statement about
        finitely generated algebras over fields.\\n\\n**Lemma 1.1.5 (Zariski's Lemma).**
        *Let $K$ be a field, and let $A$ be a finitely generated $K$-algebra. If $A$
        is a field, then $A$ is a finite algebraic extension of $K$.*\\n\\n*Proof.*
        We proceed by induction on $n$, the number of generators of $A$ as a $K$-algebra.
        Write $A = K[\\\\alpha_1, \\\\dots, \\\\alpha_n]$. \\n\\nIf $n = 1$, then
        $A = K[\\\\alpha_1]$. Since $A$ is a field, the natural surjective $K$-algebra
        homomorphism $K[x] \\\\to K[\\\\alpha_1]$ must have a non-zero prime (hence
        maximal) kernel, because $K[x]$ is not a field. Thus $\\\\alpha_1$ is algebraic
        over $K$, and $A$ is a finite extension of $K$.\\n\\nNow suppose $n \\u003e
        1$ and the statement holds for all fields generated as algebras over a base
        field by $n-1$ elements. Consider the subring $B = K[\\\\alpha_1] \\\\subseteq
        A$ and its field of fractions $L = K(\\\\alpha_1) \\\\subseteq A$ (which exists
        inside $A$ since $A$ is a field). Clearly, $A = L[\\\\alpha_2, \\\\dots, \\\\alpha_n]$
        is a finitely generated $L$-algebra with $n-1$ generators. By the induction
        hypothesis, $A$ is a finite algebraic extension of $L$.\\n\\nIt remains to
        show that $\\\\alpha_1$ is algebraic over $K$; if it is, then $L = K[\\\\alpha_1]$
        is a finite extension of $K$, and by the tower law for field extensions, $A$
        is a finite extension of $K$. Suppose, for the sake of contradiction, that
        $\\\\alpha_1$ is transcendental over $K$. Then $B = K[\\\\alpha_1]$ is isomorphic
        to a polynomial ring in one variable over $K$, which is a Unique Factorization
        Domain (UFD) with infinitely many non-associate irreducible elements (for
        instance, adapt Euclid's proof for prime numbers: if $p_1, \\\\dots, p_r$
        are irreducibles, any irreducible factor of $p_1 \\\\cdots p_r + 1$ is not
        associate to any $p_i$).\\n\\nSince each $\\\\alpha_i$ ($2 \\\\le i \\\\le
        n$) is algebraic over $L$, it satisfies a monic polynomial equation with coefficients
        in $L = \\\\operatorname{Frac}(B)$. Clearing denominators, there exists a
        non-zero element $b_i \\\\in B$ such that $b_i \\\\alpha_i$ is integral over
        $B$. Let $b = \\\\prod_{i=2}^n b_i \\\\in B \\\\setminus \\\\{0\\\\}$. Then
        every $\\\\alpha_i$ is integral over the localized ring $B_b = B[b^{-1}]$.
        Since the set of elements in $A$ that are integral over $B_b$ forms a subring
        containing $B$ and $\\\\alpha_1, \\\\dots, \\\\alpha_n$, we conclude that
        $A$ is integral over $B_b$.\\n\\nIn particular, every element of $L \\\\subseteq
        A$ is integral over $B_b$. Let $u \\\\in B$ be any irreducible element that
        does not divide $b$. Consider $u^{-1} \\\\in L$. Since $u^{-1}$ is integral
        over $B_b$, it satisfies an equation of the form:\\n$$\\\\left(u^{-1}\\\\right)^m
        + \\\\frac{c_{m-1}}{b^{e_{m-1}}} \\\\left(u^{-1}\\\\right)^{m-1} + \\\\dots
        + \\\\frac{c_0}{b^{e_0}} = 0,$$\\nwhere $c_j \\\\in B$ and $e_j \\\\ge 0$.
        Multiplying through by $u^m b^N$ for a sufficiently large integer $N$, we
        obtain an equation in $B$:\\n$$b^N = -u \\\\left( c_{m-1} b^{N-e_{m-1}} +
        c_{m-2} b^{N-e_{m-2}} u + \\\\dots + c_0 b^{N-e_0} u^{m-1} \\\\right).$$\\nThis
        implies that $u$ divides $b^N$ in the UFD $B$, so the irreducible element
        $u$ must divide $b$, a contradiction since $B$ has infinitely many non-associate
        irreducibles and $b$ has only finitely many irreducible factors. Thus $\\\\alpha_1$
        must be algebraic over $K$, completing the proof. $\\\\blacksquare$\\n\\n**Corollary
        1.1.6 (Weak Nullstellensatz).** *Let $k$ be an algebraically closed field.
        Every maximal ideal $\\\\mathfrak{m}$ of $R = k[x_1, \\\\dots, x_n]$ is of
        the form $\\\\mathfrak{m} = (x_1 - a_1, \\\\dots, x_n - a_n)$ for some point
        $P = (a_1, \\\\dots, a_n) \\\\in \\\\mathbb{A}^n_k$. In particular, for any
        proper ideal $\\\\mathfrak{a} \\\\subsetneq R$, we have $V(\\\\mathfrak{a})
        \\\\neq \\\\varnothing$.*\\n\\n*Proof.* Let $\\\\mathfrak{m} \\\\subset R$
        be a maximal ideal. Then the quotient $K = R/\\\\mathfrak{m}$ is a field,
        and it is finitely generated as a $k$-algebra by the images $\\\\bar{x}_1,
        \\\\dots, \\\\bar{x}_n$. By Zariski's Lemma (Lemma 1.1.5), $K$ is a finite
        algebraic extension of $k$. Since $k$ is algebraically closed, it has no non-trivial
        algebraic extensions, so the natural inclusion $k \\\\hookrightarrow K = R/\\\\mathfrak{m}$
        is an isomorphism. \\n\\nLet $a_i \\\\in k$ be the unique element whose image
        in $R/\\\\mathfrak{m}$ is $\\\\bar{x}_i$. Then $x_i - a_i \\\\in \\\\mathfrak{m}$
        for all $i = 1, \\\\dots, n$. Therefore, the ideal $\\\\mathfrak{n} = (x_1
        - a_1, \\\\dots, x_n - a_n)$ is contained in $\\\\mathfrak{m}$. However, $R/\\\\mathfrak{n}
        \\\\cong k$ is a field, so $\\\\mathfrak{n}$ is already a maximal ideal. By
        maximality, $\\\\mathfrak{m} = \\\\mathfrak{n}$.\\n\\nFinally, if $\\\\mathfrak{a}
        \\\\subsetneq R$ is a proper ideal, by Zorn's Lemma (or the Noetherian property)
        it is contained in some maximal ideal $\\\\mathfrak{m} = (x_1 - a_1, \\\\dots,
        x_n - a_n)$. Then $P = (a_1, \\\\dots, a_n) \\\\in V(\\\\mathfrak{m}) \\\\subseteq
        V(\\\\mathfrak{a})$, so $V(\\\\mathfrak{a}) \\\\neq \\\\varnothing$. $\\\\blacksquare$\\n\\nWe
        now deduce the full Hilbert Nullstellensatz using the classic trick of Rabinowitsch.\\n\\n**Theorem
        1.1.7 (Hilbert's Nullstellensatz).** *Let $k$ be an algebraically closed field,
        and let $\\\\mathfrak{a}$ be an ideal in $k[x_1, \\\\dots, x_n]$. Then:*\\n$$I(V(\\\\mathfrak{a}))
        = \\\\sqrt{\\\\mathfrak{a}}.$$\\n\\n*Proof.* The inclusion $\\\\sqrt{\\\\mathfrak{a}}
        \\\\subseteq I(V(\\\\mathfrak{a}))$ is immediate: if $f \\\\in \\\\sqrt{\\\\mathfrak{a}}$,
        then $f^m \\\\in \\\\mathfrak{a}$ for some $m \\\\ge 1$. For any $P \\\\in
        V(\\\\mathfrak{a})$, we have $(f(P))^m = f^m(P) = 0$, which forces $f(P) =
        0$, so $f \\\\in I(V(\\\\mathfrak{a}))$.\\n\\nConversely, let $f \\\\in I(V(\\\\mathfrak{a}))$,
        and assume $f \\\\neq 0$. Since $R = k[x_1, \\\\dots, x_n]$ is Noetherian,
        $\\\\mathfrak{a}$ is finitely generated, say $\\\\mathfrak{a} = (g_1, \\\\dots,
        g_r)$. We introduce a new variable $x_{n+1}$ and consider the ideal $\\\\mathfrak{b}
        \\\\subseteq k[x_1, \\\\dots, x_n, x_{n+1}]$ generated by $g_1, \\\\dots,
        g_r$ and the polynomial $1 - x_{n+1} f(x_1, \\\\dots, x_n)$:\\n$$\\\\mathfrak{b}
        = (g_1, \\\\dots, g_r, 1 - x_{n+1} f).$$\\nWe claim that $V(\\\\mathfrak{b})
        = \\\\varnothing$ in $\\\\mathbb{A}^{n+1}_k$. Indeed, if $Q = (a_1, \\\\dots,
        a_n, a_{n+1}) \\\\in V(\\\\mathfrak{b})$, then $P = (a_1, \\\\dots, a_n) \\\\in
        \\\\mathbb{A}^n_k$ satisfies $g_i(P) = 0$ for all $i = 1, \\\\dots, r$. Thus
        $P \\\\in V(\\\\mathfrak{a})$. Since $f \\\\in I(V(\\\\mathfrak{a}))$, we
        must have $f(P) = 0$. Evaluating the last generator of $\\\\mathfrak{b}$ at
        $Q$ yields $1 - a_{n+1} f(P) = 1 - 0 = 1 \\\\neq 0$, contradicting $Q \\\\in
        V(\\\\mathfrak{b})$.\\n\\nBy the Weak Nullstellensatz (Corollary 1.1.6), since
        $V(\\\\mathfrak{b}) = \\\\varnothing$, the ideal $\\\\mathfrak{b}$ cannot
        be a proper ideal of $k[x_1, \\\\dots, x_{n+1}]$. Hence $1 \\\\in \\\\mathfrak{b}$,
        so there exist polynomials $h_1, \\\\dots, h_r, h_{r+1} \\\\in k[x_1, \\\\dots,
        x_{n+1}]$ such that:\\n$$1 = \\\\sum_{i=1}^r h_i(x_1, \\\\dots, x_{n+1}) g_i(x_1,
        \\\\dots, x_n) + h_{r+1}(x_1, \\\\dots, x_{n+1})(1 - x_{n+1} f(x_1, \\\\dots,
        x_n)).$$\\nThis is an identity in the polynomial ring $k[x_1, \\\\dots, x_{n+1}]$,
        which remains valid when we apply the $k[x_1, \\\\dots, x_n]$-algebra homomorphism
        $k[x_1, \\\\dots, x_{n+1}] \\\\to k(x_1, \\\\dots, x_n)$ sending $x_{n+1}
        \\\\mapsto 1/f(x_1, \\\\dots, x_n)$. Under this substitution, the term $1
        - x_{n+1}f$ vanishes, giving:\\n$$1 = \\\\sum_{i=1}^r h_i\\\\left(x_1, \\\\dots,
        x_n, \\\\frac{1}{f}\\\\right) g_i(x_1, \\\\dots, x_n)$$\\nin the rational
        function field $k(x_1, \\\\dots, x_n)$. Let $m$ be the highest power of $x_{n+1}$
        appearing in any of the polynomials $h_1, \\\\dots, h_r$. Multiplying both
        sides of the equation by $f^m$ clears all denominators and yields an identity
        in $k[x_1, \\\\dots, x_n]$:\\n$$f^m = \\\\sum_{i=1}^r \\\\tilde{h}_i(x_1,
        \\\\dots, x_n) g_i(x_1, \\\\dots, x_n),$$\\nwhere $\\\\tilde{h}_i = f^m h_i(x_1,
        \\\\dots, x_n, 1/f) \\\\in k[x_1, \\\\dots, x_n]$. Thus $f^m \\\\in \\\\mathfrak{a}$,
        so $f \\\\in \\\\sqrt{\\\\mathfrak{a}}$. $\\\\blacksquare$\\n\\n**Definition
        1.1.8.** A non-empty topological space $X$ is **irreducible** if it cannot
        be expressed as the union $X = X_1 \\\\cup X_2$ of two proper closed subsets
        $X_1, X_2 \\\\subsetneq X$. Equivalently, any two non-empty open subsets of
        $X$ have a non-empty intersection, and every non-empty open subset is dense
        in $X$. An **affine algebraic variety** (or simply **affine variety**) is
        an irreducible closed subset of $\\\\mathbb{A}^n_k$ (equipped with the induced
        Zariski topology). An open subset of an affine variety is called a **quasi-affine
        variety**.\\n\\n**Corollary 1.1.9.** *The operators $V$ and $I$ induce an
        inclusion-reversing bijection:*\\n$$\\\\left\\\\{ \\\\begin{array}{c} \\\\text{Algebraic
        sets} \\\\\\\\ \\\\text{in } \\\\mathbb{A}^n_k \\\\end{array} \\\\right\\\\}
        \\\\underset{V}{\\\\overset{I}{\\\\rightleftarrows}} \\\\left\\\\{ \\\\begin{array}{c}
        \\\\text{Radical ideals in} \\\\\\\\ k[x_1, \\\\dots, x_n] \\\\end{array}
        \\\\right\\\\}.$$\\n*Under this correspondence:*\\n1. *Affine varieties correspond
        to prime ideals.*\\n2. *Points of $\\\\mathbb{A}^n_k$ correspond to maximal
        ideals.*\\n\\n*Proof.* For any algebraic set $Y = V(\\\\mathfrak{a})$, we
        have $V(I(Y)) = V(I(V(\\\\mathfrak{a}))) = V(\\\\sqrt{\\\\mathfrak{a}}) =
        V(\\\\mathfrak{a}) = Y$. For any radical ideal $\\\\mathfrak{a}$, Theorem
        1.1.7 gives $I(V(\\\\mathfrak{a})) = \\\\sqrt{\\\\mathfrak{a}} = \\\\mathfrak{a}$.
        Thus $I$ and $V$ are mutually inverse bijections.\\n\\nTo prove (1), let $Y$
        be an algebraic set. Suppose $I(Y)$ is prime, and write $Y = Y_1 \\\\cup Y_2$
        with $Y_1, Y_2$ closed. Then $I(Y) = I(Y_1 \\\\cup Y_2) = I(Y_1) \\\\cap I(Y_2)
        \\\\supseteq I(Y_1)I(Y_2)$. Since $I(Y)$ is prime, either $I(Y_1) \\\\subseteq
        I(Y)$ or $I(Y_2) \\\\subseteq I(Y)$. Applying $V$, we get $Y \\\\subseteq
        Y_1$ or $Y \\\\subseteq Y_2$, so $Y = Y_1$ or $Y = Y_2$. Since $I(\\\\varnothing)
        = k[x_1, \\\\dots, x_n]$ is not prime, $Y \\\\neq \\\\varnothing$, so $Y$
        is irreducible. Conversely, suppose $Y$ is irreducible and $fg \\\\in I(Y)$.
        Then $Y \\\\subseteq V(fg) = V(f) \\\\cup V(g)$, so $Y = (Y \\\\cap V(f))
        \\\\cup (Y \\\\cap V(g))$. By irreducibility, $Y = Y \\\\cap V(f)$ or $Y =
        Y \\\\cap V(g)$, meaning $Y \\\\subseteq V(f)$ or $Y \\\\subseteq V(g)$, so
        $f \\\\in I(Y)$ or $g \\\\in I(Y)$. Thus $I(Y)$ is prime. Statement (2) is
        a restatement of Corollary 1.1.6. $\\\\blacksquare$\\n\\n**Definition 1.1.10.**
        A topological space $X$ is **Noetherian** if it satisfies the descending chain
        condition for closed subsets: for any sequence $Y_1 \\\\supseteq Y_2 \\\\supseteq
        Y_3 \\\\supseteq \\\\dots$ of closed subsets of $X$, there is an integer $r$
        such that $Y_r = Y_{r+1} = \\\\dots$.\\n\\n**Proposition 1.1.11.** *Every
        algebraic set $X \\\\subseteq \\\\mathbb{A}^n_k$ is a Noetherian topological
        space. Moreover, every non-empty closed subset $Y \\\\subseteq X$ can be expressed
        uniquely as a finite union $Y = Y_1 \\\\cup \\\\dots \\\\cup Y_r$ of irreducible
        closed subsets such that $Y_i \\\\not\\\\subseteq Y_j$ for $i \\\\neq j$.
        The $Y_i$ are called the **irreducible components** of $Y$.*\\n\\n*Proof.*
        A descending chain $Y_1 \\\\supseteq Y_2 \\\\supseteq \\\\dots$ of closed
        subsets of $\\\\mathbb{A}^n_k$ gives an ascending chain of ideals $I(Y_1)
        \\\\subseteq I(Y_2) \\\\subseteq \\\\dots$ in the Noetherian ring $k[x_1,
        \\\\dots, x_n]$, which must stabilize. Applying $V$ shows the chain of closed
        sets stabilizes.\\n\\nFor existence of the decomposition, let $\\\\mathcal{S}$
        be the set of non-empty closed subsets of $X$ that cannot be written as a
        finite union of irreducible closed subsets. If $\\\\mathcal{S} \\\\neq \\\\varnothing$,
        the Noetherian property implies $\\\\mathcal{S}$ has a minimal element $Z$.
        Since $Z \\\\in \\\\mathcal{S}$, $Z$ is not irreducible, so $Z = Z' \\\\cup
        Z''$ for proper closed subsets $Z', Z'' \\\\subsetneq Z$. By minimality of
        $Z$, we have $Z', Z'' \\\\notin \\\\mathcal{S}$, so both are finite unions
        of irreducible closed sets, hence so is $Z$, a contradiction. Thus $\\\\mathcal{S}
        = \\\\varnothing$. By discarding redundant subsets in $Y = Y_1 \\\\cup \\\\dots
        \\\\cup Y_r$, we may assume $Y_i \\\\not\\\\subseteq Y_j$ for $i \\\\neq j$.\\n\\nFor
        uniqueness, suppose $Y = Y_1 \\\\cup \\\\dots \\\\cup Y_r = Z_1 \\\\cup \\\\dots
        \\\\cup Z_s$ are two irredundant decompositions. Then for each $i$, $Y_i =
        Y_i \\\\cap Y = \\\\bigcup_{j=1}^s (Y_i \\\\cap Z_j)$. Since $Y_i$ is irreducible,
        $Y_i = Y_i \\\\cap Z_j$ for some $j$, so $Y_i \\\\subseteq Z_j$. By symmetry,
        $Z_j \\\\subseteq Y_l$ for some $l$. Then $Y_i \\\\subseteq Z_j \\\\subseteq
        Y_l$, which forces $i = l$ and $Y_i = Z_j$ by irredundancy. Thus the two decompositions
        are identical up to permutation. $\\\\blacksquare$\\n\\n---\\n\\n### 1.2 Coordinate
        Rings, Morphisms, and the Equivalence of Categories\\n\\n**Definition 1.2.1.**
        Let $Y \\\\subseteq \\\\mathbb{A}^n_k$ be an algebraic set. The **affine coordinate
        ring** of $Y$, denoted $A(Y)$ or $k[Y]$, is the quotient ring:\\n$$A(Y) =
        k[x_1, \\\\dots, x_n] / I(Y).$$\\n\\nSince $I(Y)$ is a radical ideal, $A(Y)$
        is a finitely generated **reduced** $k$-algebra (meaning it has no non-zero
        nilpotent elements). If $Y$ is an affine variety, $I(Y)$ is prime, so $A(Y)$
        is a finitely generated integral domain over $k$. In this case, the field
        of fractions of $A(Y)$ is called the **function field** (or field of rational
        functions) of $Y$, denoted $K(Y)$ or $k(Y)$.\\n\\nElements of $A(Y)$ are equivalence
        classes of polynomials modulo $I(Y)$, and hence define well-defined $k$-valued
        functions $Y \\\\to k$. We formalize the notion of regular functions locally
        to treat affine and quasi-affine varieties uniformly.\\n\\n**Definition 1.2.2.**
        Let $Y \\\\subseteq \\\\mathbb{A}^n_k$ be a quasi-affine variety (or more
        generally, locally closed subset). A function $f: Y \\\\to k$ is **regular
        at a point $P \\\\in Y$** if there is an open neighborhood $U$ of $P$ in $Y$
        and polynomials $g, h \\\\in k[x_1, \\\\dots, x_n]$ such that $h(Q) \\\\neq
        0$ for all $Q \\\\in U$, and $f(Q) = g(Q)/h(Q)$ for all $Q \\\\in U$. We say
        $f$ is **regular on $Y$** if it is regular at every point of $Y$. The ring
        of all regular functions on $Y$ is denoted $\\\\mathcal{O}(Y)$.\\n\\nFor an
        element $f \\\\in A(Y)$, we denote by $D(f) = \\\\{P \\\\in Y \\\\mid f(P)
        \\\\neq 0\\\\} = Y \\\\setminus V(f)$ the **principal open subset** associated
        to $f$.\\n\\n**Lemma 1.2.3.** *Let $Y \\\\subseteq \\\\mathbb{A}^n_k$ be an
        algebraic set. The principal open subsets $\\\\{D(f) \\\\mid f \\\\in A(Y)\\\\}$
        form a basis for the Zariski topology on $Y$.*\\n\\n*Proof.* Every open set
        $U \\\\subseteq Y$ is the complement of a closed set $Z = V(f_1, \\\\dots,
        f_r)$ for some $f_1, \\\\dots, f_r \\\\in A(Y)$. Thus $U = Y \\\\setminus
        \\\\bigcap_{i=1}^r V(f_i) = \\\\bigcup_{i=1}^r (Y \\\\setminus V(f_i)) = \\\\bigcup_{i=1}^r
        D(f_i)$. Furthermore, $D(f) \\\\cap D(g) = D(fg)$, so the collection is a
        basis. $\\\\blacksquare$\\n\\n**Theorem 1.2.4.** *Let $Y \\\\subseteq \\\\mathbb{A}^n_k$
        be an affine variety with affine coordinate ring $A(Y)$ and function field
        $K(Y)$.*\\n1. *For any point $P \\\\in Y$, define the **local ring of $P$
        on $Y$**, denoted $\\\\mathcal{O}_{Y,P}$ (or $\\\\mathcal{O}_P$), to be the
        ring of germs of regular functions on $Y$ near $P$ (that is, pairs $(U, f)$
        with $P \\\\in U \\\\subseteq Y$ open and $f \\\\in \\\\mathcal{O}(U)$, modulo
        $(U, f) \\\\sim (V, g)$ if $f|_{U \\\\cap V} = g|_{U \\\\cap V}$). Let $\\\\mathfrak{m}_P
        = \\\\{f \\\\in A(Y) \\\\mid f(P) = 0\\\\}$ be the maximal ideal of $A(Y)$
        corresponding to $P$. Then there is a natural isomorphism $\\\\mathcal{O}_{Y,P}
        \\\\cong A(Y)_{\\\\mathfrak{m}_P}$ of $k$-algebras.*\\n2. *For any non-empty
        open subset $U \\\\subseteq Y$, passing to germs embeds $\\\\mathcal{O}(U)$
        into $K(Y)$, and inside $K(Y)$ we have:*\\n$$\\\\mathcal{O}(U) = \\\\bigcap_{P
        \\\\in U} \\\\mathcal{O}_{Y,P}.$$\\n3. *In particular, for any $f \\\\in A(Y)
        \\\\setminus \\\\{0\\\\}$, $\\\\mathcal{O}(D(f)) \\\\cong A(Y)_f$ (the localization
        of $A(Y)$ at the multiplicative set $\\\\{1, f, f^2, \\\\dots\\\\}$), and
        globally:*\\n$$\\\\mathcal{O}(Y) \\\\cong A(Y).$$\\n\\n*Proof.* \\n(1) Any
        element of $A(Y)_{\\\\mathfrak{m}_P}$ is a fraction $g/h$ with $g, h \\\\in
        A(Y)$ and $h \\\\notin \\\\mathfrak{m}_P$, so $h(P) \\\\neq 0$. Thus $g/h$
        defines a regular function on the open neighborhood $D(h)$ of $P$, providing
        a well-defined $k$-algebra homomorphism $\\\\psi: A(Y)_{\\\\mathfrak{m}_P}
        \\\\to \\\\mathcal{O}_{Y,P}$. By definition of regularity at $P$, $\\\\psi$
        is surjective. Suppose $\\\\psi(g/h) = 0$. Then $g/h = 0$ on some open neighborhood
        $V \\\\subseteq D(h)$ of $P$. Thus $g = 0$ on $V$. Since $Y$ is irreducible,
        $Y$ cannot be the union of the proper closed set $Y \\\\setminus V$ and $V(g)$
        unless $V(g) = Y$. Thus $g = 0$ in $A(Y)$, so $\\\\psi$ is injective. Notice
        that $\\\\mathcal{O}_{Y,P}$ has a unique maximal ideal consisting of germs
        vanishing at $P$, and its residue field is $A(Y)_{\\\\mathfrak{m}_P}/\\\\mathfrak{m}_P
        A(Y)_{\\\\mathfrak{m}_P} \\\\cong A(Y)/\\\\mathfrak{m}_P \\\\cong k$.\\n\\n(2)
        Since $Y$ is irreducible, any two non-empty open sets intersect, so the field
        of fractions of $A(Y)$ is the target of injective maps $\\\\mathcal{O}_{Y,P}
        \\\\hookrightarrow K(Y)$ for all $P$. If $f \\\\in \\\\mathcal{O}(U)$, its
        germ at $P \\\\in U$ defines an element of $\\\\mathcal{O}_{Y,P}$, and compatibility
        on overlaps shows these germs define a single element in $\\\\bigcap_{P \\\\in
        U} \\\\mathcal{O}_{Y,P} \\\\subseteq K(Y)$. Conversely, an element of $\\\\bigcap_{P
        \\\\in U} \\\\mathcal{O}_{Y,P}$ can be written near each $P \\\\in U$ as $g_P/h_P$
        with $h_P(P) \\\\neq 0$, so it defines a regular function on $U$.\\n\\n(3)
        We prove $\\\\mathcal{O}(D(f)) = A(Y)_f$ inside $K(Y)$ (note that taking $f=1$
        yields $\\\\mathcal{O}(Y) = A(Y)$). Clearly $A(Y)_f \\\\subseteq \\\\mathcal{O}(D(f))$.
        Conversely, let $\\\\phi \\\\in \\\\mathcal{O}(D(f)) \\\\subseteq K(Y)$. Consider
        the **ideal of denominators** of $\\\\phi$ in $A(Y)$:\\n$$\\\\mathfrak{b}
        = \\\\{h \\\\in A(Y) \\\\mid h\\\\phi \\\\in A(Y)\\\\}.$$\\nClearly $\\\\mathfrak{b}$
        is an ideal of $A(Y)$. For every point $P \\\\in D(f)$, we have $\\\\phi \\\\in
        \\\\mathcal{O}_{Y,P} = A(Y)_{\\\\mathfrak{m}_P}$, so there exists $h_P \\\\in
        A(Y)$ with $h_P(P) \\\\neq 0$ such that $h_P \\\\phi \\\\in A(Y)$. Thus $h_P
        \\\\in \\\\mathfrak{b}$ and $P \\\\notin V(\\\\mathfrak{b})$. Consequently,
        $D(f) \\\\cap V(\\\\mathfrak{b}) = \\\\varnothing$, which means $V(\\\\mathfrak{b})
        \\\\subseteq V(f)$ in $Y$. By the Nullstellensatz (applied after lifting ideals
        to $k[x_1, \\\\dots, x_n]$), we have $f \\\\in I_Y(V(\\\\mathfrak{b})) = \\\\sqrt{\\\\mathfrak{b}}$.
        Therefore, $f^m \\\\in \\\\mathfrak{b}$ for some integer $m \\\\ge 1$, which
        by definition of $\\\\mathfrak{b}$ means $f^m \\\\phi \\\\in A(Y)$, so $\\\\phi
        \\\\in A(Y)_f$. $\\\\blacksquare$\\n\\n*Remark 1.2.5.* The same argument via
        partitions of unity in the ideal of denominators shows that $\\\\mathcal{O}(Y)
        \\\\cong A(Y)$ holds for any (possibly reducible) algebraic set $Y$, if we
        avoid embedding into a function field and instead use the Nullstellensatz
        directly on local representations.\\n\\n**Definition 1.2.6.** Let $X$ and
        $Y$ be two varieties (affine or quasi-affine). A **morphism** $\\\\varphi:
        X \\\\to Y$ is a continuous map (with respect to the Zariski topologies) such
        that for every open subset $V \\\\subseteq Y$ and every regular function $f:
        V \\\\to k$ in $\\\\mathcal{O}(V)$, the composition $f \\\\circ \\\\varphi:
        \\\\varphi^{-1}(V) \\\\to k$ is a regular function in $\\\\mathcal{O}(\\\\varphi^{-1}(V))$.
        An **isomorphism** is a morphism $\\\\varphi: X \\\\to Y$ that admits an inverse
        morphism $\\\\psi: Y \\\\to X$ with $\\\\psi \\\\circ \\\\varphi = \\\\operatorname{id}_X$
        and $\\\\varphi \\\\circ \\\\psi = \\\\operatorname{id}_Y$.\\n\\n**Proposition
        1.2.7.** *Let $X \\\\subseteq \\\\mathbb{A}^n_k$ be a variety and $Y \\\\subseteq
        \\\\mathbb{A}^m_k$ be an affine variety. A map of sets $\\\\varphi: X \\\\to
        Y$ is a morphism if and only if there exist regular functions $f_1, \\\\dots,
        f_m \\\\in \\\\mathcal{O}(X)$ such that $\\\\varphi(P) = (f_1(P), \\\\dots,
        f_m(P))$ for all $P \\\\in X$.*\\n\\n*Proof.* Let $y_1, \\\\dots, y_m \\\\in
        A(Y) = \\\\mathcal{O}(Y)$ be the coordinate functions on $Y \\\\subseteq \\\\mathbb{A}^m_k$.
        If $\\\\varphi: X \\\\to Y$ is a morphism, then taking $V = Y$, the compositions
        $f_i = y_i \\\\circ \\\\varphi$ must belong to $\\\\mathcal{O}(X)$, and clearly
        $\\\\varphi(P) = (f_1(P), \\\\dots, f_m(P))$.\\n\\nConversely, suppose $\\\\varphi(P)
        = (f_1(P), \\\\dots, f_m(P))$ for $f_i \\\\in \\\\mathcal{O}(X)$ with $\\\\varphi(X)
        \\\\subseteq Y$. First, for any polynomial $g \\\\in k[y_1, \\\\dots, y_m]$,
        the function $g \\\\circ \\\\varphi = g(f_1, \\\\dots, f_m)$ is in $\\\\mathcal{O}(X)$
        since $\\\\mathcal{O}(X)$ is a $k$-algebra. Notice that the zero locus on
        $X$ of a regular function $h \\\\in \\\\mathcal{O}(X)$ is closed: locally
        near $P \\\\in X$, $h = p/q$ on an open $U$, so $V(h) \\\\cap U = V(p) \\\\cap
        U$ is closed in $U$. Thus $\\\\varphi^{-1}(V(g_1, \\\\dots, g_r)) = \\\\bigcap_{j=1}^r
        V(g_j \\\\circ \\\\varphi)$ is closed in $X$, proving $\\\\varphi$ is continuous.
        Finally, if $V \\\\subseteq Y$ is open and $f \\\\in \\\\mathcal{O}(V)$, near
        any $P \\\\in \\\\varphi^{-1}(V)$ we can write $f = g/h$ on a neighborhood
        $W \\\\subseteq V$ of $\\\\varphi(P)$. Then on $\\\\varphi^{-1}(W)$, $f \\\\circ
        \\\\varphi = (g \\\\circ \\\\varphi)/(h \\\\circ \\\\varphi)$ is a quotient
        of elements in $\\\\mathcal{O}(X)$ with non-vanishing denominator, hence locally
        a quotient of polynomials, so $f \\\\circ \\\\varphi \\\\in \\\\mathcal{O}(\\\\varphi^{-1}(V))$.
        $\\\\blacksquare$\\n\\n**Theorem 1.2.8 (Equivalence of Categories).** *Let
        $\\\\mathsf{AffVar}_k$ be the category of affine varieties over $k$ and morphisms
        of varieties, and let $\\\\mathsf{IntDom}^{\\\\text{fg}}_k$ be the category
        of finitely generated integral domains over $k$ and $k$-algebra homomorphisms.
        The functor $X \\\\mapsto A(X)$, sending a morphism $\\\\varphi: X \\\\to
        Y$ to the pullback $\\\\varphi^*: A(Y) \\\\to A(X)$ given by $\\\\varphi^*(f)
        = f \\\\circ \\\\varphi$, is a contravariant equivalence of categories.*\\n*(More
        generally, the category of affine algebraic sets over $k$ is anti-equivalent
        to the category of finitely generated reduced $k$-algebras.)*\\n\\n*Proof.*
        First, we show the functor $A(-)$ is fully faithful, i.e., for any affine
        varieties $X \\\\subseteq \\\\mathbb{A}^n_k$ and $Y \\\\subseteq \\\\mathbb{A}^m_k$,
        the map:\\n$$\\\\operatorname{Hom}_{\\\\mathsf{AffVar}_k}(X, Y) \\\\longrightarrow
        \\\\operatorname{Hom}_{k\\\\text{-alg}}(A(Y), A(X)), \\\\qquad \\\\varphi
        \\\\longmapsto \\\\varphi^*$$\\nis a bijection. Let $y_1, \\\\dots, y_m$ be
        the coordinate generators of $A(Y) = k[y_1, \\\\dots, y_m]/I(Y)$. Any $k$-algebra
        homomorphism $\\\\alpha: A(Y) \\\\to A(X)$ is uniquely determined by the images
        $f_i = \\\\alpha(\\\\bar{y}_i) \\\\in A(X) = \\\\mathcal{O}(X)$ for $i = 1,
        \\\\dots, m$. These elements $f_1, \\\\dots, f_m \\\\in A(X)$ satisfy $g(f_1,
        \\\\dots, f_m) = 0$ in $A(X)$ for all $g \\\\in I(Y)$. Evaluating at any point
        $P \\\\in X$, we see that $g(f_1(P), \\\\dots, f_m(P)) = 0$ for all $g \\\\in
        I(Y)$, which means $\\\\varphi(P) = (f_1(P), \\\\dots, f_m(P))$ lies in $V(I(Y))
        = Y$. By Proposition 1.2.7, this defines a morphism $\\\\varphi: X \\\\to
        Y$ with $\\\\varphi^*(\\\\bar{y}_i) = f_i = \\\\alpha(\\\\bar{y}_i)$, so $\\\\varphi^*
        = \\\\alpha$. Uniqueness is clear because if $\\\\varphi^* = \\\\psi^*$, then
        $y_i \\\\circ \\\\varphi = y_i \\\\circ \\\\psi$ for all $i$, so $\\\\varphi
        = \\\\psi$.\\n\\nSecond, we show $A(-)$ is essentially surjective. Let $B$
        be a finitely generated integral domain over $k$. Choose generators $b_1,
        \\\\dots, b_n$ of $B$ as a $k$-algebra, giving a surjective $k$-algebra homomorphism
        $\\\\pi: k[x_1, \\\\dots, x_n] \\\\to B$ sending $x_i \\\\mapsto b_i$. Let
        $\\\\mathfrak{p} = \\\\ker(\\\\pi)$. Since $B \\\\cong k[x_1, \\\\dots, x_n]/\\\\mathfrak{p}$
        is an integral domain, $\\\\mathfrak{p}$ is a prime ideal. By Corollary 1.1.9,
        $X = V(\\\\mathfrak{p}) \\\\subseteq \\\\mathbb{A}^n_k$ is an affine variety
        with $I(X) = I(V(\\\\mathfrak{p})) = \\\\mathfrak{p}$. Thus $A(X) = k[x_1,
        \\\\dots, x_n]/\\\\mathfrak{p} \\\\cong B$. $\\\\blacksquare$\\n\\n---\\n\\n###
        1.3 Projective Space and Graded Rings\\n\\nTo obtain a satisfactory geometric
        theory where intersections behave uniformly (as in B\xE9zout's Theorem) and
        varieties can be compactified, we introduce projective space.\\n\\n**Definition
        1.3.1.** **Projective $n$-space** over $k$, denoted $\\\\mathbb{P}^n_k$ (or
        $\\\\mathbb{P}^n$), is the set of equivalence classes of $(n+1)$-tuples $(a_0,
        a_1, \\\\dots, a_n) \\\\in \\\\mathbb{A}^{n+1}_k \\\\setminus \\\\{(0, \\\\dots,
        0)\\\\}$ under the equivalence relation:\\n$$(a_0, \\\\dots, a_n) \\\\sim
        (\\\\lambda a_0, \\\\dots, \\\\lambda a_n) \\\\quad \\\\text{for all } \\\\lambda
        \\\\in k^\\\\times = k \\\\setminus \\\\{0\\\\}.$$\\nThe equivalence class
        of $(a_0, \\\\dots, a_n)$ is denoted $[a_0 : a_1 : \\\\dots : a_n]$, and $a_0,
        \\\\dots, a_n$ are called the **homogeneous coordinates** of the point.\\n\\nConsider
        the polynomial ring $S = k[x_0, x_1, \\\\dots, x_n]$. It has a natural grading
        $S = \\\\bigoplus_{d \\\\ge 0} S_d$, where $S_d$ is the $k$-vector space of
        **homogeneous polynomials** of degree $d$ (along with $0$). While $f \\\\in
        S$ does not define a function on $\\\\mathbb{P}^n_k$, if $f \\\\in S_d$ is
        homogeneous of degree $d$, it satisfies:\\n$$f(\\\\lambda a_0, \\\\dots, \\\\lambda
        a_n) = \\\\lambda^d f(a_0, \\\\dots, a_n).$$\\nConsequently, the condition
        $f(a_0, \\\\dots, a_n) = 0$ is independent of the choice of homogeneous coordinates,
        so $f(P) = 0$ is well-defined for $P \\\\in \\\\mathbb{P}^n_k$.\\n\\n**Definition
        1.3.2.** An ideal $\\\\mathfrak{a} \\\\subseteq S$ is **homogeneous** if for
        every $f \\\\in \\\\mathfrak{a}$, Writing $f = \\\\sum_{d=0}^m f_d$ with $f_d
        \\\\in S_d$, each homogeneous component $f_d$ belongs to $\\\\mathfrak{a}$.
        Equivalently, $\\\\mathfrak{a} = \\\\bigoplus_{d \\\\ge 0} (\\\\mathfrak{a}
        \\\\cap S_d)$, or $\\\\mathfrak{a}$ is generated by a set of homogeneous polynomials.\\n\\nOne
        checks readily that sums, products, intersections, and radicals of homogeneous
        ideals are homogeneous. A homogeneous ideal $\\\\mathfrak{p} \\\\subsetneq
        S$ is prime if and only if for any homogeneous elements $f, g \\\\in S$, $fg
        \\\\in \\\\mathfrak{p} \\\\implies f \\\\in \\\\mathfrak{p}$ or $g \\\\in
        \\\\mathfrak{p}$.\\n\\n**Definition 1.3.3.** For any set $T \\\\subseteq S$
        of homogeneous polynomials (or any homogeneous ideal $\\\\mathfrak{a}$), we
        define its zero locus in $\\\\mathbb{P}^n_k$:\\n$$V_+(T) = \\\\{P \\\\in \\\\mathbb{P}^n_k
        \\\\mid f(P) = 0 \\\\text{ for all } f \\\\in T\\\\}.$$\\nSubsets of the form
        $V_+(\\\\mathfrak{a})$ for homogeneous ideals $\\\\mathfrak{a} \\\\subseteq
        S$ are called **projective algebraic sets**, and they form the closed sets
        of the **Zariski topology** on $\\\\mathbb{P}^n_k$. An irreducible projective
        algebraic set is called a **projective variety**, and an open subset of a
        projective variety is called a **quasi-projective variety**. For any subset
        $Y \\\\subseteq \\\\mathbb{P}^n_k$, the **homogeneous ideal of $Y$**, denoted
        $I_+(Y)$, is the ideal in $S$ generated by $\\\\{f \\\\in S \\\\text{ homogeneous}
        \\\\mid f(P) = 0 \\\\text{ for all } P \\\\in Y\\\\}$.\\n\\nNotice that the
        homogeneous ideal $\\\\mathfrak{m}_+ = \\\\bigoplus_{d \\u003e 0} S_d = (x_0,
        x_1, \\\\dots, x_n)$ has $V_+(\\\\mathfrak{m}_+) = \\\\varnothing$ because
        the point $(0, \\\\dots, 0)$ is excluded from $\\\\mathbb{P}^n_k$. For this
        reason, $\\\\mathfrak{m}_+$ is called the **irrelevant maximal ideal**.\\n\\n**Theorem
        1.3.4 (Homogeneous Nullstellensatz).** *Let $\\\\mathfrak{a} \\\\subseteq
        S = k[x_0, \\\\dots, x_n]$ be a homogeneous ideal.*\\n1. $V_+(\\\\mathfrak{a})
        = \\\\varnothing$ *if and only if* $\\\\mathfrak{m}_+ \\\\subseteq \\\\sqrt{\\\\mathfrak{a}}$
        *(equivalently, $\\\\mathfrak{m}_+^N \\\\subseteq \\\\mathfrak{a}$ for some
        $N \\\\ge 1$, or $\\\\bigoplus_{d \\\\ge N} S_d \\\\subseteq \\\\mathfrak{a}$).*\\n2.
        *If $V_+(\\\\mathfrak{a}) \\\\neq \\\\varnothing$, then $I_+(V_+(\\\\mathfrak{a}))
        = \\\\sqrt{\\\\mathfrak{a}}$.*\\n\\n*Proof.* Let $\\\\pi: \\\\mathbb{A}^{n+1}_k
        \\\\setminus \\\\{0\\\\} \\\\to \\\\mathbb{P}^n_k$ be the canonical projection.
        For any non-empty projective algebraic set $Y = V_+(\\\\mathfrak{a}) \\\\subseteq
        \\\\mathbb{P}^n_k$, define the **affine cone** over $Y$ to be $C(Y) = \\\\pi^{-1}(Y)
        \\\\cup \\\\{0\\\\} \\\\subseteq \\\\mathbb{A}^{n+1}_k$. Notice that if $\\\\mathfrak{a}$
        contains no non-zero constants (i.e., $\\\\mathfrak{a} \\\\subseteq \\\\mathfrak{m}_+$),
        then the affine zero locus $V(\\\\mathfrak{a}) \\\\subseteq \\\\mathbb{A}^{n+1}_k$
        is precisely $\\\\pi^{-1}(V_+(\\\\mathfrak{a})) \\\\cup \\\\{0\\\\}$.\\n\\n(1)
        We have $V_+(\\\\mathfrak{a}) = \\\\varnothing$ in $\\\\mathbb{P}^n_k$ if
        and only if $V(\\\\mathfrak{a}) \\\\subseteq \\\\{0\\\\}$ in $\\\\mathbb{A}^{n+1}_k$.
        By the affine Nullstellensatz (Theorem 1.1.7), $V(\\\\mathfrak{a}) \\\\subseteq
        \\\\{0\\\\} = V(\\\\mathfrak{m}_+)$ if and only if $\\\\mathfrak{m}_+ = I(\\\\{0\\\\})
        \\\\subseteq I(V(\\\\mathfrak{a})) = \\\\sqrt{\\\\mathfrak{a}}$. Since $\\\\mathfrak{m}_+$
        is finitely generated by $x_0, \\\\dots, x_n$, $\\\\mathfrak{m}_+ \\\\subseteq
        \\\\sqrt{\\\\mathfrak{a}}$ is equivalent to $\\\\mathfrak{m}_+^N \\\\subseteq
        \\\\mathfrak{a}$ for large $N$.\\n\\n(2) Suppose $V_+(\\\\mathfrak{a}) \\\\neq
        \\\\varnothing$. Then $V(\\\\mathfrak{a}) = \\\\pi^{-1}(V_+(\\\\mathfrak{a}))
        \\\\cup \\\\{0\\\\}$. For any homogeneous polynomial $f \\\\in S$ of positive
        degree, $f$ vanishes on $V_+(\\\\mathfrak{a})$ if and only if $f$ vanishes
        on $\\\\pi^{-1}(V_+(\\\\mathfrak{a})) \\\\cup \\\\{0\\\\} = V(\\\\mathfrak{a})$.
        Thus $I_+(V_+(\\\\mathfrak{a}))$ and the affine ideal $I(V(\\\\mathfrak{a}))$
        have the exact same homogeneous elements, and since both are homogeneous ideals,
        $I_+(V_+(\\\\mathfrak{a})) = I(V(\\\\mathfrak{a})) = \\\\sqrt{\\\\mathfrak{a}}$
        by Theorem 1.1.7. $\\\\blacksquare$\\n\\nProjective space $\\\\mathbb{P}^n_k$
        is covered by $n+1$ standard open subsets that are isomorphic to affine $n$-space
        $\\\\mathbb{A}^n_k$. For each $i \\\\in \\\\{0, 1, \\\\dots, n\\\\}$, define:\\n$$U_i
        = D_+(x_i) = \\\\{[a_0 : \\\\dots : a_n] \\\\in \\\\mathbb{P}^n_k \\\\mid
        a_i \\\\neq 0\\\\}.$$\\n\\n**Proposition 1.3.5.** *For each $i = 0, \\\\dots,
        n$, the map $\\\\phi_i: U_i \\\\to \\\\mathbb{A}^n_k$ given by:*\\n$$\\\\phi_i([a_0
        : \\\\dots : a_n]) = \\\\left( \\\\frac{a_0}{a_i}, \\\\dots, \\\\frac{\\\\widehat{a_i}}{a_i},
        \\\\dots, \\\\frac{a_n}{a_i} \\\\right)$$\\n*(where the caret denotes omission)
        is a homeomorphism with respect to the Zariski topologies. Furthermore, for
        any projective variety $Y \\\\subseteq \\\\mathbb{P}^n_k$, each non-empty
        intersection $Y_i = Y \\\\cap U_i$ is identified via $\\\\phi_i$ with an affine
        variety in $\\\\mathbb{A}^n_k$.*\\n\\n*Proof.* Clearly $\\\\phi_i$ is a bijection
        with inverse $(b_1, \\\\dots, b_n) \\\\mapsto [b_1 : \\\\dots : 1 : \\\\dots
        : b_n]$ (with $1$ in the $i$-th position). Identify the coordinate ring of
        $\\\\mathbb{A}^n_k$ with $k[y_0, \\\\dots, \\\\widehat{y_i}, \\\\dots, y_n]$,
        where $y_j = x_j/x_i$. Define the **dehomogenization** map $\\\\alpha_i: k[x_0,
        \\\\dots, x_n] \\\\to k[y_j]$ by sending $x_i \\\\mapsto 1$ and $x_j \\\\mapsto
        y_j$ for $j \\\\neq i$. Conversely, for $g \\\\in k[y_j]$ of degree $d$, its
        **homogenization** is $\\\\beta_i(g) = x_i^d g(x_0/x_i, \\\\dots, x_n/x_i)
        \\\\in S_d$.\\n\\nFor any homogeneous ideal $\\\\mathfrak{a} \\\\subseteq
        S$, a point $P \\\\in U_i$ lies in $V_+(\\\\mathfrak{a}) \\\\cap U_i$ if and
        only if $\\\\phi_i(P) \\\\in V(\\\\alpha_i(\\\\mathfrak{a})) \\\\subseteq
        \\\\mathbb{A}^n_k$. Conversely, any closed set $V(\\\\mathfrak{b}) \\\\subseteq
        \\\\mathbb{A}^n_k$ satisfies $\\\\phi_i^{-1}(V(\\\\mathfrak{b})) = V_+(\\\\beta_i(\\\\mathfrak{b}))
        \\\\cap U_i$. Thus $\\\\phi_i$ and $\\\\phi_i^{-1}$ take closed sets to closed
        sets, establishing that $\\\\phi_i$ is a homeomorphism. Since $Y_i = Y \\\\cap
        U_i$ is a non-empty open subset of the irreducible space $Y$, $Y_i$ is irreducible
        and closed in $U_i$, so $\\\\phi_i(Y_i)$ is an affine variety in $\\\\mathbb{A}^n_k$.
        $\\\\blacksquare$\\n\\nThis local affine structure allows us to define regular
        functions and morphisms on quasi-projective varieties.\\n\\n**Definition 1.3.6.**
        Let $Y \\\\subseteq \\\\mathbb{P}^n_k$ be a quasi-projective variety. A function
        $f: Y \\\\to k$ is **regular at a point $P \\\\in Y$** if there is an open
        neighborhood $U \\\\subseteq Y$ of $P$ and homogeneous polynomials $g, h \\\\in
        k[x_0, \\\\dots, x_n]$ of the **same degree** such that $h(Q) \\\\neq 0$ for
        all $Q \\\\in U$, and $f(Q) = g(Q)/h(Q)$ for all $Q \\\\in U$. The ring of
        functions regular at all points of $Y$ is denoted $\\\\mathcal{O}(Y)$.\\n\\nNotice
        that because $g$ and $h$ have the same degree $d$, the ratio $g(a_0, \\\\dots,
        a_n)/h(a_0, \\\\dots, a_n)$ is invariant under scaling $(a_0, \\\\dots, a_n)
        \\\\mapsto (\\\\lambda a_0, \\\\dots, \\\\lambda a_n)$ and hence defines a
        genuine function on $U$. Moreover, on $U_i \\\\cong \\\\mathbb{A}^n_k$, this
        definition of regularity agrees identically with Definition 1.2.2 via dehomogenization.\\n\\nFor
        a projective variety $Y \\\\subseteq \\\\mathbb{P}^n_k$, the **homogeneous
        coordinate ring** of $Y$ is $S(Y) = k[x_0, \\\\dots, x_n]/I_+(Y)$, which is
        a graded integral domain $S(Y) = \\\\bigoplus_{d \\\\ge 0} S(Y)_d$. Its **function
        field** $K(Y)$ is defined to be the subfield of $\\\\operatorname{Frac}(S(Y))$
        consisting of homogeneous fractions of degree $0$:\\n$$K(Y) = \\\\left\\\\{
        \\\\frac{g}{h} \\\\in \\\\operatorname{Frac}(S(Y)) \\\\,\\\\middle|\\\\, g,
        h \\\\in S(Y)_d \\\\text{ for some } d \\\\ge 0, \\\\, h \\\\neq 0 \\\\right\\\\}.$$\\nFor
        any $i$ with $Y \\\\cap U_i \\\\neq \\\\varnothing$, one checks immediately
        that $K(Y)$ is canonically isomorphic to the affine function field $K(Y \\\\cap
        U_i)$ and for $P \\\\in Y \\\\cap U_i$, $\\\\mathcal{O}_{Y,P} \\\\cong \\\\mathcal{O}_{Y
        \\\\cap U_i, P}$ is the subring of $K(Y)$ consisting of homogeneous fractions
        $g/h$ of degree $0$ with $h(P) \\\\neq 0$.\\n\\n---\\n\\n### 1.4 Rational
        Maps, Blowing Up, and Dimension Theory\\n\\nBecause varieties are irreducible,
        any non-empty open subset $U \\\\subseteq X$ is dense, and local data on $U$
        often determines global birational invariants of $X$.\\n\\n**Definition 1.4.1.**
        Let $X$ and $Y$ be varieties. A **rational map** $\\\\varphi: X \\\\dashrightarrow
        Y$ is an equivalence class of pairs $(U, \\\\varphi_U)$ where $U \\\\subseteq
        X$ is a non-empty open subset and $\\\\varphi_U: U \\\\to Y$ is a morphism,
        under the equivalence relation $(U, \\\\varphi_U) \\\\sim (V, \\\\varphi_V)$
        if $\\\\varphi_U|_{U \\\\cap V} = \\\\varphi_V|_{U \\\\cap V}$. A rational
        map $\\\\varphi: X \\\\dashrightarrow Y$ is **dominant** if for some (hence
        every) representative $(U, \\\\varphi_U)$, the image $\\\\varphi_U(U)$ is
        dense in $Y$.\\n\\nA **birational map** $\\\\varphi: X \\\\dashrightarrow
        Y$ is a dominant rational map that admits an inverse dominant rational map
        $\\\\psi: Y \\\\dashrightarrow X$ such that $\\\\psi \\\\circ \\\\varphi =
        \\\\operatorname{id}_X$ and $\\\\varphi \\\\circ \\\\psi = \\\\operatorname{id}_Y$
        as rational maps. If a birational map between $X$ and $Y$ exists, we say $X$
        and $Y$ are **birationally equivalent** (or simply **birational**).\\n\\n**Theorem
        1.4.2.** *For any two varieties $X$ and $Y$ over $k$, the assignment $(U,
        \\\\varphi_U) \\\\mapsto \\\\varphi_U^*$ induces a bijection between the set
        of dominant rational maps $\\\\varphi: X \\\\dashrightarrow Y$ and the set
        of $k$-algebra homomorphisms $K(Y) \\\\hookrightarrow K(X)$. Consequently,
        the category of varieties over $k$ and dominant rational maps is contravariantly
        equivalent to the category of finitely generated field extensions of $k$.
        In particular, $X$ and $Y$ are birationally equivalent if and only if $K(X)
        \\\\cong K(Y)$ as $k$-algebras.*\\n\\n*Proof.* By shrinking $U \\\\subseteq
        X$ and replacing $Y$ by an open affine chart that intersects $\\\\varphi_U(U)$,
        we may assume $Y \\\\subseteq \\\\mathbb{A}^m_k$ is affine. If $\\\\varphi_U:
        U \\\\to Y$ is dominant, the pullback $\\\\varphi_U^*: A(Y) \\\\to \\\\mathcal{O}(U)
        \\\\subseteq K(X)$ is injective (if $\\\\varphi_U^*(f) = 0$, then $\\\\varphi_U(U)
        \\\\subseteq V(f)$, so by density $Y = V(f)$ and $f = 0$). Since $A(Y)$ is
        an integral domain with fraction field $K(Y)$, $\\\\varphi_U^*$ extends uniquely
        to a field embedding $K(Y) \\\\hookrightarrow K(X)$.\\n\\nConversely, given
        a $k$-algebra homomorphism $\\\\alpha: K(Y) \\\\to K(X)$, let $y_1, \\\\dots,
        y_m$ generate $A(Y)$. Their images $\\\\alpha(y_1), \\\\dots, \\\\alpha(y_m)
        \\\\in K(X)$ can be written with a common denominator on some affine open
        chart of $X$, hence define regular functions on a non-empty principal open
        subset $U \\\\subseteq X$. This yields a morphism $\\\\varphi_U: U \\\\to
        Y$ whose image cannot be contained in any proper closed subset $V(f)$ (since
        $\\\\alpha(f) \\\\neq 0$ for $f \\\\neq 0$), so $\\\\varphi_U$ is dominant.
        For essential surjectivity, if $K = k(\\\\alpha_1, \\\\dots, \\\\alpha_n)$
        is a finitely generated field extension of $k$, let $\\\\mathfrak{p}$ be the
        kernel of $k[x_1, \\\\dots, x_n] \\\\to K$ sending $x_i \\\\mapsto \\\\alpha_i$;
        then $X = V(\\\\mathfrak{p}) \\\\subseteq \\\\mathbb{A}^n_k$ is an affine
        variety with $K(X) \\\\cong K$. $\\\\blacksquare$\\n\\nBefore proceeding to
        dimension theory, we need to verify that the cartesian product of two varieties
        is a variety. First, the product $\\\\mathbb{A}^n_k \\\\times \\\\mathbb{A}^m_k
        = \\\\mathbb{A}^{n+m}_k$ has a Zariski topology (note: this is strictly finer
        than the product topology for $n, m \\\\ge 1$). For projective spaces, we
        use the **Segre embedding**:\\n$$\\\\sigma_{n,m}: \\\\mathbb{P}^n_k \\\\times
        \\\\mathbb{P}^m_k \\\\longrightarrow \\\\mathbb{P}^{(n+1)(m+1)-1}_k, \\\\qquad
        ([a_0 : \\\\dots : a_n], [b_0 : \\\\dots : b_m]) \\\\longmapsto [a_0 b_0 :
        \\\\dots : a_i b_j : \\\\dots : a_n b_m].$$\\nLetting $z_{ij}$ ($0 \\\\le
        i \\\\le n, \\\\, 0 \\\\le j \\\\le m$) be homogeneous coordinates on $\\\\mathbb{P}^{nm+n+m}_k$,
        it is a classical exercise to verify that $\\\\sigma_{n,m}$ is injective and
        its image is the closed projective algebraic set defined by the $2 \\\\times
        2$ minors of the matrix $(z_{ij})$:\\n$$\\\\operatorname{Im}(\\\\sigma_{n,m})
        = V_+\\\\left(\\\\{z_{ij} z_{kl} - z_{il} z_{kj} \\\\mid 0 \\\\le i,k \\\\le
        n, \\\\, 0 \\\\le j,l \\\\le m\\\\}\\\\right).$$\\nThis endows $\\\\mathbb{P}^n_k
        \\\\times \\\\mathbb{P}^m_k$ (and hence $\\\\mathbb{A}^n_k \\\\times \\\\mathbb{P}^m_k$)
        with the structure of a quasi-projective variety.\\n\\n**Example 1.4.3 (Blowing
        up a point in $\\\\mathbb{A}^n_k$).** A central birational construction is
        the **blow-up**. We define the blow-up of $\\\\mathbb{A}^n_k$ at the origin
        $O = (0, \\\\dots, 0)$ to be the closed subset $\\\\widetilde{\\\\mathbb{A}}^n_k
        = \\\\operatorname{Bl}_O(\\\\mathbb{A}^n_k) \\\\subseteq \\\\mathbb{A}^n_k
        \\\\times \\\\mathbb{P}^{n-1}_k$ defined by the equations:\\n$$\\\\widetilde{\\\\mathbb{A}}^n_k
        = \\\\left\\\\{ ((x_1, \\\\dots, x_n), [y_1 : \\\\dots : y_n]) \\\\in \\\\mathbb{A}^n_k
        \\\\times \\\\mathbb{P}^{n-1}_k \\\\,\\\\middle|\\\\, x_i y_j = x_j y_i \\\\text{
        for all } 1 \\\\le i, j \\\\le n \\\\right\\\\}.$$\\nLet $\\\\pi: \\\\widetilde{\\\\mathbb{A}}^n_k
        \\\\to \\\\mathbb{A}^n_k$ be the projection onto the first factor.\\n1. If
        $P = (x_1, \\\\dots, x_n) \\\\neq O$, then some $x_i \\\\neq 0$, and the equations
        $y_j = (x_j/x_i) y_i$ uniquely determine the point $[y_1 : \\\\dots : y_n]
        = [x_1 : \\\\dots : x_n] \\\\in \\\\mathbb{P}^{n-1}_k$. Thus $\\\\pi$ restricts
        to an isomorphism:\\n$$\\\\widetilde{\\\\mathbb{A}}^n_k \\\\setminus \\\\pi^{-1}(O)
        \\\\stackrel{\\\\sim}{\\\\longrightarrow} \\\\mathbb{A}^n_k \\\\setminus \\\\{O\\\\}.$$\\n2.
        Over $O = (0, \\\\dots, 0)$, the equations $0 \\\\cdot y_j = 0 \\\\cdot y_i$
        impose no conditions on $[y_1 : \\\\dots : y_n]$, so the fiber $\\\\pi^{-1}(O)
        = \\\\{O\\\\} \\\\times \\\\mathbb{P}^{n-1}_k \\\\cong \\\\mathbb{P}^{n-1}_k$,
        which is called the **exceptional divisor** $E$. Geometrically, blowing up
        replaces the origin $O$ by the projective space of all lines through $O$.\\n3.
        $\\\\widetilde{\\\\mathbb{A}}^n_k$ is covered by $n$ open affine charts $W_i
        = \\\\widetilde{\\\\mathbb{A}}^n_k \\\\cap (\\\\mathbb{A}^n_k \\\\times U_i)$
        where $y_i \\\\neq 0$. Setting $y_i = 1$, the equations become $x_j = x_i
        y_j$ for $j \\\\neq i$, showing $W_i \\\\cong \\\\mathbb{A}^n_k$ with coordinates
        $(y_1, \\\\dots, x_i, \\\\dots, y_n)$. In particular, $\\\\widetilde{\\\\mathbb{A}}^n_k$
        is irreducible (being the union of irreducible open sets $W_i$ that intersect
        along $\\\\pi^{-1}(\\\\mathbb{A}^n_k \\\\setminus \\\\{O\\\\})$) and birational
        to $\\\\mathbb{A}^n_k$. For any affine variety $Y \\\\subseteq \\\\mathbb{A}^n_k$
        passing through $O$, the **blow-up of $Y$ at $O$** (or **strict transform**
        of $Y$) is defined to be the Zariski closure $\\\\widetilde{Y} = \\\\overline{\\\\pi^{-1}(Y
        \\\\setminus \\\\{O\\\\})}$ inside $\\\\widetilde{\\\\mathbb{A}}^n_k$.\\n\\nWe
        now develop the theory of dimension for varieties and commutative rings.\\n\\n**Definition
        1.4.4.** Let $X$ be a topological space. The **dimension** of $X$, denoted
        $\\\\dim X$, is the supremum of all integers $d \\\\ge 0$ such that there
        exists a chain of distinct irreducible closed subsets of $X$:\\n$$Z_0 \\\\subsetneq
        Z_1 \\\\subsetneq Z_2 \\\\subsetneq \\\\dots \\\\subsetneq Z_d \\\\subseteq
        X.$$\\nSimilarly, for a commutative ring $A$, the **Krull dimension** of $A$,
        denoted $\\\\dim A$, is the supremum of all integers $d \\\\ge 0$ such that
        there exists a chain of prime ideals in $A$:\\n$$\\\\mathfrak{p}_0 \\\\subsetneq
        \\\\mathfrak{p}_1 \\\\subsetneq \\\\mathfrak{p}_2 \\\\subsetneq \\\\dots \\\\subsetneq
        \\\\mathfrak{p}_d \\\\subsetneq A.$$\\nThe **height** of a prime ideal $\\\\mathfrak{p}
        \\\\subset A$, denoted $\\\\operatorname{ht}(\\\\mathfrak{p})$, is the supremum
        of lengths $d$ of chains of prime ideals $\\\\mathfrak{p}_0 \\\\subsetneq
        \\\\dots \\\\subsetneq \\\\mathfrak{p}_d = \\\\mathfrak{p}$, which is clearly
        equal to $\\\\dim A_\\\\mathfrak{p}$.\\n\\nBy Corollary 1.1.9, for any affine
        variety $Y$, chains of irreducible closed subsets of $Y$ correspond bijectively
        (with reversed inclusions) to chains of prime ideals in the coordinate ring
        $A(Y)$. Thus:\\n$$\\\\dim Y = \\\\dim A(Y).$$\\n\\nTo compute the dimension
        of affine varieties and relate it to the transcendence degree of their function
        fields, we prove the Noether Normalization Lemma and the Going-Up and Going-Down
        theorems for integral extensions.\\n\\n**Theorem 1.4.5 (Noether Normalization
        Lemma).** *Let $k$ be an arbitrary field, and let $A = k[a_1, \\\\dots, a_n]$
        be a finitely generated $k$-algebra. Then there exist elements $y_1, \\\\dots,
        y_d \\\\in A$ that are algebraically independent over $k$ such that $A$ is
        integral over the polynomial subring $k[y_1, \\\\dots, y_d]$ (and hence is
        a finitely generated $k[y_1, \\\\dots, y_d]$-module).*\\n\\n*Proof.* We proceed
        by induction on $n$, the number of generators of $A$. If $a_1, \\\\dots, a_n$
        are algebraically independent over $k$, there is nothing to prove (take $d
        = n$ and $y_i = a_i$). Otherwise, there exists a non-zero polynomial $F(x_1,
        \\\\dots, x_n) \\\\in k[x_1, \\\\dots, x_n]$ such that $F(a_1, \\\\dots, a_n)
        = 0$.\\n\\nWrite $F = \\\\sum_{\\\\nu} c_\\\\nu x_1^{\\\\nu_1} \\\\cdots x_n^{\\\\nu_n}$,
        where the sum runs over a finite set of multi-indices $\\\\nu = (\\\\nu_1,
        \\\\dots, \\\\nu_n) \\\\in \\\\mathbb{Z}_{\\\\ge 0}^n$ with $c_\\\\nu \\\\in
        k^\\\\times$. We perform a change of variables (Nagata's trick). Let $r \\u003e
        0$ be an integer rigorously chosen to be strictly greater than $\\\\max_{\\\\nu,
        i} \\\\{\\\\nu_i\\\\}$ (for instance, $r = 1 + \\\\deg F$). For $i = 2, \\\\dots,
        n$, define:\\n$$b_i = a_i - a_1^{r^{i-1}} \\\\in A.$$\\nSubstituting $a_i
        = b_i + a_1^{r^{i-1}}$ ($2 \\\\le i \\\\le n$) into $F(a_1, \\\\dots, a_n)
        = 0$, we obtain:\\n$$G(a_1, b_2, \\\\dots, b_n) := F\\\\left(a_1, b_2 + a_1^r,
        b_3 + a_1^{r^2}, \\\\dots, b_n + a_1^{r^{n-1}}\\\\right) = 0.$$\\nWhen we
        expand each monomial $c_\\\\nu a_1^{\\\\nu_1} (b_2 + a_1^r)^{\\\\nu_2} \\\\cdots
        (b_n + a_1^{r^{n-1}})^{\\\\nu_n}$, the unique term involving only powers of
        $a_1$ (and no $b_i$'s) is:\\n$$c_\\\\nu a_1^{\\\\nu_1 + \\\\nu_2 r + \\\\nu_3
        r^2 + \\\\dots + \\\\nu_n r^{n-1}}.$$\\nBecause $0 \\\\le \\\\nu_i \\u003c
        r$ for all $i$, the exponent $e(\\\\nu) = \\\\nu_1 + \\\\nu_2 r + \\\\dots
        + \\\\nu_n r^{n-1}$ has base-$r$ expansion $(\\\\nu_1, \\\\dots, \\\\nu_n)$.
        By the uniqueness of base-$r$ expansions of integers, the exponents $e(\\\\nu)$
        are all distinct for distinct multi-indices $\\\\nu$ appearing in $F$! Furthermore,
        every other term in the expansion of the monomial $c_\\\\nu a_1^{\\\\nu_1}
        \\\\prod_{i=2}^n (b_i + a_1^{r^{i-1}})^{\\\\nu_i}$ has strictly smaller degree
        in $a_1$ than $e(\\\\nu)$.\\n\\nTherefore, let $\\\\nu^*$ be the multi-index
        appearing in $F$ for which $e(\\\\nu^*)$ is maximal, and set $N = e(\\\\nu^*)
        \\u003e 0$. In the expanded polynomial $G(x_1, y_2, \\\\dots, y_n)$, the highest
        power of $x_1$ is $c_{\\\\nu^*} x_1^N$, with constant coefficient $c_{\\\\nu^*}
        \\\\in k^\\\\times$. Dividing $G$ by $c_{\\\\nu^*}$ gives a relation:\\n$$a_1^N
        + h_1(b_2, \\\\dots, b_n) a_1^{N-1} + \\\\dots + h_N(b_2, \\\\dots, b_n) =
        0,$$\\nwhere $h_j \\\\in k[b_2, \\\\dots, b_n]$. This proves that $a_1$ is
        integral over the subring $B = k[b_2, \\\\dots, b_n] \\\\subseteq A$. Since
        $a_i = b_i + a_1^{r^{i-1}}$ for $i \\\\ge 2$, each $a_i$ is also in $B[a_1]$,
        so $A = B[a_1]$ is integral over $B$.\\n\\nBy the induction hypothesis applied
        to the $(n-1)$-generated $k$-algebra $B = k[b_2, \\\\dots, b_n]$, there exist
        algebraically independent elements $y_1, \\\\dots, y_d \\\\in B$ such that
        $B$ is integral over $k[y_1, \\\\dots, y_d]$. By transitivity of integral
        extensions, $A$ is integral over $k[y_1, \\\\dots, y_d]$. $\\\\blacksquare$\\n\\nRecall
        that if $B \\\\subseteq A$ is an integral extension of rings:\\n* **Lying
        Over and Going-Up (Cohen-Seidenberg):** For any prime $\\\\mathfrak{q} \\\\subset
        B$, there is a prime $\\\\mathfrak{p} \\\\subset A$ with $\\\\mathfrak{p}
        \\\\cap B = \\\\mathfrak{q}$; furthermore, $\\\\mathfrak{p}$ is maximal if
        and only if $\\\\mathfrak{q}$ is maximal, and if $\\\\mathfrak{p}_1 \\\\subseteq
        \\\\mathfrak{p}_2$ in $A$ satisfy $\\\\mathfrak{p}_1 \\\\cap B = \\\\mathfrak{p}_2
        \\\\cap B$, then $\\\\mathfrak{p}_1 = \\\\mathfrak{p}_2$ (Incomparability).
        Consequently, $\\\\dim A = \\\\dim B$.\\n* **Going-Down:** If $B$ is an integrally
        closed domain (e.g., a UFD like $k[y_1, \\\\dots, y_d]$) and $A$ is an integral
        domain integral over $B$, then for any chain of primes $\\\\mathfrak{q}_1
        \\\\supsetneq \\\\mathfrak{q}_2$ in $B$ and any prime $\\\\mathfrak{p}_1 \\\\subset
        A$ lying over $\\\\mathfrak{q}_1$, there exists a prime $\\\\mathfrak{p}_2
        \\\\subset \\\\mathfrak{p}_1$ in $A$ lying over $\\\\mathfrak{q}_2$.\\n\\n**Theorem
        1.4.6.** *Let $Y$ be an affine variety over $k$ with coordinate ring $A(Y)$
        and function field $K(Y)$. Then:*\\n1. $\\\\dim Y = \\\\dim A(Y) = \\\\operatorname{tr.deg}_k
        K(Y)$ *(the transcendence degree of $K(Y)$ over $k$).*\\n2. *Every maximal
        chain of prime ideals in $A(Y)$ has the exact same length $\\\\dim A(Y)$.*\\n3.
        *For any prime ideal $\\\\mathfrak{p} \\\\subset A(Y)$, we have:*\\n$$\\\\operatorname{ht}(\\\\mathfrak{p})
        + \\\\dim(A(Y)/\\\\mathfrak{p}) = \\\\dim A(Y).$$\\n\\n*Proof.* We prove (1),
        (2), and (3) simultaneously by induction on $d = \\\\operatorname{tr.deg}_k
        K(Y)$. By Noether Normalization (Theorem 1.4.5), there exist algebraically
        independent elements $y_1, \\\\dots, y_d \\\\in A = A(Y)$ such that $A$ is
        integral over the polynomial ring $B = k[y_1, \\\\dots, y_d]$. Since $A$ is
        algebraic over $B$, $\\\\operatorname{Frac}(A) = K(Y)$ is an algebraic extension
        of $\\\\operatorname{Frac}(B) = k(y_1, \\\\dots, y_d)$, so the number of $y_i$'s
        is indeed $d = \\\\operatorname{tr.deg}_k K(Y)$.\\n\\nIf $d = 0$, $A$ is an
        integral domain algebraic over $k$, hence $A = k$ is a field, so $\\\\dim
        A = 0 = d$, and (1)\u2013(3) hold trivially.\\n\\nNow suppose $d \\\\ge 1$.
        Notice first that by Incomparability, any chain of primes in $A$ restricts
        to a chain of distinct primes in $B$ of the exact same length. Let $0 = \\\\mathfrak{p}_0
        \\\\subsetneq \\\\mathfrak{p}_1 \\\\subsetneq \\\\dots \\\\subsetneq \\\\mathfrak{p}_m$
        be a saturated (maximal) chain of prime ideals in $A$ (meaning no prime can
        be inserted anywhere). Then $\\\\mathfrak{p}_m$ is a maximal ideal, and $\\\\mathfrak{p}_1$
        is a minimal non-zero prime, so $\\\\operatorname{ht}(\\\\mathfrak{p}_1) =
        1$.\\n\\nLet $\\\\mathfrak{q}_1 = \\\\mathfrak{p}_1 \\\\cap B \\\\neq 0$.
        We claim $\\\\operatorname{ht}(\\\\mathfrak{q}_1) = 1$ in the UFD $B = k[y_1,
        \\\\dots, y_d]$. Suppose there were a non-zero prime $\\\\mathfrak{q}' \\\\subsetneq
        \\\\mathfrak{q}_1$ in $B$. Since $B$ is a UFD, it is integrally closed. By
        the Going-Down Theorem applied to $B \\\\subseteq A$, the chain $\\\\mathfrak{q}_1
        \\\\supsetneq \\\\mathfrak{q}' \\\\supsetneq 0$ and the prime $\\\\mathfrak{p}_1$
        lying over $\\\\mathfrak{q}_1$ lift to primes $\\\\mathfrak{p}_1 \\\\supsetneq
        \\\\mathfrak{p}' \\\\supsetneq 0$ in $A$, contradicting $\\\\operatorname{ht}(\\\\mathfrak{p}_1)
        = 1$! Thus $\\\\operatorname{ht}(\\\\mathfrak{q}_1) = 1$ in the UFD $B$.\\n\\nIn
        a UFD, every prime ideal of height $1$ is principal, generated by an irreducible
        element: indeed, any $\\\\mathfrak{q}_1 \\\\neq 0$ contains some element,
        hence some irreducible factor $f \\\\in \\\\mathfrak{q}_1$, and $0 \\\\subsetneq
        (f) \\\\subseteq \\\\mathfrak{q}_1$ forces $\\\\mathfrak{q}_1 = (f)$. Now
        consider the integral extension of domains:\\n$$B/\\\\mathfrak{q}_1 = k[y_1,
        \\\\dots, y_d]/(f) \\\\hookrightarrow A/\\\\mathfrak{p}_1.$$\\nSince $f(y_1,
        \\\\dots, y_d) = 0$ in $B/\\\\mathfrak{q}_1$ is a non-trivial algebraic relation
        among $y_1, \\\\dots, y_d$ (assuming without loss of generality $y_d$ appears
        in $f$), $y_d$ is algebraic over $k(y_1, \\\\dots, y_{d-1})$ in $\\\\operatorname{Frac}(B/\\\\mathfrak{q}_1)$
        and there can be no algebraic relation among $y_1, \\\\dots, y_{d-1}$ in $B/(f)$
        (as any such polynomial in $k[y_1, \\\\dots, y_{d-1}]$ would have to be divisible
        by $f$, impossible since $f$ involves $y_d$). Thus $\\\\operatorname{tr.deg}_k
        \\\\operatorname{Frac}(A/\\\\mathfrak{p}_1) = \\\\operatorname{tr.deg}_k \\\\operatorname{Frac}(B/\\\\mathfrak{q}_1)
        = d - 1$.\\n\\nThe images of $\\\\mathfrak{p}_1 \\\\subsetneq \\\\mathfrak{p}_2
        \\\\subsetneq \\\\dots \\\\subsetneq \\\\mathfrak{p}_m$ form a maximal chain
        of prime ideals in $A/\\\\mathfrak{p}_1$ of length $m - 1$. By the induction
        hypothesis applied to $A/\\\\mathfrak{p}_1$, every maximal chain in $A/\\\\mathfrak{p}_1$
        has length $d - 1$. Therefore $m - 1 = d - 1$, so $m = d$. This proves both
        (1) and (2). Finally, for any prime $\\\\mathfrak{p} \\\\subset A$, we can
        choose a maximal chain from $0$ to $\\\\mathfrak{p}$ (of length $\\\\operatorname{ht}(\\\\mathfrak{p})$)
        and concatenate it with the preimage of a maximal chain in $A/\\\\mathfrak{p}$
        (of length $\\\\dim(A/\\\\mathfrak{p})$) to obtain a maximal chain in $A$,
        which by (2) has length $\\\\dim A$, proving (3). $\\\\blacksquare$\\n\\n**Corollary
        1.4.7.** *Let $X$ be any variety (quasi-affine or quasi-projective).*\\n1.
        *For any non-empty open subset $U \\\\subseteq X$, $\\\\dim U = \\\\dim X
        = \\\\operatorname{tr.deg}_k K(X)$. In particular, $\\\\dim \\\\mathbb{A}^n_k
        = \\\\dim \\\\mathbb{P}^n_k = n$.*\\n2. *If $Y \\\\subseteq X$ is a closed
        subset with $\\\\dim Y = \\\\dim X$, then $Y$ contains an irreducible component
        equal to $X$, so $Y = X$.*\\n3. *(Krull's Principal Ideal Theorem for Varieties)
        Let $X$ be an affine variety and $f \\\\in A(X)$ be a non-zero non-unit. Then
        every irreducible component $Z$ of $V(f)$ has dimension $\\\\dim Z = \\\\dim
        X - 1$ (we say $V(f)$ is a **hypersurface** of pure codimension $1$).*\\n\\n*Proof.*
        (1) Cover $X$ by non-empty open affine subsets $U_\\\\alpha$. A chain $Z_0
        \\\\subsetneq \\\\dots \\\\subsetneq Z_d$ of irreducible closed subsets of
        $X$ intersects any open $U_\\\\alpha$ with $Z_0 \\\\cap U_\\\\alpha \\\\neq
        \\\\varnothing$ in a chain of irreducible closed subsets of $U_\\\\alpha$
        of the same length (since $\\\\overline{Z_i \\\\cap U_\\\\alpha} = Z_i$),
        and conversely closures of chains in $U_\\\\alpha$ give chains in $X$. Since
        $\\\\dim U_\\\\alpha = \\\\operatorname{tr.deg}_k K(U_\\\\alpha) = \\\\operatorname{tr.deg}_k
        K(X)$ for all $\\\\alpha$, we get $\\\\dim X = \\\\dim U = \\\\operatorname{tr.deg}_k
        K(X)$.\\n(2) If $Y \\\\subsetneq X$ is closed, taking an irreducible component
        $Y_0$ of $Y$ of maximal dimension, any maximal chain $Z_0 \\\\subsetneq \\\\dots
        \\\\subsetneq Z_d = Y_0$ can be extended to $Z_d \\\\subsetneq X$, so $\\\\dim
        Y \\u003c \\\\dim X$.\\n(3) Irreducible components of $V(f)$ correspond to
        minimal prime ideals $\\\\mathfrak{p} \\\\subset A(X)$ containing $(f)$. Localizing
        at $\\\\mathfrak{p}$, $\\\\mathfrak{p}A(X)_\\\\mathfrak{p}$ is the unique
        non-zero prime ideal of $A(X)_\\\\mathfrak{p}$ containing $f$. If $\\\\operatorname{ht}(\\\\mathfrak{p})
        \\\\ge 2$, then choosing a non-empty open subset $D(g)$ of $X$ where $Z =
        V(\\\\mathfrak{p})$ meets $D(g)$, in $A(X)_g$ we can avoid all other minimal
        primes of $(f)$, so $\\\\sqrt{(f)} = \\\\mathfrak{p}$ in $A(X)_g$. Then $V(f)
        \\\\cap D(g) = Z \\\\cap D(g)$, meaning $D(f) \\\\cap D(g) = D(g) \\\\setminus
        Z$, so $A(X)_{fg} = \\\\mathcal{O}(D(g) \\\\setminus Z)$. However, by choosing
        Noether normalization for $A(X)_g$, any minimal prime of a principal ideal
        $(f)$ has height $1$ (by the norm argument: the norm $N_{K(X)/k(y_1,\\\\dots,y_d)}(f)
        \\\\in B$ generates a height $1$ prime in the UFD $B$ below $\\\\mathfrak{p}
        \\\\cap B$). By Theorem 1.4.6(3), $\\\\dim A(X)/\\\\mathfrak{p} = \\\\dim
        A(X) - 1$. $\\\\blacksquare$\\n\\n---\\n\\n### 1.5 Smoothness, the Jacobian
        Criterion, and Differentials\\n\\n**Definition 1.5.1.** Let $Y \\\\subseteq
        \\\\mathbb{A}^n_k$ be an affine variety, and let $P = (a_1, \\\\dots, a_n)
        \\\\in Y$ be a point. For any polynomial $f \\\\in k[x_1, \\\\dots, x_n]$,
        define the **linear part of $f$ at $P$** to be:\\n$$d_P f = \\\\sum_{i=1}^n
        \\\\frac{\\\\partial f}{\\\\partial x_i}(P) (x_i - a_i).$$\\nThe **Zariski
        tangent space** to $Y$ at $P$, denoted $T_P Y$, is the linear subspace of
        $\\\\mathbb{A}^n_k$ (viewed as a $k$-vector space with origin at $P$) defined
        by the linear equations:\\n$$T_P Y = V\\\\left(\\\\{d_P f \\\\mid f \\\\in
        I(Y)\\\\}\\\\right) \\\\subseteq k^n.$$\\nEquivalently, if $I(Y) = (f_1, \\\\dots,
        f_r)$, the product rule $d_P(gh) = g(P)d_P h + h(P)d_P g$ shows that $T_P
        Y$ is the kernel of the **Jacobian matrix** at $P$:\\n$$J_P(f_1, \\\\dots,
        f_r) = \\\\left( \\\\frac{\\\\partial f_i}{\\\\partial x_j}(P) \\\\right)_{\\\\substack{1
        \\\\le i \\\\le r \\\\\\\\ 1 \\\\le j \\\\le n}} : k^n \\\\longrightarrow
        k^r.$$\\nThus $\\\\dim_k T_P Y = n - \\\\operatorname{rank} J_P(f_1, \\\\dots,
        f_r)$.\\n\\nTo see that $T_P Y$ is an intrinsic invariant of the local ring
        $\\\\mathcal{O}_{Y,P}$ (and thus depends only on an open neighborhood of $P$,
        making it well-defined for any variety), we relate it to the **Zariski cotangent
        space** $\\\\mathfrak{m}_P / \\\\mathfrak{m}_P^2$.\\n\\n**Proposition 1.5.2.**
        *Let $P \\\\in Y \\\\subseteq \\\\mathbb{A}^n_k$ be a point on an affine variety,
        and let $(\\\\mathcal{O}_{Y,P}, \\\\mathfrak{m}_P)$ be the local ring of $Y$
        at $P$ (where by abuse of notation $\\\\mathfrak{m}_P$ denotes the maximal
        ideal of $\\\\mathcal{O}_{Y,P}$). There is a canonical isomorphism of $k$-vector
        spaces:*\\n$$T_P Y \\\\stackrel{\\\\sim}{\\\\longrightarrow} (\\\\mathfrak{m}_P
        / \\\\mathfrak{m}_P^2)^\\\\vee = \\\\operatorname{Hom}_k(\\\\mathfrak{m}_P
        / \\\\mathfrak{m}_P^2, k).$$\\n\\n*Proof.* Let $\\\\mathfrak{M}_P = (x_1 -
        a_1, \\\\dots, x_n - a_n) \\\\subset k[x_1, \\\\dots, x_n]$ be the maximal
        ideal of $P$ in $\\\\mathbb{A}^n_k$, and let $\\\\overline{\\\\mathfrak{M}}_P
        = \\\\mathfrak{M}_P / I(Y) \\\\subset A(Y)$. Since $\\\\mathcal{O}_{Y,P} =
        A(Y)_{\\\\overline{\\\\mathfrak{M}}_P}$, localization induces an isomorphism
        $\\\\overline{\\\\mathfrak{M}}_P / \\\\overline{\\\\mathfrak{M}}_P^2 \\\\stackrel{\\\\sim}{\\\\longrightarrow}
        \\\\mathfrak{m}_P / \\\\mathfrak{m}_P^2$.\\n\\nNow consider the linear map
        $\\\\theta: \\\\mathfrak{M}_P \\\\to \\\\operatorname{Hom}_k(k^n, k) = (k^n)^\\\\vee$
        given by sending $f \\\\in \\\\mathfrak{M}_P$ to the linear functional $d_P
        f = \\\\sum_{i=1}^n \\\\frac{\\\\partial f}{\\\\partial x_i}(P) (x_i - a_i)$.
        By Taylor's formula, any polynomial $f \\\\in \\\\mathfrak{M}_P$ expands around
        $P$ as $f = d_P f + g$ with $g \\\\in \\\\mathfrak{M}_P^2$. Therefore, $\\\\theta$
        is surjective and its kernel is precisely $\\\\mathfrak{M}_P^2$, inducing
        an isomorphism $\\\\bar{\\\\theta}: \\\\mathfrak{M}_P / \\\\mathfrak{M}_P^2
        \\\\stackrel{\\\\sim}{\\\\longrightarrow} (k^n)^\\\\vee$.\\n\\nSince $\\\\overline{\\\\mathfrak{M}}_P
        / \\\\overline{\\\\mathfrak{M}}_P^2 = \\\\mathfrak{M}_P / (I(Y) + \\\\mathfrak{M}_P^2)$,
        the quotient map $\\\\mathfrak{M}_P / \\\\mathfrak{M}_P^2 \\\\to \\\\overline{\\\\mathfrak{M}}_P
        / \\\\overline{\\\\mathfrak{M}}_P^2$ has kernel $(I(Y) + \\\\mathfrak{M}_P^2)/\\\\mathfrak{M}_P^2$,
        whose image under $\\\\bar{\\\\theta}$ is the subspace $\\\\{d_P f \\\\mid
        f \\\\in I(Y)\\\\} \\\\subseteq (k^n)^\\\\vee$. Taking dual vector spaces,
        the dual of the surjection $(k^n)^\\\\vee \\\\twoheadrightarrow \\\\mathfrak{m}_P
        / \\\\mathfrak{m}_P^2$ identifies $(\\\\mathfrak{m}_P / \\\\mathfrak{m}_P^2)^\\\\vee$
        with the subspace of $k^n$ annihilated by $\\\\{d_P f \\\\mid f \\\\in I(Y)\\\\}$,
        which is by definition $T_P Y$. $\\\\blacksquare$\\n\\n**Definition 1.5.3.**
        Let $Y$ be a variety of dimension $d$. A point $P \\\\in Y$ is **nonsingular**
        (or **smooth**, or **regular**) if $\\\\dim_k T_P Y = \\\\dim_k (\\\\mathfrak{m}_P
        / \\\\mathfrak{m}_P^2) = d$. Otherwise, $P$ is called a **singular** point
        of $Y$. We say $Y$ is **nonsingular** (or **smooth**) if every point of $Y$
        is nonsingular.\\n\\nRecall from commutative algebra that a Noetherian local
        ring $(R, \\\\mathfrak{m}, \\\\kappa)$ is called a **regular local ring**
        if $\\\\dim_\\\\kappa(\\\\mathfrak{m}/\\\\mathfrak{m}^2) = \\\\dim R$ (in
        general, Krull's Principal Ideal Theorem guarantees the inequality $\\\\dim_\\\\kappa(\\\\mathfrak{m}/\\\\mathfrak{m}^2)
        \\\\ge \\\\dim R$ for all Noetherian local rings). Since $\\\\dim \\\\mathcal{O}_{Y,P}
        = \\\\operatorname{ht}(\\\\mathfrak{m}_P) = \\\\dim A(Y) = \\\\dim Y$ by Theorem
        1.4.6(3), we obtain the following algebraic characterization and Jacobian
        criterion.\\n\\n**Theorem 1.5.4.** *Let $Y$ be a variety of dimension $d$
        over $k$, and let $P \\\\in Y$.*\\n1. $P$ *is a nonsingular point of $Y$ if
        and only if $\\\\mathcal{O}_{Y,P}$ is a regular local ring.*\\n2. *(Jacobian
        Criterion) If $Y \\\\subseteq \\\\mathbb{A}^n_k$ is an affine variety with
        $I(Y) = (f_1, \\\\dots, f_r)$, then for every $P \\\\in Y$, $\\\\operatorname{rank}
        J_P(f_1, \\\\dots, f_r) \\\\le n - d$, with equality if and only if $P$ is
        a nonsingular point of $Y$.*\\n3. *The set $\\\\operatorname{Sing}(Y)$ of
        singular points of $Y$ is a proper closed subset of $Y$. In particular, the
        set of nonsingular points is a dense open subset of $Y$.*\\n\\n*Proof.* (1)
        and (2) follow immediately from Proposition 1.5.2, Definition 1.5.3, and the
        inequality $\\\\dim_k(\\\\mathfrak{m}_P/\\\\mathfrak{m}_P^2) \\\\ge \\\\dim
        \\\\mathcal{O}_{Y,P} = d$, which gives $n - \\\\operatorname{rank} J_P(f_1,
        \\\\dots, f_r) = \\\\dim_k T_P Y \\\\ge d$.\\n\\nTo prove (3), we may cover
        $Y$ by open affine charts and assume $Y \\\\subseteq \\\\mathbb{A}^n_k$ is
        affine of dimension $d$. By (2), a point $P \\\\in Y$ lies in $\\\\operatorname{Sing}(Y)$
        if and only if $\\\\operatorname{rank} J_P(f_1, \\\\dots, f_r) \\u003c n -
        d$, which holds if and only if all $(n-d) \\\\times (n-d)$ minors of the matrix
        $\\\\left(\\\\frac{\\\\partial f_i}{\\\\partial x_j}\\\\right)$ vanish at
        $P$. Since these minors are polynomials in $x_1, \\\\dots, x_n$, their common
        zero locus on $Y$ is a closed subset $\\\\operatorname{Sing}(Y) \\\\subseteq
        Y$.\\n\\nIt remains to show that $\\\\operatorname{Sing}(Y) \\\\neq Y$. By
        Theorem 1.4.2, $K(Y)$ is a finitely generated field extension of $k$ of transcendence
        degree $d$. Since $k$ is algebraically closed, it is a **perfect field**,
        meaning every finitely generated extension $K(Y)/k$ is **separably generated**:
        there exists a transcendence basis $t_1, \\\\dots, t_d \\\\in K(Y)$ over $k$
        such that $K(Y)$ is a finite separable algebraic extension of $k(t_1, \\\\dots,
        t_d)$ (indeed, if $\\\\operatorname{char}(k) = p \\u003e 0$ and $F(y_1, \\\\dots,
        y_{d+1}) = 0$ is an irreducible polynomial relation among $d+1$ elements of
        $K(Y)$, not all $\\\\frac{\\\\partial F}{\\\\partial y_i}$ can be zero, for
        otherwise $F$ would be a polynomial in $y_1^p, \\\\dots, y_{d+1}^p$, and taking
        $p$-th roots of its coefficients in $k = \\\\bar{k}$ would write $F = G^p$,
        contradicting irreducibility).\\n\\nBy the Primitive Element Theorem for finite
        separable field extensions, there exists an element $t_{d+1} \\\\in K(Y)$
        such that $K(Y) = k(t_1, \\\\dots, t_d)[t_{d+1}]$. Clearing denominators in
        the minimal polynomial of $t_{d+1}$ over $k(t_1, \\\\dots, t_d)$, we obtain
        an irreducible polynomial $f \\\\in k[x_1, \\\\dots, x_{d+1}]$ such that the
        affine hypersurface $Z = V(f) \\\\subseteq \\\\mathbb{A}^{d+1}_k$ has function
        field $K(Z) \\\\cong K(Y)$. Thus $Y$ and $Z$ are birationally equivalent,
        so they contain isomorphic non-empty open subsets $U \\\\subseteq Y$ and $V
        \\\\subseteq Z$. Since smoothness is a local property depending only on $\\\\mathcal{O}_{Y,P}$,
        it suffices to show $\\\\operatorname{Sing}(Z) \\\\neq Z$. For the hypersurface
        $Z = V(f) \\\\subseteq \\\\mathbb{A}^{d+1}_k$ of dimension $d$, $\\\\operatorname{Sing}(Z)
        = Z \\\\cap V\\\\left(\\\\frac{\\\\partial f}{\\\\partial x_1}, \\\\dots,
        \\\\frac{\\\\partial f}{\\\\partial x_{d+1}}\\\\right)$. Since $t_{d+1}$ is
        separable over $k(t_1, \\\\dots, t_d)$, $\\\\frac{\\\\partial f}{\\\\partial
        x_{d+1}} \\\\neq 0$ in $k[x_1, \\\\dots, x_{d+1}]$. Because $f$ is irreducible
        and $\\\\deg \\\\frac{\\\\partial f}{\\\\partial x_{d+1}} \\u003c \\\\deg
        f$, $f$ cannot divide $\\\\frac{\\\\partial f}{\\\\partial x_{d+1}}$. Thus
        $\\\\frac{\\\\partial f}{\\\\partial x_{d+1}} \\\\notin I(Z) = (f)$, so $Z
        \\\\not\\\\subseteq V\\\\left(\\\\frac{\\\\partial f}{\\\\partial x_{d+1}}\\\\right)$,
        proving $\\\\operatorname{Sing}(Z) \\\\subsetneq Z$. $\\\\blacksquare$\\n\\nWe
        conclude this chapter by introducing the algebraic formalism of K\xE4hler
        differentials, which globalizes the cotangent spaces $\\\\mathfrak{m}_P/\\\\mathfrak{m}_P^2$
        into a single module over the coordinate ring.\\n\\n**Definition 1.5.5.**
        Let $A$ be a commutative ring, $B$ be an $A$-algebra, and $M$ be a $B$-module.
        An **$A$-derivation** of $B$ into $M$ is a map $D: B \\\\to M$ that is $A$-linear
        and satisfies the Leibniz rule:\\n$$D(b b') = b D(b') + b' D(b) \\\\quad \\\\text{for
        all } b, b' \\\\in B.$$\\nNote that $D(1) = D(1 \\\\cdot 1) = 2D(1) \\\\implies
        D(1) = 0$, so $D(a) = 0$ for all $a \\\\in A$. The set of all $A$-derivations
        of $B$ into $M$ is a $B$-module denoted $\\\\operatorname{Der}_A(B, M)$.\\n\\nThe
        **module of relative differential forms** (or **K\xE4hler differentials**)
        of $B$ over $A$, denoted $\\\\Omega_{B/A}$, is the $B$-module defined as the
        quotient of the free $B$-module generated by symbols $\\\\{db \\\\mid b \\\\in
        B\\\\}$ modulo the $B$-submodule generated by the relations:\\n1. $d(b + b')
        - db - db'$ for all $b, b' \\\\in B$,\\n2. $d(b b') - b db' - b' db$ for all
        $b, b' \\\\in B$,\\n3. $da$ for all $a \\\\in A$.\\n\\nEquipped with the canonical
        $A$-derivation $d: B \\\\to \\\\Omega_{B/A}$ sending $b \\\\mapsto db$, the
        pair $(\\\\Omega_{B/A}, d)$ satisfies the following **universal property**:
        for any $B$-module $M$ and any $A$-derivation $D: B \\\\to M$, there exists
        a unique $B$-module homomorphism $\\\\phi: \\\\Omega_{B/A} \\\\to M$ such
        that $D = \\\\phi \\\\circ d$. In other words, there is a natural isomorphism
        of $B$-modules:\\n$$\\\\operatorname{Hom}_B(\\\\Omega_{B/A}, M) \\\\stackrel{\\\\sim}{\\\\longrightarrow}
        \\\\operatorname{Der}_A(B, M), \\\\qquad \\\\phi \\\\longmapsto \\\\phi \\\\circ
        d.$$\\n\\n**Proposition 1.5.6 (Alternative Construction via the Diagonal).**
        *Let $B$ be an $A$-algebra, and let $\\\\mu: B \\\\otimes_A B \\\\to B$ be
        the multiplication homomorphism $\\\\mu(b \\\\otimes b') = bb'$. Let $I =
        \\\\ker(\\\\mu)$. Then $I/I^2$ is naturally a $B$-module (where $b \\\\in
        B$ acts via multiplication by $b \\\\otimes 1$, or equivalently $1 \\\\otimes
        b$, since $b \\\\otimes 1 - 1 \\\\otimes b \\\\in I$). Define $d: B \\\\to
        I/I^2$ by $d(b) = (1 \\\\otimes b - b \\\\otimes 1) \\\\bmod I^2$. Then there
        is a canonical isomorphism of $B$-modules:*\\n$$\\\\Omega_{B/A} \\\\stackrel{\\\\sim}{\\\\longrightarrow}
        I/I^2.$$\\n\\n*Proof.* First check that $d: B \\\\to I/I^2$ is an $A$-derivation:
        it is clearly $A$-linear and vanishes on $A$, and for $b, b' \\\\in B$, we
        compute in $B \\\\otimes_A B$:\\n$$b \\\\cdot (1 \\\\otimes b' - b' \\\\otimes
        1) + b' \\\\cdot (1 \\\\otimes b - b \\\\otimes 1) - (1 \\\\otimes bb' - bb'
        \\\\otimes 1)$$\\n$$= (b \\\\otimes b' - bb' \\\\otimes 1) + (b' \\\\otimes
        b - b'b \\\\otimes 1) - 1 \\\\otimes bb' + bb' \\\\otimes 1 = -(1 \\\\otimes
        b - b \\\\otimes 1)(1 \\\\otimes b' - b' \\\\otimes 1) \\\\in I^2.$$\\nThus
        $d(bb') = b d(b') + b' d(b)$ in $I/I^2$. By the universal property of $\\\\Omega_{B/A}$,
        there is a unique $B$-module homomorphism $\\\\Phi: \\\\Omega_{B/A} \\\\to
        I/I^2$ sending $db \\\\mapsto (1 \\\\otimes b - b \\\\otimes 1) \\\\bmod I^2$.\\n\\nTo
        construct the inverse, consider the $A$-bilinear map $B \\\\times B \\\\to
        \\\\Omega_{B/A}$ sending $(b, b') \\\\mapsto b db'$. This induces an $A$-module
        homomorphism $\\\\Psi_0: B \\\\otimes_A B \\\\to \\\\Omega_{B/A}$ sending
        $\\\\sum b_i \\\\otimes b'_i \\\\mapsto \\\\sum b_i db'_i$. If $x = \\\\sum
        b_i \\\\otimes b'_i \\\\in I$ and $y = \\\\sum c_j \\\\otimes c'_j \\\\in
        I$, then $\\\\sum b_i b'_i = 0$ and $\\\\sum c_j c'_j = 0$, so:\\n$$\\\\Psi_0(xy)
        = \\\\sum_{i,j} b_i c_j d(b'_i c'_j) = \\\\sum_{i,j} b_i c_j b'_i dc'_j +
        \\\\sum_{i,j} b_i c_j c'_j db'_i = \\\\left(\\\\sum_i b_i b'_i\\\\right)\\\\left(\\\\sum_j
        c_j dc'_j\\\\right) + \\\\left(\\\\sum_j c_j c'_j\\\\right)\\\\left(\\\\sum_i
        b_i db'_i\\\\right) = 0.$$\\nThus $\\\\Psi_0(I^2) = 0$, so $\\\\Psi_0$ restricts
        to a map $\\\\Psi: I/I^2 \\\\to \\\\Omega_{B/A}$ which is $B$-linear and satisfies
        $\\\\Psi(1 \\\\otimes b - b \\\\otimes 1) = db - b d(1) = db$. Since $I$ is
        generated by elements of the form $1 \\\\otimes b - b \\\\otimes 1$ (if $\\\\sum
        b_i b'_i = 0$, then $\\\\sum b_i \\\\otimes b'_i = \\\\sum (b_i \\\\otimes
        1)(1 \\\\otimes b'_i - b'_i \\\\otimes 1)$), $\\\\Phi$ and $\\\\Psi$ are mutually
        inverse isomorphisms. $\\\\blacksquare$\\n\\n**Proposition 1.5.7 (Fundamental
        Exact Sequences for Differentials).** \\n1. *(First Exact Sequence) Let $A
        \\\\to B \\\\to C$ be ring homomorphisms. There is a natural exact sequence
        of $C$-modules:*\\n$$\\\\Omega_{B/A} \\\\otimes_B C \\\\stackrel{\\\\alpha}{\\\\longrightarrow}
        \\\\Omega_{C/A} \\\\stackrel{\\\\beta}{\\\\longrightarrow} \\\\Omega_{C/B}
        \\\\longrightarrow 0,$$\\n*where $\\\\alpha(db \\\\otimes c) = c \\\\cdot
        d(\\\\text{image of } b)$ and $\\\\beta(dc) = dc$.*\\n2. *(Second Exact Sequence
        / Conormal Sequence) Let $B$ be an $A$-algebra, $I \\\\subseteq B$ be an ideal,
        and $C = B/I$. There is a natural exact sequence of $C$-modules:*\\n$$I/I^2
        \\\\stackrel{\\\\delta}{\\\\longrightarrow} \\\\Omega_{B/A} \\\\otimes_B C
        \\\\stackrel{\\\\alpha}{\\\\longrightarrow} \\\\Omega_{C/A} \\\\longrightarrow
        0,$$\\n*where $\\\\delta(\\\\bar{f}) = df \\\\otimes 1$ for $f \\\\in I$.*\\n\\n*Proof.*
        By Yoneda's Lemma, a sequence of $C$-modules $M_1 \\\\to M_2 \\\\to M_3 \\\\to
        0$ is exact if and only if for every $C$-module $N$, the induced sequence
        $0 \\\\to \\\\operatorname{Hom}_C(M_3, N) \\\\to \\\\operatorname{Hom}_C(M_2,
        N) \\\\to \\\\operatorname{Hom}_C(M_1, N)$ is exact.\\n\\n(1) For any $C$-module
        $N$, applying $\\\\operatorname{Hom}_C(-, N)$ to the sequence and using $\\\\operatorname{Hom}_C(\\\\Omega_{B/A}
        \\\\otimes_B C, N) \\\\cong \\\\operatorname{Hom}_B(\\\\Omega_{B/A}, N) \\\\cong
        \\\\operatorname{Der}_A(B, N)$, we obtain:\\n$$0 \\\\longrightarrow \\\\operatorname{Der}_B(C,
        N) \\\\stackrel{\\\\beta^*}{\\\\longrightarrow} \\\\operatorname{Der}_A(C,
        N) \\\\stackrel{\\\\alpha^*}{\\\\longrightarrow} \\\\operatorname{Der}_A(B,
        N).$$\\nClearly $\\\\beta^*$ is injective, and an $A$-derivation $D: C \\\\to
        N$ vanishes when pulled back to $B$ if and only if it is $B$-linear, i.e.,
        $D \\\\in \\\\operatorname{Der}_B(C, N)$. Thus the sequence is exact.\\n\\n(2)
        In the setting of (2), $B \\\\to C = B/I$ is surjective, so $\\\\Omega_{C/B}
        = 0$. For any $C$-module $N$, applying $\\\\operatorname{Hom}_C(-, N)$ yields:\\n$$0
        \\\\longrightarrow \\\\operatorname{Der}_A(C, N) \\\\stackrel{\\\\alpha^*}{\\\\longrightarrow}
        \\\\operatorname{Der}_A(B, N) \\\\stackrel{\\\\delta^*}{\\\\longrightarrow}
        \\\\operatorname{Hom}_C(I/I^2, N).$$\\nNote that $\\\\operatorname{Hom}_C(I/I^2,
        N) = \\\\operatorname{Hom}_B(I, N)$ because $IN = 0$. For $D \\\\in \\\\operatorname{Der}_A(B,
        N)$, $\\\\delta^*(D)$ is simply the restriction $D|_I: I \\\\to N$ (which
        is $B$-linear because $D(bf) = bD(f) + fD(b) = bD(f)$ since $fN = 0$). An
        $A$-derivation $D: B \\\\to N$ factors through $C = B/I$ if and only if $D|_I
        = 0$, which proves exactness. $\\\\blacksquare$\\n\\nIn particular, if $Y
        = V(I) \\\\subseteq \\\\mathbb{A}^n_k$ is an affine variety with $C = A(Y)
        = k[x_1, \\\\dots, x_n]/I$, since $\\\\Omega_{k[x_1, \\\\dots, x_n]/k} = \\\\bigoplus_{i=1}^n
        k[x_1, \\\\dots, x_n] dx_i$, Proposition 1.5.7(2) presents $\\\\Omega_{A(Y)/k}$
        as the cokernel of the Jacobian matrix $I/I^2 \\\\to \\\\bigoplus_{i=1}^n
        A(Y) dx_i$, and for any $P \\\\in Y$, $\\\\Omega_{A(Y)/k} \\\\otimes_{A(Y)}
        k(P) \\\\cong \\\\mathfrak{m}_P/\\\\mathfrak{m}_P^2$.\\n\\n---\\n\\n### 1.6
        Exercises for Chapter 1\\n\\n**Exercise 1.1 (The Twisted Cubic).** Let $Y
        \\\\subseteq \\\\mathbb{A}^3_k$ be the curve given parametrically by $t \\\\mapsto
        (t, t^2, t^3)$ for $t \\\\in k$. \\n(a) Prove that $Y$ is an affine variety
        of dimension $1$, and show that $I(Y) = (y - x^2, z - x^3) \\\\subset k[x,
        y, z]$.\\n(b) Now consider the projective **twisted cubic curve**, which is
        the image of the morphism $\\\\nu_3: \\\\mathbb{P}^1_k \\\\to \\\\mathbb{P}^3_k$
        given by $[u : v] \\\\mapsto [u^3 : u^2 v : u v^2 : v^3]$. Let $x_0, x_1,
        x_2, x_3$ be the homogeneous coordinates on $\\\\mathbb{P}^3_k$. Prove that
        the homogeneous ideal $I_+(\\\\nu_3(\\\\mathbb{P}^1_k))$ is generated by the
        three $2 \\\\times 2$ minors of the matrix:\\n$$\\\\begin{pmatrix} x_0 & x_1
        & x_2 \\\\\\\\ x_1 & x_2 & x_3 \\\\end{pmatrix},$$\\nnamely $q_1 = x_0 x_2
        - x_1^2$, $q_2 = x_0 x_3 - x_1 x_2$, and $q_3 = x_1 x_3 - x_2^2$. Show that
        any two of these three quadrics define a reducible algebraic set of degree
        $4$ consisting of the twisted cubic union a line.\\n\\n**Exercise 1.2 (Quasi-affine
        Varieties Not Isomorphic to Affine Varieties).** Let $X = \\\\mathbb{A}^2_k
        \\\\setminus \\\\{(0,0)\\\\}$ be the punctured affine plane over $k$.\\n(a)
        Cover $X$ by the two principal open subsets $D(x)$ and $D(y)$, and use Theorem
        1.2.4 to compute the global ring of regular functions $\\\\mathcal{O}(X) =
        \\\\mathcal{O}(D(x)) \\\\cap \\\\mathcal{O}(D(y)) \\\\subset k(x, y)$. Show
        that $\\\\mathcal{O}(X) = k[x, y]$.\\n(b) Conclude that the inclusion morphism
        $\\\\iota: X \\\\hookrightarrow \\\\mathbb{A}^2_k$ induces an isomorphism
        on global regular functions $\\\\mathcal{O}(\\\\mathbb{A}^2_k) \\\\stackrel{\\\\sim}{\\\\longrightarrow}
        \\\\mathcal{O}(X)$, and deduce from Theorem 1.2.8 that $X$ is not isomorphic
        to any affine variety.\\n\\n**Exercise 1.3 (The Veronese Embedding).** For
        integers $n, d \\\\ge 1$, let $N = \\\\binom{n+d}{d} - 1$. The **Veronese
        embedding of degree $d$** is the map $\\\\nu_d: \\\\mathbb{P}^n_k \\\\to \\\\mathbb{P}^N_k$
        that sends a point $[x_0 : \\\\dots : x_n]$ to the point whose homogeneous
        coordinates are all the monomials $x_0^{i_0} x_1^{i_1} \\\\cdots x_n^{i_n}$
        of total degree $i_0 + \\\\dots + i_n = d$.\\n(a) Prove that $\\\\nu_d$ is
        a closed embedding, i.e., its image is a closed projective variety in $\\\\mathbb{P}^N_k$,
        and $\\\\nu_d$ induces an isomorphism of $\\\\mathbb{P}^n_k$ onto its image.\\n(b)
        Deduce that for any homogeneous polynomial $f \\\\in k[x_0, \\\\dots, x_n]$
        of degree $d \\u003e 0$, the complement $D_+(f) = \\\\mathbb{P}^n_k \\\\setminus
        V_+(f)$ of the projective hypersurface $V_+(f)$ is an affine variety.\\n\\n**Exercise
        1.4 (Resolution of Singularities of the Nodal and Cuspidal Cubics).** Assume
        $\\\\operatorname{char}(k) \\\\neq 2, 3$. \\n(a) Let $C_1 = V(y^2 - x^2(x+1))
        \\\\subseteq \\\\mathbb{A}^2_k$ be the **nodal cubic** and $C_2 = V(y^2 -
        x^3) \\\\subseteq \\\\mathbb{A}^2_k$ be the **cuspidal cubic**. Use the Jacobian
        Criterion to show that $(0,0)$ is the unique singular point of both $C_1$
        and $C_2$.\\n(b) Compute the equations of the blow-ups (strict transforms)
        $\\\\widetilde{C}_1$ and $\\\\widetilde{C}_2$ of $C_1$ and $C_2$ at the origin
        $(0,0) \\\\in \\\\mathbb{A}^2_k$. Prove that $\\\\widetilde{C}_1$ and $\\\\widetilde{C}_2$
        are both nonsingular affine curves isomorphic to $\\\\mathbb{A}^1_k$, and
        determine the cardinality of the fiber $\\\\pi^{-1}(0,0)$ over the singularity
        for each curve.\\n\\n**Exercise 1.5 (Frobenius Morphism).** Suppose $\\\\operatorname{char}(k)
        = p \\u003e 0$. Define the **Frobenius morphism** $F: \\\\mathbb{A}^n_k \\\\to
        \\\\mathbb{A}^n_k$ by $F(a_1, \\\\dots, a_n) = (a_1^p, \\\\dots, a_n^p)$.
        Prove that $F$ is a morphism of varieties which is a bijection of sets and
        a homeomorphism in the Zariski topology, but that $F$ is *not* an isomorphism
        of varieties. What is the induced map on differentials $\\\\Omega_{\\\\mathbb{A}^n_k/k}
        \\\\to \\\\Omega_{\\\\mathbb{A}^n_k/k}$?\\n\\n---\\n\\n## Chapter 2: Sheaves
        and Ringed Spaces\\n\\nGeometric objects\u2014whether topological manifolds,
        complex analytic spaces, or algebraic varieties\u2014are characterized by
        the functions defined on their open subsets. Sheaf theory provides the systematic
        machinery to track locally defined data and analyze the obstructions to gluing
        local solutions into global ones.\\n\\n### 2.1 Presheaves and Sheaves\\n\\n**Definition
        2.1.1.** Let $X$ be a topological space, and let $\\\\mathfrak{Top}(X)$ be
        the category whose objects are the open subsets of $X$ and whose morphisms
        are the inclusion maps $V \\\\hookrightarrow U$. A **presheaf** $\\\\mathcal{F}$
        of sets (or abelian groups, rings, $A$-modules) on $X$ is a contravariant
        functor from $\\\\mathfrak{Top}(X)$ to the category of sets (or abelian groups,
        rings, $A$-modules). Explicitly, a presheaf $\\\\mathcal{F}$ consists of:\\n1.
        For every open subset $U \\\\subseteq X$, an object $\\\\mathcal{F}(U)$ (also
        denoted $\\\\Gamma(U, \\\\mathcal{F})$), whose elements are called the **sections
        of $\\\\mathcal{F}$ over $U$**;\\n2. For every inclusion of open subsets $V
        \\\\subseteq U$, a **restriction morphism** $\\\\rho_{UV}: \\\\mathcal{F}(U)
        \\\\to \\\\mathcal{F}(V)$ (often written $s|_V$ for $s \\\\in \\\\mathcal{F}(U)$),
        satisfying:\\n   * $\\\\rho_{UU} = \\\\operatorname{id}_{\\\\mathcal{F}(U)}$
        for every open $U \\\\subseteq X$,\\n   * $\\\\rho_{VW} \\\\circ \\\\rho_{UV}
        = \\\\rho_{UW}$ for every chain of open subsets $W \\\\subseteq V \\\\subseteq
        U$.\\n\\nUnless stated otherwise, we work with presheaves of abelian groups
        (and follow the convention that $\\\\mathcal{F}(\\\\varnothing) = 0$).\\n\\n**Definition
        2.1.2.** A presheaf $\\\\mathcal{F}$ on a topological space $X$ is a **sheaf**
        if it satisfies the following two local gluing axioms for every open subset
        $U \\\\subseteq X$ and every open covering $\\\\{U_i\\\\}_{i \\\\in I}$ of
        $U$:\\n1. **(Locality / Identity Axiom)** If $s, t \\\\in \\\\mathcal{F}(U)$
        are two sections such that $s|_{U_i} = t|_{U_i}$ for all $i \\\\in I$, then
        $s = t$.\\n2. **(Gluing Axiom)** If we are given a family of sections $s_i
        \\\\in \\\\mathcal{F}(U_i)$ for each $i \\\\in I$ such that for all $i, j
        \\\\in I$, their restrictions to the overlap agree:\\n$$s_i|_{U_i \\\\cap
        U_j} = s_j|_{U_i \\\\cap U_j},$$\\nthen there exists a section $s \\\\in \\\\mathcal{F}(U)$
        such that $s|_{U_i} = s_i$ for all $i \\\\in I$. (Note that by Axiom (1),
        this section $s$ is necessarily unique.)\\n\\nNotice that for the empty covering
        of $U = \\\\varnothing$, the vacuous compatibility condition implies there
        is a unique section over $\\\\varnothing$, so any sheaf of abelian groups
        must satisfy $\\\\mathcal{F}(\\\\varnothing) = 0$. Furthermore, the sheaf
        axioms can be stated compactly as the exactness of the equalizer diagram:\\n$$0
        \\\\longrightarrow \\\\mathcal{F}(U) \\\\stackrel{d^0}{\\\\longrightarrow}
        \\\\prod_{i \\\\in I} \\\\mathcal{F}(U_i) \\\\stackrel{d^1}{\\\\longrightarrow}
        \\\\prod_{(i,j) \\\\in I \\\\times I} \\\\mathcal{F}(U_i \\\\cap U_j),$$\\nwhere
        $d^0(s) = (s|_{U_i})_{i \\\\in I}$ and $d^1((s_i)_{i \\\\in I}) = (s_i|_{U_i
        \\\\cap U_j} - s_j|_{U_i \\\\cap U_j})_{(i,j) \\\\in I \\\\times I}$.\\n\\n**Definition
        2.1.3.** Let $\\\\mathcal{F}$ and $\\\\mathcal{G}$ be presheaves (or sheaves)
        on $X$. A **morphism of presheaves** (or **morphism of sheaves**) $\\\\varphi:
        \\\\mathcal{F} \\\\to \\\\mathcal{G}$ is a natural transformation of functors;
        that is, a collection of morphisms $\\\\varphi(U): \\\\mathcal{F}(U) \\\\to
        \\\\mathcal{G}(U)$ for each open $U \\\\subseteq X$ such that for every inclusion
        $V \\\\subseteq U$, the following diagram commutes:\\n$$\\\\begin{array}{ccc}\\n\\\\mathcal{F}(U)
        & \\\\xrightarrow{\\\\varphi(U)} & \\\\mathcal{G}(U) \\\\\\\\\\n\\\\downarrow{\\\\rho^{\\\\mathcal{F}}_{UV}}
        & & \\\\downarrow{\\\\rho^{\\\\mathcal{G}}_{UV}} \\\\\\\\\\n\\\\mathcal{F}(V)
        & \\\\xrightarrow{\\\\varphi(V)} & \\\\mathcal{G}(V)\\n\\\\end{array}$$\\nAn
        **isomorphism** is a morphism that admits a two-sided inverse. We denote the
        category of presheaves of abelian groups on $X$ by $\\\\mathfrak{PSh}(X)$
        and its full subcategory of sheaves of abelian groups by $\\\\mathfrak{Ab}(X)$
        (or $\\\\mathfrak{Sh}(X)$).\\n\\n**Definition 2.1.4.** Let $\\\\mathcal{F}$
        be a presheaf on $X$, and let $P \\\\in X$ be a point. The **stalk** of $\\\\mathcal{F}$
        at $P$, denoted $\\\\mathcal{F}_P$, is the direct limit (filtered colimit)
        of $\\\\mathcal{F}(U)$ over all open neighborhoods $U$ of $P$, ordered by
        reverse inclusion:\\n$$\\\\mathcal{F}_P = \\\\varinjlim_{P \\\\in U} \\\\mathcal{F}(U).$$\\nExplicitly,
        an element of $\\\\mathcal{F}_P$ is represented by a pair $(U, s)$ where $U$
        is an open neighborhood of $P$ and $s \\\\in \\\\mathcal{F}(U)$, and two pairs
        $(U, s)$ and $(V, t)$ are equivalent if there exists an open neighborhood
        $W \\\\subseteq U \\\\cap V$ of $P$ such that $s|_W = t|_W$. The equivalence
        class of $(U, s)$ in $\\\\mathcal{F}_P$ is denoted $s_P$ and called the **germ
        of $s$ at $P$**.\\n\\nAny morphism of presheaves $\\\\varphi: \\\\mathcal{F}
        \\\\to \\\\mathcal{G}$ induces a morphism on stalks $\\\\varphi_P: \\\\mathcal{F}_P
        \\\\to \\\\mathcal{G}_P$ for every $P \\\\in X$, given by $\\\\varphi_P(s_P)
        = (\\\\varphi(U)(s))_P$.\\n\\n**Lemma 2.1.5.** *Let $\\\\mathcal{F}$ be a
        sheaf on $X$, $U \\\\subseteq X$ be an open subset, and $s, t \\\\in \\\\mathcal{F}(U)$.
        If $s_P = t_P$ in $\\\\mathcal{F}_P$ for all $P \\\\in U$, then $s = t$. Consequently,
        for any morphism of sheaves $\\\\varphi: \\\\mathcal{F} \\\\to \\\\mathcal{G}$:*\\n1.
        $\\\\varphi$ *is injective (meaning $\\\\varphi(U)$ is injective for all $U$)
        if and only if $\\\\varphi_P: \\\\mathcal{F}_P \\\\to \\\\mathcal{G}_P$ is
        injective for all $P \\\\in X$.*\\n2. $\\\\varphi$ *is an isomorphism if and
        only if $\\\\varphi_P: \\\\mathcal{F}_P \\\\to \\\\mathcal{G}_P$ is an isomorphism
        for all $P \\\\in X$.*\\n\\n*Proof.* If $s_P = t_P$ for all $P \\\\in U$,
        then by definition of the direct limit, for each $P \\\\in U$ there is an
        open neighborhood $U_P \\\\subseteq U$ of $P$ such that $s|_{U_P} = t|_{U_P}$.
        Since $\\\\{U_P\\\\}_{P \\\\in U}$ is an open covering of $U$, the Locality
        Axiom for the sheaf $\\\\mathcal{F}$ forces $s = t$.\\n\\n(1) Because filtered
        colimits in the category of abelian groups are exact, if $\\\\varphi(U)$ is
        injective for all $U$, then $\\\\varphi_P = \\\\varinjlim \\\\varphi(U)$ is
        injective for all $P$. Conversely, suppose $\\\\varphi_P$ is injective for
        all $P \\\\in X$, and let $s \\\\in \\\\mathcal{F}(U)$ satisfy $\\\\varphi(U)(s)
        = 0$. Then for every $P \\\\in U$, $\\\\varphi_P(s_P) = (\\\\varphi(U)(s))_P
        = 0$, so $s_P = 0$ by injectivity of $\\\\varphi_P$. By the first statement
        of the lemma, $s = 0$, so $\\\\varphi(U)$ is injective.\\n\\n(2) Clearly if
        $\\\\varphi$ is an isomorphism, every $\\\\varphi_P$ is an isomorphism. Conversely,
        suppose $\\\\varphi_P$ is an isomorphism for all $P \\\\in X$. By (1), $\\\\varphi(U)$
        is injective for all open $U \\\\subseteq X$. We must show $\\\\varphi(U):
        \\\\mathcal{F}(U) \\\\to \\\\mathcal{G}(U)$ is surjective. Let $t \\\\in \\\\mathcal{G}(U)$.
        For each $P \\\\in U$, consider the germ $t_P \\\\in \\\\mathcal{G}_P$. Since
        $\\\\varphi_P$ is surjective, there exists a germ in $\\\\mathcal{F}_P$, represented
        by some section $s^{(P)} \\\\in \\\\mathcal{F}(V_P)$ on an open neighborhood
        $V_P \\\\subseteq U$ of $P$, such that $\\\\varphi_P(s^{(P)}_P) = t_P$. By
        definition of equality in the stalk $\\\\mathcal{G}_P$, after shrinking the
        open neighborhood $V_P$ of $P$, we may assume that:\\n$$\\\\varphi(V_P)(s^{(P)})
        = t|_{V_P} \\\\quad \\\\text{in } \\\\mathcal{G}(V_P).$$\\nNow, for any two
        points $P, Q \\\\in U$, consider the restrictions $s^{(P)}|_{V_P \\\\cap V_Q}$
        and $s^{(Q)}|_{V_P \\\\cap V_Q}$ in $\\\\mathcal{F}(V_P \\\\cap V_Q)$. Applying
        $\\\\varphi(V_P \\\\cap V_Q)$ to both gives:\\n$$\\\\varphi(V_P \\\\cap V_Q)\\\\left(s^{(P)}|_{V_P
        \\\\cap V_Q}\\\\right) = t|_{V_P \\\\cap V_Q} = \\\\varphi(V_P \\\\cap V_Q)\\\\left(s^{(Q)}|_{V_P
        \\\\cap V_Q}\\\\right).$$\\nBecause we already know $\\\\varphi(V_P \\\\cap
        V_Q)$ is injective, we deduce that:\\n$$s^{(P)}|_{V_P \\\\cap V_Q} = s^{(Q)}|_{V_P
        \\\\cap V_Q} \\\\quad \\\\text{for all } P, Q \\\\in U.$$\\nSince $\\\\mathcal{F}$
        is a sheaf and $\\\\{V_P\\\\}_{P \\\\in U}$ covers $U$, the Gluing Axiom yields
        a global section $s \\\\in \\\\mathcal{F}(U)$ such that $s|_{V_P} = s^{(P)}$
        for all $P \\\\in U$. Then for every $P \\\\in U$:\\n$$(\\\\varphi(U)(s))|_{V_P}
        = \\\\varphi(V_P)(s|_{V_P}) = \\\\varphi(V_P)(s^{(P)}) = t|_{V_P}.$$\\nBy
        the Locality Axiom for the sheaf $\\\\mathcal{G}$, we conclude that $\\\\varphi(U)(s)
        = t$, so $\\\\varphi(U)$ is surjective, and thus an isomorphism (its inverse
        $\\\\varphi(U)^{-1}$ automatically commutes with restrictions). $\\\\blacksquare$\\n\\n---\\n\\n###
        2.2 Sheafification and Categorical Properties\\n\\nMany natural constructions
        on sheaves (such as quotients, images, and tensor products) yield only presheaves
        when defined levelwise on open sets. The **sheafification** functor canonically
        repairs this defect.\\n\\n**Proposition-Definition 2.2.1 (Sheafification).**
        *Given any presheaf $\\\\mathcal{F}$ on $X$, there exists a sheaf $\\\\mathcal{F}^+$
        and a morphism of presheaves $\\\\theta: \\\\mathcal{F} \\\\to \\\\mathcal{F}^+$
        satisfying the following universal property: for any sheaf $\\\\mathcal{G}$
        on $X$ and any morphism of presheaves $\\\\varphi: \\\\mathcal{F} \\\\to \\\\mathcal{G}$,
        there exists a unique morphism of sheaves $\\\\tilde{\\\\varphi}: \\\\mathcal{F}^+
        \\\\to \\\\mathcal{G}$ such that $\\\\varphi = \\\\tilde{\\\\varphi} \\\\circ
        \\\\theta$.*\\n*Furthermore, for every $P \\\\in X$, the induced map on stalks
        $\\\\theta_P: \\\\mathcal{F}_P \\\\to (\\\\mathcal{F}^+)_P$ is an isomorphism.
        The pair $(\\\\mathcal{F}^+, \\\\theta)$ is unique up to unique isomorphism
        and is called the **sheafification** of $\\\\mathcal{F}$ (or the **sheaf associated
        to the presheaf $\\\\mathcal{F}$**).*\\n\\n*Proof.* For any open subset $U
        \\\\subseteq X$, we define $\\\\mathcal{F}^+(U)$ to be the set of functions
        $s: U \\\\to \\\\bigsqcup_{P \\\\in U} \\\\mathcal{F}_P$ satisfying two conditions:\\n1.
        For each $P \\\\in U$, $s(P) \\\\in \\\\mathcal{F}_P$;\\n2. **(Local representability
        by sections)** For each $P \\\\in U$, there exists an open neighborhood $V
        \\\\subseteq U$ of $P$ and a section $t \\\\in \\\\mathcal{F}(V)$ such that
        for all $Q \\\\in V$, $s(Q) = t_Q$ in $\\\\mathcal{F}_Q$.\\n\\nWith pointwise
        addition and restriction of functions as the restriction maps $\\\\mathcal{F}^+(U)
        \\\\to \\\\mathcal{F}^+(V)$, $\\\\mathcal{F}^+$ is manifestly a sheaf: both
        equality of functions and condition (2) are purely local conditions on $U$,
        so functions that agree locally are equal globally, and compatible functions
        on an open cover glue uniquely to a function on $U$ satisfying (1) and (2).\\n\\nWe
        define the canonical morphism $\\\\theta: \\\\mathcal{F} \\\\to \\\\mathcal{F}^+$
        on each open $U \\\\subseteq X$ by sending a section $t \\\\in \\\\mathcal{F}(U)$
        to the function $\\\\theta(U)(t) = (P \\\\mapsto t_P)$. Condition (2) is tautologically
        satisfied (taking $V = U$).\\n\\nNext, let us verify that $\\\\theta_P: \\\\mathcal{F}_P
        \\\\to (\\\\mathcal{F}^+)_P$ is an isomorphism for every $P \\\\in X$. Define
        a map $\\\\pi_P: (\\\\mathcal{F}^+)_P \\\\to \\\\mathcal{F}_P$ by sending
        the germ at $P$ of a section $s \\\\in \\\\mathcal{F}^+(U)$ to its value $s(P)
        \\\\in \\\\mathcal{F}_P$ (which clearly depends only on the germ of $s$ at
        $P$). For any $t \\\\in \\\\mathcal{F}(U)$, $\\\\pi_P(\\\\theta_P(t_P)) =
        (\\\\theta(U)(t))(P) = t_P$, so $\\\\pi_P \\\\circ \\\\theta_P = \\\\operatorname{id}_{\\\\mathcal{F}_P}$.
        Conversely, given $s \\\\in \\\\mathcal{F}^+(U)$ with $P \\\\in U$, condition
        (2) gives an open neighborhood $V \\\\subseteq U$ of $P$ and $t \\\\in \\\\mathcal{F}(V)$
        such that $s(Q) = t_Q$ for all $Q \\\\in V$. This means $s|_V = \\\\theta(V)(t)$
        in $\\\\mathcal{F}^+(V)$, so the germ of $s$ in $(\\\\mathcal{F}^+)_P$ equals
        $\\\\theta_P(t_P) = \\\\theta_P(s(P)) = \\\\theta_P(\\\\pi_P(s_P))$. Thus
        $\\\\theta_P$ and $\\\\pi_P$ are inverse isomorphisms. Note also that if $\\\\mathcal{F}$
        is already a sheaf, Lemma 2.1.5(2) immediately implies that $\\\\theta: \\\\mathcal{F}
        \\\\to \\\\mathcal{F}^+$ is an isomorphism.\\n\\nFinally, if $\\\\varphi:
        \\\\mathcal{F} \\\\to \\\\mathcal{G}$ is a morphism to a sheaf $\\\\mathcal{G}$,
        functoriality of $(-)^+$ gives a morphism $\\\\varphi^+: \\\\mathcal{F}^+
        \\\\to \\\\mathcal{G}^+$ commuting with $\\\\theta_{\\\\mathcal{F}}$ and $\\\\theta_{\\\\mathcal{G}}$.
        Since $\\\\mathcal{G}$ is a sheaf, $\\\\theta_{\\\\mathcal{G}}: \\\\mathcal{G}
        \\\\stackrel{\\\\sim}{\\\\longrightarrow} \\\\mathcal{G}^+$ is an isomorphism,
        so setting $\\\\tilde{\\\\varphi} = \\\\theta_{\\\\mathcal{G}}^{-1} \\\\circ
        \\\\varphi^+: \\\\mathcal{F}^+ \\\\to \\\\mathcal{G}$ gives $\\\\tilde{\\\\varphi}
        \\\\circ \\\\theta_{\\\\mathcal{F}} = \\\\varphi$. For uniqueness, if $\\\\psi:
        \\\\mathcal{F}^+ \\\\to \\\\mathcal{G}$ also satisfies $\\\\psi \\\\circ \\\\theta_{\\\\mathcal{F}}
        = \\\\varphi$, then for all $P \\\\in X$, $\\\\psi_P \\\\circ (\\\\theta_{\\\\mathcal{F}})_P
        = \\\\varphi_P = \\\\tilde{\\\\varphi}_P \\\\circ (\\\\theta_{\\\\mathcal{F}})_P$.
        Since $(\\\\theta_{\\\\mathcal{F}})_P$ is an isomorphism, $\\\\psi_P = \\\\tilde{\\\\varphi}_P$
        for all $P \\\\in X$, so $\\\\psi = \\\\tilde{\\\\varphi}$ by Lemma 2.1.5.
        $\\\\blacksquare$\\n\\nCategorically, Proposition 2.2.1 says that the sheafification
        functor $(-)^+: \\\\mathfrak{PSh}(X) \\\\to \\\\mathfrak{Ab}(X)$ is **left
        adjoint** to the forgetful inclusion functor $\\\\iota: \\\\mathfrak{Ab}(X)
        \\\\hookrightarrow \\\\mathfrak{PSh}(X)$.\\n\\n**Definition 2.2.2.** Let $\\\\varphi:
        \\\\mathcal{F} \\\\to \\\\mathcal{G}$ be a morphism of sheaves of abelian
        groups on $X$.\\n1. The **kernel** of $\\\\varphi$, denoted $\\\\ker(\\\\varphi)$,
        is the presheaf $U \\\\mapsto \\\\ker(\\\\varphi(U): \\\\mathcal{F}(U) \\\\to
        \\\\mathcal{G}(U))$. One checks directly from the sheaf axioms (or because
        right adjoints preserve limits) that this presheaf is already a sheaf.\\n2.
        The **image** of $\\\\varphi$, denoted $\\\\operatorname{im}(\\\\varphi)$,
        is the **sheafification** of the presheaf image $U \\\\mapsto \\\\operatorname{im}(\\\\varphi(U))$.
        By the universal property of sheafification, $\\\\operatorname{im}(\\\\varphi)$
        embeds naturally as a subsheaf of $\\\\mathcal{G}$.\\n3. The **cokernel**
        of $\\\\varphi$, denoted $\\\\operatorname{coker}(\\\\varphi)$, is the **sheafification**
        of the presheaf cokernel $U \\\\mapsto \\\\operatorname{coker}(\\\\varphi(U))
        = \\\\mathcal{G}(U)/\\\\operatorname{im}(\\\\varphi(U))$.\\n\\nWe say a sequence
        of sheaves and morphisms $\\\\dots \\\\to \\\\mathcal{F}^{i-1} \\\\xrightarrow{\\\\varphi^{i-1}}
        \\\\mathcal{F}^i \\\\xrightarrow{\\\\varphi^i} \\\\mathcal{F}^{i+1} \\\\to
        \\\\dots$ is **exact** if $\\\\ker(\\\\varphi^i) = \\\\operatorname{im}(\\\\varphi^{i-1})$
        as subsheaves of $\\\\mathcal{F}^i$ for each $i$.\\n\\n**Theorem 2.2.3.**
        *Let $X$ be a topological space.*\\n1. *For any morphism of sheaves $\\\\varphi:
        \\\\mathcal{F} \\\\to \\\\mathcal{G}$ and any point $P \\\\in X$, we have
        canonical identifications on stalks:*\\n$$(\\\\ker \\\\varphi)_P = \\\\ker(\\\\varphi_P),
        \\\\qquad (\\\\operatorname{im} \\\\varphi)_P = \\\\operatorname{im}(\\\\varphi_P),
        \\\\qquad (\\\\operatorname{coker} \\\\varphi)_P = \\\\operatorname{coker}(\\\\varphi_P).$$\\n2.
        *A sequence of sheaves $\\\\mathcal{F}' \\\\xrightarrow{\\\\varphi} \\\\mathcal{F}
        \\\\xrightarrow{\\\\psi} \\\\mathcal{F}''$ is exact if and only if for every
        point $P \\\\in X$, the induced sequence of stalks $\\\\mathcal{F}'_P \\\\xrightarrow{\\\\varphi_P}
        \\\\mathcal{F}_P \\\\xrightarrow{\\\\psi_P} \\\\mathcal{F}''_P$ is exact as
        a sequence of abelian groups.*\\n3. *The category $\\\\mathfrak{Ab}(X)$ of
        sheaves of abelian groups on $X$ is an **abelian category**. The global sections
        functor $\\\\Gamma(X, -)$ (and more generally $\\\\Gamma(U, -)$) is left exact:
        if $0 \\\\to \\\\mathcal{F}' \\\\to \\\\mathcal{F} \\\\to \\\\mathcal{F}''
        \\\\to 0$ is an exact sequence of sheaves, then:*\\n$$0 \\\\longrightarrow
        \\\\mathcal{F}'(U) \\\\longrightarrow \\\\mathcal{F}(U) \\\\longrightarrow
        \\\\mathcal{F}''(U)$$\\n*is exact for every open $U \\\\subseteq X$ (though
        $\\\\mathcal{F}(U) \\\\to \\\\mathcal{F}''(U)$ need not be surjective).*\\n\\n*Proof.*
        (1) For every open $U \\\\subseteq X$, we have exact sequences of abelian
        groups:\\n$$0 \\\\to \\\\ker(\\\\varphi(U)) \\\\to \\\\mathcal{F}(U) \\\\to
        \\\\operatorname{im}_{\\\\text{pre}}(\\\\varphi)(U) \\\\to 0 \\\\quad \\\\text{and}
        \\\\quad 0 \\\\to \\\\operatorname{im}_{\\\\text{pre}}(\\\\varphi)(U) \\\\to
        \\\\mathcal{G}(U) \\\\to \\\\operatorname{coker}_{\\\\text{pre}}(\\\\varphi)(U)
        \\\\to 0.$$\\nSince taking filtered colimits over $U \\\\ni P$ is an exact
        functor on the category of abelian groups, passing to stalks gives $\\\\ker(\\\\varphi)_P
        = \\\\ker(\\\\varphi_P)$, $(\\\\operatorname{im}_{\\\\text{pre}} \\\\varphi)_P
        = \\\\operatorname{im}(\\\\varphi_P)$, and $(\\\\operatorname{coker}_{\\\\text{pre}}
        \\\\varphi)_P = \\\\operatorname{coker}(\\\\varphi_P)$. Because sheafification
        preserves stalks by Proposition 2.2.1, $(\\\\operatorname{im} \\\\varphi)_P
        = \\\\operatorname{im}(\\\\varphi_P)$ and $(\\\\operatorname{coker} \\\\varphi)_P
        = \\\\operatorname{coker}(\\\\varphi_P)$.\\n\\n(2) By Lemma 2.1.5, two subsheaves
        $\\\\operatorname{im}(\\\\varphi)$ and $\\\\ker(\\\\psi)$ of $\\\\mathcal{F}$
        are equal if and only if their stalks at all $P \\\\in X$ are equal inside
        $\\\\mathcal{F}_P$. By (1), this holds if and only if $\\\\operatorname{im}(\\\\varphi_P)
        = \\\\ker(\\\\psi_P)$ for all $P \\\\in X$.\\n\\n(3) Using (1) and (2), the
        axioms of an abelian category\u2014in particular, that the canonical morphism
        $\\\\operatorname{coim}(\\\\varphi) = \\\\operatorname{coker}(\\\\ker \\\\varphi
        \\\\to \\\\mathcal{F}) \\\\to \\\\operatorname{im}(\\\\varphi) = \\\\ker(\\\\mathcal{G}
        \\\\to \\\\operatorname{coker} \\\\varphi)$ is an isomorphism\u2014are verified
