        J}$ contains $f^m$, hence $f$. Taking complements gives $D(f) \\\\subseteq
        \\\\bigcup_{j \\\\in J} D(g_j)$. $\\\\blacksquare$\\n\\n**Definition 3.1.5
        (The Structure Sheaf $\\\\mathcal{O}_{\\\\operatorname{Spec} A}$).** Let $A$
        be a ring and $X = \\\\operatorname{Spec} A$. For each point $\\\\mathfrak{p}
        \\\\in X$, let $A_\\\\mathfrak{p}$ be the localization of $A$ at the prime
        ideal $\\\\mathfrak{p}$. For each open subset $U \\\\subseteq X$, we define
        $\\\\mathcal{O}_X(U)$ to be the set of all functions\\n$$s: U \\\\longrightarrow
        \\\\bigsqcup_{\\\\mathfrak{p} \\\\in U} A_\\\\mathfrak{p}$$\\nsuch that:\\n1.
        $s(\\\\mathfrak{p}) \\\\in A_\\\\mathfrak{p}$ for every $\\\\mathfrak{p} \\\\in
        U$, and\\n2. $s$ is locally a quotient of elements of $A$: for every $\\\\mathfrak{p}
        \\\\in U$, there exists an open neighborhood $V \\\\subseteq U$ of $\\\\mathfrak{p}$
        and elements $a, f \\\\in A$ such that for all $\\\\mathfrak{q} \\\\in V$,
        $f \\\\notin \\\\mathfrak{q}$ (i.e., $V \\\\subseteq D(f)$) and $s(\\\\mathfrak{q})
        = a/f$ in $A_\\\\mathfrak{q}$.\\n\\nBecause sums and products of elements
        satisfying (1) and (2) again satisfy (1) and (2), $\\\\mathcal{O}_X(U)$ is
        a commutative ring with identity, and because the condition is purely local
        on actual functions, $\\\\mathcal{O}_X = \\\\mathcal{O}_{\\\\operatorname{Spec}
        A}$ is a sheaf of rings on $X = \\\\operatorname{Spec} A$.\\n\\n### 3.2 Proof
        that $(\\\\operatorname{Spec} A, \\\\mathcal{O}_{\\\\operatorname{Spec} A})$
        is a Locally Ringed Space\\n\\nWe now compute the stalks and the sections
        over basic open subsets $D(f)$ of the structure sheaf $\\\\mathcal{O}_{\\\\operatorname{Spec}
        A}$.\\n\\n**Theorem 3.2.1.** Let $A$ be a ring and let $(X, \\\\mathcal{O}_X)
        = (\\\\operatorname{Spec} A, \\\\mathcal{O}_{\\\\operatorname{Spec} A})$.\\n1.
        For every point $\\\\mathfrak{p} \\\\in X$, the stalk $\\\\mathcal{O}_{X,
        \\\\mathfrak{p}}$ is canonically isomorphic to the local ring $A_\\\\mathfrak{p}$.\\n2.
        For every element $f \\\\in A$, the ring $\\\\mathcal{O}_X(D(f))$ is canonically
