        \\\\mathcal{F})$ is acyclic ($H^i(X, \\\\mathcal{C}^p(\\\\mathfrak{U}, \\\\mathcal{F}))
        = 0$ for all $i \\\\ge 1$). Since the cohomology of $\\\\mathcal{F}$ can be
