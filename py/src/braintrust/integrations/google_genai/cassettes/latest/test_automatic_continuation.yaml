        is a resolution of $\\\\mathcal{F}$ by flasque sheaves when $\\\\mathcal{F}$
        is flasque!).\\n\\n**Theorem 5.2.2 (Serre's Vanishing Theorem for Affine Schemes
        and Leray's Theorem).**\\n1. *Let $X = \\\\operatorname{Spec} A$ be an affine
