      string: "{\n  \"candidates\": [\n    {\n      \"content\": {\n        \"parts\":
        [\n          {\n            \"text\": \" \\\\bigcup_{i \\\\in I} D(h_i)$ and
        elements $a_i \\\\in A$ such that for all $\\\\mathfrak{p} \\\\in D(h_i)$,
        $s(\\\\mathfrak{p}) = a_i/h_i$ in $A_{\\\\mathfrak{p}}$.\\n\\nBy Proposition
        3.1.4(4), $D(f)$ is quasi-compact! Thus we may pass to a *finite* subcover:\\n$$D(f)
        = D(h_1) \\\\cup D(h_2) \\\\cup \\\\dots \\\\cup D(h_r),$$\\nwith $s(\\\\mathfrak{p})
        = a_i/h_i$ on $D(h_i)$ for $1 \\\\le i \\\\le r$.\\n\\nNow consider the overlap
        $D(h_i) \\\\cap D(h_j) = D(h_i h_j)$. On this principal open set, the section
        $s|_{D(h_i h_j)}$ equals both $\\\\psi_{h_i h_j}((h_j a_i)/(h_i h_j))$ and
        $\\\\psi_{h_i h_j}((h_i a_j)/(h_i h_j))$. Since we have already proven that
        the localization map $\\\\psi_{h_i h_j}: A_{h_i h_j} \\\\to \\\\mathcal{O}_X(D(h_i
        h_j))$ is injective, it follows that\\n$$\\\\frac{h_j a_i}{h_i h_j} = \\\\frac{h_i
        a_j}{h_i h_j} \\\\quad \\\\text{in } A_{h_i h_j}.$$\\nBy definition of the
        localization $A_{h_i h_j}$, there exists an integer $n_{ij} \\\\ge 1$ such
        that $(h_i h_j)^{n_{ij}} (h_j a_i - h_i a_j) = 0$ in $A$. Because there are
        only finitely many indices $1 \\\\le i, j \\\\le r$, we may choose a single
        integer $N \\\\ge 1$ large enough so that\\n$$(h_i h_j)^N (h_j a_i - h_i a_j)
        = 0 \\\\implies h_i^{N+1} h_j^N a_j = h_j^{N+1} h_i^N a_i \\\\quad \\\\text{for
        all } 1 \\\\le i, j \\\\le r.$$\\nReplace each $h_i$ by $h_i' = h_i^{N+1}$
        and each $a_i$ by $a_i' = h_i^N a_i$. Notice that $D(h_i') = D(h_i^{N+1})
        = D(h_i)$, on $D(h_i')$ we still have $a_i'/h_i' = (h_i^N a_i)/h_i^{N+1} =
        a_i/h_i = s(\\\\mathfrak{p})$ in $A_{\\\\mathfrak{p}}$, and the compatibility
        equations now take the clean, unlocalized form in $A$:\\n$$h_i' a_j' = h_j'
        a_i' \\\\quad \\\\text{in } A \\\\text{ for all } 1 \\\\le i, j \\\\le r.$$\\nFinally,
        since $D(f) \\\\subseteq \\\\bigcup_{i=1}^r D(h_i')$, we have $V((f)) \\\\supseteq
        V(h_1', \\\\dots, h_r')$, so by Proposition 3.1.2(4), $f \\\\in \\\\sqrt{(h_1',
        \\\\dots, h_r')}$. Thus there exist an integer $M \\\\ge 1$ and elements $b_1,
        \\\\dots, b_r \\\\in A$ such that\\n$$f^M = \\\\sum_{i=1}^r b_i h_i'.$$\\nDefine
        $a = \\\\sum_{i=1}^r b_i a_i' \\\\in A$. Then for every $j \\\\in \\\\{1,
        \\\\dots, r\\\\}$, we compute in $A$:\\n$$h_j' a = \\\\sum_{i=1}^r b_i h_j'
        a_i' = \\\\sum_{i=1}^r b_i h_i' a_j' = \\\\left(\\\\sum_{i=1}^r b_i h_i'\\\\right)
        a_j' = f^M a_j'.$$\\nConsequently, for every $\\\\mathfrak{p} \\\\in D(h_j')$,
        we have in $A_{\\\\mathfrak{p}}$:\\n$$\\\\frac{a}{f^M} = \\\\frac{h_j' a}{h_j'
        f^M} = \\\\frac{f^M a_j'}{h_j' f^M} = \\\\frac{a_j'}{h_j'} = s(\\\\mathfrak{p}).$$\\nSince
        the sets $D(h_j')$ cover $D(f)$, this proves that $\\\\psi(a/f^M) = s$ on
        all of $D(f)$. Thus $\\\\psi$ is surjective, completing the proof of (2) and
        (3). $\\\\blacksquare$\\n\\n---\\n\\n### 3.3 Schemes and Morphisms of Schemes\\n\\n**Definition
        3.3.1.**\\n1. An *affine scheme* is a locally ringed space $(X, \\\\mathcal{O}_X)$
        that is isomorphic (as a locally ringed space) to $(\\\\operatorname{Spec}
        A, \\\\mathcal{O}_{\\\\operatorname{Spec} A})$ for some commutative ring $A$.\\n2.
        A *scheme* is a locally ringed space $(X, \\\\mathcal{O}_X)$ in which every
        point $P \\\\in X$ has an open neighborhood $U \\\\subseteq X$ such that the
        open subspace $(U, \\\\mathcal{O}_X|_U)$ is an affine scheme.\\n3. A *morphism
        of schemes* $f: (X, \\\\mathcal{O}_X) \\\\to (Y, \\\\mathcal{O}_Y)$ is a morphism
        of locally ringed spaces. The category of schemes is denoted $\\\\mathfrak{Sch}$.
        If $S$ is a fixed base scheme, the category of *schemes over $S$* (or *$S$-schemes*),
        denoted $\\\\mathfrak{Sch}/S$, has as objects morphisms of schemes $\\\\pi_X:
        X \\\\to S$ and as morphisms $S$-morphisms $f: X \\\\to Y$ satisfying $\\\\pi_Y
        \\\\circ f = \\\\pi_X$.\\n\\nTo justify this definition, we must verify that
        morphisms between affine schemes are governed entirely by ring homomorphisms
        in the opposite direction.\\n\\n**Theorem 3.3.2.** *Let $A$ and $B$ be commutative
        rings.*\\n1. *Every ring homomorphism $\\\\varphi: A \\\\to B$ induces a canonical
        morphism of locally ringed spaces*\\n   $$(f, f^\\\\#) = \\\\operatorname{Spec}(\\\\varphi):
        (\\\\operatorname{Spec} B, \\\\mathcal{O}_{\\\\operatorname{Spec} B}) \\\\longrightarrow
        (\\\\operatorname{Spec} A, \\\\mathcal{O}_{\\\\operatorname{Spec} A}).$$\\n2.
        *For any scheme $(X, \\\\mathcal{O}_X)$ and any ring $A$, the global sections
        functor induces a natural bijection*\\n   $$\\\\operatorname{Hom}_{\\\\mathfrak{Sch}}(X,
        \\\\operatorname{Spec} A) \\\\xrightarrow{\\\\;\\\\sim\\\\;} \\\\operatorname{Hom}_{\\\\mathfrak{Rings}}(A,
        \\\\Gamma(X, \\\\mathcal{O}_X)), \\\\qquad (f, f^\\\\#) \\\\longmapsto f^\\\\#(\\\\operatorname{Spec}
        A): A \\\\to \\\\Gamma(X, \\\\mathcal{O}_X).$$\\n3. *In particular, taking
        $X = \\\\operatorname{Spec} B$, the functor $\\\\operatorname{Spec}: \\\\mathfrak{Rings}^{\\\\text{op}}
        \\\\to \\\\mathfrak{Sch}$ is fully faithful, inducing an anti-equivalence
        of categories between the category of commutative rings with identity and
        the category of affine schemes.*\\n\\n*Proof.* (1) Given a ring homomorphism
        $\\\\varphi: A \\\\to B$, define a map of sets $f: \\\\operatorname{Spec}
        B \\\\to \\\\operatorname{Spec} A$ by $f(\\\\mathfrak{q}) = \\\\varphi^{-1}(\\\\mathfrak{q})$
        for every prime ideal $\\\\mathfrak{q} \\\\in \\\\operatorname{Spec} B$. For
        any ideal $\\\\mathfrak{a} \\\\subseteq A$, we have $\\\\mathfrak{q} \\\\in
        f^{-1}(V(\\\\mathfrak{a})) \\\\iff \\\\varphi^{-1}(\\\\mathfrak{q}) \\\\supseteq
        \\\\mathfrak{a} \\\\iff \\\\mathfrak{q} \\\\supseteq \\\\varphi(\\\\mathfrak{a})
        \\\\iff \\\\mathfrak{q} \\\\in V(\\\\varphi(\\\\mathfrak{a})B)$. Thus $f^{-1}(V(\\\\mathfrak{a}))
        = V(\\\\varphi(\\\\mathfrak{a})B)$ is closed, so $f$ is continuous, and for
        any $a \\\\in A$, $f^{-1}(D(a)) = D(\\\\varphi(a))$.\\n\\nFor each $\\\\mathfrak{q}
        \\\\in \\\\operatorname{Spec} B$, the ring homomorphism $\\\\varphi: A \\\\to
        B$ maps $A \\\\setminus f(\\\\mathfrak{q}) = A \\\\setminus \\\\varphi^{-1}(\\\\mathfrak{q})$
        into $B \\\\setminus \\\\mathfrak{q}$, and therefore induces a local homomorphism
        of local rings $\\\\varphi_{\\\\mathfrak{q}}: A_{f(\\\\mathfrak{q})} \\\\to
        B_{\\\\mathfrak{q}}$ satisfying $\\\\varphi_{\\\\mathfrak{q}}^{-1}(\\\\mathfrak{q}B_{\\\\mathfrak{q}})
        = f(\\\\mathfrak{q})A_{f(\\\\mathfrak{q})}$. For any open subset $V \\\\subseteq
        \\\\operatorname{Spec} A$, we define $f^\\\\#(V): \\\\mathcal{O}_{\\\\operatorname{Spec}
        A}(V) \\\\to \\\\mathcal{O}_{\\\\operatorname{Spec} B}(f^{-1}(V))$ by sending
        a section $s: V \\\\to \\\\bigsqcup_{\\\\mathfrak{p} \\\\in V} A_{\\\\mathfrak{p}}$
        to the section $f^\\\\#(V)(s): f^{-1}(V) \\\\to \\\\bigsqcup_{\\\\mathfrak{q}
        \\\\in f^{-1}(V)} B_{\\\\mathfrak{q}}$ given by $\\\\mathfrak{q} \\\\mapsto
        \\\\varphi_{\\\\mathfrak{q}}(s(f(\\\\mathfrak{q})))$. Because $s$ is locally
        a fraction $a/g$, $f^\\\\#(V)(s)$ is locally the fraction $\\\\varphi(a)/\\\\varphi(g)$,
        hence is a valid section of $\\\\mathcal{O}_{\\\\operatorname{Spec} B}(f^{-1}(V))$.
        On stalks at $\\\\mathfrak{q} \\\\in \\\\operatorname{Spec} B$, the induced
        map $f^\\\\#_{\\\\mathfrak{q}}: A_{f(\\\\mathfrak{q})} \\\\to B_{\\\\mathfrak{q}}$
        is precisely $\\\\varphi_{\\\\mathfrak{q}}$, which is a local homomorphism.
        Thus $(f, f^\\\\#)$ is a morphism of locally ringed spaces, and on global
        sections $f^\\\\#(\\\\operatorname{Spec} A): A \\\\to B$ recovers $\\\\varphi$.\\n\\n(2)
        First suppose $X = \\\\operatorname{Spec} B$, and let $(f, f^\\\\#): \\\\operatorname{Spec}
        B \\\\to \\\\operatorname{Spec} A$ be *any* morphism of locally ringed spaces.
        Let $\\\\varphi = f^\\\\#(\\\\operatorname{Spec} A): A = \\\\Gamma(\\\\operatorname{Spec}
        A, \\\\mathcal{O}_{\\\\operatorname{Spec} A}) \\\\to \\\\Gamma(\\\\operatorname{Spec}
        B, \\\\mathcal{O}_{\\\\operatorname{Spec} B}) = B$ be the induced ring homomorphism
        on global sections. For each point $\\\\mathfrak{q} \\\\in \\\\operatorname{Spec}
        B$, the stalk morphism $f^\\\\#_{\\\\mathfrak{q}}: \\\\mathcal{O}_{\\\\operatorname{Spec}
        A, f(\\\\mathfrak{q})} = A_{f(\\\\mathfrak{q})} \\\\to \\\\mathcal{O}_{\\\\operatorname{Spec}
        B, \\\\mathfrak{q}} = B_{\\\\mathfrak{q}}$ must fit into a commutative diagram
        with the canonical localization maps from global sections:\\n$$\\\\begin{array}{ccc}
        A & \\\\xrightarrow{\\\\;\\\\;\\\\varphi\\\\;\\\\;} & B \\\\\\\\ \\\\downarrow{\\\\scriptstyle\\\\mathrm{loc}}
        & & \\\\downarrow{\\\\scriptstyle\\\\mathrm{loc}} \\\\\\\\ A_{f(\\\\mathfrak{q})}
        & \\\\xrightarrow{\\\\;f^\\\\#_{\\\\mathfrak{q}}\\\\;} & B_{\\\\mathfrak{q}}
        \\\\end{array}$$\\nBecause $(f, f^\\\\#)$ is a morphism of *locally* ringed
        spaces, $f^\\\\#_{\\\\mathfrak{q}}$ is a local homomorphism of local rings,
        meaning $(f^\\\\#_{\\\\mathfrak{q}})^{-1}(\\\\mathfrak{q}B_{\\\\mathfrak{q}})
        = f(\\\\mathfrak{q})A_{f(\\\\mathfrak{q})}$. Taking preimages in $A$ along
        the vertical localization maps (using the fact that the preimage of $\\\\mathfrak{p}A_{\\\\mathfrak{p}}$
        in $A$ is $\\\\mathfrak{p}$) and using the commutativity of the square, we
        obtain:\\n$$f(\\\\mathfrak{q}) = \\\\mathrm{loc}^{-1}(f(\\\\mathfrak{q})A_{f(\\\\mathfrak{q})})
        = \\\\mathrm{loc}^{-1}((f^\\\\#_{\\\\mathfrak{q}})^{-1}(\\\\mathfrak{q}B_{\\\\mathfrak{q}}))
        = \\\\varphi^{-1}(\\\\mathrm{loc}^{-1}(\\\\mathfrak{q}B_{\\\\mathfrak{q}}))
        = \\\\varphi^{-1}(\\\\mathfrak{q}).$$\\nThus the underlying continuous map
        $f$ is uniquely determined by $\\\\varphi$ as $f(\\\\mathfrak{q}) = \\\\varphi^{-1}(\\\\mathfrak{q})$!
        Moreover, by the universal property of localization, the commutativity of
        the square forces $f^\\\\#_{\\\\mathfrak{q}}$ to equal $\\\\varphi_{\\\\mathfrak{q}}:
        A_{\\\\varphi^{-1}(\\\\mathfrak{q})} \\\\to B_{\\\\mathfrak{q}}$ for every
        $\\\\mathfrak{q} \\\\in \\\\operatorname{Spec} B$. Since a morphism of sheaves
        is completely determined by its maps on stalks, $f^\\\\#$ is also uniquely
        determined by $\\\\varphi$, so $(f, f^\\\\#) = \\\\operatorname{Spec}(\\\\varphi)$.\\n\\nFor
        a general scheme $X$, let $\\\\{U_i\\\\}_{i \\\\in I}$ be an open cover of
        $X$ by affine schemes $U_i \\\\cong \\\\operatorname{Spec} B_i$. Giving a
        ring homomorphism $\\\\varphi: A \\\\to \\\\Gamma(X, \\\\mathcal{O}_X)$ is
        equivalent (by the sheaf axiom for $\\\\mathcal{O}_X$) to giving compatible
        ring homomorphisms $\\\\varphi_i: A \\\\to \\\\Gamma(U_i, \\\\mathcal{O}_X)
        = B_i$ that agree on all overlaps $U_i \\\\cap U_j$. By the affine case just
        proved, each $\\\\varphi_i$ corresponds to a unique morphism of schemes $f_i:
        U_i \\\\to \\\\operatorname{Spec} A$, and the compatibility on overlaps ensures
        that $f_i|_{U_i \\\\cap U_j} = f_j|_{U_i \\\\cap U_j}$ (covered by affine
        opens), allowing the morphisms $f_i$ to glue uniquely to a global morphism
        of schemes $f: X \\\\to \\\\operatorname{Spec} A$. $\\\\blacksquare$\\n\\nSince
        $\\\\Gamma(\\\\operatorname{Spec} \\\\mathbb{Z}, \\\\mathcal{O}_{\\\\operatorname{Spec}
        \\\\mathbb{Z}}) = \\\\mathbb{Z}$ is the initial object in the category of
        rings, Theorem 3.3.2(2) implies that $\\\\operatorname{Spec} \\\\mathbb{Z}$
        is the *terminal object* in the category $\\\\mathfrak{Sch}$: every scheme
        $X$ admits a unique morphism $X \\\\to \\\\operatorname{Spec} \\\\mathbb{Z}$.\\n\\n---\\n\\n###
        3.4 Projective Schemes and the $\\\\operatorname{Proj}$ Construction\\n\\nJust
        as we constructed affine schemes from arbitrary rings, we now construct projective
        schemes from arbitrary graded rings.\\n\\n**Definition 3.4.1.** Let $S = \\\\bigoplus_{d
        \\\\ge 0} S_d$ be a graded ring (so $S_d S_e \\\\subseteq S_{d+e}$). The ideal
        $S_+ = \\\\bigoplus_{d \\\\ge 1} S_d$ is called the *irrelevant ideal*. We
        define $\\\\operatorname{Proj} S$ to be the set of all homogeneous prime ideals
        $\\\\mathfrak{p} \\\\subset S$ that do *not* contain all of $S_+$:\\n$$\\\\operatorname{Proj}
        S = \\\\{\\\\mathfrak{p} \\\\subset S \\\\mid \\\\mathfrak{p} \\\\text{ is
        a homogeneous prime ideal and } S_+ \\\\not\\\\subseteq \\\\mathfrak{p}\\\\}.$$\\n\\nFor
        any homogeneous ideal $\\\\mathfrak{a} \\\\subseteq S$, we define $V_+(\\\\mathfrak{a})
        = \\\\{\\\\mathfrak{p} \\\\in \\\\operatorname{Proj} S \\\\mid \\\\mathfrak{a}
        \\\\subseteq \\\\mathfrak{p}\\\\}$. One verifies immediately (using the fact
        that if $\\\\mathfrak{p}$ is a homogeneous prime ideal and $ab \\\\in \\\\mathfrak{p}$
        for arbitrary elements $a, b \\\\in S$, then taking highest-degree non-p-components
        shows that homogeneity of $\\\\mathfrak{p}$ implies $\\\\mathfrak{p}$ is prime
        in the usual sense) that the sets $V_+(\\\\mathfrak{a})$ satisfy the axioms
        for closed subsets of a topology on $\\\\operatorname{Proj} S$, called the
        *Zariski topology*.\\n\\nFor any homogeneous element $f \\\\in S_+$ of degree
        $d = \\\\deg(f) \\\\ge 1$, we define the principal open subset\\n$$D_+(f)
        = \\\\{\\\\mathfrak{p} \\\\in \\\\operatorname{Proj} S \\\\mid f \\\\notin
        \\\\mathfrak{p}\\\\} = \\\\operatorname{Proj} S \\\\setminus V_+((f)).$$\\nFurthermore,
        inside the localized ring $S_f$ (which is $\\\\mathbb{Z}$-graded via $\\\\deg(a/f^m)
        = \\\\deg(a) - m \\\\deg(f)$), we define $S_{(f)} = (S_f)_0$ to be the subring
        of elements of *degree zero*:\\n$$S_{(f)} = \\\\left\\\\{\\\\frac{a}{f^m}
        \\\\in S_f \\\\;\\\\middle|\\\\; m \\\\ge 0,\\\\; a \\\\in S_{m \\\\deg(f)}\\\\right\\\\}.$$\\nSimilarly,
        for any $\\\\mathfrak{p} \\\\in \\\\operatorname{Proj} S$, we define $S_{(\\\\mathfrak{p})}$
        to be the degree-zero subring of the localization of $S$ at the multiplicative
        set $T_{\\\\mathfrak{p}}$ of all homogeneous elements in $S \\\\setminus \\\\mathfrak{p}$:\\n$$S_{(\\\\mathfrak{p})}
        = \\\\left\\\\{\\\\frac{a}{g} \\\\;\\\\middle|\\\\; a, g \\\\in S \\\\text{
        are homogeneous of the same degree, and } g \\\\notin \\\\mathfrak{p}\\\\right\\\\}.$$\\nNotice
        that $S_{(\\\\mathfrak{p})}$ is a local ring with unique maximal ideal $\\\\mathfrak{m}_{\\\\mathfrak{p}}
        = \\\\{a/g \\\\in S_{(\\\\mathfrak{p})} \\\\mid a \\\\in \\\\mathfrak{p}\\\\}$.\\n\\n**Definition
        3.4.2.** For each open subset $U \\\\subseteq \\\\operatorname{Proj} S$, we
        define $\\\\mathcal{O}_{\\\\operatorname{Proj} S}(U)$ to be the set of all
        functions $s: U \\\\to \\\\bigsqcup_{\\\\mathfrak{p} \\\\in U} S_{(\\\\mathfrak{p})}$
        such that $s(\\\\mathfrak{p}) \\\\in S_{(\\\\mathfrak{p})}$ for all $\\\\mathfrak{p}
        \\\\in U$, and $s$ is locally a quotient of homogeneous elements of the same
        degree: for each $\\\\mathfrak{p} \\\\in U$, there exist an open neighborhood
        $V \\\\subseteq U$ of $\\\\mathfrak{p}$ and homogeneous elements $a, f \\\\in
        S$ of the same degree such that for all $\\\\mathfrak{q} \\\\in V$, $f \\\\notin
        \\\\mathfrak{q}$ and $s(\\\\mathfrak{q}) = a/f$ in $S_{(\\\\mathfrak{q})}$.\\n\\n**Proposition
        3.4.3.** *Let $S$ be a graded ring.*\\n1. *For every $\\\\mathfrak{p} \\\\in
        \\\\operatorname{Proj} S$, the stalk $\\\\mathcal{O}_{\\\\operatorname{Proj}
        S, \\\\mathfrak{p}}$ is canonically isomorphic to the local ring $S_{(\\\\mathfrak{p})}$.*\\n2.
        *For every homogeneous element $f \\\\in S_+$, the open subsets $D_+(f)$ cover
        $\\\\operatorname{Proj} S$, and there is a canonical isomorphism of locally
        ringed spaces*\\n   $$(D_+(f), \\\\mathcal{O}_{\\\\operatorname{Proj} S}|_{D_+(f)})
        \\\\xrightarrow{\\\\;\\\\sim\\\\;} \\\\operatorname{Spec} S_{(f)}.$$\\n3.
        *Consequently, $(\\\\operatorname{Proj} S, \\\\mathcal{O}_{\\\\operatorname{Proj}
        S})$ is a scheme, equipped with a natural structure morphism $\\\\operatorname{Proj}
        S \\\\to \\\\operatorname{Spec} S_0$.*\\n\\n*Proof.* (1) The proof that $\\\\mathcal{O}_{\\\\operatorname{Proj}
        S, \\\\mathfrak{p}} \\\\cong S_{(\\\\mathfrak{p})}$ is identical to the proof
        of Theorem 3.2.2(1).\\n\\n(2) Let $f \\\\in S_d$ with $d \\\\ge 1$. Since
        no $\\\\mathfrak{p} \\\\in \\\\operatorname{Proj} S$ contains $S_+$, the sets
        $D_+(f)$ cover $\\\\operatorname{Proj} S$. Define a map $\\\\varphi: D_+(f)
        \\\\to \\\\operatorname{Spec} S_{(f)}$ by sending a homogeneous prime ideal
        $\\\\mathfrak{p} \\\\in D_+(f)$ to $\\\\varphi(\\\\mathfrak{p}) = (\\\\mathfrak{p}S_f)
        \\\\cap S_{(f)} = \\\\{a/f^m \\\\in S_{(f)} \\\\mid a \\\\in \\\\mathfrak{p}
        \\\\cap S_{md}\\\\}$. Conversely, given a prime ideal $\\\\mathfrak{q} \\\\in
        \\\\operatorname{Spec} S_{(f)}$, define a homogeneous ideal $\\\\psi(\\\\mathfrak{q})
        = \\\\bigoplus_{n \\\\ge 0} \\\\psi(\\\\mathfrak{q})_n$ in $S$ by setting\\n$$\\\\psi(\\\\mathfrak{q})_n
        = \\\\{a \\\\in S_n \\\\mid a^d / f^n \\\\in \\\\mathfrak{q}\\\\}.$$\\nLet
        us verify that $\\\\psi(\\\\mathfrak{q})$ is an ideal: if $a, b \\\\in \\\\psi(\\\\mathfrak{q})_n$,
        then $(a+b)^{2d}/f^{2n} = \\\\sum_{k=0}^{2d} \\\\binom{2d}{k} a^k b^{2d-k}
        / f^{2n}$. In each term, either $k \\\\ge d$ (so $a^d/f^n$ is a factor in
        $S_{(f)}$) or $2d-k \\u003e d$ (so $b^d/f^n$ is a factor in $S_{(f)}$), hence
        $(a+b)^{2d}/f^{2n} = ((a+b)^d/f^n)^2 \\\\in \\\\mathfrak{q}$. Since $\\\\mathfrak{q}$
        is prime, $(a+b)^d/f^n \\\\in \\\\mathfrak{q}$, so $a+b \\\\in \\\\psi(\\\\mathfrak{q})_n$.
        Moreover, for homogeneous $a \\\\in S_n$ and $b \\\\in S_m$, $(ab)^d/f^{n+m}
        = (a^d/f^n)(b^d/f^m) \\\\in \\\\mathfrak{q}$ if and only if $a^d/f^n \\\\in
        \\\\mathfrak{q}$ or $b^d/f^m \\\\in \\\\mathfrak{q}$, proving that $\\\\psi(\\\\mathfrak{q})$
        is a homogeneous prime ideal not containing $f$. One checks directly that
        $\\\\varphi$ and $\\\\psi$ are mutually inverse bijections that preserve basic
        open sets ($\\\\varphi(D_+(fg)) = D(g^d/f^{\\\\deg g})$), hence $\\\\varphi$
        is a homeomorphism. Furthermore, for each $\\\\mathfrak{p} \\\\in D_+(f)$,
        the localization $(S_{(f)})_{\\\\varphi(\\\\mathfrak{p})}$ is canonically
        isomorphic to $S_{(\\\\mathfrak{p})}$, identifying the structure sheaves of
        $D_+(f)$ and $\\\\operatorname{Spec} S_{(f)}$.\\n\\n(3) Since the affine schemes
        $D_+(f) \\\\cong \\\\operatorname{Spec} S_{(f)}$ cover $\\\\operatorname{Proj}
        S$, $\\\\operatorname{Proj} S$ is a scheme. For each $f \\\\in S_+$, the natural
        inclusion of the degree-zero base ring $S_0 \\\\hookrightarrow S_{(f)}$ ($a
        \\\\mapsto a/1$) induces morphisms $D_+(f) \\\\cong \\\\operatorname{Spec}
        S_{(f)} \\\\to \\\\operatorname{Spec} S_0$ which agree on overlaps $D_+(fg)$,
        gluing to the canonical structure morphism $\\\\operatorname{Proj} S \\\\to
        \\\\operatorname{Spec} S_0$. $\\\\blacksquare$\\n\\n**Example 3.4.4 (Projective
        $n$-Space over a Ring).** For any commutative ring $A$, we define *projective
        $n$-space over $A$* to be\\n$$\\\\mathbb{P}^n_A = \\\\operatorname{Proj} A[x_0,
        x_1, \\\\dots, x_n],$$\\nwhere the polynomial ring $A[x_0, \\\\dots, x_n]$
        is graded by total degree with $S_0 = A$. By Proposition 3.4.3(2), $\\\\mathbb{P}^n_A$
        is covered by the $n+1$ standard affine open subschemes $U_i = D_+(x_i) \\\\cong
        \\\\operatorname{Spec} A[x_0/x_i, \\\\dots, x_n/x_i] = \\\\mathbb{A}^n_A$
        for $0 \\\\le i \\\\le n$.\\n\\n---\\n\\n### 3.5 Fiber Products of Schemes\\n\\nIn
        classical geometry, the Cartesian product of two spaces is formed by taking
        the set-theoretic product of their underlying sets. In the category of schemes,
        the categorical product (or fiber product over a base scheme $S$) has an underlying
        topological space that is *not* the set-theoretic Cartesian product (for example,
        $\\\\mathbb{A}^1_k \\\\times_k \\\\mathbb{A}^1_k = \\\\mathbb{A}^2_k = \\\\operatorname{Spec}
        k[x, y]$ contains generic points of irreducible curves such as $(y - x)$ that
        do not arise as pairs of prime ideals from $k[x]$ and $k[y]$). Instead, the
        fiber product is defined by its universal property and constructed by gluing
        tensor products of rings.\\n\\n**Definition 3.5.1.** Let $S$ be a scheme,
        and let $\\\\pi_X: X \\\\to S$ and $\\\\pi_Y: Y \\\\to S$ be two schemes over
        $S$. A *fiber product* of $X$ and $Y$ over $S$, denoted $X \\\\times_S Y$,
        is a scheme equipped with morphisms $p_1: X \\\\times_S Y \\\\to X$ and $p_2:
        X \\\\times_S Y \\\\to Y$ (called the *projection morphisms*) such that $\\\\pi_X
        \\\\circ p_1 = \\\\pi_Y \\\\circ p_2$, satisfying the following universal
        property: for any scheme $Z$ and any pair of morphisms $f: Z \\\\to X$ and
        $g: Z \\\\to Y$ such that $\\\\pi_X \\\\circ f = \\\\pi_Y \\\\circ g$, there
        exists a unique morphism $\\\\theta: Z \\\\to X \\\\times_S Y$ such that $p_1
        \\\\circ \\\\theta = f$ and $p_2 \\\\circ \\\\theta = g$.\\n$$\\\\begin{array}{ccccc}
        Z & \\\\xrightarrow{\\\\;\\\\;\\\\exists!\\\\,\\\\theta\\\\;\\\\;} & X \\\\times_S
        Y & \\\\xrightarrow{\\\\;\\\\;p_2\\\\;\\\\;} & Y \\\\\\\\ & \\\\underset{f}{\\\\searrow}
        & \\\\downarrow{\\\\scriptstyle p_1} & & \\\\downarrow{\\\\scriptstyle \\\\pi_Y}
        \\\\\\\\ & & X & \\\\xrightarrow{\\\\;\\\\;\\\\pi_X\\\\;\\\\;} & S \\\\end{array}$$\\n\\n**Theorem
        3.5.2 (Existence of Fiber Products of Schemes).** *For any two morphisms of
        schemes $X \\\\to S$ and $Y \\\\to S$, the fiber product $X \\\\times_S Y$
        exists in the category of schemes, and is unique up to canonical isomorphism.*\\n\\n*Proof.*
        Uniqueness up to unique isomorphism is an immediate formal consequence of
        the universal property (Yoneda's Lemma). To prove existence, we proceed in
        four systematic steps, building from affine schemes to general schemes by
        gluing.\\n\\n**Step 1: $X$, $Y$, and $S$ are all affine.** Suppose $X = \\\\operatorname{Spec}
        A$, $Y = \\\\operatorname{Spec} B$, and $S = \\\\operatorname{Spec} R$. By
        Theorem 3.3.2, the morphisms $X \\\\to S$ and $Y \\\\to S$ correspond to ring
        homomorphisms $R \\\\to A$ and $R \\\\to B$, making $A$ and $B$ into $R$-algebras.
        Consider the tensor product $A \\\\otimes_R B$, which is equipped with canonical
        $R$-algebra homomorphisms $i_1: A \\\\to A \\\\otimes_R B$ ($a \\\\mapsto
        a \\\\otimes 1$) and $i_2: B \\\\to A \\\\otimes_R B$ ($b \\\\mapsto 1 \\\\otimes
        b$) satisfying the universal property of the coproduct in the category of
        $R$-algebras: for any commutative ring $C$ and ring homomorphisms $\\\\alpha:
        A \\\\to C$ and $\\\\beta: B \\\\to C$ agreeing on $R$, there exists a unique
        ring homomorphism $\\\\gamma: A \\\\otimes_R B \\\\to C$ such that $\\\\gamma
        \\\\circ i_1 = \\\\alpha$ and $\\\\gamma \\\\circ i_2 = \\\\beta$.\\n\\nApplying
        Theorem 3.3.2(2) to an arbitrary test scheme $Z$ (with $C = \\\\Gamma(Z, \\\\mathcal{O}_Z)$),
        we have natural bijections:\\n$$\\\\begin{aligned} \\\\operatorname{Hom}_{\\\\mathfrak{Sch}}(Z,
        \\\\operatorname{Spec}(A \\\\otimes_R B)) &\\\\cong \\\\operatorname{Hom}_{\\\\mathfrak{Rings}}(A
        \\\\otimes_R B, \\\\Gamma(Z, \\\\mathcal{O}_Z)) \\\\\\\\ &\\\\cong \\\\{(\\\\alpha,
        \\\\beta) \\\\in \\\\operatorname{Hom}(A, \\\\Gamma(Z, \\\\mathcal{O}_Z))
        \\\\times \\\\operatorname{Hom}(B, \\\\Gamma(Z, \\\\mathcal{O}_Z)) \\\\mid
        \\\\alpha|_R = \\\\beta|_R\\\\} \\\\\\\\ &\\\\cong \\\\{(f, g) \\\\in \\\\operatorname{Hom}_S(Z,
        \\\\operatorname{Spec} A) \\\\times \\\\operatorname{Hom}_S(Z, \\\\operatorname{Spec}
        B)\\\\}. \\\\end{aligned}$$\\nThus $\\\\operatorname{Spec}(A \\\\otimes_R
        B)$, equipped with $p_1 = \\\\operatorname{Spec}(i_1)$ and $p_2 = \\\\operatorname{Spec}(i_2)$,
        is the fiber product $\\\\operatorname{Spec} A \\\\times_{\\\\operatorname{Spec}
        R} \\\\operatorname{Spec} B$. Notice in particular that for $f \\\\in A$ and
        $g \\\\in B$, we have $D(f) \\\\times_{\\\\operatorname{Spec} R} D(g) \\\\cong
        \\\\operatorname{Spec}(A_f \\\\otimes_R B_g) \\\\cong \\\\operatorname{Spec}((A
        \\\\otimes_R B)_{f \\\\otimes g}) = D(f \\\\otimes g) \\\\subseteq \\\\operatorname{Spec}(A
        \\\\otimes_R B)$.\\n\\n**Step 2: Gluing Principle for Open Subschemes.** Observe
        that if $X \\\\times_S Y$ exists and $U \\\\subseteq X$ is an open subscheme,
        then the open subscheme $p_1^{-1}(U) \\\\subseteq X \\\\times_S Y$ (with the
        restricted projections $p_1|_{p_1^{-1}(U)}$ and $p_2|_{p_1^{-1}(U)}$) satisfies
        the universal property of $U \\\\times_S Y$. Indeed, any morphism $f: Z \\\\to
        U \\\\hookrightarrow X$ factors through $U$, so the induced map $\\\\theta:
        Z \\\\to X \\\\times_S Y$ satisfies $p_1(\\\\theta(Z)) = f(Z) \\\\subseteq
        U$, hence $\\\\theta(Z) \\\\subseteq p_1^{-1}(U)$.\\n\\nConversely, suppose
        $X = \\\\bigcup_{i \\\\in I} X_i$ is an open cover of $X$, and suppose that
        for every $i \\\\in I$, the fiber product $X_i \\\\times_S Y$ exists (with
        projections $p_{1,i}: X_i \\\\times_S Y \\\\to X_i$ and $p_{2,i}: X_i \\\\times_S
        Y \\\\to Y$). For each pair $(i, j) \\\\in I \\\\times I$, let $X_{ij} = X_i
        \\\\cap X_j$. By the observation above, both $p_{1,i}^{-1}(X_{ij}) \\\\subseteq
        X_i \\\\times_S Y$ and $p_{1,j}^{-1}(X_{ij}) \\\\subseteq X_j \\\\times_S
        Y$ satisfy the universal property of $X_{ij} \\\\times_S Y$. By uniqueness
        of the fiber product, there is a *unique* isomorphism of schemes\\n$$\\\\varphi_{ij}:
        p_{1,i}^{-1}(X_{ij}) \\\\xrightarrow{\\\\;\\\\sim\\\\;} p_{1,j}^{-1}(X_{ij})$$\\ncommuting
        with the projections to $X_{ij}$ and $Y$. Because $\\\\varphi_{ij}$ is characterized
        by this universal property, on any triple intersection $X_{ijk} = X_i \\\\cap
        X_j \\\\cap X_k$, both $\\\\varphi_{jk} \\\\circ \\\\varphi_{ij}$ and $\\\\varphi_{ik}$
        are the unique isomorphism between the two realizations of $X_{ijk} \\\\times_S
        Y$, so the cocycle condition $\\\\varphi_{jk} \\\\circ \\\\varphi_{ij} = \\\\varphi_{ik}$
        holds automatically!\\n\\nBy the Gluing Lemma for schemes (the locally ringed
        space version of Exercise 2.3), we can glue the schemes $\\\\{X_i \\\\times_S
        Y\\\\}_{i \\\\in I}$ along the open subschemes $p_{1,i}^{-1}(X_{ij})$ via
        $\\\\varphi_{ij}$ to obtain a scheme $W$ together with morphisms $p_1: W \\\\to
        X$ and $p_2: W \\\\to Y$ such that $p_1^{-1}(X_i) \\\\cong X_i \\\\times_S
        Y$. For any test scheme $Z$ with morphisms $f: Z \\\\to X$ and $g: Z \\\\to
        Y$ over $S$, let $Z_i = f^{-1}(X_i)$. The universal property of $X_i \\\\times_S
        Y$ gives unique morphisms $\\\\theta_i: Z_i \\\\to X_i \\\\times_S Y \\\\subseteq
        W$, and by uniqueness on $Z_i \\\\cap Z_j = f^{-1}(X_{ij})$, we have $\\\\theta_i|_{Z_i
        \\\\cap Z_j} = \\\\theta_j|_{Z_i \\\\cap Z_j}$. Thus the $\\\\theta_i$ glue
        to a unique morphism $\\\\theta: Z \\\\to W$, proving $W = X \\\\times_S Y$.\\n\\n**Step
        3: $Y$ and $S$ are affine, $X$ is arbitrary.** Let $X = \\\\bigcup_{i \\\\in
        I} X_i$ be an open cover of $X$ by affine open subschemes. By Step 1, $X_i
        \\\\times_S Y$ exists for every $i \\\\in I$. By Step 2, $X \\\\times_S Y$
        exists. By symmetry, $X \\\\times_S Y$ exists whenever $S$ is affine and $X,
        Y$ are arbitrary (cover $Y = \\\\bigcup_{j \\\\in J} Y_j$ by affines and apply
        Step 2 to $Y$).\\n\\n**Step 4: $X$, $Y$, and $S$ are all arbitrary.** Let
        $S = \\\\bigcup_{\\\\alpha \\\\in A} S_\\\\alpha$ be an affine open cover
        of $S$. Let $X_\\\\alpha = \\\\pi_X^{-1}(S_\\\\alpha)$ and $Y_\\\\alpha =
        \\\\pi_Y^{-1}(S_\\\\alpha)$. By Step 3, $X_\\\\alpha \\\\times_{S_\\\\alpha}
        Y_\\\\alpha$ exists for every $\\\\alpha \\\\in A$. Moreover, we claim that
        $X_\\\\alpha \\\\times_{S_\\\\alpha} Y_\\\\alpha$ is also the fiber product
        $X_\\\\alpha \\\\times_S Y$: indeed, any pair of morphisms $f: Z \\\\to X_\\\\alpha$
        and $g: Z \\\\to Y$ satisfying $\\\\pi_X \\\\circ f = \\\\pi_Y \\\\circ g$
        automatically satisfies $\\\\pi_Y(g(Z)) = \\\\pi_X(f(Z)) \\\\subseteq S_\\\\alpha$,
        so $g$ factors uniquely through $Y_\\\\alpha = \\\\pi_Y^{-1}(S_\\\\alpha)$.
        Thus $X_\\\\alpha \\\\times_S Y = X_\\\\alpha \\\\times_{S_\\\\alpha} Y_\\\\alpha$
        exists for every $\\\\alpha \\\\in A$. Since $\\\\{X_\\\\alpha\\\\}_{\\\\alpha
        \\\\in A}$ is an open cover of $X$, applying Step 2 one final time glues the
        schemes $X_\\\\alpha \\\\times_S Y$ into the global fiber product $X \\\\times_S
        Y$. $\\\\blacksquare$\\n\\n**Definition 3.5.3 (Fibers and Base Change).**
        Let $f: X \\\\to Y$ be a morphism of schemes.\\n1. If $Y' \\\\to Y$ is any
        morphism of schemes, the projection $f': X' = X \\\\times_Y Y' \\\\to Y'$
        is called the *base change* (or *pullback*) of $f$ along $Y' \\\\to Y$.\\n2.
        Let $y \\\\in Y$ be a point with local ring $\\\\mathcal{O}_{Y,y}$ and residue
        field $\\\\kappa(y) = \\\\mathcal{O}_{Y,y}/\\\\mathfrak{m}_y$. There is a
        canonical morphism $\\\\operatorname{Spec} \\\\kappa(y) \\\\to Y$ whose image
        is $\\\\{y\\\\}$ (induced on any affine open $\\\\operatorname{Spec} A \\\\ni
        y$ by $A \\\\to A_{\\\\mathfrak{p}_y} \\\\to \\\\kappa(y)$). The *schematic
        fiber* of $f$ over $y$ is defined to be the scheme\\n   $$X_y = X \\\\times_Y
        \\\\operatorname{Spec} \\\\kappa(y).$$\\n   One verifies that the projection
        $X_y \\\\to X$ induces a homeomorphism of the underlying topological space
        of $X_y$ onto the set-theoretic fiber $f^{-1}(y) \\\\subseteq X$, endowing
        $f^{-1}(y)$ with the natural structure of a scheme over the field $\\\\kappa(y)$.\\n\\n---\\n\\n###
        3.6 Separated and Proper Morphisms\\n\\nAs observed in Chapter 1, the Zariski
        topology is almost never Hausdorff. In scheme theory, the role of the Hausdorff
        condition is played by *separatedness*, and the role of compactness (or properness
        of maps between locally compact Hausdorff spaces) is played by *properness*.\\n\\n**Definition
        3.6.1.** Let $f: X \\\\to Y$ be a morphism of schemes. Applying the universal
        property of the fiber product $X \\\\times_Y X$ to the identity morphisms
        $\\\\operatorname{id}_X: X \\\\to X$ and $\\\\operatorname{id}_X: X \\\\to
        X$ produces a canonical morphism\\n$$\\\\Delta = \\\\Delta_{X/Y}: X \\\\longrightarrow
        X \\\\times_Y X,$$\\nsatisfying $p_1 \\\\circ \\\\Delta = \\\\operatorname{id}_X$
        and $p_2 \\\\circ \\\\Delta = \\\\operatorname{id}_X$, called the *diagonal
        morphism*.\\n\\nBefore stating the definition of separatedness, we formalize
        the notion of closed immersions.\\n\\n**Definition 3.6.2.** A morphism of
        schemes $i: Z \\\\to X$ is a *closed immersion* if $i$ induces a homeomorphism
        of the underlying topological space of $Z$ onto a closed subset of $X$, and
        the morphism of sheaves $i^\\\\#: \\\\mathcal{O}_X \\\\to i_*\\\\mathcal{O}_Z$
        is surjective (as a morphism of sheaves on $X$). A morphism $j: U \\\\to X$
        is an *open immersion* if it induces an isomorphism of $U$ onto an open subscheme
        $(V, \\\\mathcal{O}_X|_V)$ of $X$. An *immersion* (or *locally closed immersion*)
        is a morphism that factors as $Z \\\\xrightarrow{i} U \\\\xrightarrow{j} X$
        where $i$ is a closed immersion and $j$ is an open immersion.\\n\\n**Proposition
        3.6.3.** *For any morphism of schemes $f: X \\\\to Y$, the diagonal morphism
        $\\\\Delta_{X/Y}: X \\\\to X \\\\times_Y X$ is a locally closed immersion.*\\n\\n*Proof.*
        If $X = \\\\operatorname{Spec} A$ and $Y = \\\\operatorname{Spec} B$ are affine,
        then $X \\\\times_Y X = \\\\operatorname{Spec}(A \\\\otimes_B A)$, and $\\\\Delta_{X/Y}$
        corresponds to the multiplication homomorphism $\\\\mu: A \\\\otimes_B A \\\\to
        A$ given by $a_1 \\\\otimes a_2 \\\\mapsto a_1 a_2$. Since $\\\\mu(\\\\sum
        a_i \\\\otimes 1) = \\\\sum a_i$, $\\\\mu$ is a *surjective* ring homomorphism!
        For any surjective ring homomorphism $\\\\mu: R \\\\twoheadrightarrow R/I$,
        the induced map $\\\\operatorname{Spec}(R/I) \\\\to \\\\operatorname{Spec}
        R$ is a homeomorphism onto the closed subset $V(I)$ with surjective sheaf
        map $\\\\mathcal{O}_{\\\\operatorname{Spec} R} \\\\twoheadrightarrow i_*\\\\mathcal{O}_{\\\\operatorname{Spec}(R/I)}$,
        hence is a closed immersion.\\n\\nFor general schemes $X$ and $Y$, choose
        an affine open cover $Y = \\\\bigcup_\\\\alpha V_\\\\alpha$ and for each $\\\\alpha$
        an affine open cover $f^{-1}(V_\\\\alpha) = \\\\bigcup_i U_{\\\\alpha, i}$.
        Then the open subschemes $W_{\\\\alpha, i} = U_{\\\\alpha, i} \\\\times_{V_\\\\alpha}
        U_{\\\\alpha, i}$ are open in $X \\\\times_Y X$. Let $W = \\\\bigcup_{\\\\alpha,
        i} W_{\\\\alpha, i} \\\\subseteq X \\\\times_Y X$. Since $\\\\Delta_{X/Y}(U_{\\\\alpha,
        i}) \\\\subseteq W_{\\\\alpha, i}$, the image of $\\\\Delta_{X/Y}$ is contained
        in the open subscheme $W$. Moreover, $\\\\Delta_{X/Y}^{-1}(W_{\\\\alpha, i})
        = U_{\\\\alpha, i}$ (since $p_1(x, x') \\\\in U_{\\\\alpha, i}$ and $p_2(x,
        x') \\\\in U_{\\\\alpha, i}$ implies $x \\\\in U_{\\\\alpha, i}$), and on
        each $W_{\\\\alpha, i}$, the restriction of $\\\\Delta_{X/Y}$ is the affine
        diagonal $U_{\\\\alpha, i} \\\\to U_{\\\\alpha, i} \\\\times_{V_\\\\alpha}
        U_{\\\\alpha, i}$, which is a closed immersion by the first paragraph. Because
        being a closed immersion is local on the target, $\\\\Delta_{X/Y}: X \\\\to
        W$ is a closed immersion into the open subscheme $W \\\\subseteq X \\\\times_Y
        X$. $\\\\blacksquare$\\n\\n**Definition 3.6.4.** A morphism of schemes $f:
        X \\\\to Y$ is called *separated* if the diagonal morphism $\\\\Delta_{X/Y}:
        X \\\\to X \\\\times_Y X$ is a *closed immersion*. By Proposition 3.6.3, $\\\\Delta_{X/Y}$
        is already a locally closed immersion, so $f: X \\\\to Y$ is separated if
        and only if the image $\\\\Delta_{X/Y}(X)$ is a *closed* subset of the topological
        space $X \\\\times_Y X$. A scheme $X$ is called *separated* if its canonical
        morphism $X \\\\to \\\\operatorname{Spec} \\\\mathbb{Z}$ is separated.\\n\\nBy
        the proof of Proposition 3.6.3, every morphism between affine schemes is separated.\\n\\n**Definition
        3.6.5.** Let $f: X \\\\to Y$ be a morphism of schemes.\\n1. $f$ is *locally
        of finite type* if there exists an affine open cover $Y = \\\\bigcup_i \\\\operatorname{Spec}
        B_i$ such that for each $i$, $f^{-1}(\\\\operatorname{Spec} B_i)$ can be covered
        by affine open subschemes $\\\\operatorname{Spec} A_{ij}$ where each $A_{ij}$
        is a finitely generated $B_i$-algebra.\\n2. $f$ is *quasi-compact* if the
        preimage $f^{-1}(V)$ of every quasi-compact open subset $V \\\\subseteq Y$
        is quasi-compact.\\n3. $f$ is *of finite type* if it is locally of finite
        type and quasi-compact (meaning each $f^{-1}(\\\\operatorname{Spec} B_i)$
        can be covered by *finitely many* $\\\\operatorname{Spec} A_{ij}$ with $A_{ij}$
        finitely generated over $B_i$).\\n4. $f$ is *universally closed* if $f$ is
        a closed map (maps closed subsets to closed subsets) and for every morphism
        $Y' \\\\to Y$, the base change $f': X \\\\times_Y Y' \\\\to Y'$ is also a
        closed map.\\n5. $f$ is *proper* if $f$ is separated, of finite type, and
        universally closed.\\n\\nTesting universal closedness directly from the definition
        requires checking all possible base changes $Y' \\\\to Y$. Remarkably, Grothendieck
        proved that separatedness and properness can be tested using only *valuation
        rings*, providing a scheme-theoretic analogue of the sequential compactness
        criterion in metric spaces (where $\\\\operatorname{Spec} R$ plays the role
        of a convergent sequence with generic point $\\\\operatorname{Spec} K$ and
        limit point $\\\\operatorname{Spec}(R/\\\\mathfrak{m})$).\\n\\nRecall that
        an integral domain $R$ with field of fractions $K$ is a *valuation ring* if
        for every non-zero element $x \\\\in K^\\\\times$, either $x \\\\in R$ or
        $x^{-1} \\\\in R$. Every valuation ring is a local ring.\\n\\n**Theorem 3.6.6
        (Valuative Criteria of Separatedness and Properness).** *Let $f: X \\\\to
        Y$ be a morphism of schemes of finite type, with $X$ Noetherian (or more generally,
        let $f$ be quasi-separated and of finite type). For any valuation ring $R$
        with field of fractions $K$, consider a commutative diagram of solid arrows:*\\n$$\\\\begin{array}{ccc}
        \\\\operatorname{Spec} K & \\\\xrightarrow{\\\\;\\\\;u\\\\;\\\\;} & X \\\\\\\\
        \\\\downarrow{\\\\scriptstyle i} & \\\\nearrow{\\\\scriptstyle\\\\exists!\\\\,v}
        & \\\\downarrow{\\\\scriptstyle f} \\\\\\\\ \\\\operatorname{Spec} R & \\\\xrightarrow{\\\\;\\\\;g\\\\;\\\\;}
        & Y \\\\end{array}$$\\n*where $i: \\\\operatorname{Spec} K \\\\to \\\\operatorname{Spec}
        R$ is induced by the inclusion $R \\\\hookrightarrow K$. Then:*\\n1. **(Valuative
        Criterion of Separatedness)** *$f$ is separated if and only if for every valuation
        ring $R$ and every diagram as above, there exists at most one morphism $v:
        \\\\operatorname{Spec} R \\\\to X$ making both triangles commute.*\\n2. **(Valuative
        Criterion of Properness)** *$f$ is proper if and only if for every valuation
        ring $R$ and every diagram as above, there exists a unique morphism $v: \\\\operatorname{Spec}
        R \\\\to X$ making both triangles commute.*\\n\\n*Proof (of the Direct Implications
        and Geometric Mechanism).* We give the complete proof that separatedness implies
        uniqueness of $v$, and that projective space $\\\\mathbb{P}^n_Y \\\\to Y$
        satisfies the valuative criterion of properness.\\n\\nSuppose $f: X \\\\to
        Y$ is separated, and let $v_1, v_2: \\\\operatorname{Spec} R \\\\to X$ be
        two morphisms satisfying $f \\\\circ v_1 = f \\\\circ v_2 = g$ and $v_1 \\\\circ
        i = v_2 \\\\circ i = u$. By the universal property of $X \\\\times_Y X$, the
        pair $(v_1, v_2)$ defines a morphism $w: \\\\operatorname{Spec} R \\\\to X
        \\\\times_Y X$. Since $v_1 \\\\circ i = v_2 \\\\circ i$, the composition $w
        \\\\circ i: \\\\operatorname{Spec} K \\\\to X \\\\times_Y X$ factors through
        the diagonal $\\\\Delta_{X/Y}(X)$. Let $\\\\xi \\\\in \\\\operatorname{Spec}
        R$ be the generic point $(0)$ (the image of $\\\\operatorname{Spec} K$), so
        $w(\\\\xi) \\\\in \\\\Delta_{X/Y}(X)$. Because $R$ is an integral domain,
        the closure of $\\\\{\\\\xi\\\\}$ in $\\\\operatorname{Spec} R$ is all of
        $\\\\operatorname{Spec} R$. Since $f$ is separated, $\\\\Delta_{X/Y}(X)$ is
        closed in $X \\\\times_Y X$, so $w^{-1}(\\\\Delta_{X/Y}(X))$ is a closed subset
        of $\\\\operatorname{Spec} R$ containing the dense point $\\\\xi$, hence equals
        all of $\\\\operatorname{Spec} R$. Moreover, $\\\\operatorname{Spec} R$ is
        reduced (since $R$ is a domain), and any morphism from a reduced scheme whose
        topological image lies in a closed subscheme factors uniquely through that
        closed subscheme. Thus $w$ factors through $\\\\Delta_{X/Y}: X \\\\to X \\\\times_Y
        X$, which means $v_1 = p_1 \\\\circ w = p_2 \\\\circ w = v_2$.\\n\\nConversely,
        if $\\\\Delta_{X/Y}(X)$ were not closed in $X \\\\times_Y X$, there would
        exist a point $z_1 \\\\in \\\\Delta_{X/Y}(X)$ and a point $z_0 \\\\in \\\\overline{\\\\{z_1\\\\}}
        \\\\setminus \\\\Delta_{X/Y}(X)$ (a specialization of $z_1$). By Chevalley's
        theorem on the existence of valuation rings dominating local rings of integral
        closures, one constructs a valuation ring $R \\\\subseteq \\\\kappa(z_1)$
        whose local homomorphism $\\\\mathcal{O}_{X \\\\times_Y X, z_0} \\\\to R$
        gives a morphism $w = (v_1, v_2): \\\\operatorname{Spec} R \\\\to X \\\\times_Y
        X$ sending the generic point $\\\\xi$ to $z_1 \\\\in \\\\Delta_{X/Y}(X)$ (so
        $v_1 \\\\circ i = v_2 \\\\circ i$) and the closed point $\\\\mathfrak{m}$
        to $z_0 \\\\notin \\\\Delta_{X/Y}(X)$ (so $v_1 \\\\neq v_2$).\\n\\nSimilarly,
        a morphism $f: X \\\\to Y$ is closed if and only if it is *stable under specialization*
        (for any $x_1 \\\\in X$ and any $y_0 \\\\in \\\\overline{\\\\{f(x_1)\\\\}}
        \\\\subseteq Y$, there exists $x_0 \\\\in \\\\overline{\\\\{x_1\\\\}}$ with
        $f(x_0) = y_0$). The existence of the lift $v: \\\\operatorname{Spec} R \\\\to
        X$ in (2) is the exact translation of stability under specialization for all
        base changes $Y' \\\\to Y$, because sending the closed point of $\\\\operatorname{Spec}
        R$ to $x_0 = v(\\\\mathfrak{m}) \\\\in X$ produces the required specialization
        of $x_1 = u(\\\\xi)$ lying over $y_0 = g(\\\\mathfrak{m})$. $\\\\blacksquare$\\n\\n**Corollary
        3.6.7.** *For any scheme $Y$ and any integer $n \\\\ge 0$, the projective
        space $\\\\mathbb{P}^n_Y = \\\\mathbb{P}^n_{\\\\mathbb{Z}} \\\\times_{\\\\operatorname{Spec}
        \\\\mathbb{Z}} Y \\\\to Y$ is proper over $Y$. Consequently, any closed subscheme
        $X \\\\subseteq \\\\mathbb{P}^n_Y$ is proper over $Y$.*\\n\\n*Proof.* Since
        properness is stable under base change (as the valuative diagram over $Y$
        immediately projects to a valuative diagram over $\\\\operatorname{Spec} \\\\mathbb{Z}$),
        it suffices to verify the Valuative Criterion of Properness for $\\\\mathbb{P}^n_{\\\\mathbb{Z}}
        \\\\to \\\\operatorname{Spec} \\\\mathbb{Z}$. Let $R$ be a valuation ring
        with fraction field $K$, and suppose we are given a morphism $u: \\\\operatorname{Spec}
        K \\\\to \\\\mathbb{P}^n_{\\\\mathbb{Z}}$. Since $\\\\operatorname{Spec} K$
        consists of a single point, its image lies in at least one of the standard
        affine open charts $U_i = D_+(x_i) \\\\cong \\\\operatorname{Spec} \\\\mathbb{Z}[x_0/x_i,
        \\\\dots, x_n/x_i]$. On the intersection $\\\\bigcap_{j \\\\in J} U_j$ of
        all charts containing $u(\\\\operatorname{Spec} K)$, the morphism $u$ is given
        by assigning non-zero elements $a_j \\\\in K^\\\\times$ representing the homogeneous
        coordinates (Specifically, $x_j/x_i \\\\mapsto a_j/a_i \\\\in K^\\\\times$
        for $j \\\\in J$, and $x_j/x_i \\\\mapsto 0 = a_j/a_i$ for $j \\\\notin J$).\\n\\nIn
        the valuation ring $R$, the finitely many non-zero ratios $a_j / a_k \\\\in
        K^\\\\times$ ($j, k \\\\in J$) are totally ordered by divisibility in $R$
        (since for each pair, either $a_j/a_k \\\\in R$ or $a_k/a_j \\\\in R$). Therefore,
        there exists an index $m \\\\in J$ such that $a_j / a_m \\\\in R$ for *all*
        $j \\\\in \\\\{0, 1, \\\\dots, n\\\\}$! This defines a ring homomorphism $\\\\mathbb{Z}[x_0/x_m,
        \\\\dots, x_n/x_m] \\\\to R$ sending $x_j/x_m \\\\mapsto a_j/a_m \\\\in R$,
        which corresponds to a morphism $v: \\\\operatorname{Spec} R \\\\to U_m \\\\subseteq
        \\\\mathbb{P}^n_{\\\\mathbb{Z}}$ extending $u$. Uniqueness holds because on
        overlaps $U_i \\\\cap U_m = \\\\operatorname{Spec} \\\\mathbb{Z}[x_0/x_m,
        \\\\dots, (x_i/x_m)^{\\\\pm 1}, \\\\dots]$, any two lifts agree after localizing
        to $K$, and $R \\\\hookrightarrow K$ is injective. Finally, a closed immersion
        is clearly proper, and the composition of proper morphisms is proper, so any
        closed subscheme $X \\\\subseteq \\\\mathbb{P}^n_Y$ is proper over $Y$. $\\\\blacksquare$\\n\\n---\\n\\n###
        Exercises for Chapter 3\\n\\n**Exercise 3.1.** Describe completely the topological
        space and stalks of $\\\\operatorname{Spec} A$ for the following rings:\\n(a)
        $A = \\\\mathbb{Z}$.\\n(b) $A = k[x]/(x^2)$ (the ring of dual numbers over
        a field $k$).\\n(c) $A = \\\\mathbb{Z}[x]$ (describe the prime ideals of height
        $0$, $1$, and $2$, and sketch the fibers of the natural morphism $\\\\operatorname{Spec}
        \\\\mathbb{Z}[x] \\\\to \\\\operatorname{Spec} \\\\mathbb{Z}$).\\n(d) $A =
        k[x]_{(x)}$, a discrete valuation ring.\\n\\n**Exercise 3.2.** Let $X$ be
        a scheme.\\n(a) $X$ is called *reduced* if $\\\\mathcal{O}_X(U)$ has no non-zero
        nilpotent elements for every open $U \\\\subseteq X$. Prove that $X$ is reduced
        if and only if the stalk $\\\\mathcal{O}_{X,P}$ has no non-zero nilpotent
        elements for every $P \\\\in X$.\\n(b) $X$ is called *integral* if $\\\\mathcal{O}_X(U)$
        is an integral domain for every non-empty open $U \\\\subseteq X$. Prove that
        $X$ is integral if and only if $X$ is both reduced and irreducible.\\n(c)
        For any scheme $X$, let $\\\\mathcal{N}_X$ be the sheaf of nilpotent elements
        of $\\\\mathcal{O}_X$ ($\\\\mathcal{N}_X(U)$ is the nilradical of $\\\\mathcal{O}_X(U)$),
        and define $\\\\mathcal{O}_{X_{\\\\text{red}}}$ to be the sheafification of
        $U \\\\mapsto \\\\mathcal{O}_X(U)/\\\\mathcal{N}_X(U)$. Prove that $X_{\\\\text{red}}
        = (X, \\\\mathcal{O}_{X_{\\\\text{red}}})$ is a reduced closed subscheme of
        $X$ (with the same underlying topological space) satisfying the universal
        property that every morphism from a reduced scheme $Z \\\\to X$ factors uniquely
        through $X_{\\\\text{red}} \\\\hookrightarrow X$.\\n\\n**Exercise 3.3.** (The
        Affine Line with a Doubled Origin) Let $X_1 = \\\\operatorname{Spec} k[x]$
        and $X_2 = \\\\operatorname{Spec} k[y]$ be two copies of $\\\\mathbb{A}^1_k$.
        Let $U_1 = D(x) = \\\\operatorname{Spec} k[x, x^{-1}] \\\\subseteq X_1$ and
        $U_2 = D(y) = \\\\operatorname{Spec} k[y, y^{-1}] \\\\subseteq X_2$.\\n(a)
        Let $X$ be the scheme obtained by gluing $X_1$ and $X_2$ along $U_1$ and $U_2$
        via the isomorphism $U_1 \\\\xrightarrow{\\\\sim} U_2$ induced by $y \\\\mapsto
        x$. Prove that $X$ is *not* separated over $k$ by showing that the image of
        $\\\\Delta: X \\\\to X \\\\times_k X$ is not closed, and also by exhibiting
        a failure of the Valuative Criterion of Separatedness using $R = k[t]_{(t)}$.\\n(b)
        Let $Y$ be the scheme obtained by gluing $X_1$ and $X_2$ along $U_1$ and $U_2$
        via the isomorphism induced by $y \\\\mapsto x^{-1}$. Prove that $Y$ is isomorphic
        to $\\\\mathbb{P}^1_k$, and is therefore separated and proper over $k$.\\n\\n**Exercise
        3.4.** Let $f: X \\\\to Y$ be a morphism of schemes, where $Y$ is separated.\\n(a)
        Prove that the *graph morphism* $\\\\Gamma_f = (\\\\operatorname{id}_X, f):
        X \\\\to X \\\\times_{\\\\operatorname{Spec} \\\\mathbb{Z}} Y$ is a closed
        immersion. *(Hint: Show that $\\\\Gamma_f$ is the base change of the diagonal
        $\\\\Delta_Y: Y \\\\to Y \\\\times Y$ along $f \\\\times \\\\operatorname{id}_Y:
        X \\\\times Y \\\\to Y \\\\times Y$.)*\\n(b) Prove that if $X$ is an affine
        scheme and $Y$ is separated, then for any two affine open subschemes $U, V
        \\\\subseteq X$ (or more generally, for any two affine open subschemes $U,
        V$ of a separated scheme $Y$), the intersection $U \\\\cap V$ is again an
        affine scheme! Give a counterexample when $Y$ is not separated using Exercise
        3.3(a).\\n\\n**Exercise 3.5.** Let $X$ be a proper scheme over a field $k$,
        and assume $X$ is connected and reduced. Prove that $\\\\Gamma(X, \\\\mathcal{O}_X)$
        is a finite field extension of $k$ (and hence $\\\\Gamma(X, \\\\mathcal{O}_X)
        = k$ if $k$ is algebraically closed). *(Hint: Any $s \\\\in \\\\Gamma(X, \\\\mathcal{O}_X)
        = \\\\operatorname{Hom}_k(X, \\\\mathbb{A}^1_k)$ can be composed with the
        open immersion $\\\\mathbb{A}^1_k \\\\hookrightarrow \\\\mathbb{P}^1_k$. Use
        the fact that $X \\\\to \\\\operatorname{Spec} k$ is proper to show that the
        image of $X$ in $\\\\mathbb{P}^1_k$ is closed, connected, and misses $\\\\infty
        \\\\in \\\\mathbb{P}^1_k$, hence must be a single closed point of $\\\\mathbb{A}^1_k$.)*\\n\\n**Exercise
        3.6.** Let $S$ be a graded ring generated as an $S_0$-algebra by $S_1$. For
        any integer $d \\\\ge 1$, define the *Veronese subring* $S^{(d)} = \\\\bigoplus_{n
        \\\\ge 0} S_{nd}$ (with grading $(S^{(d)})_n = S_{nd}$). Prove that there
        is a canonical isomorphism of schemes $\\\\operatorname{Proj} S \\\\xrightarrow{\\\\sim}
        \\\\operatorname{Proj} S^{(d)}$.\\n\\n**Exercise 3.7.** (Flatness and Going-Down)
        A morphism of schemes $f: X \\\\to Y$ is called *flat* if for every $x \\\\in
        X$, the local ring homomorphism $f^\\\\#_x: \\\\mathcal{O}_{Y, f(x)} \\\\to
        \\\\mathcal{O}_{X,x}$ makes $\\\\mathcal{O}_{X,x}$ a flat $\\\\mathcal{O}_{Y,
        f(x)}$-module.\\n(a) Prove that open immersions are flat, and that flatness
        is stable under base change ($X \\\\times_Y Y' \\\\to Y'$ is flat if $X \\\\to
        Y$ is flat).\\n(b) Using the Going-Down Theorem for flat homomorphisms of
        rings, prove that if $f: X \\\\to Y$ is flat, then for every $x \\\\in X$,
        the map $\\\\operatorname{Spec} \\\\mathcal{O}_{X,x} \\\\to \\\\operatorname{Spec}
        \\\\mathcal{O}_{Y, f(x)}$ is surjective (i.e., generalizations lift along
        flat morphisms).\\n\\n---\\n\\n## Chapter 4: Quasi-Coherent and Coherent Sheaves\\n\\nJust
        as modules over a ring $A$ are the linear objects through which one studies
        $A$, sheaves of $\\\\mathcal{O}_X$-modules\u2014specifically *quasi-coherent*
        and *coherent* sheaves\u2014are the linear objects (generalizing vector bundles
        and ideal sheaves) through which one studies a scheme $X$.\\n\\n---\\n\\n###
        4.1 Quasi-Coherent and Coherent Modules\\n\\n**Definition 4.1.1.** Let $(X,
        \\\\mathcal{O}_X)$ be a ringed space. A *sheaf of $\\\\mathcal{O}_X$-modules*
        (or simply an *$\\\\mathcal{O}_X$-module*) is a sheaf $\\\\mathcal{F}$ of
        abelian groups on $X$ such that for every open subset $U \\\\subseteq X$,
        $\\\\mathcal{F}(U)$ is equipped with the structure of an $\\\\mathcal{O}_X(U)$-module,
        and for every inclusion of open subsets $V \\\\subseteq U$, the restriction
        map $\\\\mathcal{F}(U) \\\\to \\\\mathcal{F}(V)$ is compatible with the ring
        restriction $\\\\mathcal{O}_X(U) \\\\to \\\\mathcal{O}_X(V)$:\\n$$(a \\\\cdot
        s)|_V = a|_V \\\\cdot s|_V \\\\quad \\\\text{for all } a \\\\in \\\\mathcal{O}_X(U),\\\\;
        s \\\\in \\\\mathcal{F}(U).$$\\nA morphism of $\\\\mathcal{O}_X$-modules $\\\\varphi:
        \\\\mathcal{F} \\\\to \\\\mathcal{G}$ is a morphism of sheaves such that $\\\\varphi(U):
        \\\\mathcal{F}(U) \\\\to \\\\mathcal{G}(U)$ is an $\\\\mathcal{O}_X(U)$-module
        homomorphism for every open $U \\\\subseteq X$. The category of $\\\\mathcal{O}_X$-modules
        is denoted $\\\\mathfrak{Mod}(\\\\mathcal{O}_X)$.\\n\\nNow let $A$ be a commutative
        ring, $X = \\\\operatorname{Spec} A$, and $M$ an $A$-module. Exactly as we
        constructed the structure sheaf $\\\\mathcal{O}_{\\\\operatorname{Spec} A}$
        from $A$ in Definition 3.2.1, we associate to $M$ a canonical $\\\\mathcal{O}_X$-module
        $\\\\widetilde{M}$.\\n\\n**Definition 4.1.2.** Let $A$ be a ring, $X = \\\\operatorname{Spec}
        A$, and $M$ an $A$-module. For each open subset $U \\\\subseteq X$, we define
        $\\\\widetilde{M}(U)$ to be the set of all functions\\n$$s: U \\\\longrightarrow
        \\\\bigsqcup_{\\\\mathfrak{p} \\\\in U} M_{\\\\mathfrak{p}}$$\\nsuch that
        $s(\\\\mathfrak{p}) \\\\in M_{\\\\mathfrak{p}}$ for every $\\\\mathfrak{p}
        \\\\in U$, and for every $\\\\mathfrak{p} \\\\in U$ there exist an open neighborhood
        $V \\\\subseteq U$ of $\\\\mathfrak{p}$ and elements $m \\\\in M$, $f \\\\in
        A$ such that for all $\\\\mathfrak{q} \\\\in V$, $f \\\\notin \\\\mathfrak{q}$
        and $s(\\\\mathfrak{q}) = m/f$ in $M_{\\\\mathfrak{q}}$. Under pointwise operations
        and restriction of functions, $\\\\widetilde{M}$ is clearly a sheaf of $\\\\mathcal{O}_X$-modules
        on $X = \\\\operatorname{Spec} A$.\\n\\n**Theorem 4.1.3.** *Let $A$ be a ring,
        $X = \\\\operatorname{Spec} A$, and $M$ an $A$-module.*\\n1. *For every $\\\\mathfrak{p}
        \\\\in X$, the stalk $(\\\\widetilde{M})_{\\\\mathfrak{p}}$ is canonically
        isomorphic to the localized $A_{\\\\mathfrak{p}}$-module $M_{\\\\mathfrak{p}}$.*\\n2.
        *For every $f \\\\in A$, the module of sections $\\\\Gamma(D(f), \\\\widetilde{M})$
        is canonically isomorphic to the localized $A_f$-module $M_f$. In particular,
        $\\\\Gamma(X, \\\\widetilde{M}) \\\\cong M$.*\\n3. *The functor $M \\\\mapsto
        \\\\widetilde{M}$ from the category $\\\\mathfrak{Mod}(A)$ of $A$-modules
        to $\\\\mathfrak{Mod}(\\\\mathcal{O}_X)$ is an exact, fully faithful functor
        that commutes with arbitrary direct sums, tensor products ($\\\\widetilde{M
        \\\\otimes_A N} \\\\cong \\\\widetilde{M} \\\\otimes_{\\\\mathcal{O}_X} \\\\widetilde{N}$),
        and localizations ($\\\\widetilde{M}|_{D(f)} \\\\cong \\\\widetilde{M_f}$).*\\n\\n*Proof.*
        The proofs of (1) and (2) are word-for-word identical to the proof of Theorem
        3.2.2, replacing elements $a \\\\in A$ in numerators by elements $m \\\\in
        M$.\\n\\nFor (3), let $M' \\\\to M \\\\to M''$ be an exact sequence of $A$-modules.
        For every $\\\\mathfrak{p} \\\\in X$, localization at $\\\\mathfrak{p}$ is
        an exact functor, so $M'_{\\\\mathfrak{p}} \\\\to M_{\\\\mathfrak{p}} \\\\to
        M''_{\\\\mathfrak{p}}$ is exact. By (1) and Proposition 2.2.3(2), the sequence
        of sheaves $\\\\widetilde{M'} \\\\to \\\\widetilde{M} \\\\to \\\\widetilde{M''}$
        is exact. Full faithfulness follows from the adjunction between global sections
        $\\\\Gamma(X, -)$ and $\\\\widetilde{(-)}$: any morphism of $\\\\mathcal{O}_X$-modules
        $\\\\varphi: \\\\widetilde{M} \\\\to \\\\widetilde{N}$ induces an $A$-module
        homomorphism $\\\\varphi(X): M \\\\to N$, which in turn determines the stalk
        maps $\\\\varphi_{\\\\mathfrak{p}} = \\\\varphi(X)_{\\\\mathfrak{p}}: M_{\\\\mathfrak{p}}
        \\\\to N_{\\\\mathfrak{p}}$ and hence uniquely determines $\\\\varphi$. Commutation
        with direct sums and tensor products holds because both operations commute
        with localization on stalks. $\\\\blacksquare$\\n\\n**Definition 4.1.4.**
        Let $(X, \\\\mathcal{O}_X)$ be a scheme.\\n1. An $\\\\mathcal{O}_X$-module
        $\\\\mathcal{F}$ is called *quasi-coherent* if there exists an affine open
        cover $X = \\\\bigcup_{i \\\\in I} U_i$ (with $U_i = \\\\operatorname{Spec}
        A_i$) and for each $i \\\\in I$ an $A_i$-module $M_i$ such that $\\\\mathcal{F}|_{U_i}
        \\\\cong \\\\widetilde{M_i}$ as $\\\\mathcal{O}_{U_i}$-modules.\\n2. Suppose
        $X$ is a locally Noetherian scheme (meaning it can be covered by affine open
        subschemes $\\\\operatorname{Spec} A_i$ where each $A_i$ is a Noetherian ring).
        An $\\\\mathcal{O}_X$-module $\\\\mathcal{F}$ is called *coherent* if it is
        quasi-coherent and for each $i \\\\in I$, the $A_i$-module $M_i$ can be chosen
        to be a finitely generated $A_i$-module.\\n\\nWe denote the category of quasi-coherent
        $\\\\mathcal{O}_X$-modules by $\\\\mathfrak{QCoh}(X)$ and, when $X$ is locally
        Noetherian, the category of coherent $\\\\mathcal{O}_X$-modules by $\\\\mathfrak{Coh}(X)$.\\n\\nA
        crucial property of quasi-coherence is that if $\\\\mathcal{F}$ is locally
        of the form $\\\\widetilde{M_i}$ on *some* affine open cover, then it is of
        the form $\\\\widetilde{M}$ on *every* affine open subscheme of $X$.\\n\\n**Theorem
        4.1.5.** *Let $X$ be a scheme and $\\\\mathcal{F}$ an $\\\\mathcal{O}_X$-module.
        Then $\\\\mathcal{F}$ is quasi-coherent if and only if for every affine open
        subscheme $U = \\\\operatorname{Spec} A \\\\subseteq X$, there exists an $A$-module
        $M$ such that $\\\\mathcal{F}|_U \\\\cong \\\\widetilde{M}$ (namely, $M =
        \\\\Gamma(U, \\\\mathcal{F})$).*\\n\\n*Consequently, on an affine scheme $X
        = \\\\operatorname{Spec} A$, the functors $M \\\\mapsto \\\\widetilde{M}$
        and $\\\\mathcal{F} \\\\mapsto \\\\Gamma(X, \\\\mathcal{F})$ form an equivalence
        of categories between $\\\\mathfrak{Mod}(A)$ and $\\\\mathfrak{QCoh}(\\\\operatorname{Spec}
        A)$. Since $\\\\mathfrak{Mod}(A)$ is an abelian category, $\\\\mathfrak{QCoh}(X)$
        (and $\\\\mathfrak{Coh}(X)$ for locally Noetherian $X$) is an abelian subcategory
        of $\\\\mathfrak{Mod}(\\\\mathcal{O}_X)$: the kernel, cokernel, and image
        of any morphism of quasi-coherent (resp. coherent) sheaves are again quasi-coherent
        (resp. coherent).*\\n\\n*Proof.* ($\\\\Leftarrow$) This is immediate by choosing
        any affine open cover of $X$.\\n\\n($\\\\Rightarrow$) Suppose $\\\\mathcal{F}$
        is quasi-coherent, and let $U = \\\\operatorname{Spec} A \\\\subseteq X$ be
        an arbitrary affine open subscheme. Since $\\\\mathcal{F}$ is quasi-coherent,
        every point $P \\\\in U$ has an affine open neighborhood $V_P$ in $X$ on which
        $\\\\mathcal{F}|_{V_P} \\\\cong \\\\widetilde{N_P}$. Shrinking $V_P$ to a
        basic open subset $D(g_P)$ inside $U \\\\cap V_P$, and using the fact that
        the restriction of $\\\\widetilde{N_P}$ to a basic open subset is again tilde
        of a localized module, we can cover $U = \\\\operatorname{Spec} A$ by finitely
        many principal open subsets $D(g_1), \\\\dots, D(g_r)$ (by quasi-compactness
        of $\\\\operatorname{Spec} A$) such that for each $i = 1, \\\\dots, r$,\\n$$\\\\mathcal{F}|_{D(g_i)}
        \\\\cong \\\\widetilde{M_i}$$\\nfor some $A_{g_i}$-module $M_i = \\\\mathcal{F}(D(g_i))$.
        Moreover, on each overlap $D(g_i) \\\\cap D(g_j) = D(g_i g_j)$, we have $\\\\mathcal{F}(D(g_i
        g_j)) \\\\cong (M_i)_{g_j} \\\\cong (M_j)_{g_i}$.\\n\\nLet $M = \\\\Gamma(U,
        \\\\mathcal{F})$. Multiplication by sections gives a canonical morphism of
        $\\\\mathcal{O}_U$-modules $\\\\alpha: \\\\widetilde{M} \\\\to \\\\mathcal{F}|_U$.
        To prove that $\\\\alpha$ is an isomorphism, it suffices to prove that for
        every $f \\\\in A$, the localization map $\\\\psi: M_f \\\\to \\\\mathcal{F}(D(f))$
        is an isomorphism (then taking $f = g_i$ shows $M_{g_i} \\\\xrightarrow{\\\\sim}
        \\\\mathcal{F}(D(g_i)) = M_i$, so $\\\\alpha|_{D(g_i)}$ is an isomorphism
        for each $i$, whence $\\\\alpha$ is an isomorphism). Replacing $U$ by $D(f)$,
        it suffices to prove the following two fundamental lemmas for any $\\\\mathcal{F}$
        covered by $D(g_1), \\\\dots, D(g_r)$ with $\\\\mathcal{F}|_{D(g_i)} \\\\cong
        \\\\widetilde{M_i}$:\\n1. **(Uniqueness / Injectivity)** If $s \\\\in \\\\mathcal{F}(U)$
        and $f \\\\in A$ satisfies $s|_{D(f)} = 0$ in $\\\\mathcal{F}(D(f))$, then
        there exists an integer $N \\\\ge 1$ such that $f^N s = 0$ in $\\\\mathcal{F}(U)
        = M$.\\n2. **(Extension / Surjectivity)** For any section $t \\\\in \\\\mathcal{F}(D(f))$,
        there exist an integer $N \\\\ge 1$ and a global section $s \\\\in \\\\mathcal{F}(U)
        = M$ such that $s|_{D(f)} = f^N t$ in $\\\\mathcal{F}(D(f))$.\\n\\n*Proof
        of (1):* Let $s_i = s|_{D(g_i)} \\\\in M_i$. By hypothesis, $s_i|_{D(f g_i)}
        = (s|_{D(f)})|_{D(f g_i)} = 0$ in $\\\\mathcal{F}(D(f g_i)) = (M_i)_f$. By
        definition of the localization $(M_i)_f$, there exists an integer $n_i \\\\ge
        1$ such that $f^{n_i} s_i = 0$ in $M_i = \\\\mathcal{F}(D(g_i))$. Letting
        $N = \\\\max(n_1, \\\\dots, n_r)$, we have $(f^N s)|_{D(g_i)} = f^N s_i =
        0$ for all $i = 1, \\\\dots, r$. By the Locality Axiom for the sheaf $\\\\mathcal{F}$
        on the cover $\\\\{D(g_i)\\\\}$, $f^N s = 0$ in $\\\\mathcal{F}(U)$.\\n\\n*Proof
        of (2):* Let $t \\\\in \\\\mathcal{F}(D(f))$. Restricting $t$ to $D(f) \\\\cap
        D(g_i) = D(f g_i)$ gives an element $t_i = t|_{D(f g_i)} \\\\in \\\\mathcal{F}(D(f
        g_i)) = (M_i)_f$. Thus for each $i = 1, \\\\dots, r$, we can write $t_i =
        m_i / f^{n_i}$ for some $m_i \\\\in M_i = \\\\mathcal{F}(D(g_i))$. Choosing
        $n = \\\\max(n_1, \\\\dots, n_r)$ and replacing $m_i$ by $f^{n - n_i} m_i$,
        we have sections $m_i \\\\in \\\\mathcal{F}(D(g_i))$ such that\\n$$m_i|_{D(f
        g_i)} = f^n t|_{D(f g_i)} \\\\quad \\\\text{in } \\\\mathcal{F}(D(f g_i)).$$\\nNow
        consider the overlaps $D(g_i) \\\\cap D(g_j) = D(g_i g_j)$ and the difference
        $m_i|_{D(g_i g_j)} - m_j|_{D(g_i g_j)} \\\\in \\\\mathcal{F}(D(g_i g_j))$.
        When restricted to $D(f g_i g_j)$, this difference equals $f^n t|_{D(f g_i
        g_j)} - f^n t|_{D(f g_i g_j)} = 0$. Since $D(g_i g_j)$ is affine with $\\\\mathcal{F}|_{D(g_i
        g_j)} \\\\cong \\\\widetilde{(M_i)_{g_j}}$, property (1) applied to $D(g_i
        g_j)$ shows that there is an integer $m_{ij} \\\\ge 1$ such that $f^{m_{ij}}
        (m_i|_{D(g_i g_j)} - m_j|_{D(g_i g_j)}) = 0$ in $\\\\mathcal{F}(D(g_i g_j))$.
        Taking $m = \\\\max_{i,j} m_{ij}$, the sections $f^m m_i \\\\in \\\\mathcal{F}(D(g_i))$
        agree on all overlaps $D(g_i g_j)$! By the Gluing Axiom for $\\\\mathcal{F}$,
        there exists a global section $s \\\\in \\\\mathcal{F}(U) = M$ such that $s|_{D(g_i)}
        = f^m m_i$ for all $i$. Then on each $D(f g_i)$, $(s|_{D(f)})|_{D(f g_i)}
        = (f^m m_i)|_{D(f g_i)} = f^{n+m} t|_{D(f g_i)}$, so by the Locality Axiom
        on the cover $\\\\{D(f g_i)\\\\}$ of $D(f)$, $s|_{D(f)} = f^{n+m} t$ in $\\\\mathcal{F}(D(f))$.
        This establishes that $\\\\psi: M_f \\\\to \\\\mathcal{F}(D(f))$ is an isomorphism.
        $\\\\blacksquare$\\n\\n---\\n\\n### 4.2 Operations on Quasi-Coherent Sheaves
        and Ideal Sheaves\\n\\nLet $(X, \\\\mathcal{O}_X)$ and $(Y, \\\\mathcal{O}_Y)$
        be schemes and $f: X \\\\to Y$ a morphism of schemes.\\n\\n**Definition 4.2.1.**\\n1.
        For any $\\\\mathcal{O}_X$-modules $\\\\mathcal{F}$ and $\\\\mathcal{G}$,
        the *tensor product* $\\\\mathcal{F} \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{G}$
        is defined to be the sheafification of the presheaf $U \\\\mapsto \\\\mathcal{F}(U)
        \\\\otimes_{\\\\mathcal{O}_X(U)} \\\\mathcal{G}(U)$. The *sheaf Hom* $\\\\mathcal{H}om_{\\\\mathcal{O}_X}(\\\\mathcal{F},
        \\\\mathcal{G})$ is the sheaf $U \\\\mapsto \\\\operatorname{Hom}_{\\\\mathcal{O}_X|_U}(\\\\mathcal{F}|_U,
        \\\\mathcal{G}|_U)$.\\n2. For any $\\\\mathcal{O}_X$-module $\\\\mathcal{F}$,
        the direct image $f_*\\\\mathcal{F}$ is naturally an $\\\\mathcal{O}_Y$-module
        via $f^\\\\#: \\\\mathcal{O}_Y \\\\to f_*\\\\mathcal{O}_X$.\\n3. For any $\\\\mathcal{O}_Y$-module
        $\\\\mathcal{G}$, the inverse image sheaf $f^{-1}\\\\mathcal{G}$ is a module
        over the sheaf of rings $f^{-1}\\\\mathcal{O}_Y$. Using the canonical ring
        homomorphism $f^{-1}\\\\mathcal{O}_Y \\\\to \\\\mathcal{O}_X$, we define the
        *pullback of $\\\\mathcal{O}$-modules* $f^*\\\\mathcal{G}$ by\\n   $$f^*\\\\mathcal{G}
        = f^{-1}\\\\mathcal{G} \\\\otimes_{f^{-1}\\\\mathcal{O}_Y} \\\\mathcal{O}_X.$$\\n\\nOn
        affine schemes $X = \\\\operatorname{Spec} B$ and $Y = \\\\operatorname{Spec}
        A$ with $f$ induced by $\\\\varphi: A \\\\to B$, if $\\\\mathcal{G} = \\\\widetilde{N}$
        for an $A$-module $N$, then $f^*\\\\widetilde{N} \\\\cong \\\\widetilde{N
        \\\\otimes_A B}$ (since both have the same universal property as left adjoint
        to $f_*$), showing that $f^*$ always preserves quasi-coherent sheaves (and
        coherent sheaves when $X, Y$ are locally Noetherian). Similarly, if $f$ is
        quasi-compact and quasi-separated (which holds whenever $X$ is Noetherian
        or $f$ is affine/separated of finite type), covering $Y$ by affines and $f^{-1}(V)$
        by finitely many affines shows via the exact sequence of the cover that $f_*\\\\mathcal{F}$
        is quasi-coherent whenever $\\\\mathcal{F}$ is quasi-coherent.\\n\\nAn especially
        important class of quasi-coherent sheaves is the class of *quasi-coherent
        sheaves of ideals*, which classify closed subschemes.\\n\\n**Proposition 4.2.2.**
        *Let $X$ be a scheme. For any closed immersion $i: Z \\\\hookrightarrow X$,
        the kernel $\\\\mathcal{I}_Z = \\\\ker(i^\\\\#: \\\\mathcal{O}_X \\\\twoheadrightarrow
        i_*\\\\mathcal{O}_Z)$ is a quasi-coherent sheaf of ideals of $\\\\mathcal{O}_X$.
        Conversely, for any quasi-coherent sheaf of ideals $\\\\mathcal{I} \\\\subseteq
        \\\\mathcal{O}_X$, the support $Z = \\\\operatorname{Supp}(\\\\mathcal{O}_X/\\\\mathcal{I})
        = \\\\{P \\\\in X \\\\mid (\\\\mathcal{O}_X/\\\\mathcal{I})_P \\\\neq 0\\\\}$
        is a closed subset of $X$, and $(Z, (\\\\mathcal{O}_X/\\\\mathcal{I})|_Z)$
        is a closed subscheme of $X$. This establishes a bijection between closed
        subschemes of $X$ (up to isomorphism over $X$) and quasi-coherent sheaves
        of ideals $\\\\mathcal{I} \\\\subseteq \\\\mathcal{O}_X$.*\\n\\n*Proof.* Since
        the question is local on $X$, we may assume $X = \\\\operatorname{Spec} A$
        is affine. If $\\\\mathcal{I} \\\\subseteq \\\\mathcal{O}_X$ is a quasi-coherent
        sheaf of ideals, then by Theorem 4.1.5, $\\\\mathcal{I} = \\\\widetilde{\\\\mathfrak{a}}$
        for the ideal $\\\\mathfrak{a} = \\\\Gamma(X, \\\\mathcal{I}) \\\\subseteq
        \\\\Gamma(X, \\\\mathcal{O}_X) = A$. By exactness of $M \\\\mapsto \\\\widetilde{M}$
        (Theorem 4.1.3(3)), the exact sequence $0 \\\\to \\\\mathfrak{a} \\\\to A
        \\\\to A/\\\\mathfrak{a} \\\\to 0$ yields an exact sequence of sheaves $0
        \\\\to \\\\widetilde{\\\\mathfrak{a}} \\\\to \\\\mathcal{O}_{\\\\operatorname{Spec}
        A} \\\\to i_*\\\\mathcal{O}_{\\\\operatorname{Spec}(A/\\\\mathfrak{a})} \\\\to
        0$, showing that $(Z, (\\\\mathcal{O}_X/\\\\mathcal{I})|_Z) \\\\cong \\\\operatorname{Spec}(A/\\\\mathfrak{a})$
        is a closed subscheme of $\\\\operatorname{Spec} A$.\\n\\nConversely, let
        $i: Z \\\\hookrightarrow X = \\\\operatorname{Spec} A$ be any closed immersion.
        We must show that $\\\\mathcal{I}_Z = \\\\ker(\\\\mathcal{O}_X \\\\twoheadrightarrow
        i_*\\\\mathcal{O}_Z)$ is quasi-coherent (which simultaneously proves that
        every closed subscheme of an affine scheme $\\\\operatorname{Spec} A$ is itself
        affine of the form $\\\\operatorname{Spec}(A/\\\\mathfrak{a})$!). Since $i$
        is a homeomorphism of $Z$ onto a closed subset of $X$, for each $P \\\\in
        Z$ we can choose an affine open neighborhood $V_P \\\\subseteq Z$, whose complement
        $Z \\\\setminus V_P$ is closed in $Z$ and hence closed in $X$. Thus $X \\\\setminus
        (Z \\\\setminus V_P)$ is an open neighborhood of $P$ in $X$, containing a
        basic open set $D(g_P) \\\\subseteq X$ with $P \\\\in D(g_P)$ and $Z \\\\cap
        D(g_P) \\\\subseteq V_P$. Since $D(g_P) \\\\cap Z = D_{V_P}(i^\\\\#(g_P))$
        is a basic open subset of the affine scheme $V_P$, $Z \\\\cap D(g_P)$ is affine!
        Covering $X \\\\setminus Z$ by basic open sets $D(h_q)$ on which $Z \\\\cap
        D(h_q) = \\\\varnothing = \\\\operatorname{Spec} 0$, we obtain a cover of
        $X = \\\\operatorname{Spec} A$ by basic open subsets $D(f_j)$ such that for
        every $j$, $Z_j = i^{-1}(D(f_j))$ is an *affine* scheme $\\\\operatorname{Spec}
        B_j$. On each $D(f_j) = \\\\operatorname{Spec} A_{f_j}$, the map $A_{f_j}
        \\\\to B_j$ has kernel $\\\\mathfrak{a}_j$, and exactness of tilde gives $\\\\mathcal{I}_Z|_{D(f_j)}
        \\\\cong \\\\widetilde{\\\\mathfrak{a}_j}$. Thus $\\\\mathcal{I}_Z$ is locally
        of the form $\\\\widetilde{\\\\mathfrak{a}_j}$ on an affine open cover of
        $X$, meaning $\\\\mathcal{I}_Z$ is quasi-coherent! By Theorem 4.1.5, $\\\\mathcal{I}_Z
        = \\\\widetilde{\\\\mathfrak{a}}$ for $\\\\mathfrak{a} = \\\\Gamma(X, \\\\mathcal{I}_Z)
        \\\\subseteq A$, and $Z \\\\cong \\\\operatorname{Spec}(A/\\\\mathfrak{a})$.
        $\\\\blacksquare$\\n\\nFinally, on a projective scheme $X = \\\\operatorname{Proj}
        S$, we can construct quasi-coherent sheaves from graded $S$-modules, including
        the crucial twisting sheaves $\\\\mathcal{O}_X(n)$.\\n\\n**Definition 4.2.3.**
        Let $S = \\\\bigoplus_{d \\\\ge 0} S_d$ be a graded ring and $X = \\\\operatorname{Proj}
        S$.\\n1. For any $\\\\mathbb{Z}$-graded $S$-module $M = \\\\bigoplus_{d \\\\in
        \\\\mathbb{Z}} M_d$, we define a quasi-coherent $\\\\mathcal{O}_X$-module
        $\\\\widetilde{M}$ on $X$ whose stalk at $\\\\mathfrak{p} \\\\in X$ is the
        degree-zero localization $M_{(\\\\mathfrak{p})}$, and whose restriction to
        each basic open set $D_+(f) \\\\cong \\\\operatorname{Spec} S_{(f)}$ is the
        affine tilde sheaf $\\\\widetilde{M_{(f)}}$, where $M_{(f)} = (M_f)_0$.\\n2.
        For any integer $n \\\\in \\\\mathbb{Z}$, define the shifted graded $S$-module
        $S(n)$ by setting $S(n)_d = S_{n+d}$. We define the *twisting sheaf of Serre*
        $\\\\mathcal{O}_X(n)$ to be\\n   $$\\\\mathcal{O}_X(n) = \\\\widetilde{S(n)}.$$\\n
        \  In particular, $\\\\mathcal{O}_X(1)$ is called the *twisting sheaf* (or
        *tautological very ample line bundle*). For any $\\\\mathcal{O}_X$-module
        $\\\\mathcal{F}$, we write $\\\\mathcal{F}(n) = \\\\mathcal{F} \\\\otimes_{\\\\mathcal{O}_X}
        \\\\mathcal{O}_X(n)$.\\n\\nSuppose $S$ is generated by $S_1$ as an $S_0$-algebra
        (as is the case for $\\\\mathbb{P}^r_A = \\\\operatorname{Proj} A[x_0, \\\\dots,
        x_r]$). Then $X = \\\\operatorname{Proj} S$ is covered by the open sets $D_+(f)$
        for $f \\\\in S_1$ of degree $1$. On $D_+(f)$, the module $S(n)_{(f)}$ consists
        of fractions $a/f^m$ with $a \\\\in S(n)_m = S_{n+m}$. Multiplication by $f^n$
        gives an isomorphism of $S_{(f)}$-modules $S_{(f)} \\\\xrightarrow{\\\\sim}
        S(n)_{(f)}$ ($b/f^m \\\\mapsto (f^n b)/f^m$). Therefore, when $S$ is generated
        by $S_1$, each $\\\\mathcal{O}_X(n)$ is a *locally free $\\\\mathcal{O}_X$-module
        of rank $1$* (an *invertible sheaf*), and $\\\\mathcal{O}_X(n) \\\\otimes_{\\\\mathcal{O}_X}
        \\\\mathcal{O}_X(m) \\\\cong \\\\mathcal{O}_X(n+m)$.\\n\\n---\\n\\n### 4.3
        Differentials and Smoothness\\n\\nIn differential geometry, the tangent bundle
        and cotangent bundle are defined locally using smooth coordinates and transition
        matrices. In algebraic geometry, where schemes may have singularities or nilpotent
        elements and live over arbitrary base rings, the cotangent bundle is algebraicized
        via the *module of K\xE4hler differentials*.\\n\\n**Definition 4.3.1.** Let
        $A$ be a commutative ring, $B$ an $A$-algebra, and $M$ a $B$-module. An *$A$-derivation*
        of $B$ into $M$ is a map $d: B \\\\to M$ such that:\\n1. $d$ is additive:
        $d(b_1 + b_2) = d(b_1) + d(b_2)$ for all $b_1, b_2 \\\\in B$,\\n2. $d$ satisfies
        the Leibniz rule: $d(b_1 b_2) = b_1 d(b_2) + b_2 d(b_1)$ for all $b_1, b_2
        \\\\in B$, and\\n3. $d(a \\\\cdot 1_B) = 0$ for all $a \\\\in A$ (equivalently,
        $d$ is $A$-linear).\\n\\nThe set of all $A$-derivations from $B$ to $M$ forms
        a $B$-module denoted $\\\\operatorname{Der}_A(B, M)$.\\n\\n**Proposition 4.3.2
        (Construction and Universal Property of K\xE4hler Differentials).** *Let $B$
        be an $A$-algebra. There exists a $B$-module $\\\\Omega_{B/A}^1$ (or $\\\\Omega_{B/A}$)
        and a universal $A$-derivation $d: B \\\\to \\\\Omega_{B/A}^1$ such that for
        every $B$-module $M$, the map $\\\\operatorname{Hom}_B(\\\\Omega_{B/A}^1,
        M) \\\\to \\\\operatorname{Der}_A(B, M)$ given by $\\\\varphi \\\\mapsto \\\\varphi
        \\\\circ d$ is an isomorphism of $B$-modules. Explicitly:*\\n1. $\\\\Omega_{B/A}^1$
        *can be constructed as the quotient of the free $B$-module generated by symbols
        $\\\\{db \\\\mid b \\\\in B\\\\}$ modulo the $B$-submodule generated by the
        relations $d(b_1 + b_2) - db_1 - db_2$, $d(b_1 b_2) - b_1 db_2 - b_2 db_1$,
        and $da$ for $a \\\\in A$.*\\n2. **(Diagonal / Conormal Construction)** *Let
        $\\\\mu: B \\\\otimes_A B \\\\to B$ be the multiplication homomorphism $b_1
        \\\\otimes b_2 \\\\mapsto b_1 b_2$, and let $I = \\\\ker(\\\\mu) \\\\subseteq
        B \\\\otimes_A B$. Then $I/I^2$ is naturally a module over $(B \\\\otimes_A
        B)/I \\\\cong B$, and there is a canonical isomorphism of $B$-modules*\\n
        \  $$\\\\Omega_{B/A}^1 \\\\xrightarrow{\\\\;\\\\sim\\\\;} I / I^2, \\\\qquad
        db \\\\longmapsto (1 \\\\otimes b - b \\\\otimes 1) \\\\bmod I^2.$$\\n\\n*Proof.*
        Construction (1) satisfies the universal property immediately by definition
        of generators and relations. To establish (2), define $d': B \\\\to I/I^2$
        by $d'(b) = (1 \\\\otimes b - b \\\\otimes 1) \\\\bmod I^2$, where $B$ acts
        on $I/I^2$ via the left factor $b \\\\cdot \\\\bar{x} = (b \\\\otimes 1)\\\\bar{x}$
        (which agrees with multiplication by $1 \\\\otimes b$ modulo $I^2$ since $b
        \\\\otimes 1 - 1 \\\\otimes b \\\\in I$). Clearly $d'$ is $A$-linear, and
        for any $b_1, b_2 \\\\in B$, we have in $B \\\\otimes_A B$:\\n$$1 \\\\otimes
        b_1 b_2 - b_1 b_2 \\\\otimes 1 = (b_1 \\\\otimes 1)(1 \\\\otimes b_2 - b_2
        \\\\otimes 1) + (b_2 \\\\otimes 1)(1 \\\\otimes b_1 - b_1 \\\\otimes 1) +
        (1 \\\\otimes b_1 - b_1 \\\\otimes 1)(1 \\\\otimes b_2 - b_2 \\\\otimes 1).$$\\nSince
        the last product belongs to $I^2$, reducing modulo $I^2$ gives $d'(b_1 b_2)
        = b_1 d'(b_2) + b_2 d'(b_1)$. Thus $d'$ is an $A$-derivation, inducing a $B$-module
        homomorphism $\\\\alpha: \\\\Omega_{B/A}^1 \\\\to I/I^2$ sending $db \\\\mapsto
        d'(b)$.\\n\\nConversely, any element of $I = \\\\ker(\\\\mu)$ is of the form
        $\\\\sum b_i \\\\otimes c_i$ with $\\\\sum b_i c_i = 0$, hence can be rewritten
        as $\\\\sum (b_i \\\\otimes 1)(1 \\\\otimes c_i - c_i \\\\otimes 1)$. Define
        a $B \\\\otimes_A B$-linear map $\\\\tilde{\\\\beta}: B \\\\otimes_A B \\\\to
        \\\\text{End}_{\\\\text{Set}}(\\\\Omega_{B/A}^1)$ or directly a map $B \\\\otimes_A
        B \\\\to \\\\Omega_{B/A}^1$ by $b_1 \\\\otimes b_2 \\\\mapsto b_1 db_2$. On
        $I^2$, any product of two generators $(1 \\\\otimes b_1 - b_1 \\\\otimes 1)(1
        \\\\otimes b_2 - b_2 \\\\otimes 1) = 1 \\\\otimes b_1 b_2 - b_1 \\\\otimes
        b_2 - b_2 \\\\otimes b_1 + b_1 b_2 \\\\otimes 1$ maps to $d(b_1 b_2) - b_1
        db_2 - b_2 db_1 + b_1 b_2 d(1) = 0$ by the Leibniz rule! Thus restricting
        to $I$ and passing to $I/I^2$ gives a well-defined $B$-module homomorphism
        $\\\\beta: I/I^2 \\\\to \\\\Omega_{B/A}^1$ sending $(1 \\\\otimes b - b \\\\otimes
        1) \\\\bmod I^2 \\\\mapsto db - b d(1) = db$. Clearly $\\\\alpha$ and $\\\\beta$
        are mutually inverse isomorphisms. $\\\\blacksquare$\\n\\n**Theorem 4.3.3
        (The Two Fundamental Exact Sequences for Differentials).**\\n1. **(First Exact
        Sequence)** *Let $A \\\\to B \\\\to C$ be ring homomorphisms. There is a canonical
        exact sequence of $C$-modules:*\\n   $$\\\\Omega_{B/A}^1 \\\\otimes_B C \\\\xrightarrow{\\\\;\\\\;\\\\alpha\\\\;\\\\;}
        \\\\Omega_{C/A}^1 \\\\xrightarrow{\\\\;\\\\;\\\\beta\\\\;\\\\;} \\\\Omega_{C/B}^1
        \\\\longrightarrow 0,$$\\n   *where $\\\\alpha(db \\\\otimes c) = c \\\\cdot
        d(\\\\text{im } b)$ and $\\\\beta(dc) = dc$.*\\n2. **(Second / Conormal Exact
        Sequence)** *Suppose $B \\\\twoheadrightarrow C = B/J$ is a surjective ring
        homomorphism with kernel $J \\\\subseteq B$. Then $\\\\Omega_{C/B}^1 = 0$,
        and there is a canonical exact sequence of $C$-modules:*\\n   $$J / J^2 \\\\xrightarrow{\\\\;\\\\;\\\\delta\\\\;\\\\;}
        \\\\Omega_{B/A}^1 \\\\otimes_B C \\\\xrightarrow{\\\\;\\\\;\\\\alpha\\\\;\\\\;}
        \\\\Omega_{C/A}^1 \\\\longrightarrow 0,$$\\n   *where $\\\\delta(x \\\\bmod
        J^2) = dx \\\\otimes 1$.*\\n\\n*Proof.*By Yoneda's Lemma for $C$-modules,
        a sequence of $C$-modules $M' \\\\to M \\\\to M'' \\\\to 0$ is exact if and
        only if for every $C$-module $N$, the induced sequence $0 \\\\to \\\\operatorname{Hom}_C(M'',
        N) \\\\to \\\\operatorname{Hom}_C(M, N) \\\\to \\\\operatorname{Hom}_C(M',
        N)$ is exact.\\n\\n(1) For any $C$-module $N$, applying $\\\\operatorname{Hom}_C(-,
        N)$ to the sequence in (1) and using the universal property of K\xE4hler differentials
        (together with the tensor-Hom adjunction $\\\\operatorname{Hom}_C(\\\\Omega_{B/A}^1
        \\\\otimes_B C, N) \\\\cong \\\\operatorname{Hom}_B(\\\\Omega_{B/A}^1, N)
        \\\\cong \\\\operatorname{Der}_A(B, N)$) produces the sequence\\n$$0 \\\\longrightarrow
        \\\\operatorname{Der}_B(C, N) \\\\xrightarrow{\\\\;\\\\beta^*\\\\;} \\\\operatorname{Der}_A(C,
        N) \\\\xrightarrow{\\\\;\\\\alpha^*\\\\;} \\\\operatorname{Der}_A(B, N).$$\\nHere
        $\\\\beta^*$ is the natural inclusion of $B$-derivations into $A$-derivations,
        and $\\\\alpha^*$ restricts an $A$-derivation $D: C \\\\to N$ along $B \\\\to
        C$. An $A$-derivation $D: C \\\\to N$ belongs to $\\\\ker(\\\\alpha^*)$ if
        and only if $D$ vanishes on the image of $B$ in $C$, which holds if and only
        if $D$ is a $B$-derivation! Thus the sequence of derivations is exact for
        all $N$, proving (1).\\n\\n(2) Since $B \\\\twoheadrightarrow C = B/J$ is
        surjective, any $B$-derivation $C \\\\to N$ vanishes on the image of $B$,
        which is all of $C$; hence $\\\\Omega_{C/B}^1 = 0$. Notice that for $x \\\\in
        J$ and $b \\\\in B$, $d(bx) \\\\otimes 1 = b dx \\\\otimes 1 + x db \\\\otimes
        1 = dx \\\\otimes \\\\bar{b} + db \\\\otimes \\\\bar{x} = dx \\\\otimes \\\\bar{b}$
        since $\\\\bar{x} = 0$ in $C = B/J$. In particular, if $x, y \\\\in J$, $\\\\delta(xy)
        = x dy \\\\otimes 1 + y dx \\\\otimes 1 = 0$, so $\\\\delta: J/J^2 \\\\to
        \\\\Omega_{B/A}^1 \\\\otimes_B C$ is a well-defined $C$-linear map. For any
        $C$-module $N$, applying $\\\\operatorname{Hom}_C(-, N)$ to the sequence in
        (2) gives\\n$$0 \\\\longrightarrow \\\\operatorname{Der}_A(C, N) \\\\xrightarrow{\\\\;\\\\alpha^*\\\\;}
        \\\\operatorname{Der}_A(B, N) \\\\xrightarrow{\\\\;\\\\delta^*\\\\;} \\\\operatorname{Hom}_C(J/J^2,
        N) = \\\\operatorname{Hom}_B(J, N),$$\\nwhere $\\\\delta^*$ restricts an $A$-derivation
        $D: B \\\\to N$ to $J \\\\subseteq B$ (note that since $J$ acts as zero on
        the $C$-module $N$, for $x, y \\\\in J$ we have $D(xy) = x D(y) + y D(x) =
        0$, so $D|_J$ is a $B$-module homomorphism vanishing on $J^2$). An $A$-derivation
        $D: B \\\\to N$ factors through $C = B/J$ if and only if $D(J) = 0$, which
        means $D \\\\in \\\\ker(\\\\delta^*)$. Thus the sequence is exact for every
        $N$, proving (2). $\\\\blacksquare$\\n\\nProposition 4.3.2(2) allows us to
        globalize K\xE4hler differentials immediately to arbitrary morphisms of schemes.\\n\\n**Definition
        4.3.4.** Let $f: X \\\\to Y$ be a morphism of schemes. By Proposition 3.6.3,
        the diagonal morphism $\\\\Delta: X \\\\to X \\\\times_Y X$ is a closed immersion
        of $X$ into an open subscheme $W \\\\subseteq X \\\\times_Y X$. Let $\\\\mathcal{I}
        \\\\subseteq \\\\mathcal{O}_W$ be the quasi-coherent sheaf of ideals defining
        the closed subscheme $\\\\Delta(X) \\\\subseteq W$. We define the *sheaf of
        relative differentials of $X$ over $Y$*, denoted $\\\\Omega_{X/Y}^1$, to be
        the quasi-coherent $\\\\mathcal{O}_X$-module\\n$$\\\\Omega_{X/Y}^1 = \\\\Delta^*(\\\\mathcal{I}/\\\\mathcal{I}^2).$$\\nOn
        any affine open subschemes $U = \\\\operatorname{Spec} B \\\\subseteq X$ and
        $V = \\\\operatorname{Spec} A \\\\subseteq Y$ with $f(U) \\\\subseteq V$,
        Proposition 4.3.2(2) gives a canonical isomorphism $\\\\Omega_{X/Y}^1|_U \\\\cong
        \\\\widetilde{\\\\Omega_{B/A}^1}$. If $f: X \\\\to Y$ is locally of finite
        type and $Y$ is locally Noetherian, then $\\\\Omega_{X/Y}^1$ is a coherent
        $\\\\mathcal{O}_X$-module.\\n\\n**Theorem 4.3.5 (Regularity, Smoothness, and
        the Jacobian Criterion).** *Let $k$ be an algebraically closed field, and
        let $X$ be an irreducible scheme of finite type over $k$ of dimension $n$.
        For a closed point $P \\\\in X$, we say that $X$ is non-singular (or regular)
        at $P$ if the local ring $\\\\mathcal{O}_{X,P}$ is a regular local ring (meaning
        $\\\\dim_k(\\\\mathfrak{m}_P/\\\\mathfrak{m}_P^2) = \\\\dim \\\\mathcal{O}_{X,P}
        = n$).*\\n1. *For every closed point $P \\\\in X$, the fiber of $\\\\Omega_{X/k}^1$
        at $P$ is canonically isomorphic to the Zariski cotangent space:*\\n   $$\\\\Omega_{X/k}^1
        \\\\otimes_{\\\\mathcal{O}_X} \\\\kappa(P) \\\\cong \\\\mathfrak{m}_P / \\\\mathfrak{m}_P^2.$$\\n2.
        *$X$ is non-singular at every closed point (i.e., $X$ is smooth over $k$)
        if and only if $\\\\Omega_{X/k}^1$ is a locally free $\\\\mathcal{O}_X$-module
        of rank $n = \\\\dim X$.*\\n3. **(Jacobian Criterion)** *Suppose $X = \\\\operatorname{Spec}
        k[x_1, \\\\dots, x_N]/(f_1, \\\\dots, f_r) \\\\subseteq \\\\mathbb{A}^N_k$.
        Then $X$ is non-singular at a closed point $P \\\\in X$ if and only if the
        Jacobian matrix $J_P = \\\\left(\\\\frac{\\\\partial f_i}{\\\\partial x_j}(P)\\\\right)$
        has rank $N - n$.*\\n\\n*Proof.* (1) Let $U = \\\\operatorname{Spec} B$ be
        an affine open neighborhood of $P$, and let $\\\\mathfrak{m} \\\\subset B$
        be the maximal ideal corresponding to $P$, with $B/\\\\mathfrak{m} = \\\\kappa(P)
        = k$. Applying the Second Fundamental Exact Sequence (Theorem 4.3.3(2)) to
        $k \\\\to B \\\\twoheadrightarrow B/\\\\mathfrak{m} = k$ gives\\n$$\\\\mathfrak{m}/\\\\mathfrak{m}^2
        \\\\xrightarrow{\\\\;\\\\delta\\\\;} \\\\Omega_{B/k}^1 \\\\otimes_B k \\\\longrightarrow
        \\\\Omega_{k/k}^1 = 0.$$\\nThus $\\\\delta$ is surjective. Moreover, for any
        $k$-vector space $V$, $\\\\operatorname{Hom}_k(\\\\mathfrak{m}/\\\\mathfrak{m}^2,
        V) \\\\cong \\\\operatorname{Der}_k(B, V)$ (sending $\\\\lambda: \\\\mathfrak{m}/\\\\mathfrak{m}^2
        \\\\to V$ to the derivation $b \\\\mapsto \\\\lambda((b - b(P)) \\\\bmod \\\\mathfrak{m}^2)$),
        which is isomorphic to $\\\\operatorname{Hom}_k(\\\\Omega_{B/k}^1 \\\\otimes_B
        k, V)$. Hence $\\\\delta: \\\\mathfrak{m}/\\\\mathfrak{m}^2 \\\\xrightarrow{\\\\sim}
        \\\\Omega_{B/k}^1 \\\\otimes_B k = (\\\\Omega_{X/k}^1)_P \\\\otimes_{\\\\mathcal{O}_{X,P}}
        k$ is an isomorphism. Since $\\\\mathfrak{m}_P = \\\\mathfrak{m}B_{\\\\mathfrak{m}}$,
        we have $\\\\mathfrak{m}_P/\\\\mathfrak{m}_P^2 \\\\cong \\\\mathfrak{m}/\\\\mathfrak{m}^2$.\\n\\n(2)
        By Nakayama's Lemma, for any finitely generated module $M$ over a Noetherian
        local ring $(R, \\\\mathfrak{m}, k)$ of dimension $n$, $M$ is generated by
        $\\\\dim_k(M/\\\\mathfrak{m}M)$ elements. If $R = \\\\mathcal{O}_{X,P}$ is
        a domain with fraction field $K(X)$ (which is a finitely generated field extension
        of $k$ of transcendence degree $n$, so $\\\\dim_{K(X)} \\\\Omega_{K(X)/k}^1
        = n$), then $(\\\\Omega_{X/k}^1)_P$ is a free $\\\\mathcal{O}_{X,P}$-module
        of rank $n$ if and only if $\\\\dim_k((\\\\Omega_{X/k}^1)_P \\\\otimes k)
        = n$, which by (1) is equivalent to $\\\\dim_k(\\\\mathfrak{m}_P/\\\\mathfrak{m}_P^2)
        = n$, i.e., $\\\\mathcal{O}_{X,P}$ is regular.\\n\\n(3) Let $A = k[x_1, \\\\dots,
        x_N]$, $J = (f_1, \\\\dots, f_r)$, and $B = A/J$. Notice that $\\\\Omega_{A/k}^1
        = \\\\bigoplus_{j=1}^N A \\\\, dx_j$ is free of rank $N$, with $df = \\\\sum_{j=1}^N
        \\\\frac{\\\\partial f}{\\\\partial x_j} dx_j$. Applying Theorem 4.3.3(2)
        to $k \\\\to A \\\\twoheadrightarrow B$ and tensoring with $\\\\kappa(P) =
        k$ gives the right-exact sequence of $k$-vector spaces:\\n$$J/J^2 \\\\otimes_B
        k \\\\xrightarrow{\\\\;\\\\bar{\\\\delta}_P\\\\;} \\\\Omega_{A/k}^1 \\\\otimes_A
        k \\\\cong k^N \\\\longrightarrow \\\\Omega_{B/k}^1 \\\\otimes_B k \\\\cong
        \\\\mathfrak{m}_P/\\\\mathfrak{m}_P^2 \\\\longrightarrow 0.$$\\nThe image
        of $\\\\bar{\\\\delta}_P$ is spanned by $\\\\delta(f_i)_P = \\\\sum_{j=1}^N
        \\\\frac{\\\\partial f_i}{\\\\partial x_j}(P) dx_j$, so $\\\\dim_k(\\\\operatorname{im}
        \\\\bar{\\\\delta}_P) = \\\\operatorname{rank}(J_P)$. By exactness, $\\\\dim_k(\\\\mathfrak{m}_P/\\\\mathfrak{m}_P^2)
        = N - \\\\operatorname{rank}(J_P)$. Since $\\\\dim_k(\\\\mathfrak{m}_P/\\\\mathfrak{m}_P^2)
        \\\\ge \\\\dim \\\\mathcal{O}_{X,P} = n$ always (by Krull's Principal Ideal
        Theorem), equality holds if and only if $\\\\operatorname{rank}(J_P) = N -
        n$. $\\\\blacksquare$\\n\\n---\\n\\n### Exercises for Chapter 4\\n\\n**Exercise
        4.1.** Let $X$ be a scheme and $\\\\mathcal{F}$ a quasi-coherent $\\\\mathcal{O}_X$-module.
        We say $\\\\mathcal{F}$ is *locally free of rank $r$* if $X$ can be covered
        by open subsets $U$ on which $\\\\mathcal{F}|_U \\\\cong \\\\mathcal{O}_U^{\\\\oplus
        r}$.\\n(a) Suppose $X$ is locally Noetherian and $\\\\mathcal{F}$ is a coherent
        $\\\\mathcal{O}_X$-module. Prove that $\\\\mathcal{F}$ is locally free of
        rank $r$ if and only if for every point $P \\\\in X$, the stalk $\\\\mathcal{F}_P$
        is a free $\\\\mathcal{O}_{X,P}$-module of rank $r$. *(Hint: Use coherence
        to lift a basis of $\\\\mathcal{F}_P$ to a neighborhood $U$ of $P$, and apply
        coherence to the kernel and cokernel of $\\\\mathcal{O}_U^{\\\\oplus r} \\\\to
        \\\\mathcal{F}|_U$.)*\\n(b) Prove that if $X$ is connected and locally Noetherian,
        and $\\\\mathcal{F}$ is coherent, then $\\\\mathcal{F}$ is locally free if
        and only if the function $P \\\\mapsto \\\\dim_{\\\\kappa(P)}(\\\\mathcal{F}_P
        \\\\otimes_{\\\\mathcal{O}_{X,P}} \\\\kappa(P))$ is constant on $X$ (assuming
        $X$ is reduced; show by example with $X = \\\\operatorname{Spec} k[x]/(x^2)$
        that reducedness is necessary for the converse!).\\n\\n**Exercise 4.2.** (The
        Euler Exact Sequence on $\\\\mathbb{P}^n_A$) Let $A$ be a commutative ring
        and $X = \\\\mathbb{P}^n_A = \\\\operatorname{Proj} S$, where $S = A[x_0,
        \\\\dots, x_n]$.\\n(a) Prove that there is a canonical short exact sequence
        of locally free sheaves on $X = \\\\mathbb{P}^n_A$:\\n$$0 \\\\longrightarrow
        \\\\Omega_{X/A}^1 \\\\longrightarrow \\\\mathcal{O}_X(-1)^{\\\\oplus (n+1)}
        \\\\xrightarrow{\\\\;\\\\;u\\\\;\\\\;} \\\\mathcal{O}_X \\\\longrightarrow
        0,$$\\nwhere $u$ is induced by the graded $S$-module homomorphism $S(-1)^{\\\\oplus
        (n+1)} \\\\to S$ sending $(f_0, \\\\dots, f_n) \\\\mapsto \\\\sum_{i=0}^n
        x_i f_i$. *(Hint: Restrict to the affine charts $U_i = D_+(x_i)$ and compare
        the kernel of $u|_{U_i}$ with $\\\\Omega_{U_i/A}^1 = \\\\bigoplus_{j \\\\neq
        i} \\\\mathcal{O}_{U_i} d(x_j/x_i)$ via $dx_j \\\\mapsto e_j \\\\in S(-1)^{\\\\oplus
        (n+1)}$ and the Euler identity $\\\\sum_{j=0}^n x_j dx_j = 0$.)*\\n(b) Deduce
        that the *canonical sheaf* $\\\\omega_{X/A} = \\\\bigwedge^n \\\\Omega_{X/A}^1$
        of $\\\\mathbb{P}^n_A$ is canonically isomorphic to $\\\\mathcal{O}_{\\\\mathbb{P}^n_A}(-n-1)$.\\n\\n**Exercise
        4.3.** Let $X$ be a scheme and $\\\\mathcal{L}$ an invertible sheaf on $X$
        (a locally free $\\\\mathcal{O}_X$-module of rank $1$).\\n(a) Prove that the
        dual sheaf $\\\\mathcal{L}^\\\\vee = \\\\mathcal{H}om_{\\\\mathcal{O}_X}(\\\\mathcal{L},
        \\\\mathcal{O}_X)$ is also an invertible sheaf, and that the evaluation map
        $\\\\mathcal{L} \\\\otimes_{\\\\mathcal{O}_X} \\\\mathcal{L}^\\\\vee \\\\to
        \\\\mathcal{O}_X$ is an isomorphism.\\n(b) Prove that the set of isomorphism
        classes of invertible sheaves on $X$ forms an abelian group under $\\\\otimes_{\\\\mathcal{O}_X}$,
        called the *Picard group* $\\\\operatorname{Pic}(X)$ of $X$.\\n\\n**Exercise
        4.4.** Let $A$ be a ring and $X = \\\\mathbb{P}^n_A = \\\\operatorname{Proj}
        A[x_0, \\\\dots, x_n]$. Compute the global sections $\\\\Gamma(X, \\\\mathcal{O}_X(m))$
        for all $m \\\\in \\\\mathbb{Z}$ directly by intersecting the modules of sections
        over the standard affine open cover $U_i = D_+(x_i)$ inside $\\\\Gamma(\\\\bigcap_{i=0}^n
        U_i, \\\\mathcal{O}_X(m)) = A[x_0^{\\\\pm 1}, \\\\dots, x_n^{\\\\pm 1}]_m$,
        and prove that the natural homomorphism $S_m \\\\to \\\\Gamma(\\\\mathbb{P}^n_A,
        \\\\mathcal{O}_{\\\\mathbb{P}^n_A}(m))$ is an isomorphism for all $m \\\\in
        \\\\mathbb{Z}$ (in particular, $\\\\Gamma(\\\\mathbb{P}^n_A, \\\\mathcal{O}_{\\\\mathbb{P}^n_A}(m))
        = 0$ for $m \\u003c 0$).\\n\\n**Exercise 4.5.** (Projection Formula) Let $f:
        X \\\\to Y$ be a quasi-compact, quasi-separated morphism of schemes, $\\\\mathcal{F}$
        a quasi-coherent $\\\\mathcal{O}_X$-module, and $\\\\mathcal{E}$ a locally
        free $\\\\mathcal{O}_Y$-module of finite rank. Construct a canonical isomorphism
        of $\\\\mathcal{O}_Y$-modules\\n$$f_*(\\\\mathcal{F} \\\\otimes_{\\\\mathcal{O}_X}
        f^*\\\\mathcal{E}) \\\\xrightarrow{\\\\;\\\\sim\\\\;} f_*\\\\mathcal{F} \\\\otimes_{\\\\mathcal{O}_Y}
        \\\\mathcal{E}.$$\\n\\n**Exercise 4.6.** Let $k$ be a field of characteristic
        $p \\u003e 0$, and let $K = k(t)$ be the rational function field in one variable.
        Compute $\\\\Omega_{K/k}^1$ and $\\\\Omega_{K/k(t^p)}^1$, and compare this
        with the general theorem that a finitely generated algebraic field extension
        $L/F$ is separable if and only if $\\\\Omega_{L/F}^1 = 0$.\\n\\n---\\n\\n##
        Chapter 5: Cohomology of Sheaves, Divisors, and Algebraic Curves\\n\\nAs noted
        in Proposition 2.2.3(3), the global sections functor $\\\\Gamma(X, -)$ is
        left-exact, but generally fails to be right-exact: given a short exact sequence
        of sheaves $0 \\\\to \\\\mathcal{F}' \\\\to \\\\mathcal{F} \\\\to \\\\mathcal{F}''
        \\\\to 0$, a global section of $\\\\mathcal{F}''$ can be lifted locally to
        $\\\\mathcal{F}$ on an open cover $\\\\{U_i\\\\}$, but the differences of
        these local lifts on overlaps $U_i \\\\cap U_j$ form an obstruction in $\\\\mathcal{F}'(U_i
        \\\\cap U_j)$ to gluing them into a global section of $\\\\mathcal{F}$. Sheaf
        cohomology systematically measures these obstructions and provides the most
        powerful quantitative invariants in algebraic geometry.\\n\\n---\\n\\n###
        5.1 Derived Functor Cohomology of Sheaves\\n\\nLet $\\\\mathfrak{A}$ be an
        abelian category (such as $\\\\mathfrak{Ab}(X)$ or $\\\\mathfrak{Mod}(\\\\mathcal{O}_X)$).
        Recall that an object $I \\\\in \\\\mathfrak{A}$ is called *injective* if
        the functor $\\\\operatorname{Hom}_{\\\\mathfrak{A}}(-, I)$ is exact; that
        is, for every monomorphism (injective morphism) $A \\\\hookrightarrow B$ in
        $\\\\mathfrak{A}$ and every morphism $f: A \\\\to I$, there exists an extension
        $\\\\tilde{f}: B \\\\to I$ of $f$ to $B$. We say that $\\\\mathfrak{A}$ *has
        enough injectives* if every object $M \\\\in \\\\mathfrak{A}$ admits a monomorphism
        $M \\\\hookrightarrow I$ into an injective object $I \\\\in \\\\mathfrak{A}$.\\n\\n**Theorem
        5.1.1.** *For any ringed space $(X, \\\\mathcal{O}_X)$, the category $\\\\mathfrak{Mod}(\\\\mathcal{O}_X)$
        of $\\\\mathcal{O}_X$-modules (and in particular $\\\\mathfrak{Ab}(X) = \\\\mathfrak{Mod}(\\\\underline{\\\\mathbb{Z}}_X)$)
        has enough injectives.*\\n\\n*Proof.* First recall a standard fact from commutative
        algebra (Baer's Criterion and coinduction): for any ring $R$, the category
        $\\\\mathfrak{Mod}(R)$ of $R$-modules has enough injectives. (Specifically,
        any abelian group $M$ embeds into the divisible\u2014hence $\\\\mathbb{Z}$-injective\u2014group
        $J = \\\\prod_{f \\\\in \\\\operatorname{Hom}_{\\\\mathbb{Z}}(M, \\\\mathbb{Q}/\\\\mathbb{Z})}
        \\\\mathbb{Q}/\\\\mathbb{Z}$, and any $R$-module $M$ embeds into $\\\\operatorname{Hom}_{\\\\mathbb{Z}}(R,
        M) \\\\hookrightarrow \\\\operatorname{Hom}_{\\\\mathbb{Z}}(R, J)$, which
        is injective in $\\\\mathfrak{Mod}(R)$ because $\\\\operatorname{Hom}_R(N,
        \\\\operatorname{Hom}_{\\\\mathbb{Z}}(R, J)) \\\\cong \\\\operatorname{Hom}_{\\\\mathbb{Z}}(N,
        J)$ is an exact functor of $N$.)\\n\\nNow let $\\\\mathcal{F}$ be an $\\\\mathcal{O}_X$-module.
        For each point $P \\\\in X$, the stalk $\\\\mathcal{F}_P$ is an $\\\\mathcal{O}_{X,P}$-module,
        so by the paragraph above we may choose an injective $\\\\mathcal{O}_{X,P}$-module
        $I_P$ and an injective $\\\\mathcal{O}_{X,P}$-module homomorphism $\\\\alpha_P:
        \\\\mathcal{F}_P \\\\hookrightarrow I_P$. Let $i_P: \\\\{P\\\\} \\\\hookrightarrow
        X$ be the inclusion of the one-point space $\\\\{P\\\\}$ into $X$, and consider
        the skyscraper sheaf $(i_P)_*(I_P)$ on $X$. Define an $\\\\mathcal{O}_X$-module
        $\\\\mathcal{I}$ by taking the direct product over all points of $X$:\\n$$\\\\mathcal{I}
        = \\\\prod_{P \\\\in X} (i_P)_*(I_P), \\\\quad \\\\text{so that for every
        open } U \\\\subseteq X, \\\\quad \\\\mathcal{I}(U) = \\\\prod_{P \\\\in U}
        I_P.$$\\nThere is a canonical morphism of $\\\\mathcal{O}_X$-modules $\\\\alpha:
        \\\\mathcal{F} \\\\to \\\\mathcal{I}$ given over each open $U \\\\subseteq
        X$ by sending $s \\\\in \\\\mathcal{F}(U)$ to $(\\\\alpha_P(s_P))_{P \\\\in
        U} \\\\in \\\\prod_{P \\\\in U} I_P$. If $s \\\\in \\\\ker(\\\\alpha(U))$,
        then $\\\\alpha_P(s_P) = 0$ for all $P \\\\in U$, which implies $s_P = 0$
        for all $P \\\\in U$ (since $\\\\alpha_P$ is injective), and hence $s = 0$
        by the Locality Axiom. Thus $\\\\alpha: \\\\mathcal{F} \\\\hookrightarrow
        \\\\mathcal{I}$ is a monomorphism in $\\\\mathfrak{Mod}(\\\\mathcal{O}_X)$.\\n\\nFinally,
        for any $\\\\mathcal{O}_X$-module $\\\\mathcal{G}$, notice that specifying
        a morphism $\\\\mathcal{G} \\\\to (i_P)_*(I_P)$ is equivalent to specifying
        an $\\\\mathcal{O}_{X,P}$-module homomorphism $\\\\mathcal{G}_P \\\\to I_P$.
        Therefore, we have a natural isomorphism of functors:\\n$$\\\\operatorname{Hom}_{\\\\mathcal{O}_X}(\\\\mathcal{G},
        \\\\mathcal{I}) = \\\\prod_{P \\\\in X} \\\\operatorname{Hom}_{\\\\mathcal{O}_X}(\\\\mathcal{G},
        (i_P)_*(I_P)) \\\\cong \\\\prod_{P \\\\in X} \\\\operatorname{Hom}_{\\\\mathcal{O}_{X,P}}(\\\\mathcal{G}_P,
        I_P).$$\\nSince taking stalks $\\\\mathcal{G} \\\\mapsto \\\\mathcal{G}_P$
        is an exact functor, $\\\\operatorname{Hom}_{\\\\mathcal{O}_{X,P}}(-, I_P)$
        is exact (as $I_P$ is an injective $\\\\mathcal{O}_{X,P}$-module), and arbitrary
        direct products of exact sequences of abelian groups are exact, the functor
        $\\\\operatorname{Hom}_{\\\\mathcal{O}_X}(-, \\\\mathcal{I})$ is exact! Thus
        $\\\\mathcal{I}$ is an injective object of $\\\\mathfrak{Mod}(\\\\mathcal{O}_X)$.
        $\\\\blacksquare$\\n\\nBy Theorem 5.1.1, every $\\\\mathcal{O}_X$-module (or
        sheaf of abelian groups) $\\\\mathcal{F}$ admits an *injective resolution*:
        an exact sequence\\n$$0 \\\\longrightarrow \\\\mathcal{F} \\\\longrightarrow
        \\\\mathcal{I}^0 \\\\xrightarrow{\\\\;d^0\\\\;} \\\\mathcal{I}^1 \\\\xrightarrow{\\\\;d^1\\\\;}
        \\\\mathcal{I}^2 \\\\xrightarrow{\\\\;d^2\\\\;} \\\\dots$$\\nwhere each $\\\\mathcal{I}^i$
        is injective.\\n\\n**Definition 5.1.2.** Let $X$ be a topological space and
        $\\\\mathcal{F} \\\\in \\\\mathfrak{Ab}(X)$ a sheaf of abelian groups on $X$.
        Choose an injective resolution $0 \\\\to \\\\mathcal{F} \\\\to \\\\mathcal{I}^\\\\bullet$
        of $\\\\mathcal{F}$ in $\\\\mathfrak{Ab}(X)$. The *$i$-th sheaf cohomology
        group* of $X$ with coefficients in $\\\\mathcal{F}$, denoted $H^i(X, \\\\mathcal{F})$,
        is defined to be the $i$-th cohomology group of the complex of global sections
        $\\\\Gamma(X, \\\\mathcal{I}^\\\\bullet)$:\\n$$H^i(X, \\\\mathcal{F}) = R^i\\\\Gamma(X,
        \\\\mathcal{F}) = \\\\frac{\\\\ker(\\\\Gamma(X, \\\\mathcal{I}^i) \\\\xrightarrow{d^i}
        \\\\Gamma(X, \\\\mathcal{I}^{i+1}))}{\\\\operatorname{im}(\\\\Gamma(X, \\\\mathcal{I}^{i-1})
        \\\\xrightarrow{d^{i-1}} \\\\Gamma(X, \\\\mathcal{I}^i))}.$$\\n\\nBy the fundamental
        lemma of homological algebra, any two injective resolutions of $\\\\mathcal{F}$
        are chain homotopy equivalent, so $H^i(X, \\\\mathcal{F})$ is well-defined
        up to canonical isomorphism and is functorial in $\\\\mathcal{F}$. Moreover:\\n1.
        By left-exactness of $\\\\Gamma(X, -)$, $H^0(X, \\\\mathcal{F}) = \\\\ker(\\\\Gamma(X,
        \\\\mathcal{I}^0) \\\\to \\\\Gamma(X, \\\\mathcal{I}^1)) \\\\cong \\\\Gamma(X,
        \\\\mathcal{F})$.\\n2. For any short exact sequence $0 \\\\to \\\\mathcal{F}'
        \\\\to \\\\mathcal{F} \\\\to \\\\mathcal{F}'' \\\\to 0$ of sheaves on $X$,
        there are canonical connecting homomorphisms $\\\\delta^i: H^i(X, \\\\mathcal{F}'')
        \\\\to H^{i+1}(X, \\\\mathcal{F}')$ yielding a *long exact sequence of cohomology*:\\n
        \  $$0 \\\\to H^0(X, \\\\mathcal{F}') \\\\to H^0(X, \\\\mathcal{F}) \\\\to
        H^0(X, \\\\mathcal{F}'') \\\\xrightarrow{\\\\delta^0} H^1(X, \\\\mathcal{F}')
        \\\\to H^1(X, \\\\mathcal{F}) \\\\to H^1(X, \\\\mathcal{F}'') \\\\xrightarrow{\\\\delta^1}
        H^2(X, \\\\mathcal{F}') \\\\to \\\\dots$$\\n\\nTo show that computing cohomology
        in $\\\\mathfrak{Mod}(\\\\mathcal{O}_X)$ gives the exact same groups as in
        $\\\\mathfrak{Ab}(X)$, we introduce *flasque* (or *flabby*) sheaves.\\n\\n**Definition
        5.1.3.** A sheaf $\\\\mathcal{F}$ on $X$ is called *flasque* (or *flabby*)
        if for every inclusion of open subsets $V \\\\subseteq U \\\\subseteq X$,
        the restriction map $\\\\mathcal{F}(U) \\\\to \\\\mathcal{F}(V)$ is surjective.\\n\\nNotice
        that the skyscraper products $\\\\mathcal{I} = \\\\prod_{P \\\\in X} (i_P)_*(I_P)$
        constructed in Theorem 5.1.1 are obviously flasque, because $\\\\prod_{P \\\\in
        X} I_P \\\\to \\\\prod_{P \\\\in V} I_P$ is a projection onto a subproduct
        and hence surjective. In fact, every injective object in $\\\\mathfrak{Mod}(\\\\mathcal{O}_X)$
        (or $\\\\mathfrak{Ab}(X)$) is a direct summand of such a product, hence is
        flasque!\\n\\n**Proposition 5.1.4.**\\n1. *If $0 \\\\to \\\\mathcal{F}' \\\\to
        \\\\mathcal{F} \\\\to \\\\mathcal{F}'' \\\\to 0$ is an exact sequence of sheaves
        of abelian groups on $X$ and $\\\\mathcal{F}'$ is flasque, then for every
        open subset $U \\\\subseteq X$, the sequence of sections $0 \\\\to \\\\mathcal{F}'(U)
        \\\\to \\\\mathcal{F}(U) \\\\to \\\\mathcal{F}''(U) \\\\to 0$ is exact.*\\n2.
        *If $0 \\\\to \\\\mathcal{F}' \\\\to \\\\mathcal{F} \\\\to \\\\mathcal{F}''
        \\\\to 0$ is exact and both $\\\\mathcal{F}'$ and $\\\\mathcal{F}$ are flasque,
        then $\\\\mathcal{F}''$ is also flasque.*\\n3. *Every flasque sheaf $\\\\mathcal{F}$
        is acyclic for $\\\\Gamma(X, -)$, meaning $H^i(X, \\\\mathcal{F}) = 0$ for
        all $i \\\\ge 1$. Consequently, the cohomology groups $H^i(X, \\\\mathcal{F})$
        can be computed using any resolution of $\\\\mathcal{F}$ by flasque sheaves
        (and in particular, using injective resolutions in $\\\\mathfrak{Mod}(\\\\mathcal{O}_X)$).*\\n\\n*Proof.*
        (1) Fix an open set $U \\\\subseteq X$ and a section $t \\\\in \\\\mathcal{F}''(U)$.
        Consider the set $\\\\mathfrak{P}$ of pairs $(V, s)$ where $V \\\\subseteq
        U$ is open, $s \\\\in \\\\mathcal{F}(V)$, and $s$ maps to $t|_V \\\\in \\\\mathcal{F}''(V)$.
        Order $\\\\mathfrak{P}$ by $(V, s) \\\\le (V', s')$ if $V \\\\subseteq V'$
        and $s'|_V = s$. By Zorn's Lemma, $\\\\mathfrak{P}$ has a maximal element
        $(V, s)$. Suppose $V \\\\neq U$, and choose $P \\\\in U \\\\setminus V$. Since
        $\\\\mathcal{F} \\\\to \\\\mathcal{F}''$ is surjective as a morphism of sheaves,
        there exists an open neighborhood $W \\\\subseteq U$ of $P$ and a section
        $\\\\sigma \\\\in \\\\mathcal{F}(W)$ mapping to $t|_W$. On the overlap $V
        \\\\cap W$, the difference $s|_{V \\\\cap W} - \\\\sigma|_{V \\\\cap W}$ maps
        to $0$ in $\\\\mathcal{F}''(V \\\\cap W)$, so it belongs to $\\\\mathcal{F}'(V
        \\\\cap W)$. Since $\\\\mathcal{F}'$ is flasque, there exists a section $\\\\tau
        \\\\in \\\\mathcal{F}'(W)$ restricting to $s|_{V \\\\cap W} - \\\\sigma|_{V
        \\\\cap W}$ on $V \\\\cap W$. Replacing $\\\\sigma$ by $\\\\sigma + \\\\tau
        \\\\in \\\\mathcal{F}(W)$, we have $s|_{V \\\\cap W} = (\\\\sigma + \\\\tau)|_{V
        \\\\cap W}$, so $s$ and $\\\\sigma + \\\\tau$ glue to a section on $V \\\\cup
        W \\\\supsetneq V$ lifting $t|_{V \\\\cup W}$, contradicting maximality of
        $(V, s)$! Thus $V = U$, proving $\\\\mathcal{F}(U) \\\\to \\\\mathcal{F}''(U)$
        is surjective.\\n\\n(2) For $V \\\\subseteq U$, in the commutative diagram
        with surjective rows $\\\\mathcal{F}(U) \\\\twoheadrightarrow \\\\mathcal{F}''(U)$
        and $\\\\mathcal{F}(V) \\\\twoheadrightarrow \\\\mathcal{F}''(V)$ (by (1)),
        the left vertical map $\\\\mathcal{F}(U) \\\\twoheadrightarrow \\\\mathcal{F}(V)$
        is surjective since $\\\\mathcal{F}$ is flasque, forcing $\\\\mathcal{F}''(U)
        \\\\to \\\\mathcal{F}''(V)$ to be surjective.\\n\\n(3) Embed a flasque sheaf
        $\\\\mathcal{F}$ into an injective (hence flasque) sheaf $\\\\mathcal{I}^0$,
        with quotient $\\\\mathcal{Q}$. By (2), $\\\\mathcal{Q}$ is flasque. By (1),
        $0 \\\\to \\\\Gamma(X, \\\\mathcal{F}) \\\\to \\\\Gamma(X, \\\\mathcal{I}^0)
