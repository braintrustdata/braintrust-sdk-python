        be a separated scheme (or any scheme where intersections of open sets in the
        cover are affine), let $\\\\mathfrak{U} = \\\\{U_i\\\\}_{i \\\\in I}$ be an
        open cover of $X$ by affine open subschemes, and let $\\\\mathcal{F}$ be a
        quasi-coherent $\\\\mathcal{O}_X$-module. Then for every $p \\\\ge 0$, there
