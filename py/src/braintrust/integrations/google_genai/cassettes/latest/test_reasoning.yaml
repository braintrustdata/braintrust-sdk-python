        our sequence is made of terms in the format $n(n+1)$, there is a neat summation
        formula for it:\\n$$\\\\sum_{i=1}^{n} i(i+1) = \\\\frac{n(n+1)(n+2)}{3}$$\\n\\nLet's
        plug $n = 10$ into this formula:\\n* $\\\\frac{10 \\\\times (10 + 1) \\\\times
