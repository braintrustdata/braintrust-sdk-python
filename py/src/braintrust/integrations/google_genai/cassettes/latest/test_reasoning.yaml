        4 = 12$\\n   * 4th term ($n=4$): $4 \\\\times 5 = 20$\\n   * 5th term ($n=5$):
        $5 \\\\times 6 = 30$\\n\\n---\\n\\n### Formula for the $n$-th Term\\n\\nBased
