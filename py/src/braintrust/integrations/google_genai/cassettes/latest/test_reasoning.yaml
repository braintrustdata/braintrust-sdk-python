        I'll substitute $n = 10$ into the formula:  $10 \\\\times (10 + 1) = 10 \\\\times
        11 = 110$.  Easy, and I actually validated this already, so it's consistent.\\n\\nNow
        for the sum of the first 10 terms, $\\\\sum_{n=1}^{10} (n^2 + n)$. I'm going
        to demonstrate this with a couple of techniques, so the user has the best
        learning experience.\\n\\n*   **Method 1: Direct Addition** I could write
        out all the terms and add them. The first few are: 2, 6, 12, 20, 30, 42, 56,
        72, 90, 110. Adding them up: 2+6+12+20+30+42+56+72+90+110, the calculation
        shows this sum to be 440.\\n\\n*   **Method 2: Summation Formulas** I can
        use the summation formulas for the sum of squares and the sum of linear terms.
        \ $\\\\sum_{n=1}^{N} (n^2 + n) = \\\\sum_{n=1}^{N} n^2 + \\\\sum_{n=1}^{N}
        n$. I'll use those formulas. For $N = 10$:  Sum of squares is $\\\\frac{10(10+1)(2(10)+1)}{6}
        = \\\\frac{10 \\\\times 11 \\\\times 21}{6} = 385$. And sum of linear terms
        is $\\\\frac{10(11)}{2} = \\\\frac{110}{2} = 55$. The total is $385 + 55 =
        440$. This also matches.\\n\\n*   **Method 3: A Combinatorial Formula.** I
        also remember a neat identity for this type of sum: $\\\\sum_{k=1}^{n} k(k+1)
        = \\\\frac{n(n+1)(n+2)}{3}$.  Let's check this quickly. For $n=3$, this formula
        gives $\\\\frac{3(4)(5)}{3} = 20$.  And the sum of the first three terms (2
        + 6 + 12) is indeed 20.  So this checks out. For $n=10$, it's  $\\\\frac{10(11)(12)}{3}$.
        I see the 12 can be divided by the 3 so the result is $10 \\\\times 11 \\\\times
        4 = 440$. Perfect! The user will be impressed with this shortcut.\\n\\nSo,
