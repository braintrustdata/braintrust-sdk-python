        get:\\n\\n*   $\\\\sum_{i=1}^{10} i^2 = \\\\frac{10(10+1)(2(10)+1)}{6} = \\\\frac{10
        \\\\times 11 \\\\times 21}{6}$. Let's simplify that: $10 \\\\times 11 = 110$
        and $110 \\\\times 21 = 2310$, and then $2310 / 6 = 385$. Or I could simplify
        the fraction first: $21/6=7/2$ and $10/2=5$, so $5 \\\\times 11 \\\\times
        7 = 55 \\\\times 7 = 385$. Yep, 385.\\n*   $\\\\sum_{i=1}^{10} i = \\\\frac{10(10+1)}{2}
        = \\\\frac{10 \\\\times 11}{2} = \\\\frac{110}{2} = 55$.\\n\\nNow, I just
        add them together:  $S_{10} = 385 + 55 = 440$.\\n\\nI'm always keen to check.
        I can verify this sum directly by listing and adding the terms: 2, 6, 12,
