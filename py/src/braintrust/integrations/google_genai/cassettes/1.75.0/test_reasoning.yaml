        n = \\\\frac{n(n + 1)}{2}$\\n\\n**Step A: Calculate the sum of the squares
        ($\\\\sum n^2$ for $n=10$)**\\n*   $\\\\frac{10(10 + 1)(2(10) + 1)}{6}$\\n*
        \  $= \\\\frac{10 \\\\times 11 \\\\times 21}{6}$\\n*   $= \\\\frac{2,310}{6}$\\n*
        \  $= \\\\mathbf{385}$\\n\\n**Step B: Calculate the sum of the linear numbers
