        $a_{10} = 10(10+1) = 10 \\\\times 11 = 110$. I can do a quick mental check
        using the alternative form: $10^2 + 10 = 100 + 10 = 110$. Yep, it's consistent.\\n\\n**Finding
        the Sum of the First 10 Terms:** Now for the summation. We're looking at $S_{10}
        = \\\\sum_{n=1}^{10} (n^2 + n)$. I could use the standard summation formulas
        for $\\\\sum n^2$ and $\\\\sum n$ and combine them, but before I do that,
        let's try a different approach. Remember the identity for the sum of the pronic
        numbers, i.e., numbers of the form $k(k+1)$? I *think* it's $\\\\sum_{k=1}^n
        k(k+1) = \\\\frac{n(n+1)(n+2)}{3}$. Let me quickly verify this.\\n\\nOkay,
        let's test it:\\n\\n*   For n=1: 1(2) = 2. The formula gives (1)(2)(3)/3 =
        2. Correct.\\n*   For n=2: 1(2) + 2(3) = 2+6 = 8. The formula gives (2)(3)(4)/3
        = 8. Correct.\\n*   For n=3: 8 + 3(4) = 20. The formula gives (3)(4)(5)/3
        = 20. Correct.\\n\\nExcellent. It works! So the sum of the first *n* terms
        of the sequence $n(n+1)$ is given by $S_n = \\\\frac{n(n+1)(n+2)}{3}$. Now
        I just plug in $n=10$: $S_{10} = \\\\frac{10(10+1)(10+2)}{3} = \\\\frac{10
        \\\\times 11 \\\\times 12}{3}$. Simplifying, 12 divided by 3 is 4, so $S_{10}
        = 10 \\\\times 11 \\\\times 4 = 440$.\\n\\n**Double-Checking the Sum (using
