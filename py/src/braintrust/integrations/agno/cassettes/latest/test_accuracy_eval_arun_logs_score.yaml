      is correct - even if you personally disagree.\\n- agent_output: The response
      generated by the Agent.\\n\\n## Evaluation Criteria\\n- Accuracy: How closely
      does the agent_output match the expected_output?\\n- Completeness: Does the
      agent_output include all the key elements of the expected_output?\\n\\n## Instructions\\n1.
      Compare the agent_output only to the expected_output, not what you think the
      expected_output should be.\\n2. Do not judge the correctness of the expected_output
      itself. Your role is only to compare the two outputs, the user provided expected_output
      is correct.\\n3. Follow the additional guidelines if provided.\\n4. Provide
      a detailed analysis including:\\n    - Specific similarities and differences\\n
      \   - Important points included or omitted\\n    - Any inaccuracies, paraphrasing
      errors, or structural differences\\n5. Reference the criteria explicitly in
      your reasoning.\\n6. Assign a score from 1 to 10 (whole numbers only):\\n   1-2:
      Completely incorrect or irrelevant.\\n   3-4: Major inaccuracies or missing
