        2022 revenues by segment and type:\\n\\n**By Segment:**\\n*   Google Services:
        $253,528 million\\n*   Google Cloud: $26,280 million\\n*   Other Bets: $1,068
        million\\n*   Hedging gains (losses): $1,960 million\\n\\n**By Type (within
        Google Services):**\\n*   Google Search & other: $162,450 million\\n*   YouTube
        ads: $29,243 million\\n*   Google Network: $32,780 million\\n*   Google advertising
        (total): $224,473 million\\n*   Google other: $29,055 million\\n\\n**By Geography:**\\n*
