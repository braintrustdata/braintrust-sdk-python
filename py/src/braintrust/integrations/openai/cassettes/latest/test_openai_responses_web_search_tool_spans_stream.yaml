        response.output_text.delta\ndata: {\"type\":\"response.output_text.delta\",\"content_index\":0,\"delta\":\"##
        Weather for Paris, Paris, France:\\nCurrent Conditions: Partly sunny, 80\xB0F
        (26\xB0C)\\n\\nDaily Forecast:\\n* Monday, June 29: Low: 59\xB0F (15\xB0C),
        High: 83\xB0F (28\xB0C), Description: Times of clouds and sun, very warm and
        less humid\\n* Tuesday, June 30: Low: 60\xB0F (16\xB0C), High: 82\xB0F (28\xB0C),
        Description: Very warm with sunny spells\\n* Wednesday, July 1: Low: 59\xB0F
        (15\xB0C), High: 80\xB0F (27\xB0C), Description: Mostly cloudy and warm\\n*
        Thursday, July 2: Low: 60\xB0F (15\xB0C), High: 81\xB0F (27\xB0C), Description:
        Turning cloudy and remaining warm\\n* Friday, July 3: Low: 59\xB0F (15\xB0C),
        High: 85\xB0F (29\xB0C), Description: Sunny and very warm\\n* Saturday, July
        4: Low: 61\xB0F (16\xB0C), High: 85\xB0F (30\xB0C), Description: Very warm
        with plenty of sunshine\\n* Sunday, July 5: Low: 64\xB0F (18\xB0C), High:
        87\xB0F (31\xB0C), Description: Very warm with plenty of sun\\n\\nSevere Weather
        Alerts:\\n* Paris: Orange Warning for Extreme High Temperature in effect until
        Tuesday, 12:00 AM CEST.  Source: M\xE9t\xE9o-France, Severe high-temperature
        warning\\n\\nEveryone is in danger, even those in good health. Danger is greater
        for elderly people, people suffering from chronicle diseases or from mental
        health troubles, people who regularly take medicine or people who are isolated.
        Watch for dehydration and heatstroke, especially in sportsmen and people working
        outside. Pay attention to children. Heatstroke symptoms are : a fever above
        40\xB0, hot, red and dry skin, headaches, nausea, drowsiness, intense thirst,
        confusion, convulsions and loss of consciousness.\\n\\nDrink water several
        times a day. Continue to eat normally. Wet your body several times a day using
        a spray, a washcloth or by taking warm showers or baths. Do not go out during
        the hottest hours (11am-9pm). If you must go out, wear a hat and light clothing.
        Try to go to a cool or air-conditioned place for two to three hours a day,
        whilst continuing to respect physical distance and barrier gestures. Limit
        your physical and sports activities. During the day, close shutters, curtains
        and windows. Ventilate at night. If you have elderly, chronically ill or isolated
