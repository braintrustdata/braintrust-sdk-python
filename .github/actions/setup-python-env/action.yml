name: "Setup Python environment"
description: "Checkout, configure mise, and install dev dependencies for a given Python version"

inputs:
  python-version:
    description: "Python version to install (e.g. 3.12). Defaults to the .tool-versions pin."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install Python build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes libbz2-dev liblzma-dev libreadline-dev
    - name: Set up mise
      uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      with:
        cache: true
        experimental: true
        install_args: ${{ inputs.python-version && format('python@{0}', inputs.python-version) || '' }}
    - name: Install dependencies
      shell: bash
      run: |
        mise exec ${{ inputs.python-version && format('python@{0}', inputs.python-version) || '' }} -- make -C py install-dev
