name: "Setup Python environment"
description: "Checkout, configure mise, and install dev dependencies for a given Python version"

inputs:
  python-version:
    description: "Python version to install (e.g. 3.12)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install Python build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes libbz2-dev liblzma-dev libreadline-dev
    - name: Set up mise
      uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      with:
        cache: true
        experimental: true
        install_args: python@${{ inputs.python-version }}
    - name: Install dependencies
      shell: bash
      run: |
        mise exec python@${{ inputs.python-version }} -- make -C py install-dev
