name: py

on:
  pull_request:
    paths:
      - "py/**"
      - "integrations/langchain-py/**"
      - "integrations/adk-py/**"
      - ".github/workflows/py.yaml"
      - ".github/workflows/py-build-test.yaml"
      - ".github/workflows/py-upload-wheel.yaml"
      - ".github/workflows/adk-py-test.yaml"
      - ".github/workflows/langchain-py-test.yaml"
  push:
    branches: [main]

jobs:
  build:
    # Skip on fork PRs — secrets are unavailable. See py-fork.yaml instead.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/py-build-test.yaml
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1]
    with:
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}
      shard: ${{ matrix.shard }}
    secrets: inherit

  adk-py:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/adk-py-test.yaml
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]
    with:
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}
    secrets: inherit

  langchain-py:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/langchain-py-test.yaml
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]
    with:
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}
    secrets: inherit

  upload-wheel:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    uses: ./.github/workflows/py-upload-wheel.yaml
