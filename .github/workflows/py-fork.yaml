# Label-gated CI for fork PRs.
#
# Fork PRs cannot access repository secrets via the `pull_request` event, so
# the regular `py.yaml` workflow fails for external contributions. This workflow
# uses `pull_request_target` which grants secrets access because it runs the
# workflow definition from the *base* branch (trusted), not the fork.
#
# A maintainer must add the `safe-to-run-ci` label after reviewing the PR code.
# New pushes do NOT automatically re-trigger this workflow — a maintainer must
# remove and re-add the label after reviewing the new changes.
name: "py (fork)"

on:
  pull_request_target:
    types: [labeled]
    paths:
      - "py/**"
      - "integrations/langchain-py/**"
      - "integrations/adk-py/**"
      - ".github/workflows/py.yaml"
      - ".github/workflows/py-fork.yaml"
      - ".github/workflows/adk-py-test.yaml"
      - ".github/workflows/langchain-py-test.yaml"

jobs:
  build:
    # Only run for fork PRs that a maintainer has labeled `safe-to-run-ci`.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'safe-to-run-ci')
      && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1]

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          cd py && make install-dev
      - name: Test whether the Python SDK can be installed
        run: |
          python -m uv pip install -e ./py[all]
      - name: Test whether the Python SDK can be imported
        run: |
          python -c 'import braintrust'
      - name: Run nox tests (shard ${{ matrix.shard }}/2)
        shell: bash
        run: |
          cd py && ./scripts/nox-matrix.sh ${{ matrix.shard }} 2

  adk-py:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'safe-to-run-ci')
      && github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/adk-py-test.yaml
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]
    with:
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  langchain-py:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'safe-to-run-ci')
      && github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/langchain-py-test.yaml
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]
    with:
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  upload-wheel:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies and build wheel
        run: |
          cd py && make install-build-deps && make build
      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: py/dist/*.whl
          retention-days: 5
