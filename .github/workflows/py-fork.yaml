# Label-gated CI for fork PRs.
#
# Fork PRs cannot access repository secrets via the `pull_request` event, so
# the regular `py.yaml` workflow fails for external contributions. This workflow
# uses `pull_request_target` which grants secrets access because it runs the
# workflow definition from the *base* branch (trusted), not the fork.
#
# A maintainer must add the `safe-to-run-ci` label after reviewing the PR code.
# New pushes do NOT automatically re-trigger this workflow — a maintainer must
# remove and re-add the label after reviewing the new changes.
name: "py (fork)"

on:
  pull_request_target:
    types: [labeled]
    paths:
      - "py/**"
      - "integrations/langchain-py/**"
      - "integrations/adk-py/**"
      - ".github/workflows/py-fork.yaml"
      - ".github/workflows/py-build-test.yaml"
      - ".github/workflows/py-upload-wheel.yaml"
      - ".github/workflows/adk-py-test.yaml"
      - ".github/workflows/langchain-py-test.yaml"

jobs:
  build:
    # Only run for fork PRs that a maintainer has labeled `safe-to-run-ci`.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'safe-to-run-ci')
      && github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/py-build-test.yaml
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1]
    with:
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}
      shard: ${{ matrix.shard }}
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  adk-py:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'safe-to-run-ci')
      && github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/adk-py-test.yaml
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]
    with:
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  langchain-py:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'safe-to-run-ci')
      && github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/langchain-py-test.yaml
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]
    with:
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  upload-wheel:
    needs: build
    uses: ./.github/workflows/py-upload-wheel.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
